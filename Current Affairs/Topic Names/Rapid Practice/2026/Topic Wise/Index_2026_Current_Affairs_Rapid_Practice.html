S World University Rankings 2027?","hi":"QS वर्ल्ड यूनिवर्सिटी रैंकिंग 2027 में भारतीय संस्थानों में कौन शीर्ष पर रहा?"},"o":[{"en":"IIT Bombay","hi":"आईआईटी बॉम्बे"},{"en":"IIT Madras","hi":"आईआईटी मद्रास"},{"en":"IIT Delhi","hi":"आईआईटी दिल्ली"},{"en":"IISc Bengaluru","hi":"आईआईएससी बेंगलुरु"}],"a":{"en":"IIT Delhi","hi":"आईआईटी दिल्ली"},"exp":{"hi":"आईआईटी दिल्ली वैश्विक रैंक 118 के साथ भारतीय संस्थानों में शीर्ष पर रहा; आईआईटी बॉम्बे की रैंक 134 थी। वैश्विक स्तर पर अमेरिका का MIT शीर्ष पर रहा। 2027 रैंकिंग में 52 भारतीय विश्वविद्यालय शामिल रहे।","en":"IIT Delhi led Indian institutions at global rank 118; IIT Bombay was ranked 134. MIT, USA, topped globally. A total of 52 Indian universities featured in the 2027 rankings."}},{"q":{"en":"What Is The Rank Of India In The QS World Future Skills Index 2027?","hi":"QS वर्ल्ड फ्यूचर स्किल्स इंडेक्स 2027 में भारत की रैंक क्या है?"},"o":[{"en":"11th","hi":"11वां"},{"en":"13th","hi":"13वां"},{"en":"15th","hi":"15वां"},{"en":"18th","hi":"18वां"}],"a":{"en":"13th","hi":"13वां"},"exp":{"hi":"QS वर्ल्ड फ्यूचर स्किल्स इंडेक्स 2027 में भारत 89.4 स्कोर के साथ समग्र रूप से 13वें स्थान पर रहा। शीर्ष तीन अर्थव्यवस्थाएँ अमेरिका, ऑस्ट्रेलिया एवं यूनाइटेड किंगडम रहीं।","en":"India ranked 13th overall with a score of 89.4 in the QS World Future Skills Index 2027. The top three economies were the United States, Australia and the United Kingdom."}},{"q":{"en":"Which City Became Only Indian City In The 2026 Work From Anywhere Index?","hi":"2026 वर्क फ्रॉम एनीवेयर इंडेक्स में शामिल एकमात्र भारतीय शहर कौन था?"},"o":[{"en":"New Delhi","hi":"नई दिल्ली"},{"en":"Bengaluru","hi":"बेंगलुरु"},{"en":"Hyderabad","hi":"हैदराबाद"},{"en":"Mumbai","hi":"मुंबई"}],"a":{"en":"Mumbai","hi":"मुंबई"},"exp":{"hi":"इंटरनेशनल वर्कप्लेस ग्रुप (IWG) के वर्क फ्रॉम एनीवेयर इंडेक्स 2026 में मुंबई एकमात्र भारतीय शहर था; इसकी रैंक 50 एवं स्कोर 77 था। बैंकॉक शीर्ष पर रहा, उसके बाद टोक्यो एवं बार्सिलोना। सूचकांक में कनेक्टिविटी, आवास, परिवहन, भोजन एवं जलवायु जैसे मानक शामिल हैं।","en":"Mumbai was the only Indian city in the International Workplace Group (IWG) Work From Anywhere Index 2026, ranked 50th with a score of 77. Bangkok topped, followed by Tokyo and Barcelona. The index considers connectivity, accommodation, transport, food and climate."}},{"q":{"en":"What Is The Rank Of India In The Market Distortions Performance Index In 2023?","hi":"2023 के लिए मार्केट डिस्टॉर्शन्स परफॉर्मेंस इंडेक्स में भारत की रैंक क्या थी?"},"o":[{"en":"47th","hi":"47वां"},{"en":"57th","hi":"57वां"},{"en":"67th","hi":"67वां"},{"en":"77th","hi":"77वां"}],"a":{"en":"57th","hi":"57वां"},"exp":{"hi":"2026 में जारी कम्पीटेरे फाउंडेशन रिपोर्ट के अनुसार भारत 2010 के 82वें स्थान से 2023 में 57वें स्थान पर पहुँचा। यह सूचकांक संपत्ति अधिकार संरक्षण, घरेलू प्रतिस्पर्धा एवं अंतरराष्ट्रीय प्रतिस्पर्धा का आकलन करता है।","en":"India rose from 82nd in 2010 to 57th in 2023, according to the Competere Foundation report released in 2026. The index assesses property rights protection, domestic competition and international competition."}},{"q":{"en":"What Is The Rank Of India In The Global Peace Index 2026?","hi":"ग्लोबल पीस इंडेक्स 2026 में भारत की रैंक क्या है?"},"o":[{"en":"115th","hi":"115वां"},{"en":"120th","hi":"120वां"},{"en":"127th","hi":"127वां"},{"en":"134th","hi":"134वां"}],"a":{"en":"127th","hi":"127वां"},"exp":{"hi":"इंस्टीट्यूट फॉर इकोनॉमिक्स एंड पीस (IEP) के ग्लोबल पीस इंडेक्स 2026 में भारत 127वें स्थान पर रहा; 2025 में इसकी रैंक 115 थी। आइसलैंड, न्यूजीलैंड एवं स्विट्जरलैंड शीर्ष तीन रहे; सूचकांक सुरक्षा, संघर्ष एवं सैन्यीकरण का आकलन करता है।","en":"India ranked 127th in the Institute for Economics and Peace (IEP) Global Peace Index 2026, compared with 115th in 2025. Iceland, New Zealand and Switzerland were the top three; the index covers safety, conflict and militarisation."}}]</script><script>const TITLE_EN='Index 2026 Rapid Practice',SOURCE_KEY='INDEX2026_PROPER_BILINGUAL.html',STORE='efp_ca_topic_index_2026_rapid_v1',MAIN_COUNT=66,BASE_MAIN_COUNT=58,TARGET_DRILLS=226,TOTAL_COUNT=292;
const DEV_RE=/[\u0900-\u097F]/g;
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
const stripQno=s=>s.trim().replace(/^Q\s*\d+\s*[.\-:]?\s*/i,'');
function devCount(s){return (s.match(DEV_RE)||[]).length}
function splitQuestion(q){q=clean(q);let parts=[],start=0;for(let i=0;i<q.length;i++){if(q[i]==='?'){parts.push(q.slice(start,i+1).trim());start=i+1}}let tail=q.slice(start).trim();if(tail)parts.push(tail);parts=parts.filter(Boolean).map(stripQno);if(parts.length>=2){let first=parts.slice(0,2);let hi=devCount(first[0])>=devCount(first[1])?first[0]:first[1];let en=hi===first[0]?first[1]:first[0];for(const p of parts){if(devCount(p)<2 && (p.match(/[A-Za-z]/g)||[]).length>=8){en=p;break}}for(const p of parts){if(devCount(p)>=4){hi=p;break}}return [clean(en),clean(hi)]}if(devCount(q)>=4)return [q.replace(/[\u0900-\u097F]+/g,'').trim()||q,q];return[q,q]}
function marks(pre){let re=/(^|[^A-Za-z0-9])([A-D])[).]\s*/g,m=[],x;while((x=re.exec(pre))){m.push({label:x[2],start:x.index+(x[1]?x[1].length:0),end:re.lastIndex});}const target='AABBCCDD';for(let i=0;i<=m.length-8;i++){if(m.slice(i,i+8).map(z=>z.label).join('')===target)return m.slice(i,i+8)}return null}
function parseMain(e){let x=clean(e.x),pre=x,rest='';if(x.includes('📝 स्पष्टीकरण (Hindi)'))[pre,rest]=x.split('📝 स्पष्टीकरण (Hindi)',2);let hiExp=rest,enExp='';if(rest.includes('📝 Explanation (English)'))[hiExp,enExp]=rest.split('📝 Explanation (English)',2);let w=marks(pre);if(!w)return null;let [enq,hiq]=splitQuestion(pre.slice(0,w[0].start).trim()),opts=[],correct=null;for(let j=0;j<4;j++){let me=w[2*j],mh=w[2*j+1],end=j<3?w[2*j+2].start:pre.length,en=clean(pre.slice(me.end,mh.start)),hi=clean(pre.slice(mh.end,end));let marker=/सही उत्तर|Correct Answer|✔/.test(en+' '+hi);for(const mk of ['(सही उत्तर ✔)','(सही उत्तर)','(Correct Answer ✔)','(Correct Answer)','✔']){en=en.split(mk).join('');hi=hi.split(mk).join('')}en=clean(en);hi=clean(hi);if(marker)correct=j;opts.push({en,hi})}if(correct===null)return null;let a={...opts[correct]};return{q:{en:enq,hi:hiq},o:opts,a,exp:{en:'Answer: '+a.en+'.',hi:'उत्तर: '+a.hi+'।'},_hi_exp:clean(hiExp),_en_exp:clean(enExp),_stem_en:enq,_stem_hi:hiq}}
function allColon(text,lang){text=String(text||'');let out=[],re=/:\s*/g,m,punct=lang==='hi'?'.!?।':'.!?';while((m=re.exec(text))){let prev=-1;for(const ch of punct)prev=Math.max(prev,text.lastIndexOf(ch,m.index));let lab=clean(text.slice(prev+1,m.index));if(lab.length>110)lab=lab.split(/[,;]/).pop().trim();let ends=[];for(const ch of punct){let k=text.indexOf(ch,re.lastIndex);if(k>=0)ends.push(k)}let nxt=ends.length?Math.min(...ends):text.length,val=clean(text.slice(re.lastIndex,nxt)).replace(/^[ .।]+|[ .।]+$/g,'');if(lab.length>=1&&lab.length<=110&&val)out.push([lab,val])}return out}
function derive(mains,target){let c=[];mains.forEach((m,mi)=>{let en=allColon(m._en_exp,'en'),hi=allColon(m._hi_exp,'hi');en.forEach(([lab,val],k)=>{if(lab.toLowerCase()==='note')return;let h=hi[k]||[lab,val];c.push({mi,label_en:lab,value_en:val,label_hi:h[0],value_hi:h[1]})})});let seen=new Set();c=c.filter(x=>{let k=x.mi+'|'+x.label_en.toLowerCase()+'|'+x.value_en.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});if(c.length>target){let scored=c.map((x,i)=>{let score=0;if(['note','answer','correct answer'].includes(x.label_en.toLowerCase()))score-=10;let wc=x.value_en.split(/\s+/).length;if(wc>=2&&wc<=35)score+=3;if(x.label_en.split(/\s+/).length<=10)score+=2;if(x.value_en.toLowerCase().startsWith('the source document'))score-=10;return{score,i}}).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,target);let keep=new Set(scored.map(x=>x.i));c=c.filter((_,i)=>keep.has(i));}else if(c.length<target){let need=target-c.length,extras=[];mains.forEach((m,mi)=>{let en=m._en_exp.split(/(?<=[.!?])\s+/).map(clean).filter(Boolean),hi=m._hi_exp.split(/(?<=[।.!?])\s+/).map(clean).filter(Boolean);en.forEach((sent,si)=>{let wc=sent.split(/\s+/).length;if(sent.includes(':')||wc<4||wc>32)return;extras.push({mi,label_en:'Related Fact',value_en:sent.replace(/[ .]+$/,''),label_hi:'संबंधित तथ्य',value_hi:(hi[si]||sent).replace(/[ ।.]+$/,'')})})});c.push(...extras.slice(0,need));}while(c.length<target){let b={...(c[c.length%c.length]||{mi:0,label_en:'Key Fact',value_en:'See source explanation',label_hi:'मुख्य तथ्य',value_hi:'स्रोत व्याख्या देखें'})};b.label_en+=' Detail';b.label_hi+=' विवरण';c.push(b)}return c.slice(0,target)}
function makeSections(mains,drills){const sections=[];for(let i=0;i<mains.length;i+=30){let ch=mains.slice(i,i+30).map(m=>({q:m.q,o:m.o,a:m.a,exp:m.exp})),a=i+1,b=i+ch.length;sections.push({title:{en:`Main MCQs Q${a}–Q${b}`,hi:`मुख्य MCQ Q${a}–Q${b}`},questions:ch})}const pool=drills.map(d=>({en:d.value_en,hi:d.value_hi})),dq=[];drills.forEach((d,i)=>{const m=mains[d.mi],ans={en:d.value_en,hi:d.value_hi},cand=[];for(let k=1;k<pool.length&&cand.length<3;k++){const p=pool[(i+k*7)%pool.length];if(p.en.toLowerCase()!==ans.en.toLowerCase()&&!cand.some(x=>x.en.toLowerCase()===p.en.toLowerCase()))cand.push(p)}for(const mm of mains){if(cand.length>=3)break;const p=mm.a;if(p.en.toLowerCase()!==ans.en.toLowerCase()&&!cand.some(x=>x.en.toLowerCase()===p.en.toLowerCase()))cand.push(p)}let opts=[ans,...cand.slice(0,3)],r=i%4;opts=opts.slice(r).concat(opts.slice(0,r));dq.push({q:{en:`Regarding “${m._stem_en}”, which fact correctly gives “${d.label_en}”?`,hi:`“${m._stem_hi}” के संदर्भ में “${d.label_hi}” के लिए सही तथ्य कौन-सा है?`},o:opts,a:ans,exp:{en:`${d.label_en}: ${d.value_en}.`,hi:`${d.label_hi}: ${d.value_hi}।`}})});for(let i=0;i<dq.length;i+=30){let ch=dq.slice(i,i+30),n=i/30+1,a=i+1,b=i+ch.length;sections.push({title:{en:`Explanation Drill ${n}: Facts ${a}–${b}`,hi:`स्पष्टीकरण अभ्यास ${n}: तथ्य ${a}–${b}`},questions:ch})}return sections}
let SECTIONS=[],TOTAL_QUESTIONS=0,saved={answers:{},bookmarks:{},section:0,dark:false},current=0,onlyBookmarks=false;try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}
function save(){saved.section=current;localStorage.setItem(STORE,JSON.stringify(saved))}function globalQNumber(si,qi){let n=qi+1;for(let i=0;i<si;i++)n+=SECTIONS[i].questions.length;return n}function qid(si,qi){return si+'-'+qi}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function correctIndex(q){return q.o.findIndex(o=>o.en===q.a.en)}function stats(){let attempted=0,correct=0,total=0;SECTIONS.forEach((s,si)=>s.questions.forEach((q,qi)=>{total++;let a=saved.answers[qid(si,qi)];if(a!==undefined){attempted++;if(a===correctIndex(q))correct++}}));return{attempted,correct,total}}function updateTop(){const x=stats(),p=x.total?Math.round(x.attempted*100/x.total):0;const score=document.getElementById('scoreTxt');if(score){score.dataset.efNativeScore='1';score.classList.add('ef-native-score');score.setAttribute('aria-label','Quiz score: '+x.attempted+' of '+x.total+' attempted, '+x.correct+' correct, '+(x.attempted-x.correct)+' wrong');score.innerHTML='<span class="ef-native-score-chip ef-native-score-total">Total <strong>'+x.attempted+'/'+x.total+'</strong></span><span class="ef-native-score-chip ef-native-score-correct">Correct <strong>'+x.correct+'</strong></span><span class="ef-native-score-chip ef-native-score-wrong">Wrong <strong>'+(x.attempted-x.correct)+'</strong></span>';}document.getElementById('pct').textContent=p+'%';document.getElementById('progFill').style.width=p+'%';renderNav();}
function renderNav(){sectionNav.innerHTML=SECTIONS.map((s,i)=>{const done=s.questions.every((q,qi)=>saved.answers[qid(i,qi)]!==undefined);return `<button class="pill ${i===current?'active':done?'done':''}" onclick="openSection(${i})" title="${escapeHtml(s.title.en)}">${done?'✓':i+1}</button>`}).join('')}function renderQuestions(){const s=SECTIONS[current];if(!s)return;secNo.textContent=`Section ${current+1} of ${SECTIONS.length} · ${s.questions.length} questions`;secTitle.textContent=s.title.en;secTitleHi.textContent=s.title.hi;const term=search.value.trim().toLowerCase();let htmls=[];s.questions.forEach((q,qi)=>{const id=qid(current,qi),book=!!saved.bookmarks[id];if(onlyBookmarks&&!book)return;const hay=(q.q.en+' '+q.q.hi+' '+q.a.en+' '+q.a.hi).toLowerCase();if(term&&!hay.includes(term))return;const picked=saved.answers[id],ci=correctIndex(q);let opts=q.o.map((o,oi)=>{let cl='opt';if(picked!==undefined){if(oi===ci)cl+=' correct';else if(oi===picked)cl+=' wrong'}return `<button class="${cl}" onclick="pick(${qi},${oi})" ${picked!==undefined?'disabled':''}><span>${escapeHtml(o.en)}</span><small>${escapeHtml(o.hi)}</small></button>`}).join('');htmls.push(`<article class="qcard" id="rp-${current}-${qi}"><button class="book ${book?'on':''}" onclick="bookmark(${qi})">${book?'★':'☆'}</button><div class="qnum">Q${globalQNumber(current,qi)} <span class="qtotal">/ ${TOTAL_QUESTIONS}</span></div><p class="qen">${escapeHtml(q.q.en)}</p><p class="qhi">${escapeHtml(q.q.hi)}</p><div class="opts">${opts}</div><div class="exp ${picked!==undefined?'show':''}"><div>${window.EFP_CA_EXPLANATIONS.render(q,"en")}</div><div class="hi">${window.EFP_CA_EXPLANATIONS.render(q,"hi")}</div></div></article>`)});questions.innerHTML=htmls.join('')||'<div class="empty">No matching questions / कोई matching प्रश्न नहीं मिला</div>';updateTop()}function pick(qi,oi){const id=qid(current,qi);if(saved.answers[id]!==undefined)return;saved.answers[id]=oi;save();renderQuestions()}function bookmark(qi){const id=qid(current,qi);saved.bookmarks[id]=!saved.bookmarks[id];if(!saved.bookmarks[id])delete saved.bookmarks[id];save();renderQuestions()}function toggleBookmarkFilter(){onlyBookmarks=!onlyBookmarks;bookmarkFilter.classList.toggle('primary',onlyBookmarks);renderQuestions()}function openSection(i){current=Math.max(0,Math.min(SECTIONS.length-1,i));search.value='';save();renderQuestions();window.scrollTo({top:310,behavior:'smooth'})}function moveSection(d){openSection(current+d)}function resetAll(){if(!confirm('Reset quiz progress? Your bookmarks will stay saved.'))return;if(window.EFP_QUIZ_CONTINUITY)window.EFP_QUIZ_CONTINUITY.clear();saved.answers={};saved.section=0;current=0;save();if(window.EFP_QUIZ_PROGRESS_WARNING)window.EFP_QUIZ_PROGRESS_WARNING.disarm();renderQuestions()}function toggleDark(){saved.dark=!saved.dark;applyDark();save()}function applyDark(){document.body.classList.toggle('dark',!!saved.dark);darkBtn.textContent=saved.dark?'Light':'Dark'}
function boot(){SECTIONS=JSON.parse(document.getElementById('master-data').textContent);TOTAL_QUESTIONS=SECTIONS.reduce((n,s)=>n+s.questions.length,0);current=Math.max(0,Math.min(SECTIONS.length-1,saved.section||0));applyDark();renderQuestions()}boot();
