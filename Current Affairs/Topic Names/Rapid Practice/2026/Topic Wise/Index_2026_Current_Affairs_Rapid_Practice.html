const DEV_RE=/[\u0900-\u097F]/g;

const stripQno=s=>s.trim().replace(/^Q\s*\d+\s*[.\-:]?\s*/i,'');
function devCount(s){return (s.match(DEV_RE)||[]).length}
function splitQuestion(q){q=clean(q);let parts=[],start=0;for(let i=0;i<q.length;i++){if(q[i]==='?'){parts.push(q.slice(start,i+1).trim());start=i+1}}let tail=q.slice(start).trim();if(tail)parts.push(tail);parts=parts.filter(Boolean).map(stripQno);if(parts.length>=2){let first=parts.slice(0,2);let hi=devCount(first[0])>=devCount(first[1])?first[0]:first[1];let en=hi===first[0]?first[1]:first[0];for(const p of parts){if(devCount(p)<2 && (p.match(/[A-Za-z]/g)||[]).length>=8){en=p;break}}for(const p of parts){if(devCount(p)>=4){hi=p;break}}return [clean(en),clean(hi)]}if(devCount(q)>=4)return [q.replace(/[\u0900-\u097F]+/g,'').trim()||q,q];return[q,q]}
function marks(pre){let re=/(^|[^A-Za-z0-9])([A-D])[).]\s*/g,m=[],x;while((x=re.exec(pre))){m.push({label:x[2],start:x.index+(x[1]?x[1].length:0),end:re.lastIndex});}const target='AABBCCDD';for(let i=0;i<=m.length-8;i++){if(m.slice(i,i+8).map(z=>z.label).join('')===target)return m.slice(i,i+8)}return null}
function parseMain(e){let x=clean(e.x),pre=x,rest='';if(x.includes('📝 स्पष्टीकरण (Hindi)'))[pre,rest]=x.split('📝 स्पष्टीकरण (Hindi)',2);let hiExp=rest,enExp='';if(rest.includes('📝 Explanation (English)'))[hiExp,enExp]=rest.split('📝 Explanation (English)',2);let w=marks(pre);if(!w)return null;let [enq,hiq]=splitQuestion(pre.slice(0,w[0].start).trim()),opts=[],correct=null;for(let j=0;j<4;j++){let me=w[2*j],mh=w[2*j+1],end=j<3?w[2*j+2].start:pre.length,en=clean(pre.slice(me.end,mh.start)),hi=clean(pre.slice(mh.end,end));let marker=/सही उत्तर|Correct Answer|✔/.test(en+' '+hi);for(const mk of ['(सही उत्तर ✔)','(सही उत्तर)','(Correct Answer ✔)','(Correct Answer)','✔']){en=en.split(mk).join('');hi=hi.split(mk).join('')}en=clean(en);hi=clean(hi);if(marker)correct=j;opts.push({en,hi})}if(correct===null)return null;let a={...opts[correct]};return{q:{en:enq,hi:hiq},o:opts,a,exp:{en:'Answer: '+a.en+'.',hi:'उत्तर: '+a.hi+'।'},_hi_exp:clean(hiExp),_en_exp:clean(enExp),_stem_en:enq,_stem_hi:hiq}}
function allColon(text,lang){text=String(text||'');let out=[],re=/:\s*/g,m,punct=lang==='hi'?'.!?।':'.!?';while((m=re.exec(text))){let prev=-1;for(const ch of punct)prev=Math.max(prev,text.lastIndexOf(ch,m.index));let lab=clean(text.slice(prev+1,m.index));if(lab.length>110)lab=lab.split(/[,;]/).pop().trim();let ends=[];for(const ch of punct){let k=text.indexOf(ch,re.lastIndex);if(k>=0)ends.push(k)}let nxt=ends.length?Math.min(...ends):text.length,val=clean(text.slice(re.lastIndex,nxt)).replace(/^[ .।]+|[ .।]+$/g,'');if(lab.length>=1&&lab.length<=110&&val)out.push([lab,val])}return out}
function derive(mains,target){let c=[];mains.forEach((m,mi)=>{let en=allColon(m._en_exp,'en'),hi=allColon(m._hi_exp,'hi');en.forEach(([lab,val],k)=>{if(lab.toLowerCase()==='note')return;let h=hi[k]||[lab,val];c.push({mi,label_en:lab,value_en:val,label_hi:h[0],value_hi:h[1]})})});let seen=new Set();c=c.filter(x=>{let k=x.mi+'|'+x.label_en.toLowerCase()+'|'+x.value_en.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});if(c.length>target){let scored=c.map((x,i)=>{let score=0;if(['note','answer','correct answer'].includes(x.label_en.toLowerCase()))score-=10;let wc=x.value_en.split(/\s+/).length;if(wc>=2&&wc<=35)score+=3;if(x.label_en.split(/\s+/).length<=10)score+=2;if(x.value_en.toLowerCase().startsWith('the source document'))score-=10;return{score,i}}).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,target);let keep=new Set(scored.map(x=>x.i));c=c.filter((_,i)=>keep.has(i));}else if(c.length<target){let need=target-c.length,extras=[];mains.forEach((m,mi)=>{let en=m._en_exp.split(/(?<=[.!?])\s+/).map(clean).filter(Boolean),hi=m._hi_exp.split(/(?<=[।.!?])\s+/).map(clean).filter(Boolean);en.forEach((sent,si)=>{let wc=sent.split(/\s+/).length;if(sent.includes(':')||wc<4||wc>32)return;extras.push({mi,label_en:'Related Fact',value_en:sent.replace(/[ .]+$/,''),label_hi:'संबंधित तथ्य',value_hi:(hi[si]||sent).replace(/[ ।.]+$/,'')})})});c.push(...extras.slice(0,need));}while(c.length<target){let b={...(c[c.length%c.length]||{mi:0,label_en:'Key Fact',value_en:'See source explanation',label_hi:'मुख्य तथ्य',value_hi:'स्रोत व्याख्या देखें'})};b.label_en+=' Detail';b.label_hi+=' विवरण';c.push(b)}return c.slice(0,target)}
function makeSections(mains,drills){const sections=[];for(let i=0;i<mains.length;i+=30){let ch=mains.slice(i,i+30).map(m=>({q:m.q,o:m.o,a:m.a,exp:m.exp})),a=i+1,b=i+ch.length;sections.push({title:{en:`Main MCQs Q${a}–Q${b}`,hi:`मुख्य MCQ Q${a}–Q${b}`},questions:ch})}const pool=drills.map(d=>({en:d.value_en,hi:d.value_hi})),dq=[];drills.forEach((d,i)=>{const m=mains[d.mi],ans={en:d.value_en,hi:d.value_hi},cand=[];for(let k=1;k<pool.length&&cand.length<3;k++){const p=pool[(i+k*7)%pool.length];if(p.en.toLowerCase()!==ans.en.toLowerCase()&&!cand.some(x=>x.en.toLowerCase()===p.en.toLowerCase()))cand.push(p)}for(const mm of mains){if(cand.length>=3)break;const p=mm.a;if(p.en.toLowerCase()!==ans.en.toLowerCase()&&!cand.some(x=>x.en.toLowerCase()===p.en.toLowerCase()))cand.push(p)}let opts=[ans,...cand.slice(0,3)],r=i%4;opts=opts.slice(r).concat(opts.slice(0,r));dq.push({q:{en:`Regarding “${m._stem_en}”, which fact correctly gives “${d.label_en}”?`,hi:`“${m._stem_hi}” के संदर्भ में “${d.label_hi}” के लिए सही तथ्य कौन-सा है?`},o:opts,a:ans,exp:{en:`${d.label_en}: ${d.value_en}.`,hi:`${d.label_hi}: ${d.value_hi}।`}})});for(let i=0;i<dq.length;i+=30){let ch=dq.slice(i,i+30),n=i/30+1,a=i+1,b=i+ch.length;sections.push({title:{en:`Explanation Drill ${n}: Facts ${a}–${b}`,hi:`स्पष्टीकरण अभ्यास ${n}: तथ्य ${a}–${b}`},questions:ch})}return sections}
let SECTIONS=[],TOTAL_QUESTIONS=0,saved={answers:{},bookmarks:{},section:0,dark:false},current=0,onlyBookmarks=false;try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}
function save(){saved.section=current;localStorage.setItem(STORE,JSON.stringify(saved))}function globalQNumber(si,qi){let n=qi+1;for(let i=0;i<si;i++)n+=SECTIONS[i].questions.length;return n}function qid(si,qi){return si+'-'+qi}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function correctIndex(q){return q.o.findIndex(o=>o.en===q.a.en)}function stats(){let attempted=0,correct=0,total=0;SECTIONS.forEach((s,si)=>s.questions.forEach((q,qi)=>{total++;let a=saved.answers[qid(si,qi)];if(a!==undefined){attempted++;if(a===correctIndex(q))correct++}}));return{attempted,correct,total}}function updateTop(){const x=stats(),p=x.total?Math.round(x.attempted*100/x.total):0;const score=document.getElementById('scoreTxt');if(score){score.dataset.efNativeScore='1';score.classList.add('ef-native-score');score.setAttribute('aria-label','Quiz score: '+x.attempted+' of '+x.total+' attempted, '+x.correct+' correct, '+(x.attempted-x.correct)+' wrong');score.innerHTML='<span class="ef-native-score-chip ef-native-score-total">Total <strong>'+x.attempted+'/'+x.total+'</strong></span><span class="ef-native-score-chip ef-native-score-correct">Correct <strong>'+x.correct+'</strong></span><span class="ef-native-score-chip ef-native-score-wrong">Wrong <strong>'+(x.attempted-x.correct)+'</strong></span>';}document.getElementById('pct').textContent=p+'%';document.getElementById('progFill').style.width=p+'%';renderNav();}
function renderNav(){sectionNav.innerHTML=SECTIONS.map((s,i)=>{const done=s.questions.every((q,qi)=>saved.answers[qid(i,qi)]!==undefined);return `<button class="pill ${i===current?'active':done?'done':''}" onclick="openSection(${i})" title="${escapeHtml(s.title.en)}">${done?'✓':i+1}</button>`}).join('')}function renderQuestions(){const s=SECTIONS[current];if(!s)return;secNo.textContent=`Section ${current+1} of ${SECTIONS.length} · ${s.questions.length} questions`;secTitle.textContent=s.title.en;secTitleHi.textContent=s.title.hi;const term=search.value.trim().toLowerCase();let htmls=[];s.questions.forEach((q,qi)=>{const id=qid(current,qi),book=!!saved.bookmarks[id];if(onlyBookmarks&&!book)return;const hay=(q.q.en+' '+q.q.hi+' '+q.a.en+' '+q.a.hi).toLowerCase();if(term&&!hay.includes(term))return;const picked=saved.answers[id],ci=correctIndex(q);let opts=q.o.map((o,oi)=>{let cl='opt';if(picked!==undefined){if(oi===ci)cl+=' correct';else if(oi===picked)cl+=' wrong'}return `<button class="${cl}" onclick="pick(${qi},${oi})" ${picked!==undefined?'disabled':''}><span>${escapeHtml(o.en)}</span><small>${escapeHtml(o.hi)}</small></button>`}).join('');htmls.push(`<article class="qcard" id="rp-${current}-${qi}"><button class="book ${book?'on':''}" onclick="bookmark(${qi})">${book?'★':'☆'}</button><div class="qnum">Q${globalQNumber(current,qi)} <span class="qtotal">/ ${TOTAL_QUESTIONS}</span></div><p class="qen">${escapeHtml(q.q.en)}</p><p class="qhi">${escapeHtml(q.q.hi)}</p><div class="opts">${opts}</div><div class="exp ${picked!==undefined?'show':''}"><div>${escapeHtml(q.exp.en)}</div><div class="hi">${escapeHtml(q.exp.hi)}</div></div></article>`)});questions.innerHTML=htmls.join('')||'<div class="empty">No matching questions / कोई matching प्रश्न नहीं मिला</div>';updateTop()}function pick(qi,oi){const id=qid(current,qi);if(saved.answers[id]!==undefined)return;saved.answers[id]=oi;save();renderQuestions()}function bookmark(qi){const id=qid(current,qi);saved.bookmarks[id]=!saved.bookmarks[id];if(!saved.bookmarks[id])delete saved.bookmarks[id];save();renderQuestions()}function toggleBookmarkFilter(){onlyBookmarks=!onlyBookmarks;bookmarkFilter.classList.toggle('primary',onlyBookmarks);renderQuestions()}function openSection(i){current=Math.max(0,Math.min(SECTIONS.length-1,i));search.value='';save();renderQuestions();window.scrollTo({top:310,behavior:'smooth'})}function moveSection(d){openSection(current+d)}function resetAll(){if(!confirm('Reset quiz progress? Your bookmarks will stay saved.'))return;saved.answers={};saved.section=0;current=0;save();if(window.EFP_QUIZ_PROGRESS_WARNING)window.EFP_QUIZ_PROGRESS_WARNING.disarm();renderQuestions()}function toggleDark(){saved.dark=!saved.dark;applyDark();save()}function applyDark(){document.body.classList.toggle('dark',!!saved.dark);darkBtn.textContent=saved.dark?'Light':'Dark'}
function boot(){const src=(window.CA_SEARCH_INDEX||[]).filter(e=>e.f.includes(SOURCE_KEY)),mains=src.map(parseMain).filter(Boolean).slice(0,BASE_MAIN_COUNT),drills=derive(mains,TARGET_DRILLS);SECTIONS=makeSections(mains,drills);const additions=JSON.parse(document.getElementById('additional-mcq-data').textContent);const mainSections=SECTIONS.filter(s=>s.title.en.startsWith('Main MCQs')),lastMain=mainSections[mainSections.length-1];if(lastMain){lastMain.questions.push(...additions);lastMain.title={en:'Main MCQs Q31–Q66',hi:'मुख्य MCQ Q31–Q66'};}TOTAL_QUESTIONS=SECTIONS.reduce((n,s)=>n+s.questions.length,0);if(mains.length+additions.length!==MAIN_COUNT||TOTAL_QUESTIONS!==TOTAL_COUNT){questions.innerHTML='<div class="empty">Quiz source changed. Please refresh after the latest site update.</div>';return}current=Math.max(0,Math.min(SECTIONS.length-1,saved.section||0));applyDark();renderQuestions()}boot();
</script>
