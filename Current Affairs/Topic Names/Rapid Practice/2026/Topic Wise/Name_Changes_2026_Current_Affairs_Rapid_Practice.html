am","hi":"केरलम"}],"a":{"en":"Keralam","hi":"केरलम"},"exp":{"en":["**Proposed name of Kerala:** [[Keralam]].","The proposal was approved on [[24 February 2026]]. A change in a state's name requires Parliament's law under [[Article 3]]; Cabinet approval is a step in that process."],"hi":["**केरल का प्रस्तावित नया नाम:** [[केरलम]]।","[[24 फरवरी 2026]] को प्रस्ताव को मंजूरी दी गई। राज्य का नाम [[अनुच्छेद 3]] के तहत संसद के कानून से बदलता है; मंत्रिमंडल की मंजूरी इस प्रक्रिया का एक चरण है।"]}},{"q":{"en":"Adampur Airport, renamed Sri Guru Ravidas Ji Airport in 2026, is in which state?","hi":"2026 में श्री गुरु रविदास जी हवाई अड्डा नाम दिया गया आदमपुर हवाई अड्डा किस राज्य में है?"},"o":[{"en":"Haryana","hi":"हरियाणा"},{"en":"Punjab","hi":"पंजाब"},{"en":"Rajasthan","hi":"राजस्थान"},{"en":"Bihar","hi":"बिहार"}],"a":{"en":"Punjab","hi":"पंजाब"},"exp":{"en":["**Adampur Airport — state:** [[Punjab]].","The new name honours [[Guru Ravidas]], a saint of the Bhakti tradition."],"hi":["**आदमपुर हवाई अड्डा — राज्य:** [[पंजाब]]।","नया नाम भक्ति परंपरा के संत [[गुरु रविदास]] के सम्मान में है।"]}},{"q":{"en":"What is the name of the new complex housing the Prime Minister's Office, inaugurated in February 2026?","hi":"फरवरी 2026 में उद्घाटित प्रधानमंत्री कार्यालय वाले नए परिसर का नाम क्या है?"},"o":[{"en":"Lok Bhavan","hi":"लोक भवन"},{"en":"Kartavya Bhavan","hi":"कर्तव्य भवन"},{"en":"Seva Teerth","hi":"सेवा तीर्थ"},{"en":"Swaraj Bhavan","hi":"स्वराज भवन"}],"a":{"en":"Seva Teerth","hi":"सेवा तीर्थ"},"exp":{"en":["**New PMO complex:** [[Seva Teerth]].","The complex houses the PMO, Cabinet Secretariat and National Security Council Secretariat. [[Kartavya Bhavans]] are separate new ministry buildings."],"hi":["**नया प्रधानमंत्री कार्यालय परिसर:** [[सेवा तीर्थ]]।","परिसर में प्रधानमंत्री कार्यालय, मंत्रिमंडल सचिवालय और राष्ट्रीय सुरक्षा परिषद सचिवालय हैं। [[कर्तव्य भवन]] अलग नए मंत्रालय भवन हैं।"]}},{"q":{"en":"The old North Block and South Block are to become part of which institution?","hi":"पुराने नॉर्थ ब्लॉक और साउथ ब्लॉक को किस संस्थान का भाग बनाया जाना है?"},"o":[{"en":"National Library","hi":"राष्ट्रीय पुस्तकालय"},{"en":"Yuge Yugeen Bharat National Museum","hi":"युगे युगीन भारत राष्ट्रीय संग्रहालय"},{"en":"Parliament Museum","hi":"संसद संग्रहालय"},{"en":"National Archives","hi":"राष्ट्रीय अभिलेखागार"}],"a":{"en":"Yuge Yugeen Bharat National Museum","hi":"युगे युगीन भारत राष्ट्रीय संग्रहालय"},"exp":{"en":["**North Block and South Block — planned museum:** [[Yuge Yugeen Bharat National Museum]].","The old blocks are intended for the museum. Government offices have shifted to [[Seva Teerth]] and [[Kartavya Bhavans]]."],"hi":["**नॉर्थ ब्लॉक और साउथ ब्लॉक — प्रस्तावित संग्रहालय:** [[युगे युगीन भारत राष्ट्रीय संग्रहालय]]।","पुराने ब्लॉक संग्रहालय का भाग बनाए जाने हैं। सरकारी कार्यालय [[सेवा तीर्थ]] और [[कर्तव्य भवन]] में स्थानांतरित हुए हैं।"]}},{"q":{"en":"Pakyong Airport, proposed to be named after Trilochan Pokhrel, is in which state?","hi":"त्रिलोचन पोखरेल के नाम पर नामकरण के लिए प्रस्तावित पाक्योंग हवाई अड्डा किस राज्य में है?"},"o":[{"en":"Sikkim","hi":"सिक्किम"},{"en":"Arunachal Pradesh","hi":"अरुणाचल प्रदेश"},{"en":"Assam","hi":"असम"},{"en":"Meghalaya","hi":"मेघालय"}],"a":{"en":"Sikkim","hi":"सिक्किम"},"exp":{"en":["**Pakyong Airport — state:** [[Sikkim]].","Chief Minister [[Prem Singh Tamang]] announced the proposed honour for freedom fighter [[Trilochan Pokhrel]] in [[February 2026]]."],"hi":["**पाक्योंग हवाई अड्डा — राज्य:** [[सिक्किम]]।","मुख्यमंत्री [[प्रेम सिंह तमांग]] ने [[फरवरी 2026]] में स्वतंत्रता सेनानी [[त्रिलोचन पोखरेल]] के सम्मान में नामकरण की घोषणा की।"]}},{"q":{"en":"Rajasthan announced which new name for Mount Abu in February 2026?","hi":"राजस्थान ने फरवरी 2026 में माउंट आबू के लिए किस नए नाम की घोषणा की?"},"o":[{"en":"Aburaj","hi":"आबूराज"},{"en":"Aravallipur","hi":"अरावलीपुर"},{"en":"Shivraj","hi":"शिवराज"},{"en":"Abunaga","hi":"आबूनाग"}],"a":{"en":"Aburaj","hi":"आबूराज"},"exp":{"en":["**Mount Abu — announced new name:** [ ion of the Union naming process."],"hi":["**पुणे हवाई अड्डा — प्रस्तावित नाम से सम्मानित संत:** [[जगद्गुरु संत तुकाराम महाराज]]।","राज्य ने [[2024]] में प्रस्ताव को मंजूरी दी। राज्य का प्रस्ताव केंद्रीय नामकरण प्रक्रिया के पूरा होने से अलग चरण है।"]}},{"q":{"en":"Ahmednagar, renamed Ahilyanagar, is in which state?","hi":"अहिल्यानगर नाम दिया गया अहमदनगर किस राज्य में है?"},"o":[{"en":"Gujarat","hi":"गुजरात"},{"en":"Maharashtra","hi":"महाराष्ट्र"},{"en":"Uttar Pradesh","hi":"उत्तर प्रदेश"},{"en":"Telangana","hi":"तेलंगाना"}],"a":{"en":"Maharashtra","hi":"महाराष्ट्र"},"exp":{"en":["**Ahmednagar (Ahilyanagar) — state:** [[Maharashtra]].","The name honours [[Ahilyabai Holkar]], an eighteenth-century Maratha ruler."],"hi":["**अहमदनगर (अहिल्यानगर) — राज्य:** [[महाराष्ट्र]]।","यह नाम अठारहवीं सदी की मराठा शासिका [[अहिल्याबाई होलकर]] के सम्मान में है।"]}},{"q":{"en":"Maharishi Valmiki International Airport, Ayodhya Dham, serves which city?","hi":"महर्षि वाल्मीकि अंतरराष्ट्रीय हवाई अड्डा, अयोध्या धाम, किस शहर में है?"},"o":[{"en":"Ayodhya","hi":"अयोध्या"},{"en":"Prayagraj","hi":"प्रयागराज"},{"en":"Varanasi","hi":"वाराणसी"},{"en":"Agra","hi":"आगरा"}],"a":{"en":"Ayodhya","hi":"अयोध्या"},"exp":{"en":["**Maharishi Valmiki International Airport — city:** [[Ayodhya]].","The airport is in [[Ayodhya]], [[Uttar Pradesh]]."],"hi":["**महर्षि वाल्मीकि अंतरराष्ट्रीय हवाई अड्डा — शहर:** [[अयोध्या]]।","हवाई अड्डा [[उत्तर प्रदेश]] के [[अयोध्या]] में है।"]}},{"q":{"en":"Aurangabad railway station's new name honours which historical personality?","hi":"औरंगाबाद रेलवे स्टेशन का नया नाम किस ऐतिहासिक व्यक्तित्व के सम्मान में है?"},"o":[{"en":"Chhatrapati Sambhaji Maharaj","hi":"छत्रपति संभाजी महाराज"},{"en":"Chhatrapati Shivaji Maharaj","hi":"छत्रपति शिवाजी महाराज"},{"en":"Mahatma Gandhi","hi":"महात्मा गांधी"},{"en":"Dr B. R. Ambedkar","hi":"डॉ. बी. आर. आंबेडकर"}],"a":{"en":"Chhatrapati Sambhaji Maharaj","hi":"छत्रपति संभाजी महाराज"},"exp":{"en":["**Aurangabad railway station — namesake:** [[Chha let current=Math.max(0,Math.min(SECTIONS.length-1,saved.section||0)),onlyBookmarks=false;function save(){saved.section=current;try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){};}function globalQNumber(si,qi){let n=qi+1;for(let i=0;i<si;i++)n+=SECTIONS[i].questions.length;return n}const TOTAL_QUESTIONS=SECTIONS.reduce((n,s)=>n+s.questions.length,0);function qid(si,qi){return si+'-'+qi}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function explanationHtml(a){return '<ul>'+a.map(s=>'<li>'+escapeHtml(s).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\[\[(.*?)\]\]/g,'<span class="highlight-text">$1</span>')+'</li>').join('')+'</ul>'}function correctIndex(q){return q.o.findIndex(o=>o.en===q.a.en)}function stats(){let attempted=0,correct=0,total=0;SECTIONS.forEach((s,si)=>s.questions.forEach((q,qi)=>{total++;let a=saved.answers[qid(si,qi)];if(a!==undefined){attempted++;if(a===correctIndex(q))correct++;}}));return{attempted,correct,total}}function updateTop(){const x=stats(),p=x.total?Math.round(x.attempted*100/x.total):0;const score=document.getElementById('scoreTxt');if(score){score.dataset.efNativeScore='1';score.classList.add('ef-native-score');score.setAttribute('aria-label','Quiz score: '+x.attempted+' of '+x.total+' attempted, '+x.correct+' correct, '+(x.attempted-x.correct)+' wrong');score.innerHTML='<span class="ef-native-score-chip ef-native-score-total">Total <strong>'+x.attempted+'/'+x.total+'</strong></span><span class="ef-native-score-chip ef-native-score-correct">Correct <strong>'+x.correct+'</strong></span><span class="ef-native-score-chip ef-native-score-wrong">Wrong <strong>'+(x.attempted-x.correct)+'</strong></span>';}document.getElementById('pct').textContent=p+'%';document.getElementById('progFill').style.width=p+'%';renderNav();}
function renderNav(){document.getElementById('sectionNav').innerHTML=SECTIONS.map((s,i)=>{const done=s.questions.every((q,qi)=>saved.answers[qid(i,qi)]!==undefined);return `<button class="pill ${i===current?'active':done?'done':''}" onclick="openSection(${i})" title="${escapeHtml(s.title.en)}">${done?'✓':i+1}</button>`}).join('')}function renderQuestions(){const s=SECTIONS[current];document.getElementById('secNo').textContent=`Section ${current+1} of ${SECTIONS.length} · ${s.questions.length} questions`;document.getElementById('secTitle').textContent=s.title.en;document.getElementById('secTitleHi').textContent=s.title.hi;const term=document.getElementById('search').value.trim().toLowerCase();let shown=0;const htmls=[];s.questions.forEach((q,qi)=>{const id=qid(current,qi),book=!!saved.bookmarks[id];if(onlyBookmarks&&!book)return;const hay=(q.q.en+' '+q.q.hi+' '+q.a.en+' '+q.a.hi).toLowerCase();if(term&&!hay.includes(term))return;shown++;const picked=saved.answers[id],ci=correctIndex(q);let opts=q.o.map((o,oi)=>{let cl='opt';if(picked!==undefined){if(oi===ci)cl+=' correct';else if(oi===picked)cl+=' wrong'}return `<button class="${cl}" onclick="pick(${qi},${oi})" ${picked!==undefined?'disabled':''}><span>${escapeHtml(o.en)}</span><small>${escapeHtml(o.hi)}</small></button>`}).join('');htmls.push(`<article class="qcard" id="rp-${current}-${qi}"><button class="book ${book?'on':''}" onclick="bookmark(${qi})" title="Bookmark">${book?'★':'☆'}</button><div class="qnum">Q${globalQNumber(current,qi)} <span class="qtotal">/ ${TOTAL_QUESTIONS}</span></div><p class="qen">${escapeHtml(q.q.en)}</p><p class="qhi">${escapeHtml(q.q.hi)}</p><div class="opts">${opts}</div><div class="exp ${picked!==undefined?'show':''}"><div>${explanationHtml(q.exp.en)}</div><div class="hi">${explanationHtml(q.exp.hi)}</div></div></article>`)});document.getElementById('questions').innerHTML=htmls.join('')||'<div class="empty">'+(onlyBookmarks?'No bookmarks in this section / इस सेक्शन में कोई बुकमार्क नहीं':'No matching questions / कोई matching प्रश्न नहीं मिला')+'</div>';updateTop()}function pick(qi,oi){const id=qid(current,qi);if(saved.answers[id]!==undefined)return;saved.answers[id]=oi;save();renderQuestions()}function bookmark(qi){const id=qid(current,qi);saved.bookmarks[id]=!saved.bookmarks[id];if(!saved.bookmarks[id])delete saved.bookmarks[id];save();renderQuestions()}function toggleBookmarkFilter(){onlyBookmarks=!onlyBookmarks;document.getElementById('bookmarkFilter').classList.toggle('primary',onlyBookmarks);renderQuestions()}function openSection(i){current=Math.max(0,Math.min(SECTIONS.length-1,Number.isInteger(i)?i:0));document.getElementById('search').value='';save();renderQuestions();window.scrollTo({top:310,behavior:'smooth'})}function moveSection(d){openSection(Math.max(0,Math.min(SECTIONS.length-1,current+d)))}function resetAll(){if(!confirm('Reset quiz progress? Your bookmarks will stay saved.'))return;if(window.EFP_QUIZ_CONTINUITY)window.EFP_QUIZ_CONTINUITY.clear();saved.answers={};saved.section=0;current=0;save();if(window.EFP_QUIZ_PROGRESS_WARNING)window.EFP_QUIZ_PROGRESS_WARNING.disarm();renderQuestions()}function toggleDark(){saved.dark=!saved.dark;applyDark();save()}function applyDark(){document.body.classList.toggle('dark',!!saved.dark);document.getElementById('darkBtn').textContent=saved.dark?'Light':'Dark'}applyDark();renderQuestions();
</script>
