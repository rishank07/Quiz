const SECTIONS=JSON.parse(document.getElementById('master-data').textContent);const STORE="efp_ca_topic_census_2027_rapid_v1";let saved={answers:{},bookmarks:{},section:0,dark:false};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}
saved.answers={};try{localStorage.setItem(STORE,JSON.stringify(Object.assign({},saved,{answers:{}})))}catch(e){}let current=Math.max(0,Math.min(SECTIONS.length-1,saved.section||0)),onlyBookmarks=false;function save(){saved.section=current;const persist=Object.assign({},saved,{answers:{}});localStorage.setItem(STORE,JSON.stringify(persist));}function globalQNumber(si,qi){let n=qi+1;for(let i=0;i<si;i++)n+=SECTIONS[i].questions.length;return n}const TOTAL_QUESTIONS=SECTIONS.reduce((n,s)=>n+s.questions.length,0);function qid(si,qi){return si+'-'+qi}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function correctIndex(q){return q.o.findIndex(o=>o.en===q.a.en)}function stats(){let attempted=0,correct=0,total=0;SECTIONS.forEach((s,si)=>s.questions.forEach((q,qi)=>{total++;let a=saved.answers[qid(si,qi)];if(a!==undefined){attempted++;if(a===correctIndex(q))correct++;}}));return{attempted,correct,total}}function updateTop(){const x=stats(),p=x.total?Math.round(x.attempted*100/x.total):0;document.getElementById('scoreTxt').textContent=`${x.correct} correct · ${x.attempted-x.correct} wrong · ${x.attempted}/${x.total} attempted`;document.getElementById('pct').textContent=p+'%';document.getElementById('progFill').style.width=p+'%';renderNav()}function renderNav(){document.getElementById('sectionNav').innerHTML=SECTIONS.map((s,i)=>{const done=s.questions.every((q,qi)=>saved.answers[qid(i,qi)]!==undefined);return `<button class="pill ${i===current?'active':done?'done':''}" onclick="openSection(${i})" title="${escapeHtml(s.title.en)}">${done?'✓':i+1}</button>`}).join('')}function renderQuestions(){const s=SECTIONS[current];document.getElementById('secNo').textContent=`Section ${current+1} of ${SECTIONS.length} · ${s.questions.length} questions`;document.getElementById('secTitle').textContent=s.title.en;document.getElementById('secTitleHi').textContent=s.title.hi;const term=document.getElementById('search').value.trim().toLowerCase();let shown=0;const htmls=[];s.questions.forEach((q,qi)=>{const id=qid(current,qi),book=!!saved.bookmarks[id];if(onlyBookmarks&&!book)return;const hay=(q.q.en+' '+q.q.hi+' '+q.a.en+' '+q.a.hi).toLowerCase();if(term&&!hay.includes(term))return;shown++;const picked=saved.answers[id],ci=correctIndex(q);let opts=q.o.map((o,oi)=>{let cl='opt';if(picked!==undefined){if(oi===ci)cl+=' correct';else if(oi===picked)cl+=' wrong'}return `<button class="${cl}" onclick="pick(${qi},${oi})" ${picked!==undefined?'disabled':''}><span>${escapeHtml(o.en)}</span><small>${escapeHtml(o.hi)}</small></button>`}).join('');htmls.push(`<article class="qcard"><button class="book ${book?'on':''}" onclick="bookmark(${qi})" title="Bookmark">${book?'★':'☆'}</button><div class="qnum">Q${globalQNumber(current,qi)} <span class="qtotal">/ ${TOTAL_QUESTIONS}</span></div><p class="qen">${escapeHtml(q.q.en)}</p><p class="qhi">${escapeHtml(q.q.hi)}</p><div class="opts">${opts}</div><div class="exp ${picked!==undefined?'show':''}"><div>${escapeHtml(q.exp.en)}</div><div class="hi">${escapeHtml(q.exp.hi)}</div></div></article>`)});document.getElementById('questions').innerHTML=htmls.join('')||'<div class="empty">'+(onlyBookmarks?'No bookmarks in this section / इस सेक्शन में कोई बुकमार्क नहीं':'No matching questions / कोई matching प्रश्न नहीं मिला')+'</div>';updateTop()}function pick(qi,oi){const id=qid(current,qi);if(saved.answers[id]!==undefined)return;saved.answers[id]=oi;save();renderQuestions()}function bookmark(qi){const id=qid(current,qi);saved.bookmarks[id]=!saved.bookmarks[id];if(!saved.bookmarks[id])delete saved.bookmarks[id];save();renderQuestions()}function toggleBookmarkFilter(){onlyBookmarks=!onlyBookmarks;document.getElementById('bookmarkFilter').classList.toggle('primary',onlyBookmarks);renderQuestions()}function openSection(i){current=i;document.getElementById('search').value='';save();renderQuestions();window.scrollTo({top:310,behavior:'smooth'})}function moveSection(d){openSection(Math.max(0,Math.min(SECTIONS.length-1,current+d)))}function resetAll(){if(!confirm('Reset all answers and bookmarks for this topic?'))return;saved.answers={};saved.bookmarks={};saved.section=0;current=0;save();renderQuestions()}function toggleDark(){saved.dark=!saved.dark;applyDark();save()}function applyDark(){document.body.classList.toggle('dark',!!saved.dark);document.getElementById('darkBtn').textContent=saved.dark?'Light':'Dark'}applyDark();renderQuestions();
</script>
