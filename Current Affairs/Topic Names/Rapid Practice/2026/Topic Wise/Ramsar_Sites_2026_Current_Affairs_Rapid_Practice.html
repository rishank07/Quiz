<script id="efp-ca-facts" type="application/json">{"q1":[{"en":"\u003cb>Sukhna Wetland:\u003c/b> \u003cspan class=\"highlight-text\">Sukhna Wetland\u003c/span> - \u003cspan class=\"highlight-text\">Chandigarh\u003c/span> (UT).","hi":"\u003cb>सुखना वेटलैंड:\u003c/b> \u003cspan class=\"highlight-text\">सुखना वेटलैंड\u003c/span> - \u003cspan class=\"highlight-text\">चंडीगढ़\u003c/span> (केंद्र शासित प्रदेश)।"},{"en":"\u003cb>Sauj Jheel:\u003c/b> \u003cspan class=\"highlight-text\">Sauj Jheel\u003c/span> - \u003cspan class=\"highlight-text\">Mainpuri\u003c/span>, \u003cspan class=\"highlight-text\">Uttar Pradesh\u003c/span>.","hi":"\u003cb>सौज झील:\u003c/b> \u003cspan class=\"highlight-text\">सौज झील\u003c/span> - \u003cspan class=\"highlight-text\">मैनपुरी\u003c/span>, \u003cspan class=\"highlight-text\">उत्तर प्रदेश\u003c/span>।"},{"en":"\u003cb>India&#39;s total:\u003c/b> Total Ramsar sites in India - \u003cspan class=\"highlight-text\">103\u003c/span> (as of \u003cspan class=\"highlight-text\">15 October 2026\u003c/span>)","hi":"\u003cb>भारत का कुल:\u003c/b> भारत में कुल रामसर स्थल - \u003cspan class=\"highlight-text\">103\u003c/span> (\u003cspan class=\"highlight-text\">15 अक्टूबर 2026\u003c/span> तक)।"}],"q2":[{"en":"\u003cb>Location:\u003c/b> Location: \u003cspan class=\"highlight-text\">Jalesar\u003c/span> tehsil, \u003cspan class=\"highlight-text\">Etah\u003c/span> district, \u003cspan class=\"highlight-text\">Uttar Pradesh\u003c/span>.","hi":"\u003cb>स्थान:\u003c/b> स्थान: \u003cspan class=\"highlight-text\">जलेसर\u003c/span> तहसील, \u003cspan class=\"highlight-text\">एटा\u003c/span> जिला, \u003cspan class=\"highlight-text\">उत्तर प्रदेश\u003c/span>।"},{"en":"\u003cb>Announcement:\u003c/b> Inclusion announced on \u003cspan class=\"highlight-text\">30 January 2026\u003c/span>; the Ramsar designation date is a separate record.","hi":"\u003cb>घोषणा:\u003c/b> शामिल होने की घोषणा \u003cspan class=\"highlight-text\">30 जनवरी 2026\u003c/span> को हुई; रामसर नामांकन तिथि अलग अभिलेख है।"},{"en":"\u003cb>Wetland type:\u003c/b> Type: Freshwater wetland; important for migratory birds.","hi":"\u003cb>आर्द्रभूमि प्रकार:\u003c/b> प्रकार: मीठे पानी की आर्द्रभूमि; प्रवासी पक्षियों के लिए महत्वपूर्ण।"}],"q3":[{"en":"\u003cb>India&#39;s total:\u003c/b> Total Ramsar Sites: \u003cspan class=\"highlight-text\">103\u003c/span> (October 2026).","hi":"\u003cb>भारत का कुल:\u003c/b> कुल रामसर स्थल: \u003cspan class=\"highlight-text\">103\u003c/span> (अक्टूबर 2026)।"},{"en":"\u003cb>Latest additions:\u003c/b> Latest additions: \u003cspan class=\"highlight-text\">Sukhna Wetland\u003c/span> (\u003cspan class=\"highlight-text\">Chandigarh\u003c/span>) and \u003cspan class=\"highlight-text\">Sauj Jheel\u003c/span> (\u003cspan class=\"highlight-text\">Uttar Pradesh\u003c/span>).","hi":"\u003cb>नवीनतम स्थल:\u003c/b> नवीनतम शामिल स्थल: \u003cspan class=\"highlight-text\">सुखना वेटलैंड\u003c/span> (\u003cspan class=\"highlight-text\">चंडीगढ़\u003c/span>) और \u003cspan class=\"highlight-text\">सौज झील\u003c/span> (\u003cspan class=\"highlight-text\">उत्तर प्रदेश\u003c/span>)।"},{"en":"\u003cb>100th site:\u003c/b> \u003cspan class=\"highlight-text\">100\u003c/span>th Ramsar Site: \u003cspan class=\"highlight-text\">Surha Tal\u003c/span>, \u003cspan class=\"highlight-text\">Uttar Pradesh\u003c/span>","hi":"\u003cb>100वाँ स्थल:\u003c/b> \u003cspan class=\"highlight-text\">100\u003c/span>वाँ रामसर स्थल: \u003cspan class=\"highlight-text\">सुरहा ताल\u003c/span>, \u003cspan class=\"highlight-text\">उत्तर प्रदेश\u003c/span>।"}],"q4":[{"en":"\u003cb>Location:\u003c/b> Location: \u003cspan class=\"highlight-text\">Kutch\u003c/span> district, \u003cspan class=\"highlight-text\">Gujarat\u003c/span>.","hi":"\u003cb>स्थान:\u003c/b> स्थान: \u003cspan class=\"highlight-text\">कच्छ\u003c/span> जिला, \u003cspan class=\"highlight-text\">गुजरात\u003c/span>।"},{"en":"\u003cb>Region:\u003c/b> Region: \u003cspan class=\"highlight-text\">Banni\u003c/span> grasslands, \u003cspan class=\"highlight-text\">Kutch\u003c/span>.","hi":"\u003cb>क्षेत्र:\u003c/b> क्षेत्र: \u003cspan class=\"highlight-text\">बन्नी\u003c/span> घास के मैदान (\u003cspan class=\"highlight-text\">Banni\u003c/span> grasslands), \u003cspan class=\"highlight-text\">कच्छ\u003c/span>।"},{"en":"\u003cb>Bird habitat:\u003c/b> Significance: Important habitat for migratory birds.","hi":"\u003cb>पक्षी आवास:\u003c/b> महत्व: प्रवासी पक्षियों के लिए महत्वपूर्ण आवास।"}],"q5":[{"en":"\u003cb>Article 1:\u003c/b> \u003cspan class=\"highlight-text\">Article 1\u003c/span> of the \u003cspan class=\"highlight-text\">Ramsar Convention\u003c/span> contains the definition of wetlands, covering natural and artificial wetlands.","hi":"\u003cb>अनुच्छेद 1:\u003c/b> \u003cspan class=\"highlight-text\">रामसर कन्वेंशन\u003c/span> के \u003cspan class=\"highlight-text\">अनुच्छेद 1\u003c/span> में आर्द्रभूमि की परिभाषा दी गई है, जिसमें प्राकृतिक और कृत्रिम दोनों आर्द्रभूमियाँ शामिल हैं।"},{"en":"\u003cb>Scope:\u003c/b> The Ramsar definition is broad, including marshes, peatlands, rivers, lakes and coastal areas.","hi":"\u003cb>दायरा:\u003c/b> रामसर की परिभाषा व्यापक है, जिसमें दलदल (marshes), पीटलैंड, नदियाँ, झीलें और तटीय क्षेत्र शामिल हैं।"},{"en":"\u003cb>Marine waters:\u003c/b> It also covers marine waters whose depth at low tide does not exceed \u003cspan class=\"highlight-text\">6 m\u003c/span>.","hi":"\u003cb>समुद्री जल:\u003c/b> इसमें ऐसे समुद्री जल क्षेत्र भी शामिल हैं जिनकी गहराई निम्न ज्वार के समय \u003cspan class=\"highlight-text\">6 मीटर\u003c/span> से अधिक नहीं होती।"}],"q6":[{"en":"\u003cb>Purpose:\u003c/b> \u003cspan class=\"highlight-text\">Ramsar Convention\u003c/span> is an international treaty for the conservation and wise use of wetlands.","hi":"\u003cb>उद्देश्य:\u003c/b> \u003cspan class=\"highlight-text\">रामसर कन्वेंशन\u003c/span> आर्द्रभूमियों के संरक्षण और विवेकपूर्ण उपयोग के लिए एक अंतरराष्ट्रीय संधि है।"},{"en":"\u003cb>Adoption:\u003c/b> Adopted in \u003cspan class=\"highlight-text\">1971\u003c/span> at Ramsar, Iran.","hi":"\u003cb>अंगीकरण:\u003c/b> इसे \u003cspan class=\"highlight-text\">1971\u003c/span> में ईरान के रामसर शहर में अपनाया गया था।"},{"en":"\u003cb>Global treaty:\u003c/b> It is the only global treaty exclusively dedicated to wetlands.","hi":"\u003cb>वैश्विक संधि:\u003c/b> यह विशेष रूप से आर्द्रभूमियों को समर्पित एकमात्र वैश्विक संधि है।"}],"q7":[{"en":"\u003cb>India&#39;s accession:\u003c/b> India joined the \u003cspan class=\"highlight-text\">Ramsar Convention\u003c/span> on \u003cspan class=\"highlight-text\">1 February 1982\u003c/span>.","hi":"\u003cb>भारत का प्रवेश:\u003c/b> भारत \u003cspan class=\"highlight-text\">1 फरवरी 1982\u003c/span> को \u003cspan class=\"highlight-text\">रामसर कन्वेंशन\u003c/span> में शामिल हुआ।"},{"en":"\u003cb>Asian network:\u003c/b> India now has one of the largest networks of Ramsar Sites in Asia.","hi":"\u003cb>एशियाई नेटवर्क:\u003c/b> अब एशिया में रामसर स्थलों के सबसे बड़े नेटवर्कों में से एक भारत में है।"},{"en":"\u003cb>Conservation:\u003c/b> Wetland conservation efforts expanded significantly after joining.","hi":"\u003cb>संरक्षण:\u003c/b> इस संधि में शामिल होने के बाद भारत में आर्द्रभूमि संरक्षण के प्रयासों में काफी विस्तार हुआ।"}],"q8":[{"en":"\u003cb>First sites:\u003c/b> \u003cspan class=\"highlight-text\">Chilika Lake\u003c/span> was among the first Ramsar Sites designated in India.","hi":"\u003cb>प्रथम स्थल:\u003c/b> \u003cspan class=\"highlight-text\">चिल्का झील\u003c/span> भारत में नामित किए गए पहले रामसर स्थलों में से एक थी।"},{"en":"\u003cb>Location:\u003c/b> Located in \u003cspan class=\"highlight-text\">Odisha\u003c/span>.","hi":"\u003cb>स्थान:\u003c/b> यह \u003cspan class=\"highlight-text\">ओडिशा\u003c/span> में स्थित है।"},{"en":"\u003cb>Coastal lagoon:\u003c/b> It is India&#39;s largest coastal lagoon.","hi":"\u003cb>तटीय लैगून:\u003c/b> यह भारत का सबसे बड़ा तटीय लैगून (Coastal Lagoon) है।"}],"q9":[{"en":"\u003cb>Location:\u003c/b> Located in \u003cspan class=\"highlight-text\">West Bengal\u003c/span>.","hi":"\u003cb>स्थान:\u003c/b> \u003cspan class=\"highlight-text\">पश्चिम बंगाल\u003c/span> में स्थित है।"},{"en":"\u003cb>Area ranking:\u003c/b> Largest Ramsar Site in India.","hi":"\u003cb>क्षेत्रफल क्रम:\u003c/b> यह भारत का सबसे बड़ा रामसर स्थल है।"},{"en":"\u003cb>Wildlife:\u003c/b> Famous for mangrove forests and Royal Bengal Tigers.","hi":"\u003cb>वन्यजीव:\u003c/b> मैंग्रोव वनों और रॉयल बंगाल टाइगर के लिए प्रसिद्ध है।"}],"q10":[{"en":"\u003cb>Location:\u003c/b> Located in Sirmaur district, \u003cspan class=\"highlight-text\">Himachal Pradesh\u003c/span>.","hi":"\u003cb>स्थान:\u003c/b> \u003cspan class=\"highlight-text\">हिमाचल प्रदेश\u003c/span> के सिरमौर जिले में स्थित है।"},{"en":"\u003cb>Area ranking:\u003c/b> Smallest Ramsar Site in India.","hi":"\u003cb>क्षेत्रफल क्रम:\u003c/b> यह भारत का सबसे छोटा रामसर स्थल है।"},{"en":"\u003cb>Lake:\u003c/b> Associated with Renuka Lake.","hi":"\u003cb>झील:\u003c/b> यह रेणुका झील से संबंधित है।"}],"q11":[{"en":"\u003cb>Freshwater lake:\u003c/b> Largest freshwater lake in Northeast India.","hi":"\u003cb>मीठे पानी की झील:\u003c/b> पूर्वोत्तर भारत की सबसे बड़ी मीठे पानी की झील है।"},{"en":"\u003cb>Phumdis:\u003c/b> Famous for floating islands called \u003cspan class=\"highlight-text\">phumdis\u003c/span>.","hi":"\u003cb>फुमदी:\u003c/b> &#39;\u003cspan class=\"highlight-text\">फुमदी\u003c/span>&#39; (Phumdis) नामक तैरते हुए द्वीपों के लिए प्रसिद्ध है।"},{"en":"\u003cb>National park:\u003c/b> Hosts \u003cspan class=\"highlight-text\">Keibul Lamjao National Park\u003c/span>.","hi":"\u003cb>राष्ट्रीय उद्यान:\u003c/b> यहाँ \u003cspan class=\"highlight-text\">केइबुल लामजाओ राष्ट्रीय उद्यान\u003c/span> स्थित है।"}],"q12":[{"en":"\u003cb>Freshwater lake:\u003c/b> One of Asia&#39;s largest freshwater lakes.","hi":"\u003cb>मीठे पानी की झील:\u003c/b> एशिया की सबसे बड़ी मीठे पानी की झीलों में से एक है।"},{"en":"\u003cb>Location:\u003c/b> Located in the Kashmir Valley.","hi":"\u003cb>स्थान:\u003c/b> कश्मीर घाटी में स्थित है।"},{"en":"\u003cb>Benefits:\u003c/b> Important for flood control and fisheries.","hi":"\u003cb>लाभ:\u003c/b> बाढ़ नियंत्रण और मत्स्य पालन के लिए महत्वपूर्ण है।"}],"q13":[{"en":"\u003cb>Phumdis:\u003c/b> Phumdis are floating masses of vegetation and organic matter.","hi":"\u003cb>फुमदी:\u003c/b> \u003cspan class=\"highlight-text\">फुमदी\u003c/span> वनस्पति और जैविक पदार्थों के तैरते हुए समूह हैं।"},{"en":"\u003cb>Lake:\u003c/b> Unique feature of \u003cspan class=\"highlight-text\">Loktak Lake\u003c/span>.","hi":"\u003cb>झील:\u003c/b> यह \u003cspan class=\"highlight-text\">लोकटक झील\u003c/span> की अनूठी विशेषता है।"},{"en":"\u003cb>National park:\u003c/b> Support the floating \u003cspan class=\"highlight-text\">Keibul Lamjao National Park\u003c/span>.","hi":"\u003cb>राष्ट्रीय उद्यान:\u003c/b> यह तैरते हुए \u003cspan class=\"highlight-text\">केइबुल लामजाओ राष्ट्रीय उद्यान\u003c/span> को आधार प्रदान करते हैं।"}],"q14":[{"en":"\u003cb>Location:\u003c/b> Located on the eastern outskirts of Kolkata.","hi":"\u003cb>स्थान:\u003c/b> कोलकाता के पूर्वी बाहरी इलाके में स्थित है।"},{"en":"\u003cb>Fisheries:\u003c/b> Known for wastewater-fed fisheries.","hi":"\u003cb>मत्स्य पालन:\u003c/b> अपशिष्ट जल (wastewater) आधारित मत्स्य पालन के लिए जाना जाता है।"},{"en":"\u003cb>Management:\u003c/b> Example of sustainable urban wetland management.","hi":"\u003cb>प्रबंधन:\u003c/b> सतत शहरी आर्द्रभूमि प्रबंधन का एक उत्कृष्ट उदाहरण है।"}],"q15":[{"en":"\u003cb>Location:\u003c/b> Located in Bharatpur, \u003cspan class=\"highlight-text\">Rajasthan\u003c/span>.","hi":"\u003cb>स्थान:\u003c/b> भरतपुर, \u003cspan class=\"highlight-text\">राजस्थान\u003c/span> में स्थित है।"},{"en":"\u003cb>Former name:\u003c/b> Formerly known as Bharatpur Bird Sanctuary.","hi":"\u003cb>पुराना नाम:\u003c/b> पूर्व में इसे भरतपुर पक्षी अभयारण्य के नाम से जाना जाता था।"},{"en":"\u003cb>World Heritage:\u003c/b> UNESCO World Heritage Site.","hi":"\u003cb>विश्व धरोहर:\u003c/b> यह यूनेस्को विश्व धरोहर स्थल (UNESCO World Heritage Site) भी है।"}],"q16":[{"en":"\u003cb>Flood control:\u003c/b> \u003cspan class=\"highlight-text\">Wetlands\u003c/span> absorb excess rainwater and reduce floods.","hi":"\u003cb>बाढ़ नियंत्रण:\u003c/b> आर्द्रभूमियाँ अतिरिक्त वर्षा जल को सोखती हैं और बाढ़ को कम करती हैं।"},{"en":"\u003cb>Groundwater:\u003c/b> Recharge groundwater reserves.","hi":"\u003cb>भूजल:\u003c/b> भूजल भंडार को रिचार्ज (पुनर्भरण) करती हैं।"},{"en":"\u003cb>Climate:\u003c/b> Store carbon and help regulate climate.","hi":"\u003cb>जलवायु:\u003c/b> कार्बन को संग्रहीत करती हैं और जलवायु को नियंत्रित करने में मदद करती हैं।"}],"q17":[{"en":"\u003cb>100th site:\u003c/b> \u003cspan class=\"highlight-text\">100\u003c/span>th Ramsar Site: \u003cspan class=\"highlight-text\">Surha Tal\u003c/span>.","hi":"\u003cb>100वाँ स्थल:\u003c/b> \u003cspan class=\"highlight-text\">100\u003c/span>वाँ रामसर स्थल: \u003cspan class=\"highlight-text\">सुरहा ताल\u003c/span>।"},{"en":"\u003cb>Location:\u003c/b> Location: \u003cspan class=\"highlight-text\">Ballia\u003c/span>, \u003cspan class=\"highlight-text\">Uttar Pradesh\u003c/span>.","hi":"\u003cb>स्थान:\u003c/b> स्थान: \u003cspan class=\"highlight-text\">बलिया\u003c/span>, \u003cspan class=\"highlight-text\">उत्तर प्रदेश\u003c/span>।"},{"en":"\u003cb>Announcement:\u003c/b> India&#39;s \u003cspan class=\"highlight-text\">100\u003c/span>th site was announced on \u003cspan class=\"highlight-text\">5 June 2026\u003c/span>.","hi":"\u003cb>घोषणा:\u003c/b> भारत के \u003cspan class=\"highlight-text\">100\u003c/span>वें स्थल की घोषणा \u003cspan class=\"highlight-text\">5 जून 2026\u003c/span> को हुई।"},{"en":"\u003cb>Official name:\u003c/b> Official name: Jai Prakash Narayan Bird Sanctuary.","hi":"\u003cb>आधिकारिक नाम:\u003c/b> आधिकारिक नाम: जय प्रकाश नारायण पक्षी अभयारण्य।"},{"en":"\u003cb>Bird habitat:\u003c/b> Importance: Habitat for resident and migratory birds.","hi":"\u003cb>पक्षी आवास:\u003c/b> महत्व: स्थानीय और प्रवासी पक्षियों के लिए प्रमुख आवास।"}],"q18":[{"en":"\u003cb>Location:\u003c/b> Location: Dehradun district, Uttarakhand.","hi":"\u003cb>स्थान:\u003c/b> स्थान: देहरादून जिला, उत्तराखंड।"},{"en":"\u003cb>Designation:\u003c/b> Designation: \u003cspan class=\"highlight-text\">2020\u003c/span>.","hi":"\u003cb>नामांकन:\u003c/b> रामसर दर्जा: \u003cspan class=\"highlight-text\">2020\u003c/span>।"},{"en":"\u003cb>State milestone:\u003c/b> Significance: Uttarakhand&#39;s first Ramsar Site.","hi":"\u003cb>राज्य की उपलब्धि:\u003c/b> महत्व: उत्तराखंड का पहला रामसर स्थल।"},{"en":"\u003cb>Rivers:\u003c/b> River: Located near the confluence of the \u003cspan class=\"highlight-text\">Asan and Yamuna\u003c/span> rivers.","hi":"\u003cb>नदियाँ:\u003c/b> नदी: \u003cspan class=\"highlight-text\">आसन और यमुना\u003c/span> नदियों के संगम के पास स्थित है।"}],"q19":[{"en":"\u003cb>101st site:\u003c/b> \u003cspan class=\"highlight-text\">101\u003c/span>st Ramsar Site: \u003cspan class=\"highlight-text\">Glaw Lake\u003c/span>.","hi":"\u003cb>101वाँ स्थल:\u003c/b> \u003cspan class=\"highlight-text\">101\u003c/span>वाँ रामसर स्थल: \u003cspan class=\"highlight-text\">ग्लाव झील\u003c/span>।"},{"en":"\u003cb>Location:\u003c/b> Location: \u003cspan class=\"highlight-text\">Arunachal Pradesh\u003c/span>.","hi":"\u003cb>स्थान:\u003c/b> स्थान: \u003cspan class=\"highlight-text\">अरुणाचल प्रदेश\u003c/span>।"},{"en":"\u003cb>Announcement:\u003c/b> India&#39;s \u003cspan class=\"highlight-text\">101\u003c/span>st site was announced on \u003cspan class=\"highlight-text\">3 August 2026\u003c/span>.","hi":"\u003cb>घोषणा:\u003c/b> भारत के \u003cspan class=\"highlight-text\">101\u003c/span>वें स्थल की घोषणा \u003cspan class=\"highlight-text\">3 अगस्त 2026\u003c/span> को हुई।"},{"en":"\u003cb>Protected area:\u003c/b> Geographical location: Within \u003cspan class=\"highlight-text\">Kamlang Tiger Reserve and Wildlife Sanctuary\u003c/span>.","hi":"\u003cb>संरक्षित क्षेत्र:\u003c/b> भौगोलिक स्थिति: \u003cspan class=\"highlight-text\">कामलांग टाइगर रिजर्व और वन्यजीव अभयारण्य\u003c/span> के भीतर।"},{"en":"\u003cb>State milestone:\u003c/b> Significance: \u003cspan class=\"highlight-text\">Arunachal Pradesh\u003c/span>&#39;s first Ramsar Site.","hi":"\u003cb>राज्य की उपलब्धि:\u003c/b> महत्व: \u003cspan class=\"highlight-text\">अरुणाचल प्रदेश\u003c/span> का पहला रामसर स्थल।"}],"q20":[{"en":"\u003cb>Leading state:\u003c/b> \u003cspan class=\"highlight-text\">Tamil Nadu\u003c/span> has the highest number of Ramsar Sites among Indian states.","hi":"\u003cb>अग्रणी राज्य:\u003c/b> भारतीय राज्यों में \u003cspan class=\"highlight-text\">तमिलनाडु\u003c/span> में सबसे अधिक रामसर स्थल हैं।"},{"en":"\u003cb>Site count:\u003c/b> It has \u003cspan class=\"highlight-text\">20\u003c/span> designated wetlands as of October 2026.","hi":"\u003cb>स्थलों की संख्या:\u003c/b> अक्टूबर 2026 तक यहाँ \u003cspan class=\"highlight-text\">20\u003c/span> आर्द्रभूमियाँ नामित हैं।"},{"en":"\u003cb>Convention:\u003c/b> The \u003cspan class=\"highlight-text\">Ramsar Convention\u003c/span> was adopted in \u003cspan class=\"highlight-text\">1971\u003c/span> at Ramsar, Iran.","hi":"\u003cb>कन्वेंशन:\u003c/b> \u003cspan class=\"highlight-text\">रामसर कन्वेंशन\u003c/span> \u003cspan class=\"highlight-text\">1971\u003c/span> में ईरान के रामसर शहर में अपनाया गया था।"}],"q21":[{"en":"\u003cb>Location:\u003c/b> \u003cspan class=\"highlight-text\">Nalsarovar Bird Sanctuary\u003c/span> - \u003cspan class=\"highlight-text\">Gujarat\u003c/span>","hi":"\u003cb>स्थान:\u003c/b> \u003cspan class=\"highlight-text\">नलसरोवर पक्षी अभयारण्य\u003c/span> - \u003cspan class=\"highlight-text\">गुजरात\u003c/span>।"},{"en":"\u003cb>Designation:\u003c/b> Ramsar Site designation: \u003cspan class=\"highlight-text\">2012\u003c/span>","hi":"\u003cb>नामांकन:\u003c/b> रामसर स्थल दर्जा: \u003cspan class=\"highlight-text\">2012\u003c/span>।"},{"en":"\u003cb>Wetland type:\u003c/b> Type: Natural freshwater lake and wetland","hi":"\u003cb>आर्द्रभूमि प्रकार:\u003c/b> प्रकार: प्राकृतिक मीठे पानी की झील और आर्द्रभूमि।"},{"en":"\u003cb>Bird habitat:\u003c/b> Famous for: Migratory birds","hi":"\u003cb>पक्षी आवास:\u003c/b> प्रसिद्धि: प्रवासी पक्षियों के लिए।"},{"en":"\u003cb>Nearby city:\u003c/b> Location: Near Ahmedabad, \u003cspan class=\"highlight-text\">Gujarat\u003c/span>","hi":"\u003cb>निकटवर्ती शहर:\u003c/b> स्थान: अहमदाबाद के पास, \u003cspan class=\"highlight-text\">गुजरात\u003c/span>।"}],"q22":[{"en":"\u003cb>Habitats:\u003c/b> Ramsar Sites protect habitats of migratory birds and endangered species.","hi":"\u003cb>आवास:\u003c/b> रामसर स्थल प्रवासी पक्षियों और लुप्तप्राय प्रजातियों के आवासों की रक्षा करते हैं।"},{"en":"\u003cb>Ecosystem services:\u003c/b> They maintain ecological balance and ecosystem services.","hi":"\u003cb>पारिस्थितिकी सेवाएँ:\u003c/b> वे पारिस्थितिक संतुलन और पारिस्थितिकी तंत्र सेवाओं को बनाए रखते हैं।"},{"en":"\u003cb>Selection criteria:\u003c/b> Biodiversity value is one of the major criteria for Ramsar designation.","hi":"\u003cb>चयन मानदंड:\u003c/b> रामसर दर्जे के लिए जैव विविधता मूल्य प्रमुख मानदंडों में से एक है।"}],"q23":[{"en":"\u003cb>Wetland treaty:\u003c/b> \u003cspan class=\"highlight-text\">Ramsar Convention\u003c/span> (\u003cspan class=\"highlight-text\">1971\u003c/span>, Ramsar, Iran) is the only treaty dedicated specifically to wetlands.","hi":"\u003cb>आर्द्रभूमि संधि:\u003c/b> \u003cspan class=\"highlight-text\">रामसर कन्वेंशन\u003c/span> (\u003cspan class=\"highlight-text\">1971\u003c/span>, रामसर, ईरान) विशेष रूप से आर्द्रभूमियों को समर्पित एकमात्र संधि है।"},{"en":"\u003cb>Other treaties:\u003c/b> Kyoto Protocol and Paris Agreement deal with climate change; Montreal Protocol deals with the ozone layer.","hi":"\u003cb>अन्य संधियाँ:\u003c/b> क्योटो प्रोटोकॉल और पेरिस समझौता जलवायु परिवर्तन से संबंधित हैं; मॉन्ट्रियल प्रोटोकॉल ओजोन परत से संबंधित है।"},{"en":"\u003cb>Revision:\u003c/b> Ramsar = \u003cspan class=\"highlight-text\">Wetlands\u003c/span>; Montreal = Ozone; Kyoto and Paris = Climate change.","hi":"\u003cb>पुनरावृत्ति:\u003c/b> संक्षेप में: रामसर = आर्द्रभूमि; मॉन्ट्रियल = ओजोन परत; क्योटो और पेरिस = जलवायु परिवर्तन।"}],"q24":[{"en":"\u003cb>Wetlands Day:\u003c/b> Celebrated every year on \u003cspan class=\"highlight-text\">2 February\u003c/span>; marks the adoption of the \u003cspan class=\"highlight-text\">Ramsar Convention\u003c/span> in \u003cspan class=\"highlight-text\">1971\u003c/span>.","hi":"\u003cb>आर्द्रभूमि दिवस:\u003c/b> हर साल \u003cspan class=\"highlight-text\">2 फरवरी\u003c/span> को मनाया जाता है; यह \u003cspan class=\"highlight-text\">1971\u003c/span> में \u003cspan class=\"highlight-text\">रामसर कन्वेंशन\u003c/span> को अपनाए जाने की स्मृति में मनाया जाता है।"},{"en":"\u003cb>Earth Day:\u003c/b> 22 April - Earth Day;","hi":"\u003cb>पृथ्वी दिवस:\u003c/b> 22 अप्रैल - पृथ्वी दिवस (Earth Day);"},{"en":"\u003cb>Environment Day:\u003c/b> 5 June - World Environment Day.","hi":"\u003cb>पर्यावरण दिवस:\u003c/b> 5 जून - विश्व पर्यावरण दिवस (World Environment Day);"},{"en":"\u003cb>Water Day:\u003c/b> 22 March - World Water Day.","hi":"\u003cb>जल दिवस:\u003c/b> 22 मार्च - विश्व जल दिवस (World Water Day)।"}],"q25":[{"en":"\u003cb>First rank:\u003c/b> First: \u003cspan class=\"highlight-text\">United Kingdom\u003c/span> — \u003cspan class=\"highlight-text\">176\u003c/span> sites.","hi":"\u003cb>प्रथम स्थान:\u003c/b> प्रथम: \u003cspan class=\"highlight-text\">यूनाइटेड किंगडम\u003c/span> — \u003cspan class=\"highlight-text\">176\u003c/span> स्थल।"},{"en":"\u003cb>Second rank:\u003c/b> Second: \u003cspan class=\"highlight-text\">Mexico\u003c/span> — \u003cspan class=\"highlight-text\">144\u003c/span> sites.","hi":"\u003cb>द्वितीय स्थान:\u003c/b> द्वितीय: \u003cspan class=\"highlight-text\">मेक्सिको\u003c/span> — \u003cspan class=\"highlight-text\">144\u003c/span> स्थल।"},{"en":"\u003cb>Third rank:\u003c/b> Third: India — \u003cspan class=\"highlight-text\">103\u003c/span> sites as of October 2026; the highest number in Asia.","hi":"\u003cb>तृतीय स्थान:\u003c/b> तृतीय: भारत — अक्टूबर 2026 तक \u003cspan class=\"highlight-text\">103\u003c/span> स्थल; एशिया में सर्वाधिक।"}],"q26":[{"en":"\u003cb>Location:\u003c/b> Deepor Beel is a freshwater lake and bird habitat near Guwahati, \u003cspan class=\"highlight-text\">Assam\u003c/span>.","hi":"\u003cb>स्थान:\u003c/b> दीपोर बील गुवाहाटी, \u003cspan class=\"highlight-text\">असम\u003c/span> के पास एक मीठे पानी की झील और पक्षी आवास है।"},{"en":"\u003cb>Other sites:\u003c/b> \u003cspan class=\"highlight-text\">West Bengal\u003c/span> has East Kolkata \u003cspan class=\"highlight-text\">Wetlands\u003c/span> and Sundarbans; \u003cspan class=\"highlight-text\">Odisha\u003c/span> has \u003cspan class=\"highlight-text\">Chilika Lake\u003c/span> and Bhitarkanika.","hi":"\u003cb>अन्य स्थल:\u003c/b> \u003cspan class=\"highlight-text\">पश्चिम बंगाल\u003c/span> में ईस्ट कोलकाता वेटलैंड्स और सुंदरबन हैं; \u003cspan class=\"highlight-text\">ओडिशा\u003c/span> में \u003cspan class=\"highlight-text\">चिल्का झील\u003c/span> और भितरकनिका हैं।"},{"en":"\u003cb>Revision:\u003c/b> Deepor Beel — \u003cspan class=\"highlight-text\">Assam\u003c/span> — Guwahati.","hi":"\u003cb>पुनरावृत्ति:\u003c/b> दीपोर बील — \u003cspan class=\"highlight-text\">असम\u003c/span> — गुवाहाटी।"}],"q27":[{"en":"\u003cb>Glacial lake:\u003c/b> Chandertal is a high-altitude glacial lake in \u003cspan class=\"highlight-text\">Himachal Pradesh\u003c/span>, known as the &quot;Moon Lake&quot;.","hi":"\u003cb>हिमनद झील:\u003c/b> चंद्रताल \u003cspan class=\"highlight-text\">हिमाचल प्रदेश\u003c/span> में अधिक ऊँचाई पर स्थित एक हिमनद झील (glacial lake) है, जिसे &quot;मून लेक&quot; (Moon Lake) भी कहा जाता है।"},{"en":"\u003cb>Other lakes:\u003c/b> Nilnag is a freshwater lake in Kashmir; Rudrasagar is a floodplain lake in \u003cspan class=\"highlight-text\">Tripura\u003c/span>.","hi":"\u003cb>अन्य झीलें:\u003c/b> नीलनाग कश्मीर में मीठे पानी की झील है; रुद्रसागर \u003cspan class=\"highlight-text\">त्रिपुरा\u003c/span> में बाढ़ के मैदान की झील है।"},{"en":"\u003cb>Phumdis:\u003c/b> Loktak is a freshwater wetland famous for its floating \u003cspan class=\"highlight-text\">phumdis\u003c/span>.","hi":"\u003cb>फुमदी:\u003c/b> लोकटक अपनी तैरती हुई फुमदियों के लिए प्रसिद्ध मीठे पानी की आर्द्रभूमि है।"}],"q28":[{"en":"\u003cb>Location and type:\u003c/b> \u003cspan class=\"highlight-text\">Ashtamudi Wetland\u003c/span> is located in \u003cspan class=\"highlight-text\">Kerala\u003c/span> and is known for its backwaters and estuarine ecosystem.","hi":"\u003cb>स्थान और प्रकार:\u003c/b> अष्टमुडी आर्द्रभूमि \u003cspan class=\"highlight-text\">केरल\u003c/span> में स्थित है और अपने बैकवाटर और मुहाना (estuarine) पारिस्थितिकी तंत्र के लिए जानी जाती है।"},{"en":"\u003cb>Karnataka:\u003c/b> Karnataka has Ranganathittu Bird Sanctuary;","hi":"\u003cb>कर्नाटक:\u003c/b> कर्नाटक में रंगनाथिट्टू पक्षी अभयारण्य है;"},{"en":"\u003cb>Tamil Nadu:\u003c/b> \u003cspan class=\"highlight-text\">Tamil Nadu\u003c/span> has Point Calimere and Pallikaranai Marsh.","hi":"\u003cb>तमिलनाडु:\u003c/b> \u003cspan class=\"highlight-text\">तमिलनाडु\u003c/span> में प्वाइंट कैलिमेरे और पल्लिकरनई मार्श हैं।"}],"q29":[{"en":"\u003cb>Human-made wetland:\u003c/b> \u003cspan class=\"highlight-text\">Keoladeo National Park\u003c/span> was developed through human-made water management and is famous for migratory birds.","hi":"\u003cb>मानव निर्मित आर्द्रभूमि:\u003c/b> \u003cspan class=\"highlight-text\">केवलादेव राष्ट्रीय उद्यान\u003c/span> को मानव-निर्मित जल प्रबंधन के माध्यम से विकसित किया गया था और यह प्रवासी पक्षियों के लिए प्रसिद्ध है।"}],"q30":[{"en":"\u003cb>River confluence:\u003c/b> \u003cspan class=\"highlight-text\">Harike Wetland\u003c/span> is located at the confluence of the \u003cspan class=\"highlight-text\">Beas and Sutlej\u003c/span> rivers in Punjab.","hi":"\u003cb>नदी संगम:\u003c/b> \u003cspan class=\"highlight-text\">हरिके वेटलैंड\u003c/span> पंजाब में \u003cspan class=\"highlight-text\">ब्यास और सतलुज\u003c/span> नदियों के संगम पर स्थित है।"},{"en":"\u003cb>Other sites:\u003c/b> Deepor Beel is in \u003cspan class=\"highlight-text\">Assam\u003c/span>; Bhoj Wetland is in Madhya Pradesh; Ashtamudi is in \u003cspan class=\"highlight-text\">Kerala\u003c/span>.","hi":"\u003cb>अन्य स्थल:\u003c/b> दीपोर बील \u003cspan class=\"highlight-text\">असम\u003c/span> में है; भोज वेटलैंड मध्य प्रदेश में है; अष्टमुडी \u003cspan class=\"highlight-text\">केरल\u003c/span> में है।"}],"q31":[{"en":"\u003cb>Coastal lagoon:\u003c/b> \u003cspan class=\"highlight-text\">Chilika Lake\u003c/span> (\u003cspan class=\"highlight-text\">Odisha\u003c/span>) is the largest coastal lagoon in India.","hi":"\u003cb>तटीय लैगून:\u003c/b> \u003cspan class=\"highlight-text\">चिल्का झील\u003c/span> (\u003cspan class=\"highlight-text\">ओडिशा\u003c/span>) भारत का सबसे बड़ा तटीय लैगून है।"},{"en":"\u003cb>Kerala wetlands:\u003c/b> Vembanad is the largest lake in \u003cspan class=\"highlight-text\">Kerala\u003c/span>; Ashtamudi is an estuarine wetland in \u003cspan class=\"highlight-text\">Kerala\u003c/span>.","hi":"\u003cb>केरल की आर्द्रभूमियाँ:\u003c/b> वेम्बनाड \u003cspan class=\"highlight-text\">केरल\u003c/span> की सबसे बड़ी झील है; अष्टमुडी \u003cspan class=\"highlight-text\">केरल\u003c/span> में एक मुहाना आर्द्रभूमि है।"},{"en":"\u003cb>Revision:\u003c/b> Chilika = Largest Coastal Lagoon; Sambhar = Largest Inland Salt Lake.","hi":"\u003cb>पुनरावृत्ति:\u003c/b> चिल्का = सबसे बड़ा तटीय लैगून; सांभर = सबसे बड़ी अंतःस्थलीय खारे पानी की झील।"}],"q32":[{"en":"\u003cb>Turtle habitat:\u003c/b> Bhitarkanika and the nearby \u003cspan class=\"highlight-text\">Gahirmatha\u003c/span> coast in \u003cspan class=\"highlight-text\">Odisha\u003c/span> are famous for Olive Ridley turtle nesting.","hi":"\u003cb>कछुओं का आवास:\u003c/b> \u003cspan class=\"highlight-text\">ओडिशा\u003c/span> में भितरकनिका और पास का \u003cspan class=\"highlight-text\">गहिरमाथा\u003c/span> तट ओलिव रिडले कछुओं के घोंसले (nesting) के लिए प्रसिद्ध हैं।"},{"en":"\u003cb>Other wildlife:\u003c/b> Sundarbans is known for Bengal Tigers and mangroves; Harike attracts migratory birds; Loktak is known for \u003cspan class=\"highlight-text\">phumdis\u003c/span>.","hi":"\u003cb>अन्य वन्यजीव:\u003c/b> सुंदरबन बंगाल टाइगर्स और मैंग्रोव के लिए जाना जाता है; हरिके प्रवासी पक्षियों को आकर्षित करता है; लोकटक फुमदियों के लिए जाना जाता है।"}],"q33":[{"en":"\u003cb>When and where was the Ramsar Convention adopted?\u003c/b> 1971 — Ramsar, Iran","hi":"\u003cb>रामसर कन्वेंशन कब और कहाँ अपनाया गया?\u003c/b> 1971 — रामसर, ईरान"}],"q34":[{"en":"\u003cb>When is World Wetlands Day?\u003c/b> 2 February","hi":"\u003cb>विश्व आर्द्रभूमि दिवस कब है?\u003c/b> 2 फरवरी"}],"q35":[{"en":"\u003cb>When did India join the Ramsar Convention?\u003c/b> 1 February 1982","hi":"\u003cb>भारत रामसर कन्वेंशन में कब शामिल हुआ?\u003c/b> 1 फरवरी 1982"}],"q36":[{"en":"\u003cb>Which were India&#39;s first Ramsar Sites?\u003c/b> Chilika Lake and Keoladeo National Park","hi":"\u003cb>भारत के प्रथम रामसर स्थल कौन-से थे?\u003c/b> चिल्का झील और केवलादेव राष्ट्रीय उद्यान"}],"q37":[{"en":"\u003cb>What does the Montreux Record identify?\u003c/b> Ramsar Sites facing or threatened by adverse ecological change","hi":"\u003cb>मॉन्ट्रो रिकॉर्ड किन स्थलों की पहचान करता है?\u003c/b> प्रतिकूल पारिस्थितिक परिवर्तन का सामना कर रहे या उससे खतरे में पड़े रामसर स्थल"}],"q38":[{"en":"\u003cb>How many Ramsar Sites does India have as of October 2026?\u003c/b> 103","hi":"\u003cb>अक्टूबर 2026 तक भारत में कितने रामसर स्थल हैं?\u003c/b> 103"}],"q39":[{"en":"\u003cb>Which are the latest additions announced on 15 October 2026?\u003c/b> Sukhna Wetland and Sauj Jheel","hi":"\u003cb>15 अक्टूबर 2026 को घोषित नवीनतम स्थल कौन-से हैं?\u003c/b> सुखना वेटलैंड और सौज झील"}],"q40":[{"en":"\u003cb>Which two sites took India&#39;s tally to 98 in January 2026?\u003c/b> Chhari Dhand (Gujarat) and Patna Bird Sanctuary (Uttar Pradesh)","hi":"\u003cb>जनवरी 2026 में किन दो स्थलों से भारत की संख्या 98 हुई?\u003c/b> छारी-ढांड (गुजरात) और पटना पक्षी अभयारण्य (उत्तर प्रदेश)"}],"q41":[{"en":"\u003cb>Which was India&#39;s 99th Ramsar Site?\u003c/b> Shekha Jheel Bird Sanctuary — Aligarh, Uttar Pradesh","hi":"\u003cb>भारत का 99वाँ रामसर स्थल कौन-सा था?\u003c/b> शेखा झील पक्षी अभयारण्य — अलीगढ़, उत्तर प्रदेश"}],"q42":[{"en":"\u003cb>Which was India&#39;s 100th Ramsar Site?\u003c/b> Jai Prakash Narayan Bird Sanctuary (Surha Tal) — Ballia, Uttar Pradesh; announced 5 June 2026","hi":"\u003cb>भारत का 100वाँ रामसर स्थल कौन-सा था?\u003c/b> जय प्रकाश नारायण पक्षी अभयारण्य (सुरहा ताल) — बलिया, उत्तर प्रदेश; घोषणा 5 जून 2026"}],"q43":[{"en":"\u003cb>Where is Siliserh Lake, announced as a Ramsar Site in December 2025?\u003c/b> Alwar, Rajasthan","hi":"\u003cb>दिसंबर 2025 में रामसर स्थल घोषित सिलीसेढ़ झील कहाँ है?\u003c/b> अलवर, राजस्थान"}],"q44":[{"en":"\u003cb>Which was India&#39;s 101st Ramsar Site?\u003c/b> Glaw Lake — Arunachal Pradesh; announced 3 August 2026","hi":"\u003cb>भारत का 101वाँ रामसर स्थल कौन-सा था?\u003c/b> ग्लाव झील — अरुणाचल प्रदेश; घोषणा 3 अगस्त 2026"}],"q45":[{"en":"\u003cb>Where is Sukhna Wetland?\u003c/b> Chandigarh (UT); one of the two October 2026 additions","hi":"\u003cb>सुखना वेटलैंड कहाँ है?\u003c/b> चंडीगढ़ (केंद्र शासित प्रदेश); अक्टूबर 2026 में जोड़े गए दो स्थलों में से एक"}],"q46":[{"en":"\u003cb>Where is Sauj Jheel?\u003c/b> Mainpuri, Uttar Pradesh; one of the two October 2026 additions","hi":"\u003cb>सौज झील कहाँ है?\u003c/b> मैनपुरी, उत्तर प्रदेश; अक्टूबर 2026 में जोड़े गए दो स्थलों में से एक"}],"q47":[{"en":"\u003cb>Which is India&#39;s largest Ramsar Site?\u003c/b> Sundarbans Wetland — West Bengal","hi":"\u003cb>भारत का सबसे बड़ा रामसर स्थल कौन-सा है?\u003c/b> सुंदरबन वेटलैंड — पश्चिम बंगाल"}],"q48":[{"en":"\u003cb>Which is India&#39;s smallest Ramsar Site?\u003c/b> Renuka Wetland — Himachal Pradesh","hi":"\u003cb>भारत का सबसे छोटा रामसर स्थल कौन-सा है?\u003c/b> रेणुका वेटलैंड — हिमाचल प्रदेश"}],"q49":[{"en":"\u003cb>Which is India&#39;s largest coastal lagoon?\u003c/b> Chilika Lake — Odisha","hi":"\u003cb>भारत का सबसे बड़ा तटीय लैगून कौन-सा है?\u003c/b> चिल्का झील — ओडिशा"}],"q50":[{"en":"\u003cb>Which is India&#39;s largest inland salt lake?\u003c/b> Sambhar Lake — Rajasthan","hi":"\u003cb>भारत की सबसे बड़ी अंतःस्थलीय खारे पानी की झील कौन-सी है?\u003c/b> सांभर झील — राजस्थान"}],"q51":[{"en":"\u003cb>Where are the floating islands called phumdis found?\u003c/b> Loktak Lake — Manipur","hi":"\u003cb>फुमदी नामक तैरते द्वीप कहाँ मिलते हैं?\u003c/b> लोकटक झील — मणिपुर"}],"q52":[{"en":"\u003cb>Which is the world&#39;s only floating national park?\u003c/b> Keibul Lamjao National Park — Loktak Lake, Manipur","hi":"\u003cb>विश्व का एकमात्र तैरता राष्ट्रीय उद्यान कौन-सा है?\u003c/b> केइबुल लामजाओ राष्ट्रीय उद्यान — लोकटक झील, मणिपुर"}],"q53":[{"en":"\u003cb>Which is the largest freshwater lake in Northeast India?\u003c/b> Loktak Lake — Manipur","hi":"\u003cb>पूर्वोत्तर भारत की सबसे बड़ी मीठे पानी की झील कौन-सी है?\u003c/b> लोकटक झील — मणिपुर"}],"q54":[{"en":"\u003cb>Which important bird sanctuary is a Ramsar Site in Rajasthan?\u003c/b> Keoladeo National Park — Bharatpur, Rajasthan","hi":"\u003cb>राजस्थान का कौन-सा प्रमुख पक्षी अभयारण्य रामसर स्थल है?\u003c/b> केवलादेव राष्ट्रीय उद्यान — भरतपुर, राजस्थान"}],"q55":[{"en":"\u003cb>Which Ramsar area is associated with Olive Ridley turtle habitat?\u003c/b> Bhitarkanika Mangroves and nearby Gahirmatha coast — Odisha","hi":"\u003cb>कौन-सा रामसर क्षेत्र ओलिव रिडले कछुओं के आवास से संबंधित है?\u003c/b> भितरकनिका मैंग्रोव और निकटवर्ती गहिरमाथा तट — ओडिशा"}],"q56":[{"en":"\u003cb>Which Ramsar lake is one of Asia&#39;s largest freshwater lakes?\u003c/b> Wular Lake — Jammu and Kashmir","hi":"\u003cb>कौन-सी रामसर झील एशिया की सबसे बड़ी मीठे पानी की झीलों में से एक है?\u003c/b> वुलर झील — जम्मू और कश्मीर"}],"q57":[{"en":"\u003cb>Where is Chilika Lake?\u003c/b> Odisha","hi":"\u003cb>चिल्का झील कहाँ है?\u003c/b> ओडिशा"}],"q58":[{"en":"\u003cb>Where is Loktak Lake?\u003c/b> Manipur","hi":"\u003cb>लोकटक झील कहाँ है?\u003c/b> मणिपुर"}],"q59":[{"en":"\u003cb>Where is Wular Lake?\u003c/b> Jammu and Kashmir","hi":"\u003cb>वुलर झील कहाँ है?\u003c/b> जम्मू और कश्मीर"}],"q60":[{"en":"\u003cb>Where is Bhindawas Wildlife Sanctuary?\u003c/b> Haryana","hi":"\u003cb>भिंडावास वन्यजीव अभयारण्य कहाँ है?\u003c/b> हरियाणा"}],"q61":[{"en":"\u003cb>Where is Sultanpur National Park?\u003c/b> Haryana","hi":"\u003cb>सुल्तानपुर राष्ट्रीय उद्यान कहाँ है?\u003c/b> हरियाणा"}],"q62":[{"en":"\u003cb>Where is Khijadia Bird Sanctuary?\u003c/b> Gujarat","hi":"\u003cb>खिजाड़िया पक्षी अभयारण्य कहाँ है?\u003c/b> गुजरात"}],"q63":[{"en":"\u003cb>Where is Nalsarovar Bird Sanctuary?\u003c/b> Gujarat","hi":"\u003cb>नलसरोवर पक्षी अभयारण्य कहाँ है?\u003c/b> गुजरात"}],"q64":[{"en":"\u003cb>Where is Rudrasagar Lake?\u003c/b> Tripura","hi":"\u003cb>रुद्रसागर झील कहाँ है?\u003c/b> त्रिपुरा"}],"q65":[{"en":"\u003cb>Where is Bhitarkanika Mangroves?\u003c/b> Odisha","hi":"\u003cb>भितरकनिका मैंग्रोव कहाँ है?\u003c/b> ओडिशा"}],"q66":[{"en":"\u003cb>Where is Kolleru Lake?\u003c/b> Andhra Pradesh","hi":"\u003cb>कोल्लेरू झील कहाँ है?\u003c/b> आंध्र प्रदेश"}],"q67":[{"en":"\u003cb>Where is Sambhar Lake?\u003c/b> Rajasthan","hi":"\u003cb>सांभर झील कहाँ है?\u003c/b> राजस्थान"}],"q68":[{"en":"\u003cb>Where is Renuka Wetland?\u003c/b> Himachal Pradesh","hi":"\u003cb>रेणुका वेटलैंड कहाँ है?\u003c/b> हिमाचल प्रदेश"}],"q69":[{"en":"\u003cb>Where is Sundarbans Wetland?\u003c/b> West Bengal","hi":"\u003cb>सुंदरबन वेटलैंड कहाँ है?\u003c/b> पश्चिम बंगाल"}],"q70":[{"en":"\u003cb>Where is Vembanad-Kol Wetland?\u003c/b> Kerala","hi":"\u003cb>वेम्बनाड-कोल वेटलैंड कहाँ है?\u003c/b> केरल"}],"q71":[{"en":"\u003cb>Where is Ashtamudi Wetland?\u003c/b> Kerala","hi":"\u003cb>अष्टमुडी वेटलैंड कहाँ है?\u003c/b> केरल"}],"q72":[{"en":"\u003cb>Where is Keoladeo National Park?\u003c/b> Rajasthan","hi":"\u003cb>केवलादेव राष्ट्रीय उद्यान कहाँ है?\u003c/b> राजस्थान"}]}</script>

and and Sauj Jheel","hi":"सुखना वेटलैंड और सौज झील"},{"en":"Siliserh Lake and Kopra Jalashay","hi":"सिलीसेढ़ झील और कोपरा जलाशय"},{"en":"Udaipur Jheel and Gokul Jalashay","hi":"उदयपुर झील और गोकुल जलाशय"}],"a":{"en":"Sukhna Wetland and Sauj Jheel","hi":"सुखना वेटलैंड और सौज झील"},"exp":{"en":["**Sukhna Wetland:** [[Sukhna Wetland]] - [[Chandigarh]] (UT).","**Sauj Jheel:** [[Sauj Jheel]] - [[Mainpuri]], [[Uttar Pradesh]].","**India's total:** Total Ramsar sites in India - [[103]] (as of [[15 October 2026]])"],"hi":["**सुखना वेटलैंड:** [[सुखना वेटलैंड]] - [[चंडीगढ़]] (केंद्र शासित प्रदेश)।","**सौज झील:** [[सौज झील]] - [[मैनपुरी]], [[उत्तर प्रदेश]]।","**भारत का कुल:** भारत में कुल रामसर स्थल - [[103]] ([[15 अक्टूबर 2026]] तक)।"]},"exp_ref":"q1"},{"q":{"en":"Patna Bird Sanctuary, added to the Ramsar List in January 2026, is located in which district?","hi":"जनवरी 2026 में रामसर सूची में शामिल किया गया पटना पक्षी अभयारण्य किस जिले में स्थित है?"},"o":[{"en":"Etah, Uttar Pradesh","hi":"एटा, उत्तर प्रदेश"},{"en":"Patna, Bihar","hi":"पटना, बिहार"},{"en":"Etawah, Uttar Pradesh","hi":"इटावा, उत्तर प्रदेश"},{"en":"Jaipur, Rajasthan","hi":"जयपुर, राजस्थान"}],"a":{"en":"Etah, Uttar Pradesh","hi":"एटा, उत्तर प्रदेश"},"exp":{"en":["**Location:** Location: [[Jalesar]] tehsil, [[Etah]] district, [[Uttar Pradesh]].","**Announcement:** Inclusion announced on [[30 January 2026]]; the Ramsar designation date is a separate record.","**Wetland type:** Type: Freshwater wetland; important for migratory birds."],"hi":["**स्थान:** स्थान: [[जलेसर]] तहसील, [[एटा]] जिला, [[उत्तर प्रदेश]]।","**घोषणा:** शामिल होने की घोषणा [[30 जनवरी 2026]] को हुई; रामसर नामांकन तिथि अलग अभिलेख है।","**आर्द्रभूमि प्रकार:** प्रकार: मीठे पानी की आर्द्रभूमि; प्रवासी पक्षियों के लिए महत्वपूर्ण।"]},"exp_ref":"q2"},{"q":{"en":"What is the total number of Ramsar Sites in India as of October 2026?","hi":"अक्टूबर 2026 तक भारत में रामसर स्थलों की कुल संख्या कितनी है?"},"o":[{"en":"98","hi":"98"},{"en":"100","hi":"100"},{"en":"101","hi":"101"},{"en":"103","hi":"103"}],"a":{"en":"103","hi":"103"},"exp":{"en":["**India's total:** Total Ramsar Sites: [[103]] (October 2026).","**Latest additions:** Latest additions: [[Sukhna Wetland]] ([[Chandigarh]]) and [[Sauj Jheel]] ([[Uttar Pradesh]]).","**100th site:** [[100]]th Ramsar Site: [[Surha Tal]], [[Uttar Pradesh]]"],"hi":["**भारत का कुल:** कुल रामसर स्थल: [[103]] (अक्टूबर 2026)।","**नवीनतम स्थल:** नवीनतम शामिल स्थल: [[सुखना वेटलैंड]] ([[चंडीगढ़]]) और [[सौज झील]] ([[उत्तर प्रदेश]])।","**100वाँ स्थल:** [[100]]वाँ रामसर स्थल: [[सुरहा ताल]], [[उत्तर प्रदेश]]।"]},"exp_ref":"q3"},{"q":{"en":"Chhari-Dhand, added to India's Ramsar network in January 2026, is located in:","hi":"जनवरी 2026 में भारत के रामसर नेटवर्क में शामिल किया गया 'छारी-ढांड' कहाँ स्थित है?"},"o":[{"en":"Rajasthan","hi":"राजस्थान"},{"en":"Gujarat","hi":"गुजरात"},{"en":"Maharashtra","hi":"महाराष्ट्र"},{"en":"Haryana","hi":"हरियाणा"}],"a":{"en":"Gujarat","hi":"गुजरात"},"exp":{"en":["**Location:** Location: [[Kutch]] district, [[Gujarat]].","**Region:** Region: [[Banni]] grasslands, [[Kutch]].","**Bird habitat:** Significance: Important habitat for migratory birds."],"hi":["**स्थान:** स्थान: [[कच्छ]] जिला, [[गुजरात]]।","**क्षेत्र:** क्षेत्र: [[बन्नी]] घास के मैदान ([[Banni]] grasslands), [[कच्छ]]।","**पक्षी आवास:** महत्व: प्रवासी पक्षियों के लिए महत्वपूर्ण आवास।"]},"exp_ref":"q4"},{"q":{"en":"Which Article of the Ramsar Convention defines wetlands?","hi":"रामसर कन्वेंशन का कौन-सा अनुच्छेद (Article) आर्द्रभूमि (Wetlands) को परिभाषित करता है?"},"o":[{"en":"Article 1","hi":"अनुच्छेद 1"},{"en":"Article 2","hi":"अनुच्छेद 2"},{"en":"Article 3","hi":"अनुच्छेद 3"},{"en":"Article 6","hi":"अनुच्छेद 6"}],"a":{"en":"Article 1","hi":"अनुच्छेद 1"},"exp":{"en":["**Article 1:** [[Article 1]] of the [[Ramsar Convention]] contains the definition of wetlands, covering natural and artificial wetlands.","**Scope:** The Ramsar definition is broad, including marshes, peatlands, rivers, lakes and coastal areas.","**Marine waters:** It also covers marine waters whose depth at low tide does not exceed [[6 m]]."],"hi":["**अनुच्छेद 1:** [[रामसर कन्वेंशन]] के [[अनुच्छेद 1]] में आर्द्रभूमि की परिभाषा दी गई है, जिसमें प्राकृतिक और कृत्रिम दोनों आर्द्रभूमियाँ शामिल हैं।","**दायरा:** रामसर की परिभाषा व्यापक है, जिसमें दलदल (marshes), पीटलैंड, नदियाँ, झीलें और तटीय क्षेत्र शामिल हैं।","**समुद्री जल:** इसमें ऐसे समुद्री जल क्षेत्र भी शामिल हैं जिनकी गहराई निम्न ज्वार के समय [[6 मीटर]] से अधिक नहीं होती।"]},"exp_ref":"q5"},{"q":{"en":"The Ramsar Convention is related to the conservation of:","hi":"रामसर कन्वेंशन किसके संरक्षण से संबंधित है?"},"o":[{"en":"Forests","hi":"वन (Forests)"},{"en":"Grasslands","hi":"घास के मैदान (Grasslands)"},{"en":"Wetlands","hi":"आर्द्रभूमि (Wetlands)"},{"en":"Coral Reefs","hi":"प्रवाल भित्तियाँ (Coral Reefs)"}],"a":{"en":"Wetlands","hi":"आर्द्रभूमि (Wetlands)"},"exp":{"en":["**Purpose:** [[Ramsar Convention]] is an international treaty for the conservation and wise use of wetlands.","**Adoption:** Adopted in [[1971]] at Ramsar, Iran.","**Global treaty:** It is the only global treaty exclusively dedicated to wetlands."],"hi":["**उद्देश्य:** [[रामसर कन्वेंशन]] आर्द्रभूमियों के संरक्षण और विवेकपूर्ण उपयोग के लिए एक अंतरराष्ट्रीय संधि है।","**अंगीकरण:** इसे [[1971]] में ईरान के रामसर शहर में अपनाया गया था।","**वैश्विक संधि:** यह विशेष रूप से आर्द्रभूमियों को समर्पित एकमात्र वैश्विक संधि है।"]},"exp_ref":"q6"},{"q":{"en":"India became a contracting party to the Ramsar Convention in:","hi":"भारत किस वर्ष रामसर कन्वेंशन का अनुबंधित पक्ष (Contracting Party) बना?"},"o":[{"en":"1971","hi":"1971"},{"en":"1975","hi":"1975"},{"en":"1982","hi":"1982"},{"en":"1991","hi":"1991"}],"a":{"en":"1982","hi":"1982"},"exp":{"en":["**India's accession:** India joined the [[Ramsar Convention]] on [[1 February 1982]].","**Asian network:** India now has one of the largest networks of Ramsar Sites in Asia.","**Conservation:** Wetland conservation efforts expanded significantly after joining."],"hi":["**भारत का प्रवेश:** भारत [[1 फरवरी 1982]] को [[रामसर कन्वेंशन]] में शामिल हुआ।","**एशियाई नेटवर्क:** अब एशिया में रामसर स्थलों के सबसे बड़े नेटवर्कों में से एक भारत में है।","**संरक्षण:** इस संधि में शामिल होने के बाद भारत में आर्द्रभूमि संरक्षण के प्रयासों में काफी विस्तार हुआ।"]},"exp_ref":"q7"},{"q":{"en":"Which of the following was among the first Ramsar Sites in India?","hi":"निम्नलिखित में से कौन-सा भारत के प्रथम रामसर स्थलों में से एक था?"},"o":[{"en":"Wular Lake","hi":"वुलर झील"},{"en":"Loktak Lake","hi":"लोकटक झील"},{"en":"Chilika Lake","hi":"चिल्का झील"},{"en":"Bhoj Wetland","hi":"भोज वेटलैंड"}],"a":{"en":"Chilika Lake","hi":"चिल्का झील"},"exp":{"en":["**First sites:** [[Chilika Lake]] was among the first Ramsar Sites designated in India.","**Location:** Located in [[Odisha]].","**Coastal lagoon:** It is India's largest coastal lagoon."],"hi":["**प्रथम स्थल:** [[चिल्का झील]] भारत में नामित किए गए पहले रामसर स्थलों में से एक थी।","**स्थान:** यह [[ओडिशा]] में स्थित है।","**तटीय लैगून:** यह भारत का सबसे बड़ा तटीय लैगून (Coastal Lagoon) है।"]},"exp_ref":"q8"},{"q":{"en":"The largest Ramsar Site in India is:","hi":"भारत का सबसे बड़ा रामसर स्थल कौन-सा है?"},"o":[{"en":"Wular Lake","hi":"वुलर झील"},{"en":"Sundarbans Wetland","hi":"सुंदरबन वेटलैंड"},{"en":"Chilika Lake","hi":"चिल्का झील"},{"en":"Loktak Lake","hi":"लोकटक झील"}],"a":{"en":"Sundarbans Wetland","hi":"सुंदरबन वेटलैंड"},"exp":{"en":["**Location:** Located in [[West Bengal]].","**Area ranking:** Largest Ramsar Site in India.","**Wildlife:** Famous for mangrove forests and Royal Bengal Tigers."],"hi":["**स्थान:** [[पश्चिम बंगाल]] में स्थित है।","**क्षेत्रफल क्रम:** यह भारत का सबसे बड़ा रामसर स्थल है।","**वन्यजीव:** मैंग्रोव वनों और रॉयल बंगाल टाइगर के लिए प्रसिद्ध है।"]},"exp_ref":"q9"},{"q":{"en":"The smallest Ramsar Site in India is:","hi":"भारत का सबसे छोटा रामसर स्थल कौन-सा है?"},"o":[{"en":"Renuka Wetland","hi":"रेणुका वेटलैंड"},{"en":"Bhoj Wetland","hi":"भोज वेटलैंड"},{"en":"Deepor Beel","hi":"दीपोर बील"},{"en":"Surinsar-Mansar Lakes","hi":"सुरिनसर-मानसर झीलें"}],"a":{"en":"Renuka Wetland","hi":"रेणुका वेटलैंड"},"exp":{"en":["**Location:** Located in Sirmaur district, [[Himachal Pradesh]].","**Area ranking:** Smallest Ramsar Site in India.","**Lake:** Associated with Renuka Lake."],"hi":["**स्थान:** [[हिमाचल प्रदेश]] के सिरमौर जिले में स्थित है।","**क्षेत्रफल क्रम:** यह भारत का सबसे छोटा रामसर स्थल है।","**झील:** यह रेणुका झील से संबंधित है।"]},"exp_ref":"q10"},{"q":{"en":"Loktak Lake, a Ramsar Site, is situated in:","hi":"लोकटक झील, जो एक रामसर स्थल है, कहाँ स्थित है?"},"o":[{"en":"Assam","hi":"असम"},{"en":"Tripura","hi":"त्रिपुरा"},{"en":"Manipur","hi":"मणिपुर"},{"en":"Meghalaya","hi":"मेघालय"}],"a":{"en":"Manipur","hi":"मणिपुर"},"exp":{"en":["**Freshwater lake:** Largest freshwater lake in Northeast India.","**Phumdis:** Famous for floating islands called [[phumdis]].","**National park:** Hosts [[Keibul Lamjao National Park]]."],"hi":["**मीठे पानी की झील:** पूर्वोत्तर भारत की सबसे बड़ी मीठे पानी की झील है।","**फुमदी:** '[[फुमदी]]' (Phumdis) नामक तैरते हुए द्वीपों के लिए प्रसिद्ध है।","**राष्ट्रीय उद्यान:** यहाँ [[केइबुल लामजाओ राष्ट्रीय उद्यान]] स्थित है।"]},"exp_ref":"q11"},{"q":{"en":"The Wular Lake is located in:","hi":"वुलर झील कहाँ स्थित है?"},"o":[{"en":"Himachal Pradesh","hi":"हिमाचल प्रदेश"},{"en":"Uttarakhand","hi":"उत्तराखंड"},{"en":"Jammu & Kashmir","hi":"जम्मू और कश्मीर"},{"en":"Punjab","hi":"पंजाब"}],"a":{"en":"Jammu & Kashmir","hi":"जम्मू और कश्मीर"},"exp":{"en":["**Freshwater lake:** One of Asia's largest freshwater lakes.","**Location:** Located in the Kashmir Valley.","**Benefits:** Important for flood control and fisheries."],"hi":["**मीठे पानी की झील:** एशिया की सबसे बड़ी मीठे पानी की झीलों में से एक है।","**स्थान:** कश्मीर घाटी में स्थित है।","**लाभ:** बाढ़ नियंत्रण और मत्स्य पालन के लिए महत्वपूर्ण है।"]},"exp_ref":"q12"},{"q":{"en":"Which Ramsar Site is famous for floating islands called \"Phumdis\"?","hi":"कौन-सा rly known as Bharatpur Bird Sanctuary.","**World Heritage:** UNESCO World Heritage Site."],"hi":["**स्थान:** भरतपुर, [[राजस्थान]] में स्थित है।","**पुराना नाम:** पूर्व में इसे भरतपुर पक्षी अभयारण्य के नाम से जाना जाता था।","**विश्व धरोहर:** यह यूनेस्को विश्व धरोहर स्थल (UNESCO World Heritage Site) भी है।"]},"exp_ref":"q15"},{"q":{"en":"Which of the following is NOT a function of wetlands?","hi":"निम्नलिखित में से कौन-सा आर्द्रभूमि (Wetlands) का कार्य नहीं है?"},"o":[{"en":"Flood control","hi":"बाढ़ नियंत्रण (Flood control)"},{"en":"Groundwater recharge","hi":"भूजल पुनर्भरण (Groundwater recharge)"},{"en":"Carbon sequestration","hi":"कार्बन पृथक्करण (Carbon sequestration)"},{"en":"Ozone depletion","hi":"ओजोन क्षरण (Ozone depletion)"}],"a":{"en":"Ozone depletion","hi":"ओजोन क्षरण (Ozone depletion)"},"exp":{"en":["**Flood control:** [[Wetlands]] absorb excess rainwater and reduce floods.","**Groundwater:** Recharge groundwater reserves.","**Climate:** Store carbon and help regulate climate."],"hi":["**बाढ़ नियंत्रण:** आर्द्रभूमियाँ अतिरिक्त वर्षा जल को सोखती हैं और बाढ़ को कम करती हैं।","**भूजल:** भूजल भंडार को रिचार्ज (पुनर्भरण) करती हैं।","**जलवायु:** कार्बन को संग्रहीत करती हैं और जलवायु को नियंत्रित करने में मदद करती हैं।"]},"exp_ref":"q16"},{"q":{"en":"Which wetland became India's 100th Ramsar Site in June 2026?","hi":"जून 2026 में कौन-सी आर्द्रभूमि भारत का 100वाँ रामसर स्थल बनी?"},"o":[{"en":"Siliserh Lake","hi":"सिलीसेढ़ झील"},{"en":"Jai Prakash Narayan Bird Sanctuary (Surha Tal)","hi":"जय प्रकाश नारायण पक्षी अभयारण्य (सुरहा ताल)"},{"en":"Patna Bird Sanctuary","hi":"पटना पक्षी अभयारण्य"},{"en":"Kopra Jalashay","hi":"कोपरा जलाशय"}],"a":{"en":"Jai Prakash Narayan Bird Sanctuary (Surha Tal)","hi":"जय प्रकाश नारायण पक्षी अभयारण्य (सुरहा ताल)"},"exp":{"en":["**100th site:** [[100]]th Ramsar Site: [[Surha Tal]].","**Location:** Location: [[Ballia]], [[Uttar Pradesh]].","**Announcement:** India's [[100]]th site was announced on [[5 June 2026]].","**Official name:** Offi ocation: Near Ahmedabad, [[Gujarat]]"],"hi":["**स्थान:** [[नलसरोवर पक्षी अभयारण्य]] - [[गुजरात]]।","**नामांकन:** रामसर स्थल दर्जा: [[2012]]।","**आर्द्रभूमि प्रकार:** प्रकार: प्राकृतिक मीठे पानी की झील और आर्द्रभूमि।","**पक्षी आवास:** प्रसिद्धि: प्रवासी पक्षियों के लिए।","**निकटवर्ती शहर:** स्थान: अहमदाबाद के पास, [[गुजरात]]।"]},"exp_ref":"q21"},{"q":{"en":"Assertion (A): Ramsar Sites are recognized for their international importance. Reason (R): They support biodiversity and ecological balance.","hi":"अभिकथन (A): रामसर स्थलों को उनके अंतरराष्ट्रीय महत्व के लिए मान्यता दी जाती है। कारण (R): वे जैव विविधता और पारिस्थितिक संतुलन का समर्थन करते हैं।"},"o":[{"en":"Both A and R are true and R is the correct explanation of A.","hi":"A और R दोनों सत्य हैं और R, A की सही व्याख्या है।"},{"en":"Both A and R are true but R is not the correct explanation of A.","hi":"A और R दोनों सत्य हैं लेकिन R, A की सही व्याख्या नहीं है।"},{"en":"A is true but R is false.","hi":"A सत्य है लेकिन R असत्य है।"},{"en":"A is false but R is true.","hi":"A असत्य है लेकिन R सत्य है।"}],"a":{"en":"Both A and R are true and R is the correct explanation of A.","hi":"A और R दोनों सत्य हैं और R, A की सही व्याख्या है।"},"exp":{"en":["**Habitats:** Ramsar Sites protect habitats of migratory birds and endangered species.","**Ecosystem services:** They maintain ecological balance and ecosystem services.","**Selection criteria:** Biodiversity value is one of the major criteria for Ramsar designation."],"hi":["**आवास:** रामसर स्थल प्रवासी पक्षियों और लुप्तप्राय प्रजातियों के आवासों की रक्षा करते हैं।","**पारिस्थितिकी सेवाएँ:** वे पारिस्थितिक संतुलन और पारिस्थितिकी तंत्र सेवाओं को बनाए रखते हैं।","**चयन मानदंड:** रामसर दर्जे के लिए जैव विविधता मूल्य प्रमुख मानदंडों में से एक है।"]},"exp_ref":"q22"},{"q":{"en":"Which international treaty focuses on the conservation and sustainable use of wetlands?","hi":"कौन-सी अंतरराष्ट्रीय संधि आर्द्रभूमियों के संरक्षण और सतत उपयोग पर केंद्रित है?"},"o":[{"en":"Kyoto Protocol","hi":"क्योटो प्रोटोकॉल"},{"en":"Ramsar Convention","hi":"रामसर कन्वेंशन"},{"en":"Paris Agreement","hi":"पेरिस समझौता"},{"en":"Montreal Protocol","hi":"मॉन्ट्रियल प्रोटोकॉल"}],"a":{"en":"Ramsar Convention","hi":"रामसर कन्वेंशन"},"exp":{"en":["**Wetland treaty:** [[Ramsar Convention]] ([[1971]], Ramsar, Iran) is the only treaty dedicated specifically to wetlands.","**Other treaties:** Kyoto Protocol and Paris Agreement deal with climate change; Montreal Protocol deals with the ozone layer.","**Revision:** Ramsar = [[Wetlands]]; Montreal = Ozone; Kyoto and Paris = Climate change."],"hi":["**आर्द्रभूमि संधि:** [[रामसर कन्वेंशन]] ([[1971]], रामसर, ईरान) विशेष रूप से आर्द्रभूमियों को समर्पित एकमात्र संधि है।","**अन्य संधियाँ:** क्योटो प्रोटोकॉल और पेरिस समझौता जलवायु परिवर्तन से संबंधित हैं; मॉन्ट्रियल प्रोटोकॉल ओजोन परत से संबंधित है।","**पुनरावृत्ति:** संक्षेप में: रामसर = आर्द्रभूमि; मॉन्ट्रियल = ओजोन परत; क्योटो और पेरिस = जलवायु परिवर्तन।"]},"exp_ref":"q23"},{"q":{"en":"When is World Wetlands Day celebrated annually?","hi":"विश्व आर्द्रभूमि दिवस (World Wetlands Day) प्रतिवर्ष कब मनाया जाता है?"},"o":[{"en":"1 February","hi":"1 फरवरी"},{"en":"4 February","hi":"4 फरवरी"},{"en":"3 February","hi":"3 फरवरी"},{"en":"2 February","hi":"2 फरवरी"}],"a":{"en":"2 February","hi":"2 फरवरी"},"exp":{"en":["**Wetlands Day:** Celebrated every year on [[2 February]]; marks the adoption of the [[Ramsar Convention]] in [[1971]].","**Earth Day:** 22 April - Earth Day;","**Environment Day:** 5 June - World Environment Day.","**Water Day:** 22 March - World Water Day."],"hi":["**आर्द्रभूमि दिवस:** हर साल [[2 फरवरी]] को मनाया जाता है; यह [[1971]] में [[रामसर कन्वेंशन]] को अपनाए जाने की स्मृति में मनाया जाता है।","**पृथ्वी दिवस:** 22 अप्रैल - पृथ्वी दिवस (Earth Day);","**पर्यावरण दिवस:** 5 जून - विश्व पर्यावरण दिवस (World Environment Day);","**जल दिवस:** 22 मार्च - विश्व जल दिवस (World Water Day)।"]},"exp_ref":"q24"},{"q":{"en":"Which country has the highest number of Ramsar Sites in the world?","hi":"विश्व में सबसे अधिक रामसर स्थल किस देश में हैं?"},"o":[{"en":"United Kingdom","hi":"यूनाइटेड किंगडम (UK)"},{"en":"United States","hi":"संयुक्त राज्य अमेरिका (USA)"},{"en":"Bolivia","hi":"बोलीविया"},{"en":"Australia","hi":"ऑस्ट्रेलिया"}],"a":{"en":"United Kingdom","hi":"यूनाइटेड किंगडम (UK)"},"exp":{"en":["**First rank:** First: [[United Kingdom]] — [[176]] sites.","**Second rank:** Second: [[Mexico]] — [[144]] sites.","**Third rank:** Third: India — [[103]] sites as of October 2026; the highest number in Asia."],"hi":["**प्रथम स्थान:** प्रथम: [[यूनाइटेड किंगडम]] — [[176]] स्थल।","**द्वितीय स्थान:** द्वितीय: [[मेक्सिको]] — [[144]] स्थल।","**तृतीय स्थान:** तृतीय: भारत — अक्टूबर 2026 तक [[103]] स्थल; एशिया में सर्वाधिक।"]},"exp_ref":"q25"},{"q":{"en":"Deepor Beel is located in:","hi":"दीपोर बील (Deepor Beel) कहाँ स्थित है?"},"o":[{"en":"West Bengal","hi":"पश्चिम बंगाल"},{"en":"Odisha","hi":"ओडिशा"},{"en":"Assam","hi":"असम"},{"en":"Chhattisgarh","hi":"छत्तीसगढ़"}],"a":{"en":"Assam","hi":"असम"},"exp":{"en":["**Location:** Deepor Beel is a freshwater lake and bird habitat near Guwahati, [[Assam]].","**Other sites:** [[West Bengal]] has East Kolkata [[Wetlands]] and Sundarbans; [[Odisha]] has [[Chilika Lake]] and Bhitarkanika.","**Revision:** Deepor Beel — [[Assam]] — Guwahati."],"hi":["**स्थान:** दीपोर बील गुवाहाटी, [[असम]] के पास एक मीठे पानी की झील और पक्षी आवास है।","**अन्य स्थल:** [[पश्चिम बंगाल]] में ईस्ट कोलकाता वेटलैंड्स और सुंदरबन हैं; [[ओडिशा]] में [[चिल्का झील]] और भितरकनिका हैं।","**पुनरावृत्ति:** दीपोर बील — [[असम]] — गुवाहाटी।"]},"exp_ref":"q26"},{"q":{"en":"Which among the following is a Glacial Wetland?","hi":"निम्नलिखित में से कौन-सी एक हिमनद आर्द्रभूमि (Glacial Wetland) है?"},"o":[{"en":"Nilnag (Kashmir)","hi":"नीलनाग (कश्मीर)"},{"en":"Chandertal (Himachal Pradesh)","hi":"चंद्रताल (हिमाचल प्रदेश)"},{"en":"Rudrasagar (Tripura)","hi":"रुद्रसागर (त्रिपुरा)"},{"en":"Loktak (Manipur)","hi":"लोकटक (मणिपुर)"}],"a":{"en":"Chandertal (Himachal Pradesh)","hi":"चंद्रताल (हिमाचल प्रदेश)"},"exp":{"en":["**Glacial lake:** Chandertal is a high-altitude glacial lake in [[Himachal Pradesh]], known as the \"Moon Lake\".","**Other lakes:** Nilnag is a freshwater lake in Kashmir; Rudrasagar is a floodplain lake in [[Tripura]].","**Phumdis:** Loktak is a freshwater wetland famous for its floating [[phumdis]]."],"hi":["**हिमनद झील:** चंद्रताल [[हिमाचल प्रदेश]] में अधिक ऊँचाई पर स्थित एक हिमनद झील (glacial lake) है, जिसे \"मून लेक\" (Moon Lake) भी कहा जाता है।","**अन्य झीलें:** नीलनाग कश्मीर में मीठे पानी की झील है; रुद्रसागर [[त्रिपुरा]] में बाढ़ के मैदान की झील है।","**फुमदी:** लोकटक अपनी तैरती हुई फुमदियों के लिए प्रसिद्ध मीठे पानी की आर्द्रभूमि है।"]},"exp_ref":"q27"},{"q":{"en":"The wetland of Ashtamudi is located in:","hi":"अष्टमुडी (Ashtamudi) आर्द्रभूमि कहाँ स्थित है?"},"o":[{"en":"Kerala","hi":"केरल"},{"en":"Karnataka","hi":"कर्नाटक"},{"en":"Tamil Nadu","hi":"तमिलनाडु"},{"en":"Assam","hi":"असम"}],"a":{"en":"Kerala","hi":"केरल"},"exp":{"en":["**Location and type:** [[Ashtamudi Wetland]] is located in [[Kerala]] and is known for its backwaters and estuarine ecosystem.","**Karnataka:** Karnataka has Ranganathittu Bird Sanctuary;","**Tamil Nadu:** [[Tamil Nadu]] has Point Calimere and Pallikaranai Marsh."],"hi":["**स्थान और प्रकार:** अष्टमुडी आर्द्रभूमि [[केरल]] में स्थित है और अपने बैकवाटर और मुहाना (estuarine) पारिस्थितिकी तंत्र के लिए जानी जाती है।","**कर्नाटक:** कर्नाटक में रंगनाथिट्टू पक्षी अभयारण्य है;","**तमिलनाडु:** [[तमिलनाडु]] में प्वाइंट कैलिमेरे और पल्लिकरनई मार्श हैं।"]},"exp_ref":"q28"},{"q":{"en":"Which Ramsar Site is a man-made wetland famous for birdwatching?","hi":"कौन-सा रामसर स्थल पक्षी अवलोकन (birdwatching) के लिए प्रसिद्ध एक मानव-निर्मित आर्द्रभूमि है?"},"o":[{"en":"Sundarbans Wetland","hi":"सुंदरबन वेटलैंड"},{"en":"Keoladeo National Park","hi":"केवलादेव राष्ट्रीय उद्यान"},{"en":"Wular Lake","hi":"वुलर झील"},{"en":"Bhitarkanika","hi":"भितरकनिका"}],"a":{"en":"Keoladeo National Park","hi":"केवलादेव राष्ट्रीय उद्यान"},"exp":{"en":["**Human-made wetland:** [[Keoladeo National Park]] was developed through human-made water management and is famous for migratory birds."],"hi":["**मानव निर्मित आर्द्रभूमि:** [[केवलादेव राष्ट्रीय उद्यान]] को मानव-निर्मित जल प्रबंधन के माध्यम से विकसित किया गया था और यह प्रवासी पक्षियों के लिए प्रसिद्ध है।"]},"exp_ref":"q29"},{"q":{"en":"Which Ramsar Site in India is located in Punjab?","hi":"भारत का कौन-सा रामसर स्थल पंजाब में स्थित है?"},"o":[{"en":"Ashtamudi Wetland","hi":"अष्टमुडी वेटलैंड"},{"en":"Deepor Beel","hi":"दीपोर बील"},{"en":"Bhoj Wetland","hi":"भोज वेटलैंड"},{"en":"Harike Wetland","hi":"हरिके वेटलैंड"}],"a":{"en":"Harike Wetland","hi":"हरिके वेटलैंड"},"exp":{"en":["**River confluence:** [[Harike Wetland]] is located at the confluence of the [[Beas and Sutlej]] rivers in Punjab.","**Other sites:** Deepor Beel is in [[Assam]]; Bhoj Wetland is in Madhya Pradesh; Ashtamudi is in [[Kerala]]."],"hi":["**नदी संगम:** [[हरिके वेटलैंड]] पंजाब में [[ब्यास और सतलुज]] नदियों के संगम पर स्थित है।","**अन्य स्थल:** दीपोर बील [[असम]] में है; भोज वेटलैंड मध्य प्रदेश में है; अष्टमुडी [[केरल]] में है।"]},"exp_ref":"q30"},{"q":{"en":"Which Ramsar Site in India is the largest coastal lagoon?","hi":"भारत का कौन-सा रामसर स्थल सबसे बड़ा तटीय लैगून (Coastal Lagoon) है?"},"o":[{"en":"Chilika Lake","hi":"चिल्का झील"},{"en":"Vembanad-Kol Wetland","hi":"वेम्बनाड-कोल वेटलैंड"},{"en":"Ashtamudi Wetland","hi":"अष्टमुडी वेटलैंड"},{"en":"Sambhar Lake","hi":"सांभर झील"}],"a":{"en":"Chilika Lake","hi":"चिल्का झील"},"exp":{"en":["**Coastal lagoon:** [[Chilika Lake]] ([[Odisha]]) is the largest coastal lagoon in India.","**Kerala wetlands:** Vembanad is the largest lake in [[Kerala]]; Ashtamudi is an estuarine wetland in [[Kerala]].","**Revision:** Chilika = Largest Coastal Lagoon; Sambhar = Largest Inland Salt Lake."],"hi":["**तटीय लैगून:** [[चिल्का झील]] ([[ओडिशा]]) भारत का सबसे बड़ा तटीय लैगून है।","**केरल की आर्द्रभूमियाँ:** वेम्बनाड [[केरल]] की सबसे बड़ी झील है; अष्टमुडी [[केरल]] में एक मुहाना आर्द्रभूमि है।","**पुनरावृत्ति:** चिल्का = सबसे बड़ा तटीय लैगून; सांभर = सबसे बड़ी अंतःस्थलीय खारे पानी की झील।"]},"exp_ref":"q31"},{"q":{"en":"Which Odisha Ramsar Site is associated with Olive Ridley turtles and the nearby Gahirmatha coast?","hi":"ओडिशा का कौन-सा रामसर स्थल ओलिव रिडले कछुओं और निकटवर्ती गहिरमाथा तट से संबंधित है?"},"o":[{"en":"Loktak Lake","hi":"लोकटक झील"},{"en":"Sundarbans Wetland","hi":"सुंदरबन वेटलैंड"},{"en":"Harike Wetland","hi":"हरिके वेटलैंड"},{"en":"Bhitarkanika Mangroves","hi":"भितरकनिका मैंग्रोव"}],"a":{"en":"Bhitarkanika Mangroves","hi":"भितरकनिका मैंग्रोव"},"exp":{"en":["**Turtle habitat:** Bhitarkanika and the nearby [[Gahirmatha]] coast in [[Odisha]] are famous for Olive Ridley turtle nesting.","**Other wildlife:** Sundarbans is known for Bengal Tigers and mangroves; Harike attracts migratory birds; Loktak is known for [[phumdis]]."],"hi":["**कछुओं का आवास:** [[ओडिशा]] में भितरकनिका और पास का [[गहिरमाथा]] तट ओलिव रिडले कछुओं के घोंसले (nesting) के लिए प्रसिद्ध हैं।","**अन्य वन्यजीव:** सुंदरबन बंगाल टाइगर्स और मैंग्रोव के लिए जाना जाता है; हरिके प्रवासी पक्षियों को आकर्षित करता है; लोकटक फुमदियों के लिए जाना जाता है।"]},"exp_ref":"q32"}]},{"title":{"en":"Explanation Facts 1","hi":"व्याख्या के तथ्य 1"},"questions":[{"q":{"en":"Sukhna Wetland belongs to which Union Territory?","hi":"सुखना वेटलैंड किस केंद्र शासित प्रदेश में है?"},"o":[{"en":"Chandigarh","hi":"चंडीगढ़"},{"en":"Delhi","hi":"दिल्ली"},{"en":"Ladakh","hi":"लद्दाख"},{"en":"Puducherry","hi":"पुदुचेरी"}],"a":{"en":"Chandigarh","hi":"चंडीगढ़"},"exp":{"en":["**Sukhna Wetland:** [[Sukhna Wetland]] - [[Chandigarh]] (UT).","**Sauj Jheel:** [[Sauj Jheel]] - [[Mainpuri]], [[Uttar Pradesh]].","**India's total:** Total Ramsar sites in India - [[103]] (as of [[15 October 2026]])"],"hi":["**सुखना वेटलैंड:** [[सुखना वेटलैंड]] - [[चंडीगढ़]] (केंद्र शासित प्रदेश)।","**सौज झील:** [[सौज झील]] - [[मैनपुरी]], [[उत्तर प्रदेश]]।","**भारत का कुल:** भारत में कुल रामसर स्थल - [[103]] ([[15 अक्टूबर 2026]] तक)।"]},"exp_ref":"q1"},{"q":{"en":"Sauj Jheel is in which district of Uttar Pradesh?","hi":"सौज झील उत्तर प्रदेश के किस जिले में है?"},"o":[{"en":"Etah","hi":"एटा"},{"en":"Ballia","hi":"बलिया"},{"en":"Aligarh","hi":"अलीगढ़"},{"en":"Mainpuri","hi":"मैनपुरी"}],"a":{"en":"Mainpuri","hi":"मैनपुरी"},"exp":{"en":["**Sukhna Wetland:** [[Sukhna Wetland]] - [[Chandigarh]] (UT).","**Sauj Jheel:** [[Sauj Jheel]] - [[Mainpuri]], [[Uttar Pradesh]].","**India's total:** Total Ramsar sites in India - [[103]] (as of [[15 October 2026]])"],"hi":["**सुखना वेटलैंड:** [[सुखना वेटलैंड]] - [[चंडीगढ़]] (केंद्र शासित प्रदेश)।","**सौज झील:** [[सौज झील]] - [[मैनपुरी]], [[उत्तर प्रदेश]]।","**भारत का कुल:** भारत में कुल रामसर स्थल - [[103]] ([[15 अक्टूबर 2026]] तक)।"]},"exp_ref":"q1"},{"q":{"en":"Patna Bird Sanctuary is in which tehsil of Etah?","hi":"पटना पक्षी अभयारण्य एटा की किस तहसील में है?"},"o":[{"en":"Aliganj","hi":"अलीगंज"},{"en":"Kasganj","hi":"कासगंज"},{"en":"Jalesar","hi":"जलेसर"},{"en":"Sadar","hi":"सदर"}],"a":{"en":"Jalesar","hi":"जलेसर"},"exp":{"en":["**Location:** Location: [[Jalesar]] tehsil, [[Etah]] district, [[Uttar Pradesh]].","**Announcement:** Inclusion announced on [[30 January 2026]]; the Ramsar designation date is a separate record.","**Wetland type:** Type: Freshwater wetland; important for migratory birds."],"hi":["**स्थान:** स्थान: [[जलेसर]] तहसील, [[एटा]] जिला, [[उत्तर प्रदेश]]।","**घोषणा:** शामिल होने की घोषणा [[30 जनवरी 2026]] को हुई; रामसर नामांकन तिथि अलग अभिलेख है।","**आर्द्रभूमि प्रकार:** प्रकार: मीठे पानी की आर्द्रभूमि; प्रवासी पक्षियों के लिए महत्वपूर्ण।"]},"exp_ref":"q2"},{"q":{"en":"Chhari Dhand is located in which district?","hi":"छारी-ढांड किस जिले में स्थित है?"},"o":[{"en":"Rajkot","hi":"राजकोट"},{"en":"Kutch","hi":"कच्छ"},{"en":"Ahmedabad","hi":"अहमदाबाद"},{"en":"Jamnagar","hi":"जामनगर"}],"a":{"en":"Kutch","hi":"कच्छ"},"exp":{"en":["**Location:** Location: [[Kutch]] district, [[Gujarat]].","**Region:** Region: [[Banni]] grasslands, [[Kutch]].","**Bird habitat:** Significance: Important habitat for migratory birds."],"hi":["**स्थान:** स्थान: [[कच्छ]] जिला, [[गुजरात]]।","**क्षेत्र:** क्षेत्र: [[बन्नी]] घास के मैदान ([[Banni]] grasslands), [[कच्छ]]।","**पक्षी आवास:** महत्व: प्रवासी पक्षियों के लिए महत्वपूर्ण आवास।"]},"exp_ref":"q4"},{"q":{"en":"Chhari Dhand is associated with which grassland region?","hi":"छारी-ढांड किस घासभूमि क्षेत्र से संबंधित है?"},"o":[{"en":"Banni","hi":"बन्नी"},{"en":"Terai","hi":"तराई"},{"en":"Bhabar","hi":"भाबर"},{"en":"Shola","hi":"शोला"}],"a":{"en":"Banni","hi":"बन्नी"},"exp":{"en":["**Location:** Location: [[Kutch]] district, [[Gujarat]].","**Region:** Region: [[Banni]] grasslands, [[Kutch]].","**Bird habitat:** Significance: Important habitat for migratory birds."],"hi":["**स्थान:** स्थान: [[कच्छ]] जिला, [[गुजरात]]।","**क्षेत्र:** क्षेत्र: [[बन्नी]] घास के मैदान ([[Banni]] grasslands), [[कच्छ]]।","**पक्षी आवास:** महत्व: प्रवासी पक्षियों के लिए महत्वपूर्ण आवास।"]},"exp_ref":"q4"},{"q":{"en":"Under Article 1, marine waters are included up to what depth at low tide?","hi":"अनुच्छेद 1 में निम्न ज्वार के समय कितनी गहराई तक के समुद्री जल शामिल हैं?"},"o":[{"en":"10 m","hi":"10 मीटर"},{"en":"20 m","hi":"20 मीटर"},{"en":"50 m","hi":"50 मीटर"},{"en":"6 m","hi":"6 मीटर"}],"a":{"en":"6 m","hi":"6 मीटर"},"exp":{"en":["**Article 1:** [[Article 1]] of the [[Ramsar Convention]] contains the definition of wetlands, covering natural and artificial wetlands.","**Scope:** The Ramsar definition is broad, including marshes, peatlands, rivers, lakes and coastal areas.","**Marine waters:** It also covers marine waters whose depth at low tide does not exceed [[6 m]]."],"hi":["**अनुच्छेद 1:** [[रामसर कन्वेंशन]] के [[अनुच्छेद 1]] में आर्द्रभूमि की परिभाषा दी गई है, जिसमें प्राकृतिक और कृत्रिम दोनों आर्द्रभूमियाँ शामिल हैं।","**दायरा:** रामसर की परिभाषा व्यापक है, जिसमें दलदल (marshes), पीटलैंड, नदियाँ, झीलें और तटीय क्षेत्र शामिल हैं।","**समुद्री जल:** इसमें ऐसे समुद्री जल क्षेत्र भी शामिल हैं जिनकी गहराई निम्न ज्वार के समय [[6 मीटर]] से अधिक नहीं होती।"]},"exp_ref":"q5"},{"q":{"en":"Where was the Ramsar Convention adopted in 1971?","hi":"1971 में रामसर कन्वेंशन कहाँ अपनाया गया था?"},"o":[{"en":"Paris, France","hi":"पेरिस, फ्रांस"},{"en":"Kyoto, Japan","hi":"क्योटो, जापान"},{"en":"Ramsar, Iran","hi":"रामसर, ईरान"},{"en":"Geneva, Switzerland","hi":"जिनेवा, स्विट्जरलैंड"}],"a":{"en":"Ramsar, Iran","hi":"रामसर, ईरान"},"exp":{"en":["**Purpose:** [[Ramsar Convention]] is an international treaty for the conservation and wise use of wetlands.","**Adoption:** Adopted in [[1971]] at Ramsar, Iran.","**Global treaty:** It is the only global treaty exclusively dedicated to wetlands."],"hi":["**उद्देश्य:** [[रामसर कन्वेंशन]] आर्द्रभूमियों के संरक्षण और विवेकपूर्ण उपयोग के लिए एक अंतरराष्ट्रीय संधि है।","**अंगीकरण:** इसे [[1971]] में ईरान के रामसर शहर में अपनाया गया था।","**वैश्विक संधि:** यह विशेष रूप से आर्द्रभूमियों को समर्पित एकमात्र वैश्विक संधि है।"]},"exp_ref":"q6"},{"q":{"en":"On which date did the Ramsar Convention enter into force for India?","hi":"भारत के लिए रामसर कन्वेंशन किस तिथि को प्रभावी हुआ?"},"o":[{"en":"5 June 1982","hi":"5 जून 1982"},{"en":"1 February 1982","hi":"1 फरवरी 1982"},{"en":"2 February 1971","hi":"2 फरवरी 1971"},{"en":"1 January 1991","hi":"1 जनवरी 1991"}],"a":{"en":"1 February 1982","hi":"1 फरवरी 1982"},"exp":{"en":["**India's accession:** India joined the [[Ramsar Convention]] on [[1 February 1982]].","**Asian network:** India now has one of the largest networks of Ramsar Sites in Asia.","**Conservation:** Wetland conservation efforts expanded significantly after joining."],"hi":["**भारत का प्रवेश:** भारत [[1 फरवरी 1982]] को [[रामसर कन्वेंशन]] में शामिल हुआ।","**एशियाई नेटवर्क:** अब एशिया में रामसर स्थलों के सबसे बड़े नेटवर्कों में से एक भारत में है।","**संरक्षण:** इस संधि में शामिल होने के बाद भारत में आर्द्रभूमि संरक्षण के प्रयासों में काफी विस्तार हुआ।"]},"exp_ref":"q7"},{"q":{"en":"Which pair comprised Indi {"en":["**Bhitarkanika Mangroves:** [[Odisha]]."],"hi":["**भितरकनिका मैंग्रोव:** [[ओडिशा]]।"]},"exp_ref":"q65"},{"q":{"en":"In which state/UT is Kolleru Lake located?","hi":"कोल्लेरू झील किस राज्य/केंद्र शासित प्रदेश में है?"},"o":[{"en":"Punjab","hi":"पंजाब"},{"en":"Andhra Pradesh","hi":"आंध्र प्रदेश"},{"en":"West Bengal","hi":"पश्चिम बंगाल"},{"en":"Kerala","hi":"केरल"}],"a":{"en":"Andhra Pradesh","hi":"आंध्र प्रदेश"},"exp":{"en":["**Kolleru Lake:** [[Andhra Pradesh]]."],"hi":["**कोल्लेरू झील:** [[आंध्र प्रदेश]]।"]},"exp_ref":"q66"},{"q":{"en":"In which state/UT is Renuka Wetland located?","hi":"रेणुका वेटलैंड किस राज्य/केंद्र शासित प्रदेश में है?"},"o":[{"en":"Himachal Pradesh","hi":"हिमाचल प्रदेश"},{"en":"Manipur","hi":"मणिपुर"},{"en":"Jammu and Kashmir","hi":"जम्मू और कश्मीर"},{"en":"Haryana","hi":"हरियाणा"}],"a":{"en":"Himachal Pradesh","hi":"हिमाचल प्रदेश"},"exp":{"en":["**Renuka Wetland:** [[Himachal Pradesh]]."],"hi":["**रेणुका वेटलैंड:** [[हिमाचल प्रदेश]]।"]},"exp_ref":"q68"},{"q":{"en":"In which state/UT is Sundarbans Wetland located?","hi":"सुंदरबन वेटलैंड किस राज्य/केंद्र शासित प्रदेश में है?"},"o":[{"en":"Gujarat","hi":"गुजरात"},{"en":"Tripura","hi":"त्रिपुरा"},{"en":"Andhra Pradesh","hi":"आंध्र प्रदेश"},{"en":"West Bengal","hi":"पश्चिम बंगाल"}],"a":{"en":"West Bengal","hi":"पश्चिम बंगाल"},"exp":{"en":["**Sundarbans Wetland:** [[West Bengal]]."],"hi":["**सुंदरबन वेटलैंड:** [[पश्चिम बंगाल]]।"]},"exp_ref":"q69"},{"q":{"en":"In which state/UT is Vembanad-Kol Wetland located?","hi":"वेम्बनाड-कोल वेटलैंड किस राज्य/केंद्र शासित प्रदेश में है?"},"o":[{"en":"Himachal Pradesh","hi":"हिमाचल प्रदेश"},{"en":"West Bengal","hi":"पश्चिम बंगाल"},{"en":"Kerala","hi":"केरल"},{"en":"Rajasthan","hi":"राजस्थान"}],"a":{"en":"Kerala","hi":"केरल"},"exp":{"en":["**Vembanad-Kol Wetland:** [[Kerala]]."],"hi":["**वेम्बनाड-कोल वेटलैंड:** [[केरल]]।"]},"exp_ref":"q70"}]}]</script><script>
const SECTIONS=JSON.parse(document.getElementById('master-data').textContent);const STORE="efp_ca_topic_ramsar_sites_2026_rapid_v1";let saved={answers:{},bookmarks:{},section:0,dark:false};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}
if(!saved.answers||typeof saved.answers!=="object")saved.answers={};if(!saved.bookmarks||typeof saved.bookmarks!=="object")saved.bookmarks={};if(!Number.isInteger(saved.section))saved.section=0;
let current=Math.max(0,Math.min(SECTIONS.length-1,saved.section||0)),onlyBookmarks=false;function save(){saved.section=current;try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){};}function globalQNumber(si,qi){let n=qi+1;for(let i=0;i<si;i++)n+=SECTIONS[i].questions.length;return n}const TOTAL_QUESTIONS=SECTIONS.reduce((n,s)=>n+s.questions.length,0);function qid(si,qi){return si+'-'+qi}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function explanationHtml(a){return '<ul>'+a.map(s=>'<li>'+escapeHtml(s).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\[\[(.*?)\]\]/g,'<span class="highlight-text">$1</span>')+'</li>').join('')+'</ul>'}function correctIndex(q){return q.o.findIndex(o=>o.en===q.a.en)}function stats(){let attempted=0,correct=0,total=0;SECTIONS.forEach((s,si)=>s.questions.forEach((q,qi)=>{total++;let a=saved.answers[qid(si,qi)];if(a!==undefined){attempted++;if(a===correctIndex(q))correct++;}}));return{attempted,correct,total}}function updateTop(){const x=stats(),p=x.total?Math.round(x.attempted*100/x.total):0;const score=document.getElementById('scoreTxt');if(score){score.dataset.efNativeScore='1';score.classList.add('ef-native-score');score.setAttribute('aria-label','Quiz score: '+x.attempted+' of '+x.total+' attempted, '+x.correct+' correct, '+(x.attempted-x.correct)+' wrong');score.innerHTML='<span class="ef-native-score-chip ef-native-score-total">Total <strong>'+x.attempted+'/'+x.total+'</strong></span><span class="ef-native-score-chip ef-native-score-correct">Correct <strong>'+x.correct+'</strong></span><span class="ef-native-score-chip ef-native-score-wrong">Wrong <strong>'+(x.attempted-x.correct)+'</strong></span>';}document.getElementById('pct').textContent=p+'%';document.getElementById('progFill').style.width=p+'%';renderNav();}
function renderNav(){document.getElementById('sectionNav').innerHTML=SECTIONS.map((s,i)=>{const done=s.questions.every((q,qi)=>saved.answers[qid(i,qi)]!==undefined);return `<button class="pill ${i===current?'active':done?'done':''}" onclick="openSection(${i})" title="${escapeHtml(s.title.en)}">${done?'✓':i+1}</button>`}).join('')}function renderQuestions(){const s=SECTIONS[current];document.getElementById('secNo').textContent=`Section ${current+1} of ${SECTIONS.length} · ${s.questions.length} questions`;document.getElementById('secTitle').textContent=s.title.en;document.getElementById('secTitleHi').textContent=s.title.hi;const term=document.getElementById('search').value.trim().toLowerCase();let shown=0;const htmls=[];s.questions.forEach((q,qi)=>{const id=qid(current,qi),book=!!saved.bookmarks[id];if(onlyBookmarks&&!book)return;const hay=(q.q.en+' '+q.q.hi+' '+q.a.en+' '+q.a.hi).toLowerCase();if(term&&!hay.includes(term))return;shown++;const picked=saved.answers[id],ci=correctIndex(q);let opts=q.o.map((o,oi)=>{let cl='opt';if(picked!==undefined){if(oi===ci)cl+=' correct';else if(oi===picked)cl+=' wrong'}return `<button class="${cl}" onclick="pick(${qi},${oi})" ${picked!==undefined?'disabled':''}><span>${escapeHtml(o.en)}</span><small>${escapeHtml(o.hi)}</small></button>`}).join('');htmls.push(`<article class="qcard" id="rp-${current}-${qi}"><button class="book ${book?'on':''}" onclick="bookmark(${qi})" title="Bookmark">${book?'★':'☆'}</button><div class="qnum">Q${globalQNumber(current,qi)} <span class="qtotal">/ ${TOTAL_QUESTIONS}</span></div><p class="qen">${escapeHtml(q.q.en)}</p><p class="qhi">${escapeHtml(q.q.hi)}</p><div class="opts">${opts}</div><div class="exp ${picked!==undefined?'show':''}"><div>${window.EFP_CA_EXPLANATIONS.render(q,"en")}</div><div class="hi">${window.EFP_CA_EXPLANATIONS.render(q,"hi")}</div></div></article>`)});document.getElementById('questions').innerHTML=htmls.join('')||'<div class="empty">'+(onlyBookmarks?'No bookmarks in this section / इस सेक्शन में कोई बुकमार्क नहीं':'No matching questions / कोई matching प्रश्न नहीं मिला')+'</div>';updateTop()}function pick(qi,oi){const id=qid(current,qi);if(saved.answers[id]!==undefined)return;saved.answers[id]=oi;save();renderQuestions()}function bookmark(qi){const id=qid(current,qi);saved.bookmarks[id]=!saved.bookmarks[id];if(!saved.bookmarks[id])delete saved.bookmarks[id];save();renderQuestions()}function toggleBookmarkFilter(){onlyBookmarks=!onlyBookmarks;document.getElementById('bookmarkFilter').classList.toggle('primary',onlyBookmarks);renderQuestions()}function openSection(i){current=Math.max(0,Math.min(SECTIONS.length-1,Number.isInteger(i)?i:0));document.getElementById('search').value='';save();renderQuestions();window.scrollTo({top:310,behavior:'smooth'})}function moveSection(d){openSection(Math.max(0,Math.min(SECTIONS.length-1,current+d)))}function resetAll(){if(!confirm('Reset quiz progress? Your bookmarks will stay saved.'))return;if(window.EFP_QUIZ_CONTINUITY)window.EFP_QUIZ_CONTINUITY.clear();saved.answers={};saved.section=0;current=0;save();if(window.EFP_QUIZ_PROGRESS_WARNING)window.EFP_QUIZ_PROGRESS_WARNING.disarm();renderQuestions()}function toggleDark(){saved.dark=!saved.dark;applyDark();save()}function applyDark(){document.body.classList.toggle('dark',!!saved.dark);document.getElementById('darkBtn').textContent=saved.dark?'Light':'Dark'}applyDark();renderQuestions();
</script>
