        // The Full Dataset provided
        const vocabData = [{"sn":1,"word":"Abandon","pos":"N./V.","hindi":"छोड़ देना","meaning":"To leave someone you are responsible for, with no intention of returning","synonyms":"Desert (छोड़ देना), Forsake (त्यागना), Dereliction (उपेक्षा), Discontinue (बंद करना), Leave (छोड़ना)","antonyms":"Retain (बनाये रखना), Support (समर्थन), Constraint (बाध्यता), Continue (जारी रखना)", "trick": "ABANDON mein BAND ko BANDHAN ka yaad-cue banao: bandhan todkar apno ko chhod diya = TYAG DENA." },{"sn":2,"word":"Abate","pos":"V.","hindi":"समाप्त करना / कम करना","meaning":"To become less intense or widespread","synonyms":"Subside (घटना), Decrease (कमी), Diminish (घटाना), Reduce (कम करना)","antonyms":"Aggravate (बढ़ाना), Increase (वृद्धि), Grow (बढ़ना), Extend (विस्तार करना)", "trick": "ABATE = REBATE milne par price KAM ho jaati hai → Abate = kam hona!" },{"sn":3,"word":"Abbreviate","pos":"V.","hindi":"संक्षिप्त करना","meaning":"To shorten a word or phrase by omitting letters","synonyms":"Shorten (छोटा करना), Compress (संपीड़ित करना)","antonyms":"Expand (विस्तार करना)", "trick": "ABBREVIATE = BREV = BRIEF → brief matlab chhota → chhota banana = sankshepit karna!" },{"sn":4,"word":"Abdicate","pos":"V.","hindi":"त्यागना","meaning":"To formally renounce the throne or fail to fulfil a responsibility","synonyms":"Abandon (छोड़ना), Renounce (त्यागना)","antonyms":"Assert (दावा करना)", "trick": "Yaad ka scene: raja bola 'AB DI kursi', taaj utara aur gaddi chhod di — ABDICATE = rajgaddi/pad tyagna." },{"sn":5,"word":"Abduct","pos":"V.","hindi":"अपहरण करना","meaning":"To take someone away illegally by force or deception","synonyms":"Kidnap (अपहरण करना)","antonyms":"Redeem (मुक्त करना)", "trick": "ABDUCT = AB (leke) + DUCT (le jaana) → kisi ko zabardasti uthaa le jaana = apaharan!" },{"sn":6,"word":"Aberration","pos":"N.","hindi":"असामान्यता, विचलन","meaning":"A departure from what is normal, usual, or expected","synonyms":"Deviation (विचलन)","antonyms":"Normality (सामान्यता)", "trick": "ABERRATION = A + ERROR + ATION → ek badi galti ya normal se hata hua = asamanyata!" },{"sn":7,"word":"Abeyance","pos":"N.","hindi":"ठहराव","meaning":"A state of temporary disuse or suspension","synonyms":"Inactivity (निष्क्रियता), Suspension (निलंबन), Temporary (अस्थायी)","antonyms":"Continuation (जारी रखना)", "trick": "ABEYANCE = AB (abhi) + BEY + ANCE → abhi kaam ruka hua hai = thahraav!" },{"sn":8,"word":"Abide","pos":"V.","hindi":"मान लेना / पालन करना","meaning":"To accept or act in accordance with a rule or decision","synonyms":"Dwell (निवास करना)","antonyms":"Reject (अस्वीकार करना)", "trick": "ABIDE BY — traffic signal red hai, stop kiya: rule ko follow kiya = NIYAM / FAISLE KA PAALAN." },{"sn":9,"word":"Abjure","pos":"V.","hindi":"त्यागना","meaning":"To solemnly renounce a belief, cause, or claim","synonyms":"Renounce (त्यागना), Recant (वापस लेना), Withdraw (वापस लेना)","antonyms":"Acquire (प्राप्त करना)", "trick": "ABJURE = AB + JURE (swear/kasam) → kasam khake chhod dena = tyagana!" },{"sn":10,"word":"Abolish","pos":"V.","hindi":"हटाना","meaning":"Formally put an end to a system, practice, or institution","synonyms":"Eliminate (हटाना), Cancellation (रद्द करना), Eradicate (उन्मूलन करना), Destroy (नष्ट करना)","antonyms":"Continue (जारी रखना), Build (बनाना), Construct (निर्माण करना), Create (सृजन करना), Restore (पुनर्स्थापित करना)", "trick": "ABOLISH → 'ab bol: system BAND!' (yaad-cue): purana system officially khatam = SAMAAPT KARNA." },{"sn":11,"word":"Abominable","pos":"Adj.","hindi":"घटिया","meaning":"Causing moral revulsion; very bad or unpleasant","synonyms":"Obnoxious (अप्रिय), Repugnant (घृणित)","antonyms":"Delightful (मनोहर), Admirable (प्रशंसनीय)", "trick": "ABOMINABLE — cruelty ka scene dekhkar disgust se 'kitna ghinauna kaam!' = BAHUT GHATIYA / GHINONA." },{"sn":12,"word":"Abort","pos":"V.","hindi":"बंद कर देना","meaning":"To terminate a process or undertaking prematurely","synonyms":"End (समाप्त करना)","antonyms":"Commence (आरंभ करना)", "trick": "ABORT = beech mein hi BAND kar dena → jaise computer me Ctrl+C se process abort karo!" },{"sn":13,"word":"Abortive","pos":"Adj.","hindi":"असफल","meaning":"Failing to produce the intended result; unsuccessful","synonyms":"Unsuccessful (असफल), Ineffective (प्रभावहीन)","antonyms":"Successful (सफल)", "trick": "ABORTIVE = ABORT + IVE → jo kaam ABORT ho jaye = asafal ya vyarth!" },{"sn":14,"word":"Abound","pos":"V.","hindi":"प्रचुर मात्रा में होना","meaning":"To exist in large numbers or amounts","synonyms":"Flourish (फलना-फूलना)","antonyms":"Lack (कमी)", "trick": "ABOUND → A BOUNDless supply (yaad-cue): har stall mangoes se bhari, amount bahut zyada = PRACHUR HONA." },{"sn":15,"word":"Abridge","pos":"V.","hindi":"संक्षेप करना","meaning":"To shorten a piece of writing without losing the sense","synonyms":"Shorten (छोटा करना)","antonyms":"Stretch (खींचना), Elongate (लम्बा करना), Enlarge (बढ़ाना)", "trick": "A BRIDGE lamba raasta short karta hai; ABRIDGE lambi kitab ko main baat bachate hue short karta hai." },{"sn":16,"word":"Abrogate","pos":"V.","hindi":"रद्द करना","meaning":"To repeal or do away with a law, right, or formal agreement","synonyms":"Repeal (रद्द करना), Abolish (समाप्त करना), Put An End To (अंत करना)","antonyms":"Establish (स्थापित करना)", "trick": "ABROGATE → 'ab rule GATE se OUT' (yaad-cue): government ne old law officially cancel kiya = NIRAST KARNA." },{"sn":17,"word":"Abrupt","pos":"Adj.","hindi":"आकस्मिक","meaning":"Sudden and unexpected","synonyms":"Sudden (अचानक)","antonyms":"Gradual (क्रमिक), Smooth (चिकना)", "trick": "ABRUPT = AB (abhi) + RUPT (phut gaya) → abhi achaanak phut gaya = akasmik!" },{"sn":18,"word":"Absolute","pos":"Adj.","hindi":"पूर्ण","meaning":"Not qualified or diminished in any way; total","synonyms":"Complete (पूरा), Definitely (निश्चित रूप से)","antonyms":"Limited (सीमित), Incomplete (अधूरा)", "trick": "ABSOLUTE → ABSOLUTELY 100% ka cue: koi limit, condition ya doubt nahi = POORN / TOTAL." },{"sn":19,"word":"Absolve","pos":"V.","hindi":"दोषमुक्त करना","meaning":"To declare someone free from blame, guilt, or responsibility","synonyms":"Acquit (दोषमुक्त करना), Pardon (क्षमा)","antonyms":"Blame (दोष देना), Condemn (निंदा करना), Accused (आरोपी)", "trick": "ABSOLVE → 'AB SOLVE hua blame' (yaad-cue): investigation ne blame se free kiya = DOSHMUKT KARNA." },{"sn":20,"word":"Absorb","pos":"V.","hindi":"सोख लेना","meaning":"To take in or soak up energy or liquid by chemical or physical action","synonyms":"Soak (भिगोना/सोखना)","antonyms":"Eject (निकालना), Emit (निकालना), Dismiss (खारिज करना)", "trick": "ABSORB = SPONGE ki tarah ABSORB karo → andar kheench lena = sokh lena!" },{"sn":21,"word":"Abstain","pos":"V.","hindi":"परहेज करना","meaning":"To restrain oneself from doing or enjoying something","synonyms":"Refrain (बचना), Resist (प्रतिरोध करना)","antonyms":"Indulge (भोगना), Pursue (पीछा करना), Continue (जारी रखना)", "trick": "ABSTAIN → 'AB STAY away' (sound-cue): sweets saamne, par khud ko rok liya = PARHEZ KARNA." },{"sn":22,"word":"Absurd","pos":"Adj.","hindi":"बेतुका","meaning":"Wildly unreasonable, illogical, or inappropriate","synonyms":"Ridiculous (ऊटपटाँग), Foolish (मूर्ख), Senseless (निरर्थक), Unreasonable (अतार्किक)","antonyms":"Sensible (समझदार), Reasonable (उचित), Realistic (वास्तविक), Rational (तर्कसंगत)", "trick": "ABSURD → 'AB SURaj par cycle?' (yaad-cue): cycle se Suraj tak jaane ka claim bilkul illogical = BETUKA." },{"sn":23,"word":"Abundance","pos":"N.","hindi":"प्रचुरता","meaning":"A very large quantity of something","synonyms":"Plethora (बहुतायत)","antonyms":"Scarcity (कमी), Dearth (अभाव), Shortage (कमी)", "trick": "ABUNDANCE = A + BUNDLE + ANCE → bundles pe bundles = bahut zyada = prachurata!" },{"sn":24,"word":"Abundant","pos":"Adj.","hindi":"प्रचुर","meaning":"Existing or available in large quantities; plentiful","synonyms":"Plentiful (प्रचुर), Ample (काफ़ी), Plenty (प्रचुर), Copious (अधिक)","antonyms":"Meagre (अल्प), Scarce (कम), Insufficient (अपर्याप्त), Scant (अपर्याप्त)", "trick": "ABUNDANT = A + BUND + ANT → bahut saari cheetiyan (ANT) = badi tadaad = prachurata!" },{"sn":25,"word":"Abuse/Abusive","pos":"N./V.","hindi":"गाली, अपमानजनक","meaning":"Treat with cruelty or violence; use in a way that causes damage or harm","synonyms":"Scorn (तिरस्कार), Harm (नुकसान)","antonyms":"Applause (सराहना), Laudatory (प्रशंसात्मक)", "trick": "ABUSE = AB + USE → ab galat USE karna = gali dena ya bura bartav karna!" },{"sn":26,"word":"Accede","pos":"V.","hindi":"सहमत होना","meaning":"To agree to a demand, request, or treaty","synonyms":"Consent (सहमति), Comply (पालन करना), Endorse (समर्थन करना)","antonyms":"Deny (इनकार करना), Disapprove (अस्वीकार करना)", "trick": "ACCEDE → ACCEPT ki demand (sound-cue): 'haan, main tumhari request maanta hoon' = SAHMAT HONA." },{"sn":27,"word":"Accessory","pos":"N.","hindi":"सहायक उपकरण","meaning":"A thing that can be added to something else to make it more useful or attractive","synonyms":"Attachments (संलग्न वस्तु)","antonyms":"Essential (आवश्यक)", "trick": "ACCESSORY = extra cheez jo saath ACCESS karata hai → sahayak cheez!" },{"sn":28,"word":"Accolade","pos":"N.","hindi":"सम्मान","meaning":"An award or privilege granted as special honour or acknowledgment of merit","synonyms":"Praise (प्रशंसा), Award (पुरस्कार), Laurels (गौरव)","antonyms":"Blame (दोष)", "trick": "Stage par medal milte hi sab clap karein — award aur praise ka yeh moment = ACCOLADE, samman." },{"sn":29,"word":"Accomplish","pos":"V.","hindi":"सफल होना","meaning":"To achieve or complete successfully","synonyms":"Achieve (प्राप्त करना), Attain (हासिल करना)","antonyms":"Fail (असफल होना), Miss (छूट जाना), Fiasco (असफलता)", "trick": "ACCOMPLISH ka COMPL dekhkar COMPLETE yaad karo: final task successfully tick = POORA KAR DIKHANA." },{"sn":30,"word":"Accord","pos":"N./V.","hindi":"समझौता","meaning":"Agreement or harmony; grant someone power or status","synonyms":"Confer (प्रदान करना)","antonyms":"Disagreement (असहमति)", "trick": "ACCORD → A CHORD ka sound-cue: singers ek sur mein, log ek raaye mein = AGREEMENT / MEL." },{"sn":31,"word":"Accountable","pos":"Adj.","hindi":"जवाबदेह","meaning":"Required or expected to justify actions or decisions; responsible","synonyms":"Answerable (उत्तरदायी)","antonyms":"Irresponsible (गैर जिम्मेदार)", "trick": "ACCOUNTABLE = ACCOUNT dena padega → har kaam ka hisaab dena = javabdehi!" },{"sn":32,"word":"Accumulate","pos":"V.","hindi":"संचय करना","meaning":"To gather together or acquire an increasing number or quantity","synonyms":"Amass (इकट्ठा करना), Gather (जमा करना), Acquire (अर्जित करना)","antonyms":"Disperse (छितराना), Squandered (बर्बाद किया हुआ), Scatter (बिखेरना)", "trick": "ACCUMULATE mein CUMUL = heap/jama hona: coins judte-judte dher bane = DHEERE-DHEERE IKATTHA KARNA." },{"sn":33,"word":"Accurate","pos":"Adj.","hindi":"शुद्ध","meaning":"Correct in all details; exact","synonyms":"Precise (सटीक), Correct (सही), Exact (निश्चित)","antonyms":"Unreliable (अविश्वसनीय), Inexact (अनिश्चित)", "trick": "ACCURATE → 'a correct RATE' (yaad-cue): weight 5 kg, reading bhi exact 5 kg = SATEEK." },{"sn":34,"word":"Accuse","pos":"V.","hindi":"आरोप लगाना","meaning":"To charge someone with an offense or crime","synonyms":"Indict (आरोपित करना)","antonyms":"Exculpation (दोषमुक्ति), Defend (बचाव करना), Approval (समर्थन)", "trick": "ACCUSE → court ka ACCUSED yaad karo: kisi par 'tumne chori ki' ka charge lagaya = AAROP LAGAANA." },{"sn":35,"word":"Accustomed","pos":"Adj.","hindi":"आदी","meaning":"Customary or usual","synonyms":"Habituated (अभ्यस्त)","antonyms":"Unusual (असामान्य)", "trick": "ACCUSTOMED = CUSTOM (aadat) → custom ban gayi aadat = aadi ho jaana!" },{"sn":36,"word":"Acquire","pos":"V.","hindi":"प्राप्त करना","meaning":"To buy or obtain an asset or object for oneself","synonyms":"Procure (प्राप्त करना), Obtain (प्राप्त करना), Develop (विकसित करना)","antonyms":"Disperse (वितरित करना), Discard (त्यागना)", "trick": "ACQUIRE → ACQUISITION ka cue: company ne naya asset khareedkar PAAYA; skill bhi pa sakte hain = PRAAPT KARNA." },{"sn":37,"word":"Acquisition","pos":"N.","hindi":"अधिग्रहण","meaning":"An asset or object bought or obtained","synonyms":"Recover (पुनः प्राप्त करना)","antonyms":"Loss (हानि)", "trick": "ACQUISITION = ACQUIRE + TION → ACQUIRE karne ki process = adhigrahan!" },{"sn":38,"word":"Acquisitive","pos":"Adj.","hindi":"लाभ का इच्छुक","meaning":"Eager to acquire and possess things, especially material possessions","synonyms":"Eager (उत्सुक)","antonyms":"Unsparing (बेरहम)", "trick": "ACQUISITIVE = ACQUIRE karne ki ITIVE (adat) → cheezein ikathhi karne ki chahat!" },{"sn":39,"word":"Acquit","pos":"V.","hindi":"दोषमुक्त करना","meaning":"To declare someone free from a charge of wrongdoing","synonyms":"Absolve (मुक्त करना)","antonyms":"Condemn (निंदा करना), Convict (दोषी ठहराना), Blame (दोष)", "trick": "Judge bole 'guilty nahi', accused court case se QUIT kare — ACQUIT = dosh se bari karna; maafi dena alag baat hai." },{"sn":40,"word":"Active","pos":"Adj.","hindi":"कार्यरत","meaning":"Engaging or ready to engage in physically energetic pursuits","synonyms":"Busy (व्यस्त), Energetic (ऊर्जावान)","antonyms":"Abeyant (निष्क्रिय), Dormant (निष्क्रिय)", "trick": "ACTIVE = ACTION mein rehna = karyarat aur urjavaan!" },{"sn":41,"word":"Acumen","pos":"N.","hindi":"कुशाग्र बुद्धि","meaning":"The ability to make good judgments and quick decisions","synonyms":"Sharpness (तीक्षणता), Brilliance (प्रतिभा), Ingenuity (चतुराई), Acuity (तीव्रता)","antonyms":"Stupidity (मूर्खता)", "trick": "ACUMEN ka ACU sharpness se juda, ACUTE bhi sharp: dimag ki sharp judgement = SOOJH-BOOJH." },{"sn":42,"word":"Acute","pos":"Adj.","hindi":"तीव्र","meaning":"Severe or intense in effect; extremely sensitive even to slight stimuli","synonyms":"Sharp (तेज), Severe (गंभीर)","antonyms":"Blunt (तेज न होना)", "trick": "ACUTE → sharp ACUTE angle ki nok ka cue: sharp pain, intense effect ya keen senses = TEEVRA / TEZ." },{"sn":43,"word":"Adamant","pos":"Adj.","hindi":"अटल","meaning" E = AD (aage) + VANCE (jaana) → aage jaana = pragati karna!" },{"sn":56,"word":"Advantage/Advantageous","pos":"N./Adj.","hindi":"लाभ","meaning":"A condition that puts one in a favourable or superior position","synonyms":"Boon (वरदान), Favourable (अनुकूल)","antonyms":"Minuses (नुकसान)", "trick": "ADVANTAGE = ADVAN + TAGE → TAGE matlab TAG lagana = apna special tag = labh!" },{"sn":57,"word":"Advent","pos":"N.","hindi":"आगमन","meaning":"The arrival of a notable person, thing, or event","synonyms":"Arrival (आगमन)","antonyms":"Departure (प्रस्थान)", "trick": "ADVENT = AD (aane wala) + VENT (jaana) → kisi ka aana = aagaman!" },{"sn":58,"word":"Adversary","pos":"N.","hindi":"विरोधी","meaning":"One's opponent in a contest, conflict, or dispute","synonyms":"Rival (प्रतिस्पर्धी), Opponent (विरोधी)","antonyms":"Helper (सहायक), Comradely (साथी भाव से)", "trick": "ADVERSARY = ADVERSE (viruddh) + ARY → viruddh karne wala = virodhi!" },{"sn":59,"word":"Adversity","pos":"N.","hindi":"विपत्ति","meaning":"Difficulties; misfortune","synonyms":"Misfortune (दुर्भाग्य), Hardships (कठिनाई), Misery (दुख)","antonyms":"Prosperity (समृद्धि)", "trick": "ADVERSITY = ADVERSE + ITY → adverse (bura) situation = vipatti!" },{"sn":60,"word":"Advocacy","pos":"N.","hindi":"समर्थन","meaning":"Public support for or recommendation of a particular cause or policy","synonyms":"Promotion (पदोन्नति)","antonyms":"Discouragement (हतोत्साहन), Opposition (विरोध)", "trick": "ADVOCACY = ADVOCATE (vakeel) + CY → vakeel ki tarah kisi ki taraf se bolna = samarthan!" },{"sn":61,"word":"Advocate","pos":"N./V.","hindi":"समर्थक","meaning":"Publicly recommend or support; a person who pleads on someone else's behalf","synonyms":"Support (समर्थन)","antonyms":"Oppose (विरोध करना)", "trick": "ADVOCATE = AD (aage) + VOCATE (voice dena) → aage aakar aawaz uthana = samarthak!" },{"sn":62,"word":"Affable","pos":"Adj.","hindi":"मिलनसार","meaning":"Easy to approach and to talk to","synonyms":"Friendly (मित्रवत)","antonyms":"Surly yms":"Distract (विचलित करना), Disillusion (मोहभंग), Offend (नाराज करना)", "trick": "CAPTIVATE = CAPTIVE (kaid) banana → apni CHARM se pakad lena = mohit karna!" },{"sn":218,"word":"Casual","pos":"Adj.","hindi":"अनौपचारिक, आकस्मिक","meaning":"Relaxed and unconcerned","synonyms":"Occasional (यदाकदा)","antonyms":"Formal (औपचारिक), Planned (आयोजित)", "trick": "CASUAL = CASUAL wear → relaxed kapde = befikr aur anopchaarik!" },{"sn":219,"word":"Catastrophe","pos":"N.","hindi":"आपदा","meaning":"An event causing great and often sudden damage or suffering; a disaster","synonyms":"Calamity (विपत्ति), Tragedy (त्रासदी), Disaster (विनाश)","antonyms":"Blessing (आशीर्वाद)", "trick": "Badi flood/earthquake se achanak bhari tabahi — CATASTROPHE = badi aapda." },{"sn":220,"word":"Caustic","pos":"Adj.","hindi":"कठोर, दाहक क्षार","meaning":"Able to burn or corrode organic tissue by chemical action; sarcastically biting","synonyms":"Acidic (अम्लीय)","antonyms":"Kind (दयालु)", "trick": "CAUSTIC = CAUSE + TIC → kuch jalane ya khatam karne ka CAUSE banta hai = teekha aur nuksaandeh!" },{"sn":221,"word":"Cautious","pos":"Adj.","hindi":"सतर्क","meaning":"(Of a person) careful to avoid potential problems or dangers","synonyms":"Vigilant (सतर्क), Alert (चौकस), Careful (सावधान), Prudent (विवेकी)","antonyms":"Negligent (लापरवाह), Reckless (असावधान), Careless (लापरवाह)", "trick": "CAUTIOUS = CAUTION + OUS → CAUTION (savdhaan) board waali soch = satark!" },{"sn":222,"word":"Cavalier","pos":"Adj./N.","hindi":"अभिमानी","meaning":"Showing a lack of proper concern; offhand or dismissive; carefree and nonchalant","synonyms":"Arrogant (अहंकारी)","antonyms":"Humble (विनम्र), Respectful (सम्मानजनक)", "trick": "CAVALIER → 'care? casual!' (sound-cue): warnings ko lightly dismiss kare = BEPARVAAH / PROPER CONCERN NA DIKHAANA." },{"sn":223,"word":"Cease","pos":"V.","hindi":"रोकना","meaning":"To bring or come to an end","synonyms":"Stop (रोकना), Discontinue (बंद करना)","antonyms":"Initiate (आरंभ करना), Continue (जारी रखना), Start (शुरू करना), Commence (प्रारंभ करना)", "trick": "CEASE → CEASEFIRE ka familiar cue: firing STOP; waise hi action stop = RUKNA / BAND KARNA." },{"sn":224,"word":"Celebrate","pos":"V.","hindi":"उत्सव मनाना, गुणगान करना","meaning":"To acknowledge a significant or happy day or event with a social gathering; honour or praise publicly","synonyms":"Honour (सम्मान)","antonyms":"Disgrace (अपमान)", "trick": "CELEBRATE = CELE + BRATE → sab BRATE (mates) ke saath masti = jashn manana!" },{"sn":225,"word":"Celestial","pos":"Adj.","hindi":"स्वर्गीय, आकाशीय","meaning":"Positioned in or relating to the sky or outer space","synonyms":"Heavenly (स्वर्गीय)","antonyms":"Hellish (नरक समान), Terrestrial (स्थलीय), Earthly (धरातलीय)", "trick": "CELESTIAL = CELE + STIAL → CELEBRATE in sky = aakaash ya swarg se sambandhit!" },{"sn":226,"word":"Censure","pos":"N./V.","hindi":"आलोचना","meaning":"Express severe disapproval of someone or something, especially in a formal statement","synonyms":"Criticise (आलोचना करना), Reprimand (फटकार), Condemn (निंदा करना), Rebuke (झिड़की)","antonyms":"Praise (प्रशंसा), Applause (तालियाँ), Approve (मंजूरी देना)", "trick": "CENSURE → 'CENSOR ne disapprove kiya' (sound-cue): conduct ki official strong criticism = KADI NINDA." },{"sn":227,"word":"Certain","pos":"Adj.","hindi":"निश्चित","meaning":"Known for sure; established beyond doubt","synonyms":"Sure (निश्चित), Definite (निश्चित)","antonyms":"Doubt (संदेह)", "trick": "CERTAIN = CERT (certificate) + AIN → certificate pakka hota hai = nishchit!" },{"sn":228,"word":"Chagrin","pos":"N.","hindi":"शर्मिंदगी","meaning":"Distress or embarrassment at having failed or been humiliated","synonyms":"Embarrassment (शर्मसार)","antonyms":"Pleasure (आनंद)", "trick": "CHAGRIN = CHAA + GRIN → GRIN (muskaana) nahi aa rahi = sharmindagi!" },{"sn":229,"word":"Change","pos":"N./V.","hindi":"बदलना","meaning":"To make or become different","synonyms":"Alter (परिवर्तन करना)","antonyms":"Stabilise (स्थिर करना)", "trick": "CHANGE → CHANGE THE CHANNEL ka familiar cue: purane ki jagah doosra = BADLAV / BADALNA." },{"sn":230,"word":"Chaos","pos":"N.","hindi":"अव्यवस्था","meaning":"Complete disorder and confusion","synonyms":"Disorder (गड़बड़ी), Confusion (भ्रम)","antonyms":"Order (क्रम), Arrangement (व्यवस्था)", "trick": "CHAOS → CHAOTIC traffic ka cue: horns, random movement, no order = AVYAVASTHA." },{"sn":231,"word":"Chaotic","pos":"Adj.","hindi":"अव्यवस्थित","meaning":"In a state of complete confusion and disorder","synonyms":"Confused (भ्रमित)","antonyms":"Organised (व्यवस्थित)", "trick": "CHAOTIC = CHAOS + TIC → CHAOS wali tic-tic = bilkul avyavasthit!" },{"sn":232,"word":"Chaste","pos":"Adj.","hindi":"पवित्र","meaning":"Not having any sexual nature or intention","synonyms":"Pure (शुद्ध)","antonyms":"Corrupt (भ्रष्ट), Dirty (गंदा)", "trick": "CHASTE = CHASTE (pavitr) → jaise devta = shudh aur pavitra!" },{"sn":233,"word":"Chastise","pos":"V.","hindi":"सजा देना","meaning":"Rebuke or reprimand severely","synonyms":"Upbraid (फटकारना), Reprimand (डाँटना), Punish (दंडित करना)","antonyms":"Praise (प्रशंसा), Extol (बड़ाई करना), Compliment (प्रशंसा)", "trick": "CHASTISE — cheating pakadne par teacher ki sakht daant: 'dobara mat karna!' = KADI FATKAAR / SAZA DENA." },{"sn":234,"word":"Chauvinism","pos":"N.","hindi":"कट्टरता","meaning":"Excessive or prejudiced loyalty or support for one's own cause, group, or gender","synonyms":"Zealotry (अतिउत्साह), Blind Patriotism (अंध देशभक्ति)","antonyms":"Unbiased (निष्पक्ष)", "trick": "CHAUVINISM = CHAUVIN (French soldier) → kisi ek ke liye andha samarthan = kattarta!" },{"sn":235,"word":"Cherish","pos":"V.","hindi":"पोषण करना","meaning":"Protect and care for someone lovingly","synonyms":"Nurture (पालन-पोषण करना), Admire (प्रशंसा करना)","antonyms":"Abandon (त्याग देना), Despised (तिरस्कृत), Deprecate (निंदा करना), Discard (त्यागना), Detest (घृणा करना)", "trick": "CHERISH = CHERI + SH → CHERRY ko pyaar se rakhna = poshan karna!" },{"sn":236,"wor indi":"मजबूत","meaning":"(Of an argument or case) clear, logical, and convincing","synonyms":"Effective (प्रभावी), Convincing (आश्वस्त करना), Rational (तार्किक)","antonyms":"Impotent (शक्तिहीन), Unconvincing (अविश्वसनीय), Ineffective (अप्रभावी)", "trick": "COGENT = COG (gear) + ENT → gear ki tarah tightly fit = pakka aur convincing!" },{"sn":250,"word":"Colloquial","pos":"Adj.","hindi":"बोल-चाल का","meaning":"(Of language) used in ordinary or familiar conversation; not formal or literary","synonyms":"Familiar (परिचित), Conversational (वार्तालापिक)","antonyms":"Formal (औपचारिक), Literary (साहित्यिक)", "trick": "COLLOQUIAL mein LOQU = speak; LOQUACIOUS bhi talking: friends ki casual boli, formal essay nahi = BOLCHAAL KI BHAASHA." },{"sn":251,"word":"Colossal","pos":"Adj.","hindi":"विशाल","meaning":"Extremely large or great","synonyms":"Enormous (विशाल), Gigantic (बहुत बड़ा), Immense (अपार), Huge (विशाल)","antonyms":"Small (छोटा), Minimal (न्यूनतम), Tiny (बहुत छोटा), Short (छोटी), Petite (नन्ही), Negligible (नगण्य)", "trick": "COLOSSAL = COLOSSEUM (Rome ka bada stadium) = bahut bada = vishal!" },{"sn":252,"word":"Comely","pos":"Adj.","hindi":"सुहावना","meaning":"Pleasant to look at; attractive","synonyms":"Pretty (सुंदर)","antonyms":"Grotesque (बेढ़ंगा)", "trick": "COMELY = COME + LY → COME (aao) wali jagah = dekhne mein sundar!" },{"sn":253,"word":"Comic","pos":"Adj./N.","hindi":"हास्यजनक","meaning":"Causing or meant to cause laughter","synonyms":"Funny (मजाकिया)","antonyms":"Tragic (दुखद)", "trick": "COMIC = COMIC books dekh ke hasna = haasyajanak!" },{"sn":254,"word":"Command","pos":"N./V.","hindi":"आदेश देना","meaning":"Give an authoritative order","synonyms":"Instruct (निर्देश देना)","antonyms":"Opposition (विरोध), Permission (अनुमति)", "trick": "COMMAND → COMMANDER ka cue: commander 'aage badho!' ka authoritative order de = AADESH / HUKM DENA." },{"sn":255,"word":"Commence","pos":"V.","hindi":"शुरू करना","meaning":"Begin; start","synonyms":"Start (आरंभ करना), Launch (लॉन्च करना), Initiate (प्रारंभ करना)","antonyms":"Conclude (समाप्त करना), Close (बंद करना), Terminate (समाप्त करना)", "trick": "Invigilator bole 'ab paper shuru kijiye' — COMMENCE = begin/start." },{"sn":256,"word":"Commitment","pos":"N.","hindi":"वचनबद्ध","meaning":"The state or quality of being dedicated to a cause, activity, etc","synonyms":"Guarantee (गारंटी)","antonyms":"Breach (उल्लंघन)", "trick": "COMMITMENT = COMMIT + MENT → COMMIT karna = pakka vachan dena = vachanabaddha!" },{"sn":257,"word":"Committed","pos":"Adj.","hindi":"प्रतिबद्ध","meaning":"Feeling dedication and loyalty to a cause, activity, or job; wholeheartedly dedicated","synonyms":"Devoted (समर्पित), Dedicated (समर्पित), Engaged (व्यस्त)","antonyms":"Uncertain (अनिश्चित), Unmotivated (अप्रेरित)", "trick": "COMMITTED = COMMIT + TED → jo kaam COMMIT kiya wo TED (ted talk) ki tarah pura karna = pratibaddh!" },{"sn":258,"word":"Common","pos":"Adj.","hindi":"सामान्य","meaning":"Occurring, found, or done often; prevalent","synonyms":"Usual (सामान्य)","antonyms":"Rare (दुर्लभ)", "trick": "COMMON — chai almost har street par milti, special rare item nahi = AAM / PRACHALIT." },{"sn":259,"word":"Commotion","pos":"N.","hindi":"हल्ला गुल्ला","meaning":"A state of confused and noisy disturbance","synonyms":"Disturbance (व्यवधान), Fuss (हंगामा), Bustle (हलचल), Uproar (हंगामा)","antonyms":"Quietude (शांति)", "trick": "COMMOTION = COME + MOTION → sab ek saath motion mein aana = hullagulla!" },{"sn":260,"word":"Compact","pos":"Adj./N.","hindi":"सघन","meaning":"Closely and neatly packed together; dense; having all the necessary components fitted into a small space","synonyms":"Dense (सघन), Condensed (संघनित)","antonyms":"Loose (ढीला), Expand (विस्तार करना)", "trick": "COMPACT = COM + PACT → PACT mein saari baatein PACK hoti hain = chhota aur ghana!" },{"sn":261,"word":"Compassion","pos":"N.","hindi":"दया","meaning":"Sympathetic pity and concern for the sufferings or misfortunes of others","synonyms":"Pity (दया), Kindness (दयालुता)","antonyms":"Meanness (नीचता), Indifference (उदासीनता), Animosity (शत्रुता)", "trick": "COMPASSION ka PASSION ko feelings ka cue: doosre ki suffering apne dil mein feel karke help chaho = DAYA / KARUNA." },{"sn":262,"word":"Compassionate","pos":"Adj.","hindi":"सहानुभूति","meaning":"Feeling or showing sympathy and concern for others","synonyms":"Sympathetic (सहानुभूति)","antonyms":"Heartless (निर्दयी), Cruel (बेरहम), Pitiful (दयनीय)", "trick": "COMPASSIONATE = COMPASSION + ATE → COMPASSION rakhne wala insaan = sahaanubhuti rakhna!" },{"sn":263,"word":"Compel","pos":"V.","hindi":"बल से करना","meaning":"Force or oblige someone to do something","synonyms":"Obligate (बाध्य करना), Coerce (मजबूर करना), Force (बल)","antonyms":"Dissuade (न करने के लिए समझाना), Induce (प्रेरित करना)", "trick": "COMPEL — majboori ne choice nahi chhodi, action lena hi pada = MAJBOOR KARNA." },{"sn":264,"word":"Competence","pos":"N.","hindi":"योग्यता","meaning":"The ability to do something successfully or efficiently","synonyms":"Ability (योग्यता), Capability (क्षमता)","antonyms":"Incompetence (अक्षमता)", "trick": "COMPETENCE = COMPETE + ENCE → jo COMPETE kar sake = yogyata!" },{"sn":265,"word":"Competent","pos":"Adj.","hindi":"सक्षम","meaning":"Having the necessary ability, knowledge, or skill to do something successfully","synonyms":"Capable (सक्षम), Qualified (योग्य)","antonyms":"Ignorant (अज्ञानी)", "trick": "Task karne ki required skill aur knowledge ho — COMPETENT; competition jeetna zaroori nahi." },{"sn":266,"word":"Complacent","pos":"Adj.","hindi":"आत्मसंतुष्ट","meaning":"Showing smug or uncritical satisfaction with oneself or one's achievements","synonyms":"Satisfied (संतुष्ट), Smug (आत्ममुग्ध), Contented (संतुष्ट)","antonyms":"Concerned (चिंतित), Dissatisfied (असंतुष्ट), Discontented (असंतुष्ट)", "trick": "COMPLACENT → 'comfortable apni place par' (yaad-cue): ek mock achha gaya, ab improvement ki need hi na maane = AATMASANTUSHT." },{"sn":267,"word":"Complex","pos":"Adj.","hindi":"जटिल","meaning":"Consisting of many different and connected parts","synonyms":"Convoluted (पेचीदा), Intricate (जटिल)","antonyms":"Simple (सरल)", "trick": "COMPLEX = COM + PLEX → COMPLEX (building) mein bahut saari cheezein = jatil!" },{"sn":268,"word":"Compliant","pos":"Adj.","hindi":"आज्ञाकारी","meaning":"Inclined to agree with others or obey rules, especially to an excessive degree; acquiescent","synonyms":"Submissive (विनम्र), Meek (विनम्र)","antonyms":"Unyielding (अडिग), Defiant (चुनौतीपूर्ण)", "trick": "COMPLIANT = COMPLY + ANT → jo COMPLY kare sab rules = aagyakari!" },{"sn":269,"word":"Complicate","pos":"V.","hindi":"जटिल","meaning":"Make something more difficult or confusing by causing it to be more complex","synonyms":"Complex (पेचीदा)","antonyms":"Enlighten (जानकारी देना)", "trick": "COMPLICATE = COMPLEX banana = aur jatil banana!" },{"sn":270,"word":"Comply","pos":"V.","hindi":"आज्ञापालन करना","meaning":"Act in accordance with a wish or command","synonyms":"Obey (आज्ञा मानना)","antonyms":"Oppose (विरोध करना), Challenge (चुनौती), Deny (इनकार करना), Disobey (अवज्ञा करना), Resist (प्रतिरोध करना)", "trick": "COMPLY → COMPLIANCE rules ka familiar cue: helmet-rule ko follow kiya = NIYAM / AAGYA KA PAALAN KARNA." },{"sn":271,"word":"Compose","pos":"V.","hindi":"रचना करना","meaning":"Write or create (a work of art, especially music or poetry)","synonyms":"Collect (संग्रहकार)","antonyms":"Raze (ध्वस्त करना)", "trick": "COMPOSE → COMPOSER music banata hai: notes/words ko jodkar new melody/poem rachna = RACHNA KARNA." },{"sn":272,"word":"Comprehensive","pos":"Adj.","hindi":"विस्तृत","meaning":"Including or nearly all elements or aspects of something","synonyms":"Complete (पूर्ण)","antonyms":"Restricted (सीमित), Complete (पूर्ण), Superficial (ऊपरी), Incomplete (अधूरा), Shallow (सतही)", "trick": "COMPREHENSIVE = COMPREHEND + IVE → sab COMPREHEND karne wala = vistrit aur poorn!" },{"sn":273,"word":"Conceal","pos":"V.","hindi":"छिपाना","meaning":"Keep from sight; hide","synonyms":"Hide (छुपाना), Disguised (वेश बदलना)","antonyms":"Reveal (दिखाना), Unwrap (खोलना)", "trick": "CONCEAL = CON + CEAL → CEILING ke peeche chhupana = gupt rakhna!" },{"sn":274,"word":"Conceit","pos":"N.","hindi":"अहंकार","meaning":"Excessive pride in oneself","synonyms":"Vanity (अहंकार), Egotism (अभिमान), Smug (अहंकारी), Arrogant (घमंडी), Pomposity (दिखावा)","antonyms":"Modesty (विनम्रता), Humility (नम्रता)", "trick": "CONCEIT — 'main hi best, kisi aur se seekhna kya?' Excessive self-pride = AHANKAAR." },{"sn":275,"word":"Concise","pos":"Adj.","hindi":"संक्षिप्त","meaning":"Giving a lot of information clearly and in a few words; brief but comprehensive","synonyms":"Brief (संक्षिप्त), Capsule (संक्षिप्त)","antonyms":"Lengthy (लंबा), Unbridged (असंक्षिप्त)", "trick": "CONCISE = CON + CISE → SCISSOR se kaat chhota karna = kam shabdon mein kehna!" },{"sn":276,"word":"Condemn","pos":"V.","hindi":"निंदा करना","meaning":"Express complete disapproval of, typically in public; censure","synonyms":"Criticize (आलोचना करना), Punish (सजा देना), Denounce (निंदा करना), Censure (निंदा), Blame (दोष)","antonyms":"Praise (प्रशंसा), Approve (स्वीकृति)", "trick": "CONDEMN = CON + DEMN → CON (bura) + DAMN (damn it!) = khulke ninda karna!" },{"sn":277,"word":"Condone","pos":"V.","hindi":"माफ कर देना","meaning":"Accept and allow behaviour that is considered morally wrong or offensive to continue","synonyms":"Overlook (अनदेखा करना), Forgive (माफ करना), Excuse (बहाना)","antonyms":"Condemn (निंदा करना)", "trick": "CONDONE → 'CONduct galat, phir bhi DONE/allowed' (yaad-cue): cheating pata hai, par 'chalta hai' = GALTI KO ANDEKHA / MAAF KARNA." },{"sn":278,"word":"Conducive","pos":"Adj.","hindi":"अनुकूल","meaning":"Making a certain situation or outcome likely or possible","synonyms":"Facilitate (सुगम बनाना)","antonyms":"Unfavourable (प्रतिकूल)", "trick": "CONDUCIVE = CONDUCT + IVE → achhe CONDUCT ke liye anukool = helpful environment!" },{"sn":279,"word":"Confederate","pos":"Adj./N.","hindi":"संघीय","meaning":"Joined by an agreement or treaty; supporter of the Confederate States in the American Civil War","synonyms":"Combined (संयुक्त)","antonyms":"Disband (भंग करना)", "trick": "CONFEDERATE = CONFER + ATE → saath mein CONFER karne wale = sanghiya ya mitra!" },{"sn":280,"word":"Confess","pos":"V.","hindi":"कबूल/स्वीकार करना","meaning":"Admit or state that one has committed a crime or is at fault in some way","synonyms":"Admit (स्वीकार करना), Acknowledge (मानना)","antonyms":"Deny (इनकार करना), Conceal (छिपाना)", "trick": "CONFESS → CONFESSION ka cue: 'haan, galti maine ki' publicly admit = KABOOL KARNA." },{"sn":281,"word":"Confident","pos":"Adj.","hindi":"आत्म विश्वासी","meaning":"Feeling or showing confidence in oneself; self-assured","synonyms":"Bold (साहसिक)","antonyms":"Diffident (संकोची), Cowardly (कायर), Unsure (अनिश्चित)", "trick": "CONFIDENT = CONFIDE (vishwaas) + ENT → khud par vishwas rakhna = aatmvishwaasi!" },{"sn":282,"word":"Confidential","pos":"Adj.","hindi":"गोपनीय","meaning":"Intended to be kept secret","synonyms":"Secret (रहस्य)","antonyms":"Public (सार्वजनिक)", "trick": "CONFIDENTIAL = CONFIDE + NTIAL → sirf vishwaspaatron ko CONFIDE karna = gopaniya!" },{"sn":283,"word":"Confine","pos":"V.","hindi":"सीमित","meaning":"Keep or restrict someone or something within certain limits of space, scope, quantity, or time","synonyms":"Restrict (प्रतिबंधित), Limited (सीमित), Imprison (कैद करना)","antonyms":"Liberate (मुक्त करना)", "trick": "CONFINE — puppy ko safe fenced area ke andar rakha, bahar access nahi = SEEMA MEIN RAKHNA / BAND KARNA." },{"sn":284,"word":"Confirm","pos":"V.","hindi":"निश्चित करना","meaning":"Establish the truth or correctness of something previously believed or suspected to be the case","synonyms":"Corroborate (समर्थन करना)","antonyms":"Reject (अस्वीकार करना), Contradict (विरोध करना)", "trick": "CONFIRM = CON + FIRM → FIRM (pakka) karna = nishchit karna!" },{"sn":285,"word":"Conflict","pos":"N./V.","hindi":"टकराव","meaning":"Serious disagreement or argument; prolonged armed struggle; clash or divergence of opposing principles","synonyms":"Clash (टकराव), Battle (युद्ध)","antonyms":"Accord (समझौता)", "trick": "CONFLICT = CON + FLICT → CON (against) + FLICT (hurl) = ek doosre pe phenkna = takraav!" },{"sn":286,"word":"Confront","pos":"V.","hindi":"सामना करना","meaning":"Meet someone face to face with hostile or argumentative intent","synonyms":"Challenge (चुनौती), Accost (टोकना)","antonyms":"Avoid (टालना)", "trick": "CONFRONT = CON + FRONT → FRONT (aage) se aana = seedha saamna karna!" },{"sn":287,"word":"Confuse","pos":"V.","hindi":"भ्रमित/अस्पष्ट","meaning":"Cause someone to become bewildered or perplexed","synonyms":"Puzzle (पहेली)","antonyms":"Lucid (सुस्पष्ट)", "trick": "CONFUSE = CON + FUSE → FUSE udd jaana = dimaag ka fuse udna = bhramit karna!" },{"sn":288,"word":"Congenial","pos":"Adj.","hindi":"अनुकूल","meaning":"(Of a person) pleasant because of a personality, qualities, or interests that are similar to one's own","synonyms":"Favourable (सकारात्मक), Cordial (हार्दिक), Compatible (संगत)","antonyms":"Unpleasant (अप्रिय), Unsympathetic (असहानुभूतिपूर्ण)", "trick": "CONGENIAL = CON + GENIAL → GENIAL (khushmijaaj) person ke saath = anukooll aur sundar!" },{"sn":289,"word":"Conjecture","pos":"N./V.","hindi":"अनुमान","meaning":"Guess; expression of opinion without sufficient evidence","synonyms":"Guess (अंदाज लगाना)","antonyms":"Certainty (निश्चितता)", "trick": "CONJECTURE — evidence incomplete, phir bhi 'shayad aisa hua hoga' guess kiya = ANUMAAN." },{"sn":290,"word":"Conscientious","pos":"Adj.","hindi":"ईमानदार","meaning":"(Of a person) wishing to do what is right, especially to do one's work or duty well and thoroughly","synonyms":"Honest (ईमानदार), Sedulous (परिश्रमी)","antonyms":"Irresponsible (गैर जिम्मेदार)", "trick": "CONSCIENTIOUS = CONSCIENCE (antaraatma) wala → antaraatma se kaam karna = imaandaar!" },{"sn":291,"word":"Consensus","pos":"N.","hindi":"आम सहमति","meaning":"General agreement","synonyms":"Unanimity (सर्वसम्मति), Agreement (सहमति)","antonyms":"Disagreement (असहमति), Discord (अनबन)", "trick": "CONSENSUS — meeting ke end mein sab ek plan par agree = AAM SAHMATI." },{"sn":292,"word":"Consent","pos":"N./V.","hindi":"सहमति","meaning":"Permission for something to happen or agreement to do something; comply or agree","synonyms":"Assent (सहमति), Permission (अनुमति), Agree (सहमत होना)","antonyms":"Dissent (असहमति), Interdiction (प्रतिबंध), Conflict (संघर्ष)", "trick": "CONSENT → 'permission SENT' (yaad-cue): action se pehle clear 'haan, meri anumati hai' = SAHMATI / ANUMATI." },{"sn":293,"word":"Conserve","pos":"V.","hindi":"संरक्षित करना","meaning":"Protect from harm or destruction; preserve; protect from loss or waste","synonyms":"Preserve (संरक्षित करना)","antonyms":"Destroy (नष्ट करना)", "trick": "CONSERVE = CONSER + VE → CONSERVE (jam) banana = bacha ke rakhna = sanrakshit karna!" },{"sn":294,"word":"Considerate","pos":"Adj.","hindi":"ध्यान रखनेवाला","meaning":"Careful not to cause inconvenience or hurt to others","synonyms":"Thoughtful (विचारशील)","antonyms":"Insensitive (असंवेदनशील)", "trick": "CONSIDERATE = CONSIDER + ATE → doosron ko CONSIDER karna = dhyan rakhna!" },{"sn":295,"word":"Console","pos":"V.","hindi":"सांत्वना देना","meaning":"Comfort someone at a time of grief or disappointment","synonyms":"Solace (शांति), Comfort (आराम)","antonyms":"Agitate (उत्तेजित करना), Aggravate (बिगाड़ना)", "trick": "CONSOLE → 'comfort the SOUL' (sound-cue): sad friend ko support dekar dukh halka = SAANTVANA DENA." },{"sn":296,"word":"Conspicuous","pos":"Adj.","hindi":"सुस्पष्ट","meaning":"Standing out so as to be clearly visible","synonyms":"Evident (प्रत्यक्ष), Obvious (स्पष्ट), Attention-Grabbing (ध्यान आकर्षित करने वाला)","antonyms":"Obscure (अस्पष्ट), Unnoticeable (अप्रत्यक्ष)", "trick": "CONSPICUOUS — white shirts ki crowd mein bright red shirt turant notice = SAAF NAZAR AANE WALA." },{"sn":297,"word":"Constant","pos":"Adj.","hindi":"स्थिर","meaning":"Occurring continuously over a period of time","synonyms":"Steady (स्थिर)","antonyms":"Varying (परिवर्तनीय), Fluctuating (अस्थिर)", "trick": "CONSTANT = CON + STANT → STANT (khada rehna) → hamesha khada = sthir!" },{"sn":298,"word":"Constrain","pos":"V.","hindi":"प्रतिबंधित करना","meaning":"Compel or force someone to follow a particular course of action","synonyms":"Restrict (प्रतिबंध लगाना)","antonyms":"Support (समर्थन)", "trick": "CONSTRAIN = CON + STRAIN → STRAIN (dabaav) lagana = majboor karna = pratibaddhit karna!" },{"sn":299,"word":"Construe","pos":"V.","hindi":"व्याख्या करना","meaning":"Interpret (a word or action) in a particular way","synonyms":"Interpret (व्याख्या करना)","antonyms":"Obscure (अस्पष्ट), Misunderstood (गलत समझ गया)", "trick": "CONSTRUE — uske silence ko tumne 'haan' samjha, doosre ne 'narazgi'; action ka meaning interpret = ARTH NIKAALNA." },{"sn":300,"word":"Contaminate","pos":"V.","hindi":"दूषित करना","meaning":"Make (something) impure by exposure to or addition of a poisonous or polluting substance","synonyms":"Pollute (प्रदूषित करना)","antonyms":"Cleanse (साफ करना), Purify (शुद्ध करना)", "trick": "CONTAMINATE = CONTAIN + MINATE → ganda CONTAIN karna = dooshit karna!" },{"sn":301,"word":"Contemplate","pos":"V.","hindi":"विचार करना","meaning":"Look thoughtfully for a long time at","synonyms":"Envisage (कल्पना करना)","antonyms":"Ignore (अनसुनी करना), Disregard (उपेक्षा करना)", "trick": "CONTEMPLATE = CONTEMP + LATE → late raat tak sochna = gehri soch mein doobna!" },{"sn":302,"word":"Contempt","pos":"N.","hindi":"घृणा","meaning":"The feeling that a person or a thing is beneath consideration, worthless, or deserving scorn","synonyms":"Hatred (घृणा), Disregard (अनदेखी करना)","antonyms":"Approbation (समर्थन), Regard (सम्मान), Respect (सम्मान)", "trick": "CONTEMPT → 'can't respect' (sound-cue): kisi ko apne respect ke laayak bhi na samjho = TIRASKAAR." },{"sn":303,"word":"Contentious","pos":"Adj. n arising from a lack of occupation or excitement","synonyms":"Boredom (बोरियत)","antonyms":"Excitement (उत्साह)", "trick": "ENNUI → 'any new excitement? nahi' (sound-cue): same dull day se bored aur mentally weary = UB / NIRUTSAAH." },{"sn":497,"word":"Enormous","pos":"Adj.","hindi":"विशाल","meaning":"Very large in size, quantity, or extent","synonyms":"Immense (अपार), Huge (विशाल), Massive (वृहद)","antonyms":"Negligible (नगण्य), Tiny (छोटा), Petite (नाजुक)", "trick": "ENORMOUS = E + NORM + OUS → NORM se bahut bada = vishal!" },{"sn":498,"word":"Enrage","pos":"V.","hindi":"क्रोधित करना","meaning":"Make someone very angry","synonyms":"Infuriate (क्रोधित करना), Furious (गुस्से में)","antonyms":"Pleased (प्रसन्न)", "trick": "ENRAGE = EN + RAGE → RAGE (gussa) lana = krodh dilana!" },{"sn":499,"word":"Enrich","pos":"V.","hindi":"समृद्ध करना","meaning":"Improve or enhance the quality or value of","synonyms":"Enhance (बढ़ाना)","antonyms":"Reduce (घटाना), Deplete (खाली करना), Impoverish (निर्धन बनाना)", "trick": "ENRICH = EN + RICH → RICH banana = samridh karna!" },{"sn":500,"word":"Ensconce","pos":"V.","hindi":"छिपाना","meaning":"Establish or settle someone in a comfortable, safe, or secret place","synonyms":"Conceal (छुपाना)","antonyms":"Unveil (अनावरण करना)", "trick": "Comfortable armchair mein safely settle hokar baith jao — ENSCONCE = secure/comfortable jagah mein jama dena." },{"sn":501,"word":"Entangle","pos":"V.","hindi":"उलझाना","meaning":"Cause to become twisted together with or caught in","synonyms":"Implicate (फंसाना)","antonyms":"Untwist (सुलझाना)", "trick": "ENTANGLE = EN + TANGLE → TANGLE mein phasna = ulajhna!" },{"sn":502,"word":"Enthusiasm","pos":"N.","hindi":"उत्साह","meaning":"Intense and eager enjoyment, interest, or approval","synonyms":"Zeal (जोश), Passion (जुनून)","antonyms":"Lethargy (सुस्ती), Apathy (उदासीनता)", "trick": "ENTHUSIASM = ENTHU + SIASM → ENTHU se karna = josh aur utsaah!" },{"sn":503,"word":"Entice","pos":"V.","hindi":"लुभाना","meanin nt and happiness","synonyms":"Rapture (अत्यधिक आनंद)","antonyms":"Lethargy (सुस्ती)", "trick": "EUPHORIA = EU + PHORIA → EU (good) + phoran aanand = param utsaah aur khushi!" },{"sn":523,"word":"Evade/Evasive","pos":"V./Adj.","hindi":"टालना, चकमा देने वाला","meaning":"Escape or avoid, especially by cleverness or trickery; equivocal","synonyms":"Avoid (बचना), Bypass (बाईपास करना), Devious (कपटी)","antonyms":"Confront (सामना करना), Truthful (सच्चा), Frank (स्पष्टवादी), Categorical (स्पष्ट), Straightforward (स्पष्टवादी), Clear (स्पष्ट)", "trick": "EVADE — direct question ka clever golmol reply dekar bachna, ya pursuer ko dodge = TAALNA / CHAKMA DENA." },{"sn":524,"word":"Eventual","pos":"Adj.","hindi":"अंतिम","meaning":"Occurring at the end of a period or process; ultimate","synonyms":"Ultimate (चरम)","antonyms":"Initial (प्रारंभिक)", "trick": "EVENTUAL = EVENT + UAL → EVENT ka aakhiri result = antim aur nirnayak!" },{"sn":525,"word":"Evidence","pos":"N.","hindi":"प्रमाण","meaning":"The available body of facts or information indicating whether a belief or proposition is true or valid","synonyms":"Indication (संकेत)","antonyms":"Concealment (छिपाव)", "trick": "EVIDENCE = EVIDE + NCE → EVIDENCE court mein dikhana = saboot!" },{"sn":526,"word":"Evident","pos":"Adj.","hindi":"स्पष्ट","meaning":"Plain or obvious; clearly seen or understood","synonyms":"Clear (स्पष्ट), Obvious (स्पष्ट), Quite Clear (पूर्ण रूप से स्पष्ट)","antonyms":"Indistinct (अस्पष्ट), Hidden (छिपा हुआ), Obscure (अस्पष्ट), Doubtful (संदिग्ध)", "trick": "EVIDENT = EVI + DENT → DENT (nishan) jo saaf dikhe = spasht aur zahir!" },{"sn":527,"word":"Evince","pos":"V.","hindi":"प्रकट करना","meaning":"Reveal the presence of a quality or feeling; indicate","synonyms":"Show (दिखाना)","antonyms":"Conceal (छिपाना)", "trick": "EVINCE — uski smile se happiness clear hui; behaviour quality ko show kare = PRADARSHIT / PRAKAT KARNA." },{"sn":528,"word":"Evoke","pos":"V.","hindi":"आह्वान करना","meaning":"Bring or recall to                             </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div class="bg-emerald-50/60 border border-emerald-100 rounded-lg p-3">
                                    <span class="text-xs font-bold tracking-wider text-emerald-600 uppercase flex items-center gap-1.5 mb-1"><i class="fa-solid fa-circle-plus"></i> Synonyms</span>
                                    <p class="text-[15px] text-slate-700 leading-relaxed font-medium">${escapeHtml(item.synonyms)}</p>
                                </div>
                                <div class="bg-rose-50/60 border border-rose-100 rounded-lg p-3">
                                    <span class="text-xs font-bold tracking-wider text-rose-600 uppercase flex items-center gap-1.5 mb-1"><i class="fa-solid fa-circle-minus"></i> Antonyms</span>
                                    <p class="text-[15px] text-slate-700 leading-relaxed font-medium">${escapeHtml(item.antonyms)}</p>
                                </div>
                            </div>
                            <div class="mt-4">
                                <span class="text-xs font-bold tracking-wider text-amber-600 uppercase flex items-center gap-1.5 mb-1.5"><i class="fa-solid fa-lightbulb"></i> Memory Trick</span>
                                <p class="text-[15px] text-slate-700 leading-relaxed font-medium bg-amber-50/50 p-3 rounded-lg border border-amber-100">${escapeHtml(item.trick)}</p>
                            </div>
                        </div>
                    `;
                    questionsContainer.appendChild(qCard);

                    // Build option buttons with real closures (no inline onclick / no quote-escaping issues)
                    const optsContainer = qCard.querySelector(`#opts-${item.sn}`);
                    allOpts.forEach((opt, idx) => {
                        const optBtn = document.createElement('button');
                        optBtn.className = "quiz-option w-full text-left px-5 py-3.5 bg-slate-50 border border-slate-200 hover:bg-blue-50 hover:border-blue-300 rounded-xl font-medium text-slate-700 flex items-center gap-3";
                        optBtn.innerHTML = `
                            <span class="option-circle flex-shrink-0 w-7 h-7 rounded-full border-2 border-slate-300 text-slate-500 text-xs font-bold flex items-center justify-center transition-colors">${letters[idx] || ''}</span>
                            <span class="option-text flex-1">${escapeHtml(opt)}</span>
                        `;
                        optBtn.addEventListener('click', () => checkAnswer(optBtn, opt, item, optsContainer));
                        optsContainer.appendChild(optBtn);
                    });
                    }
                    if (renderIndex < words.length) {
                        (window.requestAnimationFrame || window.setTimeout)(renderBatch);
                    }
                }
                renderBatch();
            
        }

        function checkAnswer(btn, selected, item, optsContainer) {
            const explanation = document.getElementById(`exp-${item.sn}`);
            const buttons = optsContainer.querySelectorAll('button');

            // Disable all buttons in this question
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('cursor-not-allowed');
            });

            // The option the user actually clicked gets a blue circle immediately
            const clickedCircle = btn.querySelector('.option-circle');
            if (clickedCircle) {
                clickedCircle.classList.remove('border-slate-300', 'text-slate-500');
                clickedCircle.classList.add('bg-blue-500', 'border-blue-500', 'text-white');
            }

            const isCorrect = selected === item.meaning;

            if (isCorrect) {
                btn.classList.add('option-correct');
                btn.insertAdjacentHTML('beforeend', ' <i class="fa-solid fa-circle-check ml-2 float-right mt-1"></i>');

                // Update live score
                currentScore++;
                syncScoreDisplays();
            } else {
                btn.classList.add('option-incorrect');
                btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
                btn.insertAdjacentHTML('beforeend', ' <i class="fa-solid fa-circle-xmark ml-2 float-right mt-1"></i>');

                // Update live wrong count
                wrongScore++;
                syncScoreDisplays();

                // Reveal the correct option too
                buttons.forEach(b => {
                    const textSpan = b.querySelector('.option-text');
                    if (textSpan && textSpan.textContent === item.meaning) {
                        b.classList.add('option-correct');
                        b.insertAdjacentHTML('beforeend', ' <i class="fa-solid fa-circle-check ml-2 float-right mt-1"></i>');
                    }
                });
            }

            // Show explanation with animation
            explanation.classList.remove('hidden');
            explanation.classList.add('explanation-reveal');
        }

        // Initialize App
        function initQuiz() {
            renderNav();
// Auto-select the first letter that has words
            const firstLetter = alphabets.find(l => groupedData[l].length > 0);
            if (firstLetter) {
                showSection(firstLetter);
            }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initQuiz, { once: true });
        else initQuiz();

    </script>
