cially one seen through a long, narrow opening","synonyms":"Landscape (परिदृश्य)","antonyms":"Blindness (अंधापन)"},{"sn":1315,"word":"Vital","pos":"Adj.","hindi":"महत्वपूर्ण","meaning":"Absolutely necessary or important; essential","synonyms":"Essential (आवश्यक), Crucial (निर्णायक)","antonyms":"Trivial (तुच्छ), Superfluous (अनावश्यक), Dispensable (व्यर्थ)"},{"sn":1316,"word":"Vitiate","pos":"V.","hindi":"बिगाड़ना","meaning":"Spoil or impair the quality or efficiency of","synonyms":"Annihilate (नष्ट करना)","antonyms":"Affirm (पुष्टि करना)"},{"sn":1317,"word":"Vituperate","pos":"V.","hindi":"निंदा करना","meaning":"Blame or insult (someone) in strong or violent language","synonyms":"Abuse (गाली देना)","antonyms":"Praise (प्रशंसा)"},{"sn":1318,"word":"Vivacious","pos":"Adj.","hindi":"जिंदादिल","meaning":"(Especially of a woman) attractively lively and animated","synonyms":"Lively (प्राणवान), Energetic (ऊर्जावान)","antonyms":"Apathy (उदासीनता), Weary (थका हुआ), Languid (सुस्त)"},{"sn":1319,"word":"Vivid","pos":"Adj.","hindi":"जीवंत","meaning":"Producing powerful feelings or strong, clear images in the mind","synonyms":"Lucid (स्पष्ट), Evocative (स्मरणात्मक), Clear (स्पष्ट), Lively (जीवंत)","antonyms":"Murky (धुंधला)"},{"sn":1320,"word":"Vociferous","pos":"Adj.","hindi":"कोलाहलपूर्ण","meaning":"Vehement or clamorous","synonyms":"Loud (ज़ोर से)","antonyms":"Silent (मौन), Quiet (शांत)"},{"sn":1321,"word":"Volition","pos":"N.","hindi":"इच्छा","meaning":"The faculty or power of using one's will","synonyms":"Choice (विकल्प)","antonyms":"Compulsion (विवशता), Unwillingness (अनिच्छा)"},{"sn":1322,"word":"Voluble","pos":"Adj.","hindi":"वाचाल","meaning":"Speaking or spoken incessantly and fluently","synonyms":"Garrulous (बातूनी)","antonyms":"Reserved (संकोची)"},{"sn":1323,"word":"Voracious","pos":"Adj.","hindi":"भुक्खड़","meaning":"Wanting or devouring great quantities of food; having a very eager approach to an activity","synonyms":"Greedy (लालची), Hungry (भूखा), Insatiable (अतृप्त)","antonyms":"Complete (पूर्ण)"},{"sn":1324,"word":"Vulgar","pos":"Adj.","hindi":"अश्लील","meaning":"Lacking sophistication or good taste; unrefined","synonyms":"Abusive (गाली-गलौच)","antonyms":"Refined (निर्मल)"},{"sn":1325,"word":"Vulnerable","pos":"Adj.","hindi":"असुरक्षित","meaning":"Susceptible to physical or emotional attack or harm","synonyms":"Exposed (असुरक्षित), At Risk (जोखिम में), Defenceless (रक्षाहीन), Susceptible (संवेदनशील)","antonyms":"Secure (सुरक्षित), Impervious (अप्रभावित), Stoicism (संयम)"},{"sn":1326,"word":"Wane","pos":"V.","hindi":"कम होना, घटना","meaning":"(Especially of a condition or feeling) decrease in vigour, power, or extent; become weaker","synonyms":"Decline (गिरावट)","antonyms":"Increase (बढ़ोतरी), Intensify (तीव्रता), Grow (बढ़ना), Swell (सूजना), Rise (उठना)"},{"sn":1327,"word":"Wary","pos":"Adj.","hindi":"सतर्क","meaning":"Feeling or showing caution about possible dangers or problems","synonyms":"Alert (चौकन्ना)","antonyms":"Rash (उतावला), Careless (लापरवाह)"},{"sn":1328,"word":"Wavering","pos":"Adj.","hindi":"अस्थिर","meaning":"Hesitating between different opinions or actions; indecisive","synonyms":"Fluctuating (उतार-चढ़ाव वाला)","antonyms":"Unchanging (अपरिवर्तनीय)"},{"sn":1329,"word":"Weary","pos":"Adj.","hindi":"थका हुआ","meaning":"Feeling or showing tiredness, especially as a result of excessive exertion or lack of sleep","synonyms":"Exhausted (थका माँदा), Tired (थका), Weak (कमज़ोर)","antonyms":"Refreshed (तरोताज़ा)"},{"sn":1330,"word":"Weird","pos":"Adj.","hindi":"अजीब","meaning":"Suggesting something supernatural; uncanny","synonyms":"Strange (विचित्र), Unnatural (अप्राकृतिक)","antonyms":"Usual (सामान्य), Normal (सामान्य)"},{"sn":1331,"word":"Whimsical","pos":"Adj.","hindi":"मन मौजी","meaning":"Playfully quaint or fanciful, especially in an appealing and amusing way","synonyms":"Funny (मजेदार), Weird (अजीब), Fanciful (मौजी)","antonyms":"Common (सामान्य)"},{"sn":1332,"word":"Wholesome","pos":"Adj.","hindi":"स्वास्थ्यप्रद","meaning":"Conducive to or suggestive of good health and physical well-being","synonyms":"Sound (स्वस्थ), Nourishing (पौष्टिक)","antonyms":"Impure (अशुद्ध), Unhealthy (अस्वस्थ)"},{"sn":1333,"word":"Wily","pos":"Adj.","hindi":"चालाक","meaning":"Skilled at gaining an advantage, especially deceitfully","synonyms":"Cunning (कपटी), Crafty (कुटिल), Sly (चालाक)","antonyms":"Honest (ईमानदार)"},{"sn":1334,"word":"Winsome","pos":"Adj.","hindi":"आकर्षक","meaning":"Attractive or appealing in appearance or character","synonyms":"Charming (मनमोहक)","antonyms":"Repelling (घिनौना), Unamiable (अप्रिय)"},{"sn":1335,"word":"Wisdom","pos":"N.","hindi":"बुद्धिमत्ता","meaning":"The quality of having experience, knowledge, and good judgment; the quality of being wise","synonyms":"Insight (अंतदृष्टि)","antonyms":"Stupidity (मूर्खता), Imbecility (निर्बुद्धिता), Folly (मूर्खता)"},{"sn":1336,"word":"Wrathful","pos":"Adj.","hindi":"क्रोधित","meaning":"Full of or characterized by intense anger","synonyms":"Furious (उग्र), Enraged (क्रोधित)","antonyms":"Calm (शांत)"},{"sn":1337,"word":"Yell","pos":"N./V.","hindi":"चिल्लाना","meaning":"A loud, sharp cry of pain, surprise, or delight; as a verb, to shout something very loudly","synonyms":"Shout (चिल्लाना)","antonyms":"Whisper (फुसफुसाना)"},{"sn":1338,"word":"Yield","pos":"N./V.","hindi":"उपज","meaning":"Produce; provide; give up; surrender; agree to demands or submit","synonyms":"Produce (उत्पादन), Harvest (फसल)","antonyms":"Resist (प्रतिरोध करना)"},{"sn":1339,"word":"Yield (surrender sense)","pos":"N.","hindi":"हार मानना","meaning":"Give way to arguments, demands, or pressure","synonyms":"Submit (समर्पण करना), Concede (हार मानना)","antonyms":"Resist (विरोध)"},{"sn":1340,"word":"Yoke","pos":"N./V.","hindi":"गुलामी/पराधीनता का चिह्न","meaning":"Wooden crosspiece fastened over the necks of two animals; bond or tie","synonyms":"Harness (काम में लाना)","antonyms":"Liberty (स्वतंत्रता)"},{"sn":1341,"word":"Zeal","pos":"N.","hindi":"उत्साह","meaning":"Great energy or enthusiasm in pursuit of a cause or an objective","synonyms":"Zest (उत्साह), Passion (जुनून)","antonyms":"Apathy (उदासीनता)"},{"sn":1342,"word":"Zealous","pos":"Adj.","hindi":"उत्साही","meaning":"Having or showing zeal","synonyms":"Enthusiastic (उत्साहपूर्ण)","antonyms":"Indifferent (उदासीन)"},{"sn":1343,"word":"Zenith","pos":"N.","hindi":"शीर्ष बिंदु","meaning":"Highest point reached by a celestial or other object; point directly overhead","synonyms":"Summit (शिखर), Pinnacle (चरम)","antonyms":"Nadir (निम्नतम बिंदु), Bottom (तल), Base (आधार), Depth (गहराई)"},{"sn":1344,"word":"Zest","pos":"N.","hindi":"उत्साह","meaning":"Great enthusiasm and energy","synonyms":"Enthusiasm (उत्साह)","antonyms":"Monotonousness (नीरसता)"}];

        let groupedData = {};
        const alphabets = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
        
        // Initialize A-Z arrays
        alphabets.forEach(letter => groupedData[letter] = []);

        // Populate groups
        vocabData.forEach(item => {
            const firstLetter = item.word.charAt(0).toUpperCase();
            if(groupedData[firstLetter]) {
                groupedData[firstLetter].push(item);
            }
        });

        let currentScore = 0;

        // Shuffle array helper
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Escape text before injecting via innerHTML
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Get 3 random wrong meaning options (excluded by sn, not text, since meanings must be unique per question)
        function getWrongOptions(correctSn) {
            let options = [];
            let pool = [...vocabData].filter(w => w.sn !== correctSn);
            pool = shuffle(pool);
            for(let i=0; i<3; i++) {
                if(pool[i]) options.push(pool[i].meaning);
            }
            return options;
        }

        let activeLetter = null;
        const navButtons = {};

        function renderNav() {
            const navContainer = document.getElementById('alphabet-container');
            alphabets.forEach(letter => {
                const count = groupedData[letter].length;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.dataset.letter = letter;
                btn.className = navBtnClass(letter, count > 0, false);
                btn.textContent = letter;

                if (count > 0) {
                    btn.addEventListener('click', () => showSection(letter));
                } else {
                    btn.disabled = true;
                }

                navButtons[letter] = btn;
                navContainer.appendChild(btn);
            });
        }

        function navBtnClass(letter, hasWords, isActive) {
            if (!hasWords) {
                return 'flex-shrink-0 px-4 py-2 rounded-full text-sm font-semibold transition-all bg-slate-100 text-slate-400 cursor-not-allowed opacity-50';
            }
            if (isActive) {
                return 'flex-shrink-0 px-4 py-2 rounded-full text-sm font-semibold transition-all bg-blue-600 border border-blue-600 text-white shadow-md';
            }
            return 'flex-shrink-0 px-4 py-2 rounded-full text-sm font-semibold transition-all bg-white border border-slate-200 text-slate-700 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200';
        }

        // Show only the chosen letter's section; hide every other section; highlight the nav button
        function showSection(letter) {
            if (activeLetter && navButtons[activeLetter]) {
                navButtons[activeLetter].className = navBtnClass(activeLetter, true, false);
            }

            document.querySelectorAll('#quiz-container > section').forEach(sec => {
                sec.classList.toggle('hidden', sec.id !== `section-${letter}`);
            });

            if (navButtons[letter]) {
                navButtons[letter].className = navBtnClass(letter, true, true);
            }

            activeLetter = letter;
            document.getElementById('quiz-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            
            alphabets.forEach(letter => {
                const words = groupedData[letter];
                if (words.length === 0) return; // Skip empty letters

                // Create Section
                const section = document.createElement('section');
                section.id = `section-${letter}`;
                section.className = "mb-12 scroll-mt-24 hidden";
                
                // Section Header
                section.innerHTML = `
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center text-xl font-bold shadow-md">
                            ${letter}
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-blue-100 pb-1 flex-1">Words starting with ${letter}</h2>
                    </div>
                    <div class="space-y-6" id="questions-${letter}"></div>
                `;
                container.appendChild(section);

                const questionsContainer = section.querySelector(`#questions-${letter}`);

                // Render questions for this section
                words.forEach(item => {
                    const wrongOpts = getWrongOptions(item.sn);
                    let allOpts = [...wrongOpts, item.meaning];
                    allOpts = shuffle(allOpts);
                    const letters = ['A', 'B', 'C', 'D'];

                    const qCard = document.createElement('div');
                    qCard.className = "bg-white border border-slate-200 shadow-sm rounded-2xl p-5 sm:p-6 hover:shadow-md transition-shadow";

                    qCard.innerHTML = `
                        <div class="flex items-start gap-4 mb-5">
                            <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-md mt-0.5">Q${item.sn}</span>
                            <h3 class="text-lg sm:text-xl font-semibold text-slate-800 leading-snug flex-1">${escapeHtml(item.word)}</h3>
                            ${item.pos ? `<span class="bg-slate-100 text-slate-500 text-xs font-bold px-2.5 py-1 rounded-md mt-0.5 italic">${escapeHtml(item.pos)}</span>` : ''}
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="opts-${item.sn}"></div>

                        <!-- Explanation Div (Hidden by default) -->
                        <div id="exp-${item.sn}" class="hidden mt-5 bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 rounded-xl p-5">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-blue-200/60 pb-3 mb-3">
                                <div>
                                    <span class="text-xs font-bold tracking-wider text-blue-500 uppercase">Correct Meaning</span>
                                    <div class="text-lg font-bold text-blue-800 mt-0.5">${escapeHtml(item.meaning)}</div>
                                </div>
                                <div class="sm:text-right">
                                    <span class="text-xs font-bold tracking-wider text-emerald-600 uppercase">Hindi Meaning</span>
                                    <div class="devanagari text-lg font-semibold text-emerald-800 mt-0.5">${escapeHtml(item.hindi)}</div>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div class="bg-emerald-50/60 border border-emerald-100 rounded-lg p-3">
                                    <span class="text-xs font-bold tracking-wider text-emerald-600 uppercase flex items-center gap-1.5 mb-1"><i class="fa-solid fa-circle-plus"></i> Synonyms</span>
                                    <p class="text-[15px] text-slate-700 leading-relaxed font-medium">${escapeHtml(item.synonyms)}</p>
                                </div>
                                <div class="bg-rose-50/60 border border-rose-100 rounded-lg p-3">
                                    <span class="text-xs font-bold tracking-wider text-rose-600 uppercase flex items-center gap-1.5 mb-1"><i class="fa-solid fa-circle-minus"></i> Antonyms</span>
                                    <p class="text-[15px] text-slate-700 leading-relaxed font-medium">${escapeHtml(item.antonyms)}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    questionsContainer.appendChild(qCard);

                    // Build option buttons with real closures (no inline onclick / no quote-escaping issues)
                    const optsContainer = qCard.querySelector(`#opts-${item.sn}`);
                    allOpts.forEach((opt, idx) => {
                        const optBtn = document.createElement('button');
                        optBtn.className = "quiz-option w-full text-left px-5 py-3.5 bg-slate-50 border border-slate-200 hover:bg-blue-50 hover:border-blue-300 rounded-xl font-medium text-slate-700 flex items-center gap-3";
                        optBtn.innerHTML = `
                            <span class="option-circle flex-shrink-0 w-7 h-7 rounded-full border-2 border-slate-300 text-slate-500 text-xs font-bold flex items-center justify-center transition-colors">${letters[idx] || ''}</span>
                            <span class="option-text flex-1">${escapeHtml(opt)}</span>
                        `;
                        optBtn.addEventListener('click', () => checkAnswer(optBtn, opt, item, optsContainer));
                        optsContainer.appendChild(optBtn);
                    });
                });
            });
        }

        function checkAnswer(btn, selected, item, optsContainer) {
            const explanation = document.getElementById(`exp-${item.sn}`);
            const buttons = optsContainer.querySelectorAll('button');

            // Disable all buttons in this question
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('cursor-not-allowed');
            });

            // The option the user actually clicked gets a blue circle immediately
            const clickedCircle = btn.querySelector('.option-circle');
            if (clickedCircle) {
                clickedCircle.classList.remove('border-slate-300', 'text-slate-500');
                clickedCircle.classList.add('bg-blue-500', 'border-blue-500', 'text-white');
            }

            const isCorrect = selected === item.meaning;

            if (isCorrect) {
                btn.classList.add('option-correct');
                btn.insertAdjacentHTML('beforeend', ' <i class="fa-solid fa-circle-check ml-2 float-right mt-1"></i>');

                // Update Score
                currentScore++;
                document.getElementById('total-score').textContent = currentScore;
                document.getElementById('mobile-score').textContent = currentScore;
            } else {
                btn.classList.add('option-incorrect');
                btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
                btn.insertAdjacentHTML('beforeend', ' <i class="fa-solid fa-circle-xmark ml-2 float-right mt-1"></i>');

                // Reveal the correct option too
                buttons.forEach(b => {
                    const textSpan = b.querySelector('.option-text');
                    if (textSpan && textSpan.textContent === item.meaning) {
                        b.classList.add('option-correct');
                        b.insertAdjacentHTML('beforeend', ' <i class="fa-solid fa-circle-check ml-2 float-right mt-1"></i>');
                    }
                });
            }

            // Show explanation with animation
            explanation.classList.remove('hidden');
            explanation.classList.add('explanation-reveal');
        }

        // Initialize App
        window.onload = () => {
            renderNav();
            renderQuiz();

            // Auto-select the first letter that has words
            const firstLetter = alphabets.find(l => groupedData[l].length > 0);
            if (firstLetter) {
                showSection(firstLetter);
            }
        };

    </script>
