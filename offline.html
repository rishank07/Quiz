<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070a13" />
  <title>You're offline | ExamFusion Prep</title>
  <style>
    :root { color-scheme: dark; --bg: #070a13; --panel: #0e1426; --gold: #f6d98a; --text: #f5f1e6; --muted: #b8bdc9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #172445, var(--bg) 58%); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
    main { width: min(520px, 100%); text-align: center; padding: 36px 26px; border: 1px solid rgba(246,217,138,.22); border-radius: 24px; background: rgba(14,20,38,.9); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
    img { width: 112px; height: 112px; object-fit: contain; }
    h1 { margin: 20px 0 10px; color: var(--gold); font-size: clamp(1.7rem, 6vw, 2.25rem); }
    p { color: var(--muted); line-height: 1.65; margin: 8px auto; }
    .hi { color: var(--text); }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
    button, a { border-radius: 12px; padding: 12px 18px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    button { border: 0; color: #111827; background: var(--gold); }
    a { color: var(--gold); border: 1px solid rgba(246,217,138,.5); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="./logo.png" alt="ExamFusion Prep logo" />
    <h1>You're offline</h1>
    <p class="hi">अभी इंटरनेट कनेक्शन उपलब्ध नहीं है।</p>
    <p>Reconnect and try again. Pages you opened earlier may remain available offline.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="./index.html">Home</a>
    </div>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
