<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title"><title id="title">Excel worksheet limits by file format</title><rect width="1000" height="400" rx="24" fill="#f5f8ff"/><g font-family="Arial,sans-serif"><text x="36" y="55" font-size="29" font-weight="700" fill="#172554">Excel worksheet limits by file format</text><rect x="30" y="80" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="80" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="113" font-size="23" font-weight="700" fill="#312e81">Excel 97–2003: .xls</text><text x="55" y="144" font-size="20" fill="#334155">65,536 rows × 256 columns  •  Columns A–IV  •  Last cell IV65536</text><rect x="30" y="180" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="180" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="213" font-size="23" font-weight="700" fill="#312e81">Excel 2007 and later: .xlsx</text><text x="55" y="244" font-size="20" fill="#334155">1,048,576 rows × 16,384 columns  •  A–XFD  •  Last cell XFD1048576</text><rect x="30" y="280" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="280" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="313" font-size="23" font-weight="700" fill="#312e81">Compatibility mode</text><text x="55" y="344" font-size="20" fill="#334155">An older .xls workbook retains the older format limits.</text></g></svg>