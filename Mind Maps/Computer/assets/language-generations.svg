<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title"><title id="title">Language generations: common exam model</title><rect width="1000" height="600" rx="24" fill="#f5f8ff"/><g font-family="Arial,sans-serif"><text x="36" y="55" font-size="29" font-weight="700" fill="#172554">Language generations: common exam model</text><rect x="30" y="80" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="80" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="113" font-size="23" font-weight="700" fill="#312e81">1GL: machine language</text><text x="55" y="144" font-size="20" fill="#334155">Binary-encoded processor instructions.</text><rect x="30" y="180" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="180" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="213" font-size="23" font-weight="700" fill="#312e81">2GL: assembly language</text><text x="55" y="244" font-size="20" fill="#334155">Symbolic mnemonics for a processor instruction set.</text><rect x="30" y="280" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="280" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="313" font-size="23" font-weight="700" fill="#312e81">3GL: high-level programming</text><text x="55" y="344" font-size="20" fill="#334155">Examples: C, C++, Java, Python; procedural and other paradigms.</text><rect x="30" y="380" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="380" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="413" font-size="23" font-weight="700" fill="#312e81">4GL: domain / problem-oriented</text><text x="55" y="444" font-size="20" fill="#334155">Examples often include SQL and report-generation languages.</text><rect x="30" y="480" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="480" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="513" font-size="23" font-weight="700" fill="#312e81">5GL: logic / constraint-oriented</text><text x="55" y="544" font-size="20" fill="#334155">Prolog is a common example; classifications are not a universal standard.</text></g></svg>