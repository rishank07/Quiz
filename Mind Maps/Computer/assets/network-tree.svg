<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"><title>Tree network topology</title><rect width="1000" height="500" rx="24" fill="#f5f8ff"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="48" font-size="29" font-weight="700" fill="#172554">Tree topology: hierarchical branches</text><path d="M500,125 L260,215" stroke="#6366f1" stroke-width="5"/><path d="M500,125 L740,215" stroke="#6366f1" stroke-width="5"/><path d="M260,265 L140,360" stroke="#6366f1" stroke-width="5"/><path d="M260,265 L380,360" stroke="#6366f1" stroke-width="5"/><path d="M740,265 L620,360" stroke="#6366f1" stroke-width="5"/><path d="M740,265 L860,360" stroke="#6366f1" stroke-width="5"/><rect x="395" y="72" width="210" height="56" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/><text x="500" y="108" font-size="23" fill="#312e81">Root switch</text><rect x="155" y="212" width="210" height="56" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/><text x="260" y="248" font-size="23" fill="#312e81">Branch switch</text><rect x="635" y="212" width="210" height="56" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/><text x="740" y="248" font-size="23" fill="#312e81">Branch switch</text><rect x="35" y="357" width="210" height="56" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/><text x="140" y="393" font-size="23" fill="#312e81">Host A</text><rect x="275" y="357" width="210" height="56" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/><text x="380" y="393" font-size="23" fill="#312e81">Host B</text><rect x="515" y="357" width="210" height="56" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/><text x="620" y="393" font-size="23" fill="#312e81">Host C</text><rect x="755" y="357" width="210" height="56" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/><text x="860" y="393" font-size="23" fill="#312e81">Host D</text><text x="500" y="463" font-size="20" fill="#475569">A failed upstream device can isolate its branch; redundancy can reduce this risk.</text></g></svg>