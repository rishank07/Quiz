<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title"><title id="title">Programming paradigms and examples</title><rect width="1000" height="600" rx="24" fill="#f5f8ff"/><g font-family="Arial,sans-serif"><text x="36" y="55" font-size="29" font-weight="700" fill="#172554">Programming paradigms and examples</text><rect x="30" y="80" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="80" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="113" font-size="23" font-weight="700" fill="#312e81">Procedural</text><text x="55" y="144" font-size="20" fill="#334155">C; instructions organized into procedures or functions.</text><rect x="30" y="180" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="180" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="213" font-size="23" font-weight="700" fill="#312e81">Object-oriented</text><text x="55" y="244" font-size="20" fill="#334155">Java, C++ and Python support classes and objects.</text><rect x="30" y="280" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="280" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="313" font-size="23" font-weight="700" fill="#312e81">Functional</text><text x="55" y="344" font-size="20" fill="#334155">Lisp, Haskell and functional features in multi-paradigm languages.</text><rect x="30" y="380" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="380" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="413" font-size="23" font-weight="700" fill="#312e81">Logic / declarative</text><text x="55" y="444" font-size="20" fill="#334155">Prolog expresses facts and rules; SQL expresses database queries.</text><rect x="30" y="480" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="480" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="513" font-size="23" font-weight="700" fill="#312e81">Languages can support several paradigms</text><text x="55" y="544" font-size="20" fill="#334155">A paradigm and a language generation describe different aspects.</text></g></svg>