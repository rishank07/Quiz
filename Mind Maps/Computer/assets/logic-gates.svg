<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 955" role="img" aria-labelledby="title"><title id="title">Logic gates: Boolean rules</title><rect width="1000" height="955" rx="24" fill="#f5f8ff"/><g font-family="Arial,sans-serif"><text x="36" y="55" font-size="29" font-weight="700" fill="#172554">Logic gates: Boolean rules</text><rect x="30" y="80" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="80" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="113" font-size="23" font-weight="700" fill="#312e81">BUFFER: Y = A</text><text x="55" y="144" font-size="20" fill="#334155">Output equals input.</text><rect x="30" y="180" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="180" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="213" font-size="23" font-weight="700" fill="#312e81">NOT: Y = NOT A</text><text x="55" y="244" font-size="20" fill="#334155">Output inverts input: 0 → 1; 1 → 0.</text><rect x="30" y="280" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="280" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="313" font-size="23" font-weight="700" fill="#312e81">AND: Y = A AND B</text><text x="55" y="344" font-size="20" fill="#334155">Output is 1 only when both inputs are 1.</text><rect x="30" y="380" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="380" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="413" font-size="23" font-weight="700" fill="#312e81">OR: Y = A OR B</text><text x="55" y="444" font-size="20" fill="#334155">Output is 1 when at least one input is 1.</text><rect x="30" y="480" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="480" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="513" font-size="23" font-weight="700" fill="#312e81">NAND: Y = NOT (A AND B)</text><text x="55" y="544" font-size="20" fill="#334155">Output is 0 only when both inputs are 1.</text><rect x="30" y="580" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="580" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="613" font-size="23" font-weight="700" fill="#312e81">NOR: Y = NOT (A OR B)</text><text x="55" y="644" font-size="20" fill="#334155">Output is 1 only when both inputs are 0.</text><rect x="30" y="680" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="680" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="713" font-size="23" font-weight="700" fill="#312e81">XOR: Y = A XOR B</text><text x="55" y="744" font-size="20" fill="#334155">For two inputs, output is 1 when inputs differ.</text><rect x="30" y="780" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="780" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="813" font-size="23" font-weight="700" fill="#312e81">XNOR: Y = NOT (A XOR B)</text><text x="55" y="844" font-size="20" fill="#334155">For two inputs, output is 1 when inputs are equal.</text><text x="36" y="930" font-size="18" fill="#475569">NAND and NOR are universal gates; NOT alone is not universal.</text></g></svg>