<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 755" role="img" aria-labelledby="title"><title id="title">Common file extensions</title><rect width="1000" height="755" rx="24" fill="#f5f8ff"/><g font-family="Arial,sans-serif"><text x="36" y="55" font-size="29" font-weight="700" fill="#172554">Common file extensions</text><rect x="30" y="80" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="80" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="113" font-size="23" font-weight="700" fill="#312e81">Microsoft Office</text><text x="55" y="144" font-size="20" fill="#334155">Word: .docx / .doc  •  Excel: .xlsx / .xls  •  PowerPoint: .pptx / .ppt</text><rect x="30" y="180" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="180" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="213" font-size="23" font-weight="700" fill="#312e81">Text, markup and documents</text><text x="55" y="244" font-size="20" fill="#334155">Plain text: .txt  •  PDF: .pdf  •  Web: .html  •  XML: .xml</text><rect x="30" y="280" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="280" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="313" font-size="23" font-weight="700" fill="#312e81">Images and graphics</text><text x="55" y="344" font-size="20" fill="#334155">JPEG: .jpg / .jpeg  •  PNG: .png  •  GIF: .gif  •  CorelDRAW: .cdr</text><rect x="30" y="380" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="380" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="413" font-size="23" font-weight="700" fill="#312e81">Audio and video</text><text x="55" y="444" font-size="20" fill="#334155">MP3 audio: .mp3  •  WAV audio: .wav  •  MP4 multimedia container: .mp4</text><rect x="30" y="480" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="480" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="513" font-size="23" font-weight="700" fill="#312e81">Programs and archives</text><text x="55" y="544" font-size="20" fill="#334155">Windows executable: .exe  •  Archives: .zip / .rar / .7z</text><rect x="30" y="580" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="580" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="613" font-size="23" font-weight="700" fill="#312e81">Database files</text><text x="55" y="644" font-size="20" fill="#334155">Microsoft Access: .accdb (modern) / .mdb (older)</text><text x="36" y="730" font-size="18" fill="#475569">An extension identifies a file type; renaming it does not convert the file contents.</text></g></svg>