<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title"><title id="title">Why NAND and NOR are universal</title><rect width="1000" height="700" rx="24" fill="#f5f8ff"/><g font-family="Arial,sans-serif"><text x="36" y="55" font-size="29" font-weight="700" fill="#172554">Why NAND and NOR are universal</text><rect x="30" y="80" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="80" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="113" font-size="23" font-weight="700" fill="#312e81">NOT from NAND</text><text x="55" y="144" font-size="20" fill="#334155">Connect both NAND inputs to A: NOT A = NAND(A, A).</text><rect x="30" y="180" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="180" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="213" font-size="23" font-weight="700" fill="#312e81">AND from NAND</text><text x="55" y="244" font-size="20" fill="#334155">Invert NAND(A, B) using a second NAND with tied inputs.</text><rect x="30" y="280" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="280" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="313" font-size="23" font-weight="700" fill="#312e81">OR from NAND</text><text x="55" y="344" font-size="20" fill="#334155">NAND(NAND(A, A), NAND(B, B)) = A OR B.</text><rect x="30" y="380" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="380" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="413" font-size="23" font-weight="700" fill="#312e81">NOT from NOR</text><text x="55" y="444" font-size="20" fill="#334155">Connect both NOR inputs to A: NOT A = NOR(A, A).</text><rect x="30" y="480" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="480" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="513" font-size="23" font-weight="700" fill="#312e81">OR from NOR</text><text x="55" y="544" font-size="20" fill="#334155">Invert NOR(A, B) using a second NOR with tied inputs.</text><rect x="30" y="580" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="580" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="613" font-size="23" font-weight="700" fill="#312e81">AND from NOR</text><text x="55" y="644" font-size="20" fill="#334155">NOR(NOR(A, A), NOR(B, B)) = A AND B.</text></g></svg>