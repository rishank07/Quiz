<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 655" role="img" aria-labelledby="title"><title id="title">Computer memory and storage hierarchy</title><rect width="1000" height="655" rx="24" fill="#f5f8ff"/><g font-family="Arial,sans-serif"><text x="36" y="55" font-size="29" font-weight="700" fill="#172554">Computer memory and storage hierarchy</text><rect x="30" y="80" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="80" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="113" font-size="23" font-weight="700" fill="#312e81">1. CPU registers</text><text x="55" y="144" font-size="20" fill="#334155">Smallest and fastest working storage inside the CPU; volatile.</text><rect x="30" y="180" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="180" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="213" font-size="23" font-weight="700" fill="#312e81">2. CPU cache: L1 → L2 → L3</text><text x="55" y="244" font-size="20" fill="#334155">Stores frequently needed data; typically SRAM; volatile.</text><rect x="30" y="280" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="280" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="313" font-size="23" font-weight="700" fill="#312e81">3. Main memory: RAM</text><text x="55" y="344" font-size="20" fill="#334155">Holds running programs and active data; typically DRAM; volatile.</text><rect x="30" y="380" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="380" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="413" font-size="23" font-weight="700" fill="#312e81">4. Secondary storage: SSD / HDD</text><text x="55" y="444" font-size="20" fill="#334155">Persistent files; usually larger and slower than RAM; non-volatile.</text><rect x="30" y="480" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="480" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="513" font-size="23" font-weight="700" fill="#312e81">5. Archival storage: optical / tape</text><text x="55" y="544" font-size="20" fill="#334155">Persistent storage commonly used for backup or long-term archives.</text><text x="36" y="630" font-size="18" fill="#475569">ROM/flash stores firmware. Virtual memory maps addresses and may use disk-backed pages.</text></g></svg>