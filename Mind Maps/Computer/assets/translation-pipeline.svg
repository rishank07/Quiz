<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title"><title id="title">How programs are translated</title><rect width="1000" height="500" rx="24" fill="#f5f8ff"/><g font-family="Arial,sans-serif"><text x="36" y="55" font-size="29" font-weight="700" fill="#172554">How programs are translated</text><rect x="30" y="80" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="80" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="113" font-size="23" font-weight="700" fill="#312e81">Assembly source → assembler → machine code</text><text x="55" y="144" font-size="20" fill="#334155">An assembler translates ISA-specific mnemonics.</text><rect x="30" y="180" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="180" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="213" font-size="23" font-weight="700" fill="#312e81">High-level source → compiler → target code</text><text x="55" y="244" font-size="20" fill="#334155">The target can be native machine code, bytecode or another language.</text><rect x="30" y="280" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="280" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="313" font-size="23" font-weight="700" fill="#312e81">Source or bytecode → interpreter / runtime</text><text x="55" y="344" font-size="20" fill="#334155">Execution may combine interpretation and just-in-time compilation.</text><rect x="30" y="380" width="940" height="88" rx="14" fill="white" stroke="#b8cbee"/><rect x="30" y="380" width="9" height="88" rx="4" fill="#4f46e5"/><text x="55" y="413" font-size="23" font-weight="700" fill="#312e81">Portability depends on the environment</text><text x="55" y="444" font-size="20" fill="#334155">Source, libraries, compiler, runtime and target platform all matter.</text></g></svg>