<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>My Saved Pages | Crux & Tricks | ExamFusion Prep</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0f172a">
  <script>(function(){try{if(localStorage.getItem('efp_black_mode')==='on')document.documentElement.classList.add('dark')}catch(e){}})();</script>
  <style>
    :root{--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dce2ec;--nav:#12345a;--accent:#b7832f;--soft:#f7f1e6;--danger:#9b2c2c;--shadow:0 8px 26px rgba(24,39,75,.08)}
    html.dark{--bg:#070a10;--card:#111722;--text:#f5f7fb;--muted:#aab4c3;--line:#273244;--nav:#17395f;--accent:#e7b85f;--soft:#1b2432;--danger:#ff9b9b;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{padding-bottom:max(28px,env(safe-area-inset-bottom))}
    .top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));background:var(--nav);color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.18)}
    .top button,.top a{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:9px 11px;font-weight:800;text-decoration:none;cursor:pointer}.top-title{min-width:0;text-align:center}.top-title b{display:block;font-size:15px}.top-title small{display:block;opacity:.78;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{min-width:42px;text-align:center}
    main{width:min(900px,calc(100% - 20px));margin:18px auto}.hero{text-align:center;margin:8px 0 17px}.hero h1{font-size:clamp(24px,5vw,34px);margin:0 0 6px}.hero p{margin:0;color:var(--muted);font-size:12px}
    .search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 13px;box-shadow:var(--shadow);margin-bottom:14px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font:700 14px/1.3 inherit}.search input::placeholder{color:var(--muted);font-weight:500}
    .list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.page-pill{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.04em}.title{font-size:14px;font-weight:850;line-height:1.35;margin-top:6px}.remove-x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 4px}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.badge{padding:4px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:9px;font-weight:800}.badge.original{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--soft)}.meta{margin-top:8px;color:var(--muted);font-size:10px;line-height:1.45}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.open{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:10px;background:var(--nav);color:#fff;padding:9px 11px;font-size:10px;font-weight:850}.remove{border:0;background:transparent;color:var(--danger);font-size:10px;font-weight:800;cursor:pointer;padding:7px}
    .empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;text-align:center;padding:34px 16px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}.empty a{display:inline-flex;margin-top:13px;text-decoration:none;background:var(--nav);color:#fff;padding:9px 12px;border-radius:10px;font-size:11px;font-weight:850}
    @media(max-width:680px){main{width:min(100% - 14px,900px);margin-top:11px}.list{grid-template-columns:1fr}.top{gap:6px}.top button,.top a{padding:8px 9px;font-size:11px}.top-title b{font-size:13px}.hero{margin-top:4px}.hero h1{font-size:25px}.card{padding:12px}}
  </style>
</head>
<body>
  <header class="top">
    <button id="backBtn" type="button">← Back</button>
    <div class="top-title"><b>My Saved Pages</b><small>Crux & Tricks · सहेजे हुए पेज</small></div>
    <span id="countTop" class="count">0</span>
  </header>
  <main>
    <section class="hero"><h1>🔖 My Pages</h1><p>Book Crux और Chapter Tricks में bookmark किए सभी PDF pages</p></section>
    <label class="search"><span>⌕</span><input id="searchBox" type="search" autocomplete="off" placeholder="Search saved pages / सहेजे पेज खोजें…"></label>
    <section id="list" class="list"></section>
  </main>
  <script src="crux-manifest.js?v=20260904v9"></script>
  <script>
  (function(){'use strict';
    var docs=Array.isArray(window.EF_CRUX_DOCS)?window.EF_CRUX_DOCS:[],list=document.getElementById('list'),search=document.getElementById('searchBox'),countTop=document.getElementById('countTop');
    function safe(raw,f){try{var v=JSON.parse(raw);return v==null?f:v}catch(e){return f}}
    function bookmarks(){var v=safe(localStorage.getItem('efp_bookmarks'),{});return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}
    function save(v){try{localStorage.setItem('efp_bookmarks',JSON.stringify(v))}catch(e){}}
    function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function rows(){var b=bookmarks(),out=[];Object.keys(b).forEach(function(k){if(!b[k])return;var m=/^cruxpage:([^:]+):(\d+)$/.exec(k);if(!m)return;var d=docs.find(function(x){return x.id===m[1]}),p=+m[2];if(d&&p>=1&&p<=d.pages)out.push({key:k,doc:d,page:p})});return out}
    function rankSubject(s){var a=['History','Polity','Geography','Science','Static GK'],i=a.indexOf(s);return i<0?999:i}
    function render(){var q=search.value.trim().toLowerCase(),arr=rows().filter(function(x){var d=x.doc,h=[d.title,d.sourceTitle,d.source,d.subject,d.branch,d.breadcrumb,'page '+x.page].join(' ').toLowerCase();return !q||h.indexOf(q)>=0});arr.sort(function(a,b){return rankSubject(a.doc.subject)-rankSubject(b.doc.subject)||String(a.doc.branch||'').localeCompare(String(b.doc.branch||''))||String(a.doc.sortKey||'').localeCompare(String(b.doc.sortKey||''),undefined,{numeric:true})||a.page-b.page});countTop.textContent=String(arr.length);list.innerHTML='';if(!arr.length){var e=document.createElement('div');e.className='empty';e.innerHTML='<b>'+(q?'No matching saved page.':'No bookmarked pages yet.')+'</b><span>'+(q?'Search बदलकर देखें।':'Reader में 🔖 Bookmark Page दबाएँ; saved page यहाँ सीधे मिलेगा।')+'</span><br><a href="index.html">Open Crux & Tricks</a>';list.appendChild(e);return}arr.forEach(function(x){var d=x.doc,c=document.createElement('article');c.className='card';c.innerHTML='<div class="card-head"><div><span class="page-pill">PAGE '+x.page+' / '+d.pages+'</span><div class="title">'+esc(d.title)+'</div></div><button class="remove-x" type="button" aria-label="Remove bookmark">✕</button></div><div class="badges"><span class="badge '+(d.kind==='tricks'?'original':'')+'">'+(d.kind==='tricks'?'ORIGINAL TRICK':esc(d.source))+'</span><span class="badge">'+esc(d.subject)+'</span>'+(d.branch?'<span class="badge">'+esc(d.branch)+'</span>':'')+'</div><div class="meta">'+esc(d.breadcrumb)+' · Page '+x.page+' of '+d.pages+'</div><div class="actions"><a class="open" href="viewer.html?id='+encodeURIComponent(d.id)+'&page='+x.page+'">Open Page '+x.page+' →</a><button class="remove" type="button">Remove bookmark</button></div>';function remove(){var b=bookmarks();delete b[x.key];save(b);render()}c.querySelector('.remove-x').addEventListener('click',remove);c.querySelector('.remove').addEventListener('click',remove);list.appendChild(c)})}
    document.getElementById('backBtn').addEventListener('click',function(){if(history.length>1)history.back();else location.href='index.html'});search.addEventListener('input',render);window.addEventListener('pageshow',render);render();
  })();
  </script>
</body>
</html>
