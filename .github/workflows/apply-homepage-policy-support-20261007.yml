name: Apply homepage-only privacy and support links
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-homepage-policy-support-20261007.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply verified patch and remove one-time workflow
        env:
          VERIFIED_PATCH_BASE64: ''
        run: |
          printf '%s' "$VERIFIED_PATCH_BASE64" | base64 --decode > /tmp/homepage-policy-support.patch
          git apply --check /tmp/homepage-policy-support.patch
          git apply /tmp/homepage-policy-support.patch
          python tools/install-analytics-guard.py
          node tools/test-analytics-guard.cjs
          node --check service-worker.js
          git diff --check
          rm '.github/workflows/apply-homepage-policy-support-20261007.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Original Practice/English_Grammar_Complete_Practice.html' 'Original Practice/Environment_Ecology_Complete_Practice.html' 'Original Practice/Static_GK_Complete_Practice.html' android-app.html llms.txt privacy-policy.html service-worker.js sitemap.xml support.html tools/integrate-ecology-original-practice.py '.github/workflows/apply-homepage-policy-support-20261007.yml'
          git commit -m 'fix: keep privacy and support links on homepage only'
          git pull --rebase origin master
          git push origin HEAD:master
