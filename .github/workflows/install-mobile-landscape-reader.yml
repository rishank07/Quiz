name: Install Acrobat-like landscape mobile PDF reader

on:
  push:
    paths:
      - '.github/workflows/install-mobile-landscape-reader.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire mobile landscape reader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Crux-Tricks/viewer.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="crux-manifest.js?v=20260908maths1"></script><script src="viewer.js?v=20260909rotate2"></script>'
          new='<script src="crux-manifest.js?v=20260908maths1"></script><script src="mobile-landscape-reader.js?v=20260909adobe2"></script><script src="viewer.js?v=20260909rotate2"></script>'
          if old not in s: raise SystemExit('viewer script marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          sw=Path('service-worker.js')
          t=sw.read_text(encoding='utf-8')
          if 'efp-pwa-2026-09-09-v80-mobile-pdf-rotate' not in t: raise SystemExit('cache marker missing')
          t=t.replace('efp-pwa-2026-09-09-v80-mobile-pdf-rotate','efp-pwa-2026-09-09-v82-acrobat-mobile-reader',1)
          anchor='  "/Crux-Tricks/viewer.js?v=20260909rotate2",\n'
          if anchor not in t: raise SystemExit('app shell marker missing')
          t=t.replace(anchor,'  "/Crux-Tricks/mobile-landscape-reader.js?v=20260909adobe2",\n'+anchor,1)
          sw.write_text(t,encoding='utf-8',newline='\n')
          PY
      - name: Validate
        run: |
          node --check Crux-Tricks/mobile-landscape-reader.js
          grep -q "mobile-landscape-reader.js?v=20260909adobe2" Crux-Tricks/viewer.html
          grep -q "v82-acrobat-mobile-reader" service-worker.js
          grep -q "efp-acrobat-mobile" Crux-Tricks/mobile-landscape-reader.js
      - name: Commit and cleanup
        run: |
          git config user.name "ExamFusion Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/install-mobile-landscape-reader.yml
          git rm -f .github/workflows/adobe-mobile-pdf-reader.yml || true
          git add Crux-Tricks/viewer.html Crux-Tricks/mobile-landscape-reader.js service-worker.js
          git commit -m "Enable Acrobat-like vertical mobile reading for landscape PDFs [skip ci]"
          git push origin master
