name: Ingest BPSC 2024 PYQ

on:
  push:
    branches: [master]
    paths:
      - 'tools/ingest-bpsc-2024.py'
      - '.github/workflows/ingest-bpsc-2024.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-bpsc-2024-pyq
  cancel-in-progress: true

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check requests pypdf
      - name: Extract questions and apply official final key
        run: python tools/ingest-bpsc-2024.py
      - name: Rebuild and validate PYQ manifest
        run: python tools/build-pyq-manifest.py
      - name: Commit generated PYQ data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PYQ/data/bpsc/2024.json PYQ/data/manifest.json
          if git diff --cached --quiet; then
            echo 'BPSC 2024 data already current.'
            exit 0
          fi
          git commit -m 'Ingest BPSC 2024 Set-G PYQ data'
          git push
