name: Switch to Acrobat-style PDF viewer v2

on:
  push:
    paths:
      - '.github/workflows/switch-to-viewer-v2.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch viewer scripts and cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Crux-Tricks/viewer.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="mobile-landscape-reader.js?v=20260909adobe2"></script><script src="viewer.js?v=20260909rotate2"></script>'
          new = '<script src="viewer-v2.js?v=20260909acrobat4"></script>'
          if old not in s:
              raise SystemExit('viewer script marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          t = sw.read_text(encoding='utf-8')
          import re
          t, n = re.subn(r'const CACHE_VERSION = "[^"]+";', 'const CACHE_VERSION = "efp-pwa-2026-09-09-v83-acrobat-viewer-v2";', t, count=1)
          if n != 1:
              raise SystemExit('cache version marker not found')
          old_entries = '  "/Crux-Tricks/mobile-landscape-reader.js?v=20260909adobe2",\n  "/Crux-Tricks/viewer.js?v=20260909rotate2",'
          if old_entries not in t:
              raise SystemExit('service worker viewer entries not found')
          t = t.replace(old_entries, '  "/Crux-Tricks/viewer-v2.js?v=20260909acrobat4",', 1)
          sw.write_text(t, encoding='utf-8')
          PY
      - name: Validate viewer v2
        run: |
          node --check Crux-Tricks/viewer-v2.js
          grep -q 'viewer-v2.js?v=20260909acrobat4' Crux-Tricks/viewer.html
          ! grep -q 'mobile-landscape-reader.js' Crux-Tricks/viewer.html
          grep -q 'v83-acrobat-viewer-v2' service-worker.js
      - name: Commit switch and cleanup
        shell: bash
        run: |
          git config user.name 'ExamFusion Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f Crux-Tricks/mobile-landscape-reader.js 2>/dev/null || true
          git rm -f .github/workflows/switch-to-viewer-v2.yml
          git add Crux-Tricks/viewer.html service-worker.js Crux-Tricks/viewer-v2.js
          git commit -m 'Use Acrobat-style continuous mobile PDF viewer [skip ci]'
          git push
