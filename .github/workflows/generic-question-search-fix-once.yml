name: Sync standalone Q1 search entries
on:
  push:
    branches: [master]
    paths: ['.github/workflows/generic-question-search-fix-once.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: generic-question-search-fix-once
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
      - name: Sync reviewed Q1 entries and search cache versions
        run: |
          python - <<'PY'
          import base64, json, re, subprocess
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs
          
          ROOT = Path('.')
          EDITS = json.loads(base64.b64decode(''))
          VERSION = '20261001genericq1'
          
          def read(path):
              return subprocess.check_output(['git', 'show', 'HEAD:' + path], cwd=ROOT).decode('utf-8')
          
          def patch_index(path, subjects):
              original = read(path)
              text = original
              match = re.search(r'=\s*(\[.*\])\s*;', text, re.S)
              assert match, path
              data = json.loads(match.group(1))
              changes = []
              for edit in EDITS:
                  if edit['subject'] not in subjects:
                      continue
                  rows = []
                  for row in data:
                      params = parse_qs(urlparse(row['f']).query)
                      chapter = params.get('chapter', [''])[0]
                      if (params.get('subject', [''])[0] == edit['subject'] and params.get('section', [''])[0] == '1' and re.match(r'\d+\.', chapter) and int(chapter.split('.')[0]) == edit['chapter']):
                          rows.append(row)
                  assert len(rows) == 1, (edit['subject'], edit['chapter'], len(rows))
                  row = rows[0]
                  old_q = edit['before']['en'] + ' ' + edit['before']['hi']
                  new_q = edit['after']['en'] + ' ' + edit['after']['hi']
                  old = row['x'][0]
                  prefix = '\ue000\ue000'
                  assert old.startswith(prefix), (path, row['f'], 'question index marker')
                  if old.startswith(prefix + new_q):
                      continue
                  assert old.startswith(prefix + old_q + ' '), (path, row['f'], old[:180])
                  new = prefix + new_q + old[len(prefix + old_q):]
                  old_json = json.dumps(old, ensure_ascii=False)
                  new_json = json.dumps(new, ensure_ascii=False)
                  assert text.count(old_json) == 1
                  text = text.replace(old_json, new_json, 1)
                  changes.append((row['f'], old_json, new_json))
              updated = json.loads(re.search(r'=\s*(\[.*\])\s*;', text, re.S).group(1))
              assert len(data) == len(updated)
              found = 0
              for before, after in zip(data, updated):
                  if before != after:
                      assert {k:v for k,v in before.items() if k != 'x'} == {k:v for k,v in after.items() if k != 'x'}
                      assert before['x'][1:] == after['x'][1:]
                      assert before['x'][0].split(' Answer:', 1)[1] == after['x'][0].split(' Answer:', 1)[1]
                      found += 1
              assert found == len(changes)
              restored = text
              for _, old, new in changes:
                  restored = restored.replace(new, old, 1)
              assert restored == original
              (ROOT / path).write_text(text, encoding='utf-8')
              print(path, 'updated Q1 snippets:', found, 'section groups:', len(data))
          
          patch_index('search-snippets-original-practice.js', ['Indian Geography', 'World Geography'])
          patch_index('search-snippets-economics-original-practice.js', ['Economics / अर्थशास्त्र'])
          index = read('index.html')
          updated, count = re.subn(r'(search-snippets-(?:original-practice|economics-original-practice)\.js\?v=)[^\"\x27\s<]+', lambda m: m.group(1) + VERSION, index)
          assert count == 2, count
          (ROOT / 'index.html').write_text(updated, encoding='utf-8')
          print('Homepage cache versions updated:', count)
          
          Path('.github/workflows/generic-question-search-fix-once.yml').unlink()
          
          PY
          node --check search-snippets-original-practice.js
          node --check search-snippets-economics-original-practice.js
      - name: Commit index updates and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-snippets-original-practice.js search-snippets-economics-original-practice.js index.html .github/workflows/generic-question-search-fix-once.yml
          git commit -m "Sync search indexes with standalone Geography and Economics Q1"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Request GitHub Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
