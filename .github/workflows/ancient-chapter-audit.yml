name: Apply verified Ancient History chapter audits
on:
  push:
    branches: [master]
    paths:
      - 'audits/ancient-history/chapter-*.json'
      - 'audits/ancient-history/generic-wording.json'
      - 'tools/apply-ancient-chapter-audit.cjs'
      - 'tools/sync-ancient-history-index.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ancient-chapter-audit
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply and validate each reviewed chapter, then push separately
        run: |
          git pull --ff-only origin master
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node tools/apply-ancient-chapter-audit.cjs --commit
          node tools/apply-ancient-chapter-audit.cjs --pending --commit
          if [ -f audits/ancient-history/generic-wording.json ]; then
            node tools/apply-ancient-chapter-audit.cjs --generic --commit
          fi
          node tools/sync-ancient-history-index.cjs --commit
