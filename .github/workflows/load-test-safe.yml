name: Safe ExamFusion Load Test

on:
  push:
    branches: [load-test-safe]

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run controlled concurrent GET test
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, urllib.request, urllib.error, time, statistics, json

          URL = "https://examfusionprep.com/"
          stages = [
              (10, 100),
              (25, 250),
              (50, 500),
              (100, 1000),
          ]

          def one_request(_):
              start = time.perf_counter()
              status = None
              n = 0
              try:
                  req = urllib.request.Request(URL, headers={"User-Agent":"ExamFusion-Safe-Load-Test/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = r.read()
                      status = r.status
                      n = len(data)
              except urllib.error.HTTPError as e:
                  status = e.code
              except Exception:
                  status = 0
              return status, time.perf_counter()-start, n

          for concurrency, total in stages:
              t0 = time.perf_counter()
              with concurrent.futures.ThreadPoolExecutor(max_workers=concurrency) as ex:
                  results = list(ex.map(one_request, range(total)))
              wall = time.perf_counter() - t0
              lat = sorted(x[1] for x in results)
              ok = sum(1 for s,_,__ in results if 200 <= s < 400)
              failures = total-ok
              status_counts = {}
              for s,_,__ in results:
                  status_counts[s] = status_counts.get(s,0)+1
              def pct(p):
                  if not lat: return None
                  i = min(len(lat)-1, int(round((len(lat)-1)*p)))
                  return lat[i]
              out = {
                  "concurrency": concurrency,
                  "requests": total,
                  "success": ok,
                  "failures": failures,
                  "status_counts": status_counts,
                  "wall_seconds": round(wall,3),
                  "requests_per_second": round(total/wall,2) if wall else None,
                  "avg_ms": round(statistics.mean(lat)*1000,1),
                  "p50_ms": round(pct(.50)*1000,1),
                  "p95_ms": round(pct(.95)*1000,1),
                  "p99_ms": round(pct(.99)*1000,1),
                  "max_ms": round(max(lat)*1000,1),
                  "avg_bytes": round(statistics.mean(x[2] for x in results),1),
              }
              print("RESULT", json.dumps(out, sort_keys=True), flush=True)
              if failures > max(5, total*0.02):
                  print("Stopping early due to elevated error rate.", flush=True)
                  break
              time.sleep(3)
          PY
