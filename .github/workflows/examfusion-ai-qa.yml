name: ExamFusion AI QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/examfusion-agent/requirements.txt

      - name: Restore AI review cache
        uses: actions/cache@v5
        with:
          path: .examfusion-qa-cache
          key: examfusion-ai-cache-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            examfusion-ai-cache-v2-${{ runner.os }}-${{ github.ref_name }}-
            examfusion-ai-cache-v2-${{ runner.os }}-

      - name: Run full AI QA
        env:
          EXAMFUSION_AI_API_KEY: ${{ secrets.EXAMFUSION_AI_API_KEY }}
        run: |
          python tools/examfusion-agent/agent.py \
            --repo . \
            --config tools/examfusion-agent/config.yml \
            --report-dir examfusion-qa-report \
            --ai

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: examfusion-ai-qa-report
          path: examfusion-qa-report/
