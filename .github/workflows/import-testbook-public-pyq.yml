name: Import Testbook public PYQ PDFs

on:
  workflow_dispatch:
  push:
    branches: [pyq-testbook-import]
    paths:
      - 'tools/import-testbook-public-pyq.py'
      - '.github/workflows/import-testbook-public-pyq.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            PYQ/data/pdf-catalog.json
            tools/import-testbook-public-pyq.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Import direct public Testbook PDFs
        run: python tools/import-testbook-public-pyq.py
      - name: Commit expanded PDF catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PYQ/data/pdf-catalog.json
          if git diff --cached --quiet; then
            echo 'No new public Testbook PDFs found.'
            exit 0
          fi
          git commit -m 'Import public Testbook PYQ PDF links'
          git push
