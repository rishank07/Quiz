name: Import public PYQ PDFs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/import-testbook-public-pyq.py'
      - 'tools/import-testbook-public-viewers.py'
      - 'tools/import-adda-pw-public-pyq.py'
      - 'tools/import-adda-public-seeds.py'
      - 'tools/import-pw-year-specific-pyq.py'
      - '.github/workflows/import-testbook-public-pyq.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            PYQ/data/pdf-catalog.json
            tools/import-testbook-public-pyq.py
            tools/import-testbook-public-viewers.py
            tools/import-adda-pw-public-pyq.py
            tools/import-adda-public-seeds.py
            tools/import-pw-year-specific-pyq.py
          sparse-checkout-cone-mode: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Import direct public Testbook PDFs
        run: python tools/import-testbook-public-pyq.py
      - name: Import public Testbook PDF viewers
        run: python tools/import-testbook-public-viewers.py
      - name: Import public Adda247 and Physics Wallah PYQs
        run: python tools/import-adda-pw-public-pyq.py
      - name: Import verified public Adda247 shift PDFs
        run: python tools/import-adda-public-seeds.py
      - name: Import PW year-specific Railway shifts
        run: python tools/import-pw-year-specific-pyq.py
      - name: Commit expanded PDF catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PYQ/data/pdf-catalog.json
          if git diff --cached --quiet; then
            echo 'No new public PYQ resources found.'
            exit 0
          fi
          git commit -m 'Expand public PYQ catalog from Testbook Adda247 PW'
          git pull --rebase origin master
          git push origin master
