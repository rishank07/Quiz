name: PDF keyboard shortcuts v1

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pdf-keyboard-v1.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch viewer
        run: python tools/patch_pdf_keyboard_v1.py
      - name: Validate
        run: |
          node --check Crux-Tricks/viewer-v2.js
          node --check service-worker.js
          grep -q "function handleReaderKeyboard" Crux-Tricks/viewer-v2.js
          grep -q "function resetReaderFit" Crux-Tricks/viewer-v2.js
          grep -q "ArrowRight.*PageDown" Crux-Tricks/viewer-v2.js
          grep -q "key==='b'.*bookmarkPage.click" Crux-Tricks/viewer-v2.js
          grep -q "viewer-v2.js?v=20260909keyboard1" Crux-Tricks/viewer.html
          grep -q "efp-pwa-2026-09-09-v92-pdf-keyboard" service-worker.js
          grep -q "overflow-x:auto" Crux-Tricks/viewer-v2.js
          grep -q "touchstart" Crux-Tricks/viewer-v2.js
      - name: Commit
        run: |
          git config user.name "ExamFusion Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Crux-Tricks/viewer-v2.js Crux-Tricks/viewer.html service-worker.js
          git rm .github/workflows/pdf-keyboard-v1.yml tools/patch_pdf_keyboard_v1.py
          git commit -m "Add PDF keyboard navigation shortcuts [skip ci]"
          git push
