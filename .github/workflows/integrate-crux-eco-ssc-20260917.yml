name: Integrate Crux Ecology and SSC Static GK

on:
  push:
    branches: [master]
    paths:
      - "tools/integrate-crux-eco-ssc-20260917.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Integrate Crux libraries
        run: python tools/integrate-crux-eco-ssc-20260917.py

      - name: Validate JavaScript
        run: |
          node --check Crux-Tricks/crux-search-route.js
          node --check search-worker.js
          node --check Crux-Tricks/crux-manifest.js

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Crux-Tricks/crux-manifest.js Crux-Tricks/crux-search-route.js Crux-Tricks/index.html Crux-Tricks/viewer.html Crux-Tricks/my-pages.html search-worker.js service-worker.js index.html sitemap.xml llms.txt
          git rm -f Crux-Tricks/crux-manifest-extra-20260917.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No integration changes needed."
          else
            git commit -m "Integrate Ecology and Pinnacle SSC Crux PDFs"
            git push
          fi
