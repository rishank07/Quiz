name: Import Maths PDFs from firestorage

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/import-maths-crux.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download shared Maths PDFs
        env:
          SHARE_URL: https://firestorage.ai/ja/f/atZz3nu5Ug5R
        run: |
          mkdir -p _maths_import
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.resolve('_maths_import');
          const share = process.env.SHARE_URL;
          function cleanName(s){ return (s || 'download.bin').replace(/[\\/:*?"<>|]+/g,'_'); }
          function strings(v, acc=[]){
            if (typeof v === 'string') acc.push(v);
            else if (Array.isArray(v)) v.forEach(x=>strings(x,acc));
            else if (v && typeof v === 'object') Object.values(v).forEach(x=>strings(x,acc));
            return acc;
          }
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({acceptDownloads:true, locale:'ja-JP'});
            const page = await context.newPage();
            const discovered = new Set();
            page.on('response', async r => {
              try {
                const ct=(r.headers()['content-type']||'').toLowerCase();
                if(!ct.includes('json')) return;
                const txt=await r.text();
                if(!/pdf|download|file/i.test(txt)) return;
                fs.appendFileSync(path.join(out,'network-json.txt'), `\nURL ${r.url()}\n${txt.slice(0,200000)}\n`);
                try { strings(JSON.parse(txt)).forEach(s=>{ if(/^https?:/i.test(s) && (/\.pdf(?:$|[?#])/i.test(s)||/download/i.test(s))) discovered.add(s); }); } catch(e) {}
              } catch(e) {}
            });
            await page.goto(share,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(7000);
            try { await page.screenshot({path:path.join(out,'share-page.png'),fullPage:true}); } catch(e) {}
            fs.writeFileSync(path.join(out,'share-page.html'), await page.content());

            const anchors = await page.locator('a').evaluateAll(as => as.map(a=>({href:a.href,text:(a.innerText||'').trim(),aria:a.getAttribute('aria-label')||'',title:a.getAttribute('title')||''})));
            fs.writeFileSync(path.join(out,'anchors.json'), JSON.stringify(anchors,null,2));
            anchors.forEach(a=>{ if(a.href && (/\.pdf(?:$|[?#])/i.test(a.href)||/download/i.test(a.href))) discovered.add(a.href); });

            let count=0;
            async function saveResponse(url){
              try{
                const resp=await context.request.get(url,{timeout:90000,failOnStatusCode:false});
                if(!resp.ok()) return false;
                const h=resp.headers(); const ct=(h['content-type']||'').toLowerCase(); const cd=h['content-disposition']||'';
                if(!(ct.includes('pdf')||ct.includes('zip')||/\.pdf|\.zip/i.test(cd)||/\.pdf(?:$|[?#])|\.zip(?:$|[?#])/i.test(url))) return false;
                const body=await resp.body();
                let name='download_'+(++count)+(ct.includes('zip')?'.zip':'.pdf');
                const m=/filename\*?=(?:UTF-8''|"?)([^";]+)/i.exec(cd); if(m) name=decodeURIComponent(m[1].replace(/^"|"$/g,''));
                fs.writeFileSync(path.join(out,cleanName(name)),body); return true;
              }catch(e){ return false; }
            }
            for(const u of discovered) await saveResponse(u);

            const selectors = page.locator('a,button,[role="button"]');
            const n = await selectors.count();
            fs.appendFileSync(path.join(out,'candidates.txt'),`count=${n}\n`);
            for(let i=0;i<n;i++){
              const el=selectors.nth(i); let text='',aria='',title='',href='';
              try{ text=(await el.innerText()).trim(); aria=await el.getAttribute('aria-label')||''; title=await el.getAttribute('title')||''; href=await el.getAttribute('href')||''; }catch(e){continue}
              const label=[text,aria,title,href].join(' ');
              fs.appendFileSync(path.join(out,'candidates.txt'),`${i}\t${label.slice(0,500)}\n`);
              if(!/(download|ダウンロード|一括|まとめて|保存|\.pdf)/i.test(label)) continue;
              try{
                const p=page.waitForEvent('download',{timeout:7000}).catch(()=>null);
                await el.click({timeout:5000,force:true,noWaitAfter:true}).catch(()=>{});
                const d=await p;
                if(d){ const suggested=cleanName(d.suggestedFilename()); await d.saveAs(path.join(out,`${String(++count).padStart(2,'0')}_${suggested}`)); }
                await page.waitForTimeout(800);
              }catch(e){}
            }

            // Fallback: click visible PDF filename rows, then any newly exposed download control.
            const pdfTexts=page.getByText(/\.pdf$/i);
            const pn=await pdfTexts.count().catch(()=>0);
            for(let i=0;i<pn;i++){
              try{
                await pdfTexts.nth(i).click({force:true,timeout:4000}); await page.waitForTimeout(500);
                const dl=page.getByRole('button',{name:/download|ダウンロード|保存/i}).last();
                const p=page.waitForEvent('download',{timeout:5000}).catch(()=>null);
                await dl.click({force:true,timeout:4000}).catch(()=>{}); const d=await p;
                if(d){ const suggested=cleanName(d.suggestedFilename()); await d.saveAs(path.join(out,`${String(++count).padStart(2,'0')}_${suggested}`)); }
              }catch(e){}
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Normalize and verify PDFs
        run: |
          set -euxo pipefail
          find _maths_import -type f -name '*.zip' -print -exec unzip -o '{}' -d _maths_import/unzipped \; || true
          find _maths_import -type f -maxdepth 5 -printf '%p %s bytes\n' | sort
          python <<'PY'
          from pathlib import Path
          import shutil, re
          root=Path('_maths_import')
          pdfs=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower()=='.pdf']
          targets={
            'arithmetic':'01_Arithmetic_Maths_Formulae.pdf',
            'advance':'02_Advance_Maths_Formula_Book.pdf',
            'master':'03_Maths_Master_Sheet_ExamFusionPrep.pdf',
            'square':'04_Square_Root_Cube_Multiplication_Tricks.pdf',
          }
          chosen={}
          for p in pdfs:
            n=p.name.lower()
            for key in targets:
              if key in n:
                if key not in chosen or p.stat().st_size>chosen[key].stat().st_size:
                  chosen[key]=p
          if len(chosen)!=4:
            raise SystemExit('Expected 4 recognizable PDFs, found: '+repr([(p.name,p.stat().st_size) for p in pdfs]))
          dest=Path('Crux-Tricks/pdfs/ExamFusion Original/Maths'); dest.mkdir(parents=True,exist_ok=True)
          for key,name in targets.items():
            src=chosen[key]; out=dest/name; shutil.copy2(src,out); print(src,'->',out,out.stat().st_size)
          PY

      - name: Commit imported PDFs and remove one-off workflow
        run: |
          set -euxo pipefail
          rm -f .github/workflows/import-maths-crux.yml
          git config user.name 'ExamFusion Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'Crux-Tricks/pdfs/ExamFusion Original/Maths' .github/workflows/import-maths-crux.yml
          git commit -m 'Add Maths formula and tricks PDFs [skip ci]'
          git push origin master

      - name: Upload debug files if import fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maths-firestorage-debug
          path: _maths_import
          if-no-files-found: ignore
