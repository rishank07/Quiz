name: Install quiz continuation hooks

on:
  push:
    branches: [master]
    paths:
      - 'tools/install-quiz-continuity.py'
      - '.github/workflows/install-quiz-continuity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quiz-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
      - name: Install and validate quiz continuation
        run: |
          python tools/install-quiz-continuity.py
          python tools/install-app-session.py
          python tools/install-analytics-guard.py
          node tools/test-analytics-guard.cjs
          node --check quiz-continuity.js
          node --check app-session.js
          node --check Crux-Tricks/viewer-v2.js
      - name: Commit native reset hooks and runtime URLs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'Current Affairs/Topic Names/Rapid Practice/2026/Topic Wise/rapid-runtime.js'
          git commit -m "fix: install question continuation reset hooks and runtime URLs"
          git pull --rebase origin master
          git push
