name: ExamFusion QA

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: pip install -r tools/examfusion-agent/requirements.txt

      - name: Run structural QA
        run: |
          python tools/examfusion-agent/agent.py \
            --repo . \
            --config tools/examfusion-agent/config.yml \
            --report-dir examfusion-qa-report

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: examfusion-qa-report
          path: examfusion-qa-report/
