name: ExamFusion QA

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA agent dependencies
        run: pip install -r tools/examfusion-agent/requirements.txt

      - name: Run structural QA
        continue-on-error: true
        run: |
          python tools/examfusion-agent/agent.py \
            --repo . \
            --config tools/examfusion-agent/config.yml \
            --report-dir examfusion-qa-report \
            --no-ai

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: examfusion-qa-report
          path: examfusion-qa-report/
