name: Install Break Tools

on:
  push:
    branches: [master]
    paths:
      - "music.html"
      - "chess.html"
      - "radio-launch.js"
      - "tools/add-break-tools.py"
      - "tools/fix-radio-browser-flow.py"
      - "tools/fix-radio-browser-launch.py"
      - "tools/reorder-radio-playlist.py"
      - "tools/fix-radio-playlist-dropdown.py"
      - "tools/fix-radio-next-scroll.py"
      - "tools/install-stockfish-assets.py"
      - "tools/fix-chess-open-source.py"
      - "tools/fix-chess-layout.py"
      - "tools/fix-chess-game-over.py"
      - "tools/fix-chess-review-mode.py"
      - "tools/fix-chess-captured-pieces.py"
      - ".github/workflows/add-break-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: break-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-break-tools:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate installers
        run: |
          python -m py_compile tools/add-break-tools.py
          python -m py_compile tools/fix-radio-browser-flow.py
          python -m py_compile tools/fix-radio-browser-launch.py
          python -m py_compile tools/reorder-radio-playlist.py
          python -m py_compile tools/fix-radio-playlist-dropdown.py
          python -m py_compile tools/fix-radio-next-scroll.py
          python -m py_compile tools/install-stockfish-assets.py
          python -m py_compile tools/fix-chess-open-source.py
          python -m py_compile tools/fix-chess-layout.py
          python -m py_compile tools/fix-chess-game-over.py
          python -m py_compile tools/fix-chess-review-mode.py
          python -m py_compile tools/fix-chess-captured-pieces.py
      - name: Maintain break tools, analytics, chess engine and PWA cache
        run: |
          python tools/install-stockfish-assets.py
          python tools/add-break-tools.py
          python tools/fix-radio-browser-flow.py
          python tools/fix-chess-open-source.py
          # The layout/last-move layer is already installed on current chess.html.
          # Run its legacy installer only when that layer is actually missing.
          if ! grep -q "EFP chess last-move arrow" chess.html; then python tools/fix-chess-layout.py; fi
          # Final Radio routing: browsers keep the two-tab flow; Android APK/TWA
          # stays normal in-app with no browser handoff/background-study mode.
          python tools/fix-radio-browser-launch.py
          # Keep the main music controls above the playlist selector for clarity.
          python tools/reorder-radio-playlist.py
          # Keep playlists compact in a custom dropdown with the selected name visible.
          python tools/fix-radio-playlist-dropdown.py
          # Highlight the active song without scrolling the whole document.
          python tools/fix-radio-next-scroll.py
          # Show a Chess.com-style result card and red checkmated king highlight.
          python tools/fix-chess-game-over.py
          # Let users inspect earlier chess positions without changing the live game.
          python tools/fix-chess-review-mode.py
          # Show which pieces You/Computer captured; also follows move review position.
          # Run last so this feature owns the final PWA cache bump.
          python tools/fix-chess-captured-pieces.py
      - name: Commit generated integration changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js chess.html music.html radio-launch.js vendor/stockfish
          git commit -m "chore: maintain music, chess and Stockfish assets"
          git push
