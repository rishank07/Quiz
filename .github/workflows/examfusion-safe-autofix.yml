name: ExamFusion Safe Auto-Fix PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/examfusion-agent/requirements.txt

      - name: Apply safe fixes
        
        run: |
          python tools/examfusion-agent/agent.py \
            --repo . \
            --config tools/examfusion-agent/config.yml \
            --report-dir examfusion-qa-report \
            --fix-safe \
            --no-ai

      - name: Create pull request if files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No safe fixes needed."
            exit 0
          fi
          BRANCH="examfusion-safe-fix-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -u
          git commit -m "chore: ExamFusion safe QA fixes"
          git push origin "$BRANCH"
          gh pr create --title "ExamFusion safe QA fixes" --body "Automated conservative fixes from ExamFusion QA Agent. Review before merging." --base "${{ github.event.repository.default_branch }}" --head "$BRANCH"

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: examfusion-safe-fix-report
          path: examfusion-qa-report/
