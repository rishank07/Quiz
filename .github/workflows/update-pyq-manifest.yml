name: Update PYQ manifest

on:
  push:
    branches: [master]
    paths:
      - 'PYQ/data/**/*.json'
      - 'tools/build-pyq-manifest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate chunks and rebuild manifest
        run: python tools/build-pyq-manifest.py
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- PYQ/data/manifest.json; then
            echo 'Manifest already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PYQ/data/manifest.json
          git commit -m 'Auto-update PYQ manifest'
          git push
