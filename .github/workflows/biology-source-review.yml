name: Prepare Biology source review
on:
  push:
    branches: [codex/biology-mindmap-audit]
    paths: ['.github/workflows/biology-source-review.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            Original Practice/Science_Complete_Practice.html
          sparse-checkout-cone-mode: false
      - name: Export compact audited Biology references for review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          raw=Path('Original Practice/Science_Complete_Practice.html').read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert sha=='000c2cef8b43e16eca7e601b029fb0bd1067d959'
          master=None
          for block in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',raw.decode(),re.I):
              try: data=json.loads(block)
              except (ValueError,TypeError): continue
              if isinstance(data,dict) and 'Biology' in data: master=data;break
          assert master is not None
          target=Path('audits/biology-source-review');target.mkdir(parents=True,exist_ok=True)
          metadata=[]
          for chapter,sections in master['Biology'].items():
              number=int(chapter.split('.')[0]);questions=[]
              for si,section in enumerate(sections):
                  for qi,q in enumerate(section['questions']):
                      questions.append(dict(ref=f'{number}:{si}:{qi}',section=section['title']['en'],q=q['q']['en'],a=q['a']['en'],exp=q.get('exp',{}).get('en','')))
              metadata.append(dict(chapter=chapter,questions=len(questions)))
              (target/f'chapter-{number:02}.json').write_text(json.dumps(questions,ensure_ascii=False,separators=(',',':')))
          (target/'manifest.json').write_text(json.dumps(dict(source_blob_sha=sha,chapters=metadata),indent=2))
          print(json.dumps(metadata))
          PY
      - name: Save temporary review references on the audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/biology-source-review
          git commit -m 'Extract audited Biology references for mindmap comparison'
          git push origin HEAD:codex/biology-mindmap-audit
