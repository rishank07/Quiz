name: Final Ancient History polish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Ancient History polish
        run: node tools/final-polish-ancient-history-20261001.js
      - name: Commit polished Ancient History and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Original Practice/History_Complete_Practice.html"
          git rm tools/final-polish-ancient-history-20261001.js
          git rm .github/workflows/final-polish-ancient-history-20261001.yml
          git commit -m "Finalize Ancient History explanation polish"
          git push origin HEAD:master
