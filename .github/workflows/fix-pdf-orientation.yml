name: Fix Advance Maths PDF theme and responsive fitting

on:
  push:
    paths:
      - '.github/workflows/fix-pdf-orientation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PDF reader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('Crux-Tricks/viewer.js')
          s = p.read_text(encoding='utf-8')

          old = "var mobileReader=window.matchMedia&&window.matchMedia('(max-width:820px)').matches,isTrick=doc.kind==='tricks',isBookCrux=doc.kind==='crux',isEconomicsCrux=isBookCrux&&doc.subject==='Economics';"
          new = "function isCompactReader(){return !!(window.matchMedia&&window.matchMedia('(max-width:820px)').matches)}\nvar mobileReader=isCompactReader(),isTrick=doc.kind==='tricks',isBookCrux=doc.kind==='crux',isEconomicsCrux=isBookCrux&&doc.subject==='Economics',isAdvanceMaths=doc.id==='ct0468'||doc.sourceTitle==='Advance Maths Formula Book';"
          if old not in s: raise SystemExit('reader declaration marker missing')
          s = s.replace(old, new, 1)

          old = "if(isEconomicsCrux)document.documentElement.classList.add('efp-economics-crux-pdf');"
          new = old + "\nif(isAdvanceMaths)document.documentElement.classList.add('efp-advance-maths-dark-pdf');"
          if old not in s: raise SystemExit('economics class marker missing')
          s = s.replace(old, new, 1)

          old = "var pages=[],pdfDoc=null,renderTask=null,zoom=mobileReader?1.10:1;"
          new = "var pages=[],pdfDoc=null,renderTask=null,zoom=mobileReader?1.10:1,autoFit=true,lastPageLandscape=false,lastDevicePortrait=window.innerHeight>=window.innerWidth;"
          if old not in s: raise SystemExit('state marker missing')
          s = s.replace(old, new, 1)

          m = re.search(r"if\(mobileReader\)\{var focusStyle=document\.createElement\('style'\);focusStyle\.id='efp-mobile-pdf-clarity';focusStyle\.textContent='(.*?)';document\.head\.appendChild\(focusStyle\)\}", s, re.S)
          if not m: raise SystemExit('mobile clarity block missing')
          focus_css = m.group(1)
          replacement = (
              "var focusStyle=document.createElement('style');focusStyle.id='efp-mobile-pdf-clarity';focusStyle.textContent='" + focus_css + "';document.head.appendChild(focusStyle);\n"
              "var adaptiveStyle=document.createElement('style');adaptiveStyle.id='efp-pdf-adaptive-profile';adaptiveStyle.textContent='"
              "html.dark.efp-trick-pdf.efp-advance-maths-dark-pdf #pdfCanvas{filter:none!important;background:#05070b!important}"
              "html.dark.efp-trick-pdf.efp-advance-maths-dark-pdf .pdf-stage{background:#02050a!important}"
              "html:not(.dark).efp-advance-maths-dark-pdf #pdfCanvas{filter:invert(.965) hue-rotate(180deg) saturate(1.02) brightness(1.08) contrast(1.14)!important;background:#fff!important}"
              "html:not(.dark).efp-advance-maths-dark-pdf .pdf-stage{background:#d9e1ea!important}"
              "html.efp-landscape-page.efp-compact-reader .pdf-stage{overflow-y:auto!important}"
              "html.efp-landscape-page.efp-compact-reader.efp-auto-fit .pdf-stage{overflow-x:hidden!important}"
              "';document.head.appendChild(adaptiveStyle);"
          )
          s = s[:m.start()] + replacement + s[m.end():]

          old = "zoomLabel.textContent=zoom===1?'Fit':Math.round(zoom*100)+'%'"
          new = "zoomLabel.textContent=autoFit?'Fit':Math.round(zoom*100)+'%'"
          if old not in s: raise SystemExit('zoom label marker missing')
          s = s.replace(old, new, 1)

          old = "function centerMobilePage(){if(!mobileReader)return;requestAnimationFrame(function(){var left=Math.max(0,(pdfStage.scrollWidth-pdfStage.clientWidth)/2);pdfStage.scrollLeft=left})}"
          new = "function centerMobilePage(){if(!isCompactReader())return;requestAnimationFrame(function(){var left=Math.max(0,(pdfStage.scrollWidth-pdfStage.clientWidth)/2);pdfStage.scrollLeft=left})}"
          if old not in s: raise SystemExit('center mobile marker missing')
          s = s.replace(old, new, 1)

          new_render = (
              "function renderPage(){if(!pdfDoc)return;mobileReader=isCompactReader();document.documentElement.classList.toggle('efp-compact-reader',mobileReader);pdfError.hidden=true;pdfLoading.hidden=false;pdfLoading.textContent='Loading page '+page+'…';pdfCanvas.hidden=true;if(renderTask){try{renderTask.cancel()}catch(e){}renderTask=null}\n"
              "pdfDoc.getPage(page).then(function(pdfPage){var base=pdfPage.getViewport({scale:1}),landscape=base.width>base.height*1.03,availableW=Math.max(260,pdfStage.clientWidth-(mobileReader?4:18)),stageTop=pdfStage.getBoundingClientRect().top,visibleH=Math.max(220,window.innerHeight-stageTop-(mobileReader?4:18)),widthFit=availableW/base.width,fit=widthFit;lastPageLandscape=landscape;document.documentElement.classList.toggle('efp-landscape-page',landscape);document.documentElement.classList.toggle('efp-portrait-page',!landscape);document.documentElement.classList.toggle('efp-auto-fit',autoFit);if(!mobileReader&&landscape&&autoFit)fit=Math.min(widthFit,visibleH/base.height);var effectiveZoom=autoFit?(mobileReader&&landscape?1:zoom):zoom,cssScale=fit*effectiveZoom,dpr=Math.min(window.devicePixelRatio||1,mobileReader?3:2),viewport=pdfPage.getViewport({scale:cssScale*dpr}),ctx=pdfCanvas.getContext('2d',{alpha:false});pdfStage.style.overflowY='auto';pdfStage.style.overflowX=(mobileReader&&landscape&&autoFit)?'hidden':'auto';pdfCanvas.width=Math.floor(viewport.width);pdfCanvas.height=Math.floor(viewport.height);pdfCanvas.style.width=Math.floor(viewport.width/dpr)+'px';pdfCanvas.style.height=Math.floor(viewport.height/dpr)+'px';renderTask=pdfPage.render({canvasContext:ctx,viewport:viewport});return renderTask.promise}).then(function(){renderTask=null;pdfLoading.hidden=true;pdfCanvas.hidden=false;if(mobileReader&&lastPageLandscape&&autoFit)pdfStage.scrollLeft=0;else centerMobilePage();markVisited();updateUrl();updateControls()}).catch(function(err){if(err&&err.name==='RenderingCancelledException')return;showError('This PDF page could not be rendered inside the app.');if(console&&console.error)console.error(err)})}"
          )
          s, n = re.subn(r"function renderPage\(\)\{.*?\nfunction go", new_render + "\nfunction go", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('renderPage replacement failed')

          old = "pdfStage.scrollTo({top:0,left:mobileReader?pdfStage.scrollLeft:0,behavior:'auto'})"
          new = "pdfStage.scrollTo({top:0,left:isCompactReader()?pdfStage.scrollLeft:0,behavior:'auto'})"
          if old not in s: raise SystemExit('page scroll marker missing')
          s = s.replace(old, new, 1)

          old = "document.getElementById('zoomIn').addEventListener('click',function(){var step=mobileReader?0.10:0.25;zoom=Math.min(2.5,Math.round((zoom+step)*100)/100);updateControls();renderPage()});"
          new = "document.getElementById('zoomIn').addEventListener('click',function(){mobileReader=isCompactReader();if(autoFit&&lastPageLandscape)zoom=1;autoFit=false;var step=mobileReader?0.10:0.25;zoom=Math.min(2.5,Math.round((zoom+step)*100)/100);updateControls();renderPage()});"
          if old not in s: raise SystemExit('zoom in marker missing')
          s = s.replace(old, new, 1)

          old = "document.getElementById('zoomOut').addEventListener('click',function(){var step=mobileReader?0.10:0.25;zoom=Math.max(.75,Math.round((zoom-step)*100)/100);updateControls();renderPage()});"
          new = "document.getElementById('zoomOut').addEventListener('click',function(){mobileReader=isCompactReader();if(autoFit&&lastPageLandscape)zoom=1;autoFit=false;var step=mobileReader?0.10:0.25;zoom=Math.max(.75,Math.round((zoom-step)*100)/100);updateControls();renderPage()});"
          if old not in s: raise SystemExit('zoom out marker missing')
          s = s.replace(old, new, 1)

          old = "var resizeTimer;window.addEventListener('resize',function(){clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){if(pdfDoc&&(zoom===1||mobileReader&&!document.body.classList.contains('mobile-tools-open')))renderPage()},180)});"
          new = "var resizeTimer;function refitForViewport(forceFit){clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){var portrait=window.innerHeight>=window.innerWidth,changed=portrait!==lastDevicePortrait;mobileReader=isCompactReader();lastDevicePortrait=portrait;if(forceFit||changed){autoFit=true;zoom=mobileReader?1.10:1}if(pdfDoc&&!document.body.classList.contains('mobile-tools-open')){updateControls();renderPage()}},180)}window.addEventListener('resize',function(){refitForViewport(false)});window.addEventListener('orientationchange',function(){refitForViewport(true)});if(window.visualViewport)window.visualViewport.addEventListener('resize',function(){refitForViewport(false)});if(window.screen&&screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',function(){refitForViewport(true)});"
          if old not in s: raise SystemExit('resize marker missing')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8', newline='\n')

          sw = Path('service-worker.js')
          t = sw.read_text(encoding='utf-8')
          oldv = 'const CACHE_VERSION = "efp-pwa-2026-09-08-v78-maths-crux";'
          newv = 'const CACHE_VERSION = "efp-pwa-2026-09-09-v79-pdf-responsive";'
          if oldv not in t: raise SystemExit('service worker cache marker missing')
          t = t.replace(oldv, newv, 1)
          sw.write_text(t, encoding='utf-8', newline='\n')
          PY
      - name: Validate reader patch
        run: |
          node --check Crux-Tricks/viewer.js
          grep -q "efp-advance-maths-dark-pdf" Crux-Tricks/viewer.js
          grep -q "efp-landscape-page" Crux-Tricks/viewer.js
          grep -q "orientationchange" Crux-Tricks/viewer.js
          grep -q "v79-pdf-responsive" service-worker.js
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "ExamFusion Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-pdf-orientation.yml
          git add Crux-Tricks/viewer.js service-worker.js
          git commit -m "Fix Advance Maths theme and responsive landscape PDF fitting [skip ci]"
          git push origin master
