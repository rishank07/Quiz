name: Fix standalone Geography and Economics Q1
on:
  push:
    branches: [master]
    paths: ['.github/workflows/generic-question-fix-once.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: generic-question-fix-once
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
      - name: Update and validate only the reviewed Q1 texts
        run: |
          python - <<'PY'
          import base64, json, re
          from pathlib import Path
          edits = json.loads(base64.b64decode(""))
          changed = 0
          for name, subjects in [('Economics', ['Economics / अर्थशास्त्र']), ('Geography', ['Indian Geography', 'World Geography'])]:
              path = Path(f'Original Practice/{name}_Complete_Practice.html')
              original = path.read_text(encoding='utf-8')
              text = original
              pattern = r'<script[^>]*id=["\x27]master-data["\x27][^>]*>([\s\S]*?)</script>'
              match = re.search(pattern, original)
              assert match, 'Missing question data'
              data = json.loads(match.group(1))
              expected = 1 if name == 'Economics' else 25
              count = 0
              for edit in edits:
                  if edit['subject'] not in subjects:
                      continue
                  chapter = next(ch for ch in data[edit['subject']] if int(ch.split('.')[0]) == edit['chapter'])
                  question = data[edit['subject']][chapter][0]['questions'][0]
                  if question['q'] == edit['after']:
                      count += 1
                      continue
                  assert question['q'] == edit['before'], (name, chapter, 'Question changed since review')
                  old = json.dumps(question, ensure_ascii=False, separators=(',', ':'))
                  replacement = dict(question, q=edit['after'])
                  new = json.dumps(replacement, ensure_ascii=False, separators=(',', ':'))
                  assert text.count(old) == 1, (name, chapter, 'Non-unique question')
                  text = text.replace(old, new, 1)
                  count += 1
                  changed += 1
              assert count == expected
              updated = json.loads(re.search(pattern, text).group(1))
              for subject in data:
                  for chapter in data[subject]:
                      for si, section in enumerate(data[subject][chapter]):
                          for qi, old in enumerate(section['questions']):
                              new = updated[subject][chapter][si]['questions'][qi]
                              if old != new:
                                  assert si == 0 and qi == 0
                                  assert dict(old, q=None) == dict(new, q=None)
                                  assert not re.search(r'chapter|अध्याय|\bhere\b|this topic|इस विषय', new['q']['en'] + new['q']['hi'], re.I)
              restored = text
              for edit in edits:
                  if edit['subject'] not in subjects:
                      continue
                  chapter = next(ch for ch in data[edit['subject']] if int(ch.split('.')[0]) == edit['chapter'])
                  old = data[edit['subject']][chapter][0]['questions'][0]
                  if old['q'] == edit['after']:
                      continue
                  new = dict(old, q=edit['after'])
                  restored = restored.replace(json.dumps(new, ensure_ascii=False, separators=(',', ':')), json.dumps(old, ensure_ascii=False, separators=(',', ':')), 1)
              assert restored == original, 'Unexpected change outside the question text'
              path.write_text(text, encoding='utf-8')
              print(name, 'validated standalone Q1:', count)
          Path('.github/workflows/generic-question-fix-once.yml').unlink()
          print('Question texts changed:', changed)
          PY
      - name: Commit corrections and remove the temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Original Practice/Economics_Complete_Practice.html" "Original Practice/Geography_Complete_Practice.html" ".github/workflows/generic-question-fix-once.yml"
          git commit -m "Make Geography and Economics first questions standalone in English and Hindi"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Request GitHub Pages rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
