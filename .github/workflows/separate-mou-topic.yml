name: Separate MoU 2026 topic

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/separate-mou-topic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-correction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create separate MoU topic and validate
        run: python3 .github/scripts/separate_mou_topic.py

      - name: Remove temporary updater
        run: |
          rm -f .github/scripts/separate_mou_topic.py
          rm -f .github/workflows/separate-mou-topic.yml

      - name: Commit and push corrected topic structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move MoU 2026 into a separate topic"
          git push origin HEAD:master
