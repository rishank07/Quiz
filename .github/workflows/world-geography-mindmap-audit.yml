name: Validate World Geography mind maps
on:
  push:
    branches: [master, codex/world-geography-audit]
    paths:
      - 'Mind Maps/Geography/World Geography/ChapterNames/**'
      - 'audits/world-geography-mindmaps/**'
      - 'tools/*world-geography*'
      - '.github/workflows/world-geography-mindmap-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world-geography-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --prefix /tmp/efp-dom-check --no-audit --no-fund jsdom@26
      - name: Verify exact correction replay and source references
        run: python3 tools/apply-world-geography-mindmap-audit.py
      - name: Synchronize reviewed search groups and publication metadata
        run: |
          python3 tools/sync-world-geography-mindmap-index.py
          python3 tools/prepare-world-geography-publish.py
          python3 tools/sync-world-geography-mindmap-index.py --check
      - name: Check tabs, tables, preserved templates and mobile/desktop search
        env:
          EFP_TEST_JSDOM: /tmp/efp-dom-check/node_modules/jsdom
        run: node tools/test-world-geography-mindmaps.cjs
      - name: Validate analytics exclusion
        run: |
          python3 tools/install-analytics-guard.py
          node tools/test-analytics-guard.cjs
          python3 tools/apply-world-geography-mindmap-audit.py
          git diff --check
      - name: Save synchronized integration files on audit branch
        if: github.ref == 'refs/heads/codex/world-geography-audit'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add search-snippets-mindmaps.js homepage-fulltext-search.js index.html 'Mind Maps/SubjectName.html' service-worker.js sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Sync reviewed World Geography search and publication metadata'
            git push origin HEAD:codex/world-geography-audit
          fi
      - name: Require a clean validated tree on master
        if: github.ref == 'refs/heads/master'
        run: git diff --exit-code
