name: Fix PDF zoom steps v1

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/fix_pdf_zoom_steps.py'
      - '.github/workflows/fix-pdf-zoom-steps-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch viewer
        run: python .github/scripts/fix_pdf_zoom_steps.py

      - name: Validate
        run: |
          node --check Crux-Tricks/viewer-v2.js
          grep -q "function steppedReaderZoom(direction)" Crux-Tricks/viewer-v2.js
          grep -q "applyReaderZoom(steppedReaderZoom(1))" Crux-Tricks/viewer-v2.js
          grep -q "applyReaderZoom(steppedReaderZoom(-1))" Crux-Tricks/viewer-v2.js
          grep -q "viewer-v2.js?v=20260909zoomstep1" Crux-Tricks/viewer.html
          grep -q "efp-pwa-2026-09-09-v93-pdf-zoom-step" service-worker.js

      - name: Commit
        run: |
          rm -f .github/scripts/fix_pdf_zoom_steps.py .github/workflows/fix-pdf-zoom-steps-v1.yml
          git config user.name "ExamFusion Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Crux-Tricks/viewer-v2.js Crux-Tricks/viewer.html service-worker.js .github/scripts .github/workflows
          git commit -m "Snap PDF zoom controls to clean percentage steps [skip ci]"
          git push
