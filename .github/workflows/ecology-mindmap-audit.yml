name: Validate Ecology mind maps
on:
  push:
    branches: [master, codex/ecology-mindmap-audit]
    paths:
      - 'Mind Maps/Envitonment & Ecology/**'
      - 'audits/ecology-mindmaps/**'
      - 'tools/*ecology-mindmap*'
      - 'tools/prepare-ecology-publish.py'
      - '.github/workflows/ecology-mindmap-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecology-mindmap-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /tools/
            /audits/ecology-mindmaps/
            /Mind Maps/SubjectName.html
            /Mind Maps/Envitonment & Ecology/
            /Original Practice/Environment_Ecology_Complete_Practice.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --prefix /tmp/efp-dom-check --no-audit --no-fund jsdom@26
      - name: Verify reviewed corrections and uploaded-source evidence
        run: python3 tools/apply-ecology-mindmap-audit.py
      - name: Synchronize eight Ecology search groups and publication metadata
        run: |
          python3 tools/sync-ecology-mindmap-index.py
          python3 tools/prepare-ecology-publish.py
          python3 tools/sync-ecology-mindmap-index.py --check
      - name: Validate tables, templates, tabs and mobile/desktop search
        env:
          EFP_TEST_JSDOM: /tmp/efp-dom-check/node_modules/jsdom
        run: node tools/test-ecology-mindmaps.cjs
      - name: Verify analytics exclusion and final fingerprints
        run: |
          python3 tools/install-analytics-guard.py
          node tools/test-analytics-guard.cjs
          python3 tools/apply-ecology-mindmap-audit.py
          git diff --check
      - name: Save validated publication files on audit branch
        if: github.ref == 'refs/heads/codex/ecology-mindmap-audit'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add search-snippets-mindmaps.js homepage-fulltext-search.js index.html 'Mind Maps/SubjectName.html' service-worker.js sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Sync audited Ecology search index and publication metadata'
            git push origin HEAD:codex/ecology-mindmap-audit
          fi
      - name: Require clean validated publication contents on master
        if: github.ref == 'refs/heads/master'
        run: git diff --exit-code
