name: Generate Play Store Assets

on:
  push:
    paths:
      - '.github/workflows/generate-play-assets.yml'
      - 'tools/generate_play_assets.py'
      - 'logo.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Generate real assets
        run: python tools/generate_play_assets.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-assets
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Generate Play Store assets from real logo and live site"
            git push
          fi
