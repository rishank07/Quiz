name: Add PYQ Landing Card Once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/add-pyq-landing-once.yml"

permissions:
  contents: write

jobs:
  patch-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Patch landing page
        run: python tools/update-home-integrations.py --repo .
      - name: Commit landing page
        run: |
          if git diff --quiet -- index.html; then
            echo "Landing page already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add PYQ library to landing page"
          git pull --rebase origin master
          git push
