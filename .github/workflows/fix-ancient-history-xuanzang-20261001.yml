name: One-time Ancient History Xuanzang cleanup

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Xuanzang consistency fix
        run: node tools/fix-ancient-history-xuanzang-20261001.js
      - name: Commit and remove one-time helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Original Practice/History_Complete_Practice.html"
          git rm tools/fix-ancient-history-xuanzang-20261001.js
          git rm .github/workflows/fix-ancient-history-xuanzang-20261001.yml
          git commit -m "Standardize Xuanzang arrival date in Ancient History"
          git push origin HEAD:master
