name: Fix Ancient History Chapter 3 options

on:
  push:
    branches: [master]
    paths:
      - "tools/fix-ancient-history-ch3-options-20261001.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Chapter 3 corrections
        run: node tools/fix-ancient-history-ch3-options-20261001.js

      - name: Commit validated correction
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Original Practice/History_Complete_Practice.html"
          git rm tools/fix-ancient-history-ch3-options-20261001.js .github/workflows/fix-ancient-history-ch3-options-20261001.yml
          git commit -m "Correct Ancient History Chapter 3 answer options"
          git push
