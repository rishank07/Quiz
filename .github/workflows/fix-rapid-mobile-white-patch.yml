name: Fix Rapid Practice Mobile White Patch

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/fix-rapid-mobile-white-patch.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix mobile viewport background flash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Current Affairs/Topic Names/Rapid Practice.html")
          text = path.read_text(encoding="utf-8")

          old_html = "html{scroll-behavior:smooth}"
          new_html = "html{scroll-behavior:smooth;background:#0f2027;min-height:100%}"
          if old_html in text:
              text = text.replace(old_html, new_html, 1)
          elif new_html not in text:
              raise RuntimeError("Rapid Practice html background pattern not found")

          mobile_fix = "@media(max-width:1199px){body{background-attachment:scroll!important}}"
          if mobile_fix not in text:
              if "</style>" not in text:
                  raise RuntimeError("Rapid Practice style block not found")
              text = text.replace("</style>", mobile_fix + "\n</style>", 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Current Affairs/Topic Names/Rapid Practice.html"
          git rm -- ".github/workflows/fix-rapid-mobile-white-patch.yml"
          git commit -m "Fix Current Affairs mobile white scroll patch"
          git push
