name: Validate Chemistry mind maps
on:
  push:
    branches: [master, codex/chemistry-mindmap-audit]
    paths:
      - 'Mind Maps/Science/Chemistry/**'
      - 'audits/chemistry-mindmaps/**'
      - 'tools/*chemistry*'
      - '.github/workflows/chemistry-mindmap-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-mindmap-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /tools/
            /audits/chemistry-mindmaps/
            /Mind Maps/SubjectName.html
            /Mind Maps/Science/Chemistry/
            /Original Practice/Science_Complete_Practice.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --prefix /tmp/efp-dom-check --no-audit --no-fund jsdom@26
      - name: Verify exact correction replay and audited source evidence
        run: python3 tools/apply-chemistry-mindmap-audit.py
      - name: Synchronize Chemistry search groups and publication metadata
        run: |
          python3 tools/sync-chemistry-mindmap-index.py
          python3 tools/prepare-chemistry-publish.py
          python3 tools/sync-chemistry-mindmap-index.py --check
      - name: Check preserved templates, tables, tabs and mobile/desktop search
        env:
          EFP_TEST_JSDOM: /tmp/efp-dom-check/node_modules/jsdom
        run: node tools/test-chemistry-mindmaps.cjs
      - name: Verify analytics exclusion and reviewed page fingerprints
        run: |
          python3 tools/install-analytics-guard.py
          node tools/test-analytics-guard.cjs
          python3 tools/apply-chemistry-mindmap-audit.py
          git diff --check
      - name: Save validated search and publication metadata on audit branch
        if: github.ref == 'refs/heads/codex/chemistry-mindmap-audit'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add search-snippets-mindmaps.js homepage-fulltext-search.js index.html 'Mind Maps/SubjectName.html' service-worker.js sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Sync audited Chemistry search index and publication metadata'
            git push origin HEAD:codex/chemistry-mindmap-audit
          fi
      - name: Require clean validated contents on master
        if: github.ref == 'refs/heads/master'
        run: git diff --exit-code
