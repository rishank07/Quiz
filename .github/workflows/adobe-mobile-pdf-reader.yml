name: Adobe-like mobile PDF reader

on:
  push:
    paths:
      - '.github/workflows/adobe-mobile-pdf-reader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch mobile PDF reader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          vp = Path('Crux-Tricks/viewer.js')
          s = vp.read_text(encoding='utf-8')

          # Add continuous-reader state.
          old = "var pages=[],pdfDoc=null,renderTask=null,zoom=mobileReader?1.10:1,autoFit=true,lastPageLandscape=false,lastDevicePortrait=window.innerHeight>=window.innerWidth;"
          new = old + "\nvar continuousReader=false,continuousBuilt=false,continuousObserver=null,continuousAspect=.707,continuousRenders={},continuousScrollTimer=null,continuousScrollRAF=0;"
          if old not in s: raise SystemExit('state marker missing')
          s = s.replace(old, new, 1)

          old = "var title=document.getElementById('title'),crumb=document.getElementById('crumb'),input=document.getElementById('pageInput'),total=document.getElementById('pageTotal'),favBtn=document.getElementById('favBtn'),bookmarkPage=document.getElementById('bookmarkPage'),completeBtn=document.getElementById('completeBtn'),resetProgressBtn=document.getElementById('resetProgressBtn'),openPdf=document.getElementById('openPdf'),openPdf2=document.getElementById('openPdf2'),docSearch=document.getElementById('docSearch'),docHits=document.getElementById('docHits'),pdfStage=document.getElementById('pdfStage'),pdfCanvas=document.getElementById('pdfCanvas'),pdfLoading=document.getElementById('pdfLoading'),pdfError=document.getElementById('pdfError'),zoomLabel=document.getElementById('zoomLabel');"
          new = old[:-1] + ",mobilePdfPages=document.getElementById('mobilePdfPages');"
          if old not in s: raise SystemExit('dom marker missing')
          s = s.replace(old, new, 1)

          # Continuous canvases need the same dark/light treatment as the old single canvas.
          marker = "var adaptiveStyle=document.createElement('style');adaptiveStyle.id='efp-pdf-adaptive-profile';"
          if marker not in s: raise SystemExit('adaptive style marker missing')
          insert_after = "';document.head.appendChild(adaptiveStyle);"
          idx = s.find(marker)
          end = s.find(insert_after, idx)
          if end < 0: raise SystemExit('adaptive style end missing')
          end += len(insert_after)
          extra = "\nvar continuousCanvasStyle=document.createElement('style');continuousCanvasStyle.id='efp-pdf-continuous-colour';continuousCanvasStyle.textContent='html.dark .mobile-pdf-page canvas{filter:invert(.94) hue-rotate(180deg) saturate(1.08) brightness(1.08) contrast(1.14)!important;background:#0a0f18!important}html.dark.efp-book-crux-pdf .mobile-pdf-page canvas{filter:invert(.965) hue-rotate(180deg) saturate(1.06) brightness(1.13) contrast(1.22)!important;background:#060b12!important}html.dark.efp-economics-crux-pdf .mobile-pdf-page canvas{filter:invert(.975) hue-rotate(180deg) saturate(1.10) brightness(1.15) contrast(1.25)!important;background:#040910!important}html.dark.efp-trick-pdf .mobile-pdf-page canvas{filter:invert(.97) hue-rotate(180deg) saturate(1.22) brightness(1.14) contrast(1.25)!important;background:#060a10!important}html.dark.efp-trick-pdf.efp-advance-maths-dark-pdf .mobile-pdf-page canvas{filter:none!important;background:#05070b!important}html:not(.dark).efp-advance-maths-dark-pdf .mobile-pdf-page canvas{filter:invert(.965) hue-rotate(180deg) saturate(1.02) brightness(1.08) contrast(1.14)!important;background:#fff!important}';document.head.appendChild(continuousCanvasStyle);"
          s = s[:end] + extra + s[end:]

          center_marker = "function centerMobilePage(){if(!isCompactReader())return;requestAnimationFrame(function(){var left=Math.max(0,(pdfStage.scrollWidth-pdfStage.clientWidth)/2);pdfStage.scrollLeft=left})}"
          if center_marker not in s: raise SystemExit('center marker missing')
          continuous_code = r'''
function setContinuousUi(on){continuousReader=!!on;document.documentElement.classList.toggle('efp-continuous-reader',continuousReader);if(mobilePdfPages)mobilePdfPages.hidden=!continuousReader;if(continuousReader){pdfCanvas.hidden=true;pdfStage.style.overflowX='hidden';pdfStage.style.overflowY='auto'}else{if(mobilePdfPages)mobilePdfPages.hidden=true;pdfStage.style.overflowX='auto'}}
function continuousPageEl(n){return mobilePdfPages?mobilePdfPages.querySelector('.mobile-pdf-page[data-page="'+n+'"]'):null}
function continuousWidth(){return Math.max(260,pdfStage.clientWidth-8)}
function sizeContinuousShell(shell,ratio){if(!shell)return;var w=continuousWidth(),h=Math.max(120,Math.round(w*(ratio||continuousAspect)));shell.style.height=h+'px';shell.style.minHeight=h+'px'}
function ensureContinuousPage(n,force){if(!continuousReader||!pdfDoc||!mobilePdfPages)return Promise.resolve();var shell=continuousPageEl(n);if(!shell)return Promise.resolve();if(!force&&shell.dataset.rendered==='1')return Promise.resolve();if(continuousRenders[n])return continuousRenders[n];continuousRenders[n]=pdfDoc.getPage(n).then(function(pg){var base=pg.getViewport({scale:1}),ratio=base.height/base.width,avail=continuousWidth(),scale=avail/base.width,dpr=Math.min(window.devicePixelRatio||1,2.5),vp=pg.getViewport({scale:scale*dpr}),canvas=shell.querySelector('canvas');shell.dataset.ratio=String(ratio);sizeContinuousShell(shell,ratio);if(!canvas){canvas=document.createElement('canvas');canvas.setAttribute('aria-label','PDF page '+n);shell.appendChild(canvas)}canvas.width=Math.max(1,Math.floor(vp.width));canvas.height=Math.max(1,Math.floor(vp.height));canvas.style.width=Math.floor(vp.width/dpr)+'px';canvas.style.height=Math.floor(vp.height/dpr)+'px';var ctx=canvas.getContext('2d',{alpha:false});return pg.render({canvasContext:ctx,viewport:vp}).promise.then(function(){shell.dataset.rendered='1';shell.style.height=Math.floor(vp.height/dpr)+'px';shell.style.minHeight=shell.style.height})}).catch(function(err){if(console&&console.error)console.error(err)}).then(function(){delete continuousRenders[n]});return continuousRenders[n]}
function trimContinuousPages(center){if(!mobilePdfPages)return;var shells=mobilePdfPages.querySelectorAll('.mobile-pdf-page[data-rendered="1"]');for(var i=0;i<shells.length;i++){var n=parseInt(shells[i].dataset.page,10)||0;if(Math.abs(n-center)>5){var c=shells[i].querySelector('canvas');if(c)c.remove();shells[i].dataset.rendered='0'}}}
function setContinuousCurrent(n){n=Math.max(1,Math.min(pdfDoc?pdfDoc.numPages:doc.pages,n));if(n===page){updateControls();return}page=n;markVisited();updateUrl();updateControls();trimContinuousPages(page)}
function updateContinuousCurrent(){if(!continuousReader||!mobilePdfPages)return;var r=pdfStage.getBoundingClientRect(),x=Math.max(r.left+8,Math.min(r.right-8,r.left+r.width/2)),y=Math.max(r.top+8,Math.min(r.bottom-8,r.top+Math.min(220,r.height*.34))),el=document.elementFromPoint(x,y);if(el&&el.closest){var shell=el.closest('.mobile-pdf-page');if(shell&&mobilePdfPages.contains(shell)){var n=parseInt(shell.dataset.page,10);if(n)setContinuousCurrent(n)}}}
function hideReaderControlsWhileScrolling(){var bar=document.getElementById('mobileReaderBar');if(bar)bar.classList.add('reader-hidden');clearTimeout(continuousScrollTimer);continuousScrollTimer=setTimeout(function(){if(bar)bar.classList.remove('reader-hidden')},520);if(!continuousScrollRAF)continuousScrollRAF=requestAnimationFrame(function(){continuousScrollRAF=0;updateContinuousCurrent()})}
function buildContinuousReader(firstPdfPage){if(!mobilePdfPages||!pdfDoc)return;setContinuousUi(true);continuousBuilt=true;mobilePdfPages.innerHTML='';if(continuousObserver){try{continuousObserver.disconnect()}catch(e){}}var firstBase=firstPdfPage.getViewport({scale:1});continuousAspect=firstBase.height/firstBase.width;var frag=document.createDocumentFragment();for(var n=1;n<=pdfDoc.numPages;n++){var shell=document.createElement('div');shell.className='mobile-pdf-page';shell.dataset.page=String(n);shell.dataset.rendered='0';shell.setAttribute('aria-label','Page '+n);sizeContinuousShell(shell,continuousAspect);var badge=document.createElement('span');badge.className='mobile-pdf-page-number';badge.textContent=String(n);shell.appendChild(badge);frag.appendChild(shell)}mobilePdfPages.appendChild(frag);continuousObserver=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){var n=parseInt(entry.target.dataset.page,10);if(n)ensureContinuousPage(n,false)}})},{root:pdfStage,rootMargin:'900px 0px',threshold:.01});Array.prototype.forEach.call(mobilePdfPages.children,function(shell){continuousObserver.observe(shell)});pdfStage.removeEventListener('scroll',hideReaderControlsWhileScrolling);pdfStage.addEventListener('scroll',hideReaderControlsWhileScrolling,{passive:true});requestAnimationFrame(function(){go(page,false)})}
function reflowContinuousReader(){if(!continuousReader||!mobilePdfPages)return;var shells=mobilePdfPages.querySelectorAll('.mobile-pdf-page');for(var i=0;i<shells.length;i++){var ratio=parseFloat(shells[i].dataset.ratio)||continuousAspect;sizeContinuousShell(shells[i],ratio);var c=shells[i].querySelector('canvas');if(c)c.remove();shells[i].dataset.rendered='0'}continuousRenders={};requestAnimationFrame(function(){go(page,false);ensureContinuousPage(page,false);ensureContinuousPage(Math.min(pdfDoc.numPages,page+1),false);if(page>1)ensureContinuousPage(page-1,false)})}
'''
          s = s.replace(center_marker, center_marker + continuous_code, 1)

          # Replace the old rotation-based renderer with natural-orientation rendering.
          render_pattern = r"function renderPage\(\)\{.*?\nfunction go"
          render_repl = r'''function renderPage(){if(!pdfDoc)return;mobileReader=isCompactReader();document.documentElement.classList.toggle('efp-compact-reader',mobileReader);if(continuousReader){ensureContinuousPage(page,false);return}pdfError.hidden=true;pdfLoading.hidden=false;pdfLoading.textContent='Loading page '+page+'…';pdfCanvas.hidden=true;if(renderTask){try{renderTask.cancel()}catch(e){}renderTask=null}
pdfDoc.getPage(page).then(function(pdfPage){var base=pdfPage.getViewport({scale:1}),landscape=base.width>base.height*1.03,availableW=Math.max(260,pdfStage.clientWidth-(mobileReader?4:18)),stageTop=pdfStage.getBoundingClientRect().top,visibleH=Math.max(220,window.innerHeight-stageTop-(mobileReader?4:18)),widthFit=availableW/base.width,fit=widthFit;lastPageLandscape=landscape;document.documentElement.classList.toggle('efp-landscape-page',landscape);document.documentElement.classList.toggle('efp-portrait-page',!landscape);document.documentElement.classList.toggle('efp-auto-fit',autoFit);document.documentElement.classList.remove('efp-mobile-rotated-page');if(!mobileReader&&landscape&&autoFit)fit=Math.min(widthFit,visibleH/base.height);var effectiveZoom=autoFit?(mobileReader?1:zoom):zoom,cssScale=fit*effectiveZoom,dpr=Math.min(window.devicePixelRatio||1,mobileReader?3:2),viewport=pdfPage.getViewport({scale:cssScale*dpr}),ctx=pdfCanvas.getContext('2d',{alpha:false});pdfStage.style.overflowY='auto';pdfStage.style.overflowX=mobileReader&&autoFit?'hidden':'auto';pdfCanvas.width=Math.floor(viewport.width);pdfCanvas.height=Math.floor(viewport.height);pdfCanvas.style.width=Math.floor(viewport.width/dpr)+'px';pdfCanvas.style.height=Math.floor(viewport.height/dpr)+'px';renderTask=pdfPage.render({canvasContext:ctx,viewport:viewport});return renderTask.promise}).then(function(){renderTask=null;pdfLoading.hidden=true;pdfCanvas.hidden=false;centerMobilePage();markVisited();updateUrl();updateControls()}).catch(function(err){if(err&&err.name==='RenderingCancelledException')return;showError('This PDF page could not be rendered inside the app.');if(console&&console.error)console.error(err)})}
function go'''
          s, n = re.subn(render_pattern, render_repl, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('render/go marker replacement failed')

          old_go = "function go(n){var max=pdfDoc?pdfDoc.numPages:doc.pages;var next=Math.max(1,Math.min(max,n));if(next===page){updateControls();return}page=next;renderPage();pdfStage.scrollTo({top:0,left:isCompactReader()?pdfStage.scrollLeft:0,behavior:'auto'});window.scrollTo({top:0,behavior:'smooth'})}"
          new_go = "function go(n,smooth){var max=pdfDoc?pdfDoc.numPages:doc.pages;var next=Math.max(1,Math.min(max,n));if(continuousReader){page=next;var shell=continuousPageEl(page);updateControls();return ensureContinuousPage(page,false).then(function(){if(shell)pdfStage.scrollTo({top:Math.max(0,shell.offsetTop-4),left:0,behavior:smooth===false?'auto':'smooth'});markVisited();updateUrl();trimContinuousPages(page)})}if(next===page){updateControls();return}page=next;renderPage();pdfStage.scrollTo({top:0,left:isCompactReader()?pdfStage.scrollLeft:0,behavior:'auto'});window.scrollTo({top:0,behavior:'smooth'})}"
          if old_go not in s: raise SystemExit('go function marker missing')
          s = s.replace(old_go, new_go, 1)

          load_pattern = r"function loadPdf\(\)\{.*?\nfunction loadPagesForSearch"
          load_repl = r'''function loadPdf(){if(!window.pdfjsLib){showError('PDF viewer failed to load. Check your internet connection once, then reopen this page.');return}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';pdfLoading.hidden=false;pdfLoading.textContent='Loading original PDF…';pdfjsLib.getDocument({url:doc.pdf}).promise.then(function(loaded){pdfDoc=loaded;total.textContent=loaded.numPages;if(page>loaded.numPages)page=loaded.numPages;mobileReader=isCompactReader();return loaded.getPage(page).then(function(firstPage){var base=firstPage.getViewport({scale:1}),landscape=base.width>base.height*1.03;if(mobileReader&&landscape&&mobilePdfPages){pdfLoading.hidden=true;pdfError.hidden=true;buildContinuousReader(firstPage)}else{setContinuousUi(false);renderPage()}})}).catch(function(err){showError('Original PDF could not be loaded inside the app.');if(console&&console.error)console.error(err)})}
function loadPagesForSearch'''
          s, n = re.subn(load_pattern, load_repl, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('loadPdf replacement failed')

          old_resize = "var resizeTimer;function refitForViewport(forceFit){clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){var portrait=window.innerHeight>=window.innerWidth,changed=portrait!==lastDevicePortrait;mobileReader=isCompactReader();lastDevicePortrait=portrait;if(forceFit||changed){autoFit=true;zoom=mobileReader?1.10:1}if(pdfDoc&&!document.body.classList.contains('mobile-tools-open')){updateControls();renderPage()}},180)}window.addEventListener('resize',function(){refitForViewport(false)});window.addEventListener('orientationchange',function(){refitForViewport(true)});if(window.visualViewport)window.visualViewport.addEventListener('resize',function(){refitForViewport(false)});if(window.screen&&screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',function(){refitForViewport(true)});"
          new_resize = "var resizeTimer;function refitForViewport(forceFit){clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){var portrait=window.innerHeight>=window.innerWidth,changed=portrait!==lastDevicePortrait;mobileReader=isCompactReader();lastDevicePortrait=portrait;if(forceFit||changed){autoFit=true;zoom=mobileReader?1.10:1}if(pdfDoc&&!document.body.classList.contains('mobile-tools-open')){updateControls();if(continuousReader&&mobileReader){reflowContinuousReader()}else if(continuousReader&&!mobileReader){setContinuousUi(false);continuousBuilt=false;renderPage()}else{renderPage()}}},180)}window.addEventListener('resize',function(){refitForViewport(false)});window.addEventListener('orientationchange',function(){refitForViewport(true)});if(window.visualViewport)window.visualViewport.addEventListener('resize',function(){refitForViewport(false)});if(window.screen&&screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',function(){refitForViewport(true)});"
          if old_resize not in s: raise SystemExit('resize marker missing')
          s = s.replace(old_resize, new_resize, 1)

          vp.write_text(s, encoding='utf-8', newline='\n')

          hp = Path('Crux-Tricks/viewer.html')
          h = hp.read_text(encoding='utf-8')
          canvas = '<canvas id="pdfCanvas" aria-label="Original PDF page"></canvas>'
          if canvas not in h: raise SystemExit('viewer canvas marker missing')
          h = h.replace(canvas, canvas + '<div id="mobilePdfPages" class="mobile-pdf-pages" hidden></div>', 1)

          style_marker = '#pdfCanvas{transition:filter .18s ease}'
          if style_marker not in h: raise SystemExit('viewer style marker missing')
          adobe_css = r'''
.mobile-pdf-pages{display:none}
html.efp-continuous-reader .reader-head{height:44px!important;min-height:44px!important;padding:4px 52px!important;grid-template-columns:minmax(0,1fr)!important}html.efp-continuous-reader .reader-title b{font-size:11px!important}html.efp-continuous-reader .reader-title small{display:none!important}html.efp-continuous-reader .reader-shell{height:calc(100dvh - 44px)!important;width:100%!important;margin:0!important}html.efp-continuous-reader .toolbar,html.efp-continuous-reader .doc-search{display:none!important}html.efp-continuous-reader .pdf-mode{height:100%!important;padding:0!important}html.efp-continuous-reader .pdf-stage{height:100%!important;min-height:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior-y:contain!important;touch-action:pan-y pinch-zoom!important;scroll-behavior:auto!important}html.efp-continuous-reader #pdfCanvas{display:none!important}html.efp-continuous-reader .mobile-pdf-pages{display:block!important;width:100%;padding:6px 4px calc(82px + env(safe-area-inset-bottom));box-sizing:border-box}html.efp-continuous-reader .mobile-pdf-page{position:relative;width:100%;margin:0 auto 10px;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;background:#cbd5e1;border-radius:5px;box-shadow:0 2px 10px rgba(0,0,0,.13)}html.dark.efp-continuous-reader .mobile-pdf-page{background:#0d1420}html.efp-continuous-reader .mobile-pdf-page canvas{display:block;margin:0 auto!important;max-width:none!important;box-shadow:none!important;background:#fff}html.efp-continuous-reader .mobile-pdf-page-number{position:absolute;right:6px;bottom:5px;z-index:2;min-width:24px;padding:2px 6px;border-radius:999px;background:rgba(15,23,42,.56);color:#fff;font:700 10px/1.4 system-ui,sans-serif;text-align:center;pointer-events:none;opacity:.65}
html.efp-continuous-reader .mobile-reader-bar{position:fixed!important;left:50%!important;right:auto!important;bottom:max(10px,env(safe-area-inset-bottom))!important;transform:translateX(-50%)!important;z-index:125!important;display:grid!important;grid-template-columns:44px minmax(70px,1fr) 44px 44px 44px!important;align-items:center!important;width:min(310px,calc(100vw - 28px))!important;min-width:238px!important;height:50px!important;padding:4px!important;border:1px solid color-mix(in srgb,var(--accent) 42%,var(--line))!important;border-radius:16px!important;background:color-mix(in srgb,var(--paper) 88%,transparent)!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important;-webkit-backdrop-filter:blur(16px)!important;backdrop-filter:blur(16px)!important;transition:opacity .18s ease,transform .2s ease!important}html.efp-continuous-reader .mobile-reader-bar button{height:40px!important;min-width:0!important;border:0!important;border-radius:11px!important;background:transparent!important;color:var(--text)!important;font:900 20px/1 inherit!important;cursor:pointer!important}html.efp-continuous-reader .mobile-reader-bar .mobile-page-info{font-size:11px!important;white-space:nowrap!important}html.efp-continuous-reader .mobile-reader-bar.reader-hidden{opacity:0!important;pointer-events:none!important;transform:translateX(-50%) translateY(calc(100% + 24px))!important}
html.efp-continuous-reader #efp-home-button{top:max(4px,env(safe-area-inset-top))!important;right:max(6px,env(safe-area-inset-right))!important;bottom:auto!important;left:auto!important;width:36px!important;min-width:36px!important;height:36px!important;min-height:36px!important;padding:0!important;border-radius:50%!important;background:rgba(8,14,24,.18)!important;box-shadow:none!important}html.efp-continuous-reader.efp-crux-back-fallback>#efp-app-back-button,html.efp-continuous-reader>#efp-app-back-button{top:max(4px,env(safe-area-inset-top))!important;left:max(6px,env(safe-area-inset-left))!important;right:auto!important;bottom:auto!important;width:36px!important;min-width:36px!important;height:36px!important;min-height:36px!important;padding:0!important;border-radius:50%!important;background:rgba(8,14,24,.18)!important;box-shadow:none!important}html.efp-continuous-reader #efp-home-button .efp-home-icon,html.efp-continuous-reader #efp-app-back-button .efp-back-icon{font-size:19px!important}html.efp-continuous-reader #efp-home-button .efp-home-label,html.efp-continuous-reader #efp-app-back-button .efp-back-label{display:none!important}
'''
          h = h.replace(style_marker, style_marker + adobe_css, 1)

          old_mq = "var mq=window.matchMedia('(max-width:820px)')"
          new_mq = "var mq=window.matchMedia('(max-width:820px), (hover:none) and (pointer:coarse) and (max-width:1024px), (hover:none) and (pointer:coarse) and (max-height:1024px) and (max-width:1400px)')"
          if old_mq not in h: raise SystemExit('mobile mq marker missing')
          h = h.replace(old_mq, new_mq, 1)
          h = h.replace('viewer.js?v=20260909rotate2', 'viewer.js?v=20260909adobe1')
          hp.write_text(h, encoding='utf-8', newline='\n')

          sw = Path('service-worker.js')
          t = sw.read_text(encoding='utf-8')
          if 'efp-pwa-2026-09-09-v80-mobile-pdf-rotate' not in t: raise SystemExit('cache marker missing')
          t = t.replace('efp-pwa-2026-09-09-v80-mobile-pdf-rotate','efp-pwa-2026-09-09-v81-adobe-mobile-pdf',1)
          t = t.replace('/Crux-Tricks/viewer.js?v=20260909rotate2','/Crux-Tricks/viewer.js?v=20260909adobe1',1)
          sw.write_text(t, encoding='utf-8', newline='\n')
          PY
      - name: Validate reader patch
        run: |
          node --check Crux-Tricks/viewer.js
          grep -q "efp-continuous-reader" Crux-Tricks/viewer.js
          grep -q "mobilePdfPages" Crux-Tricks/viewer.js
          grep -q "IntersectionObserver" Crux-Tricks/viewer.js
          grep -q "mobilePdfPages" Crux-Tricks/viewer.html
          grep -q "reader-hidden" Crux-Tricks/viewer.html
          grep -q "v81-adobe-mobile-pdf" service-worker.js
          ! grep -q "rotateForPortrait" Crux-Tricks/viewer.js
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "ExamFusion Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/adobe-mobile-pdf-reader.yml
          git add Crux-Tricks/viewer.js Crux-Tricks/viewer.html service-worker.js
          git commit -m "Use Adobe-like vertical mobile reader for landscape PDFs [skip ci]"
          git push origin master
