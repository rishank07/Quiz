name: PDF arrow scroll v1

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pdf-arrow-scroll-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch viewer
        run: python .github/scripts/add_pdf_arrow_scroll.py
      - name: Validate
        run: |
          node --check Crux-Tricks/viewer-v2.js
          grep -F "key==='ArrowDown'" Crux-Tricks/viewer-v2.js
          grep -F "key==='ArrowUp'" Crux-Tricks/viewer-v2.js
          grep -F "viewer-v2.js?v=20260909arrowscroll1" Crux-Tricks/viewer.html
          grep -F "v94-pdf-arrow-scroll" service-worker.js
      - name: Commit
        run: |
          git config user.name "ExamFusion Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Crux-Tricks/viewer-v2.js Crux-Tricks/viewer.html service-worker.js
          git rm .github/scripts/add_pdf_arrow_scroll.py .github/workflows/pdf-arrow-scroll-v1.yml
          git commit -m "Add PDF up down arrow scrolling [skip ci]"
          git push
# retry-2
