name: Install App Session Persistence

on:
  push:
    branches: [master]
    paths:
      - "app-session.js"
      - "tools/install-app-session.py"
      - ".github/workflows/install-app-session.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-app-session:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate installer
        run: python -m py_compile tools/install-app-session.py

      - name: Install app session persistence
        run: python tools/install-app-session.py

      - name: Commit generated integration changes
        run: |
          if git diff --quiet; then
            echo "App session integration already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-nav.js service-worker.js
          git commit -m "chore: enable installed-app session persistence"
          git push
