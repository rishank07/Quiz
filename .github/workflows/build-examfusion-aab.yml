name: Build ExamFusion Prep AAB

on:
  push:
    branches:
      - aab-build-temp
    paths:
      - '.github/workflows/build-examfusion-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct corrected Android project
        run: |
          rm -rf /tmp/examfusion-aab
          mkdir -p /tmp/examfusion-aab
          tar -xzf android-aab-temp/ExamFusionPrepAndroid-corrected-textsrc.tar.gz -C /tmp/examfusion-aab
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/examfusion-aab/ExamFusionPrepAndroid/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'\n\s*signingConfigs\s*\{.*?\n\s*\}\n\n\s*buildTypes', '\n\n    buildTypes', s, flags=re.S)
          s = re.sub(r'^\s*signingConfig\s+signingConfigs\.release\s*\n', '', s, flags=re.M)
          p.write_text(s)
          PY

      - name: Generate official logo resources
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open('logo.png').convert('RGBA')
          res = Path('/tmp/examfusion-aab/ExamFusionPrepAndroid/app/src/main/res')
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, size in sizes.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', 'PNG', optimize=True)
              icon.save(folder / 'ic_launcher_round.png', 'PNG', optimize=True)
          drawable = res / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          source.resize((512,512), Image.Resampling.LANCZOS).save(drawable / 'ic_launcher_foreground.png', 'PNG', optimize=True)
          source.resize((512,512), Image.Resampling.LANCZOS).save(drawable / 'splash_logo.png', 'PNG', optimize=True)
          PY

      - name: Build corrected API 36 release bundle
        working-directory: /tmp/examfusion-aab/ExamFusionPrepAndroid
        run: gradle --no-daemon bundleRelease

      - name: Upload unsigned corrected AAB
        uses: actions/upload-artifact@v4
        with:
          name: ExamFusion-Prep-API36-unsigned-aab
          path: /tmp/examfusion-aab/ExamFusionPrepAndroid/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
