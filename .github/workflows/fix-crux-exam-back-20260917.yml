name: Fix Crux Pinnacle exam back navigation

on:
  push:
    branches: [master]
    paths:
      - "tools/fix-crux-exam-back-20260917.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply fix
        run: python tools/fix-crux-exam-back-20260917.py

      - name: Validate JavaScript
        run: |
          node --check Crux-Tricks/crux-restore-flash.js
          node --check Crux-Tricks/crux-search-route.js
          node --check back-nav.js
          node --check service-worker.js

      - name: Commit generated fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Crux-Tricks/crux-restore-flash.js Crux-Tricks/index.html back-nav.js service-worker.js
          git commit -m "Fix Pinnacle exam back blank screen"
          git push
