name: Current Affairs Mobile Scorebars
on:
  push:
    branches: [master, fix/ca-mobile-scorebars-20261030]
    paths:
      - "rapid-practice-deeplink.js"
      - "quiz-unattempted.css"
      - "tools/test-current-affairs-scorebar.cjs"
      - ".github/workflows/current-affairs-scorebar.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ca-mobile-scorebars-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-scorebars:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/efp-scorebars" playwright@1.56.1 --ignore-scripts --no-audit --no-fund
          echo "NODE_PATH=$RUNNER_TEMP/efp-scorebars/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/efp-scorebars/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check shared script syntax
        run: |
          node --check rapid-practice-deeplink.js
          node --check service-worker.js
      - name: Reproduce the previous mobile border failure
        if: github.ref_name == 'fix/ca-mobile-scorebars-20261030'
        env:
          BASE_COMMIT: 2a3b69fba7c91db2d441f02d351216001d357814
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          git show "$BASE_COMMIT:rapid-practice-deeplink.js" > "$RUNNER_TEMP/efp-scorebar-before.js"
          EFP_TEST_RAPID_SCRIPT="$RUNNER_TEMP/efp-scorebar-before.js" node tools/test-current-affairs-scorebar.cjs --baseline
      - name: Render every Current Affairs quiz scorebar
        run: node tools/test-current-affairs-scorebar.cjs
      - name: Confirm the mobile fix and app cache reach production
        if: github.ref == 'refs/heads/master'
        timeout-minutes: 5
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const expected = fs.readFileSync('rapid-practice-deeplink.js', 'utf8');
          const localWorker = fs.readFileSync('service-worker.js', 'utf8');
          const assetPath = localWorker.match(/"(\/rapid-practice-deeplink\.js\?v=[^"]+)"/)[1];
          const cacheVersion = localWorker.match(/const CACHE_VERSION = "([^"]+)"/)[1];
          const hash = text => crypto.createHash('sha256').update(text).digest('hex');
          (async () => {
            for (let attempt = 1; attempt <= 30; attempt++) {
              try {
                const [script, worker] = await Promise.all([assetPath, '/service-worker.js'].map(async path => {
                  const response = await fetch('https://examfusionprep.com' + path, {
                    cache: 'no-store', signal: AbortSignal.timeout(10000)
                  });
                  assert(response.ok, path + ' HTTP ' + response.status);
                  return response.text();
                }));
                assert.equal(hash(script), hash(expected), 'production shared script matches the tested commit');
                assert(worker.includes(cacheVersion), 'production app cache version');
                assert(worker.includes(assetPath), 'production canonical mobile asset revision');
                console.log('PASS production mobile scorebar script and Android app cache revision');
                return;
              } catch (error) {
                if (attempt === 30) throw error;
                console.log('Waiting for production deployment:', error.message);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
