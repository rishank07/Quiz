name: Quiz Golden Frames
on:
  push:
    branches: [master, fix/ca-mobile-scorebars-20261030]
    paths:
      - "rapid-practice-deeplink.js"
      - "quiz-unattempted.css"
      - "quiz-unattempted.js"
      - "service-worker.js"
      - "tools/test-quiz-golden-frame.cjs"
      - "tools/build-cloudflare-pages.py"
      - "tools/test-quiz-frame-delivery.py"
      - "tools/test-current-affairs-scorebar.cjs"
      - ".github/workflows/current-affairs-scorebar.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ca-mobile-scorebars-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-scorebars:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/efp-scorebars" playwright@1.56.1 --ignore-scripts --no-audit --no-fund
          echo "NODE_PATH=$RUNNER_TEMP/efp-scorebars/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/efp-scorebars/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check shared script syntax
        run: |
          node --check rapid-practice-deeplink.js
          node --check service-worker.js
      - name: Reproduce the previous mobile border failure
        if: github.ref_name == 'fix/ca-mobile-scorebars-20261030'
        env:
          BASE_COMMIT: 2a3b69fba7c91db2d441f02d351216001d357814
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          git show "$BASE_COMMIT:rapid-practice-deeplink.js" > "$RUNNER_TEMP/efp-scorebar-before.js"
          EFP_TEST_RAPID_SCRIPT="$RUNNER_TEMP/efp-scorebar-before.js" node tools/test-current-affairs-scorebar.cjs --baseline
      - name: Render every Current Affairs quiz scorebar
        run: node tools/test-current-affairs-scorebar.cjs
      - name: Check direct stylesheet delivery
        run: python3 tools/test-quiz-frame-delivery.py
      - name: Render shared frames across all quiz families
        run: node tools/test-quiz-golden-frame.cjs
      - name: Confirm the shared quiz frames and app cache reach production
        if: github.ref == 'refs/heads/master'
        timeout-minutes: 5
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const localWorker = fs.readFileSync('service-worker.js', 'utf8');
          const files = ['rapid-practice-deeplink.js', 'quiz-unattempted.js', 'quiz-unattempted.css'];
          const shellPaths = [...localWorker.matchAll(/"(\/[^"]+\?v=[^"]+)"/g)].map(match => match[1]);
          const assets = files.map(file => ({
            file, path: shellPaths.find(value => value.startsWith('/' + file + '?v=')),
            expected: fs.readFileSync(file, 'utf8')
          }));
          const cacheVersion = localWorker.match(/const CACHE_VERSION = "([^"]+)"/)[1];
          const hash = text => crypto.createHash('sha256').update(text).digest('hex');
          (async () => {
            for (let attempt = 1; attempt <= 30; attempt++) {
              try {
                const bodies = await Promise.all([...assets.map(asset => asset.path), '/service-worker.js'].map(async path => {
                  const response = await fetch('https://examfusionprep.com' + path, {
                    cache: 'no-store', signal: AbortSignal.timeout(10000)
                  });
                  assert(response.ok, path + ' HTTP ' + response.status);
                  return response.text();
                }));
                const worker = bodies.pop();
                assets.forEach((asset, index) => {
                  assert.equal(hash(bodies[index]), hash(asset.expected), 'production ' + asset.file);
                  assert(worker.includes(asset.path), 'production canonical revision ' + asset.file);
                });
                assert(worker.includes(cacheVersion), 'production app cache version');
                console.log('PASS production generic quiz frame assets and Android app cache revision');
                return;
              } catch (error) {
                if (attempt === 30) throw error;
                console.log('Waiting for production deployment:', error.message);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
