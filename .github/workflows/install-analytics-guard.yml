name: Install analytics preview exclusion

on:
  push:
    branches: [master]
    paths:
      - "analytics-guard.js"
      - "tools/install-analytics-guard.py"
      - ".github/workflows/install-analytics-guard.yml"
      - "**/*.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install and validate early exclusion
        run: |
          python tools/install-analytics-guard.py
          node tools/test-analytics-guard.cjs
      - name: Commit generated guards
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "fix: exclude preview traffic before GA on every tracked page"
          git pull --rebase origin master
          git push
