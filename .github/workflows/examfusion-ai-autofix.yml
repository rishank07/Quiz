name: ExamFusion AI Auto-Fix PR

on:
  push:
    branches: [master]
    paths:
      - "**/*.html"
      - "!Mind Maps/Computer/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/examfusion-agent/requirements.txt

      - name: Restore AI review cache
        uses: actions/cache@v5
        with:
          path: .examfusion-qa-cache
          key: examfusion-ai-cache-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            examfusion-ai-cache-v2-${{ runner.os }}-${{ github.ref_name }}-
            examfusion-ai-cache-v2-${{ runner.os }}-

      - name: Run conservative AI audit and auto-fix
        env:
          EXAMFUSION_AI_API_KEY: ${{ secrets.EXAMFUSION_AI_API_KEY }}
          CHANGED_FROM: ${{ github.event.before }}
        run: |
          EXTRA_ARGS=()
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$CHANGED_FROM" ]; then
            EXTRA_ARGS+=(--changed-from "$CHANGED_FROM")
          fi
          python tools/examfusion-agent/agent.py \
            --repo . \
            --config tools/examfusion-agent/config.yml \
            --report-dir examfusion-qa-report \
            --ai-fix \
            "${EXTRA_ARGS[@]}"

      - name: Create pull request if files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No auto-fixable changes found."
            exit 0
          fi
          BRANCH="examfusion-ai-fix-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -u
          git commit -m "chore: ExamFusion AI QA fixes"
          git push origin "$BRANCH"
          gh pr create \
            --title "ExamFusion AI QA fixes" \
            --body "Conservative exact-text fixes from ExamFusion QA Agent. Factual answer-key changes are blocked; review before merging." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH"

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: examfusion-ai-autofix-report
          path: examfusion-qa-report/
