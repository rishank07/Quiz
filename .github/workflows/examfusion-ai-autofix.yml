name: ExamFusion AI Auto-Fix PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/examfusion-agent/requirements.txt

      - name: Restore AI review cache
        uses: actions/cache@v4
        with:
          path: .examfusion-qa-cache
          key: examfusion-ai-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            examfusion-ai-cache-${{ runner.os }}-${{ github.ref_name }}-
            examfusion-ai-cache-${{ runner.os }}-

      - name: Run conservative AI auto-fix
        
        env:
          EXAMFUSION_AI_API_KEY: ${{ secrets.EXAMFUSION_AI_API_KEY }}
          EXAMFUSION_AI_BASE_URL: ${{ secrets.EXAMFUSION_AI_BASE_URL }}
          EXAMFUSION_AI_MODEL: ${{ secrets.EXAMFUSION_AI_MODEL }}
        run: |
          python tools/examfusion-agent/agent.py \
            --repo . \
            --config tools/examfusion-agent/config.yml \
            --report-dir examfusion-qa-report \
            --fix-safe \
            --ai-fix

      - name: Create pull request if files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No auto-fixable changes found."
            exit 0
          fi
          BRANCH="examfusion-ai-fix-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -u
          git commit -m "chore: ExamFusion AI QA fixes"
          git push origin "$BRANCH"
          gh pr create --title "ExamFusion AI QA fixes" --body "Conservative exact-text fixes from ExamFusion QA Agent. Factual answer-key changes are blocked; review before merging." --base "${{ github.event.repository.default_branch }}" --head "$BRANCH"

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: examfusion-ai-autofix-report
          path: examfusion-qa-report/
