name: Fix PDF mobile navigation placement
on:
  push:
    paths:
      - '.github/workflows/fix-pdf-mobile-nav-bottom.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer navigation and cache bust
        shell: python
        run: |
          from pathlib import Path

          viewer = Path('Crux-Tricks/viewer-v2.js')
          s = viewer.read_text(encoding='utf-8')
          lines = [
            "      'html.efp-continuous-mobile-pdf #efp-home-button{top:max(3px,env(safe-area-inset-top))!important;right:max(6px,env(safe-area-inset-right))!important;bottom:auto!important;left:auto!important;width:32px!important;min-width:32px!important;height:32px!important;min-height:32px!important;padding:0!important;border-radius:50%!important;background:rgba(8,14,24,.22)!important;box-shadow:none!important}',\n",
            "      'html.efp-continuous-mobile-pdf #efp-app-back-button{top:max(3px,env(safe-area-inset-top))!important;left:max(6px,env(safe-area-inset-left))!important;right:auto!important;bottom:auto!important;width:32px!important;min-width:32px!important;height:32px!important;min-height:32px!important;padding:0!important;border-radius:50%!important;background:rgba(8,14,24,.22)!important;box-shadow:none!important}',\n",
            "      'html.efp-continuous-mobile-pdf #efp-home-button .efp-home-label,html.efp-continuous-mobile-pdf #efp-app-back-button .efp-back-label{display:none!important}',\n",
            "      'html.efp-continuous-mobile-pdf #efp-home-button .efp-home-icon,html.efp-continuous-mobile-pdf #efp-app-back-button .efp-back-icon{font-size:17px!important}',\n",
          ]
          for line in lines:
              if line not in s:
                  raise SystemExit('Expected continuous nav override not found')
              s = s.replace(line, '', 1)
          viewer.write_text(s, encoding='utf-8')

          html = Path('Crux-Tricks/viewer.html')
          h = html.read_text(encoding='utf-8')
          h = h.replace('viewer-v2.js?v=20260909acrobat4', 'viewer-v2.js?v=20260909navbottom1')
          html.write_text(h, encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          import re
          w, n = re.subn(r'const CACHE_VERSION = "[^"]+";', 'const CACHE_VERSION = "efp-pwa-2026-09-09-v86-pdf-nav-bottom";', w, count=1)
          if n != 1:
              raise SystemExit('CACHE_VERSION not found')
          w = w.replace('/Crux-Tricks/viewer-v2.js?v=20260909acrobat4', '/Crux-Tricks/viewer-v2.js?v=20260909navbottom1')
          sw.write_text(w, encoding='utf-8')
      - name: Validate
        run: |
          node --check Crux-Tricks/viewer-v2.js
          grep -q 'viewer-v2.js?v=20260909navbottom1' Crux-Tricks/viewer.html
          grep -q 'v86-pdf-nav-bottom' service-worker.js
          ! grep -q 'efp-continuous-mobile-pdf #efp-home-button{top:' Crux-Tricks/viewer-v2.js
      - name: Commit patch and cleanup
        run: |
          rm .github/workflows/fix-pdf-mobile-nav-bottom.yml
          git config user.name 'ExamFusion Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Crux-Tricks/viewer-v2.js Crux-Tricks/viewer.html service-worker.js .github/workflows/fix-pdf-mobile-nav-bottom.yml
          git commit -m 'Keep PDF mobile Home and Back controls at bottom corners [skip ci]'
          git push
