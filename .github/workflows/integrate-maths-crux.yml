name: Integrate Maths into Crux and Memory Tricks

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/integrate-maths-crux.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF parser
        run: pip install pypdf

      - name: Integrate Maths documents
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from pypdf import PdfReader
          import json, re

          repo=Path('.')
          crux=repo/'Crux-Tricks'
          pdf_dir=crux/'pdfs'/'ExamFusion Original'/'Maths'
          files=[
            ('01','Arithmetic Maths Formulae','01_Arithmetic_Maths_Formulae.pdf','ARITHMETIC MATHS FORMULAE','001.000'),
            ('02','Advance Maths Formula Book','02_Advance_Maths_Formula_Book.pdf','ADVANCE MATHS FORMULA BOOK','002.000'),
            ('03','Maths Master Sheet - Speed & Memory Reference','03_Maths_Master_Sheet_ExamFusionPrep.pdf','MATHS MASTER SHEET - SPEED & MEMORY REFERENCE','003.000'),
            ('04','Square, Square Roots, Cube Roots & Multiplication Tricks','04_Square_Root_Cube_Multiplication_Tricks.pdf','SQUARE, ROOT, CUBE & MULTIPLICATION TRICKS','004.000'),
          ]
          for _,_,fn,_,_ in files:
            p=pdf_dir/fn
            if not p.is_file(): raise SystemExit(f'Missing PDF: {p}')

          def compact(x): return json.dumps(x,ensure_ascii=False,separators=(',',':'))
          def parse_array(path,var):
            raw=path.read_text(encoding='utf-8')
            m=re.fullmatch(rf'\s*(?:var\s+)?(?:window\.)?{re.escape(var)}\s*=\s*(\[.*\])\s*;?\s*',raw,re.S)
            if not m: raise SystemExit(f'Cannot parse {var} in {path}')
            return json.loads(m.group(1))

          manifest=crux/'crux-manifest.js'
          docs=parse_array(manifest,'EF_CRUX_DOCS')
          docs=[d for d in docs if not (d.get('source')=='ExamFusion Original' and d.get('subject')=='Maths')]
          max_id=max([int(str(d.get('id','ct0'))[2:]) for d in docs if re.fullmatch(r'ct\d+',str(d.get('id','')))] or [0])
          new=[]
          snippets=[]
          pages_dir=crux/'pages'; pages_dir.mkdir(exist_ok=True)
          # Remove stale Maths page-index files left by a previous integration if any.
          stale_ids=[]
          for d in parse_array(manifest,'EF_CRUX_DOCS'):
            if d.get('source')=='ExamFusion Original' and d.get('subject')=='Maths': stale_ids.append(d.get('id'))
          for sid in stale_ids:
            p=pages_dir/f'{sid}.js'
            if p.exists(): p.unlink()

          for i,(num,title,fn,heading,sort_key) in enumerate(files,1):
            p=pdf_dir/fn
            reader=PdfReader(str(p))
            page_text=[]
            for n,page in enumerate(reader.pages,1):
              try: txt=(page.extract_text() or '').replace('\x00','').strip()
              except Exception: txt=''
              if not txt: txt=f'{title} - Page {n}'
              page_text.append(txt)
            doc_id=f'ct{max_id+i:04d}'
            rel=p.relative_to(crux).as_posix()
            breadcrumb='Crux & Tricks / ExamFusion Original / Maths'
            doc={
              'id':doc_id,'kind':'tricks','source':'ExamFusion Original','subject':'Maths','branch':'',
              'title':f'{num} {title}','heading':heading,'pages':len(reader.pages),
              'pdf':quote(rel,safe='/'),'breadcrumb':breadcrumb,'sourceTitle':title,'sortKey':sort_key,
            }
            new.append(doc)
            (pages_dir/f'{doc_id}.js').write_text(
              f'window.EF_CRUX_DOC_ID={compact(doc_id)};\nwindow.EF_CRUX_DOC_PAGES={compact(page_text)};\n',
              encoding='utf-8',newline='\n')

          manifest.write_text('window.EF_CRUX_DOCS='+compact(docs+new)+';\n',encoding='utf-8',newline='\n')

          # Add Maths subject to the Crux/Tricks hub UI.
          hub=crux/'index.html'; raw=hub.read_text(encoding='utf-8')
          raw=raw.replace(
            "var SO=['History','Polity','Geography','Science','Economics','Static GK'];var ICON={History:'🏛️',Polity:'⚖️',Geography:'🌍',Science:'🧪',Economics:'₹','Static GK':'🎯'};var HI={History:'इतिहास',Polity:'राजव्यवस्था',Geography:'भूगोल',Science:'विज्ञान',Economics:'अर्थशास्त्र','Static GK':'सामान्य ज्ञान'};",
            "var SO=['History','Polity','Geography','Science','Economics','Maths','Static GK'];var ICON={History:'🏛️',Polity:'⚖️',Geography:'🌍',Science:'🧪',Economics:'₹',Maths:'➗','Static GK':'🎯'};var HI={History:'इतिहास',Polity:'राजव्यवस्था',Geography:'भूगोल',Science:'विज्ञान',Economics:'अर्थशास्त्र',Maths:'गणित','Static GK':'सामान्य ज्ञान'};"
          )
          raw=raw.replace('History, Polity, Geography, Science, Economics and Static GK','History, Polity, Geography, Science, Economics, Maths and Static GK')
          raw=raw.replace('History, Polity, Geography, Science, Economics and Static GK.','History, Polity, Geography, Science, Economics, Maths and Static GK.')
          raw=re.sub(r'crux-manifest\.js\?v=[^"\']+','crux-manifest.js?v=20260908maths1',raw)
          raw=re.sub(r'crux-tricks\.js\?v=[^"\']+','crux-tricks.js?v=20260908maths1',raw)
          hub.write_text(raw,encoding='utf-8',newline='\n')

          # Keep internal subject ordering consistent.
          js=crux/'crux-tricks.js'; raw=js.read_text(encoding='utf-8')
          raw=raw.replace("var SUBJECT_ORDER=['History','Polity','Geography','Science','Economics','Static GK'];","var SUBJECT_ORDER=['History','Polity','Geography','Science','Economics','Maths','Static GK'];")
          js.write_text(raw,encoding='utf-8',newline='\n')

          # Viewer and My Pages should request the refreshed manifest/page indexes.
          for name in ['viewer.html','my-pages.html']:
            p=crux/name; r=p.read_text(encoding='utf-8')
            r=re.sub(r'crux-manifest\.js\?v=[^"\']+','crux-manifest.js?v=20260908maths1',r)
            r=re.sub(r'viewer\.js\?v=[^"\']+','viewer.js?v=20260908maths1',r)
            p.write_text(r,encoding='utf-8',newline='\n')
          vjs=crux/'viewer.js'; r=vjs.read_text(encoding='utf-8')
          r=re.sub(r"pages/'\+doc\.id\+'\.js\?v=[^']+'","pages/'+doc.id+'.js?v=20260908maths1'",r)
          vjs.write_text(r,encoding='utf-8',newline='\n')

          # Global search: add four Maths PDF destinations (title/metadata search).
          si=repo/'search-index-main.js'; records=parse_array(si,'SEARCH_INDEX')
          records=[x for x in records if not (x.get('section')=='Crux & Tricks' and x.get('breadcrumb')=='Crux & Tricks / ExamFusion Original / Maths')]
          for d in new:
            records.append({'title':d['sourceTitle'],'url':f"./Crux-Tricks/viewer.html?id={d['id']}",'section':'Crux & Tricks','breadcrumb':d['breadcrumb'],'leaf':True,'hi':'गणित'})
          si.write_text('var SEARCH_INDEX = '+compact(records)+';\n',encoding='utf-8',newline='\n')

          # Homepage Crux PDF count and search cache references.
          home=repo/'index.html'; r=home.read_text(encoding='utf-8')
          total=len(docs)+len(new)
          r=re.sub(r'("\./Crux-Tricks/index\.html":\{"total":)\d+',lambda m:m.group(1)+str(total),r)
          r=r.replace('History, Polity, Geography, Science, Economics and Static GK','History, Polity, Geography, Science, Economics, Maths and Static GK')
          home.write_text(r,encoding='utf-8',newline='\n')

          # PWA cache refresh so installed app sees the new manifest/UI immediately.
          sw=repo/'service-worker.js'; r=sw.read_text(encoding='utf-8')
          r=re.sub(r'const CACHE_VERSION = "[^"]+";','const CACHE_VERSION = "efp-pwa-2026-09-08-v78-maths-crux";',r,1)
          r=re.sub(r'/Crux-Tricks/crux-tricks\.js\?v=[^"\']+', '/Crux-Tricks/crux-tricks.js?v=20260908maths1',r)
          r=re.sub(r'/Crux-Tricks/viewer\.js\?v=[^"\']+', '/Crux-Tricks/viewer.js?v=20260908maths1',r)
          sw.write_text(r,encoding='utf-8',newline='\n')

          print('Maths docs:',[(d['id'],d['title'],d['pages'],d['pdf']) for d in new])
          print('Manifest total:',len(docs)+len(new))
          PY

      - name: Validate integration
        run: |
          python <<'PY'
          from pathlib import Path
          import json,re
          raw=Path('Crux-Tricks/crux-manifest.js').read_text(encoding='utf-8')
          docs=json.loads(re.fullmatch(r'\s*window\.EF_CRUX_DOCS=(\[.*\]);?\s*',raw,re.S).group(1))
          maths=[d for d in docs if d.get('source')=='ExamFusion Original' and d.get('subject')=='Maths']
          assert len(maths)==4, maths
          assert [d['pages'] for d in maths]==[73,282,15,16], [d['pages'] for d in maths]
          hub=Path('Crux-Tricks/index.html').read_text(encoding='utf-8')
          assert "Maths:'➗'" in hub and "Maths:'गणित'" in hub
          assert all((Path('Crux-Tricks')/d['pdf'].replace('%20',' ')).is_file() for d in maths)
          idx=Path('search-index-main.js').read_text(encoding='utf-8')
          assert all(f"viewer.html?id={d['id']}" in idx for d in maths)
          print('Validated four Maths PDFs and navigation/search records.')
          PY

      - name: Commit integration and remove one-off workflow
        run: |
          rm -f .github/workflows/integrate-maths-crux.yml
          git config user.name 'ExamFusion Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Crux-Tricks search-index-main.js index.html service-worker.js .github/workflows/integrate-maths-crux.yml
          git commit -m 'Add Maths section to Crux and Memory Tricks [skip ci]'
          git push origin master
