name: Update Section Counts

on:
  push:
    branches: [master]
    paths:
      - "**/*.html"
      - "Books/**/*.html"
      - "Bihar Special/**/*.html"
      - "Current Affairs/**/*.html"
      - "Mind Maps/**/*.html"
      - "Original Practice/question-counts.json"
      - "Crux-Tricks/crux-manifest.js"
      - "Crux-Tricks/crux-search-route.js"
      - "Crux-Tricks/crux-tricks.js"
      - "homepage-fulltext-search.js"
      - "search-worker.js"
      - "service-worker.js"
      - "index.html"
      - "home-nav.js"
      - "back-nav.js"
      - "back-parent-map.js"
      - "tools/add-home-nav.py"
      - "tools/update-back-parent-map.py"
      - "tools/update-book-question-counts.py"
      - "tools/update-rapid-practice-count.py"
      - "tools/update-home-integrations.py"
      - "tools/validate-crux-search-routing.js"
      - "Books/book-question-counts-display.js"
      - ".github/workflows/update-book-question-counts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: section-counts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-counts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate homepage and navigation code
        run: |
          python -m py_compile tools/update-home-integrations.py
          python -m py_compile tools/add-home-nav.py
          python -m py_compile tools/update-back-parent-map.py
          python -m py_compile tools/update-rapid-practice-count.py
          node --check homepage-fulltext-search.js
          node --check search-worker.js
          node --check service-worker.js
          node --check back-nav.js
          node tools/validate-crux-search-routing.js

      - name: Update Rapid Practice aggregate count
        run: python tools/update-rapid-practice-count.py --repo .

      - name: Recalculate section counts
        run: python tools/update-book-question-counts.py --repo .

      - name: Restore extended homepage integrations
        run: python tools/update-home-integrations.py --repo .

      - name: Generate logical Back parent map
        run: python tools/update-back-parent-map.py --repo .

      - name: Ensure shared Home and logical Back navigation on every HTML page
        run: python tools/add-home-nav.py --repo .

      - name: Commit updated counts and navigation if needed
        run: |
          if git diff --quiet; then
            echo "Section counts, homepage integrations and navigation are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Books "Bihar Special" "Current Affairs" "Mind Maps" index.html
          git add back-parent-map.js
          git add -- ':(glob)**/*.html'
          git commit -m "chore: update section counts and navigation maps"
          git push
