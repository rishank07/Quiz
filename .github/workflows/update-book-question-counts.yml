name: Update Section Counts

on:
  push:
    branches: [master]
    paths:
      - "Books/**/*.html"
      - "Bihar Special/**/*.html"
      - "Current Affairs/**/*.html"
      - "Mind Maps/**/*.html"
      - "Original Practice/question-counts.json"
      - "Crux-Tricks/crux-manifest.js"
      - "index.html"
      - "tools/update-book-question-counts.py"
      - "tools/update-home-integrations.py"
      - "Books/book-question-counts-display.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: section-counts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-counts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Recalculate section counts
        run: python tools/update-book-question-counts.py --repo .

      - name: Restore extended homepage integrations
        run: python tools/update-home-integrations.py --repo .

      - name: Commit updated counts if needed
        run: |
          if git diff --quiet; then
            echo "Section counts and homepage integrations are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Books "Bihar Special" "Current Affairs" "Mind Maps" index.html
          git commit -m "chore: update section counts"
          git push
