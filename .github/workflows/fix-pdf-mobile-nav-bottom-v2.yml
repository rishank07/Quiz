name: Fix PDF mobile navigation placement v2
on:
  push:
    paths:
      - '.github/workflows/fix-pdf-mobile-nav-bottom-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer navigation and cache bust
        shell: python
        run: |
          from pathlib import Path
          import re

          viewer = Path('Crux-Tricks/viewer-v2.js')
          s = viewer.read_text(encoding='utf-8')
          patterns = [
            r"^\s*'html\.efp-continuous-mobile-pdf #efp-home-button\{top:max\(3px,env\(safe-area-inset-top\)\).*?\}',\n",
            r"^\s*'html\.efp-continuous-mobile-pdf #efp-app-back-button\{top:max\(3px,env\(safe-area-inset-top\)\).*?\}',\n",
            r"^\s*'html\.efp-continuous-mobile-pdf #efp-home-button \.efp-home-label,html\.efp-continuous-mobile-pdf #efp-app-back-button \.efp-back-label\{display:none!important\}',\n",
            r"^\s*'html\.efp-continuous-mobile-pdf #efp-home-button \.efp-home-icon,html\.efp-continuous-mobile-pdf #efp-app-back-button \.efp-back-icon\{font-size:17px!important\}',\n",
          ]
          for pat in patterns:
              s, n = re.subn(pat, '', s, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit('Expected continuous nav override not found: '+pat)
          viewer.write_text(s, encoding='utf-8')

          html = Path('Crux-Tricks/viewer.html')
          h = html.read_text(encoding='utf-8')
          if 'viewer-v2.js?v=20260909fhd1' not in h:
              raise SystemExit('Current viewer version not found in viewer.html')
          h = h.replace('viewer-v2.js?v=20260909fhd1', 'viewer-v2.js?v=20260909navbottom2', 1)
          html.write_text(h, encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          w, n = re.subn(r'const CACHE_VERSION = "[^"]+";', 'const CACHE_VERSION = "efp-pwa-2026-09-09-v86-pdf-nav-bottom";', w, count=1)
          if n != 1:
              raise SystemExit('CACHE_VERSION not found')
          w = w.replace('/Crux-Tricks/viewer-v2.js?v=20260909fhd1', '/Crux-Tricks/viewer-v2.js?v=20260909navbottom2')
          sw.write_text(w, encoding='utf-8')
      - name: Validate
        run: |
          node --check Crux-Tricks/viewer-v2.js
          grep -q 'viewer-v2.js?v=20260909navbottom2' Crux-Tricks/viewer.html
          grep -q 'v86-pdf-nav-bottom' service-worker.js
          if grep -q 'efp-continuous-mobile-pdf #efp-home-button{top:' Crux-Tricks/viewer-v2.js; then exit 1; fi
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/fix-pdf-mobile-nav-bottom.yml .github/workflows/fix-pdf-mobile-nav-bottom-v2.yml
          git config user.name 'ExamFusion Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Keep PDF mobile Home and Back controls at bottom corners [skip ci]'
          git push
