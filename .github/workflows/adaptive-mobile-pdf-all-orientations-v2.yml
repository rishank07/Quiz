name: Adaptive mobile PDF reader all orientations v2
on:
  push:
    paths:
      - '.github/workflows/adaptive-mobile-pdf-all-orientations-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch adaptive mobile PDF behavior
        run: python .github/scripts/adaptive_mobile_pdf_patch.py
      - name: Validate
        run: |
          node --check Crux-Tricks/viewer-v2.js
          grep -q "if(isCompactReader())buildContinuous(pg)" Crux-Tricks/viewer-v2.js
          grep -q "if(mobileReader){if(!continuous)buildContinuous(pg);else reflowContinuous()}" Crux-Tricks/viewer-v2.js
          grep -q 'viewer-v2.js?v=20260909adaptiveall1' Crux-Tricks/viewer.html
          grep -q 'v88-pdf-adaptive-all' service-worker.js
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/adaptive-mobile-pdf-all-orientations.yml
          rm -f .github/workflows/adaptive-mobile-pdf-all-orientations-v2.yml
          rm -f .github/workflows/polish-landscape-pdf-chrome.yml
          rm -f .github/workflows/polish-landscape-pdf-chrome-v2.yml
          rm -f .github/scripts/adaptive_mobile_pdf_patch.py
          git config user.name 'ExamFusion Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Crux-Tricks/viewer-v2.js Crux-Tricks/viewer.html service-worker.js .github
          git commit -m 'Use adaptive continuous mobile PDF reader for all page orientations [skip ci]'
          git push
