name: Apply verified MoU Science Tech update

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/apply-mou-scitech.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate Science Tech integration
        run: python3 .github/scripts/integrate_mou_scitech.py

      - name: Remove temporary updater
        run: |
          rm -f .github/scripts/integrate_mou_scitech.py
          rm -f .github/workflows/apply-mou-scitech.yml

      - name: Commit and push verified site update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified 2026 MoU science and tech practice"
          git push origin HEAD:master
