<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PYQ Viewer | ExamFusion Prep</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#070a13">
  <link rel="icon" href="../favicon.png">
  <script>(function(){if(localStorage.getItem('efp_black_mode')==='on')document.documentElement.classList.add('dark')})();</script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q1WNRY8ECV"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-Q1WNRY8ECV');</script>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--paper:#fff;--text:#111827;--muted:#64748b;--line:#dbe2ea;--accent:#2563eb}
    html.dark{--bg:#070a13;--paper:#0f172a;--text:#f8fafc;--muted:#94a3b8;--line:#263247;--accent:#60a5fa}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Manrope,system-ui,-apple-system,Segoe UI,sans-serif}
    .shell{height:100dvh;display:grid;grid-template-rows:52px minmax(0,1fr)}
    .head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));background:var(--paper);border-bottom:1px solid var(--line);z-index:10}
    .btn{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:0 11px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;cursor:pointer}.rotate-btn{display:none}.rotate-btn.efp-rotate-pending{opacity:0!important;pointer-events:none!important}
    .title{min-width:0;text-align:center}.title b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{display:block;margin-top:2px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .viewer{position:relative;min-height:0;background:#111827}.viewer iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading,.error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center;background:var(--paper);color:var(--text);z-index:4}.loading[hidden],.error[hidden]{display:none}.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .error b{font-size:16px}.error span{max-width:560px;color:var(--muted);font-size:13px;line-height:1.55}
    .source-fallback{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:flex;gap:7px;padding:6px;border:1px solid rgba(148,163,184,.45);border-radius:14px;background:rgba(15,23,42,.86);backdrop-filter:blur(12px);box-shadow:0 10px 28px rgba(0,0,0,.28)}.source-fallback a{height:36px;border-radius:9px;padding:0 11px;display:flex;align-items:center;text-decoration:none;font-size:11px;font-weight:850;color:#fff;background:rgba(255,255,255,.11)}
    @media(max-width:650px),(hover:none) and (pointer:coarse) and (max-width:1024px){.shell{grid-template-rows:46px minmax(0,1fr)}.head{grid-template-columns:auto minmax(0,1fr) auto auto;padding-top:4px;padding-bottom:4px}.btn{height:34px;padding:0 9px;font-size:11px}.rotate-btn{display:inline-flex;width:34px;padding:0;font-size:21px;line-height:1}.title b{font-size:11px}.title small{font-size:9px}.source-fallback{bottom:max(7px,env(safe-area-inset-bottom))}}
  </style>
  <script defer src="/home-nav.js?v=20260906nav2"></script>
  <script defer src="/back-parent-map.js?v=20260906hier1"></script>
  <script defer src="/back-nav.js?v=20260924bookhier3"></script>
</head>
<body>
  <main class="shell">
    <header class="head">
      <button id="backBtn" class="btn" type="button">← Back</button>
      <div class="title"><b id="docTitle">PYQ Viewer</b><small id="docMeta">ExamFusion Prep</small></div>
      <a id="libraryBtn" class="btn" href="./index.html">PYQ</a>
      <button id="rotateBtn" class="btn rotate-btn efp-rotate-pending" type="button" data-efp-pdf-rotate aria-label="Rotate PDF to landscape" title="Rotate PDF to landscape"></button>
    </header>
    <section class="viewer">
      <iframe id="pdfFrame" title="PYQ PDF" allow="fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div id="loading" class="loading"><div class="spinner"></div><b>Opening inside ExamFusion Prep…</b><small id="loadingText">Loading paper</small></div>
      <div id="error" class="error" hidden><b>This source cannot be shown inside the app.</b><span id="errorText">ExamFusion will use a matching direct PDF copy when available.</span></div>
      <div class="source-fallback"><a id="sourceBtn" target="_blank" rel="noopener">Open source ↗</a><a id="retryBtn" href="#">Retry</a></div>
    </section>
  </main>
  <script src="/pdf-mobile-rotate.js?v=20260926rotate12"></script>
  <script src="./viewer.js?v=20260916b"></script>
</body>
</html>
