<script id="master-data" type="application/json">{"Environment & Ecology":{"1. Environment / पर्यावरण":[{"title":{"en":"1. Overview / Chapter Snapshot","hi":"1। अवलोकन / अध्याय स्नैपशॉट"},"questions":[{"q":{"en":"Which major topics are covered under Environment?","hi":"पर्यावरण विषय के अंतर्गत किन प्रमुख विषयों का अध्ययन किया जाता है?"},"a":{"en":"Components, degradation, laws, organisations, movements & days","hi":"घटक, क्षरण, कानून, संगठन, आंदोलन एवं दिवस"},"o":[{"en":"Components, degradation, laws, organisations, movements & days","hi":"घटक, क्षरण, कानून, संगठन, आंदोलन एवं दिवस"},{"en":"Landforms, ocean currents, rocks, soils, rivers & glaciers","hi":"भू-आकृतियाँ, समुद्री धाराएँ, चट्टानें, मृदा, नदियाँ एवं हिमनद"},{"en":"European treaties, colonial wars, trade routes, tariffs & empires","hi":"यूरोपीय संधियाँ, औपनिवेशिक युद्ध, व्यापार मार्ग, शुल्क एवं साम्राज्य"},{"en":"Mammalian anatomy, cell division, genetics, enzymes & hormones","hi":"स्तनधारी शरीर रचना, कोशिका विभाजन, आनुवंशिकी, एंजाइम एवं हार्मोन"}],"exp":{"en":"This chapter covers the concept, components and types of environment, causes of degradation, India's legal/institutional protection framework (EPA 1986, GEAC, NGT, CPCB), global and Indian organisations (WMO, NEERI, Greenpeace, UNEP), grassroots movements, and important environmental days and awards.","hi":"इस अध्याय में पर्यावरण की अवधारणा, घटक और प्रकार, क्षरण के कारण, भारत का कानूनी/संस्थागत संरक्षण ढाँचा (EPA 1986, GEAC, NGT, CPCB), वैश्विक व भारतीय संगठन (WMO, NEERI, ग्रीनपीस, UNEP), जमीनी आंदोलन तथा महत्वपूर्ण पर्यावरण दिवस व पुरस्कार शामिल हैं।"}},{"q":{"en":"How many major environmental organisations are covered in this chapter?","hi":"इस अध्याय में कितने प्रमुख पर्यावरण संगठन शामिल किए गए हैं?"},"a":{"en":"4 organisations (WMO, NEERI, Greenpeace, UNEP)","hi":"4 संगठन (WMO, NEERI, ग्रीनपीस, UNEP)"},"o":[{"en":"4 organisations (WMO, NEERI, Greenpeace, UNEP)","hi":"4 संगठन (WMO, NEERI, ग्रीनपीस, UNEP)"},{"en":"2 organisations (WHO, UNESCO)","hi":"2 संगठन (WHO, UNESCO)"},{"en":"5 organisations (WWF, IUCN, UNEP, WMO, FAO)","hi":"5 संगठन (WWF, IUCN, UNEP, WMO, FAO)"},{"en":"3 organisations (IPCC, UNFCCC, UNEP)","hi":"3 संगठन (IPCC, UNFCCC, UNEP)"}],"exp":{"en":"Four major organisations are covered: World Meteorological Organization (WMO), National Environmental Engineering Research Institute (NEERI), Greenpeace International, and United Nations Environment Programme (UNEP).","hi":"चार प्रमुख संगठन शामिल हैं: विश्व मौसम विज्ञान संगठन (WMO), राष्ट्रीय पर्यावरण अभियांत्रिकी अनुसंधान संस्थान (NEERI), ग्रीनपीस इंटरनेशनल और संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP)।"}},{"q":{"en":"How many major environmental movements are covered in this chapter?","hi":"इस अध्याय में कितने प्रमुख पर्यावरण आंदोलन शामिल किए गए हैं?"},"a":{"en":"4 movements (Chipko, Appiko, NBA, Maiti)","hi":"4 आंदोलन (चिपको, अप्पिको, NBA, मैती)"},"o":[{"en":"4 movements (Chipko, Appiko, NBA, Maiti)","hi":"4 आंदोलन (चिपको, अप्पिको, NBA, मैती)"},{"en":"3 movements (Chipko, Silent Valley, NBA)","hi":"3 आंदोलन (चिपको, साइलेंट वैली, NBA)"},{"en":"2 movements (Chipko, Green Belt)","hi":"2 आंदोलन (चिपको, ग्रीन बेल्ट)"},{"en":"5 movements (including Bishnoi & Tehri)","hi":"5 आंदोलन (बिश्नोई और टिहरी सहित)"}],"exp":{"en":"Four key Indian movements are covered: Chipko Movement, Appiko Movement, Narmada Bachao Andolan (NBA), and Maiti Movement.","hi":"चार प्रमुख भारतीय आंदोलन शामिल हैं: चिपको आंदोलन, अप्पिको आंदोलन, नर्मदा बचाओ आंदोलन (NBA) और मैती आंदोलन।"}},{"q":{"en":"How many important environmental days are covered in this chapter?","hi":"इस अध्याय में कितने महत्वपूर्ण पर्यावरण दिवस शामिल किए गए हैं?"},"a":{"en":"7 environmental days","hi":"7 पर्यावरण दिवस"},"o":[{"en":"7 environmental days","hi":"7 पर्यावरण दिवस"},{"en":"5 environmental days","hi":"5 पर्यावरण दिवस"},{"en":"10 environmental days","hi":"10 पर्यावरण दिवस"},{"en":"12 environmental days","hi":"12 पर्यावरण दिवस"}],"exp":{"en":"Seven observances are covered: World Wildlife Day (3 Mar), International Day of Forests (21 Mar), Earth Day (22 Apr), World Environment Day (5 Jun), International Tiger Day (29 Jul), World Ozone Day (16 Sep), and World Habitat Day (first Monday of October).","hi":"सात दिवस शामिल हैं: विश्व वन्यजीव दिवस (3 मार्च), अंतरराष्ट्रीय वन दिवस (21 मार्च), पृथ्वी दिवस (22 अप्रैल), विश्व पर्यावरण दिवस (5 जून), अंतरराष्ट्रीय बाघ दिवस (29 जुलाई), विश्व ओजोन दिवस (16 सितंबर) और विश्व पर्यावास दिवस (अक्टूबर का पहला सोमवार)।"}},{"q":{"en":"Which key umbrella environmental Act of 1986 is covered in this chapter?","hi":"इस अध्याय में 1986 का कौन-सा प्रमुख व्यापक पर्यावरण अधिनियम शामिल है?"},"a":{"en":"Environment (Protection) Act, 1986","hi":"पर्यावरण (संरक्षण) अधिनियम, 1986"},"o":[{"en":"Environment (Protection) Act, 1986","hi":"पर्यावरण (संरक्षण) अधिनियम, 1986"},{"en":"Wildlife (Protection) Act, 1972","hi":"वन्यजीव (संरक्षण) अधिनियम, 1972"},{"en":"Forest (Conservation) Act, 1980","hi":"वन (संरक्षण) अधिनियम, 1980"},{"en":"Air (Prevention and Control) Act, 1981","hi":"वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1981"}],"exp":{"en":"The Environment (Protection) Act, 1986 is India's umbrella environmental legislation empowering the Central Government to protect and improve environmental quality and frame rules (such as the 1989 biosafety rules).","hi":"पर्यावरण (संरक्षण) अधिनियम, 1986 भारत का व्यापक पर्यावरण कानून है, जो केंद्र सरकार को पर्यावरण गुणवत्ता के संरक्षण व सुधार तथा नियम (जैसे 1989 जैव-सुरक्षा नियम) बनाने की शक्ति देता है।"}}]},{"title":{"en":"2. Introduction & Components","hi":"2। परिचय और घटक"},"questions":[{"q":{"en":"What is the origin of the English word 'Environment'?","hi":"अंग्रेज़ी शब्द 'Environment' (पर्यावरण) की उत्पत्ति किस भाषा से हुई है?"},"a":{"en":"French 'environ/environner' (to surround)","hi":"फ्रांसीसी 'environ/environner' (घेरना)"},"o":[{"en":"French 'environ/environner' (to surround)","hi":"फ्रांसीसी 'environ/environner' (घेरना)"},{"en":"Greek 'oikos' (home or habitat)","hi":"यूनानी 'oikos' (घर या आवास)"},{"en":"Latin 'terra' (earth or land)","hi":"लैटिन 'terra' (पृथ्वी या भूमि)"},{"en":"Sanskrit 'parivesh' (surroundings)","hi":"संस्कृत 'परिवेश' (आसपास का क्षेत्र)"}],"exp":{"en":"The word 'Environment' is derived from the French word 'environ' or 'environner', meaning 'around' or 'to surround'. Conceptually, it refers to the total surroundings and conditions affecting living organisms.","hi":"'Environment' शब्द फ्रांसीसी 'environ/environner' से बना है, जिसका अर्थ 'के आसपास' या 'को घेरना' है। अवधारणात्मक रूप से यह जीवों को प्रभावित करने वाले समग्र परिवेश और स्थितियों को दर्शाता है।"}},{"q":{"en":"Which of the following are Biotic components of the environment?","hi":"निम्नलिखित में से पर्यावरण के जैविक (Biotic) घटक कौन-से हैं?"},"a":{"en":"Living beings, animals, plants, microbes","hi":"जीवित प्राणी, जंतु, पौधे, सूक्ष्मजीव"},"o":[{"en":"Living beings, animals, plants, microbes","hi":"जीवित प्राणी, जंतु, पौधे, सूक्ष्मजीव"},{"en":"Water, air, soil, minerals","hi":"जल, वायु, मृदा, खनिज"},{"en":"Solar radiation and temperature","hi":"सौर विकिरण और तापमान"},{"en":"Buildings, roads, dams, factories","hi":"इमारतें, सड़कें, बाँध, कारखाने"}],"exp":{"en":"Biotic components are all living organisms in an environment or ecosystem, including producers (plants), consumers (animals), and decomposers (bacteria, fungi, microbes).","hi":"जैविक घटक पर्यावरण या पारितंत्र के सभी जीवित प्राणी हैं, जिनमें उत्पादक (पौधे), उपभोक्ता (जंतु) और अपघटक (जीवाणु, कवक, सूक्ष्मजीव) शामिल हैं।"}},{"q":{"en":"Which of the following are Abiotic components of the environment?","hi":"निम्नलिखित में से पर्यावरण के अजैविक (Abiotic) घटक कौन-से हैं?"},"a":{"en":"Water, air, soil, temperature","hi":"जल, वायु, मृदा, तापमान"},"o":[{"en":"Water, air, soil, temperature","hi":"जल, वायु, मृदा, तापमान"},{"en":"Plants, animals, birds, insects","hi":"पौधे, जंतु, पक्षी, कीट"},{"en":"Fungi, bacteria, decomposers","hi":"कवक, जीवाणु, अपघटक"},{"en":"Algae, phytoplankton, grasses","hi":"शैवाल, पादप प्लवक, घास"}],"exp":{"en":"Abiotic components are the non-living physical and chemical factors of the environment, such as water, air, soil, minerals, light, temperature, and climate.","hi":"अजैविक घटक पर्यावरण के निर्जीव भौतिक और रासायनिक कारक हैं, जैसे जल, वायु, मृदा, खनिज, प्रकाश, तापमान और जलवायु।"}},{"q":{"en":"How is energy treated in the standard biotic–abiotic classification of environment?","hi":"पर्यावरण के मानक जैविक–अजैविक वर्गीकरण में ऊर्जा को किस रूप में माना जाता है?"},"a":{"en":"Treated as a non-living abiotic factor","hi":"निर्जीव अजैविक कारक के रूप में"},"o":[{"en":"Treated as a non-living abiotic factor","hi":"निर्जीव अजैविक कारक के रूप में"},{"en":"Classified as a biotic component","hi":"जैविक घटक के रूप में"},{"en":"Forms a mandatory third living category","hi":"अनिवार्य तीसरी जीवित श्रेणी के रूप में"},{"en":"Excluded from environmental studies","hi":"पर्यावरण अध्ययन से बाहर"}],"exp":{"en":"Energy such as sunlight is a non-living environmental input and is treated alongside abiotic factors; it is not a universally recognised third component separate from biotic and abiotic. Energy flow is studied as an ecosystem process.","hi":"सूर्यप्रकाश जैसी ऊर्जा एक निर्जीव पर्यावरणीय कारक है और इसे अजैविक घटकों के साथ माना जाता है; यह जैविक और अजैविक से अलग कोई सार्वभौमिक तीसरा घटक नहीं है।"}},{"q":{"en":"Which of the following are examples of the Natural Environment?","hi":"निम्नलिखित में से प्राकृतिक पर्यावरण के उदाहरण कौन-से हैं?"},"a":{"en":"Land, air, water, natural forests","hi":"भूमि, वायु, जल, प्राकृतिक वन"},"o":[{"en":"Land, air, water, natural forests","hi":"भूमि, वायु, जल, प्राकृतिक वन"},{"en":"Industrial cities and highways","hi":"औद्योगिक शहर और राजमार्ग"},{"en":"Botanical gardens and zoos","hi":"वनस्पति उद्यान और चिड़ियाघर"},{"en":"Dams, reservoirs and canals","hi":"बाँध, जलाशय और नहरें"}],"exp":{"en":"The natural environment comprises naturally occurring surroundings and ecosystems—such as land, air, water, soil, wild plants, animals, mountains, and oceans—without major human construction.","hi":"प्राकृतिक पर्यावरण में प्राकृतिक रूप से पाए जाने वाले परिवेश और पारितंत्र शामिल हैं—जैसे भूमि, वायु, जल, मृदा, वन्य पौधे, जंतु, पर्वत और महासागर।"}},{"q":{"en":"Which of the following are examples of the Man-made Environment?","hi":"निम्नलिखित में से मानव-निर्मित पर्यावरण के उदाहरण कौन-से हैं?"},"a":{"en":"Settlements, roads, dams, agricultural fields","hi":"बस्तियाँ, सड़कें, बाँध, कृषि क्षेत्र"},"o":[{"en":"Settlements, roads, dams, agricultural fields","hi":"बस्तियाँ, सड़कें, बाँध, कृषि क्षेत्र"},{"en":"Natural rivers, mountains, oceans","hi":"प्राकृतिक नदियाँ, पर्वत, महासागर"},{"en":"Virgin rainforests and wildlife","hi":"प्राकृतिक वर्षावन और वन्यजीव"},{"en":"Atmospheric air and mineral ores","hi":"वायुमंडलीय हवा और खनिज अयस्क"}],"exp":{"en":"The man-made (or human-modified) environment includes human-created or heavily modified surroundings such as settlements, roads, dams, industrial zones, and agricultural landscapes.","hi":"मानव-निर्मित (या मानव-परिवर्तित) पर्यावरण में मानव द्वारा निर्मित या परिवर्तित परिवेश शामिल हैं, जैसे बस्तियाँ, सड़कें, बाँध, औद्योगिक क्षेत्र और कृषि परिदृश्य।"}}]},{"title":{"en":"3. Environmental Degradation & Protection","hi":"3। पर्यावरण क्षरण और संरक्षण"},"questions":[{"q":{"en":"What does environmental degradation mean?","hi":"पर्यावरणीय क्षरण (Environmental Degradation) का क्या अर्थ है?"},"a":{"en":"Deterioration of environmental quality and ecosystems","hi":"पर्यावरणीय गुणवत्ता और पारितंत्रों में गिरावट"},"o":[{"en":"Deterioration of environmental quality and ecosystems","hi":"पर्यावरणीय गुणवत्ता और पारितंत्रों में गिरावट"},{"en":"Increase in species richness and cover","hi":"प्रजाति समृद्धि और आवरण में वृद्धि"},{"en":"Formation of new natural habitats","hi":"नए प्राकृतिक आवासों का निर्माण"},{"en":"Natural purification of air and water","hi":"वायु और जल का प्राकृतिक शुद्धिकरण"}],"exp":{"en":"Environmental degradation is the deterioration of environmental quality through resource depletion, pollution, habitat destruction, biodiversity loss, or disruption of ecological processes.","hi":"पर्यावरणीय क्षरण का अर्थ संसाधनों के क्षय, प्रदूषण, आवास विनाश, जैव विविधता हानि या पारिस्थितिक प्रक्रियाओं के व्यवधान से पर्यावरणीय गुणवत्ता में गिरावट आना है।"}},{"q":{"en":"Which of the following are major causes of environmental degradation?","hi":"निम्नलिखित में से पर्यावरणीय क्षरण के प्रमुख कारण कौन-से हैं?"},"a":{"en":"Mining, industrialization, urbanization, intensive farming","hi":"खनन, औद्योगीकरण, नगरीकरण, गहन कृषि"},"o":[{"en":"Mining, industrialization, urbanization, intensive farming","hi":"खनन, औद्योगीकरण, नगरीकरण, गहन कृषि"},{"en":"Afforestation and national park creation","hi":"वनीकरण और राष्ट्रीय उद्यान निर्माण"},{"en":"Adoption of solar and wind energy","hi":"सौर और पवन ऊर्जा को अपनाना"},{"en":"Community wildlife conservation programmes","hi":"सामुदायिक वन्यजीव संरक्षण कार्यक्रम"}],"exp":{"en":"Mining, rapid industrialization, unplanned urbanization, and intensive modern agriculture drive degradation when they cause excessive resource extraction, pollution, deforestation, and habitat loss.","hi":"खनन, तीव्र औद्योगीकरण, अनियोजित नगरीकरण और गहन आधुनिक कृषि अत्यधिक संसाधन दोहन, प्रदूषण, वनोन्मूलन और आवास हानि के कारण पर्यावरणीय क्षरण को बढ़ावा देते हैं।"}},{"q":{"en":"Which biosafety committee functions under the 1989 Rules of the Environment (Protection) Act, 1986?","hi":"पर्यावरण (संरक्षण) अधिनियम, 1986 के 1989 नियमों के अंतर्गत कौन-सी जैव-सुरक्षा समिति कार्य करती है?"},"a":{"en":"Genetic Engineering Appraisal Committee (GEAC)","hi":"आनुवंशिक अभियांत्रिकी आकलन समिति (GEAC)"},"o":[{"en":"Genetic Engineering Appraisal Committee (GEAC)","hi":"आनुवंशिक अभियांत्रिकी आकलन समिति (GEAC)"},{"en":"National Green Tribunal (NGT)","hi":"राष्ट्रीय हरित अधिकरण (NGT)"},{"en":"Central Pollution Control Board (CPCB)","hi":"केंद्रीय प्रदूषण नियंत्रण बोर्ड (CPCB)"},{"en":"National Biodiversity Authority (NBA)","hi":"राष्ट्रीय जैव विविधता प्राधिकरण (NBA)"}],"exp":{"en":"GEAC functions under the 1989 Rules notified under the Environment (Protection) Act, 1986. Originally called the Genetic Engineering Approval Committee, it was renamed the Genetic Engineering Appraisal Committee in July 2010.","hi":"GEAC पर्यावरण (संरक्षण) अधिनियम, 1986 के तहत अधिसूचित 1989 नियमों के अंतर्गत कार्य करती है। 2010 से पहले इसे 'अनुमोदन' समिति कहा जाता था, जिसे जुलाई 2010 में 'आकलन' समिति नाम दिया गया।"}},{"q":{"en":"When was the National Green Tribunal (NGT) established?","hi":"राष्ट्रीय हरित अधिकरण (NGT) की स्थापना कब हुई थी?"},"a":{"en":"18 October 2010","hi":"18 अक्टूबर 2010"},"o":[{"en":"18 October 2010","hi":"18 अक्टूबर 2010"},{"en":"22 September 1974","hi":"22 सितंबर 1974"},{"en":"23 May 1986","hi":"23 मई 1986"},{"en":"5 June 1992","hi":"5 जून 1992"}],"exp":{"en":"The National Green Tribunal (NGT) was established on 18 October 2010 under the National Green Tribunal Act, 2010 as a specialised environmental judicial body.","hi":"राष्ट्रीय हरित अधिकरण (NGT) की स्थापना 18 अक्टूबर 2010 को राष्ट्रीय हरित अधिकरण अधिनियम, 2010 के तहत एक विशिष्ट पर्यावरणीय न्यायिक निकाय के रूप में की गई थी।"}},{"q":{"en":"What is the primary purpose of the National Green Tribunal (NGT)?","hi":"राष्ट्रीय हरित अधिकरण (NGT) का मुख्य उद्देश्य क्या है?"},"a":{"en":"Expeditious disposal of environmental cases","hi":"पर्यावरणीय मामलों का त्वरित एवं प्रभावी निपटारा"},"o":[{"en":"Expeditious disposal of environmental cases","hi":"पर्यावरणीय मामलों का त्वरित एवं प्रभावी निपटारा"},{"en":"Approval of genetically modified crops","hi":"आनुवंशिक रूप से संशोधित फसलों का अनुमोदन"},{"en":"Global weather and cyclone forecasting","hi":"वैश्विक मौसम और चक्रवात पूर्वानुमान"},{"en":"Management of UNESCO Biosphere Reserves","hi":"यूनेस्को जैवमंडल आरक्षित क्षेत्रों का प्रबंधन"}],"exp":{"en":"NGT was created for effective and expeditious disposal of cases relating to environmental protection, forest conservation, enforcement of environmental legal rights, and providing relief and compensation.","hi":"NGT का उद्देश्य पर्यावरण संरक्षण, वन एवं प्राकृतिक संसाधनों से जुड़े मामलों का प्रभावी व त्वरित निपटारा करना, पर्यावरणीय कानूनी अधिकार लागू करना तथा राहत व क्षतिपूर्ति प्रदान करना है।"}},{"q":{"en":"When and under which Act was the Central Pollution Control Board (CPCB) constituted?","hi":"केंद्रीय प्रदूषण नियंत्रण बोर्ड (CPCB) का गठन कब और किस अधिनियम के तहत किया गया?"},"a":{"en":"22 September 1974, Water Act 1974","hi":"22 सितंबर 1974, जल अधिनियम 1974"},"o":[{"en":"22 September 1974, Water Act 1974","hi":"22 सितंबर 1974, जल अधिनियम 1974"},{"en":"18 October 2010, NGT Act 2010","hi":"18 अक्टूबर 2010, NGT अधिनियम 2010"},{"en":"23 May 1986, Environment Act 1986","hi":"23 मई 1986, पर्यावरण अधिनियम 1986"},{"en":"29 March 1981, Air Act 1981","hi":"29 मार्च 1981, वायु अधिनियम 1981"}],"exp":{"en":"CPCB is a statutory body constituted on 22 September 1974 under the Water (Prevention and Control of Pollution) Act, 1974. It was later entrusted with functions under the Air Act, 1981 and provides technical services under the Environment (Protection) Act, 1986.","hi":"CPCB एक वैधानिक निकाय है जिसका गठन 22 सितंबर 1974 को जल (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1974 के तहत हुआ। बाद में इसे वायु अधिनियम, 1981 के कार्य भी सौंपे गए और यह पर्यावरण अधिनियम, 1986 के तहत तकनीकी सेवाएँ देता है।"}},{"q":{"en":"When and where was Agenda-21 adopted?","hi":"एजेंडा-21 कब और कहाँ अपनाया गया था?"},"a":{"en":"Rio Earth Summit, June 1992","hi":"रियो पृथ्वी शिखर सम्मेलन, जून 1992"},"o":[{"en":"Rio Earth Summit, June 1992","hi":"रियो पृथ्वी शिखर सम्मेलन, जून 1992"},{"en":"Stockholm Conference, June 1972","hi":"स्टॉकहोम सम्मेलन, जून 1972"},{"en":"Kyoto Conference, December 1997","hi":"क्योटो सम्मेलन, दिसंबर 1997"},{"en":"Johannesburg Summit, August 2002","hi":"जोहान्सबर्ग शिखर सम्मेलन, अगस्त 2002"}],"exp":{"en":"Agenda 21 was adopted by over 178 governments at the United Nations Conference on Environment and Development (UNCED / Rio Earth Summit) held in Rio de Janeiro, Brazil, from 3–14 June 1992.","hi":"एजेंडा-21 को 3–14 जून 1992 को रियो डी जेनेरो, ब्राज़ील में आयोजित पर्यावरण एवं विकास पर संयुक्त राष्ट्र सम्मेलन (रियो पृथ्वी शिखर सम्मेलन) में 178 से अधिक सरकारों द्वारा अपनाया गया था।"}},{"q":{"en":"What was the primary aim of Agenda-21?","hi":"एजेंडा-21 का मुख्य उद्देश्य क्या था?"},"a":{"en":"Global action plan for sustainable development","hi":"सतत विकास के लिए वैश्विक कार्य योजना"},"o":[{"en":"Global action plan for sustainable development","hi":"सतत विकास के लिए वैश्विक कार्य योजना"},{"en":"Immediate worldwide ban on fossil fuels","hi":"जीवाश्म ईंधन पर तत्काल वैश्विक प्रतिबंध"},{"en":"Creation of National Green Tribunal","hi":"राष्ट्रीय हरित अधिकरण की स्थापना"},{"en":"Phase-out of ozone-depleting CFCs","hi":"ओजोन-क्षयकारी CFC को चरणबद्ध हटाना"}],"exp":{"en":"Agenda 21 provides a comprehensive global, national, and local action plan for sustainable development by integrating environmental protection with social and economic development, including poverty reduction and resource management.","hi":"एजेंडा-21 पर्यावरण संरक्षण को सामाजिक और आर्थिक विकास (जैसे गरीबी उन्मूलन व संसाधन प्रबंधन) के साथ जोड़ते हुए सतत विकास के लिए एक व्यापक वैश्विक, राष्ट्रीय और स्थानीय कार्य योजना प्रदान करता है।"}}]},{"title":{"en":"4. Environmental Organisations, Institutions & Programmes","hi":"4। पर्यावरण संगठन, संस्थान और कार्यक्रम"},"questions":[{"q":{"en":"When was the World Meteorological Organization (WMO) established?","hi":"विश्व मौसम विज्ञान संगठन (WMO) की स्थापना कब हुई थी?"},"a":{"en":"23 March 1950","hi":"23 मार्च 1950"},"o":[{"en":"23 March 1950","hi":"23 मार्च 1950"},{"en":"5 June 1972","hi":"5 जून 1972"},{"en":"5 October 1948","hi":"5 अक्टूबर 1948"},{"en":"2 February 1971","hi":"2 फ़रवरी 1971"}],"exp":{"en":"The WMO Convention entered into force on 23 March 1950, and WMO became a specialised agency of the United Nations in 1951.","hi":"WMO अभिसमय 23 मार्च 1950 को प्रभावी हुआ, और 1951 में WMO संयुक्त राष्ट्र की एक विशिष्ट संस्था बना।"}},{"q":{"en":"Where is the headquarters of the World Meteorological Organization (WMO) located?","hi":"विश्व मौसम विज्ञान संगठन (WMO) का मुख्यालय कहाँ स्थित है?"},"a":{"en":"Geneva, Switzerland","hi":"जिनेवा, स्विट्ज़रलैंड"},"o":[{"en":"Geneva, Switzerland","hi":"जिनेवा, स्विट्ज़रलैंड"},{"en":"Nairobi, Kenya","hi":"नैरोबी, केन्या"},{"en":"Amsterdam, Netherlands","hi":"एम्स्टर्डम, नीदरलैंड्स"},{"en":"Gland, Switzerland","hi":"ग्लैंड, स्विट्ज़रलैंड"}],"exp":{"en":"WMO is headquartered in Geneva, Switzerland. It coordinates global meteorological, hydrological, and climate observations.","hi":"WMO का मुख्यालय जिनेवा, स्विट्ज़रलैंड में स्थित है। यह वैश्विक मौसम विज्ञान, जल विज्ञान और जलवायु अवलोकनों का समन्वय करता है।"}},{"q":{"en":"What is the full form of NEERI and where is it located?","hi":"NEERI का पूर्ण रूप क्या है और यह कहाँ स्थित है?"},"a":{"en":"National Environmental Engineering Research Institute, Nagpur","hi":"राष्ट्रीय पर्यावरण अभियांत्रिकी अनुसंधान संस्थान, नागपुर"},"o":[{"en":"National Environmental Engineering Research Institute, Nagpur","hi":"राष्ट्रीय पर्यावरण अभियांत्रिकी अनुसंधान संस्थान, नागपुर"},{"en":"National Ecology and Environment Research Institute, Delhi","hi":"राष्ट्रीय पारिस्थितिकी एवं पर्यावरण अनुसंधान संस्थान, दिल्ली"},{"en":"National Earth Engineering Research Institute, Mumbai","hi":"राष्ट्रीय पृथ्वी अभियांत्रिकी अनुसंधान संस्थान, मुंबई"},{"en":"Nature and Ecology Engineering Research Institute, Bengaluru","hi":"प्रकृति एवं पारिस्थितिकी अभियांत्रिकी संस्थान, बेंगलुरु"}],"exp":{"en":"NEERI stands for National Environmental Engineering Research Institute, a constituent CSIR laboratory located in Nagpur, Maharashtra.","hi":"NEERI का पूर्ण रूप राष्ट्रीय पर्यावरण अभियांत्रिकी अनुसंधान संस्थान (National Environmental Engineering Research Institute) है, जो नागपुर, महाराष्ट्र में स्थित CSIR की एक प्रयोगशाला है।"}},{"q":{"en":"When was NEERI originally established as CPHERI, and when was it renamed NEERI?","hi":"NEERI की मूल स्थापना CPHERI के रूप में कब हुई और इसे NEERI नाम कब दिया गया?"},"a":{"en":"Established 1958, renamed 1974","hi":"स्थापना 1958, नाम परिवर्तन 1974"},"o":[{"en":"Established 1958, renamed 1974","hi":"स्थापना 1958, नाम परिवर्तन 1974"},{"en":"Established 1972, renamed 1986","hi":"स्थापना 1972, नाम परिवर्तन 1986"},{"en":"Established 1950, renamed 1965","hi":"स्थापना 1950, नाम परिवर्तन 1965"},{"en":"Established 1968, renamed 1981","hi":"स्थापना 1968, नाम परिवर्तन 1981"}],"exp":{"en":"The institute was established in 1958 in Nagpur as the Central Public Health Engineering Research Institute (CPHERI) under CSIR and was renamed NEERI in 1974 as its environmental mandate broadened.","hi":"इस संस्थान की स्थापना 1958 में नागपुर में CSIR के अंतर्गत केंद्रीय जनस्वास्थ्य अभियांत्रिकी अनुसंधान संस्थान (CPHERI) के रूप में हुई थी और 1974 में इसका नाम बदलकर NEERI रखा गया।"}},{"q":{"en":"In which year was Greenpeace International formed?","hi":"ग्रीनपीस इंटरनेशनल का गठन किस वर्ष हुआ था?"},"a":{"en":"1979","hi":"1979"},"o":[{"en":"1979","hi":"1979"},{"en":"1971","hi":"1971"},{"en":"1950","hi":"1950"},{"en":"1986","hi":"1986"}],"exp":{"en":"Greenpeace International was formed in 1979 as the international coordinating body, whereas the wider Greenpeace movement's famous first campaign voyage dates back to 1971.","hi":"अंतरराष्ट्रीय समन्वयकारी संगठन के रूप में ग्रीनपीस इंटरनेशनल का गठन 1979 में हुआ, जबकि व्यापक ग्रीनपीस आंदोलन की पहली प्रसिद्ध अभियान यात्रा 1971 में हुई थी।"}},{"q":{"en":"Where is Greenpeace International headquartered?","hi":"ग्रीनपीस इंटरनेशनल का मुख्यालय कहाँ स्थित है?"},"a":{"en":"Amsterdam, Netherlands","hi":"एम्स्टर्डम, नीदरलैंड्स"},"o":[{"en":"Amsterdam, Netherlands","hi":"एम्स्टर्डम, नीदरलैंड्स"},{"en":"Geneva, Switzerland","hi":"जिनेवा, स्विट्ज़रलैंड"},{"en":"Nairobi, Kenya","hi":"नैरोबी, केन्या"},{"en":"London, United Kingdom","hi":"लंदन, यूनाइटेड किंगडम"}],"exp":{"en":"Greenpeace International is based in Amsterdam, Netherlands, coordinating national and regional Greenpeace offices worldwide.","hi":"ग्रीनपीस इंटरनेशनल का मुख्यालय एम्स्टर्डम, नीदरलैंड्स में स्थित है, जहाँ से यह विश्व भर के कार्यालयों का समन्वय करता है।"}},{"q":{"en":"What is the full form of UNEP and when was it established?","hi":"UNEP का पूर्ण रूप क्या है और इसकी स्थापना कब हुई थी?"},"a":{"en":"United Nations Environment Programme, 1972","hi":"संयुक्त राष्ट्र पर्यावरण कार्यक्रम, 1972"},"o":[{"en":"United Nations Environment Programme, 1972","hi":"संयुक्त राष्ट्र पर्यावरण कार्यक्रम, 1972"},{"en":"United Nations Ecology Programme, 1950","hi":"संयुक्त राष्ट्र पारिस्थितिकी कार्यक्रम, 1950"},{"en":"Universal Nature Environment Programme, 1971","hi":"यूनिवर्सल नेचर एनवायरनमेंट प्रोग्राम, 1971"},{"en":"United Nations Earth Programme, 1992","hi":"संयुक्त राष्ट्र पृथ्वी कार्यक्रम, 1992"}],"exp":{"en":"UNEP stands for United Nations Environment Programme. It was established by the UN General Assembly in 1972 following the Stockholm Conference.","hi":"UNEP का पूर्ण रूप संयुक्त राष्ट्र पर्यावरण कार्यक्रम (United Nations Environment Programme) है। इसकी स्थापना 1972 के स्टॉकहोम सम्मेलन के बाद संयुक्त राष्ट्र महासभा द्वारा की गई थी।"}},{"q":{"en":"Where is UNEP headquartered?","hi":"UNEP का मुख्यालय कहाँ स्थित है?"},"a":{"en":"Nairobi, Kenya","hi":"नैरोबी, केन्या"},"o":[{"en":"Nairobi, Kenya","hi":"नैरोबी, केन्या"},{"en":"Geneva, Switzerland","hi":"जिनेवा, स्विट्ज़रलैंड"},{"en":"New York, USA","hi":"न्यूयॉर्क, अमेरिका"},{"en":"Vienna, Austria","hi":"वियना, ऑस्ट्रिया"}],"exp":{"en":"UNEP is headquartered in Nairobi, Kenya, making it one of the major UN bodies headquartered in Africa (unlike Geneva- or New York-based agencies).","hi":"UNEP का मुख्यालय नैरोबी, केन्या में स्थित है। यह अफ्रीका में मुख्यालय वाले प्रमुख संयुक्त राष्ट्र निकायों में से एक है।"}}]},{"title":{"en":"5. Major Environmental Movements","hi":"5। प्रमुख पर्यावरण आंदोलन"},"questions":[{"q":{"en":"Where did the Chipko Movement emerge, and who were its prominent figures?","hi":"चिपको आंदोलन कहाँ उभरा और इसके प्रमुख व्यक्ति कौन थे?"},"a":{"en":"Uttarakhand; Chandi Prasad Bhatt, Gaura Devi, Bahuguna","hi":"उत्तराखंड; चंडी प्रसाद भट्ट, गौरा देवी, बहुगुणा"},"o":[{"en":"Uttarakhand; Chandi Prasad Bhatt, Gaura Devi, Bahuguna","hi":"उत्तराखंड; चंडी प्रसाद भट्ट, गौरा देवी, बहुगुणा"},{"en":"Karnataka; Pandurang Hegde, Shivaram Karanth, Kusuma Sorab","hi":"कर्नाटक; पांडुरंग हेगड़े, शिवराम कारंत, कुसुमा सोरब"},{"en":"Gujarat; Medha Patkar, Baba Amte, Arundhati Roy","hi":"गुजरात; मेधा पाटकर, बाबा आमटे, अरुंधति रॉय"},{"en":"Kerala; Sugathakumari, M.K. Prasad, V.S. Vijayan","hi":"केरल; सुगाथाकुमारी, एम.के. प्रसाद, वी.एस. विजयन"}],"exp":{"en":"The Chipko Movement emerged in the Garhwal Himalaya of present-day Uttarakhand in the 1970s. Chandi Prasad Bhatt helped initiate it (1973), Gaura Devi led the famous Reni action (1974), and Sunderlal Bahuguna spread its message widely.","hi":"चिपको आंदोलन 1970 के दशक में वर्तमान उत्तराखंड के गढ़वाल हिमालय में उभरा। चंडी प्रसाद भट्ट ने 1973 में इसकी शुरुआत में भूमिका निभाई, गौरा देवी ने 1974 में रेणी कार्रवाई का नेतृत्व किया और सुंदरलाल बहुगुणा ने इसका व्यापक प्रसार किया।"}},{"q":{"en":"When and where did the Appiko Movement begin, and who is associated with it?","hi":"अप्पिको आंदोलन कब और कहाँ शुरू हुआ तथा इससे कौन संबद्ध हैं?"},"a":{"en":"Sept 1983, Uttara Kannada (Karnataka); Pandurang Hegde","hi":"सितंबर 1983, उत्तरा कन्नड़ (कर्नाटक); पांडुरंग हेगड़े"},"o":[{"en":"Sept 1983, Uttara Kannada (Karnataka); Pandurang Hegde","hi":"सितंबर 1983, उत्तरा कन्नड़ (कर्नाटक); पांडुरंग हेगड़े"},{"en":"1973, Garhwal (Uttarakhand); Sunderlal Bahuguna","hi":"1973, गढ़वाल (उत्तराखंड); सुंदरलाल बहुगुणा"},{"en":"1985, Narmada Valley; Medha Patkar","hi":"1985, नर्मदा घाटी; मेधा पाटकर"},{"en":"1995, Chamoli (Uttarakhand); Kalyan Singh Rawat","hi":"1995, चमोली (उत्तराखंड); कल्याण सिंह रावत"}],"exp":{"en":"The Appiko Movement began in September 1983 in the Salkani/Sirsi area of Uttara Kannada, Karnataka. Pandurang Hegde is prominently associated with facilitating and spreading it against commercial felling in the Western Ghats.","hi":"अप्पिको आंदोलन सितंबर 1983 में उत्तरा कन्नड़, कर्नाटक के सलकानी/सिरसी क्षेत्र में शुरू हुआ। पांडुरंग हेगड़े ने पश्चिमी घाट में वाणिज्यिक कटाई के विरुद्ध इसे सुगम बनाने और फैलाने में प्रमुख भूमिका निभाई।"}},{"q":{"en":"What is the Appiko Movement popularly called?","hi":"अप्पिको आंदोलन को लोकप्रिय रूप से किस नाम से जाना जाता है?"},"a":{"en":"Southern version of Chipko Movement","hi":"चिपको आंदोलन का दक्षिणी संस्करण"},"o":[{"en":"Southern version of Chipko Movement","hi":"चिपको आंदोलन का दक्षिणी संस्करण"},{"en":"Northern version of Narmada Bachao Andolan","hi":"नर्मदा बचाओ आंदोलन का उत्तरी संस्करण"},{"en":"Wedding-linked Maiti Movement","hi":"विवाह-संबंधी मैती आंदोलन"},{"en":"Silent Valley Hydroelectric Protest","hi":"साइलेंट वैली जलविद्युत विरोध"}],"exp":{"en":"It is called the 'Southern version' of the Chipko Movement because both used non-violent tree-hugging ('Appiko' means 'to hug' in Kannada) to resist destructive forest felling.","hi":"इसे चिपको आंदोलन का 'दक्षिणी संस्करण' कहा जाता है क्योंकि दोनों ने विनाशकारी वन कटाई का विरोध करने के लिए अहिंसक वृक्ष-आलिंगन (कन्नड़ में 'अप्पिको' = चिपकना) की पद्धति अपनाई।"}},{"q":{"en":"When and where did the Narmada Bachao Andolan emerge, and who is its prominent leader?","hi":"नर्मदा बचाओ आंदोलन कब और कहाँ उभरा तथा इसकी प्रमुख नेता कौन हैं?"},"a":{"en":"Around 1985, Narmada Valley; Medha Patkar","hi":"लगभग 1985, नर्मदा घाटी; मेधा पाटकर"},"o":[{"en":"Around 1985, Narmada Valley; Medha Patkar","hi":"लगभग 1985, नर्मदा घाटी; मेधा पाटकर"},{"en":"1973, Garhwal Himalaya; Chandi Prasad Bhatt","hi":"1973, गढ़वाल हिमालय; चंडी प्रसाद भट्ट"},{"en":"1983, Uttara Kannada; Pandurang Hegde","hi":"1983, उत्तरा कन्नड़; पांडुरंग हेगड़े"},{"en":"1995, Chamoli; Kalyan Singh Rawat","hi":"1995, चमोली; कल्याण सिंह रावत"}],"exp":{"en":"Narmada Bachao Andolan emerged around 1985 in the Narmada Valley under the prominent leadership of Medha Patkar, challenging the social displacement and ecological costs of large dams.","hi":"नर्मदा बचाओ आंदोलन लगभग 1985 में नर्मदा घाटी में मेधा पाटकर के प्रमुख नेतृत्व में उभरा, जिसने बड़े बाँधों के सामाजिक विस्थापन और पारिस्थितिक प्रभावों को चुनौती दी।"}},{"q":{"en":"When and where did the Maiti Movement begin, and who founded it?","hi":"मैती आंदोलन कब और कहाँ आरंभ हुआ तथा इसके संस्थापक कौन हैं?"},"a":{"en":"1995, Gwaldam (Uttarakhand); Kalyan Singh Rawat","hi":"1995, ग्वालदम (उत्तराखंड); कल्याण सिंह रावत"},"o":[{"en":"1995, Gwaldam (Uttarakhand); Kalyan Singh Rawat","hi":"1995, ग्वालदम (उत्तराखंड); कल्याण सिंह रावत"},{"en":"1983, Sirsi (Karnataka); Pandurang Hegde","hi":"1983, सिरसी (कर्नाटक); पांडुरंग हेगड़े"},{"en":"1985, Narmada Valley; Medha Patkar","hi":"1985, नर्मदा घाटी; मेधा पाटकर"},{"en":"1973, Chamoli (Uttarakhand); Gaura Devi","hi":"1973, चमोली (उत्तराखंड); गौरा देवी"}],"exp":{"en":"The Maiti Movement began in 1995 at Gwaldam in Chamoli, Uttarakhand, pioneered by Kalyan Singh Rawat. 'Maiti' refers to a bride's parental home, linking tree planting with wedding customs.","hi":"मैती आंदोलन 1995 में चमोली, उत्तराखंड के ग्वालदम में कल्याण सिंह रावत द्वारा शुरू किया गया। 'मैती' का अर्थ मायका है, जिसने वृक्षारोपण को विवाह जैसी सामाजिक परंपराओं से जोड़ा।"}}]},{"title":{"en":"6. Important Days & Facts","hi":"6। महत्वपूर्ण दिन और तथ्य"},"questions":[{"q":{"en":"When is World Wildlife Day celebrated?","hi":"विश्व वन्यजीव दिवस (विश्व वन्यजीव दिवस) कब मनाया जाता है?"},"a":{"en":"3rd March.","hi":"3 मार्च।"},"o":[{"en":"3rd March.","hi":"3 मार्च।"},{"en":"21st March.","hi":"21 मार्च।"},{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"5th June.","hi":"5 जून।"}],"exp":{"en":"3rd March. The UN General Assembly proclaimed 3 March as World Wildlife Day because it is the date on which CITES was adopted in 1973.","hi":"3 मार्च। संयुक्त राष्ट्र महासभा ने 3 मार्च को विश्व वन्यजीव दिवस घोषित किया क्योंकि इसी तिथि पर 1973 में CITES अपनाया हुआ था।"}},{"q":{"en":"When is the International Day of Forests observed?","hi":"अंतरराष्ट्रीय वन दिवस कब मनाया जाता है?"},"a":{"en":"21st March.","hi":"21 मार्च।"},"o":[{"en":"21st March.","hi":"21 मार्च।"},{"en":"3rd March.","hi":"3 मार्च।"},{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"29th July.","hi":"29 जुलाई।"}],"exp":{"en":"21st March. The official UN observance is called the International Day of Forests; the UN General Assembly proclaimed 21 March for this purpose in 2012.","hi":"21 मार्च। आधिकारिक UN दिवस का नाम अंतरराष्ट्रीय वन दिवस है; संयुक्त राष्ट्र महासभा ने 2012 में 21 मार्च को इस उद्देश्य के लिए घोषित किया।"}},{"q":{"en":"When is Earth Day observed?","hi":"पृथ्वी दिवस कब मनाया जाता है?"},"a":{"en":"22nd April.","hi":"22 अप्रैल।"},"o":[{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"21st March.","hi":"21 मार्च।"},{"en":"5th June.","hi":"5 जून।"},{"en":"16th September.","hi":"16 सितम्बर।"}],"exp":{"en":"22nd April. Earth Day is observed globally on 22 April and is distinct from World Environment Day on 5 June.","hi":"22 अप्रैल। पृथ्वी दिवस वैश्विक रूप से 22 अप्रैल को मनाया जाता है और 5 जून के विश्व पर्यावरण दिवस से अलग है।"}},{"q":{"en":"When is World Environment Day celebrated?","hi":"विश्व पर्यावरण दिवस (विश्व पर्यावरण दिवस) कब मनाया जाता है?"},"a":{"en":"5th June.","hi":"5 जून।"},"o":[{"en":"5th June.","hi":"5 जून।"},{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"29th July.","hi":"29 जुलाई।"},{"en":"16th September.","hi":"16 सितम्बर।"}],"exp":{"en":"5th June. World Environment Day is led by UNEP and has been marked annually on 5 June since 1973 as a global platform for environmental awareness and action.","hi":"5 जून। विश्व पर्यावरण दिवस UNEP नेतृत्व करता है और 1973 से प्रतिवर्ष 5 जून को पर्यावरणीय जागरूकता/कार्रवाई के वैश्विक मंच के रूप में मनाया जाता है।"}},{"q":{"en":"When is International Tiger Day celebrated?","hi":"अंतर्राष्ट्रीय बाघ दिवस (अंतरराष्ट्रीय बाघ दिवस) कब मनाया जाता है?"},"a":{"en":"29th July.","hi":"29 जुलाई।"},"o":[{"en":"29th July.","hi":"29 जुलाई।"},{"en":"5th June.","hi":"5 जून।"},{"en":"16th September.","hi":"16 सितम्बर।"},{"en":"3rd March.","hi":"3 मार्च।"}],"exp":{"en":"29th July. Global/International Tiger Day is observed on 29 July, linked to the 2010 St Petersburg tiger summit and the global commitment to tiger conservation.","hi":"29 जुलाई। वैश्विक/अंतरराष्ट्रीय बाघ दिवस 29 जुलाई को मनाया जाता है और 2010 सेंट पीटर्सबर्ग बाघ शिखर सम्मेलन तथा वैश्विक बाघ-संरक्षण प्रतिबद्धता से संबंधित है।"}},{"q":{"en":"When is the International Day for the Preservation of the Ozone Layer (World Ozone Day) observed?","hi":"अंतरराष्ट्रीय ओजोन परत संरक्षण दिवस (विश्व ओजोन दिन) कब मनाया जाता है?"},"a":{"en":"16th September.","hi":"16 सितंबर।"},"o":[{"en":"16th September.","hi":"16 सितंबर।"},{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"29th July.","hi":"29 जुलाई।"},{"en":"5th June.","hi":"5 जून।"}],"exp":{"en":"16th September. The UN's official name is the International Day for the Preservation of the Ozone Layer. It commemorates the 16 September 1987 signing of the Montreal Protocol.","hi":"16 सितंबर। UN का आधिकारिक नाम अंतरराष्ट्रीय ओजोन परत संरक्षण दिवस है। यह 16 सितंबर 1987 को मॉन्ट्रियल प्रोटोकॉल पर हस्ताक्षर की वर्षगांठ का स्मरण कराता है।"}},{"q":{"en":"When is World Habitat Day celebrated?","hi":"विश्व पर्यावास दिवस कब मनाया जाता है?"},"a":{"en":"First Monday of October","hi":"अक्टूबर का पहला सोमवार"},"o":[{"en":"First Monday of October","hi":"अक्टूबर का पहला सोमवार"},{"en":"1st October every year","hi":"प्रतिवर्ष 1 अक्टूबर"},{"en":"Last Friday of September","hi":"सितंबर का अंतिम शुक्रवार"},{"en":"16th September every year","hi":"प्रतिवर्ष 16 सितंबर"}],"exp":{"en":"World Habitat Day is observed each year on the first Monday of October (established by the UN General Assembly in 1985). Unlike the other six environmental days in this chapter, it has no fixed calendar date.","hi":"विश्व पर्यावास दिवस प्रतिवर्ष अक्टूबर के पहले सोमवार को मनाया जाता है (संयुक्त राष्ट्र महासभा द्वारा 1985 में स्थापित)। इस अध्याय के अन्य छह पर्यावरण दिवसों के विपरीत इसकी कोई निश्चित कैलेंडर तिथि नहीं है।"}},{"q":{"en":"What is the timeline of India's Ecomark environmental labelling framework?","hi":"भारत के इकोमार्क पर्यावरण लेबलिंग ढाँचे की समयरेखा क्या है?"},"a":{"en":"Original scheme 1991; Ecomark Rules 2024","hi":"मूल योजना 1991; इकोमार्क नियम 2024"},"o":[{"en":"Original scheme 1991; Ecomark Rules 2024","hi":"मूल योजना 1991; इकोमार्क नियम 2024"},{"en":"Original scheme 1986; Rules 2010","hi":"मूल योजना 1986; नियम 2010"},{"en":"Original scheme 1972; Rules 1992","hi":"मूल योजना 1972; नियम 1992"},{"en":"Original scheme 2002; Rules 2020","hi":"मूल योजना 2002; नियम 2020"}],"exp":{"en":"India's original Ecomark scheme was launched in 1991 for environment-friendly products; that notification was rescinded and replaced by the Ecomark Rules, 2024.","hi":"भारत की मूल इकोमार्क योजना पर्यावरण-अनुकूल उत्पादों के लिए 1991 में शुरू की गई थी; उस अधिसूचना को निरस्त कर अब इकोमार्क नियम, 2024 लागू किए गए हैं।"}},{"q":{"en":"When was the Indira Gandhi Paryavaran Puraskar instituted?","hi":"इंदिरा गांधी पर्यावरण पुरस्कार कब स्थापित हुआ?"},"a":{"en":"1987","hi":"1987"},"o":[{"en":"1987","hi":"1987"},{"en":"1999","hi":"1999"},{"en":"1991","hi":"1991"},{"en":"1972","hi":"1972"}],"exp":{"en":"1987. The Ministry instituted the Indira Gandhi Paryavaran Puraskar in 1987 to recognise significant contributions to environmental protection.","hi":"1987। मंत्रालय ने पर्यावरण संरक्षण में महत्वपूर्ण योगदान मान्यता करने के लिए इंदिरा गांधी पर्यावरण पुरस्कार 1987 में संस्थान किया।"}},{"q":{"en":"When was the Rajiv Gandhi Environment Award for Clean Technology instituted?","hi":"स्वच्छ प्रौद्योगिकी हेतु राजीव गांधी पर्यावरण पुरस्कार कब स्थापित हुआ?"},"a":{"en":"1993.","hi":"1993।"},"o":[{"en":"1993.","hi":"1993।"},{"en":"1999.","hi":"1999।"},{"en":"1987.","hi":"1987।"},{"en":"2002.","hi":"2002।"}],"exp":{"en":"1993. The award was created to encourage highly polluting industrial sectors to adopt cleaner technologies and practices that prevent or substantially reduce pollution.","hi":"1993। पुरस्कार अत्यधिक प्रदूषणकारी औद्योगिक क्षेत्रों को स्वच्छतर प्रौद्योगिकियाँ/कार्य-पद्धतियाँ अपनाया करने के लिए प्रोत्साहित करने हेतु बनाया गया, ताकि प्रदूषण रोकना या काफी हद तक कम हो।"}}]},{"title":{"en":"7. Common Confusions & Reverse Questions","hi":"7। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"In the standard biotic–abiotic classification, how is solar energy classified?","hi":"मानक जैविक–अजैविक वर्गीकरण में सौर ऊर्जा को किस श्रेणी में रखा जाता है?"},"a":{"en":"With abiotic (non-living) factors","hi":"अजैविक (निर्जीव) कारकों के साथ"},"o":[{"en":"With abiotic (non-living) factors","hi":"अजैविक (निर्जीव) कारकों के साथ"},{"en":"Under biotic (living) components","hi":"जैविक (जीवित) घटकों के अंतर्गत"},{"en":"Under man-made environment","hi":"मानव-निर्मित पर्यावरण के अंतर्गत"},{"en":"Excluded from environmental factors","hi":"पर्यावरणीय कारकों से बाहर"}],"exp":{"en":"Sunlight and other energy inputs are non-living environmental factors and are treated with abiotic factors; they do not form a universally accepted separate third component.","hi":"सूर्यप्रकाश और अन्य ऊर्जा आदान निर्जीव पर्यावरणीय कारक हैं और इन्हें अजैविक कारकों के साथ माना जाता है; ये कोई अलग तीसरा घटक नहीं बनाते।"}},{"q":{"en":"Which pair correctly matches the international organisation with its headquarters?","hi":"निम्नलिखित में से कौन-सा युग्म अंतरराष्ट्रीय संगठन और उसके मुख्यालय का सही मिलान है?"},"a":{"en":"UNEP – Nairobi; WMO – Geneva","hi":"UNEP – नैरोबी; WMO – जिनेवा"},"o":[{"en":"UNEP – Nairobi; WMO – Geneva","hi":"UNEP – नैरोबी; WMO – जिनेवा"},{"en":"UNEP – Geneva; WMO – Nairobi","hi":"UNEP – जिनेवा; WMO – नैरोबी"},{"en":"UNEP – New York; WMO – Paris","hi":"UNEP – न्यूयॉर्क; WMO – पेरिस"},{"en":"UNEP – Amsterdam; WMO – Rome","hi":"UNEP – एम्स्टर्डम; WMO – रोम"}],"exp":{"en":"UNEP is headquartered in Nairobi, Kenya (one of the major UN bodies in Africa), WMO is headquartered in Geneva, Switzerland, and the main UN Headquarters is in New York.","hi":"UNEP का मुख्यालय नैरोबी, केन्या में है, WMO का मुख्यालय जिनेवा, स्विट्ज़रलैंड में है, जबकि मुख्य संयुक्त राष्ट्र मुख्यालय न्यूयॉर्क में स्थित है।"}},{"q":{"en":"How do the Chipko and Appiko movements differ despite sharing the tree-hugging method?","hi":"समान वृक्ष-आलिंगन पद्धति के बावजूद चिपको और अप्पिको आंदोलन में क्या अंतर है?"},"a":{"en":"Chipko: Uttarakhand (1970s); Appiko: Karnataka (1983)","hi":"चिपको: उत्तराखंड (1970 का दशक); अप्पिको: कर्नाटक (1983)"},"o":[{"en":"Chipko: Uttarakhand (1970s); Appiko: Karnataka (1983)","hi":"चिपको: उत्तराखंड (1970 का दशक); अप्पिको: कर्नाटक (1983)"},{"en":"Chipko: Karnataka (1983); Appiko: Uttarakhand (1970s)","hi":"चिपको: कर्नाटक (1983); अप्पिको: उत्तराखंड (1970 का दशक)"},{"en":"Both occurred in Uttarakhand in 1973","hi":"दोनों 1973 में उत्तराखंड में हुए"},{"en":"Chipko was anti-dam; Appiko was anti-mining","hi":"चिपको बाँध-विरोधी था; अप्पिको खनन-विरोधी था"}],"exp":{"en":"Chipko arose in the Garhwal Himalaya of Uttarakhand in the 1970s (Chandi Prasad Bhatt, Gaura Devi, Sunderlal Bahuguna), while Appiko began in Uttara Kannada, Karnataka in September 1983 (Pandurang Hegde).","hi":"चिपको आंदोलन 1970 के दशक में उत्तराखंड के गढ़वाल हिमालय में उभरा, जबकि अप्पिको आंदोलन सितंबर 1983 में कर्नाटक के उत्तरा कन्नड़ में (पांडुरंग हेगड़े के साथ) शुरू हुआ।"}},{"q":{"en":"Which environmental observance does NOT follow a fixed calendar date?","hi":"निम्नलिखित में से कौन-सा पर्यावरण दिवस निश्चित कैलेंडर तिथि का पालन नहीं करता?"},"a":{"en":"World Habitat Day","hi":"विश्व पर्यावास दिवस"},"o":[{"en":"World Habitat Day","hi":"विश्व पर्यावास दिवस"},{"en":"World Environment Day","hi":"विश्व पर्यावरण दिवस"},{"en":"Earth Day","hi":"पृथ्वी दिवस"},{"en":"World Wildlife Day","hi":"विश्व वन्यजीव दिवस"}],"exp":{"en":"World Habitat Day falls on the first Monday of October, so its calendar date varies every year—unlike World Wildlife Day (3 Mar), Earth Day (22 Apr), and World Environment Day (5 Jun).","hi":"विश्व पर्यावास दिवस अक्टूबर के पहले सोमवार को पड़ता है, इसलिए इसकी कैलेंडर तिथि हर वर्ष बदलती है—जबकि विश्व वन्यजीव दिवस (3 मार्च), पृथ्वी दिवस (22 अप्रैल) और विश्व पर्यावरण दिवस (5 जून) निश्चित तिथियों पर होते हैं।"}},{"q":{"en":"How does GEAC differ from the National Green Tribunal (NGT)?","hi":"GEAC और राष्ट्रीय हरित अधिकरण (NGT) में क्या अंतर है?"},"a":{"en":"GEAC: biosafety appraisal; NGT: environmental tribunal","hi":"GEAC: जैव-सुरक्षा आकलन; NGT: पर्यावरणीय अधिकरण"},"o":[{"en":"GEAC: biosafety appraisal; NGT: environmental tribunal","hi":"GEAC: जैव-सुरक्षा आकलन; NGT: पर्यावरणीय अधिकरण"},{"en":"Both are judicial environmental courts","hi":"दोनों न्यायिक पर्यावरणीय न्यायालय हैं"},{"en":"GEAC: pollution board; NGT: weather agency","hi":"GEAC: प्रदूषण बोर्ड; NGT: मौसम संस्था"},{"en":"NGT is a sub-committee under GEAC","hi":"NGT, GEAC की एक उप-समिति है"}],"exp":{"en":"GEAC is an administrative biosafety appraisal committee under the 1989 Rules of the Environment (Protection) Act, 1986, whereas NGT is a statutory adjudicatory tribunal established in 2010 under the NGT Act.","hi":"GEAC पर्यावरण (संरक्षण) अधिनियम, 1986 के 1989 नियमों के तहत एक प्रशासनिक जैव-सुरक्षा आकलन समिति है, जबकि NGT 2010 के NGT अधिनियम के तहत स्थापित एक वैधानिक न्यायिक अधिकरण है।"}}]}],"2. Ecosystem / पारितंत्र":[{"title":{"en":"1. Overview / Chapter Snapshot","hi":"1। अवलोकन / अध्याय स्नैपशॉट"},"questions":[{"q":{"en":"Which major topics are covered under Ecosystem?","hi":"पारितंत्र विषय के अंतर्गत किन प्रमुख विषयों का अध्ययन किया जाता है?"},"a":{"en":"Components, food chains, pyramids, niche, cycles & biomes","hi":"घटक, खाद्य शृंखला, पिरामिड, निकेत, चक्र व बायोम"},"o":[{"en":"Components, food chains, pyramids, niche, cycles & biomes","hi":"घटक, खाद्य शृंखला, पिरामिड, निकेत, चक्र व बायोम"},{"en":"Constitutional articles, writs, tribunals, bills, budgets & taxes","hi":"संवैधानिक अनुच्छेद, रिट, अधिकरण, विधेयक, बजट व कर"},{"en":"Ocean tides, currents, salinity, trenches, waves & coral reefs","hi":"समुद्री ज्वार, धाराएँ, लवणता, गर्त, तरंगें व प्रवाल भित्तियाँ"},{"en":"Ancient settlements, irrigation canals, crops, tools, trade & coins","hi":"प्राचीन बस्तियाँ, सिंचाई नहरें, फसलें, औज़ार, व्यापार व सिक्के"}],"exp":{"en":"This chapter studies natural relationships between the environment and biotic communities: ecosystem components and types, food chains and trophic levels, ecological pyramids, ecological niche, ecological imbalance, biogeochemical cycles, and biomes.","hi":"इस अध्याय में पर्यावरण और जैविक समुदाय के बीच प्राकृतिक संबंधों का अध्ययन किया जाता है: पारितंत्र के घटक व प्रकार, खाद्य शृंखला व पोषी स्तर, पारिस्थितिक पिरामिड, पारिस्थितिक निकेत, पारिस्थितिक असंतुलन, जैव-भूरासायनिक चक्र और बायोम।"}},{"q":{"en":"When was the term 'Ecology' coined?","hi":"'इकोलॉजी' (पारिस्थितिकी) शब्द कब गढ़ा गया था?"},"a":{"en":"In 1869.","hi":"1869 में।"},"o":[{"en":"In 1869.","hi":"1869 में।"},{"en":"In 1935.","hi":"1935 में।"},{"en":"In 1927.","hi":"1927 में।"},{"en":"In 1950.","hi":"1950 में।"}],"exp":{"en":"Key fact: In 1869.","hi":"मुख्य तथ्य: 1869 में।"}},{"q":{"en":"When was the term 'Ecosystem' coined?","hi":"'इकोसिस्टम' (पारितंत्र) शब्द कब गढ़ा गया था?"},"a":{"en":"In 1935.","hi":"1935 में।"},"o":[{"en":"In 1935.","hi":"1935 में।"},{"en":"In 1869.","hi":"1869 में।"},{"en":"In 1927.","hi":"1927 में।"},{"en":"In 1972.","hi":"1972 में।"}],"exp":{"en":"Key fact: In 1935.","hi":"मुख्य तथ्य: 1935 में।"}},{"q":{"en":"What is the energy transfer rate in a food chain?","hi":"खाद्य श्रृंखला (खाद्य शृंखला) में ऊर्जा हस्तांतरण दर क्या है?"},"a":{"en":"10%.","hi":"10%।"},"o":[{"en":"10%.","hi":"10%।"},{"en":"50%.","hi":"50%।"},{"en":"90%.","hi":"90%।"},{"en":"100%.","hi":"100%।"}],"exp":{"en":"Key fact: 10%.","hi":"मुख्य तथ्य: 10%।"}},{"q":{"en":"How many types of Ecological Pyramids are there?","hi":"पारिस्थितिक पिरामिड कितने प्रकार के होते हैं?"},"a":{"en":"3 types (Number, Biomass, Energy)","hi":"3 प्रकार (संख्या, बायोमास, ऊर्जा)"},"o":[{"en":"3 types (Number, Biomass, Energy)","hi":"3 प्रकार (संख्या, बायोमास, ऊर्जा)"},{"en":"2 types (Plants and Animals)","hi":"2 प्रकार (पौधे और जंतु)"},{"en":"4 types (Number, Biomass, Energy, Trophic)","hi":"4 प्रकार (संख्या, बायोमास, ऊर्जा, पोषी)"},{"en":"1 type (Energy only)","hi":"1 प्रकार (केवल ऊर्जा)"}],"exp":{"en":"There are three types of ecological pyramids: Pyramid of Number, Pyramid of Biomass, and Pyramid of Energy.","hi":"पारिस्थितिक पिरामिड तीन प्रकार के होते हैं: संख्या का पिरामिड, बायोमास का पिरामिड और ऊर्जा का पिरामिड।"}},{"q":{"en":"What is the time gap between the coining of 'Ecology' and 'Ecosystem'?","hi":"'इकोलॉजी' और 'इकोसिस्टम' शब्दों के गढ़े जाने के बीच कितने वर्ष का अंतर है?"},"a":{"en":"66 years (1869 vs 1935)","hi":"66 वर्ष (1869 बनाम 1935)"},"o":[{"en":"66 years (1869 vs 1935)","hi":"66 वर्ष (1869 बनाम 1935)"},{"en":"10 years (1925 vs 1935)","hi":"10 वर्ष (1925 बनाम 1935)"},{"en":"0 years (coined together)","hi":"0 वर्ष (एक साथ गढ़े गए)"},{"en":"100 years (1835 vs 1935)","hi":"100 वर्ष (1835 बनाम 1935)"}],"exp":{"en":"There is a gap of 66 years: 'Ecology' was coined by Ernst Haeckel in 1869, while 'Ecosystem' was coined by A.G. Tansley in 1935.","hi":"दोनों के बीच 66 वर्ष का अंतर है: 'इकोलॉजी' (पारिस्थितिकी) शब्द अर्न्स्ट हेकेल ने 1869 में और 'इकोसिस्टम' (पारितंत्र) शब्द ए.जी. टैन्सले ने 1935 में दिया।"}}]},{"title":{"en":"2. Introduction & Components","hi":"2। परिचय और घटक"},"questions":[{"q":{"en":"What is the definition of an Ecosystem?","hi":"पारितंत्र (Ecosystem) की परिभाषा क्या है?"},"a":{"en":"Interaction between biotic community and environment","hi":"जैविक समुदाय और पर्यावरण के बीच अंतःक्रिया"},"o":[{"en":"Interaction between biotic community and environment","hi":"जैविक समुदाय और पर्यावरण के बीच अंतःक्रिया"},{"en":"Study of rocks and physical landforms","hi":"चट्टानों और भौतिक भू-आकृतियों का अध्ययन"},{"en":"Closed atmospheric system without external inputs","hi":"बाहरी आदान के बिना बंद वायुमंडलीय प्रणाली"},{"en":"Long-term study of climate change","hi":"जलवायु परिवर्तन का दीर्घकालिक अध्ययन"}],"exp":{"en":"An ecosystem is a functional unit of nature representing the natural interactions between the living (biotic) community and the non-living (abiotic) environment.","hi":"पारितंत्र प्रकृति की एक कार्यात्मक इकाई है जो जीवित (जैविक) समुदाय और निर्जीव (अजैविक) पर्यावरण के बीच प्राकृतिक संबंधों व अंतःक्रियाओं को दर्शाती है।"}},{"q":{"en":"Who was the first to use the term 'Ecology'?","hi":"'इकोलॉजी' शब्द का सबसे पहले प्रयोग किसने किया था?"},"a":{"en":"Ernst Haeckel (1869 AD).","hi":"अर्नस्ट हैकेल (1869 ई.)।"},"o":[{"en":"Ernst Haeckel (1869 AD).","hi":"अर्नस्ट हैकेल (1869 ई.)।"},{"en":"A.G. Tansley (1935 AD).","hi":"ए.जी। टैन्सले (1935 ई.)।"},{"en":"Charles Elton (1927 AD).","hi":"चार्ल्स एल्टन (1927 ई.)।"},{"en":"G.E. Hutchinson (1927 AD).","hi":"जी.ई। हचिन्सन (1927 ई.)।"}],"exp":{"en":"Key fact: Ernst Haeckel (1869 AD).","hi":"मुख्य तथ्य: अर्नस्ट हैकेल (1869 ई.)।"}},{"q":{"en":"Who was the first to use the term 'Ecosystem'?","hi":"'इकोसिस्टम' शब्द का सबसे पहले प्रयोग किसने किया था?"},"a":{"en":"A.G. Tansley (1935 AD).","hi":"ए.जी। टैन्सले (1935 ई.)।"},"o":[{"en":"A.G. Tansley (1935 AD).","hi":"ए.जी। टैन्सले (1935 ई.)।"},{"en":"Ernst Haeckel (1869 AD).","hi":"अर्नस्ट हैकेल (1869 ई.)।"},{"en":"Charles Elton (1927 AD).","hi":"चार्ल्स एल्टन (1927 ई.)।"},{"en":"Lindeman.","hi":"लिंडमैन।"}],"exp":{"en":"Key fact: A.G. Tansley (1935 AD).","hi":"मुख्य तथ्य: ए.जी। टैन्सले (1935 ई.)।"}},{"q":{"en":"What are the Biotic components of an Ecosystem?","hi":"पारितंत्र के जैविक घटक क्या हैं?"},"a":{"en":"Producers, Consumers, Decomposers, Reducers","hi":"उत्पादक, उपभोक्ता, अपघटक, न्यूनीकरक"},"o":[{"en":"Producers, Consumers, Decomposers, Reducers","hi":"उत्पादक, उपभोक्ता, अपघटक, न्यूनीकरक"},{"en":"Water, air, soil, minerals","hi":"जल, वायु, मृदा, खनिज"},{"en":"Organic, Inorganic, Climatic factors","hi":"कार्बनिक, अकार्बनिक, जलवायवीय कारक"},{"en":"Solar energy and geothermal heat","hi":"सौर ऊर्जा और भूतापीय ऊष्मा"}],"exp":{"en":"Biotic components include Producers (green plants/algae), Consumers (primary, secondary, tertiary), and Decomposers/Reducers (bacteria and fungi).","hi":"जैविक घटकों में उत्पादक (हरे पौधे/शैवाल), उपभोक्ता (प्राथमिक, द्वितीयक, तृतीयक) और अपघटक/न्यूनीकरक (जीवाणु एवं कवक) शामिल हैं।"}},{"q":{"en":"What are the Abiotic components of an Ecosystem?","hi":"पारिस्थितिकी तंत्र के अजैविक (अजैविक) घटक क्या हैं?"},"a":{"en":"Organic, Inorganic, and Climatic.","hi":"कार्बनिक (कार्बनिक), अकार्बनिक (अकार्बनिक), और जलवायु (जलवायवीय)।"},"o":[{"en":"Organic, Inorganic, and Climatic.","hi":"कार्बनिक (कार्बनिक), अकार्बनिक (अकार्बनिक), और जलवायु (जलवायवीय)।"},{"en":"Producers, Consumers, Decomposers.","hi":"उत्पादक, उपभोक्ता, डीकंपोजर।"},{"en":"Animals, Plants, Microbes.","hi":"पशु, पौधे, रोगाणु।"},{"en":"Forests, Grasslands, Deserts.","hi":"जंगल, घास के मैदान, रेगिस्तान।"}],"exp":{"en":"Key fact: Organic, Inorganic, and Climatic.","hi":"मुख्य तथ्य: कार्बनिक (कार्बनिक), अकार्बनिक (अकार्बनिक), और जलवायु (जलवायवीय)।"}},{"q":{"en":"What are the major types of Terrestrial Ecosystems?","hi":"स्थलीय पारितंत्र के प्रमुख प्रकार कौन-से हैं?"},"a":{"en":"Forest, Grassland, and Desert","hi":"वन, घासभूमि और मरुस्थल"},"o":[{"en":"Forest, Grassland, and Desert","hi":"वन, घासभूमि और मरुस्थल"},{"en":"Marine, River, and Lake","hi":"समुद्री, नदी और झील"},{"en":"Wetlands, Mangroves, and Estuaries","hi":"आर्द्रभूमि, मैंग्रोव और मुहाने"},{"en":"Coral reefs and deep-sea vents","hi":"प्रवाल भित्तियाँ और गहरे समुद्र"}],"exp":{"en":"Terrestrial ecosystems include Forest, Grassland, and Desert ecosystems, which together hold the highest terrestrial biomass.","hi":"स्थलीय पारितंत्रों में वन, घासभूमि और मरुस्थलीय पारितंत्र शामिल हैं, जिनमें सर्वाधिक स्थलीय बायोमास होता है।"}},{"q":{"en":"What are the types of Aquatic Ecosystems?","hi":"जलीय पारिस्थितिक तंत्र (जलीय पारितंत्र) के प्रकार क्या हैं?"},"a":{"en":"Marine (Permanent), River/Lake, and Wetlands.","hi":"समुद्री (स्थायी), नदी/झील और आर्द्रभूमि (आर्द्रभूमियाँ)।"},"o":[{"en":"Marine (Permanent), River/Lake, and Wetlands.","hi":"समुद्री (स्थायी), नदी/झील और आर्द्रभूमि (आर्द्रभूमियाँ)।"},{"en":"Forest, Grassland, and Desert.","hi":"जंगल, घास का मैदान और रेगिस्तान।"},{"en":"Producers, Consumers, and Decomposers.","hi":"निर्माता, उपभोक्ता और डीकंपोजर।"},{"en":"Organic, Inorganic, and Climatic.","hi":"जैविक, अकार्बनिक और जलवायु संबंधी।"}],"exp":{"en":"Key fact: Marine (Permanent), River/Lake, and Wetlands.","hi":"मुख्य तथ्य: समुद्री (स्थायी), नदी/झील और आर्द्रभूमि (आर्द्रभूमियाँ)।"}}]},{"title":{"en":"3. Food Chain & Trophic Levels","hi":"3। खाद्य श्रृंखला और पोषी स्तर (पोषी स्तरों)"},"questions":[{"q":{"en":"What is a Food Chain?","hi":"खाद्य शृंखला (Food Chain) क्या है?"},"a":{"en":"Energy transfer across trophic levels via feeding","hi":"पोषी स्तरों के बीच भोजन द्वारा ऊर्जा हस्तांतरण"},"o":[{"en":"Energy transfer across trophic levels via feeding","hi":"पोषी स्तरों के बीच भोजन द्वारा ऊर्जा हस्तांतरण"},{"en":"Photosynthesis by green plants using sunlight","hi":"सूर्यप्रकाश से हरे पौधों द्वारा भोजन निर्माण"},{"en":"Continuous recycling of water in nature","hi":"प्रकृति में जल का निरंतर पुनर्चक्रण"},{"en":"Physical path an animal takes daily","hi":"भोजन खोजने हेतु जंतु का दैनिक मार्ग"}],"exp":{"en":"A food chain is the linear sequence of energy transfer from one organism to another, moving from a lower trophic level (producers) to higher trophic levels (consumers).","hi":"खाद्य शृंखला एक जीव से दूसरे जीव में ऊर्जा के हस्तांतरण का क्रम है, जो निचले पोषी स्तर (उत्पादक) से उच्च पोषी स्तर (उपभोक्ता) की ओर बढ़ता है।"}},{"q":{"en":"Which law governs the 10% unidirectional energy transfer in a food chain?","hi":"खाद्य शृंखला में 10% एकदिशीय ऊर्जा हस्तांतरण किस नियम से संबंधित है?"},"a":{"en":"Lindeman's Law","hi":"लिंडमैन का नियम"},"o":[{"en":"Lindeman's Law","hi":"लिंडमैन का नियम"},{"en":"Haeckel's Law","hi":"हेकेल का नियम"},{"en":"Elton's Law","hi":"एल्टन का नियम"},{"en":"Tansley's Law","hi":"टैन्सले का नियम"}],"exp":{"en":"Lindeman's 10% Law (1942) states that only about 10% of energy is transferred from one trophic level to the next in a unidirectional flow; the remaining ~90% is lost in respiration and heat.","hi":"लिंडमैन का 10% नियम (1942) बताता है कि एक पोषी स्तर से अगले स्तर में केवल लगभग 10% ऊर्जा एकदिशीय प्रवाह में स्थानांतरित होती है; शेष लगभग 90% श्वसन और ऊष्मा में नष्ट हो जाती है।"}},{"q":{"en":"What happens to the remaining 90% of the energy in a food chain?","hi":"खाद्य श्रृंखला में शेष 90% ऊर्जा का क्या होता है?"},"a":{"en":"It is lost as heat/respiration.","hi":"यह गर्मी/श्वसन (श्वसन) के रूप में नष्ट हो जाता है।"},"o":[{"en":"It is lost as heat/respiration.","hi":"यह गर्मी/श्वसन (श्वसन) के रूप में नष्ट हो जाता है।"},{"en":"It is permanently stored in the animal's bones.","hi":"यह जानवर की हड्डियों में स्थायी रूप से जमा हो जाता है।"},{"en":"It is recycled back to the sun.","hi":"इसे पुनर्चक्रित कर सूर्य तक वापस भेज दिया जाता है।"},{"en":"It is converted directly into water.","hi":"यह सीधे पानी में परिवर्तित हो जाता है।"}],"exp":{"en":"Key fact: It is lost as heat/respiration.","hi":"मुख्य तथ्य: यह गर्मी/श्वसन (श्वसन) के रूप में नष्ट हो जाता है।"}},{"q":{"en":"How do humans act in terms of consumers?","hi":"उपभोक्ताओं के संदर्भ में मनुष्य किस प्रकार कार्य करता है?"},"a":{"en":"Both Primary and Secondary Consumers","hi":"प्राथमिक और द्वितीयक उपभोक्ता दोनों"},"o":[{"en":"Both Primary and Secondary Consumers","hi":"प्राथमिक और द्वितीयक उपभोक्ता दोनों"},{"en":"Autotrophic Producers in food chains","hi":"खाद्य शृंखला में स्वपोषी उत्पादक"},{"en":"Saprophytic Decomposers of dead matter","hi":"मृत पदार्थ के मृतोपजीवी अपघटक"},{"en":"Apex Quaternary Consumers in oceans","hi":"महासागरों में शीर्ष चतुर्थक उपभोक्ता"}],"exp":{"en":"Key fact: Like both Primary and Secondary Consumers.","hi":"मुख्य तथ्य: प्राथमिक और द्वितीयक उपभोक्ताओं दोनों की तरह।"}},{"q":{"en":"How many types of Food Chains are there and what are they?","hi":"खाद्य श्रृंखला कितने प्रकार की होती है और वे कौन-कौन सी हैं?"},"a":{"en":"2 types — Grazing and Decomposer","hi":"2 प्रकार — चराई और डीकंपोजर"},"o":[{"en":"2 types — Grazing and Decomposer","hi":"2 प्रकार — चराई और डीकंपोजर"},{"en":"3 types — Primary, Secondary and Tertiary","hi":"3 प्रकार — प्राथमिक, द्वितीयक और तृतीयक"},{"en":"2 types — Aquatic and Terrestrial","hi":"2 प्रकार — जलीय और स्थलीय"},{"en":"2 types — Linear and Cyclic","hi":"2 प्रकार — रैखिक और चक्रीय"}],"exp":{"en":"Key fact: 2 types — Grazing Food Chain and Decomposer Food Chain.","hi":"मुख्य तथ्य: 2 प्रकार - चराई खाद्य श्रृंखला (चराई खाद्य शृंखला) और डीकंपोजर खाद्य श्रृंखला।"}},{"q":{"en":"Who are the Producers in the trophic level pyramid?","hi":"पोषी स्तर पिरामिड में निर्माता (उत्पादक) कौन हैं?"},"a":{"en":"Green plants, algae, photosynthetic organisms, etc.","hi":"हरे पौधे, शैवाल, प्रकाश संश्लेषक जीव, आदि।"},"o":[{"en":"Green plants, algae, photosynthetic organisms, etc.","hi":"हरे पौधे, शैवाल, प्रकाश संश्लेषक जीव, आदि।"},{"en":"Herbivores like cows and goats.","hi":"गाय और बकरियों जैसे शाकाहारी जानवर।"},{"en":"Carnivores like lions and tigers.","hi":"शेर और बाघ जैसे मांसाहारी।"},{"en":"Bacteria and fungi.","hi":"बैक्टीरिया और कवक।"}],"exp":{"en":"Key fact: Green plants, algae, photosynthetic organisms, etc.","hi":"मुख्य तथ्य: हरे पौधे, शैवाल, प्रकाश संश्लेषक जीव, आदि।"}},{"q":{"en":"Who are Primary Consumers (Herbivores)?","hi":"प्राथमिक उपभोक्ता (शाकाहारी) कौन हैं?"},"a":{"en":"Herbivores — cow, goat, etc.","hi":"शाकाहारी - गाय, बकरी आदि।"},"o":[{"en":"Herbivores — cow, goat, etc.","hi":"शाकाहारी - गाय, बकरी आदि।"},{"en":"Green plants and algae.","hi":"हरे पौधे और शैवाल।"},{"en":"Small carnivores like snakes and cats.","hi":"छोटे मांसाहारी जानवर जैसे सांप और बिल्लियाँ।"},{"en":"Top carnivores like lions.","hi":"शेर जैसे शीर्ष मांसाहारी।"}],"exp":{"en":"Key fact: Herbivores — cow, goat, etc.","hi":"मुख्य तथ्य: शाकाहारी - गाय, बकरी आदि।"}},{"q":{"en":"Who are Secondary Consumers?","hi":"द्वितीयक उपभोक्ता कौन हैं?"},"a":{"en":"Small carnivores — snake, cat, etc.","hi":"छोटे मांसाहारी - साँप, बिल्ली आदि।"},"o":[{"en":"Small carnivores — snake, cat, etc.","hi":"छोटे मांसाहारी - साँप, बिल्ली आदि।"},{"en":"Herbivores — cow, goat, etc.","hi":"शाकाहारी - गाय, बकरी आदि।"},{"en":"Green plants and algae.","hi":"हरे पौधे और शैवाल।"},{"en":"Top carnivores — lion, tiger.","hi":"शीर्ष मांसाहारी - शेर, बाघ।"}],"exp":{"en":"Key fact: Small carnivores — snake, cat, etc.","hi":"मुख्य तथ्य: छोटे मांसाहारी - साँप, बिल्ली आदि।"}},{"q":{"en":"What do Tertiary Consumers do?","hi":"तृतीयक उपभोक्ता क्या करते हैं?"},"a":{"en":"They eat primary and secondary consumers.","hi":"वे प्राथमिक और द्वितीयक उपभोक्ताओं को खाते हैं।"},"o":[{"en":"They eat primary and secondary consumers.","hi":"वे प्राथमिक और द्वितीयक उपभोक्ताओं को खाते हैं।"},{"en":"They only eat plants.","hi":"वे केवल पौधे खाते हैं।"},{"en":"They decompose dead matter.","hi":"वे मृत पदार्थ को विघटित करते हैं।"},{"en":"They produce energy from sunlight.","hi":"वे सूर्य के प्रकाश से ऊर्जा उत्पन्न करते हैं।"}],"exp":{"en":"Key fact: They eat primary and secondary consumers.","hi":"मुख्य तथ्य: वे प्राथमिक और द्वितीयक उपभोक्ताओं को खाते हैं।"}},{"q":{"en":"Who are Quaternary Consumers?","hi":"चतुर्धातुक उपभोक्ता (चतुर्थक उपभोक्ता) कौन हैं?"},"a":{"en":"Top Carnivores — lion, tiger, vulture, etc.","hi":"शीर्ष मांसाहारी - शेर, बाघ, गिद्ध, आदि।"},"o":[{"en":"Top Carnivores — lion, tiger, vulture, etc.","hi":"शीर्ष मांसाहारी - शेर, बाघ, गिद्ध, आदि।"},{"en":"Small carnivores — snake, cat.","hi":"छोटे मांसाहारी - साँप, बिल्ली।"},{"en":"Herbivores — cow, goat.","hi":"शाकाहारी - गाय, बकरी।"},{"en":"Decomposers — bacteria, fungi.","hi":"डीकंपोजर - बैक्टीरिया, कवक।"}],"exp":{"en":"Key fact: Top Carnivores — lion, tiger, vulture, etc.","hi":"मुख्य तथ्य: शीर्ष मांसाहारी - शेर, बाघ, गिद्ध, आदि।"}},{"q":{"en":"What is a Food Web?","hi":"खाद्य जाल (Food Web) क्या है?"},"a":{"en":"Network of interconnected food chains","hi":"परस्पर जुड़ी खाद्य शृंखलाओं का जाल"},"o":[{"en":"Network of interconnected food chains","hi":"परस्पर जुड़ी खाद्य शृंखलाओं का जाल"},{"en":"Single linear chain from plant to predator","hi":"पौधे से शिकारी तक एकल रैखिक शृंखला"},{"en":"Web woven by spiders to catch prey","hi":"शिकार पकड़ने के लिए मकड़ियों का जाल"},{"en":"Database of all species in a forest","hi":"जंगल की सभी प्रजातियों का डेटाबेस"}],"exp":{"en":"A food web is a network of interconnected food chains within an ecosystem, providing alternative feeding pathways and greater ecosystem stability than a single linear chain.","hi":"खाद्य जाल किसी पारितंत्र के भीतर परस्पर जुड़ी खाद्य शृंखलाओं का नेटवर्क है, जो एकल रैखिक शृंखला की तुलना में अधिक पारिस्थितिक स्थिरता प्रदान करता है।"}},{"q":{"en":"What is Biomagnification?","hi":"जैव आवर्धन (Biomagnification) क्या है?"},"a":{"en":"Toxins concentrating at higher trophic levels","hi":"उच्च पोषी स्तरों में विषाक्त पदार्थों का संकेंद्रण"},"o":[{"en":"Toxins concentrating at higher trophic levels","hi":"उच्च पोषी स्तरों में विषाक्त पदार्थों का संकेंद्रण"},{"en":"Increase in animal size at higher levels","hi":"उच्च स्तर पर जंतुओं के आकार में वृद्धि"},{"en":"Rapid reproduction rate of soil bacteria","hi":"मृदा जीवाणुओं की तीव्र प्रजनन दर"},{"en":"Increase in plant energy via photosynthesis","hi":"प्रकाश संश्लेषण द्वारा पादप ऊर्जा में वृद्धि"}],"exp":{"en":"Biomagnification is the progressive increase in concentration of persistent toxic substances (like DDT or methylmercury) at successively higher trophic levels of a food chain.","hi":"जैव आवर्धन खाद्य शृंखला के उत्तरोत्तर उच्च पोषी स्तरों में स्थायी विषाक्त पदार्थों (जैसे DDT या मिथाइल मरकरी) की सांद्रता में क्रमिक वृद्धि की प्रक्रिया है।"}},{"q":{"en":"What are examples of Biomagnification substances?","hi":"बायोमैग्निफिकेशन पदार्थों के उदाहरण क्या हैं?"},"a":{"en":"DDT, BHC, 2-4D, Mercury, etc.","hi":"डीडीटी (DDT), बीएचसी (BHC), 2-4D, पारा (पारा), आदि।"},"o":[{"en":"DDT, BHC, 2-4D, Mercury, etc.","hi":"डीडीटी (DDT), बीएचसी (BHC), 2-4D, पारा (पारा), आदि।"},{"en":"Water, Oxygen, Carbon Dioxide.","hi":"पानी, ऑक्सीजन, कार्बन डाइऑक्साइड।"},{"en":"Glucose, Fructose, Sucrose.","hi":"ग्लूकोज, फ्रुक्टोज, सुक्रोज।"},{"en":"Calcium, Potassium, Sodium.","hi":"कैल्शियम, पोटेशियम, सोडियम।"}],"exp":{"en":"Key fact: DDT, BHC, 2-4D, Mercury, etc.","hi":"मुख्य तथ्य: डीडीटी (DDT), बीएचसी (BHC), 2-4D, पारा (पारा), आदि।"}}]},{"title":{"en":"4. Ecological Pyramid","hi":"4। पारिस्थितिक पिरामिड"},"questions":[{"q":{"en":"Who gave the concept of the Ecological Pyramid?","hi":"पारिस्थितिक पिरामिड की अवधारणा किसने दी?"},"a":{"en":"Charles Elton (1927 AD).","hi":"चार्ल्स एल्टन (1927 ई.)।"},"o":[{"en":"Charles Elton (1927 AD).","hi":"चार्ल्स एल्टन (1927 ई.)।"},{"en":"Ernst Haeckel (1869 AD).","hi":"अर्नस्ट हैकेल (1869 ई.)।"},{"en":"A.G. Tansley (1935 AD).","hi":"ए.जी। टैन्सले (1935 ई.)।"},{"en":"G.E. Hutchinson (1927 AD).","hi":"जी.ई। हचिन्सन (1927 ई.)।"}],"exp":{"en":"Key fact: Charles Elton (1927 AD).","hi":"मुख्य तथ्य: चार्ल्स एल्टन (1927 ई.)।"}},{"q":{"en":"What does an Ecological Pyramid represent?","hi":"पारिस्थितिक पिरामिड क्या दर्शाता है?"},"a":{"en":"Number, biomass, or energy across trophic levels","hi":"प्रत्येक पोषी स्तर पर संख्या, बायोमास या ऊर्जा"},"o":[{"en":"Number, biomass, or energy across trophic levels","hi":"प्रत्येक पोषी स्तर पर संख्या, बायोमास या ऊर्जा"},{"en":"Physical height of animals in a forest","hi":"जंगल में जंतुओं की भौतिक ऊँचाई"},{"en":"Average lifespan of different tree species","hi":"विभिन्न वृक्ष प्रजातियों का औसत जीवनकाल"},{"en":"Annual rainfall distribution in a biome","hi":"बायोम में वार्षिक वर्षा का वितरण"}],"exp":{"en":"An ecological pyramid graphically represents the number of organisms, total biomass, or accumulated energy of producers and consumers at each successive trophic level.","hi":"पारिस्थितिक पिरामिड प्रत्येक क्रमिक पोषी स्तर पर उत्पादकों और उपभोक्ताओं की संख्या, कुल बायोमास या संचित ऊर्जा को दर्शाता है।"}},{"q":{"en":"What is the shape of the Pyramid of Number in aquatic vs terrestrial ecosystems?","hi":"जलीय बनाम स्थलीय पारितंत्र में संख्या के पिरामिड का आकार कैसा होता है?"},"a":{"en":"Upright in Aquatic; Inverted in Terrestrial","hi":"जलीय में सीधा; स्थलीय में उल्टा"},"o":[{"en":"Upright in Aquatic; Inverted in Terrestrial","hi":"जलीय में सीधा; स्थलीय में उल्टा"},{"en":"Upright in Terrestrial; Inverted in Aquatic","hi":"स्थलीय में सीधा; जलीय में उल्टा"},{"en":"Always Upright in all ecosystems","hi":"सभी पारितंत्रों में सदैव सीधा"},{"en":"Always Inverted in all ecosystems","hi":"सभी पारितंत्रों में सदैव उल्टा"}],"exp":{"en":"The Pyramid of Number shows the count of organisms at each trophic level. In this standard exam classification, it is upright in aquatic ecosystems and can be inverted in terrestrial (e.g., tree) ecosystems.","hi":"संख्या का पिरामिड प्रत्येक पोषी स्तर पर जीवों की संख्या दर्शाता है। मानक वर्गीकरण में यह जलीय पारितंत्र में सीधा और स्थलीय (जैसे वृक्ष) पारितंत्र में उल्टा हो सकता है।"}},{"q":{"en":"What is the shape of the Pyramid of Biomass in terrestrial vs aquatic ecosystems?","hi":"स्थलीय बनाम जलीय पारितंत्र में बायोमास के पिरामिड का आकार कैसा होता है?"},"a":{"en":"Upright in Terrestrial; Inverted in Aquatic","hi":"स्थलीय में सीधा; जलीय में उल्टा"},"o":[{"en":"Upright in Terrestrial; Inverted in Aquatic","hi":"स्थलीय में सीधा; जलीय में उल्टा"},{"en":"Upright in Aquatic; Inverted in Terrestrial","hi":"जलीय में सीधा; स्थलीय में उल्टा"},{"en":"Always Upright in all ecosystems","hi":"सभी पारितंत्रों में सदैव सीधा"},{"en":"Always Inverted in all ecosystems","hi":"सभी पारितंत्रों में सदैव उल्टा"}],"exp":{"en":"The Pyramid of Biomass shows total dry weight/biomass at each trophic level: it is upright in terrestrial ecosystems and inverted in aquatic ecosystems (where phytoplankton biomass is smaller than fish/zooplankton).","hi":"बायोमास का पिरामिड प्रत्येक पोषी स्तर पर कुल बायोमास दर्शाता है: यह स्थलीय पारितंत्र में सीधा और जलीय पारितंत्र में उल्टा होता है।"}},{"q":{"en":"What is the shape of the Pyramid of Energy and why?","hi":"ऊर्जा के पिरामिड का आकार कैसा होता है और क्यों?"},"a":{"en":"Always Upright (energy decreases upward)","hi":"सदैव सीधा (ऊपर की ओर ऊर्जा घटती है)"},"o":[{"en":"Always Upright (energy decreases upward)","hi":"सदैव सीधा (ऊपर की ओर ऊर्जा घटती है)"},{"en":"Always Inverted (predators hold more energy)","hi":"सदैव उल्टा (शिकारियों में अधिक ऊर्जा)"},{"en":"Upright in Terrestrial, Inverted in Aquatic","hi":"स्थलीय में सीधा, जलीय में उल्टा"},{"en":"Upright in Aquatic, Inverted in Terrestrial","hi":"जलीय में सीधा, स्थलीय में उल्टा"}],"exp":{"en":"The Pyramid of Energy is always upright without exception because energy decreases at every higher trophic level (only ~10% is transferred per Lindeman's law).","hi":"ऊर्जा का पिरामिड बिना किसी अपवाद के सदैव सीधा होता है क्योंकि प्रत्येक उच्च पोषी स्तर पर ऊर्जा घटती जाती है (लिंडमैन के नियम से केवल ~10% ऊर्जा आगे जाती है)।"}}]},{"title":{"en":"5. Ecological Niche & Imbalance","hi":"5। पारिस्थितिक निकेश (निकेत) और असंतुलन"},"questions":[{"q":{"en":"Who gave the concept of Ecological Niche?","hi":"पारिस्थितिक निकेश (पारिस्थितिक निकेत) की अवधारणा किसने दी?"},"a":{"en":"Charles Elton (1927) and G.E. Hutchinson.","hi":"चार्ल्स एल्टन (1927) और जी.ई। हचिन्सन।"},"o":[{"en":"Charles Elton (1927) and G.E. Hutchinson.","hi":"चार्ल्स एल्टन (1927) और जी.ई। हचिन्सन।"},{"en":"Ernst Haeckel and A.G. Tansley.","hi":"अर्नस्ट हैकेल और ए.जी। टैन्सले।"},{"en":"Sunderlal Bahuguna and Medha Patkar.","hi":"सुंदरलाल बहुगुणा और मेधा पाटकर।"},{"en":"Only Charles Elton (1927).","hi":"केवल चार्ल्स एल्टन (1927)।"}],"exp":{"en":"Key fact: Charles Elton (1927) and G.E. Hutchinson.","hi":"मुख्य तथ्य: चार्ल्स एल्टन (1927) और जी.ई। हचिन्सन।"}},{"q":{"en":"What is an Ecological Niche?","hi":"पारिस्थितिक निकेत (Ecological Niche) क्या है?"},"a":{"en":"Functional role and position of a species","hi":"किसी प्रजाति की कार्यात्मक भूमिका व स्थिति"},"o":[{"en":"Functional role and position of a species","hi":"किसी प्रजाति की कार्यात्मक भूमिका व स्थिति"},{"en":"Small hole in a tree for nesting","hi":"घोंसले के लिए पेड़ में छोटा छेद"},{"en":"Total physical area an animal roams","hi":"जंतु के विचरण का कुल भौतिक क्षेत्र"},{"en":"Daily calories an organism consumes","hi":"जीव द्वारा उपभोग की गई दैनिक कैलोरी"}],"exp":{"en":"An ecological niche is the functional role and position of a species in an ecosystem, including how it uses resources and interacts with other organisms—broader than its physical habitat.","hi":"पारिस्थितिक निकेत किसी पारितंत्र में प्रजाति की कार्यात्मक भूमिका और स्थिति है, जिसमें संसाधनों का उपयोग और अन्य जीवों के साथ अंतःक्रियाएँ शामिल हैं; यह भौतिक आवास से व्यापक है।"}},{"q":{"en":"What is Ecological Imbalance?","hi":"पारिस्थितिक असंतुलन (Ecological Imbalance) क्या है?"},"a":{"en":"Disruption of species balance weakening adaptation","hi":"प्रजाति संतुलन भंग होने से अनुकूलन क्षमता घटना"},"o":[{"en":"Disruption of species balance weakening adaptation","hi":"प्रजाति संतुलन भंग होने से अनुकूलन क्षमता घटना"},{"en":"Perfect equilibrium between predator and prey","hi":"शिकारी और शिकार के बीच पूर्ण संतुलन"},{"en":"Slow natural shifting of tectonic plates","hi":"विवर्तनिक प्लेटों का धीमा प्राकृतिक खिसकाव"},{"en":"Regular daily cycle of day and night","hi":"दिन और रात का नियमित दैनिक चक्र"}],"exp":{"en":"Ecological imbalance occurs when a sharp increase or decrease in a species' population or environmental disruption weakens ecosystem stability and adaptive capacity.","hi":"पारिस्थितिक असंतुलन तब होता है जब किसी विशेष प्रजाति की जनसंख्या में तीव्र वृद्धि/कमी या पर्यावरणीय व्यवधान से उनकी अनुकूलन क्षमता और पारितंत्र संतुलन कमजोर होता है।"}},{"q":{"en":"What are examples of Ecological Imbalance?","hi":"पारिस्थितिक असंतुलन के उदाहरण क्या हैं?"},"a":{"en":"Deforestation, Cyclone, Drought.","hi":"वनों की कटाई, चक्रवात, सूखा।"},"o":[{"en":"Deforestation, Cyclone, Drought.","hi":"वनों की कटाई, चक्रवात, सूखा।"},{"en":"Photosynthesis, Respiration, Transpiration.","hi":"प्रकाश संश्लेषण, श्वसन, वाष्पोत्सर्जन।"},{"en":"Nitrogen Cycle, Carbon Cycle, Water Cycle.","hi":"नाइट्रोजन चक्र, कार्बन चक्र, जल चक्र।"},{"en":"Producers, Consumers, Decomposers.","hi":"निर्माता, उपभोक्ता, डीकंपोजर।"}],"exp":{"en":"Key fact: Deforestation, Cyclone, Drought.","hi":"मुख्य तथ्य: वनों की कटाई, चक्रवात, सूखा।"}},{"q":{"en":"Where is the highest Terrestrial productivity found?","hi":"सबसे अधिक स्थलीय उत्पादकता (स्थलीय उत्पादकता) कहाँ पाई जाती है?"},"a":{"en":"In the Tropical Rainforest.","hi":"उष्णकटिबंधीय वर्षावन में।"},"o":[{"en":"In the Tropical Rainforest.","hi":"उष्णकटिबंधीय वर्षावन में।"},{"en":"In the Desert.","hi":"रेगिस्तान में।"},{"en":"In the Tundra.","hi":"टुंड्रा में।"},{"en":"In Temperate Grasslands.","hi":"समशीतोष्ण घास के मैदानों में।"}],"exp":{"en":"Key fact: In the Tropical Rainforest.","hi":"मुख्य तथ्य: उष्णकटिबंधीय वर्षावन में।"}},{"q":{"en":"Where is the highest Aquatic productivity found?","hi":"सर्वाधिक जलीय उत्पादकता (जलीय उत्पादकता) कहाँ पाई जाती है?"},"a":{"en":"In Estuaries.","hi":"मुहाने (ज्वारनदमुख) में।"},"o":[{"en":"In Estuaries.","hi":"मुहाने (ज्वारनदमुख) में।"},{"en":"In the Deep Ocean.","hi":"गहरे समुद्र में।"},{"en":"In isolated glacial lakes.","hi":"पृथक हिमनदी झीलों में।"},{"en":"In fast-flowing mountain rivers.","hi":"पहाड़ों की तेज़ बहने वाली नदियों में।"}],"exp":{"en":"Key fact: In Estuaries.","hi":"मुख्य तथ्य: मुहाने (ज्वारनदमुख) में।"}}]},{"title":{"en":"6. Biogeochemical Cycles & Biomes","hi":"6। जैव-रासायनिक चक्र और बायोम"},"questions":[{"q":{"en":"What are Biogeochemical Cycles?","hi":"जैव-भूरासायनिक चक्र (Biogeochemical Cycles) क्या हैं?"},"a":{"en":"Movement of nutrients through ecosystem components","hi":"पारितंत्र घटकों के माध्यम से पोषक तत्वों का संचरण"},"o":[{"en":"Movement of nutrients through ecosystem components","hi":"पारितंत्र घटकों के माध्यम से पोषक तत्वों का संचरण"},{"en":"Seasonal migration patterns of large mammals","hi":"बड़े स्तनधारियों का मौसमी प्रवासन पैटर्न"},{"en":"Annual orbit of Earth around the Sun","hi":"सूर्य के चारों ओर पृथ्वी की वार्षिक परिक्रमा"},{"en":"Daily cycle of high and low tides","hi":"उच्च और निम्न ज्वार का दैनिक चक्र"}],"exp":{"en":"Biogeochemical cycles describe the cyclic movement of essential nutrients and elements (such as carbon, nitrogen, phosphorus, water) through biotic and abiotic components of the ecosystem.","hi":"जैव-भूरासायनिक चक्र पारितंत्र के जैविक और अजैविक घटकों के माध्यम से आवश्यक पोषक तत्वों (जैसे कार्बन, नाइट्रोजन, फॉस्फोरस, जल) के चक्रीय संचरण को दर्शाते हैं।"}},{"q":{"en":"Which are the Gaseous Cycles?","hi":"गैसीय चक्र (गैसीय चक्र) कौन से हैं?"},"a":{"en":"Nitrogen, Carbon, Oxygen, Water Cycles","hi":"नाइट्रोजन, कार्बन, ऑक्सीजन, जल चक्र"},"o":[{"en":"Nitrogen, Carbon, Oxygen, Water Cycles","hi":"नाइट्रोजन, कार्बन, ऑक्सीजन, जल चक्र"},{"en":"Phosphorus, Sulphur, Calcium, Iron Cycles","hi":"फास्फोरस, सल्फर, कैल्शियम, लौह चक्र"},{"en":"Rock, Tectonic, Erosion, Sediment Cycles","hi":"शैल, विवर्तनिक, अपरदन, अवसाद चक्र"},{"en":"Solar, Lunar, Tidal, Orbital Cycles","hi":"सौर, चंद्र, ज्वारीय, कक्षीय चक्र"}],"exp":{"en":"Key fact: Nitrogen Cycle, Carbon Cycle, Oxygen Cycle, Water Cycle.","hi":"मुख्य तथ्य: नाइट्रोजन चक्र, कार्बन चक्र, ऑक्सीजन चक्र, जल चक्र।"}},{"q":{"en":"Which are the Sedimentary Cycles?","hi":"तलछटी चक्र (अवसादी चक्र) कौन से हैं?"},"a":{"en":"Phosphorus Cycle, Sulphur Cycle.","hi":"फास्फोरस चक्र, सल्फर चक्र।"},"o":[{"en":"Phosphorus Cycle, Sulphur Cycle.","hi":"फास्फोरस चक्र, सल्फर चक्र।"},{"en":"Nitrogen Cycle, Carbon Cycle.","hi":"नाइट्रोजन चक्र, कार्बन चक्र।"},{"en":"Oxygen Cycle, Water Cycle.","hi":"ऑक्सीजन चक्र, जल चक्र।"},{"en":"Magma Cycle, Erosion Cycle.","hi":"मैग्मा चक्र, क्षरण चक्र।"}],"exp":{"en":"Key fact: Phosphorus Cycle, Sulphur Cycle.","hi":"मुख्य तथ्य: फास्फोरस चक्र, सल्फर चक्र।"}},{"q":{"en":"Which of the following are major types of Biomes?","hi":"निम्नलिखित में से बायोम (Biome) के प्रमुख प्रकार कौन-से हैं?"},"a":{"en":"Rainforest, Savanna, Mediterranean, Tundra, Taiga","hi":"वर्षावन, सवाना, भूमध्यसागरीय, टुंड्रा, टैगा"},"o":[{"en":"Rainforest, Savanna, Mediterranean, Tundra, Taiga","hi":"वर्षावन, सवाना, भूमध्यसागरीय, टुंड्रा, टैगा"},{"en":"O, A, B, and C soil horizons","hi":"O, A, B, और C मृदा क्षितिज"},{"en":"Producers, Consumers, and Decomposers","hi":"उत्पादक, उपभोक्ता और अपघटक"},{"en":"Organic, Inorganic, and Climatic factors","hi":"कार्बनिक, अकार्बनिक और जलवायवीय कारक"}],"exp":{"en":"Major biomes include Tropical Evergreen Forest, Monsoon Forest, Savanna, Mediterranean, Temperate Grassland, Temperate Coniferous Forest (Taiga), Tundra, and Marine Pelagic.","hi":"प्रमुख बायोम में उष्णकटिबंधीय सदाबहार वन, मानसून वन, सवाना, भूमध्यसागरीय, समशीतोष्ण घास के मैदान, समशीतोष्ण शंकुधारी वन (टैगा), टुंड्रा और समुद्री पेलाजिक शामिल हैं।"}}]},{"title":{"en":"7. Exam Trap Reverse-Questions","hi":"7। परीक्षा जाल - उल्टे प्रश्न"},"questions":[{"q":{"en":"Which pair correctly matches the scientist with the coined term and year?","hi":"निम्नलिखित में से कौन-सा युग्म वैज्ञानिक, शब्द और वर्ष का सही मिलान है?"},"a":{"en":"Haeckel: Ecology (1869); Tansley: Ecosystem (1935)","hi":"हेकेल: इकोलॉजी (1869); टैन्सले: इकोसिस्टम (1935)"},"o":[{"en":"Haeckel: Ecology (1869); Tansley: Ecosystem (1935)","hi":"हेकेल: इकोलॉजी (1869); टैन्सले: इकोसिस्टम (1935)"},{"en":"Tansley: Ecology (1935); Haeckel: Ecosystem (1869)","hi":"टैन्सले: इकोलॉजी (1935); हेकेल: इकोसिस्टम (1869)"},{"en":"Elton: Ecology (1927); Haeckel: Ecosystem (1927)","hi":"एल्टन: इकोलॉजी (1927); हेकेल: इकोसिस्टम (1927)"},{"en":"Odum: Ecology (1869); Tansley: Ecosystem (1950)","hi":"ओडम: इकोलॉजी (1869); टैन्सले: इकोसिस्टम (1950)"}],"exp":{"en":"Ernst Haeckel coined 'Ecology' in 1869, whereas A.G. Tansley coined 'Ecosystem' in 1935—different scientists and different decades.","hi":"अर्न्स्ट हेकेल ने 1869 में 'इकोलॉजी' (पारिस्थितिकी) और ए.जी. टैन्सले ने 1935 में 'इकोसिस्टम' (पारितंत्र) शब्द दिया—दोनों अलग वैज्ञानिक और अलग दशक हैं।"}},{"q":{"en":"Does the Pyramid of Energy ever invert in any ecosystem?","hi":"क्या किसी भी पारितंत्र में ऊर्जा का पिरामिड कभी उल्टा होता है?"},"a":{"en":"No, it is always upright","hi":"नहीं, यह सदैव सीधा होता है"},"o":[{"en":"No, it is always upright","hi":"नहीं, यह सदैव सीधा होता है"},{"en":"Yes, in aquatic ecosystems","hi":"हाँ, जलीय पारितंत्रों में"},{"en":"Yes, in terrestrial forest ecosystems","hi":"हाँ, स्थलीय वन पारितंत्रों में"},{"en":"Yes, in deep-sea hydrothermal vents","hi":"हाँ, गहरे समुद्र के वेंट में"}],"exp":{"en":"No—the Pyramid of Energy is always upright without exception because energy decreases at higher trophic levels. Only the Pyramids of Number and Biomass can be inverted.","hi":"नहीं—ऊर्जा का पिरामिड बिना किसी अपवाद के सदैव सीधा होता है क्योंकि उच्च पोषी स्तरों पर ऊर्जा घटती है। केवल संख्या और बायोमास के पिरामिड उल्टे हो सकते हैं।"}},{"q":{"en":"Under which biogeochemical category is the Water Cycle classified?","hi":"जल चक्र को किस जैव-भूरासायनिक श्रेणी में वर्गीकृत किया जाता है?"},"a":{"en":"Gaseous Cycle","hi":"गैसीय चक्र"},"o":[{"en":"Gaseous Cycle","hi":"गैसीय चक्र"},{"en":"Sedimentary Cycle","hi":"अवसादी चक्र"},{"en":"Rock Cycle","hi":"शैल चक्र"},{"en":"Biotic-only Cycle","hi":"केवल जैविक चक्र"}],"exp":{"en":"The Water Cycle is classified as a Gaseous Cycle alongside Nitrogen, Carbon, and Oxygen cycles; only Phosphorus and Sulphur are Sedimentary Cycles.","hi":"जल चक्र को नाइट्रोजन, कार्बन और ऑक्सीजन चक्रों के साथ गैसीय चक्र में वर्गीकृत किया जाता है; केवल फॉस्फोरस और सल्फर अवसादी चक्र हैं।"}},{"q":{"en":"How do the originators of Ecological Niche and Ecological Pyramid differ?","hi":"पारिस्थितिक निकेत और पारिस्थितिक पिरामिड के प्रतिपादकों में क्या अंतर है?"},"a":{"en":"Niche: Elton & Hutchinson; Pyramid: Elton alone","hi":"निकेत: एल्टन व हचिन्सन; पिरामिड: केवल एल्टन"},"o":[{"en":"Niche: Elton & Hutchinson; Pyramid: Elton alone","hi":"निकेत: एल्टन व हचिन्सन; पिरामिड: केवल एल्टन"},{"en":"Niche: Haeckel; Pyramid: Tansley","hi":"निकेत: हेकेल; पिरामिड: टैन्सले"},{"en":"Niche: Elton alone; Pyramid: Elton & Hutchinson","hi":"निकेत: केवल एल्टन; पिरामिड: एल्टन व हचिन्सन"},{"en":"Both were given by Tansley in 1935","hi":"दोनों 1935 में टैन्सले द्वारा दिए गए"}],"exp":{"en":"The Ecological Niche concept is associated with Charles Elton (1927) and G.E. Hutchinson, whereas the Ecological Pyramid concept was given by Charles Elton alone (1927).","hi":"पारिस्थितिक निकेत की अवधारणा चार्ल्स एल्टन (1927) और जी.ई. हचिन्सन से जुड़ी है, जबकि पारिस्थितिक पिरामिड की अवधारणा केवल चार्ल्स एल्टन (1927) ने दी थी।"}},{"q":{"en":"Which pair correctly contrasts Number and Biomass pyramids across ecosystems?","hi":"कौन-सा युग्म पारितंत्रों में संख्या और बायोमास पिरामिड के सही विपरीत पैटर्न को दर्शाता है?"},"a":{"en":"Number: Aq-Up/Terr-Inv; Biomass: Terr-Up/Aq-Inv","hi":"संख्या: जलीय-सीधा/स्थलीय-उल्टा; बायोमास: स्थलीय-सीधा/जलीय-उल्टा"},"o":[{"en":"Number: Aq-Up/Terr-Inv; Biomass: Terr-Up/Aq-Inv","hi":"संख्या: जलीय-सीधा/स्थलीय-उल्टा; बायोमास: स्थलीय-सीधा/जलीय-उल्टा"},{"en":"Number: Terr-Up/Aq-Inv; Biomass: Aq-Up/Terr-Inv","hi":"संख्या: स्थलीय-सीधा/जलीय-उल्टा; बायोमास: जलीय-सीधा/स्थलीय-उल्टा"},{"en":"Both are always Upright everywhere","hi":"दोनों हर जगह सदैव सीधे होते हैं"},{"en":"Both are always Inverted everywhere","hi":"दोनों हर जगह सदैव उल्टे होते हैं"}],"exp":{"en":"They show opposite patterns: Pyramid of Number is Upright in Aquatic and Inverted in Terrestrial (tree) ecosystems, whereas Pyramid of Biomass is Upright in Terrestrial and Inverted in Aquatic ecosystems.","hi":"दोनों के पैटर्न विपरीत हैं: संख्या का पिरामिड जलीय में सीधा और स्थलीय में उल्टा होता है, जबकि बायोमास का पिरामिड स्थलीय में सीधा और जलीय में उल्टा होता है।"}}]}],"3. Biodiversity / जैव विविधता":[{"title":{"en":"1. Overview / Chapter Snapshot","hi":"1। अवलोकन / अध्याय स्नैपशॉट"},"questions":[{"q":{"en":"Which major topics are covered under Biodiversity?","hi":"जैव विविधता विषय के अंतर्गत किन प्रमुख विषयों का अध्ययन किया जाता है?"},"a":{"en":"Levels, hotspots, conservation, IUCN Red List & Ramsar sites","hi":"स्तर, हॉटस्पॉट, संरक्षण, IUCN लाल सूची व रामसर स्थल"},"o":[{"en":"Levels, hotspots, conservation, IUCN Red List & Ramsar sites","hi":"स्तर, हॉटस्पॉट, संरक्षण, IUCN लाल सूची व रामसर स्थल"},{"en":"Forest types, timber yield, silviculture, logging & wood trade","hi":"वन प्रकार, लकड़ी उत्पादन, वन संवर्धन, कटाई व काष्ठ व्यापार"},{"en":"Colon
