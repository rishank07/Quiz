cuses on resilient infrastructure, sustainable industrialization and innovation.","hi":"उद्योग, नवाचार और अवसंरचना (उद्योग, नवाचार एवं अवसंरचना)। यह लचीला अवसंरचना, सतत औद्योगीकरण और नवाचार पर केंद्रित है।"}},{"q":{"en":"What is SDG 10?","hi":"SDG 10 क्या है?"},"a":{"en":"Reduced Inequalities.","hi":"असमानताओं में कमी (असमानताओं में कमी)।"},"o":[{"en":"Reduced Inequalities.","hi":"असमानताओं में कमी (असमानताओं में कमी)।"},{"en":"Gender Equality.","hi":"लैंगिक समानता।"},{"en":"No Poverty.","hi":"शून्य गरीबी।"},{"en":"Peace, Justice and Strong Institutions.","hi":"शांति, न्याय और मजबूत संस्थाएँ।"}],"exp":{"en":"Reduced Inequalities. It aims to reduce inequality within countries and among countries.","hi":"असमानताओं में कमी (असमानताओं में कमी)। यह देश के भीतर और देश के बीच असमानता कम करने पर केंद्रित है।"}},{"q":{"en":"What is SDG 11?","hi":"SDG 11 क्या है?"},"a":{"en":"Sustainable Cities and Communities.","hi":"सतत शहर और समुदाय (सतत शहर एवं समुदाय)।"},"o":[{"en":"Sustainable Cities and Communities.","hi":"सतत शहर और समुदाय (सतत शहर एवं समुदाय)।"},{"en":"Responsible Consumption and Production.","hi":"जिम्मेदार खपत और उत्पादन।"},{"en":"Decent Work and Economic Growth.","hi":"सम्मानजनक कार्य और आर्थिक वृद्धि।"},{"en":"Life on Land.","hi":"भूमि पर जीवन।"}],"exp":{"en":"Sustainable Cities and Communities. It seeks inclusive, safe, resilient and sustainable cities and human settlements.","hi":"सतत शहर और समुदाय (सतत शहर एवं समुदाय)। यह समावेशी, सुरक्षित, लचीला और सतत शहर/मानवीय बस्तियों पर केंद्रित है।"}},{"q":{"en":"What is SDG 12?","hi":"SDG 12 क्या है?"},"a":{"en":"Responsible Consumption and Production.","hi":"उत्तरदायी उपभोग एवं उत्पादन।"},"o":[{"en":"Responsible Consumption and Production.","hi":"उत्तरदायी उपभोग एवं उत्पादन।"},{"en":"Climate Action.","hi":"जलवायु कार्रवाई।"},{"en":"Industry, Innovation and Infrastructure.","hi":"उद्योग, नवाचार और अवसंरचना।"},{"en":"Clean Water and Sanitation.","hi":"स्वच्छ जल और स्वच्छता।"}],"exp":{"en":"Responsible Consumption and Production. It promotes sustainable consumption and production patterns.","hi":"उत्तरदायी उपभोग एवं उत्पादन। यह सतत उपभोग और उत्पादन प्रतिरूप को बढ़ावा करता है।"}},{"q":{"en":"What is SDG 13?","hi":"SDG 13 क्या है?"},"a":{"en":"Climate Action.","hi":"जलवायु कार्रवाई।"},"o":[{"en":"Climate Action.","hi":"जलवायु कार्रवाई।"},{"en":"Life Below Water.","hi":"जल के नीचे जीवन।"},{"en":"Life on Land.","hi":"भूमि पर जीवन।"},{"en":"Affordable and Clean Energy.","hi":"सस्ती और स्वच्छ ऊर्जा।"}],"exp":{"en":"Climate Action. It calls for urgent action to combat climate change and its impacts.","hi":"जलवायु कार्रवाई। यह जलवायु परिवर्तन और उसके प्रभाव के खिलाफ तात्कालिक कार्रवाई पर केंद्रित है।"}},{"q":{"en":"What is SDG 14?","hi":"SDG 14 क्या है?"},"a":{"en":"Life Below Water.","hi":"जल के नीचे जीवन (जल के नीचे जीवन)।"},"o":[{"en":"Life Below Water.","hi":"जल के नीचे जीवन (जल के नीचे जीवन)।"},{"en":"Life on Land.","hi":"भूमि पर जीवन।"},{"en":"Clean Water and Sanitation.","hi":"स्वच्छ जल और स्वच्छता।"},{"en":"Climate Action.","hi":"जलवायु कार्रवाई।"}],"exp":{"en":"Life Below Water. It focuses on conserving and sustainably using oceans, seas and marine resources.","hi":"जल के नीचे जीवन (जल के नीचे जीवन)। यह महासागर, समुद्र और समुद्री संसाधनों के संरक्षण तथा सतत उपयोग पर केंद्रित है।"}},{"q":{"en":"What is SDG 15?","hi":"SDG 15 क्या है?"},"a":{"en":"Life on Land.","hi":"भूमि पर जीवन (स्थल पर जीवन)।"},"o":[{"en":"Life on Land.","hi":"भूमि पर जीवन (स्थल पर जीवन)।"},{"en":"Life Below Water.","hi":"जल के नीचे जीवन।"},{"en":"Sustainable Cities and Communities.","hi":"सतत शहर और समुदाय।"},{"en":"Zero Hunger.","hi":"शून्य भुखमरी।"}],"exp":{"en":"Life on Land. It covers terrestrial ecosystems, forests, desertification, land degradation and biodiversity loss.","hi":"भूमि पर जीवन (स्थल पर जीवन)। यह स्थलीय पारितंत्र, वन, मरुस्थलीकरण, भूमि क्षरण और जैव विविधता हानि को समाहित करता है।"}},{"q":{"en":"What is SDG 16?","hi":"SDG 16 क्या है?"},"a":{"en":"Peace, Justice and Strong Institutions.","hi":"शांति, न्याय और मजबूत संस्थाएँ (शांति, न्याय एवं सुदृढ़ संस्थाएँ)।"},"o":[{"en":"Peace, Justice and Strong Institutions.","hi":"शांति, न्याय और मजबूत संस्थाएँ (शांति, न्याय एवं सुदृढ़ संस्थाएँ)।"},{"en":"Partnerships for the Goals.","hi":"लक्ष्यों के लिए भागीदारी।"},{"en":"Reduced Inequalities.","hi":"असमानताओं में कमी।"},{"en":"Quality Education.","hi":"गुणवत्तापूर्ण शिक्षा।"}],"exp":{"en":"Peace, Justice and Strong Institutions. It promotes peaceful and inclusive societies, access to justice and effective, accountable institutions.","hi":"शांति, न्याय और मजबूत संस्थाएँ (शांति, न्याय एवं सुदृढ़ संस्थाएँ)। यह शांतिपूर्ण/समावेशी समाजों, न्याय तक पहुँच और प्रभावी एवं उत्तरदायी संस्थाओं पर केंद्रित है।"}},{"q":{"en":"What is SDG 17?","hi":"SDG 17 क्या है?"},"a":{"en":"Partnerships for the Goals.","hi":"लक्ष्यों के लिए भागीदारी (लक्ष्यों हेतु भागीदारी)।"},"o":[{"en":"Partnerships for the Goals.","hi":"लक्ष्यों के लिए भागीदारी (लक्ष्यों हेतु भागीदारी)।"},{"en":"Peace, Justice and Strong Institutions.","hi":"शांति, न्याय और मजबूत संस्थाएँ।"},{"en":"Responsible Consumption and Production.","hi":"जिम्मेदार खपत और उत्पादन।"},{"en":"Industry, Innovation and Infrastructure.","hi":"उद्योग, नवाचार और अवसंरचना।"}],"exp":{"en":"Partnerships for the Goals. It strengthens means of implementation and the global partnership for sustainable development.","hi":"लक्ष्यों के लिए भागीदारी (लक्ष्यों हेतु भागीदारी)। यह क्रियान्वयन के साधन और सतत विकास हेतु वैश्विक भागीदारी को सुदृढ़ करता है।"}},{"q":{"en":"Why are SDG 14 and SDG 15 often studied together in ecology?","hi":"पारिस्थितिकी में SDG 14 और SDG 15 का एक साथ अध्ययन क्यों किया जाता है?"},"a":{"en":"SDG 14: marine ecosystems; SDG 15: land ecosystems","hi":"SDG 14: समुद्री पारितंत्र; SDG 15: स्थलीय पारितंत्र"},"o":[{"en":"SDG 14: marine ecosystems; SDG 15: land ecosystems","hi":"SDG 14: समुद्री पारितंत्र; SDG 15: स्थलीय पारितंत्र"},{"en":"Both deal exclusively with atmospheric climate","hi":"दोनों केवल वायुमंडलीय जलवायु से संबंधित हैं"},{"en":"Both are official sub-goals of SDG 13","hi":"दोनों SDG 13 के आधिकारिक उप-लक्ष्य हैं"},{"en":"Both focus only on sustainable cities","hi":"दोनों केवल सतत शहरों पर केंद्रित हैं"}],"exp":{"en":"SDG 14 and SDG 15 form a useful ecosystem-related pair, although this is not an official UN category. SDG 14 addresses marine ecosystems and resources, while SDG 15 addresses terrestrial ecosystems and biodiversity.","hi":"SDG 14 और SDG 15 को पारितंत्र-संबंधी उपयोगी युग्म के रूप में समझा जा सकता है, यद्यपि यह संयुक्त राष्ट्र की आधिकारिक श्रेणी नहीं है। SDG 14 समुद्री पारितंत्र एवं संसाधनों से, जबकि SDG 15 स्थलीय पारितंत्र एवं जैव विविधता से संबंधित है।"}}]},{"title":{"en":"5. Common Confusions & Reverse Questions","hi":"5। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"When were the SDGs formally adopted, and when did they come into effect?","hi":"SDGs औपचारिक रूप से कब अपनाया गया हुए और कब प्रभावी हुए?"},"a":{"en":"Adopted on 25 September 2015; effective from 1 January 2016.","hi":"25 सितंबर 2015 को अपनाया गया; 1 जनवरी 2016 से प्रभावी।"},"o":[{"en":"Adopted on 25 September 2015; effective from 1 January 2016.","hi":"25 सितंबर 2015 को अपनाया गया; 1 जनवरी 2016 से प्रभावी।"},{"en":"Adopted in 2016; effective from 2017.","hi":"2016 में अपनाया गया; 2017 से प्रभावी।"},{"en":"Adopted and effective on the same day in 2015.","hi":"2015 में समान दिन अपनाया गया और प्रभावी।"},{"en":"Adopted in 1992; effective from 2015.","hi":"1992 में अपनाया गया; 2015 से प्रभावी।"}],"exp":{"en":"Adoption and entry into effect are separate milestones: formal adoption was on 25 September 2015, while implementation under the new Goals began on 1 January 2016.","hi":"अंगीकरण और प्रभावी होना अलग प्रमुख पड़ाव हैं: औपचारिक अंगीकरण 25 सितंबर 2015 को हुआ, जबकि नया लक्ष्य के अंतर्गत क्रियान्वयन 1 जनवरी 2016 से शुरू हुआ।"}},{"q":{"en":"What are SDG 14 and SDG 15, and how do their domains differ?","hi":"SDG 14 और SDG 15 क्या हैं तथा उनके कार्यक्षेत्र कैसे भिन्न हैं?"},"a":{"en":"SDG 14: Life Below Water; SDG 15: Life on Land","hi":"SDG 14: जल के नीचे जीवन; SDG 15: स्थल पर जीवन"},"o":[{"en":"SDG 14: Life Below Water; SDG 15: Life on Land","hi":"SDG 14: जल के नीचे जीवन; SDG 15: स्थल पर जीवन"},{"en":"SDG 14: Life on Land; SDG 15: Life Below Water","hi":"SDG 14: स्थल पर जीवन; SDG 15: जल के नीचे जीवन"},{"en":"SDG 14: Clean Water; SDG 15: Climate Action","hi":"SDG 14: स्वच्छ जल; SDG 15: जलवायु कार्रवाई"},{"en":"SDG 14: Climate Action; SDG 15: Clean Energy","hi":"SDG 14: जलवायु कार्रवाई; SDG 15: स्वच्छ ऊर्जा"}],"exp":{"en":"SDG 14 is marine-focused and SDG 15 is land-focused. Both contribute to biodiversity and ecosystem conservation but cover different environmental domains.","hi":"SDG 14 समुद्री-केंद्रित और SDG 15 भूमि-केंद्रित है। दोनों जैव विविधता और पारितंत्र संरक्षण में योगदान करते हैं, लेकिन पर्यावरणीय क्षेत्रों अलग हैं।"}},{"q":{"en":"What is the official implementation period of the SDGs?","hi":"SDGs के कार्यान्वयन की आधिकारिक अवधि क्या है?"},"a":{"en":"1 January 2016 to 2030","hi":"1 जनवरी 2016 से 2030"},"o":[{"en":"1 January 2016 to 2030","hi":"1 जनवरी 2016 से 2030"},{"en":"2015 to 2050","hi":"2015 से 2050"},{"en":"2016 to 1 January 2030 only","hi":"2016 से ठीक 1 जनवरी 2030"},{"en":"2000 to 2015","hi":"2000 से 2015"}],"exp":{"en":"The Goals came into effect in 2016 and the Agenda runs toward the 2030 horizon. The period is commonly described as the 2016–2030 implementation era.","hi":"लक्ष्य 2016 से प्रभावी हुए और एजेंडा का लक्ष्य-अवधि 2030 है। इस अवधि को सामान्यतः 2016-2030 क्रियान्वयन अवधि के रूप में देखा जाता है।"}}]}],"8. Disaster Management / आपदा प्रबंधन":[{"title":{"en":"1. Overview / Chapter Snapshot","hi":"1। अवलोकन / अध्याय स्नैपशॉट"},"questions":[{"q":{"en":"Which major topics are covered under Disaster Management?","hi":"आपदा प्रबंधन विषय के अंतर्गत किन प्रमुख विषयों का अध्ययन किया जाता है?"},"a":{"en":"Natural & technological disasters and DM Act framework","hi":"प्राकृतिक व प्रौद्योगिकीय आपदाएँ और आपदा प्रबंधन ढाँचा"},"o":[{"en":"Natural & technological disasters and DM Act framework","hi":"प्राकृतिक व प्रौद्योगिकीय आपदाएँ और आपदा प्रबंधन ढाँचा"},{"en":"Earth's crust, mantle, core layers & plate tectonics","hi":"पृथ्वी की पपड़ी, मेंटल, क्रोड व प्लेट विवर्तनिकी"},{"en":"Global nuclear weapon treaties, disarmament & arms control","hi":"वैश्विक परमाणु हथियार संधियाँ, निरस्त्रीकरण व शस्त्र नियंत्रण"},{"en":"Seawater salinity, ocean currents, tides & coral reefs","hi":"समुद्री जल लवणता, महासागरीय धाराएँ, ज्वार व प्रवाल भित्तियाँ"}],"exp":{"en":"Major natural and human-induced/technological disasters — earthquake, tsunami, landslide, flood, drought and cyclone — together with India's disaster-management framework; cloudbursts, the Bhopal gas disaster and the Chernobyl nuclear accident are also covered. The chapter combines hazard science with risk reduction, preparedness, response and India's statutory disaster-management institutions.","hi":"प्रमुख प्राकृतिक और मानवजनित/प्रौद्योगिकीय आपदाएँ - भूकंप, सुनामी, भूस्खलन, बाढ़, सूखा और चक्रवात - के साथ भारत का आपदा-प्रबंधन ढाँचा; बादल फटना, भोपाल गैस त्रासदी और चेरनोबिल परमाणु दुर्घटना भी समाहित हैं। अध्याय आपदा-विज्ञान को जोखिम कमी, तैयारी, प्रतिक्रिया और भारत के वैधानिक आपदा-प्रबंधन संस्थाओं से जोड़ता है।"}},{"q":{"en":"How many Earthquake Zones are there in India?","hi":"भारत में कितने भूकंप क्षेत्र (भूकंप क्षेत्र) हैं?"},"a":{"en":"4 seismic zones — Zones II, III, IV and V.","hi":"4 भूकंपीय क्षेत्र - क्षेत्र II, III, IV और V।"},"o":[{"en":"4 seismic zones — Zones II, III, IV and V.","hi":"4 भूकंपीय क्षेत्र - क्षेत्र II, III, IV और V।"},{"en":"5 seismic zones — Zones I to V.","hi":"5 भूकंपीय क्षेत्र - क्षेत्र I से V।"},{"en":"3 seismic zones — Low, Medium and High only.","hi":"3 भूकंपीय क्षेत्र - केवल निम्न, मध्यम और उच्च।"},{"en":"6 seismic zones — Zones I to VI.","hi":"6 भूकंपीय क्षेत्र - क्षेत्र I से VI।"}],"exp":{"en":"4 seismic zones — Zones II, III, IV and V. India's seismic zoning uses Zones II to V; Zone I is not part of the current four-zone scheme. Zone V carries the highest zone factor.","hi":"4 भूकंपीय क्षेत्र - क्षेत्र II, III, IV और V। भारत की भूकंपीय क्षेत्रीकरण क्षेत्र II से V तक है; वर्तमान चार-क्षेत्र योजना में क्षेत्र I नहीं है। क्षेत्र V का क्षेत्र कारक सर्वाधिक है।"}},{"q":{"en":"When was India's Disaster Management Act enacted and later amended?","hi":"भारत का आपदा प्रबंधन अधिनियम कब अधिनियमित और बाद में संशोधित हुआ?"},"a":{"en":"Enacted 2005; amended in 2025","hi":"2005 में अधिनियमित; 2025 में संशोधित"},"o":[{"en":"Enacted 2005; amended in 2025","hi":"2005 में अधिनियमित; 2025 में संशोधित"},{"en":"Enacted 1999; never amended","hi":"1999 में अधिनियमित; कोई संशोधन नहीं"},{"en":"Enacted 2010 after NGT creation","hi":"2010 में NGT स्थापना के बाद"},{"en":"Enacted 2001 after Gujarat earthquake","hi":"2001 में गुजरात भूकंप के तुरंत बाद"}],"exp":{"en":"2005; the Act was later substantially amended by the Disaster Management (Amendment) Act, 2025. The principal central law remains the Disaster Management Act, 2005, but its institutional framework was significantly updated by the 2025 amendment.","hi":"2005; बाद में आपदा प्रबंधन (संशोधन) अधिनियम, 2025 द्वारा अधिनियम में व्यापक संशोधन किए गए। मुख्य केंद्रीय कानून आपदा प्रबंधन अधिनियम, 2005 है, लेकिन संस्थागत ढाँचे को 2025 संशोधन ने व्यापक रूप से अद्यतन किया।"}},{"q":{"en":"When did the Indian Tsunami Early Warning System (INCOIS) become operational?","hi":"भारतीय सुनामी पूर्व चेतावनी प्रणाली (INCOIS) कब कार्यशील हुई?"},"a":{"en":"October 2007","hi":"अक्टूबर 2007"},"o":[{"en":"October 2007","hi":"अक्टूबर 2007"},{"en":"December 2004","hi":"दिसंबर 2004"},{"en":"December 2005","hi":"दिसंबर 2005"},{"en":"October 2010","hi":"अक्टूबर 2010"}],"exp":{"en":"2007 — the full-fledged Indian Tsunami Early Warning System at INCOIS became operational in October 2007. India established the full-fledged 24×7 tsunami warning system at INCOIS after the 2004 Indian Ocean tsunami; it became operational in October 2007.","hi":"2007 - INCOIS का पूर्ण विकसित भारतीय सुनामी पूर्व चेतावनी प्रणाली अक्टूबर 2007 में कार्यशील हुई। 2004 हिंद महासागर सुनामी के बाद भारत ने INCOIS में पूर्ण विकसित 24×7 सुनामी चेतावनी प्रणाली स्थापित की, जो अक्टूबर 2007 में कार्यशील हुआ।"}},{"q":{"en":"When did the Bhopal Gas Tragedy happen?","hi":"भोपाल गैस त्रासदी कब हुई थी?"},"a":{"en":"Night of 2–3 December 1984","hi":"2–3 दिसंबर 1984 की रात"},"o":[{"en":"Night of 2–3 December 1984","hi":"2–3 दिसंबर 1984 की रात"},{"en":"Night of 2–3 December 1986","hi":"2–3 दिसंबर 1986 की रात"},{"en":"Night of 4–5 November 1990","hi":"4–5 नवंबर 1990 की रात"},{"en":"Night of 10–11 October 1978","hi":"10–11 अक्टूबर 1978 की रात"}],"exp":{"en":"Night of 2–3 December 1984 in Bhopal. The toxic release occurred overnight at the Union Carbide plant and is therefore accurately dated to the night of 2–3 December 1984.","hi":"2-3 दिसंबर 1984 की रात, भोपाल में। विषाक्त गैस का रिसाव यूनियन कार्बाइड संयंत्र में रात के समय हुआ; इसलिए सटीक तिथि 2-3 दिसंबर 1984 की रात है।"}},{"q":{"en":"What core three-tier authority structure did the Disaster Management Act, 2005 establish?","hi":"आपदा प्रबंधन अधिनियम, 2005 ने कौन-सी तीन-स्तरीय प्राधिकरण संरचना स्थापित की?"},"a":{"en":"NDMA, SDMAs, and DDMAs","hi":"NDMA, SDMAs और DDMAs"},"o":[{"en":"NDMA, SDMAs, and DDMAs","hi":"NDMA, SDMAs और DDMAs"},{"en":"Single central authority with no State bodies","hi":"बिना राज्य निकाय के एकल केंद्रीय प्राधिकरण"},{"en":"State and District bodies with no national body","hi":"बिना राष्ट्रीय निकाय के केवल राज्य व जिला निकाय"},{"en":"Independent non-governmental network only","hi":"केवल स्वतंत्र गैर-सरकारी नेटवर्क"}],"exp":{"en":"National Disaster Management Authority (NDMA), State Disaster Management Authorities (SDMAs) and District Disaster Management Authorities (DDMAs); the Act also provides for NIDM and NDRF, and the 2025 amendment added further institutions/provisions. NDMA operates at national level, SDMAs at State level and DDMAs at district level; the Act also contains institutional provisions for training and response forces.","hi":"राष्ट्रीय आपदा प्रबंधन प्राधिकरण (NDMA), राज्य आपदा प्रबंधन प्राधिकरण (SDMAs) और जिला आपदा प्रबंधन प्राधिकरण (DDMAs); अधिनियम NIDM और NDRF का भी प्रावधान करता है, और 2025 संशोधन ने अतिरिक्त संस्थाएँ और प्रावधान जोड़े। NDMA राष्ट्रीय स्तर, SDMAs राज्य स्तर और DDMAs जिला स्तर पर संचालित होते हैं; अधिनियम प्रशिक्षण और प्रतिक्रिया बल के संस्थागत प्रावधान भी रखता है।"}}]},{"title":{"en":"2. Earthquake","hi":"2। भूकंप (भूकंप)"},"questions":[{"q":{"en":"What is an earthquake?","hi":"भूकंप क्या है?"},"a":{"en":"Sudden ground shaking from fault energy release","hi":"भ्रंश ऊर्जा विमोचन से अचानक भूमि-कंपन"},"o":[{"en":"Sudden ground shaking from fault energy release","hi":"भ्रंश ऊर्जा विमोचन से अचानक भूमि-कंपन"},{"en":"Sudden explosion of gases in upper atmosphere","hi":"ऊपरी वायुमंडल में गैसों का अचानक विस्फोट"},{"en":"Rapid melting of glaciers without ground slip","hi":"भूमि खिसके बिना हिमनदों का तीव्र पिघलना"},{"en":"Long-term shift in ocean-current direction","hi":"समुद्री धाराओं की दिशा में दीर्घकालिक बदलाव"}],"exp":{"en":"Sudden shaking of the ground caused by the rapid release of stored elastic energy in the Earth, most commonly when rocks slip along a fault. The shaking is produced by seismic waves released when accumulated stress causes sudden movement, usually on a geological fault.","hi":"पृथ्वी में संचित प्रत्यास्थ ऊर्जा के तीव्र विमोचन से होने वाली अचानक भूमि-कंपन, सर्वाधिक सामान्यतः जब शैल भ्रंश के सहारे खिसकती हैं। कंपन भूकंपीय तरंगों से होता है, जब संचित तनाव अचानक गतिशीलता उत्पन्न होती है, सामान्यतः भूवैज्ञानिक भ्रंश पर।"}},{"q":{"en":"What are the main causes of earthquakes?","hi":"भूकंप के मुख्य कारण क्या हैं?"},"a":{"en":"Tectonic fault slip; also volcanic/induced seismicity","hi":"विवर्तनिक भ्रंश फिसलन; ज्वालामुखीय/मानवजनित कारण भी"},"o":[{"en":"Tectonic fault slip; also volcanic/induced seismicity","hi":"विवर्तनिक भ्रंश फिसलन; ज्वालामुखीय/मानवजनित कारण भी"},{"en":"Earth's daily rotation around its axis","hi":"अपनी धुरी पर पृथ्वी का दैनिक घूर्णन"},{"en":"Heavy monsoon rainfall alone","hi":"केवल भारी मानसूनी वर्षा"},{"en":"Meteorite impacts exclusively","hi":"केवल उल्कापिंडों का टकराना"}],"exp":{"en":"Most result from sudden slip on tectonic faults; volcanic activity and some human-induced processes such as reservoir loading, mining or fluid injection can also trigger seismicity. Plate motion loads faults with stress; sudden fault rupture is the dominant natural mechanism. Volcanic and induced seismicity are real but much less common.","hi":"अधिकांश भूकंप विवर्तनिक भ्रंशों पर अचानक फिसलन से होते हैं; ज्वालामुखीय गतिविधि और कुछ मानवजनित प्रक्रियाएँ जैसे जलाशय भार, खनन या द्रव अंत:क्षेपण भी भूकंपीयता उत्पन्न कर सकते हैं। प्लेट गति भ्रंशों पर तनाव भार करती है; अचानक भ्रंश टूटना प्रमुख प्राकृतिक तंत्र है। ज्वालामुखीय और जनित भूकंपीयता वास्तविक हैं लेकिन अधिक कम सामान्य।"}}]},{"title":{"en":"3. Tsunami & Landslide","hi":"3। सुनामी (सुनामी) और भूस्खलन (भूस्खलन)"},"questions":[{"q":{"en":"Where does the word 'Tsunami' come from?","hi":"'सुनामी' शब्द कहाँ से आया है?"},"a":{"en":"It is a Japanese word.","hi":"यह एक जापानी शब्द है।"},"o":[{"en":"It is a Japanese word.","hi":"यह एक जापानी शब्द है।"},{"en":"It is an Indonesian word.","hi":"यह एक इंडोनेशियाई शब्द है।"},{"en":"It is a Hawaiian word.","hi":"यह एक हवाईयन शब्द है।"},{"en":"It is a Greek word.","hi":"यह एक ग्रीक शब्द है।"}],"exp":{"en":"It is a Japanese word. The Japanese term is commonly translated as 'harbour wave'; a tsunami is not a tide and should not be called a tidal wave.","hi":"यह एक जापानी शब्द है। जापानी शब्द सामान्यतः 'बंदरगाह तरंग' रूपांतरित होता है; सुनामी ज्वार नहीं है, इसलिए इसे ज्वारीय तरंग कहना तकनीकी रूप से सही नहीं।"}},{"q":{"en":"What are the primary causes of a Tsunami?","hi":"सुनामी के प्रमुख कारण क्या हैं?"},"a":{"en":"Undersea earthquakes; also submarine landslides/volcanoes","hi":"समुद्रतलीय भूकंप; समुद्रतलीय भूस्खलन/ज्वालामुखी भी"},"o":[{"en":"Undersea earthquakes; also submarine landslides/volcanoes","hi":"समुद्रतलीय भूकंप; समुद्रतलीय भूस्खलन/ज्वालामुखी भी"},{"en":"High winds and ordinary ocean tides","hi":"तेज हवाएँ और सामान्य समुद्री ज्वार"},{"en":"Gravitational pull of the Moon alone","hi":"केवल चंद्रमा का गुरुत्वाकर्षण खिंचाव"},{"en":"Heavy rainfall over open ocean","hi":"खुले महासागर के ऊपर भारी वर्षा"}],"exp":{"en":"Most tsunamis are generated by sudden displacement of seawater during large undersea or near-coast earthquakes; volcanic activity and submarine/coastal landslides can also generate them. A tsunami requires rapid displacement of a large water mass. Large shallow undersea earthquakes are the most common source, while landslides and volcanic processes can also displace water suddenly.","hi":"अधिकांश सुनामी बड़ा समुद्रतलीय या के निकट-तट भूकंप से समुद्री जल के अचानक विस्थापन द्वारा उत्पन्न होते हैं; ज्वालामुखीय गतिविधि और समुद्रतलीय/तटीय भूस्खलन भी सुनामी उत्पन्न कर सकते हैं। सुनामी के लिए बड़ा जल द्रव्यमान का तीव्र विस्थापन चाहिए। बड़ा उथला समुद्रतलीय भूकंप अधिकांश सामान्य स्रोत हैं, जबकि भूस्खलन और ज्वालामुखीय प्रक्रियाएँ भी जल को अचानक विस्थापित कर सकते हैं।"}},{"q":{"en":"What are major impacts of a tsunami?","hi":"सुनामी के प्रमुख प्रभाव क्या हैं?"},"a":{"en":"Coastal inundation, erosion, salinisation, infrastructure loss","hi":"तटीय जलप्लावन, अपरदन, लवणीकरण, अवसंरचना क्षति"},"o":[{"en":"Coastal inundation, erosion, salinisation, infrastructure loss","hi":"तटीय जलप्लावन, अपरदन, लवणीकरण, अवसंरचना क्षति"},{"en":"Permanent cooling of global oceans","hi":"वैश्विक महासागरों का स्थायी शीतलन"},{"en":"Formation of new volcanic islands","hi":"नए ज्वालामुखीय द्वीपों का निर्माण"},{"en":"Continuous inland earthquakes for years","hi":"वर्षों तक निरंतर अंतर्देशीय भूकंप"}],"exp":{"en":"Coastal inundation and strong currents can cause deaths, infrastructure destruction, erosion, salinisation and contamination of land and water, and severe damage to coastal ecosystems. Damage is caused by inundation, high-velocity currents, debris impact and repeated waves; saltwater intrusion and contamination can persist after the water recedes.","hi":"तटीय जलप्लावन और तीव्र धाराएँ एवं अवसंरचना-विनाश, अपरदन, भूमि/जल लवणीकरण-संदूषण और तटीय पारितंत्र को गंभीर क्षति पहुँचा सकती हैं। क्षति जलप्लावन, उच्च-वेग धाराओं, मलबा प्रभाव और बार-बार आने वाली तरंगों से होती है; जल के पीछे हटने के बाद भी खारे जल का प्रवेश और संदूषण बने रह सकते हैं।"}},{"q":{"en":"Which measures are key for tsunami risk reduction in India?","hi":"भारत में सुनामी जोखिम कम करने के लिए कौन-से उपाय प्रमुख हैं?"},"a":{"en":"INCOIS early warning, evacuation, shelters, coastal buffers","hi":"INCOIS पूर्व चेतावनी, निकासी, आश्रय-स्थल, तटीय पट्टियाँ"},"o":[{"en":"INCOIS early warning, evacuation, shelters, coastal buffers","hi":"INCOIS पूर्व चेतावनी, निकासी, आश्रय-स्थल, तटीय पट्टियाँ"},{"en":"Permanent evacuation of all coastal cities","hi":"सभी तटीय शहरों को स्थायी रूप से खाली करना"},{"en":"Building inland dams to stop river flow","hi":"नदी प्रवाह रोकने हेतु अंतर्देशीय बाँध बनाना"},{"en":"Reversing ocean currents with turbines","hi":"टरबाइन से समुद्री धाराओं को उलटना"}],"exp":{"en":"24×7 early warning through ITEWS/INCOIS, rapid alert dissemination, evacuation routes and drills, coastal hazard mapping/land-use planning, resilient shelters, and natural or engineered coastal buffers where suitable. Early warning has value only when alerts reach people quickly and communities know evacuation routes and safe locations; structural or ecological buffers are supplementary measures.","hi":"ITEWS/INCOIS के माध्यम से 24×7 पूर्व चेतावनी, तीव्र चेतावनी प्रसार, निकासी मार्ग और अभ्यास, तटीय संकट मानचित्रण/भूमि-उपयोग नियोजन, लचीला आश्रय-स्थल तथा उपयुक्त स्थानों पर प्राकृतिक या अभियांत्रिक तटीय सुरक्षात्मक पट्टियाँ। पूर्व चेतावनी तभी उपयोगी है जब चेतावनियाँ जल्दी लोगों तक पहुँचें और समुदाय निकासी मार्ग/सुरक्षित स्थानों जानती हों; संरचनात्मक या पारिस्थितिक सुरक्षात्मक पट्टियाँ पूरक उपाय हैं।"}},{"q":{"en":"What is a landslide?","hi":"भूस्खलन (Landslide) क्या है?"},"a":{"en":"Downslope movement of rock, soil, or debris","hi":"गुरुत्वाकर्षण से शैल, मृदा या मलबे का नीचे खिसकना"},"o":[{"en":"Downslope movement of rock, soil, or debris","hi":"गुरुत्वाकर्षण से शैल, मृदा या मलबे का नीचे खिसकना"},{"en":"Sudden sinking of flat ground into sinkholes","hi":"समतल भूमि का अचानक धँसान-गर्त में धँसना"},{"en":"Horizontal tectonic plate drift without failure","hi":"ढाल विफलता के बिना क्षैतिज प्लेट गति"},{"en":"Vertical rise of magma to Earth's surface","hi":"पृथ्वी की सतह पर मैग्मा का ऊर्ध्वाधर उठना"}],"exp":{"en":"Downslope movement of rock, soil or debris under the influence of gravity. Landslides include rockfalls, slides and debris/earth movements; the common feature is gravity-driven downslope movement.","hi":"गुरुत्वाकर्षण के प्रभाव में शैल, मृदा या मलबा का ढाल की ओर नीचे खिसकना। भूस्खलन में शैल-पतन, भूस्खलन और मलबा/पृथ्वी आंदोलन शामिल हैं; सामान्य विशेषता गुरुत्वाकर्षण-संचालित ढाल की ओर नीचे खिसकना है।"}},{"q":{"en":"What are common triggers and contributing factors for landslides?","hi":"भूस्खलन के सामान्य कारण और योगदानकारी कारक क्या हैं?"},"a":{"en":"Intense rain, earthquakes, steep slopes, slope cutting","hi":"तीव्र वर्षा, भूकंप, तीव्र ढाल, असुरक्षित ढाल कटान"},"o":[{"en":"Intense rain, earthquakes, steep slopes, slope cutting","hi":"तीव्र वर्षा, भूकंप, तीव्र ढाल, असुरक्षित ढाल कटान"},{"en":"High surface winds, dust storms, desert tornadoes","hi":"तेज सतही पवनें, धूल भरी आँधियाँ, मरुस्थलीय बवंडर"},{"en":"Intense solar radiation, summer heatwaves, dry air","hi":"तीव्र सौर विकिरण, ग्रीष्मकालीन लू, शुष्क हवा"},{"en":"Ocean salinity shifts, coral bleaching, sea-level rise","hi":"समुद्री लवणता बदलाव, प्रवाल विरंजन, समुद्र-स्तर वृद्धि"}],"exp":{"en":"Intense/prolonged rainfall, earthquakes, snowmelt or freeze-thaw, weak geology and steep slopes; slope cutting, poor drainage, deforestation, mining and construction can increase susceptibility. Landslides usually reflect a combination of slope susceptibility and a trigger such as intense rain or earthquake; human slope modification can greatly increase risk.","hi":"तीव्र/लंबे समय की वर्षा, भूकंप, हिम-पिघलाव या हिमन-गलन, कमजोर भूगर्भीय संरचना और तीव्र ढाल; ढाल कटान, खराब जल-निकासी, वनोन्मूलन, खनन और निर्माण संवेदनशीलता बढ़ा सकते हैं। भूस्खलन सामान्यतः ढाल संवेदनशीलता और तीव्र वर्षा/भूकंप जैसे कारकों के संयोजन से होते हैं; मानवीय ढाल परिवर्तन जोखिम काफी बढ़ा सकता है।"}},{"q":{"en":"What are the major effects of a Landslide?","hi":"भूस्खलन के प्रमुख प्रभाव क्या हैं?"},"a":{"en":"Casualties, road/utility damage, river blockage floods","hi":"जनहानि, सड़क/सुविधा क्षति, नदी अवरोध से बाढ़"},"o":[{"en":"Casualties, road/utility damage, river blockage floods","hi":"जनहानि, सड़क/सुविधा क्षति, नदी अवरोध से बाढ़"},{"en":"Increase in soil fertility and crop yields","hi":"मृदा उर्वरता और फसल उपज में वृद्धि"},{"en":"Creation of new stratospheric ozone holes","hi":"नए समतापमंडलीय ओजोन छिद्रों का निर्माण"},{"en":"Immediate lowering of global temperatures","hi":"वैश्विक तापमान में तत्काल गिरावट"}],"exp":{"en":"Loss of life and property, damage to roads/buildings and utilities, blockage of rivers that can create secondary flooding, and loss of soil/vegetation and access routes. River blockage by a landslide can create temporary lakes and later outburst flooding, so impacts may extend beyond the failed slope itself.","hi":"जीवन एवं संपत्ति की हानि, सड़कें/भवनों/जनोपयोगी सेवाओं क्षति, नदियों का अवरोध जिससे द्वितीयक जलभराव हो सकती है, तथा मृदा/वनस्पति और पहुँच मार्ग का हानि। भूस्खलन नदी अवरुद्ध करके अस्थायी झील स्थापित कर सकता है और बाद में विस्फोट जलभराव हो सकती है; प्रभाव विफल ढाल से परे भी जा सकते हैं।"}},{"q":{"en":"Which measures help reduce landslide risk?","hi":"भूस्खलन जोखिम को कम करने में कौन-से उपाय सहायक हैं?"},"a":{"en":"Hazard zonation, drainage, slope stabilisation, vegetation","hi":"संकट क्षेत्रीकरण, जल-निकासी, ढाल स्थिरीकरण, वनस्पति"},"o":[{"en":"Hazard zonation, drainage, slope stabilisation, vegetation","hi":"संकट क्षेत्रीकरण, जल-निकासी, ढाल स्थिरीकरण, वनस्पति"},{"en":"Deforestation and unplanned road cutting","hi":"वनोन्मूलन और अनियोजित सड़क कटान"},{"en":"Indiscriminate blasting of unstable slopes","hi":"अस्थिर ढालों पर अंधाधुंध विस्फोट"},{"en":"Blocking natural drainage channels on slopes","hi":"ढालों पर प्राकृतिक जल-निकासी मार्ग रोकना"}],"exp":{"en":"Hazard zonation and land-use control, effective surface/subsurface drainage, slope stabilisation and retaining structures, vegetation where suitable, and regulation of unsafe slope cutting, quarrying and construction. No single measure works everywhere; engineering stabilisation, drainage, vegetation and land-use controls must be selected according to geology and slope conditions.","hi":"संकट क्षेत्रीकरण और भूमि-उपयोग नियंत्रण, प्रभावी सतही/भूमिगत जल-निकासी, ढाल स्थिरीकरण और अवरोधक संरचनाएँ, उपयुक्त वनस्पति तथा असुरक्षित ढाल कटान, उत्खनन और निर्माण का विनियमन। सभी स्थानों के लिए एक समान माप नहीं होता; अभियांत्रिकी स्थिरीकरण, जल-निकासी, वनस्पति और भूमि-उपयोग नियंत्रण भूगर्भीय संरचना एवं ढाल की स्थितियों के अनुसार चुने जाते हैं।"}}]},{"title":{"en":"4. Flood & Drought","hi":"4। बाढ़ और सूखा"},"questions":[{"q":{"en":"What is a flood?","hi":"बाढ़ (Flood) क्या है?"},"a":{"en":"Overflow/accumulation inundating normally dry land","hi":"जल का अतिप्रवाह जिससे सूखी भूमि जलमग्न हो जाए"},"o":[{"en":"Overflow/accumulation inundating normally dry land","hi":"जल का अतिप्रवाह जिससे सूखी भूमि जलमग्न हो जाए"},{"en":"Complete seasonal drying of a river","hi":"नदी का पूर्ण रूप से सूख जाना"},{"en":"Freezing of freshwater lake surfaces","hi":"मीठे पानी की झील की सतह का जमना"},{"en":"Normal daily recession of ocean tides","hi":"समुद्री ज्वार का सामान्य दैनिक पीछे हटना"}],"exp":{"en":"Overflow or accumulation of water that inundates land which is normally dry, often when rivers, drainage systems or coasts cannot contain or discharge the water. Flooding can arise from river overflow, intense local rainfall, poor drainage, coastal surge or failure/release of water-control structures.","hi":"जल का अतिप्रवाह या संचय है, जिससे सामान्यतः सूखी भूमि जलमग्न हो जाए, प्रायः जब नदियाँ, जल-निकासी प्रणालियाँ या तटबंध जल को रोक/निकाल नहीं कर पाते। जलभराव नदी अतिप्रवाह, तीव्र स्थानीय वर्षा, खराब जल-निकासी, तटीय उभार या जल-नियंत्रण संरचनाओं की विफलता या उनसे जल छोड़े जाने से हो सकती है।"}},{"q":{"en":"What are major causes or aggravating factors of floods?","hi":"बाढ़ के प्रमुख कारण या बढ़ाने वाले कारक क्या हैं?"},"a":{"en":"Intense rain, siltation, poor drainage, dam/GLOF bursts","hi":"तीव्र वर्षा, गाद, खराब जल-निकासी, बाँध/हिमानी विस्फोट"},"o":[{"en":"Intense rain, siltation, poor drainage, dam/GLOF bursts","hi":"तीव्र वर्षा, गाद, खराब जल-निकासी, बाँध/हिमानी विस्फोट"},{"en":"Earthquakes and volcanic eruptions only","hi":"केवल भूकंप और ज्वालामुखी विस्फोट"},{"en":"Low rainfall and high evaporation","hi":"कम वर्षा और उच्च वाष्पीकरण"},{"en":"Excessive tree planting along riverbanks","hi":"नदी तटों पर अत्यधिक वृक्षारोपण"}],"exp":{"en":"Intense or prolonged rainfall, inadequate river/drainage capacity, river-bank erosion and siltation, landslide or ice blockage, snowmelt/glacial outburst, storm surge/tidal effects, dam failure or sudden releases, and encroachment or poor drainage. Flood risk is shaped by both the water-producing event and the ability of channels, drainage systems and floodplains to carry or store that water.","hi":"तीव्र/लंबे समय की वर्षा, अपर्याप्त नदी/जल-निकासी क्षमता, नदी-तट अपरदन और गाद जमना, भूस्खलन/हिम अवरोध, हिम-पिघलाव/हिमानी झील विस्फोट, तूफानी ज्वार/ज्वारीय प्रभाव, बाँध विफलता/अचानक मुक्त करता है तथा अतिक्रमण या खराब जल-निकासी। बाढ़ जोखिम जल-उत्पन्न घटना के साथ मार्गों, जल-निकासी प्रणालियाँ और बाढ़-मैदानों की जल ले जाना/संग्रह क्षमता पर भी निर्भर करता है।"}},{"q":{"en":"What are the major effects of a Flood?","hi":"बाढ़ के प्रमुख प्रभाव क्या हैं?"},"a":{"en":"Displacement, crop/asset loss, water contamination, disease","hi":"विस्थापन, फसल/संपत्ति हानि, जल संदूषण, रोग जोखिम"},"o":[{"en":"Displacement, crop/asset loss, water contamination, disease","hi":"विस्थापन, फसल/संपत्ति हानि, जल संदूषण, रोग जोखिम"},{"en":"Immediate crop improvement everywhere","hi":"हर जगह फसल उपज में तत्काल सुधार"},{"en":"Elimination of all insect pests","hi":"सभी कीट-पतंगों का पूर्ण खात्मा"},{"en":"Automatic purification of groundwater","hi":"भूजल का स्वतः शुद्धिकरण"}],"exp":{"en":"Deaths and displacement, damage to homes, crops, livestock and infrastructure, erosion and sediment deposition, contamination of drinking-water sources, water-borne disease risk, and major economic/ecological losses. Flood impacts are not uniformly harmful or beneficial; severe floods can destroy assets and contaminate water even though some floodplains may receive fresh sediment.","hi":"मृत्यु/विस्थापन, घरों-फसलें-पशुधन-अवसंरचना क्षति, अपरदन और अवसाद निक्षेपण, पेय-जल संदूषण, जलजनित रोग जोखिम तथा प्रमुख आर्थिक/पारिस्थितिक हानियाँ। बाढ़ प्रभाव समान रूप से हानिकारक या लाभकारी नहीं होते; गंभीर बाढ़ संपत्तियाँ नष्ट और जल संदूषित कर सकते हैं, यद्यपि कुछ बाढ़-मैदानों नया अवसाद प्राप्त कर सकते हैं।"}},{"q":{"en":"Which measures are used for flood-risk management?","hi":"बाढ़-जोखिम प्रबंधन के लिए कौन-से उपाय उपयोग किए जाते हैं?"},"a":{"en":"Forecasting, floodplain zoning, drainage, embankments","hi":"पूर्वानुमान, बाढ़-मैदान क्षेत्रीकरण, जल-निकासी, तटबंध"},"o":[{"en":"Forecasting, floodplain zoning, drainage, embankments","hi":"पूर्वानुमान, बाढ़-मैदान क्षेत्रीकरण, जल-निकासी, तटबंध"},{"en":"Filling river channels with concrete","hi":"नदी मार्गों को कंक्रीट से भरना"},{"en":"Removing all dams regardless of context","hi":"संदर्भ के बिना सभी बाँध हटाना"},{"en":"Encouraging settlements in active floodplains","hi":"सक्रिय बाढ़-मैदानों में बस्तियाँ बसाना"}],"exp":{"en":"Flood forecasting and early warning, floodplain zoning and land-use regulation, improved drainage and watershed management, resilient infrastructure and evacuation planning, plus embankments, reservoirs or diversion works where technically appropriate. Modern flood management combines structural works with non-structural measures such as forecasting, zoning, preparedness and resilient land-use planning.","hi":"बाढ़ पूर्वानुमान और पूर्व चेतावनी, बाढ़-मैदान क्षेत्रीकरण/भूमि-उपयोग विनियमन, बेहतर जल-निकासी और जलग्रहण प्रबंधन, लचीला अवसंरचना तथा निकासी नियोजन के साथ तकनीकी रूप से उपयुक्त स्थानों पर तटबंध, जलाशय या मार्ग-परिवर्तन जैसे उपाय। आधुनिक बाढ़ प्रबंधन संरचनात्मक उपायों को पूर्वानुमान, क्षेत्रीकरण, तैयारी और लचीला भूमि-उपयोग नियोजन जैसे गैर-संरचनात्मक उपाय के साथ संयोजित करता है।"}},{"q":{"en":"How is drought commonly classified in disaster-management literature?","hi":"आपदा-प्रबंधन साहित्य में सूखे को सामान्यतः किन श्रेणियों में वर्गीकृत किया जाता है?"},"a":{"en":"Meteorological, hydrological, agricultural, socio-economic","hi":"मौसम-वैज्ञानिक, जलवैज्ञानिक, कृषि, सामाजिक-आर्थिक"},"o":[{"en":"Meteorological, hydrological, agricultural, socio-economic","hi":"मौसम-वैज्ञानिक, जलवैज्ञानिक, कृषि, सामाजिक-आर्थिक"},{"en":"Atmospheric disaster only; no subtypes","hi":"केवल वायुमंडलीय आपदा; कोई उप-प्रकार नहीं"},{"en":"Geological disaster exclusively","hi":"पूर्णतः भूवैज्ञानिक आपदा"},{"en":"Biological disaster exclusively","hi":"पूर्णतः जैविक आपदा"}],"exp":{"en":"Meteorological, hydrological and agricultural drought are the main physical-impact categories; socio-economic drought is also commonly recognised. 'Drought' is a broad hazard, not a single atmospheric label. Meteorological deficiency can propagate into soil-moisture, surface-water and socio-economic impacts.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी सूखा मुख्य भौतिक-प्रभाव श्रेणियाँ हैं; सामाजिक-आर्थिक सूखा भी सामान्यतः मान्यता प्राप्त है। 'सूखा' व्यापक संकट है, एकमात्र वायुमंडलीय नाम नहीं। मौसम-विज्ञान संबंधी कमी मृदा-नमी, सतह-जल और सामाजिक-आर्थिक प्रभाव में प्रसारित कर सकती है।"}},{"q":{"en":"What conditions cause or intensify drought?","hi":"कौन-सी स्थितियाँ सूखे का कारण बनती हैं या उसे तीव्र करती हैं?"},"a":{"en":"Prolonged rainfall deficit, high ET, depleted storage","hi":"लंबे समय की वर्षा कमी, उच्च वाष्पोत्सर्जन, कम भंडारण"},"o":[{"en":"Prolonged rainfall deficit, high ET, depleted storage","hi":"लंबे समय की वर्षा कमी, उच्च वाष्पोत्सर्जन, कम भंडारण"},{"en":"Sudden short-duration cloudbursts, flash floods, hailstorms","hi":"अचानक अल्पावधि बादल फटना, आकस्मिक बाढ़, ओलावृष्टि"},{"en":"Polar ice-cap melting, iceberg calving, sea-level rise","hi":"ध्रुवीय हिम-टोपी पिघलना, हिमशैल टूटना, समुद्र-स्तर वृद्धि"},{"en":"Deep tectonic earthquakes, volcanic ash, lava flows","hi":"गहरे विवर्तनिक भूकंप, ज्वालामुखीय राख, लावा प्रवाह"}],"exp":{"en":"Prolonged below-normal precipitation is the primary meteorological trigger; high evapotranspiration, depleted soil moisture, low reservoir/streamflow/groundwater levels and excessive water demand can intensify drought impacts. Meteorological drought often initiates the sequence, while hydrological and agricultural drought may appear later because reservoirs, groundwater and soils respond on different timescales.","hi":"लंबे समय की सामान्य से कम वर्षा प्राथमिक मौसम-विज्ञान संबंधी उत्पन्न है; उच्च वाष्पोत्सर्जन, कम मृदा नमी, निम्न जलाशय/नदी प्रवाह/भूजल स्तर और अत्यधिक जल माँग सूखा प्रभाव तीव्र कर सकते हैं। मौसम-विज्ञान संबंधी सूखा अक्सर क्रम आरंभ करता है, जबकि जलाशय, भूजल और मृदाएँ अलग समय-पैमाने पर प्रतिक्रिया करने से जलवैज्ञानिक/कृषि-संबंधी सूखा बाद में प्रकट हो सकते हैं।"}},{"q":{"en":"What are the major effects of a Drought?","hi":"सूखे के प्रमुख प्रभाव क्या हैं?"},"a":{"en":"Crop/livestock loss, water scarcity, wildfire risk, migration","hi":"फसल/पशुधन हानि, जल संकट, वनाग्नि जोखिम, प्रवासन"},"o":[{"en":"Crop/livestock loss, water scarcity, wildfire risk, migration","hi":"फसल/पशुधन हानि, जल संकट, वनाग्नि जोखिम, प्रवासन"},{"en":"Destruction of coastal cities by storm waves","hi":"तूफानी लहरों से तटीय शहरों का विनाश"},{"en":"Immediate collapse of tectonic plates","hi":"विवर्तनिक प्लेटों का तत्काल पतन"},{"en":"Sudden rise in river flood levels","hi":"नदियों के बाढ़ स्तर में अचानक वृद्धि"}],"exp":{"en":"Reduced crop and livestock productivity, water scarcity, ecosystem stress and wildfire risk, livelihood and health impacts, food insecurity, migration and wider economic losses. Drought is a slow-onset or 'creeping' disaster, so impacts accumulate across agriculture, water supply, health, ecosystems and livelihoods over time.","hi":"फसल/पशुधन उत्पादकता कमी, जल-संकट, पारितंत्र तनाव और वनाग्नि जोखिम, आजीविका/स्वास्थ्य प्रभाव, खाद्य असुरक्षा, प्रवासन और व्यापक आर्थिक हानियाँ। सूखा धीमी गति से आरंभ होने वाली या 'धीमी गति वाला' आपदा है; इसलिए प्रभाव कृषि, जल आपूर्ति, स्वास्थ्य, पारितंत्र और आजीविकाएँ में समय के साथ संचित होते हैं।"}},{"q":{"en":"When was the Desert Development Programme (DDP) launched?","hi":"मरुस्थल विकास कार्यक्रम (DDP) कब शुरू हुआ?"},"a":{"en":"1977–78","hi":"1977–78"},"o":[{"en":"1977–78","hi":"1977–78"},{"en":"1990–91","hi":"1990–91"},{"en":"1985–86","hi":"1985–86"},{"en":"2005–06","hi":"2005–06"}],"exp":{"en":"1977–78. DDP is a historical centrally sponsored programme launched in 1977–78 to address hot and cold desert areas through resource conservation and development.","hi":"1977-78। DDP ऐतिहासिक केंद्र प्रायोजित कार्यक्रम है, 1977-78 में गर्म और शीत मरुस्थल क्षेत्रों में संसाधन संरक्षण/विकास के लिए शुरू हुआ।"}},{"q":{"en":"When was the National Watershed Development Project for Rainfed Areas (NWDPRA) launched?","hi":"वर्षा-आधारित क्षेत्रों के लिए राष्ट्रीय जलग्रहण विकास परियोजना (NWDPRA) कब शुरू हुआ?"},"a":{"en":"1990–91","hi":"1990–91"},"o":[{"en":"1990–91","hi":"1990–91"},{"en":"1977–78","hi":"1977–78"},{"en":"1982–83","hi":"1982–83"},{"en":"2000–01","hi":"2000–01"}],"exp":{"en":"1990–91. NWDPRA was launched in 1990–91 using integrated watershed management and sustainable farming concepts; it was later subsumed under Macro Management of Agriculture from 2000–01.","hi":"1990-91। NWDPRA 1990-91 में एकीकृत जलग्रहण प्रबंधन और सतत कृषि अवधारणाओं पर शुरू हुआ; 2000-01 से बाद में व्यापक प्रबंधन का कृषि में समाहित किया गया।"}}]},{"title":{"en":"5. Cyclone & Disaster Management","hi":"5। चक्रवात एवं आपदा प्रबंधन"},"questions":[{"q":{"en":"What is a cyclone?","hi":"चक्रवात (Cyclone) क्या है?"},"a":{"en":"Low-pressure system with rotating winds around centre","hi":"केंद्र के चारों ओर घूमती पवनों वाली निम्न-दाब प्रणाली"},"o":[{"en":"Low-pressure system with rotating winds around centre","hi":"केंद्र के चारों ओर घूमती पवनों वाली निम्न-दाब प्रणाली"},{"en":"High-pressure centre with descending air at poles","hi":"ध्रुवों पर नीचे उतरती हवा वाला उच्च-दाब केंद्र"},{"en":"Narrow tornado funnel formed over dry land","hi":"शुष्क भूमि पर बनने वाली संकीर्ण बवंडर कीप"},{"en":"Sudden nocturnal temperature drop in arid deserts","hi":"शुष्क मरुस्थलों में रात के समय अचानक तापमान गिरावट"}],"exp":{"en":"A large-scale low-pressure weather system with winds rotating around its centre; cyclones include tropical and extratropical systems. In the North Indian Ocean, IMD calls a tropical system a 'cyclonic storm' from 34-knot sustained winds. A cyclone is defined by organised cyclonic circulation around low pressure. IMD intensity classes over the North Indian Ocean use maximum sustained wind speed.","hi":"एक बड़ा-पैमाना निम्न-दाब मौसम प्रणाली जिसमें पवन केंद्र के आसपास घूमती हैं; चक्रवात उष्णकटिबंधीय और बहिरुष्णकटिबंधीय दोनों हो सकते हैं। उत्तरी हिंद महासागर में IMD 34-नॉट निरंतर पवन से उष्णकटिबंधीय प्रणाली को 'चक्रवाती तूफान' वर्गीकृत करता है। चक्रवात व्यवस्थित चक्रवाती परिसंचरण के आसपास निम्न दाब से परिभाषित होता है। उत्तरी हिंद महासागर में IMD तीव्रता श्रेणियाँ अधिकतम निरंतर पवन वेग का उपयोग करती हैं।"}},{"q":{"en":"What are the major hazards produced by a tropical cyclone?","hi":"उष्णकटिबंधीय चक्रवात से उत्पन्न प्रमुख खतरे कौन-से हैं?"},"a":{"en":"Destructive winds, heavy rain, floods, storm surge","hi":"विनाशकारी पवन, भारी वर्षा, बाढ़, तूफानी ज्वार"},"o":[{"en":"Destructive winds, heavy rain, floods, storm surge","hi":"विनाशकारी पवन, भारी वर्षा, बाढ़, तूफानी ज्वार"},{"en":"Multi-year meteorological drought, crop failure, dust storms","hi":"बहु-वर्षीय मौसम सूखा, फसल विफलता, धूल आँधियाँ"},{"en":"Deep tectonic earthquakes, fault ruptures, volcanic eruptions","hi":"गहरे विवर्तनिक भूकंप, भ्रंश विदर, ज्वालामुखीय विस्फोट"},{"en":"Stratospheric ozone depletion, UV radiation, polar vortex","hi":"समतापमंडलीय ओजोन क्षय, पराबैंगनी विकिरण, ध्रुवीय भँवर"}],"exp":{"en":"Destructive winds, very heavy rainfall and inland flooding, storm surge and coastal inundation, high waves, infrastructure damage and cascading power/communication failures. Storm surge is often the most dangerous coastal component, while rainfall flooding and destructive winds can extend far inland.","hi":"विनाशकारी पवन, अत्यधिक भारी वर्षा और अंतर्देशीय जलभराव, तूफानी ज्वार और तटीय जलप्लावन, उच्च तरंगें, अवसंरचना क्षति तथा क्रमिक विद्युत/संचार विफलताएँ। तूफानी ज्वार अक्सर सबसे खतरनाक तटीय घटक होता है, जबकि वर्षा जलभराव और विनाशकारी पवन अंतर्देशीय क्षेत्रों तक प्रभाव डाल सकते हैं।"}},{"q":{"en":"Which measures reduce tropical cyclone risk?","hi":"उष्णकटिबंधीय चक्रवात जोखिम को कौन-से उपाय कम करते हैं?"},"a":{"en":"Early warning, evacuation, shelters, mangroves, planning","hi":"पूर्व चेतावनी, निकासी, आश्रय-स्थल, मैंग्रोव, नियोजन"},"o":[{"en":"Early warning, evacuation, shelters, mangroves, planning","hi":"पूर्व चेतावनी, निकासी, आश्रय-स्थल, मैंग्रोव, नियोजन"},{"en":"Building a concrete wall across the ocean","hi":"संपूर्ण महासागर में कंक्रीट की दीवार बनाना"},{"en":"Pumping seawater out before cyclone arrival","hi":"चक्रवात से पहले समुद्री जल बाहर पंप करना"},{"en":"Covering coastlines with plastic sheets","hi":"तटरेखा को प्लास्टिक चादरों से ढकना"}],"exp":{"en":"Accurate forecasting and early warning, timely evacuation, cyclone shelters, cyclone-resistant construction and critical infrastructure, coastal-zone planning, and protection/restoration of natural buffers such as mangroves. Mangroves can reduce wave and surge energy locally, but they are not a substitute for forecasting, evacuation, shelters and resilient construction.","hi":"सटीक पूर्वानुमान और पूर्व चेतावनी, समय पर निकासी, चक्रवात आश्रय-स्थल, चक्रवात-रोधी निर्माण/महत्वपूर्ण अवसंरचना, तटीय-क्षेत्र नियोजन और मैंग्रोव जैसे प्राकृतिक सुरक्षात्मक पट्टियाँ का संरक्षण/पुनर्स्थापन। मैंग्रोव स्थानीय रूप से तरंग/उभार ऊर्जा कम कर सकते हैं, लेकिन पूर्वानुमान, निकासी, आश्रय-स्थल और आपदा-रोधी निर्माण का विकल्प नहीं हैं।"}},{"q":{"en":"What key bodies were added or strengthened by the Disaster Management (Amendment) Act, 2025?","hi":"आपदा प्रबंधन (संशोधन) अधिनियम, 2025 द्वारा कौन-से प्रमुख निकाय/प्रावधान जोड़े या सुदृढ़ किए गए?"},"a":{"en":"UDMAs, NCMC, HLC, SDRFs & National Database","hi":"UDMAs, NCMC, HLC, SDRFs व राष्ट्रीय आपदा डेटाबेस"},"o":[{"en":"UDMAs, NCMC, HLC, SDRFs & National Database","hi":"UDMAs, NCMC, HLC, SDRFs व राष्ट्रीय आपदा डेटाबेस"},{"en":"Only village-level panchayat committees","hi":"केवल ग्राम-स्तरीय पंचायत समितियाँ"},{"en":"Transferring all disaster roles to armed forces","hi":"सभी आपदा कार्य सशस्त्र बलों को सौंपना"},{"en":"Replacing NDMA with a single NGO network","hi":"NDMA को एक NGO नेटवर्क से बदलना"}],"exp":{"en":"The Disaster Management Act, 2005 created NDMA, SDMAs and DDMAs and provides for NIDM and NDRF; the Disaster Management (Amendment) Act, 2025 added or strengthened provisions including UDMAs, NCMC, HLC, State Disaster Response Forces and a National Disaster Database. The 2025 amendment updated the 2005 framework for contemporary risks, including urban disaster governance, statutory national committees, State response forces and a National Disaster Database.","hi":"आपदा प्रबंधन अधिनियम, 2005 ने NDMA, SDMAs और DDMAs स्थापित किए तथा NIDM/NDRF का प्रावधान किया; आपदा प्रबंधन (संशोधन) अधिनियम, 2025 ने UDMAs, NCMC, HLC, राज्य आपदा प्रतिक्रिया बल और राष्ट्रीय आपदा डेटाबेस जैसे प्रावधान जोड़े या सुदृढ़ किए। 2025 संशोधन ने 2005 ढाँचे को वर्तमान जोखिम के लिए अद्यतन किया, जिसमें नगरीय आपदा शासन, वैधानिक राष्ट्रीय समितियाँ, राज्य प्रतिक्रिया बल और राष्ट्रीय आपदा डेटाबेस।"}}]},{"title":{"en":"6. Other Disasters","hi":"6। अन्य आपदाएँ"},"questions":[{"q":{"en":"What is a cloudburst according to IMD criteria?","hi":"IMD मानदंडों के अनुसार बादल फटना (Cloudburst) क्या है?"},"a":{"en":"Extreme localised rainfall ≥100 mm in 1 hour","hi":"छोटे क्षेत्र में 1 घंटे में ≥100 मिमी वर्षा"},"o":[{"en":"Extreme localised rainfall ≥100 mm in 1 hour","hi":"छोटे क्षेत्र में 1 घंटे में ≥100 मिमी वर्षा"},{"en":"Physical explosion of a cloud in the sky","hi":"आकाश में बादल का भौतिक रूप से फटना"},{"en":"Heavy desert snowstorm","hi":"मरुस्थल में भारी हिम-तूफान"},{"en":"Dense winter fog entering a valley","hi":"घाटी में प्रवेश करने वाला घना कोहरा"}],"exp":{"en":"An extreme short-duration rainfall event over a small area, commonly defined by IMD research as rainfall of 100 mm or more in one hour; it can trigger flash floods and landslides, especially in hilly terrain. Cloudbursts are highly localised and short-lived; the danger comes from the rainfall intensity, which can overwhelm drainage and destabilise steep slopes.","hi":"छोटे क्षेत्र पर अत्यधिक अल्पावधि वर्षा घटना, जिसे IMD अनुसंधान में सामान्यतः 100 मिमी या अधिक वर्षा में एक घंटा के रूप में परिभाषित किया जाता है; यह विशेष रूप से पहाड़ी भूभाग में आकस्मिक बाढ़ और भूस्खलन उत्पन्न कर सकता है। बादल फटना अत्यधिक स्थानीयकृत और अल्पकालिक होते हैं; खतरा वर्षा तीव्रता से आता है, जो जल-निकासी अक्षम कर देना और तीव्र ढालों अस्थिर कर सकती है।"}},{"q":{"en":"Which toxic chemical was central to the 1984 Bhopal gas disaster?","hi":"1984 की भोपाल गैस त्रासदी में कौन-सा विषाक्त रसायन मुख्य था?"},"a":{"en":"Methyl isocyanate (MIC)","hi":"मिथाइल आइसोसाइनेट (MIC)"},"o":[{"en":"Methyl isocyanate (MIC)","hi":"मिथाइल आइसोसाइनेट (MIC)"},{"en":"Carbon monoxide (CO)","hi":"कार्बन मोनोऑक्साइड (CO)"},{"en":"Chlorine gas (Cl2)","hi":"क्लोरीन गैस (Cl2)"},{"en":"Hydrogen sulfide (H2S)","hi":"हाइड्रोजन सल्फाइड (H2S)"}],"exp":{"en":"Bhopal, Madhya Pradesh, on the night of 2–3 December 1984; methyl isocyanate (MIC) was the principal toxic chemical released. The leak occurred from a Union Carbide pesticide plant; MIC and its reaction products exposed a very large surrounding population.","hi":"भोपाल, मध्य प्रदेश में 2-3 दिसंबर 1984 की रात; मिथाइल आइसोसाइनेट (MIC) मुख्य उत्सर्जित विषाक्त रसायन था। रिसाव संघ कार्बाइड कीटनाशक पौधा से हुआ; MIC और उसके अभिक्रिया उत्पादों ने बड़ा आसपास जनसंख्या को उद्भासित किया।"}},{"q":{"en":"When and where did the Chernobyl nuclear accident occur?","hi":"चेरनोबिल परमाणु दुर्घटना कब और कहाँ हुई थी?"},"a":{"en":"26 April 1986, Chernobyl (Ukrainian SSR)","hi":"26 अप्रैल 1986, चेरनोबिल (यूक्रेनी SSR)"},"o":[{"en":"26 April 1986, Chernobyl (Ukrainian SSR)","hi":"26 अप्रैल 1986, चेरनोबिल (यूक्रेनी SSR)"},{"en":"3 December 1984, Bhopal (India)","hi":"3 दिसंबर 1984, भोपाल (भारत)"},{"en":"26 April 1986, Fukushima (Japan)","hi":"26 अप्रैल 1986, फुकुशिमा (जापान)"},{"en":"2 February 1971, Ramsar (Iran)","hi":"2 फ़रवरी 1971, रामसर (ईरान)"}],"exp":{"en":"26 April 1986 at Reactor 4 of the Chernobyl Nuclear Power Plant in the Ukrainian SSR of the Soviet Union, in present-day Ukraine. Reactor 4 was destroyed during a safety test and released large amounts of radioactive material; at the time, the site was within the Soviet Union.","hi":"26 अप्रैल 1986 को चेरनोबिल परमाणु ऊर्जा संयंत्र के रिएक्टर 4 में, तब यूक्रेनी सोवियत समाजवादी गणराज्य का सोवियत संघ, वर्तमान यूक्रेन। सुरक्षा परीक्षण के दौरान रिएक्टर 4 नष्ट हुआ और बड़े पैमाने पर रेडियोधर्मी पदार्थों का उत्सर्जन हुआ; उस समय स्थल सोवियत संघ के भीतर था।"}},{"q":{"en":"What was the elapsed time between the Bhopal disaster (3 Dec 1984) and Chernobyl (26 Apr 1986)?","hi":"भोपाल त्रासदी (3 दिसंबर 1984) और चेरनोबिल दुर्घटना (26 अप्रैल 1986) के बीच कितना समय अंतराल था?"},"a":{"en":"509 days (~1 yr 4 mo 23 days)","hi":"509 दिन (लगभग 1 वर्ष 4 माह 23 दिन)"},"o":[{"en":"509 days (~1 yr 4 mo 23 days)","hi":"509 दिन (लगभग 1 वर्ष 4 माह 23 दिन)"},{"en":"730 days (~2 yr 0 mo 0 days)","hi":"730 दिन (लगभग 2 वर्ष 0 माह 0 दिन)"},{"en":"365 days (~1 yr 0 mo 0 days)","hi":"365 दिन (लगभग 1 वर्ष 0 माह 0 दिन)"},{"en":"1,095 days (~3 yr 0 mo 0 days)","hi":"1,095 दिन (लगभग 3 वर्ष 0 माह 0 दिन)"}],"exp":{"en":"509 days — about 1 year, 4 months and 23 days; the calendar years differ by two. Calling this an 'exact two-year gap' is inaccurate because the actual elapsed interval is 509 days; only the year labels differ by two.","hi":"509 दिन - लगभग 1 वर्ष, 4 महीने और 23 दिन; कैलेंडर वर्ष दो वर्ष अलग हैं। इसे 'सटीक दो-वर्ष अंतराल' कहना असटीक है क्योंकि वास्तविक बीता अंतराल 509 दिन है; केवल वर्ष श्रेणी-नाम दो वर्ष अलग हैं।"}}]},{"title":{"en":"7. Common Confusions & Reverse Questions","hi":"7। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"Which Seismic Zone does Delhi fall into?","hi":"दिल्ली किस भूकंपीय क्षेत्र (Seismic Zone) में आती है?"},"a":{"en":"Zone IV (High damage risk)","hi":"क्षेत्र IV (उच्च क्षति जोखिम)"},"o":[{"en":"Zone IV (High damage risk)","hi":"क्षेत्र IV (उच्च क्षति जोखिम)"},{"en":"Zone II (Low damage risk)","hi":"क्षेत्र II (न्यूनतम क्षति जोखिम)"},{"en":"Zone III (Moderate damage risk)","hi":"क्षेत्र III (मध्यम क्षति जोखिम)"},{"en":"Zone V (Very high damage risk)","hi":"क्षेत्र V (अत्यधिक उच्च क्षति जोखिम)"}],"exp":{"en":"Delhi is in Seismic Zone IV, the high-damage-risk zone. Delhi's Zone IV classification is a useful reminder that seismic hazard does not follow simple plains-versus-mountains geography.","hi":"दिल्ली भूकंपीय क्षेत्र IV में है, जो उच्च-क्षति-जोखिम क्षेत्र है। दिल्ली का क्षेत्र IV वर्गीकरण बताता है कि भूकंपीय संकट सरल मैदानी बनाम पर्वतीय भौगोलिक स्थिति अनुसरण नहीं करता।"}},{"q":{"en":"Which came first: Desert Development Programme (DDP) or NWDPRA?","hi":"मरुस्थल विकास कार्यक्रम (DDP) और NWDPRA में से कौन पहले शुरू हुआ?"},"a":{"en":"DDP (1977–78) before NWDPRA (1990–91)","hi":"DDP (1977–78), NWDPRA (1990–91) से पहले"},"o":[{"en":"DDP (1977–78) before NWDPRA (1990–91)","hi":"DDP (1977–78), NWDPRA (1990–91) से पहले"},{"en":"NWDPRA (1977–78) before DDP (1990–91)","hi":"NWDPRA (1977–78), DDP (1990–91) से पहले"},{"en":"Both started in 1977–78","hi":"दोनों 1977–78 में शुरू हुए"},{"en":"Both started in 1990–91","hi":"दोनों 1990–91 में शुरू हुए"}],"exp":{"en":"The Desert Development Programme (1977–78) started before the National Watershed Development Project for Rainfed Areas (1990–91). The two programme dates are historical; DDP predates NWDPRA by roughly thirteen years.","hi":"मरुस्थल विकास कार्यक्रम (1977-78), वर्षा-आधारित क्षेत्रों के लिए राष्ट्रीय जलग्रहण विकास परियोजना (1990-91) से पहले शुरू हुआ। दोनों कार्यक्रम तिथियाँ ऐतिहासिक हैं; DDP, NWDPRA से लगभग तेरह वर्ष पहले है।"}}]},{"title":{"en":"8. Final Revision","hi":"8। अंतिम पुनरावृत्ति"},"questions":[{"q":{"en":"Which is the most severe seismic zone in India?","hi":"भारत में सबसे गंभीर भूकंप क्षेत्र कौन-सा है?"},"a":{"en":"Zone V (Very high damage risk)","hi":"क्षेत्र V (अत्यधिक उच्च क्षति जोखिम)"},"o":[{"en":"Zone V (Very high damage risk)","hi":"क्षेत्र V (अत्यधिक उच्च क्षति जोखिम)"},{"en":"Zone IV (High damage risk)","hi":"क्षेत्र IV (उच्च क्षति जोखिम)"},{"en":"Zone III (Moderate damage risk)","hi":"क्षेत्र III (मध्यम क्षति जोखिम)"},{"en":"Zone II (Low damage risk)","hi":"क्षेत्र II (न्यूनतम क्षति जोखिम)"}],"exp":{"en":"Zone V — very high damage risk. India's current seismic-zone shorthand is II–V, with risk generally increasing toward Zone V.","hi":"क्षेत्र V - अत्यधिक उच्च क्षति जोखिम। भारत का वर्तमान भूकंपीय क्षेत्रीकरण II-V है, जोखिम सामान्यतः क्षेत्र V की ओर बढ़ता है।"}}]}]}}</script>

<script>
const MASTER = JSON.parse(document.getElementById('master-data').textContent);
const SUBJECT_META = {
    'Environment & Ecology': { icon: '🌿', desc: 'Environment se Disaster Management tak — 8 Chapters', color: 'from-green-700 to-emerald-600' },
};

let state = {
    screen: 'home', // home | chapters | quiz
    subject: null,
    chapterName: null,
    quizData: null,
    currentSection: 0,
    score: { correct: 0, wrong: 0, attempted: 0 },
    shuffleMap: {},
};

function chapterQCount(sections) {
    return sections.reduce((sum, s) => sum + s.questions.length, 0);
}
function subjectQCount(subject) {
    let total = 0;
    for (const ch in MASTER[subject]) total += chapterQCount(MASTER[subject][ch]);
    return total;
}
function chapterDisplayName(fullName) {
    return fullName.replace(/^\d+\.\s*/, '');
}
function chapterNum(fullName) {
    const m = fullName.match(/^(\d+)\./);
    return m ? m[1] : '';
}

function renderHome() {
    const subjects = Object.keys(MASTER);
    return `
    <div class="max-w-5xl mx-auto px-4 pt-10 fade-in">
        <div class="text-center mb-10">
            <div class="flex items-center justify-center gap-3 mb-3">
                <div class="seal">EF</div>
                <h1 class="text-3xl md:text-4xl font-bold" style="color:var(--ink)">Environment &amp; Ecology Complete Practice</h1>
            </div>
            <p class="text-sm md:text-base" style="color:var(--deep2)">पर्यावरण एवं पारिस्थितिकी पूर्ण अभ्यास — 8 Chapters — ${Object.values(MASTER).reduce((s,c)=>s+Object.values(c).reduce((s2,sec)=>s2+chapterQCount(sec),0),0)} Questions</p>
            <p class="text-xs mt-1 text-gray-500">SSC · Railway · BPSC · BSSC exam preparation — offline practice</p>
        </div>
        <div class="grid grid-cols-1 gap-6 max-w-xl mx-auto">
            ${subjects.map(s => `
                <div onclick="goToChapters('${s.replace(/'/g,"\\'")}')" class="card-hover cursor-pointer rounded-2xl overflow-hidden shadow-lg bg-white border border-gray-200">
                    <div class="bg-gradient-to-br ${SUBJECT_META[s].color} p-6 text-white">
                        <div class="text-4xl mb-2">${SUBJECT_META[s].icon}</div>
                        <div class="text-xl font-bold">${s}</div>
                    </div>
                    <div class="p-5">
                        <p class="text-sm text-gray-600 mb-3">${SUBJECT_META[s].desc}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-2xl font-bold" style="color:var(--gold)">${subjectQCount(s)}</span>
                            <span class="text-xs text-gray-500">questions</span>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
        <div class="text-center mt-10 text-xs text-gray-400">examfusionprep.com &middot; works fully offline once loaded</div>
    </div>`;
}

function renderChapters() {
    const chapters = MASTER[state.subject];
    const names = Object.keys(chapters);
    return `
    <div class="max-w-4xl mx-auto px-4 pt-6 fade-in">
        <button onclick="goHome()" class="mb-4 text-sm px-3 py-1.5 rounded-lg bg-white border border-gray-300 hover:bg-gray-50" style="color:var(--deep)">&larr; All Subjects</button>
        <div class="mb-6">
            <h2 class="text-2xl font-bold" style="color:var(--ink)">${state.subject}</h2>
            <p class="text-xs text-gray-500">${SUBJECT_META[state.subject].desc}</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${names.map(name => `
                <div onclick="goToQuiz('${name.replace(/'/g,"\\'")}')" class="card-hover cursor-pointer bg-white rounded-xl border border-gray-200 shadow p-4 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-white flex-shrink-0" style="background:var(--gold)">${chapterNum(name)}</div>
                    <div class="min-w-0">
                        <div class="font-semibold text-sm" style="color:var(--ink)">${chapterDisplayName(name)}</div>
                        <div class="text-xs text-gray-500 mt-0.5">${chapterQCount(chapters[name])} questions &middot; ${chapters[name].length} sections</div>
                    </div>
                </div>
            `).join('')}
        </div>
    </div>`;
}

function renderQuiz() {
    const sections = state.quizData;
    const sec = sections[state.currentSection];
    return `
    <div class="max-w-3xl mx-auto px-3 pt-4 fade-in">
        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
            <button onclick="goToChapters('${state.subject.replace(/'/g,"\\'")}')" class="text-sm px-3 py-1.5 rounded-lg bg-white border border-gray-300 hover:bg-gray-50" style="color:var(--deep)">&larr; Chapters</button>
            <div class="flex gap-3 text-xs font-semibold">
                <span class="px-2 py-1 rounded bg-gray-100">Total: ${state.score.attempted}/${sections.reduce((s,x)=>s+x.questions.length,0)}</span>
                <span class="px-2 py-1 rounded bg-green-100 text-green-700">Correct: ${state.score.correct}</span>
                <span class="px-2 py-1 rounded bg-red-100 text-red-700">Wrong: ${state.score.wrong}</span>
            </div>
        </div>
        <div class="rounded-xl text-white p-4 mb-4" style="background:linear-gradient(135deg,var(--deep),var(--deep2))">
            <div class="text-xs opacity-75 mb-1">${chapterNum(state.chapterName)}. ${state.subject}</div>
            <h2 class="font-bold text-lg">${chapterDisplayName(state.chapterName)}</h2>
        </div>
        <div class="flex gap-2 mb-3 overflow-x-auto pb-2 px-1" style="scroll-snap-type:x proximity">
            ${sections.map((s,i) => `
                <button onclick="switchSection(${i})" title="${s.title.en}"
                    class="section-pill flex-shrink-0 w-9 h-9 rounded-full border-2 flex items-center justify-center text-xs font-bold cursor-pointer bg-white
                        ${i===state.currentSection ? 'active' : (i<state.currentSection ? 'done' : 'border-gray-300 text-gray-500')}"
                    style="scroll-snap-align:center">${i<state.currentSection ? '✓' : i+1}</button>
            `).join('')}
        </div>
        <div class="text-center text-sm mb-4 px-2">
            <span class="inline-block px-3 py-1 rounded-full bg-gray-100 text-xs font-semibold text-gray-500 mb-1">Section ${state.currentSection+1} of ${sections.length}</span>
            <div class="font-bold" style="color:var(--ink)">${sec.title.en}</div>
            <div class="text-xs text-gray-500">${sec.title.hi}</div>
        </div>
        <div id="questions-container" class="space-y-5">
            ${sec.questions.map((q, qi) => renderQuestion(q, qi)).join('')}
        </div>
        <div class="flex justify-between mt-6 mb-10">
            <button onclick="prevSection()" ${state.currentSection===0?'disabled':''} class="px-4 py-2 rounded-lg font-semibold text-sm ${state.currentSection===0?'bg-gray-200 text-gray-400 cursor-not-allowed':'bg-white border border-gray-300 hover:bg-gray-50'}" style="color:var(--deep)">&larr; Prev Section</button>
            <button onclick="nextSection()" class="px-4 py-2 rounded-lg font-semibold text-sm text-white" style="background:var(--gold)">${state.currentSection===sections.length-1?'Finish Chapter':'Next Section'} &rarr;</button>
        </div>
    </div>`;
}

function renderQuestion(q, qi) {
    const key = `${state.currentSection}-${qi}`;
    if (!state.shuffleMap[key]) {
        const order = q.o.map((_, i) => i);
        for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
        }
        state.shuffleMap[key] = order;
    }
    const order = state.shuffleMap[key];
    return `
    <div class="bg-white rounded-xl shadow border border-gray-200 p-4" id="q-${qi}">
        <p class="font-semibold text-sm mb-1" style="color:#2980b9">${qi+1}. ${q.q.en}</p>
        <p class="text-sm mb-3" style="color:#27ae60">${q.q.hi}</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2" id="opts-${qi}">
            ${order.map((origIdx, displayIdx) => `
                <button onclick="selectOption(${qi}, ${displayIdx})" data-qi="${qi}" data-oi="${displayIdx}" class="option-btn text-left px-3 py-2 rounded-lg border-2 border-gray-200 text-sm hover:border-gray-400">
                    <span class="block">${q.o[origIdx].en}</span>
                    <span class="block text-xs text-gray-500">${q.o[origIdx].hi}</span>
                </button>
            `).join('')}
        </div>
        <div id="exp-${qi}" class="hidden mt-3 p-3 rounded-lg text-sm" style="background:#e8f6f3;border-left:4px solid #2ecc71">
            <p style="color:#1a1f2e">${q.exp.en}</p>
            <p class="mt-1 text-xs" style="color:#27ae60">${q.exp.hi}</p>
        </div>
    </div>`;
}

function currentAnswerIndex(q) {
    return q.o.findIndex(o => o.en === q.a.en);
}

function selectOption(qi, displayIdx) {
    const sec = state.quizData[state.currentSection];
    const q = sec.questions[qi];
    const key = `${state.currentSection}-${qi}`;
    const order = state.shuffleMap[key];
    const btns = document.querySelectorAll(`#opts-${qi} .option-btn`);
    if (btns[0].classList.contains('answered')) return;
    const correctOrigIdx = currentAnswerIndex(q);
    const correctDisplayIdx = order.indexOf(correctOrigIdx);
    const clickedOrigIdx = order[displayIdx];
    btns.forEach(b => b.classList.add('answered'));
    btns[displayIdx].classList.add(clickedOrigIdx === correctOrigIdx ? 'correct' : 'incorrect');
    if (clickedOrigIdx !== correctOrigIdx) btns[correctDisplayIdx].classList.add('correct');
    btns.forEach(b => b.onclick = null);
    document.getElementById(`exp-${qi}`).classList.remove('hidden');
    state.score.attempted++;
    if (clickedOrigIdx === correctOrigIdx) state.score.correct++; else state.score.wrong++;
    updateScoreBar();
}

function updateScoreBar() {
    const el = document.querySelector('#app');
    // simplest: just re-render header score without full re-render to keep answered states
    const totalEl = document.querySelector('.px-2.py-1.rounded.bg-gray-100');
    if (totalEl) totalEl.textContent = `Total: ${state.score.attempted}/${state.quizData.reduce((s,x)=>s+x.questions.length,0)}`;
    const correctEl = document.querySelector('.px-2.py-1.rounded.bg-green-100');
    if (correctEl) correctEl.textContent = `Correct: ${state.score.correct}`;
    const wrongEl = document.querySelector('.px-2.py-1.rounded.bg-red-100');
    if (wrongEl) wrongEl.textContent = `Wrong: ${state.score.wrong}`;
}

function switchSection(i) {
    state.currentSection = i;
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
}
function prevSection() {
    if (state.currentSection > 0) { state.currentSection--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function nextSection() {
    if (state.currentSection < state.quizData.length - 1) { state.currentSection++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    else { alert(`Chapter complete!\\nScore: ${state.score.correct} correct / ${state.score.wrong} wrong out of ${state.score.attempted} attempted.`); }
}

function goHome() {
    state.screen = 'home'; state.subject = null; state.chapterName = null; state.quizData = null;
    render(); window.scrollTo({top:0});
}
function goToChapters(subject) {
    state.screen = 'chapters'; state.subject = subject; state.chapterName = null; state.quizData = null;
    render(); window.scrollTo({top:0});
}
function goToQuiz(chapterName) {
    state.screen = 'quiz';
    state.chapterName = chapterName;
    state.quizData = MASTER[state.subject][chapterName];
    state.currentSection = 0;
    state.score = { correct: 0, wrong: 0, attempted: 0 };
    state.shuffleMap = {};
    render(); window.scrollTo({top:0});
}

function render() {
    const app = document.getElementById('app');
    if (state.screen === 'home') app.innerHTML = renderHome();
    else if (state.screen === 'chapters') app.innerHTML = renderChapters();
    else if (state.screen === 'quiz') app.innerHTML = renderQuiz();
}

render();
</script>
