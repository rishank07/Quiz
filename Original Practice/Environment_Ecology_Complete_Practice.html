के लिए कानूनी रूप से बाध्यकारी GHG उत्सर्जन लक्ष्य; पहला प्रतिबद्धता अवधि 2008-2012 में समग्र लक्ष्य लगभग 5% से नीचे 1990 स्तर था।"},{"en":"A universal legally binding 5% cut for every country.","hi":"हर देश के लिए सार्वभौमिक कानूनी रूप से बाध्यकारी 5% कटौती।"},{"en":"Creation of UNEP.","hi":"UNEP की स्थापना।"},{"en":"Adoption of the 1.5°C Paris temperature goal.","hi":"1.5°C पेरिस तापमान लक्ष्य का अंगीकरण।"}],"exp":{"en":"Kyoto was the first major climate treaty to place quantified, legally binding emission-limit/reduction commitments on industrialized parties listed in Annex B.","hi":"क्योटो प्रमुख जलवायु संधि था जिसने अनुबंध B औद्योगीकृत पक्षकार पर परिमाणित, कानूनी रूप से बाध्यकारी उत्सर्जन-सीमा/कमी प्रतिबद्धताएँ रखे।"}},{"q":{"en":"What was the target of the Paris Agreement (2015)?","hi":"पेरिस समझौते (2015) का लक्ष्य क्या था?"},"a":{"en":"Hold warming well below 2°C above pre-industrial levels and pursue efforts to limit it to 1.5°C.","hi":"उष्मीकरण को पूर्व-औद्योगिक स्तरों से काफी नीचे 2°C रखना और 1.5°C तक सीमा करने के प्रयास प्रयास करना।"},"o":[{"en":"Hold warming well below 2°C above pre-industrial levels and pursue efforts to limit it to 1.5°C.","hi":"उष्मीकरण को पूर्व-औद्योगिक स्तरों से काफी नीचे 2°C रखना और 1.5°C तक सीमा करने के प्रयास प्रयास करना।"},{"en":"Keep warming exactly at 2°C with no 1.5°C objective.","hi":"उष्मीकरण को ठीक 2°C पर रखना, बिना 1.5°C लक्ष्य के।"},{"en":"Limit warming to 3°C by 2100.","hi":"2100 तक उष्मीकरण 3°C तक सीमा करना।"},{"en":"Return global temperature to 1990 levels.","hi":"वैश्विक तापमान को 1990 स्तर पर लौटाना करना।"}],"exp":{"en":"The 1.5°C aspiration was already written into the Paris Agreement alongside the 'well below 2°C' goal; it was not invented later at Glasgow.","hi":"1.5°C आकांक्षा पेरिस समझौता में पहले से 'काफी नीचे 2°C' लक्ष्य के साथ लिखित थी; इसे बाद में ग्लासगो ने स्थापित नहीं किया।"}},{"q":{"en":"How did COP26 at Glasgow (2021) treat the 1.5°C goal?","hi":"COP26 ग्लासगो (2021) ने 1.5°C लक्ष्य को किस प्रकार स्वीकार किया?"},"a":{"en":"It reaffirmed and strengthened efforts to keep the Paris Agreement's 1.5°C goal within reach; it did not create the 1.5°C goal for the first time.","hi":"इसने पेरिस समझौता के 1.5°C लक्ष्य को प्राप्ति की सीमा में रखने के प्रयास पुनः पुष्टि और सुदृढ़ किए; 1.5°C लक्ष्य पहला समय ग्लासगो में स्थापित नहीं हुआ था।"},"o":[{"en":"It reaffirmed and strengthened efforts to keep the Paris Agreement's 1.5°C goal within reach; it did not create the 1.5°C goal for the first time.","hi":"इसने पेरिस समझौता के 1.5°C लक्ष्य को प्राप्ति की सीमा में रखने के प्रयास पुनः पुष्टि और सुदृढ़ किए; 1.5°C लक्ष्य पहला समय ग्लासगो में स्थापित नहीं हुआ था।"},{"en":"It replaced the Paris Agreement's 2°C goal with a new 1.5°C treaty goal.","hi":"इसने पेरिस समझौता के 2°C लक्ष्य को नया 1.5°C संधि लक्ष्य से प्रतिस्थापित किया।"},{"en":"It abandoned all temperature goals.","hi":"इसने सभी तापमान लक्ष्य त्यागना कर दिए।"},{"en":"It created the Kyoto Protocol.","hi":"इसने क्योटो प्रोटोकॉल स्थापित किया।"}],"exp":{"en":"Glasgow strengthened near-term ambition around 1.5°C, called for coal-power phase-down and inefficient fossil-fuel-subsidy phase-out, and completed key elements of the Paris rulebook.","hi":"ग्लासगो ने 1.5°C के आसपास के निकट-शब्द महत्त्वाकांक्षा सुदृढ़ की, कोयला-ऊर्जा के चरणबद्ध घटाव और अक्षम जीवाश्म-ईंधन सब्सिडी को चरणबद्ध समाप्त करने पर आह्वान किया और पेरिस नियमावली के प्रमुख तत्त्व पूर्ण किए।"}}]},{"title":{"en":"2. Climate Change — Causes & Mitigation","hi":"2। जलवायु परिवर्तन - कारण और शमन (शमन)"},"questions":[{"q":{"en":"What are the Natural Causes of Climate Change?","hi":"जलवायु परिवर्तन के प्राकृतिक कारण क्या हैं?"},"a":{"en":"Changes in solar output, major volcanic eruptions, and long-term variations in Earth's orbit and tilt; internal climate variability also affects climate patterns.","hi":"सौर विकिरण में परिवर्तन, प्रमुख ज्वालामुखीय विस्फोट और पृथ्वी की कक्षा/झुकाव में दीर्घकालिक परिवर्तन; आंतरिक जलवायु परिवर्तनशीलता भी जलवायु प्रतिरूपों को प्रभावित करती है।"},"o":[{"en":"Changes in solar output, major volcanic eruptions, and long-term variations in Earth's orbit and tilt; internal climate variability also affects climate patterns.","hi":"सौर विकिरण में परिवर्तन, प्रमुख ज्वालामुखीय विस्फोट और पृथ्वी की कक्षा/झुकाव में दीर्घकालिक परिवर्तन; आंतरिक जलवायु परिवर्तनशीलता भी जलवायु प्रतिरूपों को प्रभावित करती है।"},{"en":"Only daily solar flares.","hi":"केवल दैनिक सौर ज्वालाएँ।"},{"en":"Only deforestation and industry.","hi":"केवल वनोन्मूलन और उद्योग।"},{"en":"Only ozone depletion.","hi":"केवल ओजोन क्षय।"}],"exp":{"en":"Natural climate drivers operate on different timescales. Large volcanic eruptions generally cause short-term cooling through reflective aerosols, while orbital variations act over very long periods.","hi":"प्राकृतिक जलवायु कारक अलग-अलग समय-पैमानों पर कार्य करते हैं। बड़े ज्वालामुखीय विस्फोट परावर्तक एरोसोल के माध्यम से सामान्यतः अल्पकालिक शीतलन उत्पन्न करते हैं, जबकि कक्षीय परिवर्तन अत्यधिक लंबी अवधियों में प्रभाव डालते हैं।"}},{"q":{"en":"What are the Man-made Causes of Climate Change?","hi":"जलवायु परिवर्तन के मानव निर्मित कारण क्या हैं?"},"a":{"en":"Burning fossil fuels, deforestation and land-use change, industrial processes, agriculture and livestock, waste, and other activities that raise greenhouse-gas concentrations.","hi":"जीवाश्म ईंधन दहन, वनोन्मूलन/भूमि-उपयोग परिवर्तन, औद्योगिक प्रक्रियाएँ, कृषि/पशुधन, अपशिष्ट और अन्य गतिविधियाँ जो ग्रीनहाउस-गैस सांद्रता बढ़ाती हैं।"},"o":[{"en":"Burning fossil fuels, deforestation and land-use change, industrial processes, agriculture and livestock, waste, and other activities that raise greenhouse-gas concentrations.","hi":"जीवाश्म ईंधन दहन, वनोन्मूलन/भूमि-उपयोग परिवर्तन, औद्योगिक प्रक्रियाएँ, कृषि/पशुधन, अपशिष्ट और अन्य गतिविधियाँ जो ग्रीनहाउस-गैस सांद्रता बढ़ाती हैं।"},{"en":"Only urbanization, with no role for fossil fuels.","hi":"केवल नगरीकरण, जीवाश्म ईंधन की कोई भूमिका नहीं।"},{"en":"Only natural volcanic eruptions.","hi":"केवल प्राकृतिक ज्वालामुखीय विस्फोट।"},{"en":"Only changes in Earth's orbit.","hi":"केवल पृथ्वी की कक्षा में परिवर्तन।"}],"exp":{"en":"Current warming is primarily anthropogenic. CO2 from fossil-fuel use and land-use change is the largest long-lived contributor, with methane, nitrous oxide and fluorinated gases also important.","hi":"वर्तमान उष्मीकरण मुख्यतः मानवजनित है। जीवाश्म-ईंधन उपयोग और भूमि-उपयोग परिवर्तन से CO2 सबसे बड़ा दीर्घजीवी योगदानकर्ता है; मीथेन, नाइट्रस ऑक्साइड और फ्लोरीनयुक्त गैसें भी महत्वपूर्ण हैं।"}},{"q":{"en":"What are the measures to mitigate the effects of Climate Change?","hi":"जलवायु परिवर्तन के प्रभावों को कम करने (कम करना) के उपाय क्या हैं?"},"a":{"en":"Rapid emission cuts through clean energy and efficiency, electrification, methane reduction, forest and ecosystem protection, carbon pricing where appropriate, and carbon capture/removal for suitable sectors; carbon markets/offsets can complement direct cuts if robust.","hi":"स्वच्छ ऊर्जा और दक्षता, विद्युतीकरण, मीथेन कमी, वन/पारितंत्र संरक्षण, उपयुक्त कार्बन मूल्य-निर्धारण और उपयुक्त क्षेत्रों में कार्बन अवशोषण/हटाना के माध्यम से तीव्र उत्सर्जन कटौती; सुदृढ़ कार्बन बाज़ार/समायोजन प्रत्यक्ष कटौती को पूरक कर सकते हैं।"},"o":[{"en":"Rapid emission cuts through clean energy and efficiency, electrification, methane reduction, forest and ecosystem protection, carbon pricing where appropriate, and carbon capture/removal for suitable sectors; carbon markets/offsets can complement direct cuts if robust.","hi":"स्वच्छ ऊर्जा और दक्षता, विद्युतीकरण, मीथेन कमी, वन/पारितंत्र संरक्षण, उपयुक्त कार्बन मूल्य-निर्धारण और उपयुक्त क्षेत्रों में कार्बन अवशोषण/हटाना के माध्यम से तीव्र उत्सर्जन कटौती; सुदृढ़ कार्बन बाज़ार/समायोजन प्रत्यक्ष कटौती को पूरक कर सकते हैं।"},{"en":"Only symbolic awareness events such as switching off lights for one hour.","hi":"केवल प्रतीकात्मक जागरूकता कार्यक्रम जैसे एक घंटा बत्तियाँ बंद करना।"},{"en":"Increasing fossil-fuel combustion to improve efficiency.","hi":"दक्षता सुधारने के लिए जीवाश्म-ईंधन दहन बढ़ाना।"},{"en":"Removing forests to increase land availability.","hi":"भूमि उपलब्धता बढ़ाने के लिए वन हटाना करना।"}],"exp":{"en":"Mitigation means reducing emissions or increasing removals. Awareness campaigns can support behaviour change, but they are not substitutes for structural emissions reductions in energy, transport, industry, buildings, land use and agriculture.","hi":"शमन का मतलब उत्सर्जन कम करना या अवशोषण बढ़ाना है। जागरूकता अभियान व्यवहार-परिवर्तन को बढ़ावा दे सकते हैं, लेकिन ऊर्जा, परिवहन, उद्योग, भवन, भूमि उपयोग और कृषि में संरचनात्मक उत्सर्जन कटौती का विकल्प नहीं हैं।"}}]},{"title":{"en":"3. Greenhouse Effect & Global Warming","hi":"3। ग्रीनहाउस प्रभाव और ग्लोबल वार्मिंग"},"questions":[{"q":{"en":"What is the Greenhouse Effect?","hi":"ग्रीनहाउस प्रभाव (ग्रीनहाउस प्रभाव) क्या है?"},"a":{"en":"A natural process in which greenhouse gases absorb and re-emit outgoing infrared radiation, warming Earth's surface and lower atmosphere.","hi":"एक प्राकृतिक प्रक्रिया जिसमें ग्रीनहाउस गैसें बाहर जाने वाले अवरक्त विकिरण अवशोषित/पुनः उत्सर्जित करके पृथ्वी की सतह और कम वायुमंडल को गर्म करती हैं।"},"o":[{"en":"A natural process in which greenhouse gases absorb and re-emit outgoing infrared radiation, warming Earth's surface and lower atmosphere.","hi":"एक प्राकृतिक प्रक्रिया जिसमें ग्रीनहाउस गैसें बाहर जाने वाले अवरक्त विकिरण अवशोषित/पुनः उत्सर्जित करके पृथ्वी की सतह और कम वायुमंडल को गर्म करती हैं।"},{"en":"Direct heating of Earth by ozone holes.","hi":"ओजोन छिद्र द्वारा पृथ्वी की प्रत्यक्ष उष्मीकरण।"},{"en":"A process that occurs only because of pollution.","hi":"ऐसी प्रक्रिया जो केवल प्रदूषण के कारण होती है।"},{"en":"Reflection of all sunlight back to space.","hi":"सारी सूर्यप्रकाश का अंतरिक्ष में परावर्तित होना।"}],"exp":{"en":"Incoming shortwave solar radiation warms Earth's surface; the surface emits infrared radiation, part of which greenhouse gases absorb and re-emit. This natural process keeps Earth much warmer than it would otherwise be.","hi":"आने वाला लघुतरंग विकिरण सौर विकिरण पृथ्वी की सतह को गर्म करती है; सतह अवरक्त विकिरण उत्सर्जित करती है, जिसका कुछ हिस्सा ग्रीनहाउस गैसें अवशोषित और पुनः उत्सर्जित करती हैं। यह प्राकृतिक प्रक्रिया पृथ्वी को अन्यथा होने की तुलना में अधिक अधिक गर्म रखती है।"}},{"q":{"en":"Which is the most important long-lived anthropogenic greenhouse gas driving current global warming?","hi":"वर्तमान वैश्विक उष्मीकरण को प्रेरित करने वाला सबसे महत्वपूर्ण दीर्घजीवी मानवजनित ग्रीनहाउस गैस कौन-सा है?"},"a":{"en":"Carbon dioxide (CO2).","hi":"कार्बन डाइऑक्साइड (CO2)।"},"o":[{"en":"Carbon dioxide (CO2).","hi":"कार्बन डाइऑक्साइड (CO2)।"},{"en":"Sulfur dioxide (SO2).","hi":"सल्फर डाइऑक्साइड (SO2)।"},{"en":"Carbon monoxide (CO).","hi":"कार्बन मोनोऑक्साइड (CO)।"},{"en":"Molecular oxygen (O2).","hi":"आणविक ऑक्सीजन (O2)।"}],"exp":{"en":"Water vapour is the strongest contributor to the natural greenhouse effect, but it mainly acts as a feedback. CO2 is the most important long-lived greenhouse gas driving human-caused warming.","hi":"जलवाष्प प्राकृतिक ग्रीनहाउस प्रभाव का सबसे प्रबल योगदानकर्ता है, लेकिन मुख्यतः प्रतिपुष्टि की तरह अधिनियम करता है। CO2 मानवजनित उष्मीकरण को प्रेरित करने वाला सबसे महत्वपूर्ण दीर्घजीवी ग्रीनहाउस गैस है।"}},{"q":{"en":"Where does Methane (CH4) come from?","hi":"मीथेन (CH4) कहाँ से आती है?"},"a":{"en":"Natural wetlands and human sources such as rice cultivation, livestock, landfills, and fossil-fuel extraction and transport.","hi":"प्राकृतिक आर्द्रभूमियाँ और मानवीय स्रोत जैसे धान की खेती, पशुधन, भूमि-भराव स्थल तथा जीवाश्म-ईंधन दोहन/परिवहन।"},"o":[{"en":"Natural wetlands and human sources such as rice cultivation, livestock, landfills, and fossil-fuel extraction and transport.","hi":"प्राकृतिक आर्द्रभूमियाँ और मानवीय स्रोत जैसे धान की खेती, पशुधन, भूमि-भराव स्थल तथा जीवाश्म-ईंधन दोहन/परिवहन।"},{"en":"Only deserts.","hi":"केवल मरुस्थलों।"},{"en":"Only nuclear power plants.","hi":"केवल परमाणु शक्ति पौधे।"},{"en":"Only ocean salt spray.","hi":"केवल महासागर लवण छिड़काव।"}],"exp":{"en":"Methane comes from both natural and human sources. Wetlands dominate natural emissions, while agriculture, livestock, fossil-fuel systems and waste are major anthropogenic sources.","hi":"मीथेन प्राकृतिक और मानवीय दोनों स्रोत से आता है। आर्द्रभूमियाँ प्राकृतिक उत्सर्जन का प्रमुख स्रोत हैं; कृषि, पशुधन, जीवाश्म-ईंधन प्रणालियाँ और अपशिष्ट प्रमुख मानवजनित स्रोत हैं।"}},{"q":{"en":"Which gases are important greenhouse gases?","hi":"महत्वपूर्ण ग्रीनहाउस गैसें कौन-सी हैं?"},"a":{"en":"Water vapour, CO2, CH4, N2O and ozone are major atmospheric greenhouse gases; human-made fluorinated gases such as HFCs, PFCs and SF6 also warm the climate. CO and SO2 are not themselves standard greenhouse gases.","hi":"जलवाष्प, CO2, CH4, N2O और ओजोन प्रमुख वायुमंडलीय ग्रीनहाउस गैसें हैं; HFCs, PFCs और SF6 जैसे मानव-निर्मित फ्लोरीनयुक्त गैसें भी जलवायु गर्म करते हैं। CO और SO2 मानक ग्रीनहाउस गैसें नहीं हैं।"},"o":[{"en":"Water vapour, CO2, CH4, N2O and ozone are major atmospheric greenhouse gases; human-made fluorinated gases such as HFCs, PFCs and SF6 also warm the climate. CO and SO2 are not themselves standard greenhouse gases.","hi":"जलवाष्प, CO2, CH4, N2O और ओजोन प्रमुख वायुमंडलीय ग्रीनहाउस गैसें हैं; HFCs, PFCs और SF6 जैसे मानव-निर्मित फ्लोरीनयुक्त गैसें भी जलवायु गर्म करते हैं। CO और SO2 मानक ग्रीनहाउस गैसें नहीं हैं।"},{"en":"CO2, CO and SO2 only.","hi":"केवल CO2, CO और SO2।"},{"en":"Nitrogen, oxygen and argon only.","hi":"केवल नाइट्रोजन, ऑक्सीजन और आर्गन।"},{"en":"Only water vapour; no other gas contributes.","hi":"केवल जलवाष्प; कोई अन्य गैस योगदान नहीं करती।"}],"exp":{"en":"CO and SO2 should not be listed as standard greenhouse gases. SO2 commonly forms reflective sulfate aerosols with a cooling influence; CO affects climate mainly indirectly through atmospheric chemistry.","hi":"CO और SO2 को मानक ग्रीनहाउस गैसें में सूची नहीं करना चाहिए। SO2 सामान्यतः परावर्तक सल्फेट एरोसोल बनाकर शीतलन प्रभाव देता है; CO वायुमंडलीय रसायन के माध्यम से मुख्यतः अप्रत्यक्ष जलवायु प्रभाव देता है।"}},{"q":{"en":"What is Global Warming?","hi":"ग्लोबल वार्मिंग (वैश्विक उष्मीकरण) क्या है?"},"a":{"en":"The long-term rise in Earth's global average surface temperature, driven mainly in the modern era by human-caused increases in greenhouse gases.","hi":"पृथ्वी की वैश्विक औसत सतह तापमान में दीर्घकालिक वृद्धि, आधुनिक अवधि में मुख्यतः मानवजनित ग्रीनहाउस गैसों की वृद्धि से संचालित।"},"o":[{"en":"The long-term rise in Earth's global average surface temperature, driven mainly in the modern era by human-caused increases in greenhouse gases.","hi":"पृथ्वी की वैश्विक औसत सतह तापमान में दीर्घकालिक वृद्धि, आधुनिक अवधि में मुख्यतः मानवजनित ग्रीनहाउस गैसों की वृद्धि से संचालित।"},{"en":"Any single hot day.","hi":"कोई भी एकमात्र गर्म दिन।"},{"en":"Only stratospheric ozone depletion.","hi":"केवल समतापमंडलीय ओजोन क्षय।"},{"en":"A short-term weather fluctuation lasting a few hours.","hi":"कुछ घंटे की अल्पकालिक मौसम का उतार-चढ़ाव।"}],"exp":{"en":"Global warming refers specifically to the long-term increase in global average surface temperature. Climate change includes that warming plus wider changes in rainfall, extremes, oceans, ice and ecosystems.","hi":"वैश्विक उष्मीकरण विशेष रूप से वैश्विक औसत सतह तापमान की दीर्घकालिक वृद्धि है। जलवायु परिवर्तन इसमें उष्मीकरण के साथ वर्षा, चरम घटनाएँ, महासागर, हिम और पारितंत्र के व्यापक परिवर्तन भी शामिल करता है।"}},{"q":{"en":"What are the impacts of Global Warming?","hi":"ग्लोबल वार्मिंग के प्रभाव क्या हैं?"},"a":{"en":"Rising heat extremes, glacier and ice loss, sea-level rise, changing rainfall, ocean warming and acidification, ecosystem and biodiversity impacts, health risks, and greater risks from many climate extremes.","hi":"बढ़ता ऊष्मा चरम घटनाएँ, हिमनद/हिम हानि, समुद्र-स्तर में वृद्धि, बदलता वर्षा, महासागर उष्मीकरण/अम्लीकरण, पारितंत्र/जैव विविधता प्रभाव, स्वास्थ्य जोखिम और अनेक जलवायु चरम घटनाएँ के अधिक जोखिम।"},"o":[{"en":"Rising heat extremes, glacier and ice loss, sea-level rise, changing rainfall, ocean warming and acidification, ecosystem and biodiversity impacts, health risks, and greater risks from many climate extremes.","hi":"बढ़ता ऊष्मा चरम घटनाएँ, हिमनद/हिम हानि, समुद्र-स्तर में वृद्धि, बदलता वर्षा, महासागर उष्मीकरण/अम्लीकरण, पारितंत्र/जैव विविधता प्रभाव, स्वास्थ्य जोखिम और अनेक जलवायु चरम घटनाएँ के अधिक जोखिम।"},{"en":"Increased agricultural yields globally without any negative effects.","hi":"बिना किसी नकारात्मक प्रभाव के विश्व स्तर पर कृषि पैदावार में वृद्धि।"},{"en":"Expansion of the polar ice caps.","hi":"ध्रुवीय बर्फ की टोपियों का विस्तार।"},{"en":"Decrease in the frequency of extreme weather events.","hi":"चरम मौसम की घटनाओं की आवृत्ति में कमी।"}],"exp":{"en":"Climate impacts are interconnected: warming drives ice loss and sea-level rise, alters water cycles and extremes, and affects food systems, health, biodiversity and infrastructure.","hi":"जलवायु प्रभाव परस्पर जुड़े हैं: उष्मीकरण हिम हानि और समुद्र-स्तर में वृद्धि प्रेरित करती है, जल चक्र/चरम घटनाएँ बदलती है और खाद्य प्रणालियाँ, स्वास्थ्य, जैव विविधता तथा अवसंरचना को प्रभावित करती है।"}},{"q":{"en":"What effect does a global temperature increase have on the rate of photosynthesis?","hi":"वैश्विक तापमान वृद्धि का प्रकाश संश्लेषण (प्रकाश संश्लेषण) की दर पर क्या प्रभाव पड़ता है?"},"a":{"en":"No. The response depends on species, baseline temperature, CO2, water and nutrients; moderate warming or higher CO2 can increase photosynthesis in some plants, while heat and drought stress can reduce it.","hi":"नहीं। प्रतिक्रिया प्रजाति, आधार-रेखा तापमान, CO2, जल और पोषक तत्त्व पर निर्भर करता है; मध्यम उष्मीकरण या उच्चतर CO2 कुछ पौधों में प्रकाश संश्लेषण बढ़ा सकता है, जबकि ऊष्मा/सूखा तनाव इसे कम कर सकते हैं।"},"o":[{"en":"No. The response depends on species, baseline temperature, CO2, water and nutrients; moderate warming or higher CO2 can increase photosynthesis in some plants, while heat and drought stress can reduce it.","hi":"नहीं। प्रतिक्रिया प्रजाति, आधार-रेखा तापमान, CO2, जल और पोषक तत्त्व पर निर्भर करता है; मध्यम उष्मीकरण या उच्चतर CO2 कुछ पौधों में प्रकाश संश्लेषण बढ़ा सकता है, जबकि ऊष्मा/सूखा तनाव इसे कम कर सकते हैं।"},{"en":"Yes. Any temperature rise always decreases photosynthesis in every plant.","hi":"हाँ। तापमान में कोई भी वृद्धि प्रत्येक पौधे में प्रकाश संश्लेषण को सदैव घटाती है।"},{"en":"No. Temperature has no effect on photosynthesis under any condition.","hi":"नहीं। किसी स्थिति में तापमान का प्रकाश संश्लेषण पर प्रभाव नहीं होता।"},{"en":"Yes. Higher CO2 can never affect photosynthesis.","hi":"हाँ। उच्चतर CO2 प्रकाश संश्लेषण को कभी प्रभावित नहीं कर सकता।"}],"exp":{"en":"Plant response is not one-directional. Photosynthesis has an optimum temperature range, CO2 fertilization can increase carbon uptake in some plants, and excessive heat or water stress can strongly reduce productivity.","hi":"पौधों की प्रतिक्रिया एक-दिशात्मक नहीं है। प्रकाश संश्लेषण का इष्टतम तापमान सीमा होता है, CO2 उर्वरीकरण कुछ पौधों में कार्बन अवशोषण बढ़ा सकती है और अत्यधिक ऊष्मा/जल तनाव उत्पादकता को काफी कम कर सकते हैं।"}},{"q":{"en":"What is the difference between the Greenhouse Effect and Global Warming?","hi":"ग्रीनहाउस प्रभाव और ग्लोबल वार्मिंग में क्या अंतर है?"},"a":{"en":"The natural greenhouse effect keeps Earth warm enough for life; human-added greenhouse gases strengthen that effect and cause the observed long-term warming.","hi":"प्राकृतिक ग्रीनहाउस प्रभाव पृथ्वी को जीवन के लिए पर्याप्त रूप से गर्म रखता है; मानवजनित ग्रीनहाउस गैसें इस प्रभाव को सुदृढ़ करके देखा गया दीर्घकालिक उष्मीकरण का कारण बनती हैं।"},"o":[{"en":"The natural greenhouse effect keeps Earth warm enough for life; human-added greenhouse gases strengthen that effect and cause the observed long-term warming.","hi":"प्राकृतिक ग्रीनहाउस प्रभाव पृथ्वी को जीवन के लिए पर्याप्त रूप से गर्म रखता है; मानवजनित ग्रीनहाउस गैसें इस प्रभाव को सुदृढ़ करके देखा गया दीर्घकालिक उष्मीकरण का कारण बनती हैं।"},{"en":"They are exactly the same term.","hi":"दोनों ठीक समान शब्द हैं।"},{"en":"The greenhouse effect exists only because of industry.","hi":"ग्रीनहाउस प्रभाव केवल उद्योग के कारण विद्यमान है।"},{"en":"Global warming is caused only by ozone holes.","hi":"वैश्विक उष्मीकरण केवल ओजोन छिद्र से कारण होती है।"}],"exp":{"en":"Without the natural greenhouse effect Earth would be far colder. The problem is the enhanced greenhouse effect caused by anthropogenic increases in heat-trapping gases.","hi":"प्राकृतिक ग्रीनहाउस प्रभाव के बिना पृथ्वी बहुत अधिक ठंडा होता। समस्या मानवजनित ऊष्मा-अवरोधन गैसें बढ़ने से उन्नत ग्रीनहाउस प्रभाव है।"}}]},{"title":{"en":"4. Ozone Layer","hi":"4। ओजोन परत (ओजोन परत)"},"questions":[{"q":{"en":"Where is the Ozone Layer located?","hi":"ओजोन परत कहाँ स्थित है?"},"a":{"en":"In the stratosphere, with most ozone concentrated roughly 15–35 km above Earth's surface.","hi":"समतापमंडल में, जहाँ अधिकांश ओजोन लगभग 15-35 किमी से ऊपर पृथ्वी की सतह संकेंद्रित है।"},"o":[{"en":"In the stratosphere, with most ozone concentrated roughly 15–35 km above Earth's surface.","hi":"समतापमंडल में, जहाँ अधिकांश ओजोन लगभग 15-35 किमी से ऊपर पृथ्वी की सतह संकेंद्रित है।"},{"en":"Only in the troposphere below 5 km.","hi":"केवल क्षोभमंडल में 5 किमी से नीचे।"},{"en":"Mainly in the mesosphere above 70 km.","hi":"मुख्यतः मध्यमंडल में 70 किमी से ऊपर।"},{"en":"Only at Earth's surface.","hi":"केवल पृथ्वी की सतह पर।"}],"exp":{"en":"About 90% of atmospheric ozone is in the stratosphere. The ozone layer is a broad region rather than a sharply bounded sheet, and its height varies with latitude and season.","hi":"वायुमंडलीय ओजोन का लगभग 90% समतापमंडल में होता है। ओजोन परत तीव्र रूप से सीमित चादर नहीं बल्कि व्यापक क्षेत्र है और इसकी ऊँचाई अक्षांश/ऋतु के साथ बदलती है।"}},{"q":{"en":"Where is the maximum concentration of Ozone?","hi":"ओजोन की अधिकतम सांद्रता कहाँ होती है?"},"a":{"en":"The ozone layer spans roughly 15–35 km; peak ozone concentration varies with latitude and season, with strong concentrations in the lower/middle stratosphere.","hi":"ओजोन परत लगभग 15-35 किमी की ऊँचाई तक विस्तृत है; शिखर ओजोन सांद्रता अक्षांश और ऋतु के साथ बदलती है, और सर्वाधिक सांद्रता निम्न/मध्य समतापमंडल में होती है।"},"o":[{"en":"The ozone layer spans roughly 15–35 km; peak ozone concentration varies with latitude and season, with strong concentrations in the lower/middle stratosphere.","hi":"ओजोन परत लगभग 15-35 किमी की ऊँचाई तक विस्तृत है; शिखर ओजोन सांद्रता अक्षांश और ऋतु के साथ बदलती है, और सर्वाधिक सांद्रता निम्न/मध्य समतापमंडल में होती है।"},{"en":"Exactly 50 km everywhere.","hi":"हर जगह ठीक 50 किमी।"},{"en":"Only below 2 km.","hi":"केवल 2 किमी से नीचे।"},{"en":"Only above 80 km.","hi":"केवल 80 किमी से ऊपर।"}],"exp":{"en":"Different measures of ozone concentration peak at somewhat different altitudes, so a rigid single 'maximum height' is misleading. The layer itself is commonly described as roughly 15–35 km above the surface.","hi":"ओजोन सांद्रता के अलग माप कुछ भिन्न ऊँचाइयों पर चरम मान दर्शाते हैं, इसलिए एकमात्र कठोर 'अधिकतम ऊँचाई' भ्रामक है। परत को सामान्यतः लगभग पृथ्वी की सतह से लगभग 15-35 किमी ऊपर वर्णन किया जाता है।"}},{"q":{"en":"What is the function of the Ozone Layer?","hi":"ओजोन परत कार्य क्या है?"},"a":{"en":"It absorbs most harmful solar UV-B and essentially all UV-C radiation, protecting humans and ecosystems.","hi":"यह अधिकांश हानिकारक सौर UV-B और मूलतः सभी UV-C विकिरण अवशोषित करके मनुष्यों और पारितंत्र को संरक्षित करती है।"},"o":[{"en":"It absorbs most harmful solar UV-B and essentially all UV-C radiation, protecting humans and ecosystems.","hi":"यह अधिकांश हानिकारक सौर UV-B और मूलतः सभी UV-C विकिरण अवशोषित करके मनुष्यों और पारितंत्र को संरक्षित करती है।"},{"en":"It blocks all visible sunlight.","hi":"यह सभी दृश्य सूर्यप्रकाश अवरुद्ध करती है।"},{"en":"It produces all atmospheric oxygen.","hi":"यह सभी वायुमंडलीय ऑक्सीजन उत्पन्न करती है।"},{"en":"It prevents every type of infrared radiation from escaping.","hi":"यह हर प्रकार की अवरक्त विकिरण बाहर जाने होने से रोकती है।"}],"exp":{"en":"Stratospheric ozone is beneficial because it filters biologically damaging ultraviolet radiation, especially UV-B. Ground-level ozone, by contrast, is an air pollutant.","hi":"समतापमंडलीय ओजोन लाभकारी है क्योंकि यह जैविक रूप से हानिकारक पराबैंगनी विकिरण, विशेष रूप से UV-B, छानता है। इसके विपरीत भूतलीय ओजोन वायु प्रदूषक है।"}},{"q":{"en":"In which unit is Ozone measured?","hi":"ओजोन को किस इकाई में मापा जाता है?"},"a":{"en":"Dobson Unit (DU).","hi":"डॉब्सन इकाई (DU)।"},"o":[{"en":"Dobson Unit (DU).","hi":"डॉब्सन इकाई (DU)।"},{"en":"Celsius.","hi":"सेल्सियस।"},{"en":"Pascals.","hi":"पास्कल।"},{"en":"Millibars.","hi":"मिलीबार।"}],"exp":{"en":"One Dobson Unit corresponds to a 0.01 mm layer of pure ozone at standard temperature and pressure if the entire atmospheric ozone column were compressed to the surface.","hi":"एक डॉब्सन इकाई उस 0.01 मिमी शुद्ध ओजोन परत के समतुल्य है जो संपूर्ण वायुमंडलीय ओजोन स्तंभ को मानक तापमान/दाब पर सतह तक संपीडित करने पर बनती।"}},{"q":{"en":"What are the impacts of Ozone Depletion?","hi":"ओजोन रिक्तीकरण (ओजोन क्षय) के प्रभाव क्या हैं?"},"a":{"en":"More UV-B reaching the surface, increasing risks of skin cancer and cataracts and damaging crops, phytoplankton and other ecosystems/materials.","hi":"सतह तक अधिक UV-B पहुँचना, जिससे त्वचा कैंसर/मोतियाबिंद का जोखिम बढ़ता है और फसलें, पादप प्लवक तथा अन्य पारितंत्र/सामग्री क्षति हो सकते हैं।"},"o":[{"en":"More UV-B reaching the surface, increasing risks of skin cancer and cataracts and damaging crops, phytoplankton and other ecosystems/materials.","hi":"सतह तक अधिक UV-B पहुँचना, जिससे त्वचा कैंसर/मोतियाबिंद का जोखिम बढ़ता है और फसलें, पादप प्लवक तथा अन्य पारितंत्र/सामग्री क्षति हो सकते हैं।"},{"en":"Complete loss of visible sunlight.","hi":"दृश्य सूर्यप्रकाश का पूर्ण ह्रास।"},{"en":"Immediate global cooling to freezing temperatures.","hi":"तत्काल वैश्विक शीतलन को हिमांक तापमान।"},{"en":"Elimination of all greenhouse gases.","hi":"सभी ग्रीनहाउस गैसें का उन्मूलन।"}],"exp":{"en":"Ozone depletion increases surface UV-B exposure. Health effects include skin cancer and cataracts, while ecological effects include harm to plants and aquatic primary producers such as phytoplankton.","hi":"ओजोन क्षय सतह UV-B संपर्क बढ़ाती है। स्वास्थ्य प्रभाव में त्वचा कैंसर/मोतियाबिंद और पारिस्थितिक प्रभाव में पौधे तथा पादप प्लवक जैसे जलीय प्राथमिक उत्पादक को हानि शामिल है।"}},{"q":{"en":"What are the causes of Ozone Depletion?","hi":"ओजोन रिक्तीकरण के कारण क्या हैं?"},"a":{"en":"CFCs, halons, carbon tetrachloride, methyl chloroform, methyl bromide and HCFCs are major controlled ODS; they release chlorine or bromine in the stratosphere.","hi":"CFCs, हैलोन, कार्बन टेट्राक्लोराइड, मिथाइल क्लोरोफॉर्म, मिथाइल ब्रोमाइड और HCFCs प्रमुख नियंत्रित ODS हैं; ये समतापमंडल में क्लोरीन या ब्रोमीन मुक्त करते हैं।"},"o":[{"en":"CFCs, halons, carbon tetrachloride, methyl chloroform, methyl bromide and HCFCs are major controlled ODS; they release chlorine or bromine in the stratosphere.","hi":"CFCs, हैलोन, कार्बन टेट्राक्लोराइड, मिथाइल क्लोरोफॉर्म, मिथाइल ब्रोमाइड और HCFCs प्रमुख नियंत्रित ODS हैं; ये समतापमंडल में क्लोरीन या ब्रोमीन मुक्त करते हैं।"},{"en":"CO2 and water vapour only.","hi":"केवल CO2 और जलवाष्प।"},{"en":"Nitrogen and oxygen only.","hi":"केवल नाइट्रोजन और ऑक्सीजन।"},{"en":"Sulfur dioxide and carbon monoxide only.","hi":"केवल सल्फर डाइऑक्साइड और कार्बन मोनोऑक्साइड।"}],"exp":{"en":"The key ozone-depleting chemicals contain chlorine or bromine and are sufficiently stable to reach the stratosphere. UV radiation then releases reactive halogen atoms that catalytically destroy ozone.","hi":"प्रमुख ओजोन-क्षयकारी रसायन क्लोरीन या ब्रोमीन युक्त होते हैं और समतापमंडल तक पहुँचने के लिए पर्याप्त रूप से स्थिर होते हैं। UV विकिरण अभिक्रियाशील हैलोजन परमाणु मुक्त करता है जो ओजोन को उत्प्रेरक रूप से नष्ट करते हैं।"}},{"q":{"en":"Where and when was the ozone hole discovered?","hi":"ओजोन छिद्र की खोज कब और कहाँ हुई?"},"a":{"en":"Over Antarctica, in 1985.","hi":"अंटार्कटिका के ऊपर, 1985 में।"},"o":[{"en":"Over Antarctica, in 1985.","hi":"अंटार्कटिका के ऊपर, 1985 में।"},{"en":"In the Arctic — in 1992.","hi":"आर्कटिक में - 1992 में।"},{"en":"Over Australia — in 1972.","hi":"ऑस्ट्रेलिया के ऊपर - 1972 में।"},{"en":"Over North America — in 1987.","hi":"उत्तरी अमेरिका के ऊपर - 1987 में।"}],"exp":{"en":"The 1985 British Antarctic Survey report documented dramatic springtime ozone losses over Antarctica, making the 'ozone hole' a major global environmental issue.","hi":"1985 ब्रिटिश अंटार्कटिक सर्वेक्षण प्रतिवेदन ने अंटार्कटिका के ऊपर नाटकीय वसंतकालीन ओजोन हानियाँ दस्तावेज़ किए, जिससे 'ओजोन छिद्र' प्रमुख वैश्विक पर्यावरणीय मुद्दा बना।"}},{"q":{"en":"Which protocol was created for Ozone Layer Protection?","hi":"ओजोन परत संरक्षण के लिए कौन सा प्रोटोकॉल बनाया गया था?"},"a":{"en":"The Montreal Protocol on Substances that Deplete the Ozone Layer, adopted in 1987.","hi":"ओजोन परत को क्षीण करने वाले पदार्थों पर मॉन्ट्रियल प्रोटोकॉल, 1987 में अपनाया गया।"},"o":[{"en":"The Montreal Protocol on Substances that Deplete the Ozone Layer, adopted in 1987.","hi":"ओजोन परत को क्षीण करने वाले पदार्थों पर मॉन्ट्रियल प्रोटोकॉल, 1987 में अपनाया गया।"},{"en":"Kyoto Protocol (1997).","hi":"क्योटो प्रोटोकॉल (1997)।"},{"en":"Paris Agreement (2015).","hi":"पेरिस समझौता (2015)।"},{"en":"Vienna Convention (1985).","hi":"वियना कन्वेंशन (1985)।"}],"exp":{"en":"The Montreal Protocol controls production and consumption of ozone-depleting substances and has achieved universal ratification. Its Kigali Amendment later added a climate benefit by phasing down HFCs.","hi":"मॉन्ट्रियल प्रोटोकॉल ओजोन-क्षयकारी पदार्थों के उत्पादन और उपभोग को नियंत्रित करता है और सार्वभौमिक अनुसमर्थन प्राप्त कर चुका है। बाद में किगाली संशोधन ने HFC चरणबद्ध घटाव के माध्यम से जलवायु लाभ भी जोड़ा।"}},{"q":{"en":"When is Ozone Protection Day celebrated?","hi":"ओजोन संरक्षण दिवस कब मनाया जाता है?"},"a":{"en":"16 September; the UN General Assembly proclaimed the observance in 1994 to commemorate the 1987 Montreal Protocol.","hi":"16 सितंबर; संयुक्त राष्ट्र महासभा ने 1994 में 1987 मॉन्ट्रियल प्रोटोकॉल को स्मरण करने के लिए दिवस घोषित किया।"},"o":[{"en":"16 September; the UN General Assembly proclaimed the observance in 1994 to commemorate the 1987 Montreal Protocol.","hi":"16 सितंबर; संयुक्त राष्ट्र महासभा ने 1994 में 1987 मॉन्ट्रियल प्रोटोकॉल को स्मरण करने के लिए दिवस घोषित किया।"},{"en":"22 March; it commemorates the Vienna Convention.","hi":"22 मार्च; यह वियना अभिसमय स्मरण करता है।"},{"en":"5 June; it is the same as World Environment Day.","hi":"5 जून; यह विश्व पर्यावरण दिवस के समान है।"},{"en":"2 February; it is the same as World Wetlands Day.","hi":"2 फ़रवरी; यह विश्व आर्द्रभूमियाँ दिन के समान है।"}],"exp":{"en":"16 September commemorates the date the Montreal Protocol was signed/adopted in 1987. The observance itself was proclaimed by the UN General Assembly in 1994.","hi":"16 सितंबर 1987 मॉन्ट्रियल प्रोटोकॉल की हस्ताक्षर/अंगीकरण तिथि स्मरण करता है। दिवस स्वयं संयुक्त राष्ट्र महासभा ने 1994 में घोषित किया।"}}]},{"title":{"en":"5. India — National Missions under the NAPCC","hi":"5। भारत - NAPCC के अंतर्गत राष्ट्रीय मिशन"},"questions":[{"q":{"en":"When was the National Mission on Enhanced Energy Efficiency launched?","hi":"संवर्धित ऊर्जा दक्षता पर राष्ट्रीय मिशन (राष्ट्रीय मिशन पर उन्नत ऊर्जा दक्षता) कब शुरू किया गया था?"},"a":{"en":"June 2010.","hi":"जून 2010।"},"o":[{"en":"June 2010.","hi":"जून 2010।"},{"en":"2008.","hi":"2008।"},{"en":"February 2014.","hi":"फ़रवरी 2014।"},{"en":"April 2011.","hi":"अप्रैल 2011।"}],"exp":{"en":"NMEEE is one of the eight original NAPCC missions, but its operational launch is June 2010 rather than 2008. It is implemented through instruments such as Perform-Achieve-Trade.","hi":"NMEEE आठ मूल NAPCC मिशन में से एक है, लेकिन कार्यशील शुरुआत जून 2010 है, 2008 नहीं। यह प्रदर्शन-प्राप्ति-व्यापार जैसे साधन के माध्यम से क्रियान्वित होता है।"}},{"q":{"en":"When was the National Solar Mission launched?","hi":"राष्ट्रीय सौर मिशन कब शुरू किया गया?"},"a":{"en":"11 January 2010; it had been approved as one of the original NAPCC missions in 2008.","hi":"11 जनवरी 2010; इसे 2008 में मूल NAPCC मिशन में अनुमोदित किया गया था।"},"o":[{"en":"11 January 2010; it had been approved as one of the original NAPCC missions in 2008.","hi":"11 जनवरी 2010; इसे 2008 में मूल NAPCC मिशन में अनुमोदित किया गया था।"},{"en":"June 2011.","hi":"जून 2011।"},{"en":"February 2014.","hi":"फ़रवरी 2014।"},{"en":"November 2015.","hi":"नवंबर 2015।"}],"exp":{"en":"The Solar Mission was conceptually part of the 2008 NAPCC and formally launched on 11 January 2010; distinguishing approval from launch avoids date confusion.","hi":"सौर मिशन अवधारणात्मक रूप से 2008 NAPCC का भाग था और औपचारिक रूप से 11 जनवरी 2010 को शुरू किया गया; अनुमोदन और शुरुआत को अलग रखने से तिथि-संबंधी भ्रम से बचा जा सकता है।"}},{"q":{"en":"When was the National Mission on Strategic Knowledge for Climate Change launched?","hi":"जलवायु परिवर्तन के लिए रणनीतिक ज्ञान पर राष्ट्रीय मिशन (जलवायु परिवर्तन हेतु रणनीतिक ज्ञान पर राष्ट्रीय मिशन) कब शुरू किया गया था?"},"a":{"en":"2008 as an original NAPCC mission; it was revised in 2015.","hi":"2008 में मूल NAPCC मिशन के रूप में; 2015 में संशोधित हुआ।"},"o":[{"en":"2008 as an original NAPCC mission; it was revised in 2015.","hi":"2008 में मूल NAPCC मिशन के रूप में; 2015 में संशोधित हुआ।"},{"en":"2010 only.","hi":"केवल 2010।"},{"en":"2014 only.","hi":"केवल 2014।"},{"en":"2021 only.","hi":"केवल 2021।"}],"exp":{"en":"NMSKCC belongs to the original 2008 NAPCC. Its mission document was developed later and the mission was revised in 2015, so '2010' should not be treated as its launch year.","hi":"NMSKCC मूल 2008 NAPCC का हिस्सा है। मिशन दस्तावेज़ बाद में विकसित हुआ और मिशन 2015 में संशोधित हुआ, इसलिए '2010' को शुरुआत वर्ष नहीं मानना चाहिए।"}},{"q":{"en":"When was the National Sustainable Agriculture Mission launched?","hi":"राष्ट्रीय सतत कृषि मिशन (राष्ट्रीय सतत कृषि मिशन) कब शुरू किया गया था?"},"a":{"en":"23 September 2010; it was later constituted operationally through an Office Memorandum in 2014.","hi":"23 सितंबर 2010; बाद में 2014 के कार्यालय ज्ञापन के माध्यम से परिचालन रूप से गठित हुआ।"},"o":[{"en":"23 September 2010; it was later constituted operationally through an Office Memorandum in 2014.","hi":"23 सितंबर 2010; बाद में 2014 के कार्यालय ज्ञापन के माध्यम से परिचालन रूप से गठित हुआ।"},{"en":"2008 with no later operational framework.","hi":"2008 में, बिना बाद में कार्यशील ढाँचा।"},{"en":"2014 as the first appearance of the mission.","hi":"2014 में मिशन का पहला उपस्थिति।"},{"en":"2020.","hi":"2020।"}],"exp":{"en":"NMSA was launched in September 2010 and later operationalized through detailed frameworks. Its focus is climate-resilient and sustainable agriculture, including water, soil and farming-system management.","hi":"NMSA सितंबर 2010 में शुरुआत हुआ और बाद में विस्तृत ढाँचों के माध्यम से क्रियान्वित हुआ। इसका केंद्र जलवायु-लचीला/सतत कृषि है, सहित जल, मृदा और कृषि-प्रणाली प्रबंधन।"}},{"q":{"en":"When was the National Mission on Sustainable Habitat launched?","hi":"सतत पर्यावास पर राष्ट्रीय मिशन (राष्ट्रीय मिशन पर सतत आवास) कब शुरू किया गया था?"},"a":{"en":"June 2010.","hi":"जून 2010।"},"o":[{"en":"June 2010.","hi":"जून 2010।"},{"en":"In 2008.","hi":"2008 में।"},{"en":"In 2011.","hi":"2011 में।"},{"en":"In 2014.","hi":"2014 में।"}],"exp":{"en":"NMSH addresses low-carbon and climate-resilient urban development through buildings, mobility, waste, water and urban planning.","hi":"NMSH भवन, गतिशीलता, अपशिष्ट, जल और नगरीय नियोजन के माध्यम से निम्न-कार्बन और जलवायु-लचीला नगरीय विकास से संबंधित है।"}},{"q":{"en":"When was the National Water Mission launched?","hi":"राष्ट्रीय जल मिशन कब शुरू किया गया?"},"a":{"en":"6 April 2011; it was conceived in 2008 as one of the original NAPCC missions.","hi":"6 अप्रैल 2011; इसे 2008 में मूल NAPCC मिशन में परिकल्पित किया गया था।"},"o":[{"en":"6 April 2011; it was conceived in 2008 as one of the original NAPCC missions.","hi":"6 अप्रैल 2011; इसे 2008 में मूल NAPCC मिशन में परिकल्पित किया गया था।"},{"en":"June 2010.","hi":"जून 2010।"},{"en":"February 2014.","hi":"फ़रवरी 2014।"},{"en":"2015.","hi":"2015।"}],"exp":{"en":"The National Water Mission aims at integrated water-resource management, conservation and improved water-use efficiency; its formal establishment date is 6 April 2011.","hi":"राष्ट्रीय जल मिशन एकीकृत जल-संसाधन प्रबंधन, संरक्षण और बेहतर जल-उपयोग दक्षता लक्ष्य करता है; औपचारिक स्थापना तिथि 6 अप्रैल 2011 है।"}},{"q":{"en":"When was the National Green India Mission launched?","hi":"नेशनल ग्रीन इंडिया मिशन कब लॉन्च किया गया?"},"a":{"en":"February 2014.","hi":"फ़रवरी 2014।"},"o":[{"en":"February 2014.","hi":"फ़रवरी 2014।"},{"en":"In 2010.","hi":"2010 में।"},{"en":"In 2011.","hi":"2011 में।"},{"en":"In 2008.","hi":"2008 में।"}],"exp":{"en":"The Green India Mission uses a landscape approach to improve forest/tree cover, restore degraded ecosystems and enhance carbon sinks and forest-based livelihoods.","hi":"हरित भारत मिशन परिदृश्य आधारित दृष्टिकोण के माध्यम से वन एवं वृक्ष आवरण में सुधार, क्षरित पारितंत्रों को पुनर्स्थापित और कार्बन सिंक तथा वन-आधारित आजीविकाओं को बढ़ाता है।"}},{"q":{"en":"When was the National Mission for Sustaining the Himalayan Ecosystem (NMSHE) launched?","hi":"हिमालयी पारिस्थितिकी तंत्र को बनाए रखने के लिए राष्ट्रीय मिशन (NMSHE) कब शुरू किया गया था?"},"a":{"en":"2008 as one of the original NAPCC missions; it was revised in 2015.","hi":"2008 में मूल NAPCC मिशन में से एक के रूप में; 2015 में संशोधित हुआ।"},"o":[{"en":"2008 as one of the original NAPCC missions; it was revised in 2015.","hi":"2008 में मूल NAPCC मिशन में से एक के रूप में; 2015 में संशोधित हुआ।"},{"en":"2014 only.","hi":"केवल 2014।"},{"en":"2010 only.","hi":"केवल 2010।"},{"en":"2021 only.","hi":"केवल 2021।"}],"exp":{"en":"NMSHE is one of the original 2008 missions and is coordinated by the Department of Science and Technology; it was revised in 2015, so 2014 is not its launch year.","hi":"NMSHE मूल 2008 मिशन में से एक है और विभाग का विज्ञान और प्रौद्योगिकी समन्वय करता है; 2015 में संशोधित हुआ, इसलिए 2014 इसका शुरुआत वर्ष नहीं है।"}},{"q":{"en":"How many of these missions were launched in 2010?","hi":"इनमें से कितने मिशन 2010 में लॉन्च किए गए थे?"},"a":{"en":"National Solar Mission, NMEEE, National Mission on Sustainable Habitat, and National Mission for Sustainable Agriculture.","hi":"राष्ट्रीय सौर मिशन, NMEEE, राष्ट्रीय मिशन पर सतत आवास और सतत कृषि हेतु राष्ट्रीय मिशन।"},"o":[{"en":"National Solar Mission, NMEEE, National Mission on Sustainable Habitat, and National Mission for Sustainable Agriculture.","hi":"राष्ट्रीय सौर मिशन, NMEEE, राष्ट्रीय मिशन पर सतत आवास और सतत कृषि हेतु राष्ट्रीय मिशन।"},{"en":"Solar Mission, Strategic Knowledge, Himalayan Ecosystem and Green India.","hi":"सौर मिशन, रणनीतिक ज्ञान, हिमालयी पारितंत्र और हरित भारत।"},{"en":"Water Mission, Green India, Himalayan Ecosystem and Strategic Knowledge.","hi":"जल मिशन, हरित भारत, हिमालयी पारितंत्र और रणनीतिक ज्ञान।"},{"en":"Only Solar Mission and Water Mission.","hi":"केवल सौर मिशन और जल मिशन।"}],"exp":{"en":"The four 2010 mission launches/approvals in this set are Solar, NMEEE, Sustainable Habitat and Sustainable Agriculture. Strategic Knowledge and Himalayan Ecosystem belong to the original 2008 mission set.","hi":"इस निर्धारित में 2010 के चार मिशन शुरू करता/अनुमोदन सौर, NMEEE, सतत आवास और सतत कृषि हैं। रणनीतिक ज्ञान और हिमालयी पारितंत्र मूल 2008 मिशन निर्धारित से हैं।"}}]},{"title":{"en":"6. Major International Environment & Climate Milestones","hi":"6। प्रमुख अंतरराष्ट्रीय पर्यावरण एवं जलवायु पड़ाव"},"questions":[{"q":{"en":"What was established at the Stockholm Conference in 1972?","hi":"1972 में स्टॉकहोम सम्मेलन में क्या स्थापित किया गया था?"},"a":{"en":"It led to the creation of the United Nations Environment Programme (UNEP) later in 1972.","hi":"इसके बाद 1972 में संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP) की स्थापना हुई।"},"o":[{"en":"It led to the creation of the United Nations Environment Programme (UNEP) later in 1972.","hi":"इसके बाद 1972 में संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP) की स्थापना हुई।"},{"en":"It adopted the Kyoto Protocol.","hi":"इसने क्योटो प्रोटोकॉल अपनाया।"},{"en":"It created the Paris Agreement.","hi":"इसने पेरिस समझौता स्थापित किया।"},{"en":"It established the Green Climate Fund.","hi":"इसने हरित जलवायु कोष स्थापित किया।"}],"exp":{"en":"Stockholm was a broad environmental conference, not an UNFCCC COP. Its institutional legacy includes UNEP and the Stockholm Declaration.","hi":"स्टॉकहोम व्यापक पर्यावरणीय सम्मेलन था, UNFCCC COP नहीं। इसकी संस्थागत पूर्ववर्ती में UNEP और स्टॉकहोम घोषणा शामिल हैं।"}},{"q":{"en":"What was the focus of the Vienna Conference in 1985?","hi":"1985 में वियना सम्मेलन का फोकस क्या था?"},"a":{"en":"A framework for international cooperation to protect the ozone layer, paving the way for the Montreal Protocol.","hi":"ओजोन परत संरक्षित करने के लिए अंतरराष्ट्रीय सहयोग का ढाँचा, जिसने मॉन्ट्रियल प्रोटोकॉल का रास्ता बनाया।"},"o":[{"en":"A framework for international cooperation to protect the ozone layer, paving the way for the Montreal Protocol.","hi":"ओजोन परत संरक्षित करने के लिए अंतरराष्ट्रीय सहयोग का ढाँचा, जिसने मॉन्ट्रियल प्रोटोकॉल का रास्ता बनाया।"},{"en":"Binding CO2 targets for all countries.","hi":"सभी देश के लिए बाध्यकारी CO2 लक्ष्य।"},{"en":"Creation of the Green Climate Fund.","hi":"हरित जलवायु कोष की स्थापना।"},{"en":"Adoption of the Paris rulebook.","hi":"पेरिस नियमावली का अंगीकरण।"}],"exp":{"en":"The Vienna Convention created a framework for research, monitoring and international cooperation on ozone; it did not itself impose the detailed chemical phase-out schedules later set by Montreal.","hi":"वियना अभिसमय ने ओजोन पर अनुसंधान, निगरानी और अंतरराष्ट्रीय सहयोग का ढाँचा बनाया; विस्तृत रासायनिक चरण-बाहर अनुसूचियाँ बाद में मॉन्ट्रियल ने निर्धारित किए।"}},{"q":{"en":"What was the outcome of the Montreal Conference in 1987?","hi":"1987 में मॉन्ट्रियल सम्मेलन का परिणाम क्या था?"},"a":{"en":"The Montreal Protocol on Substances that Deplete the Ozone Layer, adopted on 16 September 1987; the UN later proclaimed 16 September as Ozone Day in 1994.","hi":"ओजोन परत को क्षीण करने वाले पदार्थों पर मॉन्ट्रियल प्रोटोकॉल, 16 सितंबर 1987 को अपनाया गया; UN ने बाद में 1994 में 16 सितंबर को ओजोन दिन घोषित किया।"},"o":[{"en":"The Montreal Protocol on Substances that Deplete the Ozone Layer, adopted on 16 September 1987; the UN later proclaimed 16 September as Ozone Day in 1994.","hi":"ओजोन परत को क्षीण करने वाले पदार्थों पर मॉन्ट्रियल प्रोटोकॉल, 16 सितंबर 1987 को अपनाया गया; UN ने बाद में 1994 में 16 सितंबर को ओजोन दिन घोषित किया।"},{"en":"Ozone Protection Day was itself declared by the 1987 Montreal meeting.","hi":"ओजोन संरक्षण दिवस को 1987 मॉन्ट्रियल बैठक ने स्वयं घोषित किया।"},{"en":"The Kyoto Protocol.","hi":"क्योटो प्रोटोकॉल।"},{"en":"The UNFCCC.","hi":"UNFCCC।"}],"exp":{"en":"The Montreal Protocol targeted ozone-depleting substances. The annual 16 September ozone observance was proclaimed later by the UN, so it was not a 1987 conference declaration.","hi":"मॉन्ट्रियल प्रोटोकॉल ओजोन-क्षयकारी पदार्थों लक्ष्य करता था। वार्षिक 16 सितंबर ओजोन दिवस बाद में UN ने घोषित किया, इसलिए यह 1987 सम्मेलन घोषणा नहीं था।"}},{"q":{"en":"What were the key outcomes of the Rio Conference (Earth Summit – I) in 1992?","hi":"1992 में रियो सम्मेलन (पृथ्वी शिखर सम्मेलन - I) के प्रमुख परिणाम क्या थे?"},"a":{"en":"Agenda 21 and the Rio Declaration were adopted; the UNFCCC and Convention on Biological Diversity were opened for signature at Rio.","hi":"एजेंडा 21 और रियो घोषणा अपनाया हुए; UNFCCC और अभिसमय पर जैव विविधता रियो में हस्ताक्षर के लिए खुला हुए।"},"o":[{"en":"Agenda 21 and the Rio Declaration were adopted; the UNFCCC and Convention on Biological Diversity were opened for signature at Rio.","hi":"एजेंडा 21 और रियो घोषणा अपनाया हुए; UNFCCC और अभिसमय पर जैव विविधता रियो में हस्ताक्षर के लिए खुला हुए।"},{"en":"The Kyoto Protocol entered into force.","hi":"क्योटो प्रोटोकॉल प्रभावी हुआ।"},{"en":"The Green Climate Fund was created.","hi":"हरित जलवायु कोष स्थापित हुआ।"},{"en":"The Montreal Protocol was adopted.","hi":"मॉन्ट्रियल प्रोटोकॉल अपनाया हुआ।"}],"exp":{"en":"The UNFCCC was adopted shortly before Rio and opened for signature at the Earth Summit. Rio also produced Agenda 21 and the Rio Declaration.","hi":"UNFCCC रियो से शीघ्र से पहले अपनाया हुआ और पृथ्वी शिखर सम्मेलन में हस्ताक्षर के लिए खुला हुआ। रियो ने एजेंडा 21 और रियो घोषणा भी उत्पन्न किए।"}},{"q":{"en":"What was the target set at the Kyoto Conference (Kyoto Protocol) in 1997?","hi":"1997 में क्योटो सम्मेलन (क्योटो प्रोटोकॉल) में क्या लक्ष्य निर्धारित किया गया था?"},"a":{"en":"Legally binding emission targets for industrialized/Annex B Parties; first-period commitments averaged at least 5% below 1990 levels over 2008–2012.","hi":"औद्योगीकृत/अनुबंध-B पक्षकार के लिए कानूनी रूप से बाध्यकारी उत्सर्जन लक्ष्य; पहला अवधि 2008-2012 में प्रतिबद्धताएँ औसत कम-से-कम 5% से नीचे 1990 स्तर थे।"},"o":[{"en":"Legally binding emission targets for industrialized/Annex B Parties; first-period commitments averaged at least 5% below 1990 levels over 2008–2012.","hi":"औद्योगीकृत/अनुबंध-B पक्षकार के लिए कानूनी रूप से बाध्यकारी उत्सर्जन लक्ष्य; पहला अवधि 2008-2012 में प्रतिबद्धताएँ औसत कम-से-कम 5% से नीचे 1990 स्तर थे।"},{"en":"A 5% cut by every country immediately in 1997.","hi":"हर देश द्वारा 1997 में तत्काल 5% कटौती।"},{"en":"A universal carbon tax.","hi":"सार्वभौमिक कार्बन कर।"},{"en":"The 1.5°C Paris goal.","hi":"1.5°C पेरिस लक्ष्य।"}],"exp":{"en":"Kyoto's first commitment period covered 2008–2012. The 'about 5%' figure is an aggregate Annex B target, not a universal identical target for every country.","hi":"क्योटो की पहली प्रतिबद्धता अवधि 2008-2012 समाहित करता था। 'लगभग 5%' का आँकड़ा अनुबंध-B पक्षकारों का समग्र लक्ष्य है, हर देश के लिए समान सार्वभौमिक लक्ष्य नहीं।"}},{"q":{"en":"What were the principal outcomes of the Johannesburg World Summit on Sustainable Development (Rio+10) in 2002?","hi":"जोहान्सबर्ग विश्व शिखर सम्मेलन पर सतत विकास (रियो+10) 2002 के मुख्य परिणाम क्या थे?"},"a":{"en":"The Johannesburg Declaration and Plan of Implementation, renewing commitments to sustainable development and implementation of Agenda 21.","hi":"जोहान्सबर्ग घोषणा और योजना का क्रियान्वयन, सतत विकास तथा एजेंडा 21 क्रियान्वयन की प्रतिबद्धताएँ नवीनीकृत करते हुए।"},"o":[{"en":"The Johannesburg Declaration and Plan of Implementation, renewing commitments to sustainable development and implementation of Agenda 21.","hi":"जोहान्सबर्ग घोषणा और योजना का क्रियान्वयन, सतत विकास तथा एजेंडा 21 क्रियान्वयन की प्रतिबद्धताएँ नवीनीकृत करते हुए।"},{"en":"The Paris Agreement.","hi":"पेरिस समझौता।"},{"en":"The Vienna Convention.","hi":"वियना अभिसमय।"},{"en":"The first UNFCCC COP.","hi":"पहली UNFCCC COP।"}],"exp":{"en":"Johannesburg was a World Summit on Sustainable Development rather than an UNFCCC COP. It focused on implementation of sustainable-development commitments after Rio.","hi":"जोहान्सबर्ग विश्व शिखर सम्मेलन पर सतत विकास था, UNFCCC COP नहीं। इसका केंद्र रियो के बाद सतत-विकास प्रतिबद्धताएँ की क्रियान्वयन था।"}},{"q":{"en":"What was the focus of the Montreal Conference in 2005?","hi":"2005 में मॉन्ट्रियल सम्मेलन का फोकस क्या था?"},"a":{"en":"It hosted the first Meeting of the Parties to the Kyoto Protocol after its entry into force, operationalized key Kyoto rules/mechanisms and advanced discussions on post-2012 commitments.","hi":"क्योटो प्रोटोकॉल के प्रभावी होना के बाद पहला बैठक का पक्षकार आयोजित हुई; प्रमुख क्योटो नियम/तंत्र क्रियान्वित हुए और 2012 के बाद की प्रतिबद्धताओं पर चर्चाएँ आगे बढ़ीं।"},"o":[{"en":"It hosted the first Meeting of the Parties to the Kyoto Protocol after its entry into force, operationalized key Kyoto rules/mechanisms and advanced discussions on post-2012 commitments.","hi":"क्योटो प्रोटोकॉल के प्रभावी होना के बाद पहला बैठक का पक्षकार आयोजित हुई; प्रमुख क्योटो नियम/तंत्र क्रियान्वित हुए और 2012 के बाद की प्रतिबद्धताओं पर चर्चाएँ आगे बढ़ीं।"},{"en":"It was the 1987 ozone-protection meeting.","hi":"यह 1987 ओजोन-संरक्षण बैठक थी।"},{"en":"It adopted the Paris Agreement.","hi":"इसने पेरिस समझौता अपनाया।"},{"en":"It created COP numbering.","hi":"इसने COP क्रमांकन स्थापित की।"}],"exp":{"en":"The 2005 Montreal meeting was COP11 under the UNFCCC and CMP1 under the Kyoto Protocol, distinct from the 1987 ozone treaty meeting.","hi":"2005 मॉन्ट्रियल बैठक UNFCCC COP11 और क्योटो प्रोटोकॉल CMP1 थी, 1987 ओजोन संधि बैठक से अलग।"}},{"q":{"en":"What was the key outcome of COP13 at Bali in 2007?","hi":"COP13 बाली 2007 का प्रमुख परिणाम क्या था?"},"a":{"en":"The Bali Road Map, including the Bali Action Plan, launched negotiations on a broader post-2012 climate agreement.","hi":"बाली सड़क दर्शाना, सहित बाली कार्रवाई योजना, ने व्यापक 2012 के बाद के जलवायु समझौते के लिए वार्ता शुरुआत कीं।"},"o":[{"en":"The Bali Road Map, including the Bali Action Plan, launched negotiations on a broader post-2012 climate agreement.","hi":"बाली सड़क दर्शाना, सहित बाली कार्रवाई योजना, ने व्यापक 2012 के बाद के जलवायु समझौते के लिए वार्ता शुरुआत कीं।"},{"en":"A binding target to return global emissions to 2000 levels by 2050.","hi":"2050 तक वैश्विक उत्सर्जन को 2000 स्तर पर लौटाना करने का बाध्यकारी लक्ष्य।"},{"en":"Creation of UNEP.","hi":"UNEP की स्थापना।"},{"en":"The first Global Stocktake.","hi":"पहला वैश्विक स्थिति-आकलन।"}],"exp":{"en":"The Bali Action Plan opened a two-year negotiating track covering mitigation, adaptation, technology and finance; no binding '2000-level emissions by 2050' target was adopted there.","hi":"बाली कार्रवाई योजना ने शमन, अनुकूलन, प्रौद्योगिकी और वित्त समाहित करने वाला दो-वर्ष वार्ता क्रम खुला किया; वहाँ बाध्यकारी '2000-स्तर उत्सर्जन द्वारा 2050' लक्ष्य अपनाया नहीं हुआ।"}},{"q":{"en":"What was a central feature of the Copenhagen Accord associated with COP15 in 2009?","hi":"COP15 कोपेनहेगन 2009 से संबद्ध कोपेनहेगन समझौते की मुख्य विशेषता क्या थी?"},"a":{"en":"It recognized the scientific view that warming should be kept below 2°C and included political commitments on mitigation, transparency and climate finance, though the COP only 'took note' of the Accord.","hi":"इसने वैज्ञानिक मत को स्वीकार किया कि उष्मीकरण 2°C से नीचे रखी जानी चाहिए और शमन, पारदर्शिता तथा जलवायु वित्त पर राजनीतिक प्रतिबद्धताएँ शामिल किए; COP ने समझौता को औपचारिक रूप से अपनाया करने के बजाय 'ध्यान में लेना' किया।"},"o":[{"en":"It recognized the scientific view that warming should be kept below 2°C and included political commitments on mitigation, transparency and climate finance, though the COP only 'took note' of the Accord.","hi":"इसने वैज्ञानिक मत को स्वीकार किया कि उष्मीकरण 2°C से नीचे रखी जानी चाहिए और शमन, पारदर्शिता तथा जलवायु वित्त पर राजनीतिक प्रतिबद्धताएँ शामिल किए; COP ने समझौता को औपचारिक रूप से अपनाया करने के बजाय 'ध्यान में लेना' किया।"},{"en":"It legally created a low-carbon economy for all countries.","hi":"इसने सभी देश के लिए कानूनी रूप से निम्न-कार्बन अर्थव्यवस्था स्थापित की।"},{"en":"It adopted the Kyoto Protocol.","hi":"इसने क्योटो प्रोटोकॉल अपनाया।"},{"en":"It established UNEP.","hi":"इसने UNEP स्थापित किया।"}],"exp":{"en":"The Copenhagen Accord was politically important but was not formally adopted by consensus; the COP 'took note' of it. It recognized the below-2°C objective and major climate-finance commitments.","hi":"कोपेनहेगन समझौता राजनीतिक रूप से महत्वपूर्ण था लेकिन औपचारिक रूप से सहमति से अपनाया नहीं हुआ; COP ने इसे 'ध्यान में लेना' किया। इसने से नीचे-2°C लक्ष्य और प्रमुख जलवायु-वित्त प्रतिबद्धताएँ स्वीकार किए।"}},{"q":{"en":"What was established at the Cancun Conference in 2010?","hi":"2010 में कैनकन (कैनकन) सम्मेलन में क्या स्थापित किया गया था?"},"a":{"en":"The Green Climate Fund, along with other institutional arrangements including the Cancun Adaptation Framework and Technology Mechanism.","hi":"हरित जलवायु कोष, साथ में कैनकन अनुकूलन ढाँचा और प्रौद्योगिकी तंत्र जैसे अन्य संस्थागत व्यवस्थाओं।"},"o":[{"en":"The Green Climate Fund, along with other institutional arrangements including the Cancun Adaptation Framework and Technology Mechanism.","hi":"हरित जलवायु कोष, साथ में कैनकन अनुकूलन ढाँचा और प्रौद्योगिकी तंत्र जैसे अन्य संस्थागत व्यवस्थाओं।"},{"en":"UNEP.","hi":"UNEP।"},{"en":"The Montreal Protocol.","hi":"मॉन्ट्रियल प्रोटोकॉल।"},{"en":"The first Kyoto commitment period.","hi":"पहला क्योटो प्रतिबद्धता अवधि।"}],"exp":{"en":"Cancun translated several Copenhagen political ideas into formal institutional arrangements, including the Green Climate Fund, Adaptation Framework and Technology Mechanism.","hi":"कैनकन ने कोपेनहेगन की कई राजनीतिक विचार को औपचारिक संस्थागत व्यवस्थाओं में रूपांतरित किया, सहित हरित जलवायु कोष, अनुकूलन ढाँचा और प्रौद्योगिकी तंत्र।"}},{"q":{"en":"What was done regarding the Green Climate Fund at the Durban Conference (CoP-17) in 2011?","hi":"2011 में डरबन सम्मेलन (सीओपी-17) में ग्रीन क्लाइमेट फंड के संबंध में क्या किया गया?"},"a":{"en":"The Durban Platform for Enhanced Action, launching negotiations toward a new agreement applicable to all Parties, which eventually became the Paris Agreement; the conference also advanced the Green Climate Fund.","hi":"डरबन मंच के लिए उन्नत कार्रवाई, जिसने सभी पक्षकारों पर लागू नए समझौते की वार्ता आरंभ की, जो अंततः पेरिस समझौता बना; सम्मेलन ने हरित जलवायु कोष को भी आगे बढ़ाया।"},"o":[{"en":"The Durban Platform for Enhanced Action, launching negotiations toward a new agreement applicable to all Parties, which eventually became the Paris Agreement; the conference also advanced the Green Climate Fund.","hi":"डरबन मंच के लिए उन्नत कार्रवाई, जिसने सभी पक्षकारों पर लागू नए समझौते की वार्ता आरंभ की, जो अंततः पेरिस समझौता बना; सम्मेलन ने हरित जलवायु कोष को भी आगे बढ़ाया।"},{"en":"Creation of the Green Climate Fund for the first time.","hi":"हरित जलवायु कोष का पहला-समय स्थापना।"},{"en":"Adoption of the Montreal Protocol.","hi":"मॉन्ट्रियल प्रोटोकॉल का अंगीकरण।"},{"en":"A 2070 global emission target.","hi":"2070 वैश्विक उत्सर्जन लक्ष्य।"}],"exp":{"en":"Durban's defining outcome was the negotiating mandate for a legal instrument applicable to all Parties, the process that led to Paris in 2015.","hi":"डरबन का निर्धारक परिणाम सभी पक्षकारों पर लागू कानूनी साधन के लिए वार्ता अधिदेश था, जो प्रक्रिया 2015 पेरिस तक पहुँचा।"}},{"q":{"en":"What was the key Kyoto-related outcome of COP18 at Doha in 2012?","hi":"COP18 दोहा 2012 का प्रमुख क्योटो-संबंधित परिणाम क्या था?"},"a":{"en":"The Doha Amendment established a second Kyoto commitment period for 2013–2020; participating Parties took commitments amounting to at least 18% below 1990 levels in aggregate.","hi":"दोहा संशोधन ने 2013-2020 के लिए दूसरा क्योटो प्रतिबद्धता अवधि स्थापित किया; भाग लेने वाले पक्षकार के समग्र प्रतिबद्धताएँ कम-से-कम 18% से नीचे 1990 स्तर थे।"},"o":[{"en":"The Doha Amendment established a second Kyoto commitment period for 2013–2020; participating Parties took commitments amounting to at least 18% below 1990 levels in aggregate.","hi":"दोहा संशोधन ने 2013-2020 के लिए दूसरा क्योटो प्रतिबद्धता अवधि स्थापित किया; भाग लेने वाले पक्षकार के समग्र प्रतिबद्धताएँ कम-से-कम 18% से नीचे 1990 स्तर थे।"},{"en":"It created the Clean Development Mechanism for the first time.","hi":"इसने स्वच्छ विकास तंत्र पहला समय स्थापित किया।"},{"en":"It created UNEP.","hi":"इसने UNEP स्थापित किया।"},{"en":"It adopted the Paris Agreement.","hi":"इसने पेरिस समझौता अपनाया।"}],"exp":{"en":"Doha extended Kyoto through a second commitment period. The Clean Development Mechanism itself had already been established under the original Kyoto architecture.","hi":"दोहा ने क्योटो को दूसरा प्रतिबद्धता अवधि से विस्तारित किया। स्वच्छ विकास तंत्र मूल क्योटो संरचना के अंतर्गत पहले ही स्थापित हो चुका था।"}},{"q":{"en":"What agreement was made at the Warsaw Conference (CoP-19) in 2013?","hi":"2013 में वारसॉ सम्मेलन (COP-19) में क्या समझौता हुआ?"},"a":{"en":"Establishment of the Warsaw International Mechanism for Loss and Damage associated with climate-change impacts.","hi":"जलवायु-परिवर्तन प्रभाव से संबद्ध हानि एवं क्षति के लिए वारसॉ अंतरराष्ट्रीय तंत्र की स्थापना।"},"o":[{"en":"Establishment of the Warsaw International Mechanism for Loss and Damage associated with climate-change impacts.","hi":"जलवायु-परिवर्तन प्रभाव से संबद्ध हानि एवं क्षति के लिए वारसॉ अंतरराष्ट्रीय तंत्र की स्थापना।"},{"en":"Creation of the Green Climate Fund.","hi":"हरित जलवायु कोष की स्थापना।"},{"en":"Adoption of the Kyoto Protocol.","hi":"क्योटो प्रोटोकॉल का अंगीकरण।"},{"en":"Creation of UNEP.","hi":"UNEP की स्थापना।"}],"exp":{"en":"Warsaw is especially associated with the International Mechanism for Loss and Damage, not creation of the Green Climate Fund, which had already been established at Cancun.","hi":"वारसॉ विशेष रूप से अंतरराष्ट्रीय तंत्र के लिए हानि एवं क्षति से संबद्ध है, हरित जलवायु कोष स्थापना से नहीं; GCF कैनकन में पहले से स्थापित हो चुका था।"}},{"q":{"en":"What was the plan from the Lima Conference (CoP-20) in 2014?","hi":"2014 में लीमा सम्मेलन (COP-20) की क्या योजना थी?"},"a":{"en":"The Lima Call for Climate Action, which advanced elements for the 2015 agreement and guidance for countries' intended nationally determined contributions (INDCs).","hi":"लीमा आह्वान के लिए जलवायु कार्रवाई, जिसने 2015 समझौता के तत्त्व और देश के निर्धारित राष्ट्रीय स्तर पर निर्धारित योगदान (INDCs) की मार्गदर्शन आगे बढ़ाई।"},"o":[{"en":"The Lima Call for Climate Action, which advanced elements for the 2015 agreement and guidance for countries' intended nationally determined contributions (INDCs).","hi":"लीमा आह्वान के लिए जलवायु कार्रवाई, जिसने 2015 समझौता के तत्त्व और देश के निर्धारित राष्ट्रीय स्तर पर निर्धारित योगदान (INDCs) की मार्गदर्शन आगे बढ़ाई।"},{"en":"A global target to cut emissions by 2070.","hi":"2070 तक उत्सर्जन कटौती का वैश्विक लक्ष्य।"},{"en":"Creation of the Montreal Protocol.","hi":"मॉन्ट्रियल प्रोटोकॉल की स्थापना।"},{"en":"The first Global Stocktake.","hi":"पहला वैश्विक स्थिति-आकलन।"}],"exp":{"en":"Lima prepared the architecture for Paris and clarified how countries would submit INDCs; it did not adopt a 2070 global emission-cut target.","hi":"लीमा ने पेरिस संरचना तैयार किया और देश के INDC प्रस्तुतीकरण को स्पष्ट किया; इसने 2070 वैश्विक उत्सर्जन-कटौती लक्ष्य अपनाया नहीं किया।"}},{"q":{"en":"What was the target set at the Paris Conference (CoP-21) in 2015?","hi":"2015 में पेरिस सम्मेलन (सीओपी-21) में क्या लक्ष्य निर्धारित किया गया था?"},"a":{"en":"Hold warming well below 2°C above pre-industrial levels and pursue efforts to limit the increase to 1.5°C.","hi":"उष्मीकरण को पूर्व-औद्योगिक स्तरों से 2°C से काफी नीचे रखना और 1.5°C तक सीमित रखने का प्रयास करना।"},"o":[{"en":"Hold warming well below 2°C above pre-industrial levels and pursue efforts to limit the increase to 1.5°C.","hi":"उष्मीकरण को पूर्व-औद्योगिक स्तरों से 2°C से काफी नीचे रखना और 1.5°C तक सीमित रखने का प्रयास करना।"},{"en":"Exactly 2°C by 2100, with no 1.5°C aspiration.","hi":"ठीक 2°C द्वारा 2100, के बिना 1.5°C आकांक्षा।"},{"en":"3°C by 2050.","hi":"2050 तक 3°C।"},{"en":"Return temperatures to 1990 values.","hi":"तापमानों को 1990 स्तरों पर लौटाना करना।"}],"exp":{"en":"Paris's temperature language contains two linked elements: 'well below 2°C' and efforts toward 1.5°C, both measured relative to pre-industrial levels.","hi":"पेरिस तापमान भाषा के दो संबंधित तत्त्व हैं: 'काफी नीचे 2°C' और 1.5°C के की ओर प्रयास, दोनों पूर्व-औद्योगिक स्तरों सापेक्ष।"}},{"q":{"en":"What was the focus of the Marrakesh Conference (CoP-22) in 2016?","hi":"2016 में माराकेश (माराकेश) सम्मेलन (COP-22) का फोकस क्या था?"},"a":{"en":"Moving from Paris Agreement adoption toward implementation, including the Marrakech Action Proclamation and stronger implementation partnerships and rule-making.","hi":"पेरिस समझौता अंगीकरण से क्रियान्वयन की ओर बढ़ना करना, सहित माराकेश कार्रवाई घोषणा और अधिक सुदृढ़ क्रियान्वयन भागीदारियाँ/नियम-निर्माण।"},"o":[{"en":"Moving from Paris Agreement adoption toward implementation, including the Marrakech Action Proclamation and stronger implementation partnerships and rule-making.","hi":"पेरिस समझौता अंगीकरण से क्रियान्वयन की ओर बढ़ना करना, सहित माराकेश कार्रवाई घोषणा और अधिक सुदृढ़ क्रियान्वयन भागीदारियाँ/नियम-निर्माण।"},{"en":"Only clean water management, unrelated to Paris implementation.","hi":"केवल स्वच्छ जल प्रबंधन, पेरिस क्रियान्वयन से असंबंधित।"},{"en":"Creation of the Kyoto Protocol.","hi":"क्योटो प्रोटोकॉल की स्थापना।"},{"en":"Creation of UNEP.","hi":"UNEP की स्थापना।"}],"exp":{"en":"COP22 took place just after the Paris Agreement entered into force, so implementation, rule-making and mobilizing non-state climate action were central themes.","hi":"COP22 पेरिस समझौता के प्रभावी होने के तुरंत बाद हुआ, इसलिए क्रियान्वयन, नियम-निर्माण और गैर-राज्य जलवायु कार्रवाई को गति देना केंद्रीय विषय थे।"}},{"q":{"en":"What was discussed at the Bonn Conference (CoP-23) in 2017?","hi":"2017 में बॉन (बॉन) सम्मेलन (COP-23) में क्या चर्चा हुई थी?"},"a":{"en":"Progress on Paris implementation, launch of the Talanoa Dialogue process, adoption of the Gender Action Plan and the Koronivia Joint Work on Agriculture.","hi":"पेरिस क्रियान्वयन पर प्रगति, तालानोआ संवाद प्रक्रिया का शुरुआत, लैंगिक कार्रवाई योजना का अंगीकरण और कोरोनिविया संयुक्त कार्य पर कृषि।"},"o":[{"en":"Progress on Paris implementation, launch of the Talanoa Dialogue process, adoption of the Gender Action Plan and the Koronivia Joint Work on Agriculture.","hi":"पेरिस क्रियान्वयन पर प्रगति, तालानोआ संवाद प्रक्रिया का शुरुआत, लैंगिक कार्रवाई योजना का अंगीकरण और कोरोनिविया संयुक्त कार्य पर कृषि।"},{"en":"Adoption of the Paris Agreement itself.","hi":"पेरिस समझौता का अंगीकरण।"},{"en":"Creation of the Montreal Protocol.","hi":"मॉन्ट्रियल प्रोटोकॉल की स्थापना।"},{"en":"A new 5% Kyoto target for 2008–2012.","hi":"2008-2012 के लिए नया 5% क्योटो लक्ष्य।"}],"exp":{"en":"COP23 was held in Bonn under Fiji's presidency. Its outcomes included the Gender Action Plan and Koronivia agriculture work, while the Talanoa approach shaped the 2018 facilitative dialogue.","hi":"COP23 बॉन में फिजी अध्यक्षता के अंतर्गत हुआ। परिणाम में लैंगिक कार्रवाई योजना और कोरोनिविया कृषि कार्य शामिल थे; तालानोआ दृष्टिकोण ने 2018 सुविधाप्रद संवाद रूप दिया।"}},{"q":{"en":"What was decided at the Katowice Conference (CoP-24) in 2018?","hi":"2018 में कटोविस (काटोवित्से) सम्मेलन (COP-24) में क्या निर्णय लिया गया?"},"a":{"en":"The Katowice Climate Package, commonly called the Paris Agreement rulebook, setting detailed implementation guidelines.","hi":"काटोवित्से जलवायु पैकेज, सामान्यतः पेरिस समझौता नियमावली, जिसने विस्तृत क्रियान्वयन दिशानिर्देश निर्धारित कीं।"},"o":[{"en":"The Katowice Climate Package, commonly called the Paris Agreement rulebook, setting detailed implementation guidelines.","hi":"काटोवित्से जलवायु पैकेज, सामान्यतः पेरिस समझौता नियमावली, जिसने विस्तृत क्रियान्वयन दिशानिर्देश निर्धारित कीं।"},{"en":"The Paris Agreement entered into force for the first time in 2020.","hi":"पेरिस समझौता पहला समय 2020 में प्रभावी हुआ।"},{"en":"Creation of UNEP.","hi":"UNEP की स्थापना।"},{"en":"Adoption of the Vienna Convention.","hi":"वियना अभिसमय का अंगीकरण।"}],"exp":{"en":"Katowice produced the detailed rulebook needed to operationalize most parts of the Paris Agreement, covering transparency, NDC information, finance and other implementation rules.","hi":"काटोवित्से ने पेरिस समझौता के अधिकांश भाग क्रियान्वित करने के लिए विस्तृत नियमावली बनाया, समाहित पारदर्शिता, NDC जानकारी, वित्त और अन्य क्रियान्वयन नियम।"}},{"q":{"en":"What was the focus of the Madrid Conference (CoP-25) in 2019?","hi":"2019 में मैड्रिड सम्मेलन (COP-25) का फोकस क्या था?"},"a":{"en":"Parties strengthened work on loss and damage, including creation of the Santiago Network, but failed to reach final agreement on Paris Agreement Article 6 carbon-market rules.","hi":"पक्षकार ने हानि एवं क्षति कार्य सुदृढ़ किया, सहित सैंटियागो नेटवर्क स्थापना, लेकिन पेरिस समझौता अनुच्छेद 6 कार्बन-बाज़ार नियम पर अंतिम समझौता नहीं हो सका।"},"o":[{"en":"Parties strengthened work on loss and damage, including creation of the Santiago Network, but failed to reach final agreement on Paris Agreement Article 6 carbon-market rules.","hi":"पक्षकार ने हानि एवं क्षति कार्य सुदृढ़ किया, सहित सैंटियागो नेटवर्क स्थापना, लेकिन पेरिस समझौता अनुच्छेद 6 कार्बन-बाज़ार नियम पर अंतिम समझौता नहीं हो सका।"},{"en":"The Paris Agreement was adopted.","hi":"पेरिस समझौता अपनाया हुआ।"},{"en":"The Kyoto Protocol was adopted.","hi":"क्योटो प्रोटोकॉल अपनाया हुआ।"},{"en":"UNEP was established.","hi":"UNEP स्थापित हुआ।"}],"exp":{"en":"Madrid could not close the Article 6 carbon-market negotiations. A major loss-and-damage outcome was the Santiago Network, designed to catalyse technical assistance.","hi":"मैड्रिड अनुच्छेद 6 कार्बन-बाज़ार वार्ता निकट नहीं कर सका। प्रमुख हानि एवं क्षति परिणाम सैंटियागो नेटवर्क था, निर्मित को प्रेरित तकनीकी सहायता।"}},{"q":{"en":"What was the target set at the Glasgow Conference (CoP-26) in 2021?","hi":"2021 में ग्लासगो सम्मेलन (COP-26) में क्या लक्ष्य निर्धारित किया गया था?"},"a":{"en":"The Glasgow Climate Pact strengthened efforts to keep 1.5°C within reach, called for phase-down of unabated coal power and inefficient fossil-fuel subsidies, and completed key parts of the Paris rulebook including Article 6.","hi":"ग्लासगो जलवायु समझौता ने 1.5°C को प्राप्ति की सीमा में रखने के प्रयास सुदृढ़ किए, बिना कटौती वाला कोयला शक्ति और अक्षम जीवाश्म-ईंधन सब्सिडियों के चरणबद्ध घटाव पर आह्वान किया और अनुच्छेद 6 सहित पेरिस नियमावली के प्रमुख भाग पूर्ण किए।"},"o":[{"en":"The Glasgow Climate Pact strengthened efforts to keep 1.5°C within reach, called for phase-down of unabated coal power and inefficient fossil-fuel subsidies, and completed key parts of the Paris rulebook including Article 6.","hi":"ग्लासगो जलवायु समझौता ने 1.5°C को प्राप्ति की सीमा में रखने के प्रयास सुदृढ़ किए, बिना कटौती वाला कोयला शक्ति और अक्षम जीवाश्म-ईंधन सब्सिडियों के चरणबद्ध घटाव पर आह्वान किया और अनुच्छेद 6 सहित पेरिस नियमावली के प्रमुख भाग पूर्ण किए।"},{"en":"It introduced the 1.5°C aspiration for the first time.","hi":"इसने 1.5°C आकांक्षा पहला समय प्रस्तुत किया।"},{"en":"It adopted the Montreal Protocol.","hi":"इसने मॉन्ट्रियल प्रोटोकॉल अपनाया।"},{"en":"It created the Green Climate Fund.","hi":"इसने हरित जलवायु कोष स्थापित किया।"}],"exp":{"en":"Glasgow did not create the Paris 1.5°C aspiration; it strengthened implementation around it and finalized important rulebook issues, including Article 6 carbon markets.","hi":"ग्लासगो ने पेरिस का 1.5°C आकांक्षा स्थापित नहीं किया; इसने इसके आसपास क्रियान्वयन सुदृढ़ की और अनुच्छेद 6 कार्बन बाज़ार सहित महत्वपूर्ण नियमावली मुद्दे अंतिम रूप किए।"}},{"q":{"en":"What was the focus of the Sharm El-Sheikh Conference (CoP-27) in 2022?","hi":"2022 में शर्म अल-शेख सम्मेलन (COP-27) का फोकस क्या था?"},"a":{"en":"Agreement to establish new funding arrangements, including a fund, to address loss and damage for particularly vulnerable developing countries.","hi":"विशेष रूप से सुभेद्य विकासशील देशों के हानि एवं क्षति को संबोधित करने के लिए नया वित्तपोषण व्यवस्थाओं, सहित एक कोष, स्थापित करने का समझौता।"},"o":[{"en":"Agreement to establish new funding arrangements, including a fund, to address loss and damage for particularly vulnerable developing countries.","hi":"विशेष रूप से सुभेद्य विकासशील देशों के हानि एवं क्षति को संबोधित करने के लिए नया वित्तपोषण व्यवस्थाओं, सहित एक कोष, स्थापित करने का समझौता।"},{"en":"Creation of UNEP.","hi":"UNEP की स्थापना।"},{"en":"Adoption of the Kyoto Protocol.","hi":"क्योटो प्रोटोकॉल का अंगीकरण।"},{"en":"First adoption of the 1.5°C Paris goal.","hi":"1.5°C पेरिस लक्ष्य का पहला अंगीकरण।"}],"exp":{"en":"The loss-and-damage funding decision was the headline breakthrough at COP27, marking a major shift in support arrangements for countries particularly vulnerable to climate impacts.","hi":"हानि एवं क्षति वित्तपोषण निर्णय COP27 का प्रमुख उपलब्धि था, विशेष रूप से सुभेद्य देश के सहायता व्यवस्थाओं में बड़ा परिवर्तन।"}},{"q":{"en":"What were major outcomes of COP28 in Dubai, UAE, in 2023?","hi":"COP28 दुबई, UAE, 2023 के प्रमुख परिणाम क्या थे?"},"a":{"en":"The first Global Stocktake called for transitioning away from fossil fuels in energy systems, tripling renewable-energy capacity and doubling the rate of energy-efficiency improvement by 2030; the Loss and Damage Fund was also operationalized.","hi":"पहले वैश्विक स्थिति-आकलन ने ऊर्जा प्रणालियों में जीवाश्म ईंधन से दूर जाने, 2030 तक नवीकरणीय-ऊर्जा क्षमता तीन गुना और ऊर्जा-दक्षता सुधार दर दोगुना करने का आह्वान किया; हानि एवं क्षति कोष भी क्रियान्वित हुआ।"},"o":[{"en":"The first Global Stocktake called for transitioning away from fossil fuels in energy systems, tripling renewable-energy capacity and doubling the rate of energy-efficiency improvement by 2030; the Loss and Damage Fund was also operationalized.","hi":"पहले वैश्विक स्थिति-आकलन ने ऊर्जा प्रणालियों में जीवाश्म ईंधन से दूर जाने, 2030 तक नवीकरणीय-ऊर्जा क्षमता तीन गुना और ऊर्जा-दक्षता सुधार दर दोगुना करने का आह्वान किया; हानि एवं क्षति कोष भी क्रियान्वित हुआ।"},{"en":"COP28 was held in Abu Dhabi and only repeated the old $100 billion pledge.","hi":"COP28 अबू धाबी में हुआ और केवल पुराना $100 अरब प्रतिज्ञा दोहराया।"},{"en":"The Kyoto Protocol was adopted.","hi":"क्योटो प्रोटोकॉल अपनाया हुआ।"},{"en":"UNEP was created.","hi":"UNEP स्थापित हुआ।"}],"exp":{"en":"COP28 was held in Dubai, not Abu Dhabi. Its Global Stocktake language on transitioning away from fossil fuels in energy systems was unprecedented in a COP decision.","hi":"COP28 दुबई में हुआ, अबू धाबी में नहीं। ऊर्जा प्रणालियों में जीवाश्म ईंधन से दूर जाने का वैश्विक स्थिति-आकलन भाषा COP निर्णय में अभूतपूर्व था।"}},{"q":{"en":"What was discussed at the Baku Conference (CoP-29) in 2024?","hi":"2024 में बाकू (बाकू) सम्मेलन (COP-29) में क्या चर्चा हुई?"},"a":{"en":"COP29 agreed a new climate-finance goal of at least USD 300 billion per year for developing countries by 2035, with efforts to scale total finance to USD 1.3 trillion per year, and finalized key Article 6 carbon-market rules; COP30 followed in Belém, Brazil, in 2025.","hi":"COP29 ने विकासशील देशों के लिए 2035 तक कम-से-कम USD 300 अरब प्रति वर्ष का नया जलवायु-वित्त लक्ष्य सहमति किया, कुल वित्त को USD 1.3 खरब प्रति वर्ष तक पैमाना करने के प्रयास और प्रमुख अनुच्छेद 6 कार्बन-बाज़ार नियम अंतिम रूप किए; इसके बाद COP30 Belém, ब्राज़ील, 2025 में हुई।"},"o":[{"en":"COP29 agreed a new climate-finance goal of at least USD 300 billion per year for developing countries by 2035, with efforts to scale total finance to USD 1.3 trillion per year, and finalized key Article 6 carbon-market rules; COP30 followed in Belém, Brazil, in 2025.","hi":"COP29 ने विकासशील देशों के लिए 2035 तक कम-से-कम USD 300 अरब प्रति वर्ष का नया जलवायु-वित्त लक्ष्य सहमति किया, कुल वित्त को USD 1.3 खरब प्रति वर्ष तक पैमाना करने के प्रयास और प्रमुख अनुच्छेद 6 कार्बन-बाज़ार नियम अंतिम रूप किए; इसके बाद COP30 Belém, ब्राज़ील, 2025 में हुई।"},{"en":"COP29's only outcome was a methane ban, and no COP followed it.","hi":"COP29 का केवल परिणाम मीथेन प्रतिबंध था और इसके बाद कोई COP नहीं हुई।"},{"en":"COP29 was held in Dubai in 2023.","hi":"COP29 दुबई में 2023 में हुई।"},{"en":"COP29 adopted the Kyoto Protocol.","hi":"COP29 ने क्योटो प्रोटोकॉल अपनाया।"}],"exp":{"en":"Baku's headline result was the New Collective Quantified Goal on climate finance. COP30 then met in Belém in 2025 and adopted the Belém political package and other implementation decisions.","hi":"बाकू का प्रमुख परिणाम नया सामूहिक परिमाणित लक्ष्य पर जलवायु वित्त था। इसके बाद COP30 Belém 2025 में हुआ और Belém राजनीतिक पैकेज सहित क्रियान्वयन निर्णय अपनाया हुए।"}}]},{"title":{"en":"7. Common Confusions & Reverse Questions","hi":"7। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"What are the Antarctic ozone-hole discovery year and the Montreal Protocol adoption year?","hi":"अंटार्कटिक ओजोन-छिद्र खोज वर्ष और मॉन्ट्रियल प्रोटोकॉल अंगीकरण वर्ष क्या हैं?"},"a":{"en":"The Antarctic ozone hole was reported in 1985; the Montreal Protocol was adopted two years later, on 16 September 1987.","hi":"अंटार्कटिक ओजोन छिद्र 1985 में प्रतिवेदन हुआ; मॉन्ट्रियल प्रोटोकॉल दो वर्ष बाद में, 16 सितंबर 1987 को अपनाया गया।"},"o":[{"en":"The Antarctic ozone hole was reported in 1985; the Montreal Protocol was adopted two years later, on 16 September 1987.","hi":"अंटार्कटिक ओजोन छिद्र 1985 में प्रतिवेदन हुआ; मॉन्ट्रियल प्रोटोकॉल दो वर्ष बाद में, 16 सितंबर 1987 को अपनाया गया।"},{"en":"Both occurred in 1987.","hi":"दोनों 1987 में हुए।"},{"en":"Ozone hole: 1992; Montreal Protocol: 1985.","hi":"ओजोन छिद्र: 1992; मॉन्ट्रियल प्रोटोकॉल: 1985।"},{"en":"Ozone hole: 1972; Montreal Protocol: 1997.","hi":"ओजोन छिद्र: 1972; मॉन्ट्रियल प्रोटोकॉल: 1997।"}],"exp":{"en":"The discovery and treaty dates are separate milestones: scientific evidence of the Antarctic ozone hole was published in 1985, while the Montreal Protocol followed in 1987.","hi":"खोज और संधि तिथियाँ अलग प्रमुख पड़ाव हैं: अंटार्कटिक ओजोन छिद्र का वैज्ञानिक साक्ष्य 1985 में प्रकाशित हुआ, जबकि मॉन्ट्रियल प्रोटोकॉल 1987 में अनुसरण हुआ।"}},{"q":{"en":"How do the two major Montreal milestones in this chapter differ?","hi":"इस अध्याय के दो प्रमुख मॉन्ट्रियल प्रमुख पड़ाव में क्या अंतर है?"},"a":{"en":"1987 Montreal refers to the ozone-protecting Montreal Protocol; 2005 Montreal was UNFCCC COP11 and the first Kyoto Protocol meeting of Parties (CMP1).","hi":"1987 मॉन्ट्रियल ओजोन-संरक्षण मॉन्ट्रियल प्रोटोकॉल को संदर्भित करता है; 2005 मॉन्ट्रियल UNFCCC COP11 और पहला क्योटो प्रोटोकॉल बैठक का पक्षकार (CMP1) था।"},"o":[{"en":"1987 Montreal refers to the ozone-protecting Montreal Protocol; 2005 Montreal was UNFCCC COP11 and the first Kyoto Protocol meeting of Parties (CMP1).","hi":"1987 मॉन्ट्रियल ओजोन-संरक्षण मॉन्ट्रियल प्रोटोकॉल को संदर्भित करता है; 2005 मॉन्ट्रियल UNFCCC COP11 और पहला क्योटो प्रोटोकॉल बैठक का पक्षकार (CMP1) था।"},{"en":"Both were the same UNFCCC COP.","hi":"दोनों समान UNFCCC COP थे।"},{"en":"1987 was COP11 and 2005 was the Montreal Protocol signing.","hi":"1987 COP11 था और 2005 मॉन्ट्रियल प्रोटोकॉल हस्ताक्षर।"},{"en":"Both created Ozone Day.","hi":"दोनों ने ओजोन दिन स्थापित किया।"}],"exp":{"en":"The shared city name causes confusion, but the subject and treaty setting are different: 1987 is ozone governance; 2005 is UN climate/Kyoto governance.","hi":"समान नगर नाम भ्रम स्थापित करता है, लेकिन विषय और संधि निर्धारण अलग हैं: 1987 ओजोन शासन है; 2005 UN जलवायु/क्योटो शासन।"}},{"q":{"en":"When did UNFCCC COP numbering begin?","hi":"UNFCCC COP क्रमांकन कब आरंभ हुई?"},"a":{"en":"COP1 was held in Berlin in 1995. Kyoto was COP3, Bali COP13, Copenhagen COP15, Cancun COP16 and Durban COP17.","hi":"COP1 बर्लिन में 1995 में आयोजित हुई। क्योटो COP3, बाली COP13, कोपेनहेगन COP15, कैनकन COP16 और डरबन COP17 थे।"},"o":[{"en":"COP1 was held in Berlin in 1995. Kyoto was COP3, Bali COP13, Copenhagen COP15, Cancun COP16 and Durban COP17.","hi":"COP1 बर्लिन में 1995 में आयोजित हुई। क्योटो COP3, बाली COP13, कोपेनहेगन COP15, कैनकन COP16 और डरबन COP17 थे।"},{"en":"COP numbering began with Durban COP17 in 2011.","hi":"COP क्रमांकन डरबन COP17 में 2011 से आरंभ हुई।"},{"en":"COP numbering began with Rio in 1992 as COP1.","hi":"COP क्रमांकन रियो 1992 से COP1 के रूप में आरंभ हुई।"},{"en":"COP numbering began with Paris in 2015.","hi":"COP क्रमांकन पेरिस 2015 से आरंभ हुई।"}],"exp":{"en":"COP is the Conference of the Parties to the UNFCCC. The Convention entered into force in 1994, and its first COP was Berlin in 1995.","hi":"COP UNFCCC की सम्मेलन का पक्षकार है। अभिसमय 1994 में प्रभावी हुआ और पहला COP बर्लिन 1995 में हुआ।"}},{"q":{"en":"How are the natural greenhouse effect, anthropogenic global warming and climate change related?","hi":"प्राकृतिक ग्रीनहाउस प्रभाव, मानवजनित वैश्विक उष्मीकरण और जलवायु परिवर्तन कैसे संबंधित हैं?"},"a":{"en":"The natural greenhouse effect makes Earth habitable; human-added greenhouse gases strengthen it and cause global warming, while climate change is the broader set of long-term changes in temperature, rainfall, extremes, oceans and other climate-system features.","hi":"प्राकृतिक ग्रीनहाउस प्रभाव पृथ्वी को रहने योग्य बनाता है; मानवजनित ग्रीनहाउस गैसें इसे सुदृढ़ करके वैश्विक उष्मीकरण का कारण बनती हैं, जबकि जलवायु परिवर्तन तापमान, वर्षा, चरम घटनाएँ, महासागर और अन्य जलवायु-प्रणाली की विशेषताओं के व्यापक दीर्घकालिक परिवर्तन को शामिल करता है।"},"o":[{"en":"The natural greenhouse effect makes Earth habitable; human-added greenhouse gases strengthen it and cause global warming, while climate change is the broader set of long-term changes in temperature, rainfall, extremes, oceans and other climate-system features.","hi":"प्राकृतिक ग्रीनहाउस प्रभाव पृथ्वी को रहने योग्य बनाता है; मानवजनित ग्रीनहाउस गैसें इसे सुदृढ़ करके वैश्विक उष्मीकरण का कारण बनती हैं, जबकि जलवायु परिवर्तन तापमान, वर्षा, चरम घटनाएँ, महासागर और अन्य जलवायु-प्रणाली की विशेषताओं के व्यापक दीर्घकालिक परिवर्तन को शामिल करता है।"},{"en":"All three terms are exact synonyms.","hi":"तीनों शब्दों सटीक पर्यायवाची हैं।"},{"en":"Climate change means only ozone depletion.","hi":"जलवायु परिवर्तन केवल ओजोन क्षय है।"},{"en":"The greenhouse effect began only after industrialization.","hi":"ग्रीनहाउस प्रभाव केवल औद्योगीकरण के बाद शुरू हुआ।"}],"exp":{"en":"Global warming is one component of climate change. The natural greenhouse effect is a physical process; anthropogenic enhancement of it is the main driver of modern warming.","hi":"वैश्विक उष्मीकरण जलवायु परिवर्तन का एक घटक है। प्राकृतिक ग्रीनहाउस प्रभाव भौतिक प्रक्रिया है; इसका मानवजनित संवर्धन आधुनिक उष्मीकरण का मुख्य कारक है।"}},{"q":{"en":"How do the Paris Agreement (2015) and Glasgow Climate Pact (2021) relate to the 1.5°C goal?","hi":"पेरिस समझौता (2015) और ग्लासगो जलवायु समझौता (2021) 1.5°C लक्ष्य से कैसे संबंधित हैं?"},"a":{"en":"Paris already set the goal of well below 2°C while pursuing efforts toward 1.5°C; Glasgow reaffirmed and strengthened action intended to keep 1.5°C within reach.","hi":"पेरिस ने पहले से काफी नीचे 2°C का लक्ष्य निर्धारित किया और 1.5°C के लिए प्रयास प्रयास करने को कहा; ग्लासगो ने 1.5°C को प्राप्ति की सीमा में रखने वाली कार्रवाई पुनः पुष्टि और सुदृढ़ की।"},"o":[{"en":"Paris already set the goal of well below 2°C while pursuing efforts toward 1.5°C; Glasgow reaffirmed and strengthened action intended to keep 1.5°C within reach.","hi":"पेरिस ने पहले से काफी नीचे 2°C का लक्ष्य निर्धारित किया और 1.5°C के लिए प्रयास प्रयास करने को कहा; ग्लासगो ने 1.5°C को प्राप्ति की सीमा में रखने वाली कार्रवाई पुनः पुष्टि और सुदृढ़ की।"},{"en":"Paris had no 1.5°C language; Glasgow created it for the first time.","hi":"पेरिस में 1.5°C भाषा नहीं थी; ग्लासगो ने पहला समय स्थापित की।"},{"en":"Glasgow replaced Paris with a separate treaty.","hi":"ग्लासगो ने पेरिस को अलग संधि से प्रतिस्थापित किया।"},{"en":"Both set exactly 2°C and rejected 1.5°C.","hi":"दोनों ने ठीक 2°C निर्धारित किया और 1.5°C अस्वीकृत किया।"}],"exp":{"en":"The Paris text already contains both the well-below-2°C and 1.5°C elements. Glasgow increased political pressure and implementation effort around the 1.5°C pathway.","hi":"पेरिस पाठ में पहले से 2°C से काफी नीचे और 1.5°C दोनों तत्त्व हैं। ग्लासगो ने 1.5°C मार्ग के आसपास राजनीतिक दाब और क्रियान्वयन प्रयास बढ़ाए।"}}]},{"title":{"en":"8. Final Revision","hi":"8। अंतिम पुनरावृत्ति"},"questions":[{"q":{"en":"Greenhouse Effect =?","hi":"ग्रीनहाउस प्रभाव =?"},"a":{"en":"Natural warming caused when greenhouse gases absorb and re-emit outgoing infrared radiation.","hi":"प्राकृतिक उष्मीकरण जिसमें ग्रीनहाउस गैसें बाहर जाने वाले अवरक्त विकिरण अवशोषित और पुनः उत्सर्जित करती हैं।"},"o":[{"en":"Natural warming caused when greenhouse gases absorb and re-emit outgoing infrared radiation.","hi":"प्राकृतिक उष्मीकरण जिसमें ग्रीनहाउस गैसें बाहर जाने वाले अवरक्त विकिरण अवशोषित और पुनः उत्सर्जित करती हैं।"},{"en":"Harmful excess warming.","hi":"हानिकारक अत्यधिक वार्मिंग।"},{"en":"Depletion of the ozone layer.","hi":"ओजोन परत का क्षरण।"},{"en":"Cooling of the Earth's surface.","hi":"पृथ्वी की सतह का ठंडा होना।"}],"exp":{"en":"The greenhouse effect is natural; human emissions intensify it.","hi":"ग्रीनहाउस प्रभाव प्राकृतिक है; मानवीय उत्सर्जन इसे तीव्र करती हैं।"}},{"q":{"en":"Major greenhouse gas?","hi":"प्रमुख ग्रीनहाउस गैस?"},"a":{"en":"Carbon dioxide (CO2).","hi":"कार्बन डाइऑक्साइड (CO2)।"},"o":[{"en":"Carbon dioxide (CO2).","hi":"कार्बन डाइऑक्साइड (CO2)।"},{"en":"Methane (CH4).","hi":"मीथेन (CH4)।"},{"en":"Nitrous Oxide (N2O).","hi":"नाइट्रस ऑक्साइड (N2O)।"},{"en":"Ozone (O3).","hi":"ओजोन
