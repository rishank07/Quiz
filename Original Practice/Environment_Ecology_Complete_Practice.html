मदा बचाओ आंदोलन और मैती आंदोलन।"},"o":[{"en":"4 key movements — Chipko Movement, Appiko Movement, Narmada Bachao Andolan, and Maiti Movement.","hi":"4 प्रमुख आंदोलन - चिपको आंदोलन, अप्पिको आंदोलन, नर्मदा बचाओ आंदोलन और मैती आंदोलन।"},{"en":"3 key movements — Chipko, Silent Valley, and Narmada Bachao Andolan.","hi":"3 प्रमुख आंदोलन - चिपको, साइलेंट वैली और नर्मदा बचाओ आंदोलन।"},{"en":"2 key movements — Chipko and Green Belt Movement.","hi":"2 प्रमुख आंदोलन - चिपको और ग्रीन बेल्ट आंदोलन।"},{"en":"Only the Chipko Movement is covered.","hi":"केवल चिपको आंदोलन को कवर किया गया है।"}],"exp":{"en":"4 key movements — Chipko Movement, Appiko Movement, Narmada Bachao Andolan, and Maiti Movement. The movements cover forest conservation, river-valley displacement/development issues and community afforestation traditions in different regions of India.","hi":"4 प्रमुख आंदोलन - चिपको आंदोलन, अप्पिको आंदोलन, नर्मदा बचाओ आंदोलन और मैती आंदोलन। ये आंदोलन भारत के अलग क्षेत्रों में वन संरक्षण, नदी-घाटी विस्थापन/विकास मुद्दे और समुदाय वनीकरण परंपराएँ समाहित करते हैं।"}},{"q":{"en":"How many important environmental days are covered in this chapter?","hi":"इस अध्याय में कितने महत्वपूर्ण पर्यावरण दिवस कवर किये गए हैं?"},"a":{"en":"7 important environmental days.","hi":"7 महत्वपूर्ण पर्यावरण दिवस।"},"o":[{"en":"7 important environmental days.","hi":"7 महत्वपूर्ण पर्यावरण दिवस।"},{"en":"5 important environmental days.","hi":"5 महत्वपूर्ण पर्यावरण दिवस।"},{"en":"10 important environmental days.","hi":"10 महत्वपूर्ण पर्यावरण दिवस।"},{"en":"12 important environmental days.","hi":"12 महत्वपूर्ण पर्यावरण दिवस।"}],"exp":{"en":"7 important environmental days. The seven observances in this chapter include wildlife, forests, Earth, environment, tigers, ozone protection and human habitat.","hi":"7 महत्वपूर्ण पर्यावरण दिवस। अध्याय के सात दिवस वन्यजीव, वन, पृथ्वी, पर्यावरण, बाघ, ओजोन संरक्षण और मानवीय आवास से संबंधित हैं।"}},{"q":{"en":"Which key act of 1986 is covered in this chapter?","hi":"इस अध्याय में 1986 का कौन सा प्रमुख अधिनियम शामिल किया गया है?"},"a":{"en":"Environment (Protection) Act, 1986.","hi":"पर्यावरण (संरक्षण) अधिनियम, 1986।"},"o":[{"en":"Environment (Protection) Act, 1986.","hi":"पर्यावरण (संरक्षण) अधिनियम, 1986।"},{"en":"Wildlife Protection Act, 1986.","hi":"वन्यजीव संरक्षण अधिनियम, 1986।"},{"en":"Forest Conservation Act, 1986.","hi":"वन संरक्षण अधिनियम, 1986।"},{"en":"Air (Prevention and Control of Pollution) Act, 1986.","hi":"वायु (प्रदूषण की रोकथाम और नियंत्रण) अधिनियम, 1986।"}],"exp":{"en":"Environment (Protection) Act, 1986. It is India's umbrella environmental legislation empowering the Central Government to take measures for protecting and improving environmental quality and to make rules under the Act.","hi":"पर्यावरण (संरक्षण) अधिनियम, 1986। यह भारत की व्यापक पर्यावरणीय कानून है जो केंद्र सरकार को पर्यावरणीय गुणवत्ता के संरक्षण एवं सुधार और अधिनियम के अंतर्गत नियम बनाने की शक्तियाँ देती है।"}}]},{"title":{"en":"2. Introduction & Components","hi":"2। परिचय और घटक"},"questions":[{"q":{"en":"What is the origin of the English word 'Environment'?","hi":"अंग्रेज़ी शब्द 'पर्यावरण' की उत्पत्ति क्या है?"},"a":{"en":"It is derived from the French 'environ/environner', meaning 'around' or 'to surround'.","hi":"यह फ्रांसीसी 'environ/environner' से व्युत्पन्न है, जिसका अर्थ 'के आसपास' या 'को घेरना' है।"},"o":[{"en":"It is derived from the French 'environ/environner', meaning 'around' or 'to surround'.","hi":"यह फ्रांसीसी 'environ/environner' से व्युत्पन्न है, जिसका अर्थ 'के आसपास' या 'को घेरना' है।"},{"en":"It comes from the Greek 'oikos', meaning only a habitat.","hi":"यह यूनानी 'oikos' से आता है, जिसका अर्थ केवल आवास है।"},{"en":"It comes from the Latin 'terra', meaning land.","hi":"यह लैटिन 'terra' से आता है, जिसका अर्थ भूमि है।"},{"en":"It is derived from a Sanskrit term meaning biodiversity.","hi":"यह जैव विविधता अर्थ वाले संस्कृत शब्द से व्युत्पन्न है।"}],"exp":{"en":"It is derived from the French 'environ/environner', meaning 'around' or 'to surround'. The English term developed through French usage connected with the idea of surroundings; conceptually, environment means the total surroundings and conditions affecting organisms.","hi":"यह फ्रांसीसी 'environ/environner' से व्युत्पन्न है, जिसका अर्थ 'के आसपास' या 'को घेरना' है। अंग्रेज़ी शब्द फ्रांसीसी प्रयोग से विकसित हुआ जो परिवेश की अवधारणा से संबंधित है; अवधारणात्मक रूप से पर्यावरण जीवों को प्रभावित करने वाली समग्र परिवेश एवं स्थितियाँ हैं।"}},{"q":{"en":"What are the Biotic components of the environment?","hi":"पर्यावरण के जैविक (जैविक) घटक क्या हैं?"},"a":{"en":"Living beings, animals, plants, microbes.","hi":"जीवित प्राणी, जानवर, पौधे, सूक्ष्मजीव (सूक्ष्मजीव)।"},"o":[{"en":"Living beings, animals, plants, microbes.","hi":"जीवित प्राणी, जानवर, पौधे, सूक्ष्मजीव (सूक्ष्मजीव)।"},{"en":"Water, air, soil.","hi":"पानी, हवा, मिट्टी।"},{"en":"Solar energy, geothermal energy.","hi":"सौर ऊर्जा, भूतापीय ऊर्जा।"},{"en":"Buildings, roads, factories.","hi":"इमारतें, सड़कें, कारखाने।"}],"exp":{"en":"Living beings, animals, plants, microbes. Biotic components are the living part of an environment or ecosystem and include producers, consumers and decomposers such as plants, animals, fungi and microorganisms.","hi":"जीवित प्राणी, जानवर, पौधे, सूक्ष्मजीव (सूक्ष्मजीव)। जैविक घटक पर्यावरण/पारितंत्र का जीवित भाग हैं और पौधे, पशु, कवक तथा सूक्ष्मजीव जैसे उत्पादक, उपभोक्ता और अपघटक शामिल करते हैं।"}},{"q":{"en":"What are the Abiotic components of the environment?","hi":"पर्यावरण के अजैविक (अजैविक) घटक क्या हैं?"},"a":{"en":"Water, air, soil, etc.","hi":"पानी, हवा, मिट्टी, आदि।"},"o":[{"en":"Water, air, soil, etc.","hi":"पानी, हवा, मिट्टी, आदि।"},{"en":"Living beings, animals, plants.","hi":"जीवित प्राणी, जानवर, पौधे।"},{"en":"Fungi and bacteria.","hi":"कवक और बैक्टीरिया।"},{"en":"Only solar energy.","hi":"केवल सौर ऊर्जा।"}],"exp":{"en":"Water, air, soil, etc. Abiotic components are non-living physical and chemical factors such as air, water, soil, minerals, temperature, light and climatic conditions.","hi":"पानी, हवा, मिट्टी, आदि। अजैविक घटक निर्जीव भौतिक और रासायनिक कारक हैं, जैसे वायु, जल, मृदा, खनिज, तापमान, प्रकाश और जलवायवीय स्थितियाँ।"}},{"q":{"en":"How is energy treated in the standard biotic–abiotic classification of environment?","hi":"पर्यावरण की मानक जैविक-अजैविक वर्गीकरण में ऊर्जा को कैसे माना जाता है?"},"a":{"en":"Energy such as sunlight is a non-living environmental factor/input and is treated with abiotic factors; it is not a universally recognised third component separate from biotic and abiotic.","hi":"सूर्यप्रकाश जैसी ऊर्जा निर्जीव पर्यावरणीय कारक/आदान है और अजैविक कारक के साथ मानी जाती है; इसे जैविक और अजैविक से अलग सार्वभौमिक रूप से मान्यता प्राप्त तीसरा घटक नहीं माना जाता।"},"o":[{"en":"Energy such as sunlight is a non-living environmental factor/input and is treated with abiotic factors; it is not a universally recognised third component separate from biotic and abiotic.","hi":"सूर्यप्रकाश जैसी ऊर्जा निर्जीव पर्यावरणीय कारक/आदान है और अजैविक कारक के साथ मानी जाती है; इसे जैविक और अजैविक से अलग सार्वभौमिक रूप से मान्यता प्राप्त तीसरा घटक नहीं माना जाता।"},{"en":"Energy is a biotic component because plants use sunlight.","hi":"ऊर्जा जैविक घटक है क्योंकि पौधे सूर्यप्रकाश उपयोग करते हैं।"},{"en":"Energy forms a compulsory third category in the standard classification.","hi":"ऊर्जा का मानक वर्गीकरण में अनिवार्य तीसरी श्रेणी बनाती है।"},{"en":"Energy is excluded from environmental studies.","hi":"ऊर्जा पर्यावरणीय अध्ययन से बाहर रखता है।"}],"exp":{"en":"Energy such as sunlight is a non-living environmental factor/input and is treated with abiotic factors; it is not a universally recognised third component separate from biotic and abiotic. In the standard ecological classification, environmental components are biotic and abiotic, while energy flow is studied as an ecosystem process.","hi":"सूर्यप्रकाश जैसी ऊर्जा निर्जीव पर्यावरणीय कारक/आदान है और अजैविक कारक के साथ मानी जाती है; इसे जैविक और अजैविक से अलग सार्वभौमिक रूप से मान्यता प्राप्त तीसरा घटक नहीं माना जाता। मानक पारिस्थितिक वर्गीकरण में पर्यावरणीय घटक जैविक और अजैविक होते हैं, जबकि ऊर्जा प्रवाह को पारितंत्र प्रक्रिया के रूप में अध्ययन किया जाता है।"}},{"q":{"en":"What are examples of the Natural Environment?","hi":"प्राकृतिक पर्यावरण (प्राकृतिक पर्यावरण) के उदाहरण क्या हैं?"},"a":{"en":"Naturally occurring surroundings such as land, air, water, soil, plants, animals and natural ecosystems.","hi":"प्राकृतिक रूप से पाए जाने वाले परिवेश जैसे भूमि, वायु, जल, मृदा, पौधे, पशु और प्राकृतिक पारितंत्र।"},"o":[{"en":"Naturally occurring surroundings such as land, air, water, soil, plants, animals and natural ecosystems.","hi":"प्राकृतिक रूप से पाए जाने वाले परिवेश जैसे भूमि, वायु, जल, मृदा, पौधे, पशु और प्राकृतिक पारितंत्र।"},{"en":"Agriculture, industrial cities.","hi":"कृषि, औद्योगिक शहर।"},{"en":"Parks, zoos, and botanical gardens.","hi":"पार्क, चिड़ियाघर और वनस्पति उद्यान।"},{"en":"Dams and reservoirs.","hi":"बांध और जलाशय।"}],"exp":{"en":"Naturally occurring surroundings such as land, air, water, soil, plants, animals and natural ecosystems. Natural environment includes both non-living surroundings and naturally occurring living communities and ecosystems.","hi":"प्राकृतिक रूप से पाए जाने वाले परिवेश जैसे भूमि, वायु, जल, मृदा, पौधे, पशु और प्राकृतिक पारितंत्र। प्राकृतिक पर्यावरण में निर्जीव परिवेश के साथ प्राकृतिक रूप से पाए जाने वाले जीवित समुदाय और पारितंत्र भी शामिल होते हैं।"}},{"q":{"en":"What are examples of the Man-made Environment?","hi":"मानव निर्मित पर्यावरण के उदाहरण क्या हैं?"},"a":{"en":"Human-created or substantially human-modified surroundings such as settlements, roads, dams, industrial areas and agricultural landscapes.","hi":"मानव-निर्मित या काफी हद तक मानवीय-परिवर्तित परिवेश, जैसे बस्तियाँ, सड़कें, बाँध, औद्योगिक क्षेत्रों और कृषि-संबंधी परिदृश्यों।"},"o":[{"en":"Human-created or substantially human-modified surroundings such as settlements, roads, dams, industrial areas and agricultural landscapes.","hi":"मानव-निर्मित या काफी हद तक मानवीय-परिवर्तित परिवेश, जैसे बस्तियाँ, सड़कें, बाँध, औद्योगिक क्षेत्रों और कृषि-संबंधी परिदृश्यों।"},{"en":"Land, air, water.","hi":"ज़मीन, हवा, पानी।"},{"en":"Forests, mountains, oceans.","hi":"जंगल, पहाड़, महासागर।"},{"en":"Wild animals and birds.","hi":"जंगली जानवर और पक्षी।"}],"exp":{"en":"Human-created or substantially human-modified surroundings such as settlements, roads, dams, industrial areas and agricultural landscapes. Human activities can create entirely built environments or substantially modify natural systems; agriculture is therefore commonly treated as a human-modified environment.","hi":"मानव-निर्मित या काफी हद तक मानवीय-परिवर्तित परिवेश, जैसे बस्तियाँ, सड़कें, बाँध, औद्योगिक क्षेत्रों और कृषि-संबंधी परिदृश्यों। मानवीय गतिविधियाँ पूर्णतः निर्मित पर्यावरण स्थापित कर सकती हैं या प्राकृतिक प्रणालियों को काफी हद तक बदल सकती हैं; इसलिए कृषि को सामान्यतः मानवीय-परिवर्तित पर्यावरण माना जाता है।"}}]},{"title":{"en":"3. Environmental Degradation & Protection","hi":"3। पर्यावरण क्षरण और संरक्षण"},"questions":[{"q":{"en":"What does environmental degradation mean?","hi":"पर्यावरणीय क्षरण (पर्यावरणीय क्षरण) का क्या अर्थ है?"},"a":{"en":"Deterioration of environmental quality through depletion of resources, pollution, habitat destruction or disruption of ecological processes.","hi":"संसाधनों की क्षय, प्रदूषण, आवास विनाश या पारिस्थितिक प्रक्रियाओं के व्यवधान से पर्यावरणीय गुणवत्ता का गिरावट।"},"o":[{"en":"Deterioration of environmental quality through depletion of resources, pollution, habitat destruction or disruption of ecological processes.","hi":"संसाधनों की क्षय, प्रदूषण, आवास विनाश या पारिस्थितिक प्रक्रियाओं के व्यवधान से पर्यावरणीय गुणवत्ता का गिरावट।"},{"en":"Increase in biodiversity.","hi":"जैव विविधता में वृद्धि।"},{"en":"Creation of new ecosystems.","hi":"नए पारिस्थितिक तंत्र का निर्माण।"},{"en":"Purification of air and water.","hi":"हवा और पानी का शुद्धिकरण।"}],"exp":{"en":"Deterioration of environmental quality through depletion of resources, pollution, habitat destruction or disruption of ecological processes. Degradation is broader than a temporary 'imbalance': it includes loss of resource quality, pollution, biodiversity decline, soil or habitat damage and impaired ecosystem functioning.","hi":"संसाधनों की क्षय, प्रदूषण, आवास विनाश या पारिस्थितिक प्रक्रियाओं के व्यवधान से पर्यावरणीय गुणवत्ता का गिरावट। क्षरण अस्थायी 'असंतुलन' से व्यापक है; इसमें संसाधन गुणवत्ता हानि, प्रदूषण, जैव विविधता गिरावट, मृदा/आवास क्षति और बाधित पारितंत्र कार्यप्रणाली शामिल हैं।"}},{"q":{"en":"What are the major causes of environmental degradation?","hi":"पर्यावरण क्षरण के प्रमुख कारण क्या हैं?"},"a":{"en":"Mining, Industrialization, Urbanization, Modern agriculture, etc.","hi":"खनन, औद्योगीकरण, शहरीकरण, आधुनिक कृषि, आदि।"},"o":[{"en":"Mining, Industrialization, Urbanization, Modern agriculture, etc.","hi":"खनन, औद्योगीकरण, शहरीकरण, आधुनिक कृषि, आदि।"},{"en":"Planting trees and creating national parks.","hi":"पेड़ लगाना और राष्ट्रीय उद्यान बनाना।"},{"en":"Using solar and wind energy.","hi":"सौर एवं पवन ऊर्जा का उपयोग।"},{"en":"Wildlife conservation programs.","hi":"वन्यजीव संरक्षण कार्यक्रम।"}],"exp":{"en":"Mining, Industrialization, Urbanization, Modern agriculture, etc. These activities become drivers of degradation when they cause excessive resource extraction, pollution, land-use change, habitat loss or unsustainable chemical and water use.","hi":"खनन, औद्योगीकरण, शहरीकरण, आधुनिक कृषि, आदि। ये गतिविधियाँ क्षरण कारक तब बनती हैं जब अत्यधिक संसाधन-दोहन, प्रदूषण, भूमि-उपयोग परिवर्तन, आवास-हानि या असतत रासायनिक एवं जल-उपयोग का कारण बनती हैं।"}},{"q":{"en":"Which biosafety committee functions under the 1989 Rules notified under the Environment (Protection) Act, 1986?","hi":"पर्यावरण (संरक्षण) अधिनियम, 1986 के तहत अधिसूचित 1989 नियम के अंतर्गत कौन-सी जैव-सुरक्षा समिति कार्य करती है?"},"a":{"en":"The Genetic Engineering Appraisal Committee (GEAC), formerly called the Genetic Engineering Approval Committee until it was renamed in 2010.","hi":"आनुवंशिक अभियांत्रिकी आकलन समिति (GEAC), जिसे 2010 में नाम परिवर्तन होने से पहले आनुवंशिक अभियांत्रिकी अनुमोदन समिति कहा जाता था।"},"o":[{"en":"The Genetic Engineering Appraisal Committee (GEAC), formerly called the Genetic Engineering Approval Committee until it was renamed in 2010.","hi":"आनुवंशिक अभियांत्रिकी आकलन समिति (GEAC), जिसे 2010 में नाम परिवर्तन होने से पहले आनुवंशिक अभियांत्रिकी अनुमोदन समिति कहा जाता था।"},{"en":"National Green Tribunal (NGT).","hi":"राष्ट्रीय हरित अधिकरण (NGT)।"},{"en":"Central Pollution Control Board (CPCB).","hi":"केंद्रीय प्रदूषण नियंत्रण बोर्ड (CPCB)।"},{"en":"World Meteorological Organization (WMO).","hi":"विश्व मौसम विज्ञान संगठन (WMO)।"}],"exp":{"en":"The Genetic Engineering Appraisal Committee (GEAC), formerly called the Genetic Engineering Approval Committee until it was renamed in 2010. GEAC's authority comes through the 1989 biosafety Rules notified under the 1986 Act. Its name changed from 'Approval' to 'Appraisal' Committee in July 2010.","hi":"आनुवंशिक अभियांत्रिकी आकलन समिति (GEAC), जिसे 2010 में नाम परिवर्तन होने से पहले आनुवंशिक अभियांत्रिकी अनुमोदन समिति कहा जाता था। GEAC की प्राधिकरण 1986 अधिनियम के अंतर्गत अधिसूचित 1989 जैव-सुरक्षा नियम से आती है। जुलाई 2010 में इसका नाम 'अनुमोदन' से 'आकलन' समिति किया गया।"}},{"q":{"en":"When was the National Green Tribunal (NGT) established and what is its purpose?","hi":"नेशनल ग्रीन ट्रिब्यूनल (NGT) की स्थापना कब हुई और इसका उद्देश्य क्या है?"},"a":{"en":"Established on 18 October 2010 under the National Green Tribunal Act, 2010, for effective and expeditious disposal of environmental cases, including relief and compensation where applicable.","hi":"18 अक्टूबर 2010 को राष्ट्रीय हरित अधिकरण अधिनियम, 2010 के तहत स्थापित; पर्यावरणीय मामलों के प्रभावी और त्वरित निपटारे तथा लागू मामलों में राहत/क्षतिपूर्ति के लिए।"},"o":[{"en":"Established on 18 October 2010 under the National Green Tribunal Act, 2010, for effective and expeditious disposal of environmental cases, including relief and compensation where applicable.","hi":"18 अक्टूबर 2010 को राष्ट्रीय हरित अधिकरण अधिनियम, 2010 के तहत स्थापित; पर्यावरणीय मामलों के प्रभावी और त्वरित निपटारे तथा लागू मामलों में राहत/क्षतिपूर्ति के लिए।"},{"en":"Established in 1986 — to approve genetic engineering projects.","hi":"1986 में स्थापित - जेनेटिक इंजीनियरिंग परियोजनाओं को मंजूरी देने के लिए।"},{"en":"Established in 1992 — to implement Agenda-21.","hi":"1992 में स्थापित - एजेंडा-21 को लागू करने के लिए।"},{"en":"Established in 1950 — for weather forecasting.","hi":"1950 में स्थापित - मौसम की भविष्यवाणी के लिए।"}],"exp":{"en":"Established on 18 October 2010 under the National Green Tribunal Act, 2010, for effective and expeditious disposal of environmental cases, including relief and compensation where applicable. The NGT is a specialised environmental judicial body. Its jurisdiction includes environmental protection, forests and natural resources, enforcement of environmental legal rights, and relief or compensation in applicable cases.","hi":"18 अक्टूबर 2010 को राष्ट्रीय हरित अधिकरण अधिनियम, 2010 के तहत स्थापित; पर्यावरणीय मामलों के प्रभावी और त्वरित निपटारे तथा लागू मामलों में राहत/क्षतिपूर्ति के लिए। NGT विशिष्ट पर्यावरणीय न्यायिक निकाय है। इसकी अधिकार-क्षेत्र पर्यावरण संरक्षण, वन/प्राकृतिक संसाधनों, पर्यावरणीय कानूनी अधिकार प्रवर्तन और लागू मामलों में राहत/क्षतिपूर्ति शामिल करती है।"}},{"q":{"en":"What is the Central Pollution Control Board (CPCB), and when was it constituted?","hi":"केंद्रीय प्रदूषण नियंत्रण बोर्ड (CPCB) क्या है और इसे कब गठित किया गया?"},"a":{"en":"A statutory pollution-control body constituted on 22 September 1974 under the Water (Prevention and Control of Pollution) Act, 1974; it also has functions under the Air Act, 1981 and provides technical services under the Environment (Protection) Act, 1986.","hi":"जल (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1974 के तहत 22 सितंबर 1974 को गठित वैधानिक प्रदूषण-नियंत्रण निकाय; इसे वायु अधिनियम, 1981 के तहत भी कार्य मिले हैं और पर्यावरण (संरक्षण) अधिनियम, 1986 के तहत तकनीकी सेवाएँ देता है।"},"o":[{"en":"A statutory pollution-control body constituted on 22 September 1974 under the Water (Prevention and Control of Pollution) Act, 1974; it also has functions under the Air Act, 1981 and provides technical services under the Environment (Protection) Act, 1986.","hi":"जल (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1974 के तहत 22 सितंबर 1974 को गठित वैधानिक प्रदूषण-नियंत्रण निकाय; इसे वायु अधिनियम, 1981 के तहत भी कार्य मिले हैं और पर्यावरण (संरक्षण) अधिनियम, 1986 के तहत तकनीकी सेवाएँ देता है।"},{"en":"A non-governmental international organization.","hi":"एक गैर-सरकारी अंतर्राष्ट्रीय संगठन।"},{"en":"A court system for environmental criminals.","hi":"पर्यावरण अपराधियों के लिए एक अदालत प्रणाली।"},{"en":"A global weather monitoring institute.","hi":"एक वैश्विक मौसम निगरानी संस्थान।"}],"exp":{"en":"A statutory pollution-control body constituted on 22 September 1974 under the Water (Prevention and Control of Pollution) Act, 1974; it also has functions under the Air Act, 1981 and provides technical services under the Environment (Protection) Act, 1986. CPCB was created under the Water Act and later received functions under the Air Act; it helps prevent, control and abate water and air pollution and supports national pollution-control standards and monitoring.","hi":"जल (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1974 के तहत 22 सितंबर 1974 को गठित वैधानिक प्रदूषण-नियंत्रण निकाय; इसे वायु अधिनियम, 1981 के तहत भी कार्य मिले हैं और पर्यावरण (संरक्षण) अधिनियम, 1986 के तहत तकनीकी सेवाएँ देता है। CPCB जल अधिनियम के अंतर्गत बनाया गया और बाद में वायु अधिनियम के कार्य भी मिले; यह जल/वायु प्रदूषण रोकने, नियंत्रित करने और कम करने तथा राष्ट्रीय प्रदूषण मानक/निगरानी में प्रमुख भूमिका निभाता है।"}},{"q":{"en":"When and where was Agenda-21 adopted?","hi":"एजेंडा-21 कब और कहाँ अपनाया गया?"},"a":{"en":"At the United Nations Conference on Environment and Development (Rio Earth Summit), Rio de Janeiro, Brazil, in June 1992.","hi":"जून 1992 में रियो डी जेनेरो, ब्राज़ील में पर्यावरण एवं विकास पर संयुक्त राष्ट्र सम्मेलन (रियो पृथ्वी शिखर सम्मेलन) में।"},"o":[{"en":"At the United Nations Conference on Environment and Development (Rio Earth Summit), Rio de Janeiro, Brazil, in June 1992.","hi":"जून 1992 में रियो डी जेनेरो, ब्राज़ील में पर्यावरण एवं विकास पर संयुक्त राष्ट्र सम्मेलन (रियो पृथ्वी शिखर सम्मेलन) में।"},{"en":"It was adopted at the Kyoto Protocol (1997).","hi":"इसे क्योटो प्रोटोकॉल (1997) में अपनाया गया था।"},{"en":"It was adopted in Geneva (1950).","hi":"इसे जिनेवा (1950) में अपनाया गया था।"},{"en":"It was adopted in Nairobi (1972).","hi":"इसे नैरोबी (1972) में अपनाया गया था।"}],"exp":{"en":"At the United Nations Conference on Environment and Development (Rio Earth Summit), Rio de Janeiro, Brazil, in June 1992. Agenda 21 was adopted by more than 178 governments at UNCED in Rio de Janeiro, held from 3–14 June 1992.","hi":"जून 1992 में रियो डी जेनेरो, ब्राज़ील में पर्यावरण एवं विकास पर संयुक्त राष्ट्र सम्मेलन (रियो पृथ्वी शिखर सम्मेलन) में। एजेंडा 21 को रियो डी जेनेरो में 3-14 जून 1992 को आयोजित UNCED में 178 से अधिक सरकारों ने अपनाया।"}},{"q":{"en":"What was the aim of Agenda-21?","hi":"एजेंडा-21 का उद्देश्य क्या था?"},"a":{"en":"To provide a comprehensive global, national and local action plan for sustainable development by integrating environmental protection with social and economic development.","hi":"पर्यावरण संरक्षण को सामाजिक और आर्थिक विकास के साथ एकीकृत करते हुए सतत विकास के लिए वैश्विक, राष्ट्रीय और स्थानीय व्यापक कार्रवाई योजना प्रदान करना।"},"o":[{"en":"To provide a comprehensive global, national and local action plan for sustainable development by integrating environmental protection with social and economic development.","hi":"पर्यावरण संरक्षण को सामाजिक और आर्थिक विकास के साथ एकीकृत करते हुए सतत विकास के लिए वैश्विक, राष्ट्रीय और स्थानीय व्यापक कार्रवाई योजना प्रदान करना।"},{"en":"To ban all fossil fuels worldwide immediately.","hi":"सभी जीवाश्म ईंधन को विश्वभर में तत्काल प्रतिबंधित करना।"},{"en":"To establish the National Green Tribunal in India.","hi":"भारत में राष्ट्रीय हरित अधिकरण स्थापित करना।"},{"en":"To create a global weather-forecasting organisation.","hi":"वैश्विक मौसम-पूर्वानुमान संगठन बनाना।"}],"exp":{"en":"To provide a comprehensive global, national and local action plan for sustainable development by integrating environmental protection with social and economic development. Agenda 21 covers social and economic dimensions, conservation and management of resources, participation of major groups and implementation mechanisms; poverty reduction is one element within this broader sustainable-development programme.","hi":"पर्यावरण संरक्षण को सामाजिक और आर्थिक विकास के साथ एकीकृत करते हुए सतत विकास के लिए वैश्विक, राष्ट्रीय और स्थानीय व्यापक कार्रवाई योजना प्रदान करना। एजेंडा 21 सामाजिक/आर्थिक आयाम, संसाधन संरक्षण-प्रबंधन, प्रमुख समूह की भागीदारी और क्रियान्वयन तंत्र समाहित करता है; गरीबी कमी इस व्यापक सतत-विकास कार्यक्रम का एक भाग है।"}}]},{"title":{"en":"4. Environmental Organisations, Institutions & Programmes","hi":"4। पर्यावरण संगठन, संस्थान और कार्यक्रम"},"questions":[{"q":{"en":"When was the World Meteorological Organization (WMO) established and where is its HQ?","hi":"विश्व मौसम विज्ञान संगठन (WMO) की स्थापना कब हुई और इसका मुख्यालय कहाँ है?"},"a":{"en":"Established on 23 March 1950; headquarters in Geneva, Switzerland.","hi":"23 मार्च 1950 को स्थापित; मुख्यालय जिनेवा, स्विट्जरलैंड में।"},"o":[{"en":"Established on 23 March 1950; headquarters in Geneva, Switzerland.","hi":"23 मार्च 1950 को स्थापित; मुख्यालय जिनेवा, स्विट्जरलैंड में।"},{"en":"Established in 1972; HQ is in Nairobi (Kenya).","hi":"1972 में स्थापित; मुख्यालय नैरोबी (केन्या) में है।"},{"en":"Established in 1958; HQ is in Nagpur (India).","hi":"1958 में स्थापित; मुख्यालय नागपुर (भारत) में है।"},{"en":"Established in 1971; HQ is in Amsterdam (Netherlands).","hi":"1971 में स्थापित; मुख्यालय एम्स्टर्डम (नीदरलैंड) में है।"}],"exp":{"en":"Established on 23 March 1950; headquarters in Geneva, Switzerland. The WMO Convention entered into force on 23 March 1950; WMO became a UN specialised agency in 1951. Its headquarters is in Geneva.","hi":"23 मार्च 1950 को स्थापित; मुख्यालय जिनेवा, स्विट्जरलैंड में। WMO अभिसमय 23 मार्च 1950 को प्रभावी आया; WMO 1951 में UN विशिष्ट संस्था बना। इसका मुख्यालय जिनेवा में है।"}},{"q":{"en":"What is the full form and historical origin of NEERI, and where is it located?","hi":"NEERI का पूरा रूप और ऐतिहासिक उत्पत्ति क्या है, और यह कहाँ स्थित है?"},"a":{"en":"National Environmental Engineering Research Institute, Nagpur — established in 1958 as the Central Public Health Engineering Research Institute (CPHERI) and renamed NEERI in 1974.","hi":"राष्ट्रीय पर्यावरण अभियांत्रिकी अनुसंधान संस्थान, नागपुर - 1958 में केंद्रीय जनस्वास्थ्य अभियांत्रिकी अनुसंधान संस्थान (CPHERI) के रूप में स्थापित और 1974 में इसका नाम NEERI रखा गया।"},"o":[{"en":"National Environmental Engineering Research Institute, Nagpur — established in 1958 as the Central Public Health Engineering Research Institute (CPHERI) and renamed NEERI in 1974.","hi":"राष्ट्रीय पर्यावरण अभियांत्रिकी अनुसंधान संस्थान, नागपुर - 1958 में केंद्रीय जनस्वास्थ्य अभियांत्रिकी अनुसंधान संस्थान (CPHERI) के रूप में स्थापित और 1974 में इसका नाम NEERI रखा गया।"},{"en":"National Ecology and Environment Research Institute — established in 1972 in New Delhi.","hi":"राष्ट्रीय पारिस्थितिकी और पर्यावरण अनुसंधान संस्थान - 1972 में नया दिल्ली में स्थापित।"},{"en":"National Earth Engineering Research Institute — established in 1950 in Mumbai.","hi":"राष्ट्रीय पृथ्वी अभियांत्रिकी अनुसंधान संस्थान - 1950 में मुंबई में स्थापित।"},{"en":"Nature and Ecology Engineering Research Institute — established in 1986 in Bengaluru.","hi":"प्रकृति और पारिस्थितिकी अभियांत्रिकी अनुसंधान संस्थान - 1986 में बेंगलुरु में स्थापित।"}],"exp":{"en":"National Environmental Engineering Research Institute, Nagpur — established in 1958 as the Central Public Health Engineering Research Institute (CPHERI) and renamed NEERI in 1974. The institute's institutional history begins in 1958 as CPHERI under CSIR. As environmental concerns broadened, it was rechristened NEERI in 1974 and remains headquartered in Nagpur.","hi":"राष्ट्रीय पर्यावरण अभियांत्रिकी अनुसंधान संस्थान, नागपुर - 1958 में केंद्रीय जनस्वास्थ्य अभियांत्रिकी अनुसंधान संस्थान (CPHERI) के रूप में स्थापित और 1974 में इसका नाम NEERI रखा गया। संस्थान की संस्थागत इतिहास 1958 में CSIR के अंतर्गत CPHERI से शुरू होती है। पर्यावरणीय मुद्दों विस्तार होने पर 1974 में इसे NEERI नाम परिवर्तन किया गया और मुख्यालय नागपुर में है।"}},{"q":{"en":"When was Greenpeace International formed and where is it based?","hi":"ग्रीनपीस इंटरनेशनल कब गठित हुआ और यह कहाँ आधारित है?"},"a":{"en":"Greenpeace International was formed in 1979 and is based in Amsterdam, Netherlands; the Greenpeace movement's first famous campaign voyage dates to 1971.","hi":"ग्रीनपीस इंटरनेशनल 1979 में गठित हुआ और एम्स्टर्डम, नीदरलैंड में आधारित है; ग्रीनपीस आंदोलन की पहली प्रसिद्ध अभियान यात्रा 1971 की है।"},"o":[{"en":"Greenpeace International was formed in 1979 and is based in Amsterdam, Netherlands; the Greenpeace movement's first famous campaign voyage dates to 1971.","hi":"ग्रीनपीस इंटरनेशनल 1979 में गठित हुआ और एम्स्टर्डम, नीदरलैंड में आधारित है; ग्रीनपीस आंदोलन की पहली प्रसिद्ध अभियान यात्रा 1971 की है।"},{"en":"It was formed in 1950 and is based in Geneva.","hi":"यह 1950 में गठित हुआ और जिनेवा में आधारित है।"},{"en":"It was formed in 1972 and is based in Nairobi.","hi":"यह 1972 में गठित हुआ और नैरोबी में आधारित है।"},{"en":"It was formed in 1986 and is based in New York.","hi":"यह 1986 में गठित हुआ और न्यूयॉर्क में आधारित है।"}],"exp":{"en":"Greenpeace International was formed in 1979 and is based in Amsterdam, Netherlands; the Greenpeace movement's first famous campaign voyage dates to 1971. The wider Greenpeace movement traces its famous first voyage to 1971, but the international coordinating organisation Greenpeace International was created in Amsterdam in 1979.","hi":"ग्रीनपीस इंटरनेशनल 1979 में गठित हुआ और एम्स्टर्डम, नीदरलैंड में आधारित है; ग्रीनपीस आंदोलन की पहली प्रसिद्ध अभियान यात्रा 1971 की है। व्यापक ग्रीनपीस आंदोलन की प्रसिद्ध पहला यात्रा 1971 की है, लेकिन अंतरराष्ट्रीय समन्वयकारी संगठन ग्रीनपीस इंटरनेशनल एम्स्टर्डम में 1979 में स्थापित हुआ।"}},{"q":{"en":"What is the full form of UNEP, and when and where was it established?","hi":"UNEP का पूर्ण रूप क्या है, और इसकी स्थापना कब और कहाँ हुई?"},"a":{"en":"United Nations Environment Programme — established by the UN General Assembly in 1972; headquarters in Nairobi, Kenya.","hi":"संयुक्त राष्ट्र पर्यावरण कार्यक्रम - संयुक्त राष्ट्र महासभा द्वारा 1972 में स्थापित; मुख्यालय नैरोबी, केन्या में।"},"o":[{"en":"United Nations Environment Programme — established by the UN General Assembly in 1972; headquarters in Nairobi, Kenya.","hi":"संयुक्त राष्ट्र पर्यावरण कार्यक्रम - संयुक्त राष्ट्र महासभा द्वारा 1972 में स्थापित; मुख्यालय नैरोबी, केन्या में।"},{"en":"United Nations Ecology Programme — established in 1950, HQ is in Geneva (Switzerland).","hi":"संयुक्त राष्ट्र पारिस्थितिकी कार्यक्रम - 1950 में स्थापित, मुख्यालय जिनेवा (स्विट्जरलैंड) में है।"},{"en":"Universal Nature and Environment Programme — established in 1971, HQ is in Amsterdam.","hi":"यूनिवर्सल नेचर एंड एनवायरनमेंट प्रोग्राम - 1971 में स्थापित, मुख्यालय एम्स्टर्डम में है।"},{"en":"United Nations Earth Programme — established in 1992, HQ is in Rio de Janeiro.","hi":"संयुक्त राष्ट्र पृथ्वी कार्यक्रम - 1992 में स्थापित, मुख्यालय रियो डी जनेरियो में है।"}],"exp":{"en":"United Nations Environment Programme — established by the UN General Assembly in 1972; headquarters in Nairobi, Kenya. UNEP was created following the 1972 Stockholm Conference and UN General Assembly action. It coordinates and catalyses environmental work across the UN system and is headquartered in Nairobi.","hi":"संयुक्त राष्ट्र पर्यावरण कार्यक्रम - संयुक्त राष्ट्र महासभा द्वारा 1972 में स्थापित; मुख्यालय नैरोबी, केन्या में। UNEP 1972 स्टॉकहोम सम्मेलन और संयुक्त राष्ट्र महासभा कार्रवाई के बाद स्थापित हुआ। यह UN प्रणाली में पर्यावरणीय कार्य समन्वय/प्रेरित करता है और मुख्यालय नैरोबी में है।"}},{"q":{"en":"Where is UNEP headquartered?","hi":"UNEP का मुख्यालय कहाँ है?"},"a":{"en":"Nairobi, Kenya — UNEP is one of the major UN bodies headquartered in Africa.","hi":"नैरोबी, केन्या - UNEP अफ्रीका में मुख्यालय स्थित प्रमुख UN निकाय में से एक है।"},"o":[{"en":"Nairobi, Kenya — UNEP is one of the major UN bodies headquartered in Africa.","hi":"नैरोबी, केन्या - UNEP अफ्रीका में मुख्यालय स्थित प्रमुख UN निकाय में से एक है।"},{"en":"The HQ is in Geneva, but students guess Nairobi.","hi":"मुख्यालय जिनेवा में है, लेकिन छात्रों का अनुमान नैरोबी है।"},{"en":"The HQ changes every year.","hi":"मुख्यालय हर साल बदलता है।"},{"en":"UNEP does not have a physical HQ.","hi":"यूएनईपी का कोई भौतिक मुख्यालय नहीं है।"}],"exp":{"en":"Nairobi, Kenya — UNEP is one of the major UN bodies headquartered in Africa. Nairobi is a distinctive headquarters location because many other major UN bodies are concentrated in Geneva, New York, Vienna or Rome.","hi":"नैरोबी, केन्या - UNEP अफ्रीका में मुख्यालय स्थित प्रमुख UN निकाय में से एक है। नैरोबी विशिष्ट मुख्यालय स्थान है क्योंकि कई अन्य प्रमुख UN निकाय जिनेवा, न्यूयॉर्क, वियना या रोम में संकेंद्रित हैं।"}}]},{"title":{"en":"5. Major Environmental Movements","hi":"5। प्रमुख पर्यावरण आंदोलन"},"questions":[{"q":{"en":"Where did the Chipko Movement emerge, and which prominent figures are associated with it?","hi":"चिपको आंदोलन कहाँ उभरा और इससे कौन-से प्रमुख व्यक्ति संबद्ध हैं?"},"a":{"en":"In the Garhwal Himalaya of present-day Uttarakhand in the 1970s; prominent figures included Chandi Prasad Bhatt, Gaura Devi and Sunderlal Bahuguna, along with many local villagers and women.","hi":"1970 के दशक में वर्तमान उत्तराखंड के गढ़वाल हिमालय में; प्रमुख व्यक्तियों में चंडी प्रसाद भट्ट, गौरा देवी और सुंदरलाल बहुगुणा सहित अनेक स्थानीय ग्रामीण और महिलाएँ शामिल थे।"},"o":[{"en":"In the Garhwal Himalaya of present-day Uttarakhand in the 1970s; prominent figures included Chandi Prasad Bhatt, Gaura Devi and Sunderlal Bahuguna, along with many local villagers and women.","hi":"1970 के दशक में वर्तमान उत्तराखंड के गढ़वाल हिमालय में; प्रमुख व्यक्तियों में चंडी प्रसाद भट्ट, गौरा देवी और सुंदरलाल बहुगुणा सहित अनेक स्थानीय ग्रामीण और महिलाएँ शामिल थे।"},{"en":"In Karnataka in 1983, led by Pandurang Hegde.","hi":"1983 में कर्नाटक में, पांडुरंग हेगड़े के नेतृत्व में।"},{"en":"In the Narmada Valley, led only by Medha Patkar.","hi":"नर्मदा घाटी में, केवल मेधा पाटकर के नेतृत्व में।"},{"en":"In Gwaldam in 1995, led by Kalyan Singh Rawat.","hi":"1995 में ग्वालदम में, कल्याण सिंह रावत के नेतृत्व में।"}],"exp":{"en":"In the Garhwal Himalaya of present-day Uttarakhand in the 1970s; prominent figures included Chandi Prasad Bhatt, Gaura Devi and Sunderlal Bahuguna, along with many local villagers and women. Chipko was a decentralised people's movement rather than the work of a single leader. Chandi Prasad Bhatt helped initiate the 1973 movement, Gaura Devi led the famous 1974 Reni action, and Sunderlal Bahuguna helped spread its message.","hi":"1970 के दशक में वर्तमान उत्तराखंड के गढ़वाल हिमालय में; प्रमुख व्यक्तियों में चंडी प्रसाद भट्ट, गौरा देवी और सुंदरलाल बहुगुणा सहित अनेक स्थानीय ग्रामीण और महिलाएँ शामिल थे। चिपको एकमात्र नेता का आंदोलन नहीं बल्कि विकेंद्रीकृत जन आंदोलन था। चंडी प्रसाद भट्ट ने 1973 आंदोलन आरंभ करने में भूमिका निभाई, गौरा देवी ने प्रसिद्ध 1974 रेणी कार्रवाई का नेतृत्व किया और सुंदरलाल बहुगुणा ने संदेश का प्रसार किया।"}},{"q":{"en":"When and where did the Appiko Movement begin, and who is prominently associated with it?","hi":"अप्पिको आंदोलन कब और कहाँ आरंभ हुआ और इससे कौन प्रमुख रूप से संबद्ध है?"},"a":{"en":"In September 1983 in the Salkani/Sirsi area of Uttara Kannada, Karnataka; Pandurang Hegde is prominently associated with facilitating and spreading the movement.","hi":"सितंबर 1983 में उत्तरा कन्नड़, कर्नाटक के सलकानी/सिरसी क्षेत्र में; पांडुरंग हेगड़े आंदोलन को सुगम बनाने और उसका प्रसार करने से प्रमुख रूप से संबद्ध हैं।"},"o":[{"en":"In September 1983 in the Salkani/Sirsi area of Uttara Kannada, Karnataka; Pandurang Hegde is prominently associated with facilitating and spreading the movement.","hi":"सितंबर 1983 में उत्तरा कन्नड़, कर्नाटक के सलकानी/सिरसी क्षेत्र में; पांडुरंग हेगड़े आंदोलन को सुगम बनाने और उसका प्रसार करने से प्रमुख रूप से संबद्ध हैं।"},{"en":"In 1973 in Uttarakhand; leader was Sunderlal Bahuguna.","hi":"1973 में उत्तराखंड में; नेता सुंदरलाल बहुगुणा थे।"},{"en":"In 1985 in the Narmada Valley; leader was Medha Patkar.","hi":"1985 में नर्मदा घाटी में; नेता मेधा पाटकर थीं।"},{"en":"In 1996 in Chamoli; leader was Kalyan Singh Rawat.","hi":"1996 में चमोली में; नेता कल्याण सिंह रावत थे।"}],"exp":{"en":"In September 1983 in the Salkani/Sirsi area of Uttara Kannada, Karnataka; Pandurang Hegde is prominently associated with facilitating and spreading the movement. 'Appiko' means 'to hug' in Kannada. The movement drew inspiration from Chipko and mobilised villagers against commercial felling in the Western Ghats.","hi":"सितंबर 1983 में उत्तरा कन्नड़, कर्नाटक के सलकानी/सिरसी क्षेत्र में; पांडुरंग हेगड़े आंदोलन को सुगम बनाने और उसका प्रसार करने से प्रमुख रूप से संबद्ध हैं। कन्नड़ में 'अप्पिको' का अर्थ 'चिपकना' है। आंदोलन ने चिपको से प्रेरणा लेकर पश्चिमी घाट में वाणिज्यिक कटाई के विरुद्ध ग्रामीणों को संगठित किया।"}},{"q":{"en":"What is the Appiko Movement known as, and why?","hi":"अप्पिको आंदोलन को क्या कहा जाता है, और क्यों?"},"a":{"en":"It is called the 'Southern version' of the Chipko Movement because both use the same tree-hugging concept, while the region and leaders are different.","hi":"इसे चिपको आंदोलन का 'दक्षिणी संस्करण' कहा जाता है क्योंकि दोनों में पेड़ों से चिपकने की समान अवधारणा है, जबकि क्षेत्र और नेता अलग हैं।"},"o":[{"en":"It is called the 'Southern version' of the Chipko Movement because both use the same tree-hugging concept, while the region and leaders are different.","hi":"इसे चिपको आंदोलन का 'दक्षिणी संस्करण' कहा जाता है क्योंकि दोनों में पेड़ों से चिपकने की समान अवधारणा है, जबकि क्षेत्र और नेता अलग हैं।"},{"en":"Known as the 'Northern version' of Narmada Bachao Andolan due to dam protests.","hi":"बांध के विरोध के कारण इसे नर्मदा बचाओ आंदोलन के 'उत्तरी संस्करण' के रूप में जाना जाता है।"},{"en":"Known as the Maiti Movement because it focused on wedding-linked tree planting.","hi":"इसे मैती आंदोलन कहा जाता है क्योंकि यह विवाह-संबंधित वृक्षारोपण पर केंद्रित था।"},{"en":"Known as the Western Ghats revolt against mining.","hi":"खनन के खिलाफ पश्चिमी घाट विद्रोह के रूप में जाना जाता है।"}],"exp":{"en":"It is called the 'Southern version' of the Chipko Movement because both use the same tree-hugging concept, while the region and leaders are different. Both movements used non-violent tree-hugging to resist destructive forest felling, but Chipko arose in the Himalayan region while Appiko arose in the Western Ghats of Karnataka.","hi":"इसे चिपको आंदोलन का 'दक्षिणी संस्करण' कहा जाता है क्योंकि दोनों में पेड़ों से चिपकने की समान अवधारणा है, जबकि क्षेत्र और नेता अलग हैं। दोनों आंदोलन ने विनाशकारी वन कटाई विरोध करने के लिए अहिंसक वृक्ष-आलिंगन उपयोग किया, लेकिन चिपको हिमालयी क्षेत्र में और अप्पिको कर्नाटक के पश्चिमी घाट में उभरा।"}},{"q":{"en":"When did the Narmada Bachao Andolan emerge, and who is prominently associated with it?","hi":"नर्मदा बचाओ आंदोलन कब उभरा और इससे कौन प्रमुख रूप से संबद्ध है?"},"a":{"en":"It emerged around 1985 in the Narmada Valley under the prominent leadership of Medha Patkar; related local groups later consolidated more broadly under the NBA banner.","hi":"यह लगभग 1985 नर्मदा घाटी में उभरा और मेधा पाटकर इसकी प्रमुख नेताओं में रहीं; संबंधित स्थानीय समूह बाद में व्यापक NBA मंच के अंतर्गत संगठित हुए।"},"o":[{"en":"It emerged around 1985 in the Narmada Valley under the prominent leadership of Medha Patkar; related local groups later consolidated more broadly under the NBA banner.","hi":"यह लगभग 1985 नर्मदा घाटी में उभरा और मेधा पाटकर इसकी प्रमुख नेताओं में रहीं; संबंधित स्थानीय समूह बाद में व्यापक NBA मंच के अंतर्गत संगठित हुए।"},{"en":"Started in 1973 in Uttarakhand; leader was Sunderlal Bahuguna.","hi":"1973 में उत्तराखंड में शुरू हुआ; नेता सुंदरलाल बहुगुणा थे।"},{"en":"Started in 1983 in Karnataka; leader was Pandurang Hegde.","hi":"1983 में कर्नाटक में शुरू हुआ; नेता पांडुरंग हेगड़े थे।"},{"en":"Started in 1996 in Chamoli; leader was Kalyan Singh Rawat.","hi":"1996 में चमोली में शुरू हुआ; नेता कल्याण सिंह रावत थे।"}],"exp":{"en":"It emerged around 1985 in the Narmada Valley under the prominent leadership of Medha Patkar; related local groups later consolidated more broadly under the NBA banner. The movement challenged the social and ecological costs of large dams in the Narmada Valley, including displacement and rehabilitation issues; several activists and affected communities participated alongside Medha Patkar.","hi":"यह लगभग 1985 नर्मदा घाटी में उभरा और मेधा पाटकर इसकी प्रमुख नेताओं में रहीं; संबंधित स्थानीय समूह बाद में व्यापक NBA मंच के अंतर्गत संगठित हुए। आंदोलन ने नर्मदा घाटी के बड़े बाँधों के सामाजिक/पारिस्थितिक खर्च, विस्थापन और पुनर्वास संबंधी मुद्दों को चुनौती दी; मेधा पाटकर के साथ कई कार्यकर्ता और प्रभावित समुदाय जुड़े।"}},{"q":{"en":"When and where did the Maiti Movement begin, and who founded it?","hi":"मैती आंदोलन कब और कहाँ आरंभ हुआ और इसके संस्थापक कौन हैं?"},"a":{"en":"In 1995 at Gwaldam in Chamoli, Uttarakhand; it was pioneered by Kalyan Singh Rawat and linked tree planting with social customs such as weddings.","hi":"1995 में ग्वालदम, चमोली, उत्तराखंड में; इसे कल्याण सिंह रावत ने आरंभ किया और वृक्षारोपण को विवाह जैसी सामाजिक परंपराओं से जोड़ा।"},"o":[{"en":"In 1995 at Gwaldam in Chamoli, Uttarakhand; it was pioneered by Kalyan Singh Rawat and linked tree planting with social customs such as weddings.","hi":"1995 में ग्वालदम, चमोली, उत्तराखंड में; इसे कल्याण सिंह रावत ने आरंभ किया और वृक्षारोपण को विवाह जैसी सामाजिक परंपराओं से जोड़ा।"},{"en":"In 1983 in Karnataka; it was led by Pandurang Hegde.","hi":"1983 में कर्नाटक में; इसका नेतृत्व पांडुरंग हेगड़े ने किया।"},{"en":"In 1985 in the Narmada Valley; it was led by Medha Patkar.","hi":"1985 में नर्मदा घाटी में; इसका नेतृत्व मेधा पाटकर ने किया।"},{"en":"In 1973 in Garhwal; it was started by Chandi Prasad Bhatt.","hi":"1973 में गढ़वाल में; इसे चंडी प्रसाद भट्ट ने आरंभ किया।"}],"exp":{"en":"In 1995 at Gwaldam in Chamoli, Uttarakhand; it was pioneered by Kalyan Singh Rawat and linked tree planting with social customs such as weddings. 'Maiti' is linked to the idea of a married woman's parental home. The movement integrated tree planting into wedding and community customs, turning afforestation into a social tradition.","hi":"1995 में ग्वालदम, चमोली, उत्तराखंड में; इसे कल्याण सिंह रावत ने आरंभ किया और वृक्षारोपण को विवाह जैसी सामाजिक परंपराओं से जोड़ा। 'मैती' विवाहित महिला के मायके की अवधारणा से संबंधित है। आंदोलन ने वृक्षारोपण को विवाह/समुदाय परंपराओं के साथ एकीकृत करके वनीकरण को सामाजिक परंपरा बनाया।"}}]},{"title":{"en":"6. Important Days & Facts","hi":"6। महत्वपूर्ण दिन और तथ्य"},"questions":[{"q":{"en":"When is World Wildlife Day celebrated?","hi":"विश्व वन्यजीव दिवस (विश्व वन्यजीव दिवस) कब मनाया जाता है?"},"a":{"en":"3rd March.","hi":"3 मार्च।"},"o":[{"en":"3rd March.","hi":"3 मार्च।"},{"en":"21st March.","hi":"21 मार्च।"},{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"5th June.","hi":"5 जून।"}],"exp":{"en":"3rd March. The UN General Assembly proclaimed 3 March as World Wildlife Day because it is the date on which CITES was adopted in 1973.","hi":"3 मार्च। संयुक्त राष्ट्र महासभा ने 3 मार्च को विश्व वन्यजीव दिवस घोषित किया क्योंकि इसी तिथि पर 1973 में CITES अपनाया हुआ था।"}},{"q":{"en":"When is the International Day of Forests observed?","hi":"अंतरराष्ट्रीय वन दिवस कब मनाया जाता है?"},"a":{"en":"21st March.","hi":"21 मार्च।"},"o":[{"en":"21st March.","hi":"21 मार्च।"},{"en":"3rd March.","hi":"3 मार्च।"},{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"29th July.","hi":"29 जुलाई।"}],"exp":{"en":"21st March. The official UN observance is called the International Day of Forests; the UN General Assembly proclaimed 21 March for this purpose in 2012.","hi":"21 मार्च। आधिकारिक UN दिवस का नाम अंतरराष्ट्रीय वन दिवस है; संयुक्त राष्ट्र महासभा ने 2012 में 21 मार्च को इस उद्देश्य के लिए घोषित किया।"}},{"q":{"en":"When is Earth Day observed?","hi":"पृथ्वी दिवस कब मनाया जाता है?"},"a":{"en":"22nd April.","hi":"22 अप्रैल।"},"o":[{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"21st March.","hi":"21 मार्च।"},{"en":"5th June.","hi":"5 जून।"},{"en":"16th September.","hi":"16 सितम्बर।"}],"exp":{"en":"22nd April. Earth Day is observed globally on 22 April and is distinct from World Environment Day on 5 June.","hi":"22 अप्रैल। पृथ्वी दिवस वैश्विक रूप से 22 अप्रैल को मनाया जाता है और 5 जून के विश्व पर्यावरण दिवस से अलग है।"}},{"q":{"en":"When is World Environment Day celebrated?","hi":"विश्व पर्यावरण दिवस (विश्व पर्यावरण दिवस) कब मनाया जाता है?"},"a":{"en":"5th June.","hi":"5 जून।"},"o":[{"en":"5th June.","hi":"5 जून।"},{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"29th July.","hi":"29 जुलाई।"},{"en":"16th September.","hi":"16 सितम्बर।"}],"exp":{"en":"5th June. World Environment Day is led by UNEP and has been marked annually on 5 June since 1973 as a global platform for environmental awareness and action.","hi":"5 जून। विश्व पर्यावरण दिवस UNEP नेतृत्व करता है और 1973 से प्रतिवर्ष 5 जून को पर्यावरणीय जागरूकता/कार्रवाई के वैश्विक मंच के रूप में मनाया जाता है।"}},{"q":{"en":"When is International Tiger Day celebrated?","hi":"अंतर्राष्ट्रीय बाघ दिवस (अंतरराष्ट्रीय बाघ दिवस) कब मनाया जाता है?"},"a":{"en":"29th July.","hi":"29 जुलाई।"},"o":[{"en":"29th July.","hi":"29 जुलाई।"},{"en":"5th June.","hi":"5 जून।"},{"en":"16th September.","hi":"16 सितम्बर।"},{"en":"3rd March.","hi":"3 मार्च।"}],"exp":{"en":"29th July. Global/International Tiger Day is observed on 29 July, linked to the 2010 St Petersburg tiger summit and the global commitment to tiger conservation.","hi":"29 जुलाई। वैश्विक/अंतरराष्ट्रीय बाघ दिवस 29 जुलाई को मनाया जाता है और 2010 सेंट पीटर्सबर्ग बाघ शिखर सम्मेलन तथा वैश्विक बाघ-संरक्षण प्रतिबद्धता से संबंधित है।"}},{"q":{"en":"When is the International Day for the Preservation of the Ozone Layer (World Ozone Day) observed?","hi":"अंतरराष्ट्रीय ओजोन परत संरक्षण दिवस (विश्व ओजोन दिन) कब मनाया जाता है?"},"a":{"en":"16th September.","hi":"16 सितंबर।"},"o":[{"en":"16th September.","hi":"16 सितंबर।"},{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"29th July.","hi":"29 जुलाई।"},{"en":"5th June.","hi":"5 जून।"}],"exp":{"en":"16th September. The UN's official name is the International Day for the Preservation of the Ozone Layer. It commemorates the 16 September 1987 signing of the Montreal Protocol.","hi":"16 सितंबर। UN का आधिकारिक नाम अंतरराष्ट्रीय ओजोन परत संरक्षण दिवस है। यह 16 सितंबर 1987 को मॉन्ट्रियल प्रोटोकॉल पर हस्ताक्षर की वर्षगांठ का स्मरण कराता है।"}},{"q":{"en":"When is World Habitat Day celebrated?","hi":"विश्व पर्यावास दिवस (विश्व पर्यावास दिवस) कब मनाया जाता है?"},"a":{"en":"First Monday of October — it has no fixed calendar date, whereas the other environmental days listed here have fixed dates.","hi":"अक्टूबर का पहला सोमवार - इसकी कोई निश्चित कैलेंडर तिथि नहीं है, जबकि यहाँ सूचीबद्ध अन्य पर्यावरण दिवसों की निश्चित तिथियाँ हैं।"},"o":[{"en":"First Monday of October — it has no fixed calendar date, whereas the other environmental days listed here have fixed dates.","hi":"अक्टूबर का पहला सोमवार - इसकी कोई निश्चित कैलेंडर तिथि नहीं है, जबकि यहाँ सूचीबद्ध अन्य पर्यावरण दिवसों की निश्चित तिथियाँ हैं।"},{"en":"October 1st every year.","hi":"प्रतिवर्ष 1 अक्टूबर।"},{"en":"Last Friday of September.","hi":"सितंबर का अंतिम शुक्रवार।"},{"en":"16th September.","hi":"16 सितम्बर।"}],"exp":{"en":"First Monday of October — it has no fixed calendar date, whereas the other environmental days listed here have fixed dates. The UN General Assembly established World Habitat Day in 1985, and it is observed each year on the first Monday of October rather than on a fixed numerical date.","hi":"अक्टूबर का पहला सोमवार - इसकी कोई निश्चित कैलेंडर तिथि नहीं है, जबकि यहाँ सूचीबद्ध अन्य पर्यावरण दिवसों की निश्चित तिथियाँ हैं। संयुक्त राष्ट्र महासभा ने विश्व पर्यावास दिवस 1985 में स्थापित किया और यह हर वर्ष अक्टूबर के पहले सोमवार को मनाया जाता है, निश्चित संख्यात्मक तिथि पर नहीं।"}},{"q":{"en":"How should Ecomark's timeline be understood under the current framework?","hi":"वर्तमान ढाँचा में इकोमार्क की समयरेखा को कैसे समझना चाहिए?"},"a":{"en":"India's original Ecomark scheme dates to 1991; that notification was rescinded and replaced by the Ecomark Rules, 2024 for environment-friendly products.","hi":"भारत की मूल इकोमार्क योजना 1991 की है; उस अधिसूचना को निरस्त करके पर्यावरण-अनुकूल उत्पादों के लिए इकोमार्क नियम, 2024 से प्रतिस्थापित किया गया।"},"o":[{"en":"India's original Ecomark scheme dates to 1991; that notification was rescinded and replaced by the Ecomark Rules, 2024 for environment-friendly products.","hi":"भारत की मूल इकोमार्क योजना 1991 की है; उस अधिसूचना को निरस्त करके पर्यावरण-अनुकूल उत्पादों के लिए इकोमार्क नियम, 2024 से प्रतिस्थापित किया गया।"},{"en":"Ecomark began in 1986 as a pollution tax.","hi":"इकोमार्क 1986 में प्रदूषण कर के रूप में शुरू हुआ।"},{"en":"Ecomark was created in 2010 as the NGT logo.","hi":"इकोमार्क 2010 में NGT प्रतीक-चिह्न के रूप में बनाया गया।"},{"en":"Ecomark is a 1972 UN certification for countries.","hi":"इकोमार्क देश के लिए 1972 संयुक्त राष्ट्र प्रमाणीकरण है।"}],"exp":{"en":"India's original Ecomark scheme dates to 1991; that notification was rescinded and replaced by the Ecomark Rules, 2024 for environment-friendly products. Ecomark is India's environmental labelling framework. The 1991 scheme is its historical origin, while the operative legal framework was replaced by the Ecomark Rules, 2024.","hi":"भारत की मूल इकोमार्क योजना 1991 की है; उस अधिसूचना को निरस्त करके पर्यावरण-अनुकूल उत्पादों के लिए इकोमार्क नियम, 2024 से प्रतिस्थापित किया गया। इकोमार्क भारत का पर्यावरणीय नामकरण ढाँचा है। 1991 योजना इसका ऐतिहासिक उत्पत्ति है, जबकि लागू कानूनी ढाँचा इकोमार्क नियम, 2024 से प्रतिस्थापित हुआ।"}},{"q":{"en":"When was the Indira Gandhi Paryavaran Puraskar instituted?","hi":"इंदिरा गांधी पर्यावरण पुरस्कार कब स्थापित हुआ?"},"a":{"en":"1987.","hi":"1987।"},"o":[{"en":"1987.","hi":"1987।"},{"en":"In 1999.","hi":"1999 में।"},{"en":"In 1991.","hi":"1991 में।"},{"en":"In 1972.","hi":"1972 में।"}],"exp":{"en":"1987. The Ministry instituted the Indira Gandhi Paryavaran Puraskar in 1987 to recognise significant contributions to environmental protection.","hi":"1987। मंत्रालय ने पर्यावरण संरक्षण में महत्वपूर्ण योगदान मान्यता करने के लिए इंदिरा गांधी पर्यावरण पुरस्कार 1987 में संस्थान किया।"}},{"q":{"en":"When was the Rajiv Gandhi Environment Award for Clean Technology instituted?","hi":"स्वच्छ प्रौद्योगिकी हेतु राजीव गांधी पर्यावरण पुरस्कार कब स्थापित हुआ?"},"a":{"en":"1993.","hi":"1993।"},"o":[{"en":"1993.","hi":"1993।"},{"en":"1999.","hi":"1999।"},{"en":"1987.","hi":"1987।"},{"en":"2002.","hi":"2002।"}],"exp":{"en":"1993. The award was created to encourage highly polluting industrial sectors to adopt cleaner technologies and practices that prevent or substantially reduce pollution.","hi":"1993। पुरस्कार अत्यधिक प्रदूषणकारी औद्योगिक क्षेत्रों को स्वच्छतर प्रौद्योगिकियाँ/कार्य-पद्धतियाँ अपनाया करने के लिए प्रोत्साहित करने हेतु बनाया गया, ताकि प्रदूषण रोकना या काफी हद तक कम हो।"}}]},{"title":{"en":"7. Common Confusions & Reverse Questions","hi":"7। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"How should energy be treated in the standard biotic–abiotic classification?","hi":"मानक जैविक-अजैविक वर्गीकरण में ऊर्जा को कैसे मानना चाहिए?"},"a":{"en":"Sunlight and other energy inputs are non-living environmental factors and are treated with abiotic factors; they do not form a universally accepted separate third component.","hi":"सूर्यप्रकाश और अन्य ऊर्जा आदान निर्जीव पर्यावरणीय कारक हैं और अजैविक कारक के साथ माने जाते हैं; ये सार्वभौमिक रूप से स्वीकृत अलग तीसरा घटक नहीं बनाते।"},"o":[{"en":"Sunlight and other energy inputs are non-living environmental factors and are treated with abiotic factors; they do not form a universally accepted separate third component.","hi":"सूर्यप्रकाश और अन्य ऊर्जा आदान निर्जीव पर्यावरणीय कारक हैं और अजैविक कारक के साथ माने जाते हैं; ये सार्वभौमिक रूप से स्वीकृत अलग तीसरा घटक नहीं बनाते।"},{"en":"Incorrectly clubbed under Biotic — it is actually abiotic.","hi":"बायोटिक के तहत गलत तरीके से क्लब किया गया - यह वास्तव में एबियोटिक है।"},{"en":"Incorrectly considered man-made.","hi":"गलत तरीके से मानव निर्मित माना गया।"},{"en":"It is not considered a part of the environment at all.","hi":"इसे बिल्कुल भी पर्यावरण का हिस्सा नहीं माना जाता है।"}],"exp":{"en":"Sunlight and other energy inputs are non-living environmental factors and are treated with abiotic factors; they do not form a universally accepted separate third component. Biotic–abiotic is the standard basic classification; energy flow remains a central ecosystem process, but that does not require creating a third component category.","hi":"सूर्यप्रकाश और अन्य ऊर्जा आदान निर्जीव पर्यावरणीय कारक हैं और अजैविक कारक के साथ माने जाते हैं; ये सार्वभौमिक रूप से स्वीकृत अलग तीसरा घटक नहीं बनाते। जैविक-अजैविक मानक मूलभूत वर्गीकरण है; ऊर्जा प्रवाह पारितंत्र का केंद्रीय प्रक्रिया है, लेकिन इसके लिए तीसरा घटक श्रेणी बनाना जरूरी नहीं।"}},{"q":{"en":"How can UNEP's headquarters be distinguished from other major international headquarters?","hi":"UNEP के मुख्यालय को अन्य प्रमुख अंतरराष्ट्रीय मुख्यालय से कैसे अलग किया जा सकता है?"},"a":{"en":"UNEP is headquartered in Nairobi, Kenya; WMO is headquartered in Geneva, while the main United Nations Headquarters is in New York.","hi":"UNEP का मुख्यालय नैरोबी, केन्या में है; WMO का मुख्यालय जिनेवा में है, जबकि मुख्य संयुक्त राष्ट्र मुख्यालय न्यूयॉर्क में है।"},"o":[{"en":"UNEP is headquartered in Nairobi, Kenya; WMO is headquartered in Geneva, while the main United Nations Headquarters is in New York.","hi":"UNEP का मुख्यालय नैरोबी, केन्या में है; WMO का मुख्यालय जिनेवा में है, जबकि मुख्य संयुक्त राष्ट्र मुख्यालय न्यूयॉर्क में है।"},{"en":"Assumed Nairobi, but it is actually in Geneva.","hi":"नैरोबी माना जाता है, लेकिन यह वास्तव में जिनेवा में है।"},{"en":"Assumed Amsterdam, but it is actually in New York.","hi":"एम्स्टर्डम माना जाता है, लेकिन यह वास्तव में न्यूयॉर्क में है।"},{"en":"Assumed Paris, but it is actually in Nagpur.","hi":"पेरिस माना जाता है, लेकिन यह वास्तव में नागपुर में है।"}],"exp":{"en":"UNEP is headquartered in Nairobi, Kenya; WMO is headquartered in Geneva, while the main United Nations Headquarters is in New York. UNEP's Nairobi headquarters should be distinguished from Geneva-based bodies such as WMO and from New York-based UN headquarters functions.","hi":"UNEP का मुख्यालय नैरोबी, केन्या में है; WMO का मुख्यालय जिनेवा में है, जबकि मुख्य संयुक्त राष्ट्र मुख्यालय न्यूयॉर्क में है। UNEP के नैरोबी मुख्यालय को WMO जैसे जिनेवा-आधारित निकाय और न्यूयॉर्क-आधारित UN मुख्यालय से अलग समझना चाहिए।"}},{"q":{"en":"How do Appiko and Chipko differ despite their similar tree-hugging method?","hi":"समान वृक्षों से चिपकने की पद्धति के बावजूद अप्पिको और चिपको कैसे भिन्न करते हैं?"},"a":{"en":"Chipko arose in the Garhwal Himalaya of present-day Uttarakhand in the 1970s; Appiko began in Karnataka in September 1983 and is prominently associated with Pandurang Hegde.","hi":"चिपको 1970 के दशक में वर्तमान उत्तराखंड के गढ़वाल हिमालय में उभरा; अप्पिको सितंबर 1983 में कर्नाटक में शुरू हुआ और पांडुरंग हेगड़े से प्रमुख रूप से संबद्ध है।"},"o":[{"en":"Chipko arose in the Garhwal Himalaya of present-day Uttarakhand in the 1970s; Appiko began in Karnataka in September 1983 and is prominently associated with Pandurang Hegde.","hi":"चिपको 1970 के दशक में वर्तमान उत्तराखंड के गढ़वाल हिमालय में उभरा; अप्पिको सितंबर 1983 में कर्नाटक में शुरू हुआ और पांडुरंग हेगड़े से प्रमुख रूप से संबद्ध है।"},{"en":"Confused with the Narmada Bachao Andolan (both were anti-dam).","hi":"नर्मदा बचाओ आंदोलन के साथ भ्रमित (दोनों बांध विरोधी थे)।"},{"en":"It is the same as the Maiti Movement of Uttarakhand.","hi":"यह उत्तराखंड के मैती आंदोलन के समान आंदोलन है।"},{"en":"Confused with Greenpeace.","hi":"ग्रीनपीस से भ्रमित।"}],"exp":{"en":"Chipko arose in the Garhwal Himalaya of present-day Uttarakhand in the 1970s; Appiko began in Karnataka in September 1983 and is prominently associated with Pandurang Hegde. The shared tactic explains the comparison, but the geography and chronology differ: Himalayan Chipko predates Karnataka's Appiko by about a decade.","hi":"चिपको 1970 के दशक में वर्तमान उत्तराखंड के गढ़वाल हिमालय में उभरा; अप्पिको सितंबर 1983 में कर्नाटक में शुरू हुआ और पांडुरंग हेगड़े से प्रमुख रूप से संबद्ध है। साझा रणनीति उनकी समानता स्पष्ट करती है, लेकिन भौगोलिक स्थिति और कालक्रम अलग हैं: हिमालयी चिपको, कर्नाटक के अप्पिको से लगभग एक दशक पहले आया।"}},{"q":{"en":"Which of the seven environmental days does not follow a fixed calendar date?","hi":"सात पर्यावरण दिवसों में से कौन-सा दिन निश्चित कैलेंडर तिथि का पालन नहीं करता?"},"a":{"en":"World Habitat Day — it falls on the First Monday of October, not on a fixed date.","hi":"विश्व आवास दिवस - यह अक्टूबर के पहले सोमवार को पड़ता है, किसी निश्चित तिथि पर नहीं।"},"o":[{"en":"World Habitat Day — it falls on the First Monday of October, not on a fixed date.","hi":"विश्व आवास दिवस - यह अक्टूबर के पहले सोमवार को पड़ता है, किसी निश्चित तिथि पर नहीं।"},{"en":"World Environment Day.","hi":"विश्व पर्यावरण दिवस।"},{"en":"World Earth Day.","hi":"विश्व पृथ्वी दिवस।"},{"en":"World Wildlife Day.","hi":"विश्व वन्यजीव दिवस।"}],"exp":{"en":"World Habitat Day — it falls on the First Monday of October, not on a fixed date. The first Monday rule means the date changes from year to year, unlike the other six observances in this chapter that fall on fixed calendar dates.","hi":"विश्व आवास दिवस - यह अक्टूबर के पहले सोमवार को पड़ता है, किसी निश्चित तिथि पर नहीं। पहला सोमवार नियम के कारण तिथि हर वर्ष बदलती है, जबकि अध्याय के अन्य छह दिवस निश्चित कैलेंडर तिथियाँ पर आते हैं।"}},{"q":{"en":"How is GEAC linked to the Environment (Protection) Act, 1986, and how is it different from the NGT?","hi":"GEAC पर्यावरण (संरक्षण) अधिनियम, 1986 से कैसे संबंधित है और NGT से कैसे अलग है?"},"a":{"en":"GEAC functions under the 1989 Rules notified under the Environment (Protection) Act, 1986 and appraises specified genetically engineered organisms/activities; the NGT is a separate environmental tribunal established in 2010 under the NGT Act.","hi":"GEAC पर्यावरण (संरक्षण) अधिनियम, 1986 के तहत अधिसूचित 1989 नियम के अंतर्गत कार्य करती है और निर्दिष्ट आनुवंशिक रूप से अभियांत्रित जीवों/गतिविधियाँ मूल्यांकन करती है; NGT 2010 में NGT अधिनियम के अंतर्गत स्थापित अलग पर्यावरणीय अधिकरण है।"},"o":[{"en":"GEAC functions under the 1989 Rules notified under the Environment (Protection) Act, 1986 and appraises specified genetically engineered organisms/activities; the NGT is a separate environmental tribunal established in 2010 under the NGT Act.","hi":"GEAC पर्यावरण (संरक्षण) अधिनियम, 1986 के तहत अधिसूचित 1989 नियम के अंतर्गत कार्य करती है और निर्दिष्ट आनुवंशिक रूप से अभियांत्रित जीवों/गतिविधियाँ मूल्यांकन करती है; NGT 2010 में NGT अधिनियम के अंतर्गत स्थापित अलग पर्यावरणीय अधिकरण है।"},{"en":"National Green Tribunal (NGT).","hi":"नेशनल ग्रीन ट्रिब्यूनल (NGT)।"},{"en":"Central Pollution Control Board (CPCB).","hi":"केंद्रीय प्रदूषण नियंत्रण बोर्ड (CPCB)।"},{"en":"World Meteorological Organization (WMO).","hi":"विश्व मौसम विज्ञान संगठन (WMO)।"}],"exp":{"en":"GEAC functions under the 1989 Rules notified under the Environment (Protection) Act, 1986 and appraises specified genetically engineered organisms/activities; the NGT is a separate environmental tribunal established in 2010 under the NGT Act. GEAC is an administrative biosafety appraisal committee under delegated rules, whereas the NGT is a statutory adjudicatory tribunal created by a separate 2010 Act.","hi":"GEAC पर्यावरण (संरक्षण) अधिनियम, 1986 के तहत अधिसूचित 1989 नियम के अंतर्गत कार्य करती है और निर्दिष्ट आनुवंशिक रूप से अभियांत्रित जीवों/गतिविधियाँ मूल्यांकन करती है; NGT 2010 में NGT अधिनियम के अंतर्गत स्थापित अलग पर्यावरणीय अधिकरण है। GEAC प्रत्यायोजित नियम के अंतर्गत प्रशासनिक जैव-सुरक्षा आकलन समिति है, जबकि NGT अलग 2010 अधिनियम से स्थापित वैधानिक न्यायनिर्णयन संबंधी अधिकरण है।"}}]},{"title":{"en":"8. Final Revision","hi":"8। अंतिम पुनरावृत्ति"},"questions":[{"q":{"en":"Environment (word origin)?","hi":"पर्यावरण (शब्द उत्पत्ति)?"},"a":{"en":"French 'environ/environner' — around/to surround.","hi":"फ्रांसीसी 'environ/environner' - के आसपास/को घेरना।"},"o":[{"en":"French 'environ/environner' — around/to surround.","hi":"फ्रांसीसी 'environ/environner' - के आसपास/को घेरना।"},{"en":"Ecos (home) + system.","hi":"इकोस (घर) + सिस्टम।"},{"en":"Nature + biology.","hi":"प्रकृति + जीव विज्ञान।"},{"en":"Earth + atmosphere.","hi":"पृथ्वी + वायुमंडल।"}],"exp":{"en":"French 'environ/environner' — around/to surround. The term refers to surroundings and conditions affecting life.","hi":"फ्रांसीसी 'environ/environner' - के आसपास/को घेरना। शब्द जीवित जीवों को प्रभावित करने वाली परिवेश/स्थितियाँ की अवधारणा से जुड़ा है।"}},{"q":{"en":"Biotic components?","hi":"जैविक (जैविक) घटक?"},"a":{"en":"Living beings, animals, plants, microbes.","hi":"जीवित प्राणी, जानवर, पौधे, रोगाणु।"},"o":[{"en":"Living beings, animals, plants, microbes.","hi":"जीवित प्राणी, जानवर, पौधे, रोगाणु।"},{"en":"Water, air, soil.","hi":"पानी, हवा, मिट्टी।"},{"en":"Solar energy, wind.","hi":"सौर ऊर्जा, पवन।"},{"en":"Minerals, rocks.","hi":"खनिज, चट्टानें।"}],"exp":{"en":"Living beings, animals, plants, microbes. Biotic means living; producers, consumers and decomposers all belong here.","hi":"जीवित प्राणी, जानवर, पौधे, रोगाणु। जैविक का अर्थ जीवित है; उत्पादक, उपभोक्ता और अपघटक सभी इसमें आते हैं।"}},{"q":{"en":"Abiotic components?","hi":"अजैविक (अजैविक) घटक?"},"a":{"en":"Water, air, soil.","hi":"पानी, हवा, मिट्टी।"},"o":[{"en":"Water, air, soil.","hi":"पानी, हवा, मिट्टी।"},{"en":"Animals, plants.","hi":"जानवर, पौधे।"},{"en":"Microbes, fungi.","hi":"रोगाणु, कवक।"},{"en":"Sunlight, gravity.","hi":"सूर्य का प्रकाश, गुरुत्वाकर्षण।"}],"exp":{"en":"Water, air, soil. Abiotic means non-living; examples also include light, temperature, minerals and climate.","hi":"पानी, हवा, मिट्टी। अजैविक का अर्थ निर्जीव है; प्रकाश, तापमान, खनिज और जलवायु भी उदाहरण हैं।"}},{"q":{"en":"Environment (Protection) Act?","hi":"पर्यावरण (संरक्षण) अधिनियम?"},"a":{"en":"1986.","hi":"1986।"},"o":[{"en":"1986.","hi":"1986।"},{"en":"1972.","hi":"1972।"},{"en":"1992.","hi":"1992।"},{"en":"2010.","hi":"2010।"}],"exp":{"en":"1986. It is the central umbrella environmental law used for many rules and regulatory measures.","hi":"1986। यह अनेक नियम/नियामक उपाय का केंद्रीय व्यापक पर्यावरणीय कानून है।"}},{"q":{"en":"NGT establish year?","hi":"एनजीटी स्थापना वर्ष?"},"a":{"en":"2010.","hi":"2010।"},"o":[{"en":"2010.","hi":"2010।"},{"en":"1986.","hi":"1986।"},{"en":"1991.","hi":"1991।"},{"en":"1999.","hi":"1999।"}],"exp":{"en":"2010. The exact establishment date is 18 October 2010 under the NGT Act, 2010.","hi":"2010। सटीक स्थापना तिथि 18 अक्टूबर 2010 है, NGT अधिनियम, 2010 के अंतर्गत।"}},{"q":{"en":"Agenda-21 adopted at?","hi":"एजेंडा-21 को कहाँ अपनाया गया?"},"a":{"en":"Rio Earth Summit, 1992.","hi":"रियो पृथ्वी शिखर सम्मेलन, 1992।"},"o":[{"en":"Rio Earth Summit, 1992.","hi":"रियो पृथ्वी शिखर सम्मेलन, 1992।"},{"en":"Kyoto Protocol, 1997.","hi":"क्योटो प्रोटोकॉल, 1997।"},{"en":"Paris Agreement, 2015.","hi":"पेरिस समझौता, 2015।"},{"en":"Stockholm Conference, 1972.","hi":"स्टॉकहोम सम्मेलन, 1972।"}],"exp":{"en":"Rio Earth Summit, 1992. Agenda 21 is the comprehensive sustainable-development action programme adopted at UNCED in Rio.","hi":"रियो पृथ्वी शिखर सम्मेलन, 1992। एजेंडा 21 UNCED रियो में अपनाया गया व्यापक सतत-विकास कार्रवाई कार्यक्रम है।"}},{"q":{"en":"WMO year & HQ?","hi":"WMO वर्ष और मुख्यालय?"},"a":{"en":"1950, Geneva.","hi":"1950, जिनेवा।"},"o":[{"en":"1950, Geneva.","hi":"1950, जिनेवा।"},{"en":"1972, Nairobi.","hi":"1972, नैरोबी।"},{"en":"1958, Nagpur.","hi":"1958, नागपुर।"},{"en":"1971, Amsterdam.","hi":"1971, एम्स्टर्डम।"}],"exp":{"en":"1950, Geneva. The WMO Convention entered into force in 1950; headquarters is Geneva.","hi":"1950, जिनेवा। WMO अभिसमय 1950 में प्रभावी आया; मुख्यालय जिनेवा है।"}},{"q":{"en":"NEERI origin & location?","hi":"NEERI उत्पत्ति और स्थान?"},"a":{"en":"1958: established at Nagpur as CPHERI; renamed NEERI in 1974.","hi":"1958: नागपुर में CPHERI के रूप में स्थापित; 1974 में इसका नाम NEERI रखा गया।"},"o":[{"en":"1958: established at Nagpur as CPHERI; renamed NEERI in 1974.","hi":"1958: नागपुर में CPHERI के रूप में स्थापित; 1974 में इसका नाम NEERI रखा गया।"},{"en":"1950, Geneva.","hi":"1950, जिनेवा।"},{"en":"1971, Amsterdam.","hi":"1971, एम्स्टर्डम।"},{"en":"1972, Nairobi.","hi":"1972, नैरोबी।"}],"exp":{"en":"1958: established at Nagpur as CPHERI; renamed NEERI in 1974. The 1958 date belongs to the original CPHERI institution; the NEERI name dates from 1974.","hi":"1958: नागपुर में CPHERI के रूप में स्थापित; 1974 में इसका नाम NEERI रखा गया। 1958 मूल CPHERI संस्था की तिथि है; NEERI नाम 1974 से है।"}},{"q":{"en":"Greenpeace International year & base?","hi":"ग्रीनपीस इंटरनेशनल वर्ष और आधार?"},"a":{"en":"1979, Amsterdam; the Greenpeace movement's first famous campaign voyage was in 1971.","hi":"1979, एम्स्टर्डम; ग्रीनपीस आंदोलन की पहली प्रसिद्ध अभियान यात्रा 1971 में थी।"},"o":[{"en":"1979, Amsterdam; the Greenpeace movement's first famous campaign voyage was in 1971.","hi":"1979, एम्स्टर्डम; ग्रीनपीस आंदोलन की पहली प्रसिद्ध अभियान यात्रा 1971 में थी।"},{"en":"1950, Geneva.","hi":"1950, जिनेवा।"},{"en":"1958, Nagpur.","hi":"1958, नागपुर।"},{"en":"1972, Nairobi.","hi":"1972, नैरोबी।"}],"exp":{"en":"1979, Amsterdam; the Greenpeace movement's first famous campaign voyage was in 1971. The 1971 campaign history and the 1979 formation of Greenpeace International are separate milestones.","hi":"1979, एम्स्टर्डम; ग्रीनपीस आंदोलन की पहली प्रसिद्ध अभियान या
