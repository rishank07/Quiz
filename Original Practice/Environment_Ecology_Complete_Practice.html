सक्करकोट्टई पक्षी अभयारण्य; थेर्थंगल पक्षी अभयारण्य। अगस्त 2026 तक तमिलनाडु के 20 रामसर स्थल हैं, जो भारतीय राज्य में सर्वाधिक संख्या है।"}}]},{"title":{"en":"7. Common Confusions & Reverse Questions","hi":"7। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"How should alpha, beta and gamma diversity be interpreted in Whittaker's framework?","hi":"व्हिटेकर ढाँचा में अल्फा, बीटा और गामा विविधता को कैसे समझना चाहिए?"},"a":{"en":"Alpha = local/within-community species diversity; Beta = species turnover or compositional difference among communities; Gamma = total regional/landscape species diversity.","hi":"अल्फा = स्थानीय/के भीतर-समुदाय प्रजातीय विविधता; बीटा = समुदाय के बीच प्रजाति परिवर्तन-दर/संरचनागत अंतर; गामा = कुल क्षेत्रीय/परिदृश्य प्रजातीय विविधता।"},"o":[{"en":"Alpha = local/within-community species diversity; Beta = species turnover or compositional difference among communities; Gamma = total regional/landscape species diversity.","hi":"अल्फा = स्थानीय/के भीतर-समुदाय प्रजातीय विविधता; बीटा = समुदाय के बीच प्रजाति परिवर्तन-दर/संरचनागत अंतर; गामा = कुल क्षेत्रीय/परिदृश्य प्रजातीय विविधता।"},{"en":"Alpha = genetic diversity; Beta = species diversity; Gamma = ecosystem diversity.","hi":"अल्फा = आनुवंशिक विविधता; बीटा = प्रजातीय विविधता; गामा = पारितंत्र विविधता।"},{"en":"Alpha = ecosystem diversity; Beta = genetic diversity; Gamma = species diversity.","hi":"अल्फा = पारितंत्र विविधता; बीटा = आनुवंशिक विविधता; गामा = प्रजातीय विविधता।"},{"en":"All three terms describe only genetic diversity at different ages.","hi":"तीनों शब्दों केवल अलग आयु-वर्गों पर आनुवंशिक विविधता वर्णन करते हैं।"}],"exp":{"en":"Alpha = local/within-community species diversity; Beta = species turnover or compositional difference among communities; Gamma = total regional/landscape species diversity. Alpha, beta and gamma are not synonyms for genetic, species and ecosystem diversity; they describe species diversity across spatial scales.","hi":"अल्फा = स्थानीय/के भीतर-समुदाय प्रजातीय विविधता; बीटा = समुदाय के बीच प्रजाति परिवर्तन-दर/संरचनागत अंतर; गामा = कुल क्षेत्रीय/परिदृश्य प्रजातीय विविधता। अल्फा, बीटा और गामा आनुवंशिक, प्रजाति और पारितंत्र विविधता के पर्यायवाची नहीं हैं; ये प्रजातीय विविधता को स्थानिक पैमाने पर वर्णन करते हैं।"}},{"q":{"en":"How should the 1978 plant and 1988 animal IUCN publication dates be understood?","hi":"1978 पौधा और 1988 पशु IUCN प्रकाशन तिथियाँ को कैसे समझना चाहिए?"},"a":{"en":"1978 refers to The IUCN Plant Red Data Book and 1988 to the IUCN Red List of Threatened Animals; the IUCN Red List system itself dates from 1964.","hi":"1978 IUCN पादप रेड डाटा बुक को और 1988 IUCN लाल सूची का संकटग्रस्त पशु को संदर्भित करता है; IUCN लाल सूची प्रणाली स्वयं 1964 से है।"},"o":[{"en":"1978 refers to The IUCN Plant Red Data Book and 1988 to the IUCN Red List of Threatened Animals; the IUCN Red List system itself dates from 1964.","hi":"1978 IUCN पादप रेड डाटा बुक को और 1988 IUCN लाल सूची का संकटग्रस्त पशु को संदर्भित करता है; IUCN लाल सूची प्रणाली स्वयं 1964 से है।"},{"en":"The Red List system began in 1978 for plants and separately in 1988 for animals.","hi":"लाल सूची प्रणाली पौधे के लिए 1978 और पशु के लिए अलग से 1988 में शुरू हुआ।"},{"en":"IUCN itself was created in 1978 and expanded to animals in 1988.","hi":"IUCN स्वयं 1978 में स्थापित हुआ और 1988 में पशु तक विस्तार हुआ।"},{"en":"Both dates relate to Ramsar wetland lists.","hi":"दोनों तिथियाँ रामसर आर्द्रभूमि सूचियाँ से संबंधित हैं।"}],"exp":{"en":"1978 refers to The IUCN Plant Red Data Book and 1988 to the IUCN Red List of Threatened Animals; the IUCN Red List system itself dates from 1964. The dates belong to specific historical publications. The Red List programme is older, having been established by IUCN in 1964.","hi":"1978 IUCN पादप रेड डाटा बुक को और 1988 IUCN लाल सूची का संकटग्रस्त पशु को संदर्भित करता है; IUCN लाल सूची प्रणाली स्वयं 1964 से है। तिथियाँ विशिष्ट ऐतिहासिक प्रकाशनों की हैं। लाल सूची कार्यक्रम इससे पुराना है, IUCN ने इसे 1964 में स्थापित किया था।"}},{"q":{"en":"What is the correct Ramsar chronology for the Convention and India?","hi":"अभिसमय और भारत के लिए सही रामसर कालक्रम क्या है?"},"a":{"en":"Convention adopted at Ramsar, Iran on 2 February 1971; it entered into force for India on 1 February 1982.","hi":"अभिसमय 2 फ़रवरी 1971 को रामसर, ईरान में अपनाया गया; भारत के लिए 1 फ़रवरी 1982 को प्रभावी हुआ।"},"o":[{"en":"Convention adopted at Ramsar, Iran on 2 February 1971; it entered into force for India on 1 February 1982.","hi":"अभिसमय 2 फ़रवरी 1971 को रामसर, ईरान में अपनाया गया; भारत के लिए 1 फ़रवरी 1982 को प्रभावी हुआ।"},{"en":"Convention adopted in 1982; India joined in 1971.","hi":"अभिसमय 1982 में अपनाया गया; भारत 1971 में शामिल हुआ।"},{"en":"Convention and India's entry both occurred on 2 February 1971.","hi":"अभिसमय और भारत प्रवेश दोनों 2 फ़रवरी 1971 को हुईं।"},{"en":"Convention adopted in 1992; India joined in 2002.","hi":"अभिसमय 1992 में अपनाया गया; भारत 2002 में शामिल हुआ।"}],"exp":{"en":"Convention adopted at Ramsar, Iran on 2 February 1971; it entered into force for India on 1 February 1982. Convention adoption and a country's entry into force are different milestones, so the two dates should not be treated as the same event.","hi":"अभिसमय 2 फ़रवरी 1971 को रामसर, ईरान में अपनाया गया; भारत के लिए 1 फ़रवरी 1982 को प्रभावी हुआ। अभिसमय का अंगीकरण और किसी देश के लिए प्रभावी होना अलग प्रमुख पड़ाव हैं; दोनों तिथियाँ समान घटना नहीं हैं।"}},{"q":{"en":"How do in-situ and ex-situ conservation differ?","hi":"स्व-स्थाने और बाह्य-स्थाने संरक्षण (बाह्य-स्थाने) में क्या अंतर है?"},"a":{"en":"In-situ conserves species in natural habitats; ex-situ conserves them outside natural habitats using facilities such as zoos, botanical gardens and seed/gene banks.","hi":"स्व-स्थाने प्रजाति को प्राकृतिक आवासों में संरक्षित करता है; बाह्य-स्थाने प्राकृतिक आवासों के बाहर चिड़ियाघरों, वनस्पति उद्यानों और बीज/जीन बैंक जैसी सुविधाओं का उपयोग करता है।"},"o":[{"en":"In-situ conserves species in natural habitats; ex-situ conserves them outside natural habitats using facilities such as zoos, botanical gardens and seed/gene banks.","hi":"स्व-स्थाने प्रजाति को प्राकृतिक आवासों में संरक्षित करता है; बाह्य-स्थाने प्राकृतिक आवासों के बाहर चिड़ियाघरों, वनस्पति उद्यानों और बीज/जीन बैंक जैसी सुविधाओं का उपयोग करता है।"},{"en":"In-situ = outside natural habitat; Ex-situ = inside natural habitat.","hi":"इन-सीटू = प्राकृतिक आवास के बाहर; एक्स-सीटू = प्राकृतिक आवास के अंदर।"},{"en":"In-situ = for plants only; Ex-situ = for animals only.","hi":"स्वस्थानी = केवल पौधों के लिए; एक्स-सीटू = केवल जानवरों के लिए।"},{"en":"They both mean the exact same thing.","hi":"उन दोनों का मतलब बिल्कुल एक ही है।"}],"exp":{"en":"In-situ conserves species in natural habitats; ex-situ conserves them outside natural habitats using facilities such as zoos, botanical gardens and seed/gene banks. In-situ retains organisms within ecological communities and habitats; ex-situ maintains them under managed conditions outside those habitats.","hi":"स्व-स्थाने प्रजाति को प्राकृतिक आवासों में संरक्षित करता है; बाह्य-स्थाने प्राकृतिक आवासों के बाहर चिड़ियाघरों, वनस्पति उद्यानों और बीज/जीन बैंक जैसी सुविधाओं का उपयोग करता है। स्व-स्थाने जीवों को पारिस्थितिक समुदाय/आवासों के भीतर बनाए रखता है; बाह्य-स्थाने उन्हें उन आवासों के बाहर प्रबंधित स्थितियों में बनाए रखता है।"}},{"q":{"en":"What is the difference between the three levels of biodiversity and alpha-beta-gamma diversity?","hi":"जैव विविधता के तीन स्तर और अल्फा-बीटा-गामा विविधता में क्या अंतर है?"},"a":{"en":"The three biodiversity levels are genetic, species and ecosystem diversity; alpha, beta and gamma describe species diversity across local, between-community and regional spatial scales.","hi":"तीन जैव विविधता स्तर आनुवंशिक, प्रजाति और पारितंत्र विविधता हैं; अल्फा, बीटा और गामा प्रजातीय विविधता को स्थानीय, समुदायों के बीच और क्षेत्रीय स्थानिक पैमानों को दर्शाते हैं।"},"o":[{"en":"The three biodiversity levels are genetic, species and ecosystem diversity; alpha, beta and gamma describe species diversity across local, between-community and regional spatial scales.","hi":"तीन जैव विविधता स्तर आनुवंशिक, प्रजाति और पारितंत्र विविधता हैं; अल्फा, बीटा और गामा प्रजातीय विविधता को स्थानीय, समुदायों के बीच और क्षेत्रीय स्थानिक पैमानों को दर्शाते हैं।"},{"en":"Both systems are exactly the same three categories with different names.","hi":"दोनों प्रणालियाँ ठीक समान तीन श्रेणियाँ हैं, केवल नाम अलग हैं।"},{"en":"Genetic, species and ecosystem are Ramsar categories; alpha, beta and gamma are IUCN categories.","hi":"आनुवंशिक, प्रजाति और पारितंत्र रामसर श्रेणियाँ हैं; अल्फा, बीटा और गामा IUCN श्रेणियाँ हैं।"},{"en":"Alpha, beta and gamma are the only accepted levels of biodiversity.","hi":"अल्फा, बीटा और गामा जैव विविधता केवल स्वीकृत स्तर हैं।"}],"exp":{"en":"The three biodiversity levels are genetic, species and ecosystem diversity; alpha, beta and gamma describe species diversity across local, between-community and regional spatial scales. The distinction prevents a common conceptual error: biodiversity levels classify what varies biologically, whereas alpha-beta-gamma classify species diversity by spatial scale.","hi":"तीन जैव विविधता स्तर आनुवंशिक, प्रजाति और पारितंत्र विविधता हैं; अल्फा, बीटा और गामा प्रजातीय विविधता को स्थानीय, समुदायों के बीच और क्षेत्रीय स्थानिक पैमानों को दर्शाते हैं। यह अंतर एक सामान्य अवधारणात्मक त्रुटि को रोकता है: जैव विविधता के स्तर बताते हैं कि जैविक विविधता किस स्तर पर है, जबकि अल्फा-बीटा-गामा प्रजातीय विविधता को स्थानिक पैमाने के अनुसार वर्गीकृत करते हैं।"}}]},{"title":{"en":"8. Final Revision","hi":"8। अंतिम पुनरावृत्ति"},"questions":[{"q":{"en":"What are the three commonly recognised levels of biodiversity?","hi":"जैव विविधता के तीन सामान्यतः मान्यता प्राप्त स्तर क्या हैं?"},"a":{"en":"Genetic diversity, species diversity and ecosystem diversity.","hi":"आनुवंशिक विविधता, प्रजातीय विविधता और पारितंत्र विविधता।"},"o":[{"en":"Genetic diversity, species diversity and ecosystem diversity.","hi":"आनुवंशिक विविधता, प्रजातीय विविधता और पारितंत्र विविधता।"},{"en":"Alpha diversity, beta diversity and gamma diversity.","hi":"अल्फा विविधता, बीटा विविधता और गामा विविधता।"},{"en":"Floral, faunal and microbial diversity.","hi":"पुष्पीय, जीव-जंतु संबंधी और सूक्ष्मजीवी विविधता।"},{"en":"Terrestrial, aquatic and aerial diversity.","hi":"स्थलीय, जलीय और हवाई विविधता।"}],"exp":{"en":"Genetic diversity, species diversity and ecosystem diversity. This keeps the biological levels of biodiversity separate from Whittaker's spatial partitioning of species diversity.","hi":"आनुवंशिक विविधता, प्रजातीय विविधता और पारितंत्र विविधता। यह जैव विविधता के जैविक स्तर को व्हिटेकर के स्थानिक प्रजाति-विविधता विभाजन से अलग रखता है।"}},{"q":{"en":"What is Alpha (α) diversity in Whittaker's spatial framework?","hi":"व्हिटेकर स्थानिक ढाँचा में अल्फा (α) विविधता क्या है?"},"a":{"en":"Local species diversity within a community or sampling unit.","hi":"एक समुदाय या नमूनाकरण इकाई के भीतर स्थानीय प्रजातीय विविधता।"},"o":[{"en":"Local species diversity within a community or sampling unit.","hi":"एक समुदाय या नमूनाकरण इकाई के भीतर स्थानीय प्रजातीय विविधता।"},{"en":"Genetic diversity within a species.","hi":"एक प्रजाति के भीतर आनुवंशिक विविधता।"},{"en":"Species turnover between communities.","hi":"समुदाय के बीच प्रजाति परिवर्तन-दर।"},{"en":"Total regional species diversity.","hi":"कुल क्षेत्रीय प्रजातीय विविधता।"}],"exp":{"en":"Local species diversity within a community or sampling unit. This keeps the biological levels of biodiversity separate from Whittaker's spatial partitioning of species diversity.","hi":"एक समुदाय या नमूनाकरण इकाई के भीतर स्थानीय प्रजातीय विविधता। यह जैव विविधता के जैविक स्तर को व्हिटेकर के स्थानिक प्रजाति-विविधता विभाजन से अलग रखता है।"}},{"q":{"en":"What is Beta (β) diversity in Whittaker's spatial framework?","hi":"व्हिटेकर स्थानिक ढाँचा में बीटा (β) विविधता क्या है?"},"a":{"en":"Species turnover or difference in species composition among local communities.","hi":"स्थानीय समुदाय के बीच प्रजाति परिवर्तन-दर या प्रजाति संरचना में अंतर।"},"o":[{"en":"Species turnover or difference in species composition among local communities.","hi":"स्थानीय समुदाय के बीच प्रजाति परिवर्तन-दर या प्रजाति संरचना में अंतर।"},{"en":"Local diversity within one sampling unit.","hi":"एक नमूनाकरण इकाई के भीतर स्थानीय विविधता।"},{"en":"Total species diversity of an entire region.","hi":"संपूर्ण क्षेत्र की कुल प्रजातीय विविधता।"},{"en":"Genetic variation among individuals of one species.","hi":"एक प्रजाति के व्यक्तियों में आनुवंशिक परिवर्तन।"}],"exp":{"en":"Species turnover or difference in species composition among local communities. This keeps the biological levels of biodiversity separate from Whittaker's spatial partitioning of species diversity.","hi":"स्थानीय समुदाय के बीच प्रजाति परिवर्तन-दर या प्रजाति संरचना में अंतर। यह जैव विविधता के जैविक स्तर को व्हिटेकर के स्थानिक प्रजाति-विविधता विभाजन से अलग रखता है।"}},{"q":{"en":"What is Gamma (γ) diversity, and whose framework introduced alpha-beta-gamma diversity?","hi":"गामा (γ) विविधता क्या है, और अल्फा-बीटा-गामा विविधता किसके ढाँचा से जुड़ी है?"},"a":{"en":"Gamma diversity is total regional/landscape species diversity; the alpha-beta-gamma framework is associated with R. H. Whittaker.","hi":"गामा विविधता कुल क्षेत्रीय/परिदृश्य प्रजातीय विविधता है; अल्फा-बीटा-गामा ढाँचा R. H. व्हिटेकर से संबद्ध है।"},"o":[{"en":"Gamma diversity is total regional/landscape species diversity; the alpha-beta-gamma framework is associated with R. H. Whittaker.","hi":"गामा विविधता कुल क्षेत्रीय/परिदृश्य प्रजातीय विविधता है; अल्फा-बीटा-गामा ढाँचा R. H. व्हिटेकर से संबद्ध है।"},{"en":"Gamma diversity is genetic diversity; the framework was proposed by Norman Myers.","hi":"गामा विविधता आनुवंशिक विविधता है; ढाँचा नॉर्मन मायर्स ने प्रस्तावित किया।"},{"en":"Gamma diversity is ecosystem productivity; the framework was proposed by Tansley.","hi":"गामा विविधता पारितंत्र उत्पादकता है; ढाँचा टैन्सले ने प्रस्तावित किया।"},{"en":"Gamma diversity is extinction risk; the framework was proposed by IUCN.","hi":"गामा विविधता विलुप्ति जोखिम है; ढाँचा IUCN ने प्रस्तावित किया।"}],"exp":{"en":"Gamma diversity is total regional/landscape species diversity; the alpha-beta-gamma framework is associated with R. H. Whittaker. This keeps the biological levels of biodiversity separate from Whittaker's spatial partitioning of species diversity.","hi":"गामा विविधता कुल क्षेत्रीय/परिदृश्य प्रजातीय विविधता है; अल्फा-बीटा-गामा ढाँचा R. H. व्हिटेकर से संबद्ध है। यह जैव विविधता के जैविक स्तर को व्हिटेकर के स्थानिक प्रजाति-विविधता विभाजन से अलग रखता है।"}},{"q":{"en":"Which is the largest coral reef?","hi":"सबसे बड़ी प्रवाल भित्ति कौन-सी है?"},"a":{"en":"Great Barrier Reef, Australia — the world's largest coral reef system.","hi":"ग्रेट बैरियर रीफ, ऑस्ट्रेलिया - विश्व का सबसे बड़ा प्रवाल भित्ति प्रणाली।"},"o":[{"en":"Great Barrier Reef, Australia — the world's largest coral reef system.","hi":"ग्रेट बैरियर रीफ, ऑस्ट्रेलिया - विश्व का सबसे बड़ा प्रवाल भित्ति प्रणाली।"},{"en":"Belize Barrier Reef.","hi":"बेलीज बैरियर रीफ।"},{"en":"Florida Reef.","hi":"फ्लोरिडा रीफ।"},{"en":"Andaman Reef.","hi":"अंडमान रीफ।"}],"exp":{"en":"Great Barrier Reef, Australia — the world's largest coral reef system. It is the world's largest coral reef system; 'rainforests of the sea' is a general description of coral reefs rather than a unique formal title of this reef.","hi":"ग्रेट बैरियर रीफ, ऑस्ट्रेलिया - विश्व का सबसे बड़ा प्रवाल भित्ति प्रणाली। यह विश्व का सबसे बड़ा प्रवाल भित्ति प्रणाली है; 'समुद्र के वर्षावन' प्रवाल भित्तियों का सामान्य विवरण है, इस प्रवाल भित्ति का विशिष्ट औपचारिक शीर्षक नहीं।"}},{"q":{"en":"Who proposed the Biodiversity Hotspot concept and when?","hi":"जैव विविधता हॉटस्पॉट की अवधारणा किसने और कब दी?"},"a":{"en":"Norman Myers, 1988.","hi":"नॉर्मन मायर्स, 1988।"},"o":[{"en":"Norman Myers, 1988.","hi":"नॉर्मन मायर्स, 1988।"},{"en":"Charles Elton, 1927.","hi":"चार्ल्स एल्टन, 1927।"},{"en":"G.E. Hutchinson, 1927.","hi":"जी.ई। हचिन्सन, 1927।"},{"en":"Ernst Haeckel, 1869.","hi":"अर्नस्ट हैकेल, 1869।"}],"exp":{"en":"Norman Myers, 1988. Myers's 1988 concept prioritised regions combining exceptional endemism with severe habitat loss.","hi":"नॉर्मन मायर्स, 1988। मायर्स का 1988 अवधारणा असाधारण स्थानिकता और गंभीर आवास हानि संयोजित करने वाले क्षेत्रों को प्राथमिकता देता है।"}},{"q":{"en":"Which four global biodiversity hotspots are represented in India?","hi":"भारत में कौन-से चार वैश्विक जैव विविधता हॉटस्पॉट प्रतिनिधित्वित हैं?"},"a":{"en":"Himalaya; Indo-Burma; Western Ghats–Sri Lanka; Sundaland (Nicobar Islands in India).","hi":"हिमालय; इंडो-बर्मा; पश्चिमी घाट-श्रीलंका; सुंडालैंड (भारत में निकोबार द्वीप)।"},"o":[{"en":"Himalaya; Indo-Burma; Western Ghats–Sri Lanka; Sundaland (Nicobar Islands in India).","hi":"हिमालय; इंडो-बर्मा; पश्चिमी घाट-श्रीलंका; सुंडालैंड (भारत में निकोबार द्वीप)।"},{"en":"Thar Desert, Gangetic Plains, Deccan Plateau, Lakshadweep.","hi":"थार रेगिस्तान, गंगा का मैदान, दक्कन का पठार, लक्षद्वीप।"},{"en":"Kashmir, Central India, Kutch, Andaman.","hi":"कश्मीर, मध्य भारत, कच्छ, अंडमान।"},{"en":"Aravalli, Vindhya, Satpura, Eastern Ghats.","hi":"अरावली, विंध्य, सतपुड़ा, पूर्वी घाट।"}],"exp":{"en":"Himalaya; Indo-Burma; Western Ghats–Sri Lanka; Sundaland (Nicobar Islands in India). The four are global hotspots that extend across national boundaries; only portions of each occur within India.","hi":"हिमालय; इंडो-बर्मा; पश्चिमी घाट-श्रीलंका; सुंडालैंड (भारत में निकोबार द्वीप)। ये चार वैश्विक हॉटस्पॉट राष्ट्रीय सीमाएँ पार करते हैं; प्रत्येक का केवल भाग भारत में स्थित है।"}},{"q":{"en":"What are examples of in-situ conservation?","hi":"इन-सिटू संरक्षण के उदाहरण क्या हैं?"},"a":{"en":"National parks, wildlife sanctuaries, biosphere reserves and sacred groves.","hi":"राष्ट्रीय उद्यान, वन्यजीव अभयारण्य, जैवमंडल आरक्षित क्षेत्र और पवित्र उपवन।"},"o":[{"en":"National parks, wildlife sanctuaries, biosphere reserves and sacred groves.","hi":"राष्ट्रीय उद्यान, वन्यजीव अभयारण्य, जैवमंडल आरक्षित क्षेत्र और पवित्र उपवन।"},{"en":"Zoos, Botanical Gardens, Aquariums.","hi":"चिड़ियाघर, वनस्पति उद्यान, एक्वैरियम।"},{"en":"DNA Banks, Seed Banks, Cryopreservation.","hi":"डीएनए बैंक, बीज बैंक, क्रायोप्रिजर्वेशन।"},{"en":"Laboratories, Greenhouses, Captive Breeding.","hi":"प्रयोगशालाएँ, ग्रीनहाउस, कैप्टिव ब्रीडिंग।"}],"exp":{"en":"National parks, wildlife sanctuaries, biosphere reserves and sacred groves. In-situ and ex-situ are complementary conservation strategies: one protects organisms in natural systems, the other supports them under managed conditions.","hi":"राष्ट्रीय उद्यान, वन्यजीव अभयारण्य, जैवमंडल आरक्षित क्षेत्र और पवित्र उपवन। स्व-स्थाने और बाह्य-स्थाने पूरक संरक्षण रणनीतियाँ हैं: एक प्राकृतिक प्रणालियों में संरक्षित करता है, अन्य प्रबंधित स्थितियों में समर्थन करता है।"}},{"q":{"en":"What are examples of ex-situ conservation?","hi":"एक्स-सिटू संरक्षण के उदाहरण क्या हैं?"},"a":{"en":"Zoos, botanical gardens, seed/gene banks, cryopreservation and captive breeding.","hi":"चिड़ियाघरों, वनस्पति उद्यानों, बीज/जीन बैंक, अतिशीत संरक्षण और बंदी प्रजनन।"},"o":[{"en":"Zoos, botanical gardens, seed/gene banks, cryopreservation and captive breeding.","hi":"चिड़ियाघरों, वनस्पति उद्यानों, बीज/जीन बैंक, अतिशीत संरक्षण और बंदी प्रजनन।"},{"en":"National Parks, Sanctuaries, Reserves.","hi":"राष्ट्रीय उद्यान, अभयारण्य, भंडार।"},{"en":"Sacred Groves, Biosphere Reserves.","hi":"पवित्र उपवन, जीवमंडल भंडार।"},{"en":"Wilderness areas, Ocean sanctuaries.","hi":"जंगली क्षेत्र, महासागर अभयारण्य।"}],"exp":{"en":"Zoos, botanical gardens, seed/gene banks, cryopreservation and captive breeding. In-situ and ex-situ are complementary conservation strategies: one protects organisms in natural systems, the other supports them under managed conditions.","hi":"चिड़ियाघरों, वनस्पति उद्यानों, बीज/जीन बैंक, अतिशीत संरक्षण और बंदी प्रजनन। स्व-स्थाने और बाह्य-स्थाने पूरक संरक्षण रणनीतियाँ हैं: एक प्राकृतिक प्रणालियों में संरक्षित करता है, अन्य प्रबंधित स्थितियों में समर्थन करता है।"}},{"q":{"en":"When and where was IUCN established, and where is its present headquarters?","hi":"IUCN कब/कहाँ स्थापित हुआ और वर्तमान मुख्यालय कहाँ है?"},"a":{"en":"5 October 1948, Fontainebleau, France; present headquarters: Gland, Switzerland.","hi":"5 अक्टूबर 1948, फॉन्टेनब्लो, फ्रांस; वर्तमान मुख्यालय: ग्लैंड, स्विट्जरलैंड।"},"o":[{"en":"5 October 1948, Fontainebleau, France; present headquarters: Gland, Switzerland.","hi":"5 अक्टूबर 1948, फॉन्टेनब्लो, फ्रांस; वर्तमान मुख्यालय: ग्लैंड, स्विट्जरलैंड।"},{"en":"1971, Ramsar, Iran.","hi":"1971, रामसर, ईरान।"},{"en":"1972, Nairobi, Kenya.","hi":"1972, नैरोबी, केन्या।"},{"en":"1950, Geneva, Switzerland.","hi":"1950, जिनेवा, स्विट्जरलैंड।"}],"exp":{"en":"5 October 1948, Fontainebleau, France; present headquarters: Gland, Switzerland. IUCN's founding place and present headquarters are different, an important historical distinction.","hi":"5 अक्टूबर 1948, फॉन्टेनब्लो, फ्रांस; वर्तमान मुख्यालय: ग्लैंड, स्विट्जरलैंड। IUCN की स्थापना-स्थान और वर्तमान मुख्यालय अलग हैं, जो महत्वपूर्ण ऐतिहासिक अंतर है।"}},{"q":{"en":"What does the year 1978 refer to in IUCN plant conservation literature?","hi":"IUCN पौधा संरक्षण साहित्य में 1978 किसे संदर्भित करता है?"},"a":{"en":"Publication of The IUCN Plant Red Data Book; the overall Red List system had already begun in 1964.","hi":"IUCN पादप रेड डाटा बुक की प्रकाशन; समग्र लाल सूची प्रणाली 1964 में पहले से शुरू हो चुका था।"},"o":[{"en":"Publication of The IUCN Plant Red Data Book; the overall Red List system had already begun in 1964.","hi":"IUCN पादप रेड डाटा बुक की प्रकाशन; समग्र लाल सूची प्रणाली 1964 में पहले से शुरू हो चुका था।"},{"en":"1988.","hi":"1988।"},{"en":"1948.","hi":"1948।"},{"en":"2000.","hi":"2000।"}],"exp":{"en":"Publication of The IUCN Plant Red Data Book; the overall Red List system had already begun in 1964. The year refers to a specific historical publication, while the overall IUCN Red List system began in 1964.","hi":"IUCN पादप रेड डाटा बुक की प्रकाशन; समग्र लाल सूची प्रणाली 1964 में पहले से शुरू हो चुका था। वर्ष विशिष्ट ऐतिहासिक प्रकाशन को संदर्भित करता है, जबकि समग्र IUCN लाल सूची प्रणाली 1964 में शुरू हुआ।"}},{"q":{"en":"What does the year 1988 refer to in IUCN animal conservation literature?","hi":"IUCN पशु संरक्षण साहित्य में 1988 किसे संदर्भित करता है?"},"a":{"en":"Publication of the 1988 IUCN Red List of Threatened Animals; it was not the start of the Red List system.","hi":"1988 IUCN लाल सूची का संकटग्रस्त पशु की प्रकाशन; यह लाल सूची प्रणाली की शुरुआत नहीं थी।"},"o":[{"en":"Publication of the 1988 IUCN Red List of Threatened Animals; it was not the start of the Red List system.","hi":"1988 IUCN लाल सूची का संकटग्रस्त पशु की प्रकाशन; यह लाल सूची प्रणाली की शुरुआत नहीं थी।"},{"en":"1978.","hi":"1978।"},{"en":"1948.","hi":"1948।"},{"en":"1998.","hi":"1998।"}],"exp":{"en":"Publication of the 1988 IUCN Red List of Threatened Animals; it was not the start of the Red List system. The year refers to a specific historical publication, while the overall IUCN Red List system began in 1964.","hi":"1988 IUCN लाल सूची का संकटग्रस्त पशु की प्रकाशन; यह लाल सूची प्रणाली की शुरुआत नहीं थी। वर्ष विशिष्ट ऐतिहासिक प्रकाशन को संदर्भित करता है, जबकि समग्र IUCN लाल सूची प्रणाली 1964 में शुरू हुआ।"}},{"q":{"en":"Which IUCN categories are collectively called 'threatened'?","hi":"IUCN की कौन-सी श्रेणियाँ सामूहिक रूप से 'संकटग्रस्त' कहलाती हैं?"},"a":{"en":"Critically Endangered (CR), Endangered (EN) and Vulnerable (VU).","hi":"गंभीर रूप से संकटग्रस्त (CR), संकटग्रस्त (EN) और सुभेद्य (VU)।"},"o":[{"en":"Critically Endangered (CR), Endangered (EN) and Vulnerable (VU).","hi":"गंभीर रूप से संकटग्रस्त (CR), संकटग्रस्त (EN) और सुभेद्य (VU)।"},{"en":"Extinct, Data Deficient and Not Evaluated.","hi":"विलुप्त, आँकड़े अपूर्ण और नहीं मूल्यांकित।"},{"en":"Near Threatened and Least Concern only.","hi":"केवल के निकट संकटग्रस्त और न्यूनतम चिंता।"},{"en":"Extinct in the Wild and Least Concern only.","hi":"केवल विलुप्त में वन्य और न्यूनतम चिंता।"}],"exp":{"en":"Critically Endangered (CR), Endangered (EN) and Vulnerable (VU). 'Threatened' has a precise IUCN meaning: it collectively covers CR, EN and VU, not every species with any conservation concern.","hi":"गंभीर रूप से संकटग्रस्त (CR), संकटग्रस्त (EN) और सुभेद्य (VU)। 'संकटग्रस्त' का सटीक IUCN अर्थ है: यह सामूहिक रूप से CR, EN और VU को समाहित करता है, हर संरक्षण-चिंता प्रजाति को नहीं।"}},{"q":{"en":"When and where was the Ramsar Convention signed?","hi":"रामसर कन्वेंशन कब और कहाँ हस्ताक्षरित हुआ?"},"a":{"en":"2 February 1971, Ramsar, Iran.","hi":"2 फ़रवरी 1971, रामसर, ईरान।"},"o":[{"en":"2 February 1971, Ramsar, Iran.","hi":"2 फ़रवरी 1971, रामसर, ईरान।"},{"en":"5 June 1972, Nairobi, Kenya.","hi":"5 जून 1972, नैरोबी, केन्या।"},{"en":"22 April 1982, New Delhi, India.","hi":"22 अप्रैल 1982, नई दिल्ली, भारत।"},{"en":"16 Sept 1987, Montreal, Canada.","hi":"16 सितंबर 1987, मॉन्ट्रियल, कनाडा।"}],"exp":{"en":"2 February 1971, Ramsar, Iran. Ramsar adoption, World Wetlands Day and India's entry into force are closely related but distinct date facts.","hi":"2 फ़रवरी 1971, रामसर, ईरान। रामसर अंगीकरण, विश्व आर्द्रभूमियाँ दिन और भारत के प्रभावी होना निकटता से संबंधित लेकिन अलग तिथि तथ्य हैं।"}},{"q":{"en":"When is World Wetland Day observed?","hi":"विश्व आर्द्रभूमि दिवस कब मनाया जाता है?"},"a":{"en":"2 February — World Wetlands Day.","hi":"2 फ़रवरी - विश्व आर्द्रभूमियाँ दिन।"},"o":[{"en":"2 February — World Wetlands Day.","hi":"2 फ़रवरी - विश्व आर्द्रभूमियाँ दिन।"},{"en":"5th June.","hi":"5 जून।"},{"en":"22nd April.","hi":"22 अप्रैल।"},{"en":"21st March.","hi":"21 मार्च।"}],"exp":{"en":"2 February — World Wetlands Day. Ramsar adoption, World Wetlands Day and India's entry into force are closely related but distinct date facts.","hi":"2 फ़रवरी - विश्व आर्द्रभूमियाँ दिन। रामसर अंगीकरण, विश्व आर्द्रभूमियाँ दिन और भारत के प्रभावी होना निकटता से संबंधित लेकिन अलग तिथि तथ्य हैं।"}},{"q":{"en":"When did the Ramsar Convention enter into force for India?","hi":"भारत के लिए रामसर अभिसमय कब प्रभावी हुआ?"},"a":{"en":"1 February 1982.","hi":"1 फ़रवरी 1982।"},"o":[{"en":"1 February 1982.","hi":"1 फ़रवरी 1982।"},{"en":"1971.","hi":"1971।"},{"en":"1986.","hi":"1986।"},{"en":"2000.","hi":"2000।"}],"exp":{"en":"1 February 1982. Ramsar adoption, World Wetlands Day and India's entry into force are closely related but distinct date facts.","hi":"1 फ़रवरी 1982। रामसर अंगीकरण, विश्व आर्द्रभूमियाँ दिन और भारत के प्रभावी होना निकटता से संबंधित लेकिन अलग तिथि तथ्य हैं।"}},{"q":{"en":"How many Ramsar Sites does India have as of August 2026?","hi":"अगस्त 2026 तक भारत में कितने रामसर स्थल हैं?"},"a":{"en":"101; Glaw Lake in Arunachal Pradesh became the 101st Ramsar Site in August 2026.","hi":"101; अरुणाचल प्रदेश का ग्लॉ झील अगस्त 2026 में 101वाँ रामसर स्थल बना।"},"o":[{"en":"101; Glaw Lake in Arunachal Pradesh became the 101st Ramsar Site in August 2026.","hi":"101; अरुणाचल प्रदेश का ग्लॉ झील अगस्त 2026 में 101वाँ रामसर स्थल बना।"},{"en":"75 (June 2025).","hi":"75 (जून 2025)।"},{"en":"50 (June 2025).","hi":"50 (जून 2025)।"},{"en":"100 (June 2025).","hi":"100 (जून 2025)।"}],"exp":{"en":"101; Glaw Lake in Arunachal Pradesh became the 101st Ramsar Site in August 2026. This is the current tally after Glaw Lake became India's 101st Ramsar Site in August 2026.","hi":"101; अरुणाचल प्रदेश का ग्लॉ झील अगस्त 2026 में 101वाँ रामसर स्थल बना। यह वर्तमान संख्या है, ग्लॉ झील के अगस्त 2026 में भारत के 101वाँ रामसर स्थल बनने के बाद।"}},{"q":{"en":"Which State has the most Ramsar Sites as of August 2026?","hi":"अगस्त 2026 तक किस राज्य में अधिकांश रामसर स्थल हैं?"},"a":{"en":"Tamil Nadu — 20.","hi":"तमिलनाडु - 20।"},"o":[{"en":"Tamil Nadu — 20.","hi":"तमिलनाडु - 20।"},{"en":"Uttar Pradesh (10).","hi":"उत्तर प्रदेश (10)।"},{"en":"Gujarat (15).","hi":"गुजरात (15)।"},{"en":"Kerala (5).","hi":"केरल (5)।"}],"exp":{"en":"Tamil Nadu — 20. Tamil Nadu remains the State with the highest Ramsar-site count at 20.","hi":"तमिलनाडु - 20। तमिलनाडु 20 स्थलों के साथ सर्वाधिक रामसर-स्थल-संख्या वाला राज्य बना हुआ है।"}},{"q":{"en":"Which is India’s largest Ramsar Site?","hi":"भारत का सबसे ब rtant wildlife facts, the latest published All India Tiger Estimation (2022), major wildlife-conservation milestones, and the current list of India's 58 Tiger Reserves.","hi":"UNESCO का मानव एवं जैवमंडल (MAB) कार्यक्रम, भारत के 18 राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र, महत्वपूर्ण वन्यजीव तथ्य, नवीनतम प्रकाशित अखिल भारतीय बाघ आकलन (2022), प्रमुख वन्यजीव-संरक्षण पड़ाव और भारत के वर्तमान 58 बाघ आरक्षित क्षेत्र की सूची।"},"o":[{"en":"UNESCO's Man and the Biosphere (MAB) Programme, India's 18 nationally designated Biosphere Reserves, important wildlife facts, the latest published All India Tiger Estimation (2022), major wildlife-conservation milestones, and the current list of India's 58 Tiger Reserves.","hi":"UNESCO का मानव एवं जैवमंडल (MAB) कार्यक्रम, भारत के 18 राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र, महत्वपूर्ण वन्यजीव तथ्य, नवीनतम प्रकाशित अखिल भारतीय बाघ आकलन (2022), प्रमुख वन्यजीव-संरक्षण पड़ाव और भारत के वर्तमान 58 बाघ आरक्षित क्षेत्र की सूची।"},{"en":"Only the physical layers of the ocean and marine life.","hi":"केवल समुद्र की भौतिक परतें और समुद्री जीवन।"},{"en":"Detailed geography of European national parks and international rivers.","hi":"यूरोपीय राष्ट्रीय उद्यानों और अंतर्राष्ट्रीय नदियों का विस्तृत भूगोल।"},{"en":"The historical background of environmental laws in the British era.","hi":"ब्रिटिश काल में पर्यावरण कानूनों की ऐतिहासिक पृष्ठभूमि।"}],"exp":{"en":"UNESCO's Man and the Biosphere (MAB) Programme, India's 18 nationally designated Biosphere Reserves, important wildlife facts, the latest published All India Tiger Estimation (2022), major wildlife-conservation milestones, and the current list of India's 58 Tiger Reserves. The chapter combines national biosphere-reserve facts with tiger-conservation data and species-specific conservation milestones; current counts should be tied to a date because reserve networks can expand.","hi":"UNESCO का मानव एवं जैवमंडल (MAB) कार्यक्रम, भारत के 18 राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र, महत्वपूर्ण वन्यजीव तथ्य, नवीनतम प्रकाशित अखिल भारतीय बाघ आकलन (2022), प्रमुख वन्यजीव-संरक्षण पड़ाव और भारत के वर्तमान 58 बाघ आरक्षित क्षेत्र की सूची। अध्याय राष्ट्रीय जैवमंडल-आरक्षित क्षेत्र तथ्य, बाघ-संरक्षण आँकड़े और प्रजाति-विशिष्ट संरक्षण प्रमुख पड़ाव संयोजित करता है; आरक्षित क्षेत्र नेटवर्क बढ़ सकते हैं, इसलिए वर्तमान संख्याएँ को तिथि के साथ पढ़ना चाहिए।"}},{"q":{"en":"How many nationally designated Biosphere Reserves does India have, and how many are currently in UNESCO's World Network?","hi":"भारत में राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र कितने हैं और वर्तमान UNESCO विश्व नेटवर्क में कितने हैं?"},"a":{"en":"18 nationally designated Biosphere Reserves; 13 are currently in UNESCO's World Network of Biosphere Reserves.","hi":"18 राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र; वर्तमान UNESCO जैवमंडल आरक्षित क्षेत्रों का विश्व नेटवर्क में 13।"},"o":[{"en":"18 nationally designated Biosphere Reserves; 13 are currently in UNESCO's World Network of Biosphere Reserves.","hi":"18 राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र; वर्तमान UNESCO जैवमंडल आरक्षित क्षेत्रों का विश्व नेटवर्क में 13।"},{"en":"18 nationally designated; all 18 are in UNESCO's World Network.","hi":"18 राष्ट्रीय रूप से नामित; सभी 18 UNESCO विश्व नेटवर्क में हैं।"},{"en":"13 nationally designated; 18 are in UNESCO's World Network.","hi":"13 राष्ट्रीय रूप से नामित; 18 UNESCO विश्व नेटवर्क में हैं।"},{"en":"25 nationally designated; 13 are in UNESCO's World Network.","hi":"25 राष्ट्रीय रूप से नामित; 13 UNESCO विश्व नेटवर्क में हैं।"}],"exp":{"en":"18 nationally designated Biosphere Reserves; 13 are currently in UNESCO's World Network of Biosphere Reserves. India maintains 18 nationally designated Biosphere Reserves, but UNESCO's World Network is a separate international designation; Cold Desert became India's 13th UNESCO-network site in 2025.","hi":"18 राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र; वर्तमान UNESCO जैवमंडल आरक्षित क्षेत्रों का विश्व नेटवर्क में 13। भारत में 18 राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र हैं, लेकिन UNESCO विश्व नेटवर्क अलग अंतरराष्ट्रीय नामांकन है; शीत मरुस्थल 2025 में भारत का 13वाँ UNESCO-नेटवर्क स्थल बना।"}},{"q":{"en":"How many Tiger Reserves are there in India as of 2026?","hi":"2026 तक भारत में कितने बाघ आरक्षित क्षेत्र हैं?"},"a":{"en":"58 Tiger Reserves across 18 tiger-range States.","hi":"18 बाघ-बहुल राज्यों में 58 बाघ आरक्षित क्षेत्र।"},"o":[{"en":"58 Tiger Reserves across 18 tiger-range States.","hi":"18 बाघ-बहुल राज्यों में 58 बाघ आरक्षित क्षेत्र।"},{"en":"50 Tiger Reserves.","hi":"50 टाइगर रिजर्व।"},{"en":"54 Tiger Reserves.","hi":"54 टाइगर रिजर्व।"},{"en":"18 Tiger Reserves.","hi":"18 टाइगर रिजर्व।"}],"exp":{"en":"58 Tiger Reserves across 18 tiger-range States. Madhav in Madhya Pradesh became the 58th Tiger Reserve in 2025; no later reserve had been added to the NTCA list by 2026.","hi":"18 बाघ-बहुल राज्यों में 58 बाघ आरक्षित क्षेत्र। मध्य प्रदेश का माधव 2025 में 58वाँ बाघ आरक्षित क्षेत्र बना; 2026 तक NTCA सूची में इसके बाद कोई नया बाघ आरक्षित क्षेत्र नहीं जुड़ा था।"}},{"q":{"en":"What is India's latest published all-India tiger population estimate?","hi":"भारत का नवीनतम प्रकाशित सभी-भारत बाघ जनसंख्या अनुमान क्या है?"},"a":{"en":"3,682 tigers on average (range 3,167–3,925) in the All India Tiger Estimation 2022.","hi":"अखिल भारतीय बाघ आकलन 2022 में औसत 3,682 बाघ (सीमा 3,167-3,925)।"},"o":[{"en":"3,682 tigers on average (range 3,167–3,925) in the All India Tiger Estimation 2022.","hi":"अखिल भारतीय बाघ आकलन 2022 में औसत 3,682 बाघ (सीमा 3,167-3,925)।"},{"en":"2,967 tigers in the 2022 estimate.","hi":"2022 अनुमान में 2,967 बाघ।"},{"en":"3,167 is the final average estimate and no range is given.","hi":"3,167 अंतिम औसत अनुमान है और कोई सीमा नहीं।"},{"en":"4,200 tigers in the latest published all-India estimate.","hi":"नवीनतम प्रकाशित सभी-भारत अनुमान में 4,200 बाघ।"}],"exp":{"en":"3,682 tigers on average (range 3,167–3,925) in the All India Tiger Estimation 2022. The 3,682 figure is the average estimate from the 2022 national assessment, while 3,167 is the minimum/photo-captured-based figure and 3,925 the estimated upper limit.","hi":"अखिल भारतीय बाघ आकलन 2022 में औसत 3,682 बाघ (सीमा 3,167-3,925)। 3,682 व्यक्ति 2022 राष्ट्रीय आकलन का औसत अनुमान है; 3,167 न्यूनतम/कैमरे में दर्ज बाघों पर आधारित व्यक्ति और 3,925 अनुमानित ऊपरी सीमा है।"}},{"q":{"en":"According to the Government of India's July 2026 backgrounder, about what share of the world's wild tigers lives in India?","hi":"सरकार का भारत के जुलाई 2026 की पृष्ठभूमि-सूचना के अनुसार विश्व के वन्य बाघ का लगभग कितना हिस्सा भारत में है?"},"a":{"en":"Nearly 70%.","hi":"लगभग 70%।"},"o":[{"en":"Nearly 70%.","hi":"लगभग 70%।"},{"en":"About 25%.","hi":"लगभग 25%।"},{"en":"More than 90%.","hi":"90% से अधिक।"},{"en":"About 40%.","hi":"लगभग 40%।"}],"exp":{"en":"Nearly 70%. Government summaries have used slightly different global-share approximations over time; the July 2026 backgrounder states that India holds nearly 70% of the world's wild tigers.","hi":"लगभग 70%। सरकारी सारांशों ने अलग समय पर कुछ अलग वैश्विक हिस्से के अनुमान उपयोग किए हैं; जुलाई 2026 की पृष्ठभूमि-सूचना भारत को विश्व के वन्य बाघ का लगभग 70% आश्रय-स्थल बताता है।"}},{"q":{"en":"When and where was Project Tiger launched?","hi":"प्रोजेक्ट टाइगर कब और कहाँ शुरुआत हुआ?"},"a":{"en":"1 April 1973 at Corbett National Park, with nine initial tiger reserves.","hi":"1 अप्रैल 1973 को कॉर्बेट राष्ट्रीय उद्यान से, नौ प्रारंभिक बाघ आरक्षित क्षेत्र के साथ।"},"o":[{"en":"1 April 1973 at Corbett National Park, with nine initial tiger reserves.","hi":"1 अप्रैल 1973 को कॉर्बेट राष्ट्रीय उद्यान से, नौ प्रारंभिक बाघ आरक्षित क्षेत्र के साथ।"},{"en":"Ranthambore National Park.","hi":"रणथंभौर राष्ट्रीय उद्यान।"},{"en":"Sundarbans National Park.","hi":"सुंदरबन राष्ट्रीय उद्यान।"},{"en":"Kanha National Park.","hi":"कान्हा राष्ट्रीय उद्यान।"}],"exp":{"en":"1 April 1973 at Corbett National Park, with nine initial tiger reserves. Project Tiger was launched as a Centrally Sponsored Scheme with nine initial reserves, and Corbett was the launch venue.","hi":"1 अप्रैल 1973 को कॉर्बेट राष्ट्रीय उद्यान से, नौ प्रारंभिक बाघ आरक्षित क्षेत्र के साथ। प्रोजेक्ट टाइगर केंद्र प्रायोजित योजना के रूप में नौ प्रारंभिक आरक्षित क्षेत्र के सहयोग से शुरू हुई और कॉर्बेट शुरुआत स्थल था।"}}]},{"title":{"en":"2. Biosphere Reserve / Reserved Area","hi":"2। बायोस्फीयर रिजर्व / आरक्षित क्षेत्र"},"questions":[{"q":{"en":"Under which programme was the Biosphere Reserve programme started?","hi":"बायोस्फीयर रिजर्व (जैवमंडल आरक्षित क्षेत्र) कार्यक्रम किस कार्यक्रम के तहत शुरू किया गया था?"},"a":{"en":"UNESCO's Man and the Biosphere (MAB) Programme, launched in 1971.","hi":"UNESCO का मानव एवं जैवमंडल (MAB) कार्यक्रम, 1971 में शुरू किया गया।"},"o":[{"en":"UNESCO's Man and the Biosphere (MAB) Programme, launched in 1971.","hi":"UNESCO का मानव एवं जैवमंडल (MAB) कार्यक्रम, 1971 में शुरू किया गया।"},{"en":"UNEP's Global Environment Facility (1992).","hi":"यूएनईपी की वैश्विक पर्यावरण सुविधा (1992)।"},{"en":"IUCN's Red Data Programme (1948).","hi":"आईयूसीएन का रेड डेटा प्रोग्राम (1948)।"},{"en":"World Wildlife Fund's Nature Initiative (1961).","hi":"विश्व वन्यजीव कोष की प्रकृति पहल (1961)।"}],"exp":{"en":"UNESCO's Man and the Biosphere (MAB) Programme, launched in 1971. UNESCO's MAB Programme links biodiversity conservation with sustainable development and scientific learning rather than treating biosphere reserves as strict no-use protected areas everywhere.","hi":"UNESCO का मानव एवं जैवमंडल (MAB) कार्यक्रम, 1971 में शुरू किया गया। UNESCO MAB कार्यक्रम जैव विविधता संरक्षण को सतत विकास और वैज्ञानिक अध्ययन से जोड़ता है; जैवमंडल आरक्षित क्षेत्र को हर क्षेत्र में पूर्णतः निषिद्ध-उपयोग वाला संरक्षित क्षेत्र नहीं माना जाता।"}},{"q":{"en":"What are the three core functions of a Biosphere Reserve under UNESCO's MAB framework?","hi":"UNESCO MAB ढाँचा के अंतर्गत जैवमंडल आरक्षित क्षेत्र के तीन मूल कार्य क्या हैं?"},"a":{"en":"Conservation, socio-culturally and ecologically sustainable development, and logistic support for research, monitoring, education and training.","hi":"संरक्षण, सामाजिक-सांस्कृतिक एवं पारिस्थितिक रूप से सतत विकास, तथा अनुसंधान, निगरानी, शिक्षा और प्रशिक्षण के लिए व्यावहारिक सहायता।"},"o":[{"en":"Conservation, socio-culturally and ecologically sustainable development, and logistic support for research, monitoring, education and training.","hi":"संरक्षण, सामाजिक-सांस्कृतिक एवं पारिस्थितिक रूप से सतत विकास, तथा अनुसंधान, निगरानी, शिक्षा और प्रशिक्षण के लिए व्यावहारिक सहायता।"},{"en":"Only strict wildlife protection with no human activity anywhere.","hi":"केवल कड़ा वन्यजीव संरक्षण, किसी भी क्षेत्र में मानवीय गतिविधि नहीं।"},{"en":"Industrial timber extraction, mining and urban expansion.","hi":"औद्योगिक काष्ठ निष्कर्षण, खनन और नगरीय विस्तार।"},{"en":"Only captive breeding outside natural habitats.","hi":"केवल प्राकृतिक आवास के बाहर बंदी प्रजनन।"}],"exp":{"en":"Conservation, socio-culturally and ecologically sustainable development, and logistic support for research, monitoring, education and training. UNESCO defines three interconnected functions—conservation, sustainable development and logistic support. These are implemented through core, buffer and transition zones.","hi":"संरक्षण, सामाजिक-सांस्कृतिक एवं पारिस्थितिक रूप से सतत विकास, तथा अनुसंधान, निगरानी, शिक्षा और प्रशिक्षण के लिए व्यावहारिक सहायता। UNESCO तीन परस्पर जुड़े कार्य परिभाषित करता है-संरक्षण, सतत विकास और व्यावहारिक सहायता। इन्हें मूल, मध्यवर्ती क्षेत्र और संक्रमण क्षेत्र के माध्यम से क्रियान्वित किया जाता है।"}},{"q":{"en":"Which is India's First Biosphere Reserve and when was it established?","hi":"भारत का पहला बायोस्फीयर रिजर्व कौन सा है और इसकी स्थापना कब हुई थी?"},"a":{"en":"Nilgiri Biosphere Reserve, designated in 1986; it spans parts of Tamil Nadu, Kerala and Karnataka.","hi":"नीलगिरि जैवमंडल आरक्षित क्षेत्र, 1986 में नामित; यह तमिलनाडु, केरल और कर्नाटक के भाग में फैला है।"},"o":[{"en":"Nilgiri Biosphere Reserve, designated in 1986; it spans parts of Tamil Nadu, Kerala and Karnataka.","hi":"नीलगिरि जैवमंडल आरक्षित क्षेत्र, 1986 में नामित; यह तमिलनाडु, केरल और कर्नाटक के भाग में फैला है।"},{"en":"Nanda Devi (1988) — located in Uttarakhand.","hi":"नंदा देवी (1988) - उत्तराखंड में स्थित है।"},{"en":"Sundarbans (1989) — located in West Bengal.","hi":"सुंदरबन (1989) - पश्चिम बंगाल में स्थित है।"},{"en":"Gulf of Mannar (1989) — located in Tamil Nadu.","hi":"मन्नार की खाड़ी (1989) - तमिलनाडु में स्थित है।"}],"exp":{"en":"Nilgiri Biosphere Reserve, designated in 1986; it spans parts of Tamil Nadu, Kerala and Karnataka. Nilgiri was India's first national Biosphere Reserve. It is a trans-state reserve covering parts of Tamil Nadu, Kerala and Karnataka, so listing only two States is incomplete.","hi":"नीलगिरि जैवमंडल आरक्षित क्षेत्र, 1986 में नामित; यह तमिलनाडु, केरल और कर्नाटक के भाग में फैला है। नीलगिरि भारत का पहला राष्ट्रीय जैवमंडल आरक्षित क्षेत्र था। यह तमिलनाडु, केरल और कर्नाटक के भाग समाहित करता है; केवल दो राज्य बताना अपूर्ण है।"}},{"q":{"en":"Which is India's largest nationally designated Biosphere Reserve by area?","hi":"क्षेत्रफल के आधार पर भारत का सबसे बड़ा राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र कौन-सा है?"},"a":{"en":"Kachchh (Great Rann of Kutch) Biosphere Reserve, Gujarat — about 12,454 km².","hi":"कच्छ (कच्छ का महान रण) जैवमंडल आरक्षित क्षेत्र, गुजरात - लगभग 12,454 किमी²।"},"o":[{"en":"Kachchh (Great Rann of Kutch) Biosphere Reserve, Gujarat — about 12,454 km².","hi":"कच्छ (कच्छ का महान रण) जैवमंडल आरक्षित क्षेत्र, गुजरात - लगभग 12,454 किमी²।"},{"en":"Nilgiri (Karnataka/Kerala).","hi":"नीलगिरि (कर्नाटक/केरल)।"},{"en":"Gulf of Mannar (Tamil Nadu).","hi":"मन्नार की खाड़ी (तमिलनाडु)।"},{"en":"Sundarbans (West Bengal).","hi":"सुंदरबन (पश्चिम बंगाल)।"}],"exp":{"en":"Kachchh (Great Rann of Kutch) Biosphere Reserve, Gujarat — about 12,454 km². Kachchh covers about 12,454 km², making it the largest among India's nationally designated Biosphere Reserves by notified area.","hi":"कच्छ (कच्छ का महान रण) जैवमंडल आरक्षित क्षेत्र, गुजरात - लगभग 12,454 किमी²। कच्छ लगभग 12,454 किमी² समाहित करता है और अधिसूचित क्षेत्रफल के आधार पर भारत के राष्ट्रीय जैवमंडल आरक्षित क्षेत्र में सबसे बड़ा है।"}},{"q":{"en":"Which is India's smallest nationally designated Biosphere Reserve by area?","hi":"क्षेत्रफल के आधार पर भारत का सबसे छोटा राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र कौन-सा है?"},"a":{"en":"Dibru-Saikhowa Biosphere Reserve, Assam — about 765 km².","hi":"डिब्रू-सैखोवा जैवमंडल आरक्षित क्षेत्र, असम - लगभग 765 किमी²।"},"o":[{"en":"Dibru-Saikhowa Biosphere Reserve, Assam — about 765 km².","hi":"डिब्रू-सैखोवा जैवमंडल आरक्षित क्षेत्र, असम - लगभग 765 किमी²।"},{"en":"Nokrek (Meghalaya).","hi":"नोकरेक (मेघालय)।"},{"en":"Panna (Madhya Pradesh).","hi":"पन्ना (मध्य प्रदेश)।"},{"en":"Pachmarhi (Madhya Pradesh).","hi":"पचमढ़ी (मध्य प्रदेश)।"}],"exp":{"en":"Dibru-Saikhowa Biosphere Reserve, Assam — about 765 km². Dibru-Saikhowa's notified Biosphere Reserve area is about 765 km², smaller than Nokrek and the other national Biosphere Reserves.","hi":"डिब्रू-सैखोवा जैवमंडल आरक्षित क्षेत्र, असम - लगभग 765 किमी²। डिब्रू-सैखोवा का अधिसूचित जैवमंडल आरक्षित क्षेत्र क्षेत्रफल लगभग 765 किमी² है, जो नोकरेक और अन्य राष्ट्रीय जैवमंडल आरक्षित क्षेत्र से छोटा है।"}},{"q":{"en":"Nagarhole National Park is a part of which Biosphere Reserve?","hi":"नागरहोल राष्ट्रीय उद्यान किस बायोस्फीयर रिजर्व का एक हिस्सा है?"},"a":{"en":"Nilgiri Biosphere Reserve.","hi":"नीलगिरि बायोस्फीयर रिजर्व।"},"o":[{"en":"Nilgiri Biosphere Reserve.","hi":"नीलगिरि बायोस्फीयर रिजर्व।"},{"en":"Agasthyamalai Biosphere Reserve.","hi":"अगस्त्यमलाई बायोस्फीयर रिजर्व।"},{"en":"Gulf of Mannar Biosphere Reserve.","hi":"मन्नार की खाड़ी बायोस्फीयर रिजर्व।"},{"en":"Seshachalam Hills Biosphere Reserve.","hi":"शेषाचलम हिल्स बायोस्फीयर रिजर्व।"}],"exp":{"en":"Nilgiri Biosphere Reserve. Nagarhole is one of the important protected areas embedded in the wider Nilgiri landscape, which spans the Western Ghats across three States.","hi":"नीलगिरि बायोस्फीयर रिजर्व। नागरहोल व्यापक नीलगिरि परिदृश्य का महत्वपूर्ण संरक्षित क्षेत्रफल है; नीलगिरि परिदृश्य पश्चिमी घाट में तीन राज्य तक फैला है।"}}]},{"title":{"en":"3. Important Facts","hi":"3। महत्वपूर्ण तथ्य"},"questions":[{"q":{"en":"Which high-altitude Indian World Heritage property is home to both the Asiatic black bear and snow leopard?","hi":"कौन-सा उच्च पर्वतीय भारतीय विश्व धरोहर क्षेत्र एशियाई काला भालू और हिम तेंदुआ दोनों का आवास है?"},"a":{"en":"Nanda Devi and Valley of Flowers National Parks, Uttarakhand.","hi":"नंदा देवी और फूलों की घाटी राष्ट्रीय उद्यान, उत्तराखंड।"},"o":[{"en":"Nanda Devi and Valley of Flowers National Parks, Uttarakhand.","hi":"नंदा देवी और फूलों की घाटी राष्ट्रीय उद्यान, उत्तराखंड।"},{"en":"In Jim Corbett and Rajaji National Parks.","hi":"जिम कॉर्बेट और राजाजी राष्ट्रीय उद्यानों में।"},{"en":"In Kaziranga and Manas National Parks.","hi":"काजीरंगा और मानस राष्ट्रीय उद्यानों में।"},{"en":"In Sundarbans and Buxa Tiger Reserves.","hi":"सुंदरबन और बक्सा टाइगर रिजर्व में।"}],"exp":{"en":"Nanda Devi and Valley of Flowers National Parks, Uttarakhand. UNESCO records both species from this high-altitude Himalayan World Heritage property, which combines the rugged Nanda Devi landscape with the alpine Valley of Flowers.","hi":"नंदा देवी और फूलों की घाटी राष्ट्रीय उद्यान, उत्तराखंड। UNESCO इस उच्च पर्वतीय हिमालयी विश्व धरोहर क्षेत्र में दोनों प्रजाति दर्ज करता है; यह ऊबड़-खाबड़ नंदा देवी परिदृश्य और अल्पाइन फूलों की घाटी को संयोजित करता है।"}},{"q":{"en":"Which protected area in Odisha is especially known for India's largest natural population of estuarine (saltwater) crocodiles?","hi":"ओडिशा का कौन-सा संरक्षित क्षेत्रफल भारत की सबसे बड़ा प्राकृतिक ज्वारनदमुखीय/खारे पानी के मगरमच्छ की जनसंख्या के लिए विशेष रूप से ज्ञात है?"},"a":{"en":"Bhitarkanika Wildlife Sanctuary–National Park landscape.","hi":"भितरकनिका वन्यजीव अभयारण्य-राष्ट्रीय उद्यान परिदृश्य।"},"o":[{"en":"Bhitarkanika Wildlife Sanctuary–National Park landscape.","hi":"भितरकनिका वन्यजीव अभयारण्य-राष्ट्रीय उद्यान परिदृश्य।"},{"en":"In Sundarbans National Park (West Bengal).","hi":"सुंदरबन राष्ट्रीय उद्यान (पश्चिम बंगाल) में।"},{"en":"In Chilika Lake (Odisha).","hi":"चिल्का झील (ओडिशा) में।"},{"en":"In Gulf of Mannar (Tamil Nadu).","hi":"मन्नार की खाड़ी (तमिलनाडु) में।"}],"exp":{"en":"Bhitarkanika Wildlife Sanctuary–National Park landscape. Bhitarkanika's mangrove-estuarine ecosystem supports India's largest natural population of saltwater crocodiles and has long been a major crocodile-conservation landscape.","hi":"भितरकनिका वन्यजीव अभयारण्य-राष्ट्रीय उद्यान परिदृश्य। भितरकनिका मैंग्रोव-ज्वारनदमुखीय पारितंत्र भारत की सबसे बड़ा प्राकृतिक खारे पानी के मगरमच्छ की जनसंख्या समर्थन करता है और लंबी-स्थिति मगरमच्छ-संरक्षण परिदृश्य है।"}},{"q":{"en":"What is the correct naming history of India's first National Park?","hi":"भारत के पहले राष्ट्रीय उद्यान का सही नामकरण-इतिहास क्या है?"},"a":{"en":"Hailey National Park (1936) → Ramganga National Park (1954–55) → Corbett National Park (1955–56/1956). It remains Corbett National Park today.","hi":"हेली राष्ट्रीय उद्यान (1936) → रामगंगा राष्ट्रीय उद्यान (1954-55) → कॉर्बेट राष्ट्रीय उद्यान (1955-56/1956)। आज भी इसका नाम कॉर्बेट राष्ट्रीय उद्यान है।"},"o":[{"en":"Hailey National Park (1936) → Ramganga National Park (1954–55) → Corbett National Park (1955–56/1956). It remains Corbett National Park today.","hi":"हेली राष्ट्रीय उद्यान (1936) → रामगंगा राष्ट्रीय उद्यान (1954-55) → कॉर्बेट राष्ट्रीय उद्यान (1955-56/1956)। आज भी इसका नाम कॉर्बेट राष्ट्रीय उद्यान है।"},{"en":"Hailey National Park (1936) → Corbett National Park → Ramganga National Park in 2021.","hi":"हेली राष्ट्रीय उद्यान (1936) → कॉर्बेट राष्ट्रीय उद्यान → 2021 में रामगंगा राष्ट्रीय उद्यान।"},{"en":"Kanha National Park (1936) → Corbett National Park in 1973.","hi":"कान्हा राष्ट्रीय उद्यान (1936) → 1973 में कॉर्बेट राष्ट्रीय उद्यान।"},{"en":"Hailey National Park was created only after Project Tiger in 1973.","hi":"हेली राष्ट्रीय उद्यान प्रोजेक्ट टाइगर के बाद 1973 में बना।"}],"exp":{"en":"Hailey National Park (1936) → Ramganga National Park (1954–55) → Corbett National Park (1955–56/1956). It remains Corbett National Park today. The park was not renamed to Ramganga in 2021. Ramganga was an intermediate post-Independence name in the mid-1950s before the present Corbett name was adopted.","hi":"हेली राष्ट्रीय उद्यान (1936) → रामगंगा राष्ट्रीय उद्यान (1954-55) → कॉर्बेट राष्ट्रीय उद्यान (1955-56/1956)। आज भी इसका नाम कॉर्बेट राष्ट्रीय उद्यान है। उद्यान का नाम 2021 में बदलकर रामगंगा नहीं किया गया। रामगंगा 1950 के दशक के मध्य का स्वतंत्रता के बाद का मध्यवर्ती नाम था, जिसके बाद वर्तमान कॉर्बेट नाम अपनाया गया।"}}]},{"title":{"en":"4. Tiger Census","hi":"4। बाघ जनगणना (बाघ गणना)"},"questions":[{"q":{"en":"What is India's total Tiger Population?","hi":"भारत की कुल बाघ आबादी कितनी है?"},"a":{"en":"Average estimate 3,682 tigers, with an estimated range of 3,167–3,925 in the All India Tiger Estimation 2022.","hi":"अखिल भारतीय बाघ आकलन 2022 में औसत अनुमान 3,682 बाघ, अनुमानित सीमा 3,167-3,925।"},"o":[{"en":"Average estimate 3,682 tigers, with an estimated range of 3,167–3,925 in the All India Tiger Estimation 2022.","hi":"अखिल भारतीय बाघ आकलन 2022 में औसत अनुमान 3,682 बाघ, अनुमानित सीमा 3,167-3,925।"},{"en":"2,967.","hi":"2,967।"},{"en":"3,167.","hi":"3,167।"},{"en":"4,000.","hi":"4,000।"}],"exp":{"en":"Average estimate 3,682 tigers, with an estimated range of 3,167–3,925 in the All India Tiger Estimation 2022. The national tiger estimate is produced through the All India Tiger Estimation cycle, which combines camera-trap and broader landscape data rather than a simple head count.","hi":"अखिल भारतीय बाघ आकलन 2022 में औसत अनुमान 3,682 बाघ, अनुमानित सीमा 3,167-3,925। राष्ट्रीय बाघ अनुमान अखिल भारतीय बाघ आकलन चक्र से आता है, जो सरल प्रमुख संख्या के बजाय कैमरा-ट्रैप और व्यापक परिदृश्य आँकड़े संयोजित करता है।"}},{"q":{"en":"How many Tiger Reserves are there in India as of 2026?","hi":"2026 तक भारत में कुल कितने बाघ आरक्षित क्षेत्र हैं?"},"a":{"en":"58.","hi":"58।"},"o":[{"en":"58.","hi":"58।"},{"en":"54.","hi":"54।"},{"en":"50.","hi":"50।"},{"en":"62.","hi":"62।"}],"exp":{"en":"58. The current NTCA network comprises 58 reserves in 18 tiger-range States, with Madhav as the latest addition from 2025.","hi":"58। वर्तमान NTCA नेटवर्क में 18 बाघ-बहुल राज्यों के 58 आरक्षित क्षेत्र हैं; नवीनतम वृद्धि 2025 का माधव है।"}},{"q":{"en":"According to the Government of India's July 2026 backgrounder, what approximate share of the world's wild tigers lives in India?","hi":"सरकार का भारत के जुलाई 2026 की पृष्ठभूमि-सूचना के अनुसार विश्व के वन्य बाघ का लगभग हिस्सा भारत में कितना है?"},"a":{"en":"Nearly 70%.","hi":"लगभग 70%।"},"o":[{"en":"Nearly 70%.","hi":"लगभग 70%।"},{"en":"60%.","hi":"60%।"},{"en":"85%.","hi":"85%।"},{"en":"50%.","hi":"50%।"}],"exp":{"en":"Nearly 70%. This is a rounded global-share statement from the 2026 Government backgrounder; earlier official summaries around the 2022 estimate also used 'almost 75%'.","hi":"लगभग 70%। यह 2026 सरकार पृष्ठभूमि-सूचना का पूर्णांकित वैश्विक-हिस्सा कथन है; 2022 अनुमान के आसपास पहले आधिकारिक सारांशों ने 'लगभग 75%' शब्दावली भी उपयोग की थी।"}},{"q":{"en":"What is the current total notified area of India's 58 Tiger Reserves?","hi":"भारत के 58 बाघ आरक्षित क्षेत्र का वर्तमान कुल अधिसूचित क्षेत्रफल कितना है?"},"a":{"en":"84,487.83 km², according to the current NTCA reserve list.","hi":"वर्तमान NTCA आरक्षित क्षेत्र सूची के अनुसार 84,487.83 किमी²।"},"o":[{"en":"84,487.83 km², according to the current NTCA reserve list.","hi":"वर्तमान NTCA आरक्षित क्षेत्र सूची के अनुसार 84,487.83 किमी²।"},{"en":"75,769.83 km².","hi":"75,769.83 किमी²।"},{"en":"68,518.80 km².","hi":"68,518.80 किमी²।"},{"en":"1,03,408 km² of notified Tiger Reserves.","hi":"अधिसूचित बाघ आरक्षित क्षेत्र का 1,03,408 किमी²।"}],"exp":{"en":"The current network of 58 tiger reserves covers 84,487.83 km². The older 75,769.83 km² figure belonged to an earlier, smaller reserve network. The current NTCA list totals 84,487.83 km² for 58 reserves.","hi":"वर्तमान 58 बाघ आरक्षित क्षेत्रों का कुल क्षेत्रफल 84,487.83 वर्ग किमी है। 75,769.83 वर्ग किमी का पुराना आँकड़ा इससे पहले के छोटे आरक्षित-क्षेत्र नेटवर्क से संबंधित था।"}},{"q":{"en":"Which states have the highest Tiger Population (in order)?","hi":"सर्वाधिक बाघ आबादी वाले राज्य कौन से हैं (क्रम में)?"},"a":{"en":"Madhya Pradesh (785) > Karnataka (563) > Uttarakhand (560), in the 2022 All India Tiger Estimation.","hi":"2022 अखिल भारतीय बाघ आकलन में मध्य प्रदेश (785) > कर्नाटक (563) > उत्तराखंड (560)।"},"o":[{"en":"Madhya Pradesh (785) > Karnataka (563) > Uttarakhand (560), in the 2022 All India Tiger Estimation.","hi":"2022 अखिल भारतीय बाघ आकलन में मध्य प्रदेश (785) > कर्नाटक (563) > उत्तराखंड (560)।"},{"en":"Karnataka > Madhya Pradesh > Maharashtra.","hi":"कर्नाटक > मध्य प्रदेश > महाराष्ट्र।"},{"en":"Uttarakhand > Madhya Pradesh > Karnataka.","hi":"उत्तराखंड > मध्य प्रदेश > कर्नाटक।"},{"en":"Madhya Pradesh > Maharashtra > Karnataka.","hi":"मध्य प्रदेश > महाराष्ट्र > कर्नाटक।"}],"exp":{"en":"Madhya Pradesh (785) > Karnataka (563) > Uttarakhand (560), in the 2022 All India Tiger Estimation. The 2022 State estimates place Madhya Pradesh first, Karnataka second and Uttarakhand third, followed by Maharashtra.","hi":"2022 अखिल भारतीय बाघ आकलन में मध्य प्रदेश (785) > कर्नाटक (563) > उत्तराखंड (560)। 2022 राज्य अनुमान में मध्य प्रदेश पहला, कर्नाटक दूसरा और उत्तराखंड तीसरा है; इसके बाद महाराष्ट्र आता है।"}},{"q":{"en":"Which State had the highest tiger population in the 2022 All India Tiger Estimation?","hi":"2022 अखिल भारतीय बाघ आकलन में सर्वाधिक बाघ जनसंख्या किस राज्य की थी?"},"a":{"en":"Madhya Pradesh — 785 tigers; it is popularly called the 'Tiger State'.","hi":"मध्य प्रदेश - 785 बाघ; इसे लोकप्रिय रूप से 'बाघ राज्य' कहा जाता है।"},"o":[{"en":"Madhya Pradesh — 785 tigers; it is popularly called the 'Tiger State'.","hi":"मध्य प्रदेश - 785 बाघ; इसे लोकप्रिय रूप से 'बाघ राज्य' कहा जाता है।"},{"en":"Karnataka — it holds the highest tiger population.","hi":"कर्नाटक - यहाँ बाघों की आबादी सबसे अधिक है।"},{"en":"West Bengal — due to the Royal Bengal Tiger.","hi":"पश्चिम बंगाल - रॉयल बंगाल टाइगर के कारण।"},{"en":"Uttarakhand — due to Jim Corbett NP.","hi":"उत्तराखंड - जिम कॉर्बेट एनपी के कारण।"}],"exp":{"en":"Madhya Pradesh — 785 tigers; it is popularly called the 'Tiger State'. 'Tiger State' is an informal popular label; the objective fact is that Madhya Pradesh had the highest State tiger estimate in 2022.","hi":"मध्य प्रदेश - 785 बाघ; इसे लोकप्रिय रूप से 'बाघ राज्य' कहा जाता है। 'बाघ राज्य' अनौपचारिक लोकप्रिय नाम है; लक्ष्य तथ्य यह है कि 2022 में मध्य प्रदेश का राज्य बाघ अनुमान सर्वाधिक था।"}}]},{"title":{"en":"5. Wildlife Conservation Projects — Timeline","hi":"5। वन्यजीव संरक्षण परियोजनाएं - समयरेखा"},"questions":[{"q":{"en":"When was Project Hangul initiated?","hi":"प्रोजेक्ट हंगुल कब आरंभ किया गया हुआ?"},"a":{"en":"In 1970, as a conservation initiative for the Kashmir stag (Hangul) with support from conservation organisations.","hi":"1970 में, कश्मीर बारहसिंगा (हंगुल) के संरक्षण पहल के रूप में, संरक्षण संगठन के समर्थन के साथ।"},"o":[{"en":"In 1970, as a conservation initiative for the Kashmir stag (Hangul) with support from conservation organisations.","hi":"1970 में, कश्मीर बारहसिंगा (हंगुल) के संरक्षण पहल के रूप में, संरक्षण संगठन के समर्थन के साथ।"},{"en":"In 1972.","hi":"1972 में।"},{"en":"In 1973.","hi":"1973 में।"},{"en":"In 1987.","hi":"1987 में।"}],"exp":{"en":"In 1970, as a conservation initiative for the Kashmir stag (Hangul) with support from conservation organisations. Project Hangul is associated with the early-1970s effort to recover the Kashmir stag after its population had fallen sharply in the Kashmir Valley.","hi":"1970 में, कश्मीर बारहसिंगा (हंगुल) के संरक्षण पहल के रूप में, संरक्षण संगठन के समर्थन के साथ। प्रोजेक्ट हंगुल 1970 के दशक के आरंभ कश्मीर बारहसिंगा पुनर्प्राप्ति प्रयास से संबद्ध है, जब कश्मीर घाटी में इसकी जनसंख्या में तीव्र गिरावट आई थी।"}},{"q":{"en":"When was the modern Project Lion announced by the Government of India?","hi":"सरकार का भारत ने आधुनिक प्रोजेक्ट लायन कब घोषित किया?"},"a":{"en":"In 2020; it focuses on landscape-level conservation of the Asiatic lion in Gujarat.","hi":"2020 में; यह गुजरात में एशियाई सिंह के परिदृश्य-स्तर संरक्षण पर केंद्रित है।"},"o":[{"en":"In 2020; it focuses on landscape-level conservation of the Asiatic lion in Gujarat.","hi":"2020 में; यह गुजरात में एशियाई सिंह के परिदृश्य-स्तर संरक्षण पर केंद्रित है।"},{"en":"In 1972 as a nationwide lion census scheme.","hi":"1972 में देशव्यापी सिंह गणना योजना के रूप में।"},{"en":"In 1992 together with Project Elephant.","hi":"1992 में परियोजना हाथी के साथ।"},{"en":"In 2009 as part of Project Snow Leopard.","hi":"2009 में परियोजना हिम तेंदुआ के भाग के रूप में।"}],"exp":{"en":"In 2020; it focuses on landscape-level conservation of the Asiatic lion in Gujarat. The modern central Project Lion was announced in 2020 and uses a landscape-based approach for Asiatic lion conservation; older Gir conservation efforts predate it.","hi":"2020 में; यह गुजरात में एशियाई सिंह के परिदृश्य-स्तर संरक्षण पर केंद्रित है। आधुनिक केंद्रीय प्रोजेक्ट लायन 2020 में घोषित हुआ और एशियाई सिंह संरक्षण के लिए परिदृश्य-आधारित दृष्टिकोण उपयोग करता है; इससे पहले भी गिर में संरक्षण प्रयास चल रहे थे।"}},{"q":{"en":"When was Project Tiger launched?","hi":"प्रोजेक्ट टाइगर कब शुरुआत हुआ?"},"a":{"en":"1 April 1973.","hi":"1 अप्रैल 1973।"},"o":[{"en":"1 April 1973.","hi":"1 अप्रैल 1973।"},{"en":"In 1972.","hi":"1972 में।"},{"en":"In 1975.","hi":"1975 में।"},{"en":"In 1992.","hi":"1992 में।"}],"exp":{"en":"1 April 1973. The scheme began on 1 April 1973 with nine reserves and later expanded into today's nationwide tiger-reserve network.","hi":"1 अप्रैल 1973। योजना 1 अप्रैल 1973 को नौ आरक्षित क्षेत्र के साथ शुरू हुई और बाद में वर्तमान में's देशव्यापी बाघ-आरक्षित क्षेत्र नेटवर्क में विस्तार हुई।"}},{"q":{"en":"When was India's Crocodile Conservation Project launched?","hi":"भारत का मगरमच्छ संरक्षण परियोजना कब शुरुआत हुआ?"},"a":{"en":"In 1975.","hi":"1975 में।"},"o":[{"en":"In 1975.","hi":"1975 में।"},{"en":"In 1973.","hi":"1973 में।"},{"en":"In 1977.","hi":"1977 में।"},{"en":"In 1987.","hi":"1987 में।"}],"exp":{"en":"In 1975. The Crocodile Conservation Project began in the mid-1970s to recover gharial, mugger and saltwater crocodile populations through habitat protection, captive breeding and release.","hi":"1975 में। मगरमच्छ संरक्षण परियोजना 1970 के दशक के मध्य में घड़ियाल, मगरमच्छ और खारे पानी के मगरमच्छ की जनसंख्या पुनर्प्राप्त करने के लिए आवास संरक्षण, बंदी प्रजनन और पुनर्मुक्ति की पद्धतियों के साथ शुरू हुआ।"}},{"q":{"en":"Which 1977 protected-area milestone is central to Sangai (Manipur brow-antlered deer) conservation?","hi":"संगाई (मणिपुर संगाई हिरण) संरक्षण से कौन-सा 1977 संरक्षित-क्षेत्र मध्यवर्ती जुड़ा है?"},"a":{"en":"Keibul Lamjao National Park was notified in 1977, protecting the Sangai's unique phumdi habitat.","hi":"केइबुल लामजाओ राष्ट्रीय उद्यान 1977 में अधिसूचित हुआ, जिससे संगाई का विशिष्ट फुमदी आवास संरक्षित हुआ।"},"o":[{"en":"Keibul Lamjao National Park was notified in 1977, protecting the Sangai's unique phumdi habitat.","hi":"केइबुल लामजाओ राष्ट्रीय उद्यान 1977 में अधिसूचित हुआ, जिससे संगाई का विशिष्ट फुमदी आवास संरक्षित हुआ।"},{"en":"Project Tiger was moved to Manipur in 1977.","hi":"प्रोजेक्ट टाइगर को 1977 में मणिपुर परिवर्तन किया गया।"},{"en":"The Sangai was first discovered in 1977.","hi":"संगाई पहली बार 1977 में पाया हुआ।"},{"en":"Manipur's first biosphere reserve was created in 1977.","hi":"मणिपुर का पहला जैवमंडल आरक्षित क्षेत्र 1977 में बनाया गया।"}],"exp":{"en":"Keibul Lamjao National Park was notified in 1977, protecting the Sangai's unique phumdi habitat. Sangai conservation is strongly linked with Keibul Lamjao, the unique floating National Park on Loktak Lake; the park was notified in 1977 after the species' very low 1975 census.","hi":"केइबुल लामजाओ राष्ट्रीय उद्यान 1977 में अधिसूचित हुआ, जिससे संगाई का विशिष्ट फुमदी आवास संरक्षित हुआ। संगाई संरक्षण केइबुल लामजाओ से मुख्य रूप से संबंधित है, जो लोकटक झील पर विशिष्ट तैरते राष्ट्रीय उद्यान है; अत्यधिक निम्न 1975 गणना के बाद उद्यान 1977 में अधिसूचित हुआ।"}},{"q":{"en":"When was the greater one-horned rhinoceros reintroduced to Dudhwa National Park?","hi":"भारतीय एक-सींग वाले गैंडे को दुधवा राष्ट्रीय उद्यान में कब पुनः बसाया गया?"},"a":{"en":"The first phase was in 1984; a second translocation followed in 1985.","hi":"पहला चरण 1984 में हुई; दूसरा स्थानांतरण 1985 में अनुसरण हुई।"},"o":[{"en":"The first phase was in 1984; a second translocation followed in 1985.","hi":"पहला चरण 1984 में हुई; दूसरा स्थानांतरण 1985 में अनुसरण हुई।"},{"en":"It began only in 1987.","hi":"यह केवल 1987 में शुरू हुआ।"},{"en":"It began in 1992 with Project Elephant.","hi":"यह 1992 में परियोजना हाथी के साथ शुरू हुआ।"},{"en":"It began in 1975 under the Crocodile Project.","hi":"यह 1975 में मगरमच्छ परियोजना के अंतर्गत शुरू हुआ।"}],"exp":{"en":"The first phase was in 1984; a second translocation followed in 1985. Dudhwa is India's major rhino-reintroduction example: animals were translocated in 1984 and again in 1985, creating a reintroduced population outside the species' main north-eastern range.","hi":"पहला चरण 1984 में हुई; दूसरा स्थानांतरण 1985 में अनुसरण हुई। दुधवा भारत का प्रमुख गैंडा-पुनर्स्थापन उदाहरण है: 1984 और 1985 में पशु स्थानांतरित किए गए, जिससे पूर्वोत्तर मुख्य सीमा के बाहर पुनः बसाया जनसंख्या बनी।"}},{"q":{"en":"When was Project Elephant launched?","hi":"परियोजना हाथी कब शुरुआत हुआ?"},"a":{"en":"In 1992.","hi":"1992 में।"},"o":[{"en":"In 1992.","hi":"1992 में।"},{"en":"In 1987.","hi":"1987 में।"},{"en":"In 1994.","hi":"1994 में।"},{"en":"In 1999.","hi":"1999 में।"}],"exp":{"en":"In 1992. Project Elephant is a centrally sponsored conservation initiative focused on Asian elephants, their habitats and corridors, and human-elephant conflict management.","hi":"1992 में। परियोजना हाथी केंद्र प्रायोजित संरक्षण पहल है जो एशियाई हाथी, आवासों/गलियारे और मानवीय-हाथी संघर्ष प्रबंधन पर केंद्रित है।"}},{"q":{"en":"When did the Red Panda Conservation Breeding Project at Darjeeling Zoo begin, and when did its first planned successful breeding occur?","hi":"दार्जिलिंग चिड़ियाघर में लाल पांडा संरक्षण प्रजनन परियोजना कब शुरू हुआ और पहला नियोजित सफल प्रजनन कब हुई?"},"a":{"en":"The project began in 1990; the first planned successful breeding occurred in 1994.","hi":"परियोजना 1990 में शुरू हुआ; पहला नियोजित सफल प्रजनन 1994 में हुई।"},"o":[{"en":"The project began in 1990; the first planned successful breeding occurred in 1994.","hi":"परियोजना 1990 में शुरू हुआ; पहला नियोजित सफल प्रजनन 1994 में हुई।"},{"en":"The project began and succeeded for the first time in 2009.","hi":"परियोजना 2009 में शुरू हुआ और पहला सफलता भी उसी वर्ष हुई।"},{"en":"It began in 1987 as a rhino programme.","hi":"यह 1987 में गैंडा कार्यक्रम के रूप में शुरू हुआ।"},{"en":"It began in 1999 under the Sea Turtle Project.","hi":"यह 1999 में समुद्र कछुआ परियोजना के अंतर्गत शुरू हुआ।"}],"exp":{"en":"The project began in 1990; the first planned successful breeding occurred in 1994. Darjeeling Zoo's programme began in 1990; 1994 is notable for the first planned successful breeding, so treating 1994 as the project's start year mixes two different milestones.","hi":"परियोजना 1990 में शुरू हुआ; पहला नियोजित सफल प्रजनन 1994 में हुई। दार्जिलिंग चिड़ियाघर कार्यक्रम 1990 में शुरू हुआ; 1994 पहला नियोजित सफल प्रजनन का मध्यवर्ती है, इसलिए 1994 को परियोजना-आरंभ वर्ष मानना दो प्रमुख पड़ाव को मिश्रण करता है।"}},{"q":{"en":"When was the Government of India–UNDP Sea Turtle Conservation Project launched?","hi":"भारत सरकार-UNDP समुद्री कछुआ संरक्षण परियोजना कब शुरू हुई?"},"a":{"en":"In November 1999.","hi":"नवंबर 1999 में।"},"o":[{"en":"In November 1999.","hi":"नवंबर 1999 में।"},{"en":"In 1994.","hi":"1994 में।"},{"en":"In 2009.","hi":"2009 में।"},{"en":"In 2013.","hi":"2013 में।"}],"exp":{"en":"In November 1999. The national sea-turtle project was launched with UNDP collaboration and WII as the implementing agency, covering multiple coastal States with special focus on Odisha.","hi":"नवंबर 1999 में। राष्ट्रीय समुद्री-कछुआ परियोजना UNDP सहयोग और WII क्रियान्वयन संस्था के सहयोग से शुरू हुई, अनेक तटीय राज्यों में, जिसमें ओडिशा पर विशेष ध्यान था।"}},{"q":{"en":"When was Project Snow Leopard launched in India?","hi":"भारत में परियोजना हिम तेंदुआ कब शुरुआत हुआ?"},"a":{"en":"20 January 2009.","hi":"20 जनवरी 2009।"},"o":[{"en":"20 January 2009.","hi":"20 जनवरी 2009।"},{"en":"In 1999.","hi":"1999 में।"},{"en":"In 2013.","hi":"2013 में।"},{"en":"In 1992.","hi":"1992 में।"}],"exp":{"en":"20 January 2009. Project Snow Leopard adopted a landscape and community-participation approach for high-altitude Himalayan ecosystems rather than focusing on isolated protected areas alone.","hi":"20 जनवरी 2009। परियोजना हिम तेंदुआ ने उच्च पर्वतीय हिमालयी पारितंत्र के लिए परिदृश्य और समुदाय-भागीदारी दृष्टिकोण अपनाया की, केवल पृथक संरक्षित क्षेत्रों पर केंद्र नहीं किया।"}},{"q":{"en":"By which year had the Great Indian Bustard already been included in the central Species Recovery Programme and a conservation Task Force constituted?","hi":"किस वर्ष तक महान भारतीय सोनचिरैया को केंद्रीय प्रजाति पुनर्प्राप्ति कार्यक्रम में शामिल किया जा चुका था और संरक्षण कार्य प्रभाव गठित हो चुका था?"},"a":{"en":"By 2011.","hi":"2011 तक।"},"o":[{"en":"By 2011.","hi":"2011 तक।"},{"en":"Only after 2020.","hi":"केवल 2020 के बाद।"},{"en":"In 1973 under Project Tiger.","hi":"1973 में प्रोजेक्ट टाइगर के अंतर्गत।"},{"en":"In 1992 under Project Elephant.","hi":"1992 में परियोजना हाथी के अंतर्गत।"}],"exp":{"en":"By 2011. Great Indian Bustard conservation predates the recent captive-breeding project: by 2011 the species was already under the central Species Recovery Programme and a Task Force had been constituted.","hi":"2011 तक। महान भारतीय सोनचिरैया संरक्षण हालिया बंदी-प्रजनन परियोजना से पहले की है: 2011 तक प्रजाति केंद्रीय प्रजाति पुनर्प्राप्ति कार्यक्रम में थी और कार्य प्रभाव गठित हो चुका था।"}},{"q":{"en":"What is the gap between the start years of the Hangul Project and Project Tiger?","hi":"हंगुल प्रोजेक्ट और प्रोजेक्ट टाइगर के शुरू होने के वर्षों में कितना अंतर है?"},"a":{"en":"3 years — Project Hangul (1970) preceded Project Tiger (1973).","hi":"3 वर्ष - प्रोजेक्ट हंगुल (1970), प्रोजेक्ट टाइगर (1973) से पहले शुरू हुआ।"},"o":[{"en":"3 years — Project Hangul (1970) preceded Project Tiger (1973).","hi":"3 वर्ष - प्रोजेक्ट हंगुल (1970), प्रोजेक्ट टाइगर (1973) से पहले शुरू हुआ।"},{"en":"A gap of 5 years — Project Tiger (1970) came before Hangul (1975).","hi":"5 साल का अंतर - प्रोजेक्ट टाइगर (1970) हंगुल (1975) से पहले आया।"},{"en":"There is no gap; they both started in 1973.","hi":"कोई अंतर नहीं है; वे दोनों 1973 में शुरू हुए।"},{"en":"A gap of 10 years — Hangul Project (1963) came before Project Tiger (1973).","hi":"10 साल का अंतर - हंगुल प्रोजेक्ट (1963) प्रोजेक्ट टाइगर (1973) से पहले आया।"}],"exp":{"en":"3 years — Project Hangul (1970) preceded Project Tiger (1973). This comparison uses the established 1970 and 1973 start years for the two conservation initiatives.","hi":"3 वर्ष - प्रोजेक्ट हंगुल (1970), प्रोजेक्ट टाइगर (1973) से पहले शुरू हुआ। यह तुलना दो संरक्षण पहलों के स्थापित 1970 और 1973 आरंभ-वर्षों का उपयोग करती है।"}}]},{"title":{"en":"7. Common Confusions & Reverse Questions","hi":"7। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"Which was India's first Biosphere Reserve, and which is the largest?","hi":"भारत का पहला बायोस्फीयर रिजर्व कौन-सा था और सबसे बड़ा कौन-सा है?"},"a":{"en":"Nilgiri was India's first nationally designated Biosphere Reserve (1986); Kachchh/Great Rann of Kutch is the largest by area.","hi":"नीलगिरि भारत का पहला राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र (1986) था; कच्छ/कच्छ का महान रण क्षेत्रफल के आधार पर सबसे बड़ा है।"},"o":[{"en":"Nilgiri was India's first nationally designated Biosphere Reserve (1986); Kachchh/Great Rann of Kutch is the largest by area.","hi":"नीलगिरि भारत का पहला राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र (1986) था; कच्छ/कच्छ का महान रण क्षेत्रफल के आधार पर सबसे बड़ा है।"},{"en":"Great Rann of Kutch was the FIRST, whereas Nilgiri is the LARGEST.","hi":"कच्छ का महान रण पहला था, जबकि नीलगिरि सबसे बड़ा है।"},{"en":"Nilgiri is the SMALLEST, and Great Rann of Kutch is the FIRST.","hi":"नीलगिरि सबसे छोटा है, और कच्छ का महान रण सबसे पहला है।"},{"en":"Both mean the exact same thing.","hi":"दोनों का मतलब बिल्कुल एक ही है।"}],"exp":{"en":"Nilgiri was India's first nationally designated Biosphere Reserve (1986); Kachchh/Great Rann of Kutch is the largest by area. 'First' refers to year of national designation, while 'largest' refers to notified area; these are different attributes.","hi":"नीलगिरि भारत का पहला राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र (1986) था; कच्छ/कच्छ का महान रण क्षेत्रफल के आधार पर सबसे बड़ा है। 'पहला' राष्ट्रीय नामांकन वर्ष को संदर्भित करता है, जबकि 'सबसे बड़ा' अधिसूचित क्षेत्रफल को; ये अलग विशेषताएँ हैं।"}},{"q":{"en":"Which came first: Hangul Project or Project Tiger?","hi":"हंगुल प्रोजेक्ट और प्रोजेक्ट टाइगर में कौन पहले शुरू हुआ?"},"a":{"en":"Project Hangul (1970) came 3 years before Project Tiger (1973).","hi":"प्रोजेक्ट हंगुल (1970), प्रोजेक्ट टाइगर (1973) से 3 वर्ष पहले शुरू हुआ।"},"o":[{"en":"Project Hangul (1970) came 3 years before Project Tiger (1973).","hi":"प्रोजेक्ट हंगुल (1970), प्रोजेक्ट टाइगर (1973) से 3 वर्ष पहले शुरू हुआ।"},{"en":"Project Tiger (1973) came before Project Hangul (1975).","hi":"प्रोजेक्ट टाइगर (1973), प्रोजेक्ट हंगुल (1975) से पहले शुरू हुआ।"},{"en":"Both projects began in 1973.","hi":"दोनों परियोजनाएँ 1973 में शुरू हुए।"},{"en":"Project Hangul began in 1965, eight years before Project Tiger.","hi":"प्रोजेक्ट हंगुल 1965 में शुरू हुआ, प्रोजेक्ट टाइगर से आठ वर्ष पहले।"}],"exp":{"en":"Project Hangul (1970) came 3 years before Project Tiger (1973). The chronology is Hangul 1970 followed by Project Tiger 1973.","hi":"प्रोजेक्ट हंगुल (1970), प्रोजेक्ट टाइगर (1973) से 3 वर्ष पहले शुरू हुआ। कालक्रम हंगुल 1970 के बाद प्रोजेक्ट टाइगर 1973 है।"}},{"q":{"en":"According to the current NTCA notified-area table, which Tiger Reserves have the largest and smallest total areas?","hi":"वर्तमान NTCA अधिसूचित-क्षेत्रफल तालिका के अनुसार सबसे बड़ा और सबसे छोटा कुल क्षेत्रफल वाले बाघ आरक्षित क्षेत्र कौन-से हैं?"},"a":{"en":"Nagarjunsagar-Srisailam Tiger Reserve, Andhra Pradesh — 3,296.31 km²; Orang Tiger Reserve, Assam — 492.46 km².","hi":"नागार्जुनसागर-श्रीशैलम बाघ आरक्षित क्षेत्र, आंध्र प्रदेश - 3,296.31 किमी²; ओरांग बाघ आरक्षित क्षेत्र, असम - 492.46 किमी²।"},"o":[{"en":"Nagarjunsagar-Srisailam Tiger Reserve, Andhra Pradesh — 3,296.31 km²; Orang Tiger Reserve, Assam — 492.46 km².","hi":"नागार्जुनसागर-श्रीशैलम बाघ आरक्षित क्षेत्र, आंध्र प्रदेश - 3,296.31 किमी²; ओरांग बाघ आरक्षित क्षेत्र, असम - 492.46 किमी²।"},{"en":"Amrabad, Telangana is largest; Bor, Maharashtra is smallest.","hi":"अमराबाद, तेलंगाना सबसे बड़ा है; बोर, महाराष्ट्र सबसे छोटा है।"},{"en":"Manas, Assam is largest; Ranipur, Uttar Pradesh is smallest.","hi":"मानस, असम सबसे बड़ा है; रानीपुर, उत्तर प्रदेश सबसे छोटा है।"},{"en":"Corbett, Uttarakhand is largest; Buxa, West Bengal is smallest.","hi":"कॉर्बेट, उत्तराखंड सबसे बड़ा है; बक्सा, पश्चिम बंगाल सबसे छोटा है।"}],"exp":{"en":"Nagarjunsagar-Srisailam Tiger Reserve, Andhra Pradesh — 3,296.31 km²; Orang Tiger Reserve, Assam — 492.46 km². The current NTCA table lists Nagarjunsagar-Srisailam at 3,296.31 km² and Orang at 492.46 km². Rankings should therefore use the same 'total notified area' metric.","hi":"नागार्जुनसागर-श्रीशैलम बाघ आरक्षित क्षेत्र, आंध्र प्रदेश - 3,296.31 किमी²; ओरांग बाघ आरक्षित क्षेत्र, असम - 492.46 किमी²। वर्तमान NTCA तालिका नागार्जुनसागर-श्रीशैलम को 3,296.31 किमी² और ओरांग को 492.46 किमी² सूची करती है। क्रम में समान 'कुल अधिसूचित क्षेत्रफल' मानदंड का उपयोग करना चाहिए।"}},{"q":{"en":"What was India's first National Park originally called, and how did its name change?","hi":"भारत के पहला राष्ट्रीय उद्यान का मूल नाम क्या था और उसका नाम कैसे परिवर्तन हुआ?"},"a":{"en":"Hailey National Park (1936) → Ramganga National Park (1954–55) → Corbett National Park (1955–56/1956).","hi":"हेली राष्ट्रीय उद्यान (1936) → रामगंगा राष्ट्रीय उद्यान (1954-55) → कॉर्बेट राष्ट्रीय उद्यान (1955-56/1956)।"},"o":[{"en":"Hailey National Park (1936) → Ramganga National Park (1954–55) → Corbett National Park (1955–56/1956).","hi":"हेली राष्ट्रीय उद्यान (1936) → रामगंगा राष्ट्रीय उद्यान (1954-55) → कॉर्बेट राष्ट्रीय उद्यान (1955-56/1956)।"},{"en":"Hailey National Park → Corbett → Ramganga in 2021.","hi":"हेली राष्ट्रीय उद्यान → कॉर्बेट → 2021 में रामगंगा।"},{"en":"Ramganga National Park was created first in 1973.","hi":"रामगंगा राष्ट्रीय उद्यान पहला 1973 में बनाया गया।"},{"en":"Kanha was renamed Corbett in 1956.","hi":"कान्हा को 1956 में कॉर्बेट नाम परिवर्तन किया गया।"}],"exp":{"en":"Hailey National Park (1936) → Ramganga National Park (1954–55) → Corbett National Park (1955–56/1956). The Ramganga name belongs to the mid-1950s, not 2021; the present name is Corbett National Park.","hi":"हेली राष्ट्रीय उद्यान (1936) → रामगंगा राष्ट्रीय उद्यान (1954-55) → कॉर्बेट राष्ट्रीय उद्यान (1955-56/1956)। रामगंगा नाम 1950 के दशक के मध्य का है, 2021 का नहीं; वर्तमान नाम कॉर्बेट राष्ट्रीय उद्यान है।"}},{"q":{"en":"Which is the oldest Tiger Reserve in Maharashtra under Project Tiger?","hi":"प्रोजेक्ट टाइगर के अंतर्गत महाराष्ट्र का सबसे पुराना बाघ आरक्षित क्षेत्र कौन-सा है?"},"a":{"en":"Melghat Tiger Reserve — one of the original nine reserves included in 1973–74.","hi":"मेलघाट बाघ आरक्षित क्षेत्र - 1973-74 में शामिल मूल नौ आरक्षित क्षेत्र में से एक।"},"o":[{"en":"Melghat Tiger Reserve — one of the original nine reserves included in 1973–74.","hi":"मेलघाट बाघ आरक्षित क्षेत्र - 1973-74 में शामिल मूल नौ आरक्षित क्षेत्र में से एक।"},{"en":"Tadoba-Andhari — included before Melghat.","hi":"ताडोबा-अंधारी - मेलघाट से पहले शामिल हुआ।"},{"en":"Bor — notified in 2014 and therefore the oldest.","hi":"बोर - 2014 में अधिसूचित हुआ, इसलिए सबसे पुराना।"},{"en":"Pench Maharashtra — included in 1973 before Melghat.","hi":"पेंच महाराष्ट्र - 197 is broader than global warming: it includes persistent changes in temperature, precipitation, extremes, sea level and other climate-system features. Human influence is the dominant cause of recent global warming.","hi":"जलवायु परिवर्तन, वैश्विक उष्मीकरण से व्यापक है: इसमें तापमान, वर्षण, चरम घटनाएँ, समुद्र स्तर और अन्य जलवायु-प्रणाली की विशेषताओं के स्थायी परिवर्तन शामिल हैं। हालिया वैश्विक उष्मीकरण का प्रमुख कारण मानवीय प्रभाव है।"}},{"q":{"en":"When was the Montreal Protocol signed?","hi":"मॉन्ट्रियल प्रोटोकॉल (मॉन्ट्रियल प्रोटोकॉल) पर हस्ताक्षर कब हुए थे?"},"a":{"en":"16 September 1987.","hi":"16 सितंबर 1987।"},"o":[{"en":"16 September 1987.","hi":"16 सितंबर 1987।"},{"en":"22 March 1985.","hi":"22 मार्च 1985।"},{"en":"5 June 1992.","hi":"5 जून 1992।"},{"en":"1 January 1989.","hi":"1 जनवरी 1989।"}],"exp":{"en":"The Montreal Protocol followed the 1985 Vienna Convention. It was adopted on 16 September 1987 and entered into force on 1 January 1989.","hi":"मॉन्ट्रियल प्रोटोकॉल, 1985 वियना अभिसमय के बाद आया। यह 16 सितंबर 1987 को अपनाया गया और 1 जनवरी 1989 को प्रभावी हुआ।"}},{"q":{"en":"When was the UNFCCC adopted and opened for signature at the Rio Earth Summit?","hi":"UNFCCC कब अपनाया गया और रियो पृथ्वी शिखर सम्मेलन में हस्ताक्षर के लिए कब खुला हुआ?"},"a":{"en":"Adopted on 9 May 1992; opened for signature at Rio in June 1992.","hi":"9 मई 1992 को अपनाया गया; जून 1992 में रियो में हस्ताक्षर के लिए खुला हुआ।"},"o":[{"en":"Adopted on 9 May 1992; opened for signature at Rio in June 1992.","hi":"9 मई 1992 को अपनाया गया; जून 1992 में रियो में हस्ताक्षर के लिए खुला हुआ।"},{"en":"Adopted and entered into force in 1972.","hi":"1972 में अपनाया गया और प्रभावी हुआ।"},{"en":"Adopted at Kyoto in 1997.","hi":"1997 में क्योटो में अपनाया गया।"},{"en":"Adopted at Paris in 2015.","hi":"2015 में पेरिस में अपनाया गया।"}],"exp":{"en":"The UNFCCC was adopted in New York on 9 May 1992 and then opened for signature at the Rio Earth Summit in June 1992; it entered into force in 1994.","hi":"UNFCCC 9 मई 1992 को न्यूयॉर्क में अपनाया गया, फिर जून 1992 रियो पृथ्वी शिखर सम्मेलन में हस्ताक्षर के लिए खुला हुआ; 1994 में प्रभावी हुआ।"}},{"q":{"en":"How many National Missions are covered in this chapter?","hi":"इस अध्याय में कितने राष्ट्रीय मिशन (राष्ट्रीय मिशन) शामिल हैं?"},"a":{"en":"8 original missions; the current MoEFCC NAPCC dashboard shows 9 missions after inclusion of the National Mission on Climate Change and Health.","hi":"8 मूल मिशन; जलवायु परिवर्तन एवं स्वास्थ्य पर राष्ट्रीय मिशन के समावेशन के बाद वर्तमान MoEFCC NAPCC डैशबोर्ड 9 मिशन दिखाता है।"},"o":[{"en":"8 original missions; the current MoEFCC NAPCC dashboard shows 9 missions after inclusion of the National Mission on Climate Change and Health.","hi":"8 मूल मिशन; जलवायु परिवर्तन एवं स्वास्थ्य पर राष्ट्रीय मिशन के समावेशन के बाद वर्तमान MoEFCC NAPCC डैशबोर्ड 9 मिशन दिखाता है।"},{"en":"7 original missions.","hi":"7 मूल मिशन।"},{"en":"5 original missions.","hi":"5 मूल मिशन।"},{"en":"12 original missions.","hi":"12 मूल मिशन।"}],"exp":{"en":"The original 2008 NAPCC contained eight core missions. The current MoEFCC dashboard lists a ninth mission, the National Mission on Climate Change and Health, so historical and current counts should be distinguished.","hi":"मूल 2008 NAPCC में आठ मूल मिशन थे। वर्तमान MoEFCC डैशबोर्ड जलवायु परिवर्तन एवं स्वास्थ्य पर राष्ट्रीय मिशन जोड़कर नौ मिशन दिखाता है, इसलिए ऐतिहासिक और वर्तमान संख्या अलग रखना चाहिए।"}},{"q":{"en":"Which is the latest CoP conference mentioned?","hi":"उल्लिखित नवीनतम COP सम्मेलन कौन सा है?"},"a":{"en":"COP30 — Belém, Brazil, 2025.","hi":"COP30 - Belém, ब्राज़ील, 2025।"},"o":[{"en":"COP30 — Belém, Brazil, 2025.","hi":"COP30 - Belém, ब्राज़ील, 2025।"},{"en":"COP29 — Baku, Azerbaijan, 2024.","hi":"COP29 - बाकू, अज़रबैजान, 2024।"},{"en":"COP28 — Dubai, UAE, 2023.","hi":"COP28 - दुबई, UAE, 2023।"},{"en":"COP31 — 2026, already completed.","hi":"COP31 - 2026, पहले से संपन्न।"}],"exp":{"en":"COP30 was held in Belém, Brazil, in November 2025. As of September 2026 it is the latest completed COP; COP31 is later in 2026 and therefore not yet a completed conference.","hi":"COP30 नवंबर 2025 में Belém, ब्राज़ील में आयोजित हुई। सितंबर 2026 तक यही नवीनतम संपन्न COP है; COP31 बाद में 2026 है, इसलिए अभी संपन्न सम्मेलन नहीं है।"}},{"q":{"en":"What was formed as a result of the Stockholm Conference (1972)?","hi":"स्टॉकहोम सम्मेलन (1972) के परिणामस्वरूप क्या बना?"},"a":{"en":"The Stockholm Conference led to the creation of the United Nations Environment Programme (UNEP) later in 1972.","hi":"स्टॉकहोम सम्मेलन के बाद 1972 संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP) स्थापित हुआ।"},"o":[{"en":"The Stockholm Conference led to the creation of the United Nations Environment Programme (UNEP) later in 1972.","hi":"स्टॉकहोम सम्मेलन के बाद 1972 संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP) स्थापित हुआ।"},{"en":"Formation of UNFCCC.","hi":"यूएनएफसीसीसी (UNFCCC) का गठन।"},{"en":"Formation of IPCC.","hi":"आईपीसीसी (IPCC) का गठन।"},{"en":"Formation of WMO.","hi":"डब्ल्यूएमओ (WMO) का गठन।"}],"exp":{"en":"The 1972 Stockholm Conference catalysed modern international environmental governance, and the UN General Assembly established UNEP later that year.","hi":"1972 स्टॉकहोम सम्मेलन ने आधुनिक अंतरराष्ट्रीय पर्यावरणीय शासन को तेज़ किया और उसी वर्ष बाद में संयुक्त राष्ट्र महासभा ने UNEP स्थापित किया।"}},{"q":{"en":"What was the key achievement of the Kyoto Protocol (1997)?","hi":"क्योटो प्रोटोकॉल (1997) की प्रमुख उपलब्धि क्या थी?"},"a":{"en":"Legally binding greenhouse-gas emission targets for industrialized/Annex B Parties; first-period targets averaged about 5% below 1990 levels for 2008–2012.","hi":"औद्योगीकृत/अनुबंध-B पक्षकार के लिए कानूनी रूप से बाध्यकारी GHG उत्सर्जन लक्ष्य; पहला प्रतिबद्धता अवधि 2008-2012 में समग्र लक्ष्य लगभग 5% से नीचे 1990 स्तर था।"},"o":[{"en":"Legally binding greenhouse-gas emission targets for industrialized/Annex B Parties; first-period targets averaged about 5% below 1990 levels for 2008–2012.","hi":"औद्योगीकृत/अनुबंध-B पक्षकार
