","hi":"क्या ओजोन (O3) और अम्ल वर्षा प्राथमिक प्रदूषक हैं?"},"a":{"en":"No. Ground-level ozone and the sulfuric/nitric acids associated with acid rain are secondary pollutants formed in the atmosphere from precursor emissions.","hi":"नहीं। भूतलीय ओजोन और अम्ल वर्षा से संबद्ध सल्फ्यूरिक/नाइट्रिक अम्ल द्वितीयक प्रदूषक हैं, जो वायुमंडल में पूर्वगामी उत्सर्जन से रूप होते हैं।"},"o":[{"en":"No. Ground-level ozone and the sulfuric/nitric acids associated with acid rain are secondary pollutants formed in the atmosphere from precursor emissions.","hi":"नहीं। भूतलीय ओजोन और अम्ल वर्षा से संबद्ध सल्फ्यूरिक/नाइट्रिक अम्ल द्वितीयक प्रदूषक हैं, जो वायुमंडल में पूर्वगामी उत्सर्जन से रूप होते हैं।"},{"en":"Yes, they are emitted directly from factories.","hi":"हाँ, वे कारखानों से सीधे उत्सर्जित होते हैं।"},{"en":"Ozone is Primary, but Acid Rain is Secondary.","hi":"ओजोन प्राथमिक है, लेकिन अम्लीय वर्षा द्वितीयक है।"},{"en":"Acid Rain is Primary, but Ozone is Secondary.","hi":"अम्ल वर्षा प्राथमिक है, लेकिन ओजोन द्वितीयक है।"}],"exp":{"en":"No. Ground-level ozone and the sulfuric/nitric acids associated with acid rain are secondary pollutants formed in the atmosphere from precursor emissions. Ozone is produced photochemically from precursor gases, while sulfuric and nitric acids form from oxidation of sulfur and nitrogen oxides.","hi":"नहीं। भूतलीय ओजोन और अम्ल वर्षा से संबद्ध सल्फ्यूरिक/नाइट्रिक अम्ल द्वितीयक प्रदूषक हैं, जो वायुमंडल में पूर्वगामी उत्सर्जन से रूप होते हैं। ओजोन पूर्वगामी गैसें से प्रकाश-रासायनिक रूप से उत्पन्न होता है, जबकि सल्फ्यूरिक और नाइट्रिक अम्ल सल्फर/नाइट्रोजन ऑक्साइड के ऑक्सीकरण से रूप होते हैं।"}},{"q":{"en":"Is the permissible noise limit in a Silence Zone higher than in a Residential area?","hi":"क्या शांत क्षेत्र का अनुमेय ध्वनि सीमा आवासीय क्षेत्र से उच्चतर है?"},"a":{"en":"No. Under India's Noise Rules, a Silence Zone is 50/40 dB(A) Leq by day/night, lower than the Residential limit of 55/45 dB(A) Leq.","hi":"नहीं। भारत के ध्वनि नियम में शांत क्षेत्र 50/40 dB(A) Leq (दिन/रात) है, जो आवासीय सीमा 55/45 dB(A) Leq से कम है।"},"o":[{"en":"No. Under India's Noise Rules, a Silence Zone is 50/40 dB(A) Leq by day/night, lower than the Residential limit of 55/45 dB(A) Leq.","hi":"नहीं। भारत के ध्वनि नियम में शांत क्षेत्र 50/40 dB(A) Leq (दिन/रात) है, जो आवासीय सीमा 55/45 dB(A) Leq से कम है।"},{"en":"Yes, Silent zones allow 65 dB.","hi":"हां, साइलेंट जोन 65 डीबी की अनुमति देते हैं।"},{"en":"They are exactly the same.","hi":"वे बिल्कुल एक जैसे हैं।"},{"en":"Silent zones have a limit of 0 dB.","hi":"साइलेंट जोन की सीमा 0 डीबी है।"}],"exp":{"en":"No. Under India's Noise Rules, a Silence Zone is 50/40 dB(A) Leq by day/night, lower than the Residential limit of 55/45 dB(A) Leq. Silence-zone limits are the strictest of the four standard area categories under the Noise Rules.","hi":"नहीं। भारत के ध्वनि नियम में शांत क्षेत्र 50/40 dB(A) Leq (दिन/रात) है, जो आवासीय सीमा 55/45 dB(A) Leq से कम है। ध्वनि नियम के चार मानक क्षेत्रफल श्रेणियाँ में शांत-क्षेत्र सीमाएँ सबसे कड़ा हैं।"}},{"q":{"en":"Are Ganga Action Plan and Namami Gange Programme the same scheme?","hi":"क्या गंगा एक्शन प्लान और नमामि गंगे कार्यक्रम एक ही योजना हैं?"},"a":{"en":"No. Ganga Action Plan began in 1985; Namami Gange began in 2014 as a broader programme under NMCG, and Ganga-rejuvenation activities continued under NMCG in 2026.","hi":"नहीं। गंगा कार्रवाई योजना 1985 में शुरू हुआ; नमामि गंगे 2014 में NMCG के अंतर्गत व्यापक कार्यक्रम के रूप में शुरू हुआ, और 2026 में NMCG के अंतर्गत गंगा-पुनर्जीवन गतिविधियाँ जारी रहीं।"},"o":[{"en":"No. Ganga Action Plan began in 1985; Namami Gange began in 2014 as a broader programme under NMCG, and Ganga-rejuvenation activities continued under NMCG in 2026.","hi":"नहीं। गंगा कार्रवाई योजना 1985 में शुरू हुआ; नमामि गंगे 2014 में NMCG के अंतर्गत व्यापक कार्यक्रम के रूप में शुरू हुआ, और 2026 में NMCG के अंतर्गत गंगा-पुनर्जीवन गतिविधियाँ जारी रहीं।"},{"en":"Yes, they are just two names for the exact same current scheme.","hi":"हाँ, वे बिल्कुल एक ही मौजूदा योजना के दो नाम हैं।"},{"en":"Ganga Action Plan is the current scheme, Namami Gange was in the 1980s.","hi":"गंगा एक्शन प्लान वर्तमान योजना है, नमामि गंगे 1980 के दशक में थी।"},{"en":"One is for cleaning the river, the other is for building dams.","hi":"एक नदी की सफाई के लिए है, दूसरा बांध बनाने के लिए है।"}],"exp":{"en":"No. Ganga Action Plan began in 1985; Namami Gange began in 2014 as a broader programme under NMCG, and Ganga-rejuvenation activities continued under NMCG in 2026. Ganga Action Plan is historically important, but Namami Gange/NMCG represents the broader modern rejuvenation framework.","hi":"नहीं। गंगा कार्रवाई योजना 1985 में शुरू हुआ; नमामि गंगे 2014 में NMCG के अंतर्गत व्यापक कार्यक्रम के रूप में शुरू हुआ, और 2026 में NMCG के अंतर्गत गंगा-पुनर्जीवन गतिविधियाँ जारी रहीं। गंगा कार्रवाई योजना ऐतिहासिक रूप से महत्वपूर्ण है, लेकिन नमामि गंगे/NMCG व्यापक आधुनिक पुनर्जीवन ढाँचा प्रतिनिधित्व करता है।"}},{"q":{"en":"Which radionuclides are classically associated with bone accumulation and thyroid uptake?","hi":"कौन-से रेडियोन्यूक्लाइड परंपरागत रूप से अस्थि संचय और थायरॉइड अवशोषण से संबद्ध हैं?"},"a":{"en":"Strontium-90 accumulates in bone; Iodine-131 is taken up by the thyroid.","hi":"स्ट्रॉन्शियम-90 अस्थि में संचित होता है; आयोडीन-131 थायरॉइड द्वारा ग्रहण किया होता है।"},"o":[{"en":"Strontium-90 accumulates in bone; Iodine-131 is taken up by the thyroid.","hi":"स्ट्रॉन्शियम-90 अस्थि में संचित होता है; आयोडीन-131 थायरॉइड द्वारा ग्रहण किया होता है।"},{"en":"Iodine-131 accumulates mainly in bone; Strontium-90 targets thyroid.","hi":"आयोडीन-131 मुख्यतः अस्थि में संचित होता है; स्ट्रॉन्शियम-90 थायरॉइड लक्ष्य करता है।"},{"en":"Both affect only red blood cells.","hi":"दोनों केवल लाल रक्त कोशिकाएँ प्रभावित करते हैं।"},{"en":"Neither radionuclide can enter body tissues.","hi":"न तो रेडियोन्यूक्लाइड निकाय ऊतकों में प्रवेश कर सकता है।"}],"exp":{"en":"Strontium-90 accumulates in bone; Iodine-131 is taken up by the thyroid. Sr-90 and I-131 behave differently in the body because they mimic different stable elements: strontium follows calcium, iodine follows normal iodine metabolism.","hi":"स्ट्रॉन्शियम-90 अस्थि में संचित होता है; आयोडीन-131 थायरॉइड द्वारा ग्रहण किया होता है। Sr-90 और I-131 निकाय में अलग प्रकार से व्यवहार करते हैं क्योंकि वे अलग स्थिर तत्त्व अनुकरण करते हैं: स्ट्रॉन्शियम कैल्शियम को अनुसरण करता है, आयोडीन सामान्य आयोडीन उपापचय को।"}},{"q":{"en":"Which pollutants cause Minamata Disease and Itai-Itai Disease?","hi":"मिनामाता रोग और इटाई-इटाई रोग किन प्रदूषकों से होते हैं?"},"a":{"en":"Minamata disease is caused by methylmercury exposure; Itai-Itai disease by chronic cadmium exposure.","hi":"मिनामाता रोग मिथाइल मरकरी संपर्क से और इटाई-इटाई रोग दीर्घकालिक कैडमियम संपर्क से होती है।"},"o":[{"en":"Minamata disease is caused by methylmercury exposure; Itai-Itai disease by chronic cadmium exposure.","hi":"मिनामाता रोग मिथाइल मरकरी संपर्क से और इटाई-इटाई रोग दीर्घकालिक कैडमियम संपर्क से होती है।"},{"en":"Minamata = Cadmium; Itai-Itai = Mercury.","hi":"मिनामाता = कैडमियम; इटाई-इटाई = पारा।"},{"en":"Minamata = Arsenic; Itai-Itai = Nitrates.","hi":"मिनामाता = आर्सेनिक; इटाई-इटाई = नाइट्रेट्स।"},{"en":"Minamata = Nitrates; Itai-Itai = Arsenic.","hi":"मिनामाता = नाइट्रेट्स; इटाई-इटाई = आर्सेनिक।"}],"exp":{"en":"Minamata disease is caused by methylmercury exposure; Itai-Itai disease by chronic cadmium exposure. Both are classic metal-poisoning episodes, but they involve different contaminants and organ-system effects.","hi":"मिनामाता रोग मिथाइल मरकरी संपर्क से और इटाई-इटाई रोग दीर्घकालिक कैडमियम संपर्क से होती है। दोनों प्रमुख धातु-विषाक्तता घटनाएँ हैं, लेकिन अलग संदूषक और अंग-प्रणाली प्रभाव शामिल करते हैं।"}}]},{"title":{"en":"9. Final Revision","hi":"9। अंतिम पुनरावृत्ति"},"questions":[{"q":{"en":"How many types of pollution are covered?","hi":"प्रदूषण के प्रकार कवर किये गये?"},"a":{"en":"6 chapter categories — Air, Water, Soil, Noise, Radioactive and Solid Waste.","hi":"6 अध्याय श्रेणियाँ - वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस अपशिष्ट।"},"o":[{"en":"6 chapter categories — Air, Water, Soil, Noise, Radioactive and Solid Waste.","hi":"6 अध्याय श्रेणियाँ - वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस अपशिष्ट।"},{"en":"4 — Air, Water, Soil, Noise.","hi":"4 - वायु, जल, मिट्टी, शोर।"},{"en":"3 — Land, Sea, Air.","hi":"3 - भूमि, समुद्र, वायु।"},{"en":"8 — including Space and Light.","hi":"8 - अंतरिक्ष और प्रकाश सहित।"}],"exp":{"en":"6 chapter categories — Air, Water, Soil, Noise, Radioactive and Solid Waste. This is the chapter's six-category structure.","hi":"6 अध्याय श्रेणियाँ - वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस अपशिष्ट। यह अध्याय की छह श्रेणियों वाली संरचना है।"}},{"q":{"en":"In which year was the Air (Prevention and Control of Pollution) Act enacted?","hi":"वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम किस वर्ष अधिनियमित हुआ?"},"a":{"en":"1981.","hi":"1981।"},"o":[{"en":"1981.","hi":"1981।"},{"en":"1972.","hi":"1972।"},{"en":"1986.","hi":"1986।"},{"en":"1992.","hi":"1992।"}],"exp":{"en":"1981. The formal title is Air (Prevention and Control of Pollution) Act, 1981.","hi":"1981। औपचारिक शीर्षक वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1981 है।"}},{"q":{"en":"Which common water-borne viral infections can cause jaundice?","hi":"कौन-सी सामान्य जल-जनित विषाणुजनित संक्रमण पीलिया उत्पन्न कर सकते हैं?"},"a":{"en":"Hepatitis A and Hepatitis E.","hi":"हेपेटाइटिस A और हेपेटाइटिस E।"},"o":[{"en":"Hepatitis A and Hepatitis E.","hi":"हेपेटाइटिस A और हेपेटाइटिस E।"},{"en":"Cholera and typhoid.","hi":"हैजा और टाइफाइड।"},{"en":"Minamata and Itai-Itai disease.","hi":"मिनामाता और इटाई-इटाई रोग।"},{"en":"Nitrate poisoning only.","hi":"केवल नाइट्रेट विषाक्तता।"}],"exp":{"en":"Hepatitis A and Hepatitis E. Jaundice is a symptom; hepatitis A and E are important water-borne viral causes.","hi":"हेपेटाइटिस A और हेपेटाइटिस E। पीलिया लक्षण है; हेपेटाइटिस A और E महत्वपूर्ण जल-जनित विषाणुजनित कारण हैं।"}},{"q":{"en":"What causes Minamata Disease?","hi":"मिनामाता रोग कारण?"},"a":{"en":"Methylmercury.","hi":"मिथाइल मरकरी।"},"o":[{"en":"Methylmercury.","hi":"मिथाइल मरकरी।"},{"en":"Cadmium.","hi":"कैडमियम।"},{"en":"Arsenic.","hi":"आर्सेनिक।"},{"en":"Nitrates.","hi":"नाइट्रेट्स।"}],"exp":{"en":"Methylmercury. Methylmercury is the toxic form central to Minamata disease.","hi":"मिथाइल मरकरी। मिथाइल मरकरी मिनामाता रोग का केंद्रीय विषाक्त रूप है।"}},{"q":{"en":"What causes Blue-baby Syndrome?","hi":"ब्लू-बेबी सिंड्रोम कारण?"},"a":{"en":"High nitrate exposure leading to nitrite-related methaemoglobinaemia in infants.","hi":"उच्च नाइट्रेट संपर्क, जिससे शिशुओं में नाइट्राइट-संबंधित मीथेमोग्लोबिनेमिया हो सकता है।"},"o":[{"en":"High nitrate exposure leading to nitrite-related methaemoglobinaemia in infants.","hi":"उच्च नाइट्रेट संपर्क, जिससे शिशुओं में नाइट्राइट-संबंधित मीथेमोग्लोबिनेमिया हो सकता है।"},{"en":"Mercury exposure.","hi":"पारा संपर्क।"},{"en":"Arsenic exposure.","hi":"आर्सेनिक संपर्क।"},{"en":"Viral hepatitis.","hi":"विषाणुजनित हेपेटाइटिस।"}],"exp":{"en":"High nitrate exposure leading to nitrite-related methaemoglobinaemia in infants. Nitrate-to-nitrite conversion can cause infant methaemoglobinaemia, reducing oxygen delivery.","hi":"उच्च नाइट्रेट संपर्क, जिससे शिशुओं में नाइट्राइट-संबंधित मीथेमोग्लोबिनेमिया हो सकता है। नाइट्रेट-को-नाइट्राइट परिवर्तन शिशु मीथेमोग्लोबिनेमिया उत्पन्न कर सकता है, जिससे ऑक्सीजन आपूर्ति कम होती है।"}},{"q":{"en":"What causes Itai-Itai Disease?","hi":"इटाई-इटाई रोग कारण?"},"a":{"en":"Cadmium.","hi":"कैडमियम।"},"o":[{"en":"Cadmium.","hi":"कैडमियम।"},{"en":"Mercury.","hi":"पारा।"},{"en":"Strontium.","hi":"स्ट्रोंटियम।"},{"en":"Nitrates.","hi":"नाइट्रेट्स।"}],"exp":{"en":"Cadmium. Chronic cadmium exposure is the classic cause of Itai-Itai disease.","hi":"कैडमियम। दीर्घकालिक कैडमियम संपर्क इटाई-इटाई रोग का प्रमुख कारण है।"}},{"q":{"en":"What causes Black Foot Disease?","hi":"ब्लैक फुट रोग कारण?"},"a":{"en":"Chronic arsenic exposure.","hi":"दीर्घकालिक आर्सेनिक संपर्क।"},"o":[{"en":"Chronic arsenic exposure.","hi":"दीर्घकालिक आर्सेनिक संपर्क।"},{"en":"Cadmium.","hi":"कैडमियम।"},{"en":"Bacteria.","hi":"बैक्टीरिया।"},{"en":"Iodine-131.","hi":"आयोडीन-131।"}],"exp":{"en":"Chronic arsenic exposure. Long-term arsenic exposure in drinking water is the classic association.","hi":"दीर्घकालिक आर्सेनिक संपर्क। पेय जल में दीर्घकालिक आर्सेनिक संपर्क प्रमुख संबंध है।"}},{"q":{"en":"What is the full form of BOD?","hi":"BOD का पूर्ण रूप?"},"a":{"en":"Biochemical Oxygen Demand.","hi":"जैव-रासायनिक ऑक्सीजन माँग।"},"o":[{"en":"Biochemical Oxygen Demand.","hi":"जैव-रासायनिक ऑक्सीजन माँग।"},{"en":"Biological Ozone Depletion.","hi":"जैविक ओजोन रिक्तीकरण।"},{"en":"Basic Oxygen Density.","hi":"बेसिक ऑक्सीजन डेंसिटी।"},{"en":"Bacterial Overload Disease.","hi":"बैक्टीरियल ओवरलोड रोग।"}],"exp":{"en":"Biochemical Oxygen Demand. BOD measures oxygen consumed by microbial decomposition under specified conditions.","hi":"जैव-रासायनिक ऑक्सीजन माँग। BOD निर्दिष्ट स्थितियों में सूक्ष्मजीवी अपघटन द्वारा उपभोग की गई ऑक्सीजन की मात्रा मापता है।"}},{"q":{"en":"Is 65 dB a universal noise-pollution threshold in India?","hi":"क्या भारत में 65 dB सार्वभौमिक ध्वनि-प्रदूषण सीमा है?"},"a":{"en":"No. Legal ambient limits depend on area and day/night period; 65 dB is the daytime limit for a Commercial area.","hi":"नहीं। कानूनी परिवेशीय सीमाएँ क्षेत्रफल और दिन/रात अवधि पर निर्भर करते हैं; 65 dB वाणिज्यिक क्षेत्र का दिन के समय सीमा है।"},"o":[{"en":"No. Legal ambient limits depend on area and day/night period; 65 dB is the daytime limit for a Commercial area.","hi":"नहीं। कानूनी परिवेशीय सीमाएँ क्षेत्रफल और दिन/रात अवधि पर निर्भर करते हैं; 65 dB वाणिज्यिक क्षेत्र का दिन के समय सीमा है।"},{"en":"Yes. 65 dB is the universal limit for every area and time.","hi":"हाँ। 65 dB प्रत्येक क्षेत्र और समय का सार्वभौमिक सीमा है।"},{"en":"Yes. 85 dB is the universal limit.","hi":"हाँ। 85 dB सार्वभौमिक सीमा है।"},{"en":"No noise standards exist in India.","hi":"भारत में ध्वनि मानक नहीं हैं।"}],"exp":{"en":"No. Legal ambient limits depend on area and day/night period; 65 dB is the daytime limit for a Commercial area. The 65 dB figure belongs to the Commercial-area daytime standard, not a universal threshold.","hi":"नहीं। कानूनी परिवेशीय सीमाएँ क्षेत्रफल और दिन/रात अवधि पर निर्भर करते हैं; 65 dB वाणिज्यिक क्षेत्र का दिन के समय सीमा है। 65 dB वाणिज्यिक-क्षेत्रफल दिन के समय मानक है, सार्वभौमिक सीमा नहीं।"}},{"q":{"en":"What is the permissible industrial-area noise limit (Day/Night)?","hi":"औद्योगिक क्षेत्र की शोर सीमा?"},"a":{"en":"75/70 dB(A) Leq (Day/Night).","hi":"75/70 dB(A) Leq (दिन/रात)।"},"o":[{"en":"75/70 dB(A) Leq (Day/Night).","hi":"75/70 dB(A) Leq (दिन/रात)।"},{"en":"65/55 dB(A) Leq (Day/Night).","hi":"65/55 dB(A) Leq (दिन/रात)।"},{"en":"55/45 dB(A) Leq (Day/Night).","hi":"55/45 dB(A) Leq (दिन/रात)।"},{"en":"50/40 dB(A) Leq (Day/Night).","hi":"50/40 dB(A) Leq (दिन/रात)।"}],"exp":{"en":"75/70 dB(A) Leq (Day/Night). These values are statutory ambient limits under India's Noise Rules, 2000.","hi":"75/70 dB(A) Leq (दिन/रात)। ये स्तरों भारत के ध्वनि नियम, 2000 के वैधानिक परिवेशीय सीमाएँ हैं।"}},{"q":{"en":"What is the permissible residential-area noise limit (Day/Night)?","hi":"आवासीय क्षेत्र शोर सीमा?"},"a":{"en":"55/45 dB(A) Leq (Day/Night).","hi":"55/45 dB(A) Leq (दिन/रात)।"},"o":[{"en":"55/45 dB(A) Leq (Day/Night).","hi":"55/45 dB(A) Leq (दिन/रात)।"},{"en":"65/55 dB(A) Leq (Day/Night).","hi":"65/55 dB(A) Leq (दिन/रात)।"},{"en":"75/70 dB(A) Leq (Day/Night).","hi":"75/70 dB(A) Leq (दिन/रात)।"},{"en":"50/40 dB(A) Leq (Day/Night).","hi":"50/40 dB(A) Leq (दिन/रात)।"}],"exp":{"en":"55/45 dB(A) Leq (Day/Night). These values are statutory ambient limits under India's Noise Rules, 2000.","hi":"55/45 dB(A) Leq (दिन/रात)। ये स्तरों भारत के ध्वनि नियम, 2000 के वैधानिक परिवेशीय सीमाएँ हैं।"}},{"q":{"en":"What is the permissible Silence-Zone noise limit (Day/Night)?","hi":"शांत क्षेत्र का अनुमेय ध्वनि सीमा (दिन/रात) क्या है?"},"a":{"en":"50/40 dB(A) Leq (Day/Night).","hi":"50/40 dB(A) Leq (दिन/रात)।"},"o":[{"en":"50/40 dB(A) Leq (Day/Night).","hi":"50/40 dB(A) Leq (दिन/रात)।"},{"en":"55/45 dB(A) Leq (Day/Night).","hi":"55/45 dB(A) Leq (दिन/रात)।"},{"en":"65/55 dB(A) Leq (Day/Night).","hi":"65/55 dB(A) Leq (दिन/रात)।"},{"en":"0/0 dB(A) Leq (Day/Night).","hi":"0/0 dB(A) Leq (दिन/रात)।"}],"exp":{"en":"50/40 dB(A) Leq (Day/Night). These values are statutory ambient limits under India's Noise Rules, 2000.","hi":"50/40 dB(A) Leq (दिन/रात)। ये स्तरों भारत के ध्वनि नियम, 2000 के वैधानिक परिवेशीय सीमाएँ हैं।"}},{"q":{"en":"Which radionuclide behaves like calcium and accumulates in bone?","hi":"कौन-सा रेडियोन्यूक्लाइड कैल्शियम की तरह व्यवहार करके अस्थि में संचित होता है?"},"a":{"en":"Strontium-90.","hi":"स्ट्रॉन्शियम-90।"},"o":[{"en":"Strontium-90.","hi":"स्ट्रॉन्शियम-90।"},{"en":"Iodine-131.","hi":"आयोडीन-131।"},{"en":"Uranium-235.","hi":"यूरेनियम-235।"},{"en":"Carbon-14.","hi":"कार्बन-14।"}],"exp":{"en":"Strontium-90. Sr-90 follows calcium metabolism and becomes incorporated in bone.","hi":"स्ट्रॉन्शियम-90। Sr-90 कैल्शियम उपापचय अनुसरण करके अस्थि में समाहित होता है।"}},{"q":{"en":"Which radionuclide is preferentially taken up by the thyroid gland?","hi":"कौन-सा रेडियोन्यूक्लाइड थायरॉइड ग्रंथि द्वारा प्राथमिकता से ग्रहण किया होता है?"},"a":{"en":"Iodine-131.","hi":"आयोडीन-131।"},"o":[{"en":"Iodine-131.","hi":"आयोडीन-131।"},{"en":"Strontium-90.","hi":"स्ट्रॉन्शियम-90।"},{"en":"Carbon-14.","hi":"कार्बन-14।"},{"en":"Lead-206.","hi":"लेड-206।"}],"exp":{"en":"Iodine-131. I-131 follows iodine metabolism and is concentrated by the thyroid.","hi":"आयोडीन-131। I-131 आयोडीन उपापचय अनुसरण करता है और थायरॉइड द्वारा संकेंद्रित होता है।"}},{"q":{"en":"What are standard examples of primary air pollutants?","hi":"प्राथमिक वायु प्रदूषक के मानक उदाहरण क्या हैं?"},"a":{"en":"CO, SO2, NO/NOx, NH3, VOCs and primary particulate matter.","hi":"CO, SO2, NO/NOx, NH3, VOCs और प्राथमिक कणिकीय पदार्थ।"},"o":[{"en":"CO, SO2, NO/NOx, NH3, VOCs and primary particulate matter.","hi":"CO, SO2, NO/NOx, NH3, VOCs और प्राथमिक कणिकीय पदार्थ।"},{"en":"O3, PAN, HNO3 and H2SO4.","hi":"O3, PAN, HNO3 और H2SO4।"},{"en":"Only DDT and plastic litter.","hi":"केवल DDT और प्लास्टिक कचरा।"},{"en":"Only acid-rain components.","hi":"केवल अम्ल-वर्षा घटक।"}],"exp":{"en":"CO, SO2, NO/NOx, NH3, VOCs and primary particulate matter. Primary pollutants are defined by direct emission, not by toxicity or physical state.","hi":"CO, SO2, NO/NOx, NH3, VOCs और प्राथमिक कणिकीय पदार्थ। प्राथमिक प्रदूषक प्रत्यक्ष उत्सर्जन से परिभाषित होते हैं, विषाक्तता या भौतिक राज्य से नहीं।"}},{"q":{"en":"What are standard examples of secondary air pollutants?","hi":"द्वितीयक वायु प्रदूषक के मानक उदाहरण क्या हैं?"},"a":{"en":"O3, PAN, HNO3, H2SO4 and secondary sulfate/nitrate particles.","hi":"O3, PAN, HNO3, H2SO4 और द्वितीयक सल्फेट/नाइट्रेट कण।"},"o":[{"en":"O3, PAN, HNO3, H2SO4 and secondary sulfate/nitrate particles.","hi":"O3, PAN, HNO3, H2SO4 और द्वितीयक सल्फेट/नाइट्रेट कण।"},{"en":"CO, SO2 and NH3 emitted directly.","hi":"प्रत्यक्ष उत्सर्जित CO, SO2 और NH3।"},{"en":"Only plastic litter and DDT.","hi":"केवल प्लास्टिक कचरा और DDT।"},{"en":"Only road dust.","hi":"केवल सड़क धूल।"}],"exp":{"en":"O3, PAN, HNO3, H2SO4 and secondary sulfate/nitrate particles. Secondary pollutants form after atmospheric chemical reactions.","hi":"O3, PAN, HNO3, H2SO4 और द्वितीयक सल्फेट/नाइट्रेट कण। द्वितीयक प्रदूषक वायुमंडलीय रासायनिक अभिक्रियाओं के बाद रूप होते हैं।"}},{"q":{"en":"Which programme/framework succeeded the older Ganga Action Plan for broader Ganga rejuvenation?","hi":"पुराना गंगा कार्रवाई योजना के बाद व्यापक गंगा पुनर्जीवन के लिए कौन-सा कार्यक्रम/ढाँचा आया?"},"a":{"en":"Namami Gange Programme under the National Mission for Clean Ganga.","hi":"राष्ट्रीय मिशन के लिए स्वच्छ गंगा के अंतर्गत नमामि गंगे कार्यक्रम।"},"o":[{"en":"Namami Gange Programme under the National Mission for Clean Ganga.","hi":"राष्ट्रीय मिशन के लिए स्वच्छ गंगा के अंतर्गत नमामि गंगे कार्यक्रम।"},{"en":"Ganga Action Plan.","hi":"गंगा कार्य योजना।"},{"en":"Clean River Mission.","hi":"स्वच्छ नदी मिशन।"},{"en":"National Water Mission.","hi":"राष्ट्रीय जल मिशन।"}],"exp":{"en":"Namami Gange Programme under the National Mission for Clean Ganga. Ganga Action Plan was older; Namami Gange/NMCG became the broader rejuvenation framework.","hi":"राष्ट्रीय मिशन के लिए स्वच्छ गंगा के अंतर्गत नमामि गंगे कार्यक्रम। गंगा कार्रवाई योजना पुराना था; नमामि गंगे/NMCG व्यापक पुनर्जीवन ढाँचा बना।"}},{"q":{"en":"What is the preferred hierarchy for managing solid waste?","hi":"ठोस अपशिष्ट प्रबंधन की वरीय पदानुक्रम क्या है?"},"a":{"en":"Prevent/minimise waste first, then segregate, reuse/recycle and recover; biologically process suitable organic waste, use controlled energy recovery where appropriate, and landfill only residual/reject waste.","hi":"पहले अपशिष्ट-उत्पादन को रोकें/न्यूनतम करें, फिर पृथक, पुनः उपयोग/पुनर्चक्रण और पुनर्प्राप्त करें; उपयुक्त कार्बनिक अपशिष्ट का जैविक प्रसंस्करण करें, उपयुक्त मामलों में नियंत्रित ऊर्जा पुनर्प्राप्ति का उपयोग करें और केवल अवशिष्ट/अस्वीकृत अपशिष्ट को भूमि-भराव स्थल पर भेजें।"},"o":[{"en":"Prevent/minimise waste first, then segregate, reuse/recycle and recover; biologically process suitable organic waste, use controlled energy recovery where appropriate, and landfill only residual/reject waste.","hi":"पहले अपशिष्ट-उत्पादन को रोकें/न्यूनतम करें, फिर पृथक, पुनः उपयोग/पुनर्चक्रण और पुनर्प्राप्त करें; उपयुक्त कार्बनिक अपशिष्ट का जैविक प्रसंस्करण करें, उपयुक्त मामलों में नियंत्रित ऊर्जा पुनर्प्राप्ति का उपयोग करें और केवल अवशिष्ट/अस्वीकृत अपशिष्ट को भूमि-भराव स्थल पर भेजें।"},{"en":"Open dump all waste together.","hi":"सभी अपशिष्ट खुला फेंकना करें।"},{"en":"Burn all waste in the open.","hi":"सभी अपशिष्ट खुला दहन करें।"},{"en":"Mix hazardous waste with municipal waste before disposal.","hi":"निपटान से पहले खतरनाक अपशिष्ट को नगरपालिका अपशिष्ट से मिश्रण करें।"}],"exp":{"en":"Prevent/minimise waste first, then segregate, reuse/recycle and recover; biologically process suitable organic waste, use controlled energy recovery where appropriate, and landfill only residual/reject waste. Waste management should prioritise prevention and resource recovery before final disposal.","hi":"पहले अपशिष्ट-उत्पादन को रोकें/न्यूनतम करें, फिर पृथक, पुनः उपयोग/पुनर्चक्रण और पुनर्प्राप्त करें; उपयुक्त कार्बनिक अपशिष्ट का जैविक प्रसंस्करण करें, उपयुक्त मामलों में नियंत्रित ऊर्जा पुनर्प्राप्ति का उपयोग करें और केवल अवशिष्ट/अस्वीकृत अपशिष्ट को भूमि-भराव स्थल पर भेजें। अपशिष्ट प्रबंधन में अंतिम निपटान से पहले निवारण और संसाधन पुनर्प्राप्ति को प्राथमिकता देनी चाहिए।"}}]}],"7. Sustainable Development / सतत विकास":[{"title":{"en":"1. Overview / Chapter Snapshot","hi":"1। अवलोकन / अध्याय स्नैपशॉट"},"questions":[{"q":{"en":"Which major topics are covered under Sustainable Development?","hi":"सतत विकास विषय के अंतर्गत किन प्रमुख विषयों का अध्ययन किया जाता है?"},"a":{"en":"Sustainable development — meeting present needs without compromising future generations' ability to meet their own needs; its economic, social and environmental dimensions; and the 17 SDGs of the 2030 Agenda.","hi":"सतत विकास - वर्तमान जरूरतों को इस तरह पूरा करना कि भावी पीढ़ियों की अपनी जरूरतें पूरी करने की क्षमता प्रभावित न हो; इसके आर्थिक, सामाजिक और पर्यावरणीय आयाम; तथा 2030 एजेंडा के 17 SDGs।"},"o":[{"en":"Sustainable development — meeting present needs without compromising future generations' ability to meet their own needs; its economic, social and environmental dimensions; and the 17 SDGs of the 2030 Agenda.","hi":"सतत विकास - वर्तमान जरूरतों को इस तरह पूरा करना कि भावी पीढ़ियों की अपनी जरूरतें पूरी करने की क्षमता प्रभावित न हो; इसके आर्थिक, सामाजिक और पर्यावरणीय आयाम; तथा 2030 एजेंडा के 17 SDGs।"},{"en":"Only the Kyoto Protocol and Carbon Trading mechanisms.","hi":"केवल क्योटो प्रोटोकॉल और कार्बन ट्रेडिंग तंत्र।"},{"en":"The historical background of India's wildlife protection laws.","hi":"भारत के वन्यजीव संरक्षण कानूनों की ऐतिहासिक पृष्ठभूमि।"},{"en":"Detailed biological processes of ozone depletion.","hi":"ओजोन रिक्तीकरण की विस्तृत जैविक प्रक्रियाएं।"}],"exp":{"en":"Sustainable development is broader than simply using fewer resources. It integrates present human needs, intergenerational equity and the economic, social and environmental dimensions of development.","hi":"सतत विकास केवल कम संसाधनों का उपयोग करने की अवधारणा नहीं है। यह वर्तमान मानवीय आवश्यकताएँ, अंतरपीढ़ीगत समानता और आर्थिक, सामाजिक तथा पर्यावरणीय आयामों को एकीकृत करता है।"}},{"q":{"en":"How many total Sustainable Development Goals (SDGs) are there?","hi":"कुल कितने सतत विकास लक्ष्य (SDGs) हैं?"},"a":{"en":"17 SDGs.","hi":"17 एसडीजी (SDGs)।"},"o":[{"en":"17 SDGs.","hi":"17 एसडीजी (SDGs)।"},{"en":"15 SDGs.","hi":"15 एसडीजी।"},{"en":"21 SDGs.","hi":"21 एसडीजी।"},{"en":"8 SDGs.","hi":"8 एसडीजी।"}],"exp":{"en":"The 2030 Agenda contains 17 Sustainable Development Goals and 169 associated targets. The Goals are universal and apply to all countries.","hi":"2030 एजेंडा में 17 सतत विकास लक्ष्य और 169 संबद्ध लक्ष्य हैं। ये लक्ष्य सार्वभौमिक हैं और सभी देशों पर लागू होते हैं।"}},{"q":{"en":"When were the 2030 Agenda and its 17 SDGs formally adopted by the UN General Assembly?","hi":"2030 एजेंडा और उसके 17 SDGs को संयुक्त राष्ट्र महासभा ने औपचारिक रूप से कब अपनाया?"},"a":{"en":"25 September 2015.","hi":"25 सितंबर 2015।"},"o":[{"en":"25 September 2015.","hi":"25 सितंबर 2015।"},{"en":"1 January 2016.","hi":"1 जनवरी 2016।"},{"en":"8 September 2000.","hi":"8 सितंबर 2000।"},{"en":"14 June 1992.","hi":"14 जून 1992।"}],"exp":{"en":"The 2030 Agenda, with the 17 SDGs at its core, was formally adopted by the UN General Assembly on 25 September 2015.","hi":"2030 एजेंडा, जिसके मूल में 17 SDGs हैं, संयुक्त राष्ट्र महासभा द्वारा 25 सितंबर 2015 को औपचारिक रूप से अपनाया गया।"}},{"q":{"en":"From when did the SDGs officially come into effect?","hi":"SDGs आधिकारिक रूप से कब से प्रभावी हुए?"},"a":{"en":"1 January 2016.","hi":"1 जनवरी 2016।"},"o":[{"en":"1 January 2016.","hi":"1 जनवरी 2016।"},{"en":"From 1st January 2015.","hi":"1 जनवरी 2015 से।"},{"en":"From 2nd October 2015.","hi":"2 अक्टूबर 2015 से।"},{"en":"From 5th June 2016.","hi":"5 जून 2016 से।"}],"exp":{"en":"The Goals officially came into effect on 1 January 2016 and were designed to guide global action through 2030.","hi":"लक्ष्य आधिकारिक रूप से 1 जनवरी 2016 से प्रभावी हुए और 2030 तक वैश्विक कार्रवाई मार्गदर्शन के लिए बनाए गए हैं।"}},{"q":{"en":"What is the overall target horizon of the 2030 Agenda and the SDGs?","hi":"2030 एजेंडा और SDGs का समग्र लक्ष्य-अवधि क्या है?"},"a":{"en":"2030.","hi":"2030।"},"o":[{"en":"2030.","hi":"2030।"},{"en":"2050.","hi":"2050।"},{"en":"2025.","hi":"2025।"},{"en":"2100.","hi":"2100।"}],"exp":{"en":"2030 is the overall horizon of the Agenda. Some individual SDG targets have or had earlier milestone dates, so not every single target necessarily has the same deadline.","hi":"2030 एजेंडा का समग्र लक्ष्य-अवधि है। कुछ व्यक्तिगत SDG लक्ष्यों की मध्यवर्ती तिथियाँ पहले भी हैं/थीं, इसलिए हर लक्ष्य की समय-सीमा ठीक समान नहीं होती।"}},{"q":{"en":"What was the time gap between formal adoption of the 2030 Agenda and the SDGs coming into effect?","hi":"2030 एजेंडा के औपचारिक अंगीकरण और SDGs के प्रभावी होने के बीच कितना समयांतराल था?"},"a":{"en":"98 days — adopted on 25 September 2015 and effective from 1 January 2016.","hi":"98 दिन - 25 सितंबर 2015 को अपनाया गया और 1 जनवरी 2016 से प्रभावी।"},"o":[{"en":"98 days — adopted on 25 September 2015 and effective from 1 January 2016.","hi":"98 दिन - 25 सितंबर 2015 को अपनाया गया और 1 जनवरी 2016 से प्रभावी।"},{"en":"Exactly 1 year.","hi":"ठीक 1 वर्ष।"},{"en":"5 years.","hi":"5 वर्ष।"},{"en":"There was no gap; they took effect on the adoption date.","hi":"कोई अंतराल नहीं था; अंगीकरण तिथि से ही प्रभावी हो गए।"}],"exp":{"en":"From 25 September 2015 to 1 January 2016 there are 98 days, so describing the adoption-to-effect gap as a full year is inaccurate.","hi":"25 सितंबर 2015 से 1 जनवरी 2016 तक 98 दिन होते हैं, इसलिए अंगीकरण से प्रभावी होने तक का अंतराल को पूरा एक वर्ष कहना असटीक है।"}}]},{"title":{"en":"2. Sustainable Development — Introduction","hi":"2। सतत विकास - परिचय"},"questions":[{"q":{"en":"What is the widely used Brundtland definition of sustainable development?","hi":"सतत विकास की व्यापक रूप से प्रयुक्त ब्रुंटलैंड परिभाषा क्या है?"},"a":{"en":"Development that meets the needs of the present without compromising the ability of future generations to meet their own needs.","hi":"ऐसा विकास जो वर्तमान की आवश्यकताओं को पूरा करे, बिना भावी पीढ़ियों की अपनी आवश्यकताएँ पूरी करने की क्षमता से समझौता किए।"},"o":[{"en":"Development that meets the needs of the present without compromising the ability of future generations to meet their own needs.","hi":"ऐसा विकास जो वर्तमान की आवश्यकताओं को पूरा करे, बिना भावी पीढ़ियों की अपनी आवश्यकताएँ पूरी करने की क्षमता से समझौता किए।"},{"en":"Minimum use of every natural resource regardless of social or economic needs.","hi":"सामाजिक/आर्थिक आवश्यकताएँ की परवाह किए बिना हर प्राकृतिक संसाधन का न्यूनतम उपयोग।"},{"en":"Maximum resource extraction to accelerate economic growth.","hi":"आर्थिक वृद्धि तेज करने के लिए संसाधनों का अधिकतम दोहन।"},{"en":"Stopping all industrial and technological development.","hi":"सभी औद्योगिक और प्रौद्योगिकीय विकास को रोक देना।"}],"exp":{"en":"This formulation was popularised by the 1987 report Our Common Future of the World Commission on Environment and Development. It balances present needs with the capacity of future generations to meet theirs.","hi":"यह परिभाषा विश्व पर्यावरण एवं विकास आयोग की 1987 प्रतिवेदन हमारा साझा भविष्य से व्यापक रूप से लोकप्रिय हुई। इसमें वर्तमान आवश्यकताओं और भावी पीढ़ियों की आवश्यकताएँ पूरी करने की क्षमता के बीच संतुलन है।"}},{"q":{"en":"What are the three core dimensions of sustainable development?","hi":"सतत विकास के तीन मूल आयाम कौन-से हैं?"},"a":{"en":"Economic development, social inclusion/development, and environmental protection.","hi":"आर्थिक विकास, सामाजिक समावेशन/विकास और पर्यावरण संरक्षण।"},"o":[{"en":"Economic development, social inclusion/development, and environmental protection.","hi":"आर्थिक विकास, सामाजिक समावेशन/विकास और पर्यावरण संरक्षण।"},{"en":"Only environmental protection and forestry.","hi":"केवल पर्यावरण संरक्षण और वानिकी।"},{"en":"Only GDP growth and financial markets.","hi":"केवल GDP वृद्धि और वित्तीय बाज़ार।"},{"en":"Only poverty reduction and public health.","hi":"केवल गरीबी कमी और जनस्वास्थ्य।"}],"exp":{"en":"The three dimensions are interdependent. Development is not sustainable if economic gains come with deep social exclusion or severe environmental degradation.","hi":"तीन आयाम परस्पर निर्भर हैं। यदि आर्थिक लाभ के साथ गहरे सामाजिक बहिष्करण या गंभीर पर्यावरणीय क्षरण हो, तो विकास सतत नहीं माना जाता।"}},{"q":{"en":"Is Sustainable Development only about environmental protection?","hi":"क्या सतत विकास केवल पर्यावरण संरक्षण के बारे में है?"},"a":{"en":"No. Sustainable development integrates economic, social and environmental dimensions rather than treating environmental protection as its only objective.","hi":"नहीं। सतत विकास आर्थिक, सामाजिक और पर्यावरणीय आयामों को एकीकृत करता है; पर्यावरण संरक्षण इसका केवल लक्ष्य नहीं है।"},"o":[{"en":"No. Sustainable development integrates economic, social and environmental dimensions rather than treating environmental protection as its only objective.","hi":"नहीं। सतत विकास आर्थिक, सामाजिक और पर्यावरणीय आयामों को एकीकृत करता है; पर्यावरण संरक्षण इसका केवल लक्ष्य नहीं है।"},{"en":"Yes, it is entirely an environmental concept.","hi":"हां, यह पूरी तरह से एक पर्यावरणीय अवधारणा है।"},{"en":"Yes, its only focus is planting more trees.","hi":"हां, इसका एकमात्र फोकस अधिक पेड़ लगाना है।"},{"en":"No — it is only about economic GDP growth.","hi":"नहीं - यह केवल आर्थिक जीडीपी विकास के बारे में है।"}],"exp":{"en":"Environmental protection is one pillar, but sustainable development also requires economic opportunity, social inclusion and long-term resilience.","hi":"पर्यावरण संरक्षण एक स्तंभ है, लेकिन सतत विकास के लिए आर्थिक अवसर, सामाजिक समावेशन और दीर्घकालिक लचीलापन भी जरूरी हैं।"}}]},{"title":{"en":"4. में कमी।"},{"en":"Quality Education.","hi":"गुणवत्तापूर्ण शिक्षा।"}],"exp":{"en":"Peace, Justice and Strong Institutions. It promotes peaceful and inclusive societies, access to justice and effective, accountable institutions.","hi":"शांति, न्याय और मजबूत संस्थाएँ (शांति, न्याय एवं सुदृढ़ संस्थाएँ)। यह शांतिपूर्ण/समावेशी समाजों, न्याय तक पहुँच और प्रभावी एवं उत्तरदायी संस्थाओं पर केंद्रित है।"}},{"q":{"en":"What is SDG 17?","hi":"SDG 17 क्या है?"},"a":{"en":"Partnerships for the Goals.","hi":"लक्ष्यों के लिए भागीदारी (लक्ष्यों हेतु भागीदारी)।"},"o":[{"en":"Partnerships for the Goals.","hi":"लक्ष्यों के लिए भागीदारी (लक्ष्यों हेतु भागीदारी)।"},{"en":"Peace, Justice and Strong Institutions.","hi":"शांति, न्याय और मजबूत संस्थाएँ।"},{"en":"Responsible Consumption and Production.","hi":"जिम्मेदार खपत और उत्पादन।"},{"en":"Industry, Innovation and Infrastructure.","hi":"उद्योग, नवाचार और अवसंरचना।"}],"exp":{"en":"Partnerships for the Goals. It strengthens means of implementation and the global partnership for sustainable development.","hi":"लक्ष्यों के लिए भागीदारी (लक्ष्यों हेतु भागीदारी)। यह क्रियान्वयन के साधन और सतत विकास हेतु वैश्विक भागीदारी को सुदृढ़ करता है।"}},{"q":{"en":"Why are SDG 14 and SDG 15 often studied together in ecology and biodiversity?","hi":"पारिस्थितिकी और जैव विविधता के संदर्भ में SDG 14 तथा SDG 15 का एक साथ अध्ययन क्यों किया जाता है?"},"a":{"en":"SDG 14 covers oceans, seas and marine resources, while SDG 15 covers terrestrial ecosystems, forests, land degradation and biodiversity; together they span major aquatic and terrestrial ecosystem concerns.","hi":"SDG 14 महासागर, समुद्र और समुद्री संसाधनों को समाहित करता है, जबकि SDG 15 स्थलीय पारितंत्र, वन, भूमि क्षरण और जैव विविधता को; एक साथ ये प्रमुख जलीय और स्थलीय पारितंत्र मुद्दों को समाहित करते हैं।"},"o":[{"en":"SDG 14 covers oceans, seas and marine resources, while SDG 15 covers terrestrial ecosystems, forests, land degradation and biodiversity; together they span major aquatic and terrestrial ecosystem concerns.","hi":"SDG 14 महासागर, समुद्र और समुद्री संसाधनों को समाहित करता है, जबकि SDG 15 स्थलीय पारितंत्र, वन, भूमि क्षरण और जैव विविधता को; एक साथ ये प्रमुख जलीय और स्थलीय पारितंत्र मुद्दों को समाहित करते हैं।"},{"en":"Both deal exclusively with atmospheric climate change.","hi":"दोनों केवल वायुमंडलीय जलवायु परिवर्तन से संबंधित करते हैं।"},{"en":"Both are official UN sub-goals of SDG 13.","hi":"दोनों SDG 13 के आधिकारिक संयुक्त राष्ट्र के उप-लक्ष्य हैं।"},{"en":"Both focus only on sustainable cities.","hi":"दोनों केवल सतत शहर पर केंद्रित हैं।"}],"exp":{"en":"SDG 14 and SDG 15 form a useful ecosystem-related pair, although this is not an official UN category. SDG 14 addresses marine ecosystems and resources, while SDG 15 addresses terrestrial ecosystems and biodiversity.","hi":"SDG 14 और SDG 15 को पारितंत्र-संबंधी उपयोगी युग्म के रूप में समझा जा सकता है, यद्यपि यह संयुक्त राष्ट्र की आधिकारिक श्रेणी नहीं है। SDG 14 समुद्री पारितंत्र एवं संसाधनों से, जबकि SDG 15 स्थलीय पारितंत्र एवं जैव विविधता से संबंधित है।"}}]},{"title":{"en":"5. Common Confusions & Reverse Questions","hi":"5। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"When were the SDGs formally adopted, and when did they come into effect?","hi":"SDGs औपचारिक रूप से कब अपनाया गया हुए और कब प्रभावी हुए?"},"a":{"en":"Adopted on 25 September 2015; effective from 1 January 2016.","hi":"25 सितंबर 2015 को अपनाया गया; 1 जनवरी 2016 से प्रभावी।"},"o":[{"en":"Adopted on 25 September 2015; effective from 1 January 2016.","hi":"25 सितंबर 2015 को अपनाया गया; 1 जनवरी 2016 से प्रभावी।"},{"en":"Adopted in 2016; effective from 2017.","hi":"2016 में अपनाया गया; 2017 से प्रभावी।"},{"en":"Adopted and effective on the same day in 2015.","hi":"2015 में समान दिन अपनाया गया और प्रभावी।"},{"en":"Adopted in 1992; effective from 2015.","hi":"1992 में अपनाया गया; 2015 से प्रभावी।"}],"exp":{"en":"Adoption and entry into effect are separate milestones: formal adoption was on 25 September 2015, while implementation under the new Goals began on 1 January 2016.","hi":"अंगीकरण और प्रभावी होना अलग प्रमुख पड़ाव हैं: औपचारिक अंगीकरण 25 सितंबर 2015 को हुआ, जबकि नया लक्ष्य के अंतर्गत क्रियान्वयन 1 जनवरी 2016 से शुरू हुआ।"}},{"q":{"en":"Is Sustainable Development limited only to environmental protection?","hi":"क्या सतत विकास केवल पर्यावरण संरक्षण तक सीमित है?"},"a":{"en":"No. Sustainable development integrates economic development, social inclusion/development and environmental protection.","hi":"नहीं। सतत विकास आर्थिक विकास, सामाजिक समावेशन/विकास और पर्यावरण संरक्षण को एकीकृत करता है।"},"o":[{"en":"No. Sustainable development integrates economic development, social inclusion/development and environmental protection.","hi":"नहीं। सतत विकास आर्थिक विकास, सामाजिक समावेशन/विकास और पर्यावरण संरक्षण को एकीकृत करता है।"},{"en":"Yes, it only focuses on planting trees and stopping pollution.","hi":"हां, यह केवल पेड़ लगाने और प्रदूषण रोकने पर केंद्रित है।"},{"en":"No, it is purely an economic concept.","hi":"नहीं, यह पूरी तरह से एक आर्थिक अवधारणा है।"},{"en":"No, it only covers political and social development.","hi":"नहीं, यह केवल राजनीतिक और सामाजिक विकास को कवर करता है।"}],"exp":{"en":"Sustainable development depends on integrating economic, social and environmental priorities rather than treating any one of them in isolation.","hi":"सतत विकास आर्थिक, सामाजिक और पर्यावरणीय प्राथमिकताएँ को एकीकृत करने पर निर्भर करता है; किसी एक आयाम को पृथक रूप से में देखना पर्याप्त नहीं है।"}},{"q":{"en":"What are SDG 14 and SDG 15, and how do their domains differ?","hi":"SDG 14 और SDG 15 क्या हैं और उनके क्षेत्र कैसे अलग हैं?"},"a":{"en":"SDG 14 = Life Below Water; SDG 15 = Life on Land. SDG 14 addresses marine systems, while SDG 15 addresses terrestrial ecosystems and biodiversity.","hi":"SDG 14 = जल के नीचे जीवन; SDG 15 = स्थल पर जीवन। SDG 14 समुद्री प्रणालियों से, जबकि SDG 15 स्थलीय पारितंत्र और जैव विविधता से संबंधित है।"},"o":[{"en":"SDG 14 = Life Below Water; SDG 15 = Life on Land. SDG 14 addresses marine systems, while SDG 15 addresses terrestrial ecosystems and biodiversity.","hi":"SDG 14 = जल के नीचे जीवन; SDG 15 = स्थल पर जीवन। SDG 14 समुद्री प्रणालियों से, जबकि SDG 15 स्थलीय पारितंत्र और जैव विविधता से संबंधित है।"},{"en":"SDG 14 = Life on Land; SDG 15 = Life Below Water.","hi":"SDG 14 = भूमि पर जीवन; SDG 15 = जल के नीचे जीवन।"},{"en":"SDG 14 = Clean Water; SDG 15 = Climate Action.","hi":"SDG 14 = स्वच्छ जल; SDG 15 = जलवायु कार्रवाई।"},{"en":"SDG 14 = Climate Action; SDG 15 = Clean Energy.","hi":"SDG 14 = जलवायु कार्रवाई; SDG 15 = स्वच्छ ऊर्जा।"}],"exp":{"en":"SDG 14 is marine-focused and SDG 15 is land-focused. Both contribute to biodiversity and ecosystem conservation but cover different environmental domains.","hi":"SDG 14 समुद्री-केंद्रित और SDG 15 भूमि-केंद्रित है। दोनों जैव विविधता और पारितंत्र संरक्षण में योगदान करते हैं, लेकिन पर्यावरणीय क्षेत्रों अलग हैं।"}},{"q":{"en":"When did SDG implementation begin, and what is the target completion year?","hi":"SDG कार्यान्वयन कब शुरू हुआ और लक्ष्य पूर्ण करने का वर्ष क्या है?"},"a":{"en":"The SDGs came into effect on 1 January 2016, and 2030 is the overall target horizon of the Agenda.","hi":"SDGs 1 जनवरी 2016 से प्रभावी हुए और 2030 एजेंडा का समग्र लक्ष्य-अवधि है।"},"o":[{"en":"The SDGs came into effect on 1 January 2016, and 2030 is the overall target horizon of the Agenda.","hi":"SDGs 1 जनवरी 2016 से प्रभावी हुए और 2030 एजेंडा का समग्र लक्ष्य-अवधि है।"},{"en":"They began in 2015 and the overall horizon is 2050.","hi":"वे 2015 में शुरू हुए और समग्र लक्ष्य-अवधि 2050 है।"},{"en":"They began in 2016 and all individual targets end exactly on 1 January 2030.","hi":"वे 2016 में शुरू हुए और सभी व्यक्तिगत लक्ष्य ठीक 1 जनवरी 2030 को समाप्ति होते हैं।"},{"en":"They began in 2000 and ended in 2015.","hi":"वे 2000 में शुरू हुए और 2015 में समाप्ति हुए।"}],"exp":{"en":"The Goals came into effect in 2016 and the Agenda runs toward the 2030 horizon. The period is commonly described as the 2016–2030 implementation era.","hi":"लक्ष्य 2016 से प्रभावी हुए और एजेंडा का लक्ष्य-अवधि 2030 है। इस अवधि को सामान्यतः 2016-2030 क्रियान्वयन अवधि के रूप में देखा जाता है।"}}]},{"title":{"en":"6. Final Revision","hi":"6। अंतिम पुनरावृत्ति"},"questions":[{"q":{"en":"Total SDGs?","hi":"कुल एसडीजी?"},"a":{"en":"17.","hi":"17।"},"o":[{"en":"17.","hi":"17।"},{"en":"15.","hi":"15।"},{"en":"21.","hi":"21।"},{"en":"8.","hi":"8।"}],"exp":{"en":"The 2030 Agenda has 17 SDGs and 169 associated targets.","hi":"2030 एजेंडा में 17 SDGs और 169 संबद्ध लक्ष्य हैं।"}},{"q":{"en":"SDGs adopted year?","hi":"SDGs अपनाया गया वर्ष?"},"a":{"en":"2015.","hi":"2015।"},"o":[{"en":"2015.","hi":"2015।"},{"en":"2016.","hi":"2016।"},{"en":"2000.","hi":"2000।"},{"en":"1992.","hi":"1992।"}],"exp":{"en":"The SDGs were formally adopted in 2015; the exact adoption date was 25 September 2015.","hi":"SDGs औपचारिक रूप से 2015 में अपनाया गया हुए; सटीक अंगीकरण तिथि 25 सितंबर 2015 थी।"}},{"q":{"en":"SDGs effective from?","hi":"एसडीजी कब से प्रभावी?"},"a":{"en":"1 January 2016.","hi":"1 जनवरी 2016।"},"o":[{"en":"1 January 2016.","hi":"1 जनवरी 2016।"},{"en":"1 January 2015.","hi":"1 जनवरी 2015।"},{"en":"5 June 2015.","hi":"5 जून 2015।"},{"en":"1 April 2016.","hi":"1 अप्रैल 2016।"}],"exp":{"en":"The Goals officially came into effect on 1 January 2016.","hi":"लक्ष्य आधिकारिक रूप से 1 जनवरी 2016 से प्रभावी हुए।"}},{"q":{"en":"SDGs target year?","hi":"एसडीजी लक्ष्य वर्ष?"},"a":{"en":"2030.","hi":"2030।"},"o":[{"en":"2030.","hi":"2030।"},{"en":"2050.","hi":"2050।"},{"en":"2025.","hi":"2025।"},{"en":"2100.","hi":"2100।"}],"exp":{"en":"2030 is the overall horizon of the 2030 Agenda.","hi":"2030, 2030 एजेंडा का समग्र लक्ष्य-अवधि है।"}},{"q":{"en":"SDG 1?","hi":"SDG 1 किससे संबंधित है?"},"a":{"en":"No Poverty.","hi":"गरीबी समाप्त करना (गरीबी उन्मूलन)।"},"o":[{"en":"No Poverty.","hi":"गरीबी समाप्त करना (गरीबी उन्मूलन)।"},{"en":"Zero Hunger.","hi":"शून्य भुखमरी।"},{"en":"Quality Education.","hi":"गुणवत्तापूर्ण शिक्षा।"},{"en":"Climate Action.","hi":"जलवायु कार्रवाई।"}],"exp":{"en":"No Poverty. It aims to end poverty in all its forms everywhere.","hi":"गरीबी समाप्त करना (गरीबी उन्मूलन)। यह हर रूप की गरीबी को हर जगह समाप्त करने पर केंद्रित है।"}},{"q":{"en":"SDG 3?","hi":"SDG 3 किससे संबंधित है?"},"a":{"en":"Good Health and Well-Being.","hi":"अच्छा स्वास्थ्य एवं कल्याण।"},"o":[{"en":"Good Health and Well-Being.","hi":"अच्छा स्वास्थ्य एवं कल्याण।"},{"en":"Gender Equality.","hi":"लैंगिक समानता।"},{"en":"Quality Education.","hi":"गुणवत्तापूर्ण शिक्षा।"},{"en":"Clean Water.","hi":"स्वच्छ जल।"}],"exp":{"en":"Good Health and Well-Being. It seeks healthy lives and well-being for people of all ages.","hi":"अच्छा स्वास्थ्य एवं कल्याण। यह सभी आयु-वर्गों के लोगों के स्वस्थ जीवन और कल्याण पर केंद्रित है।"}},{"q":{"en":"SDG 6?","hi":"SDG 6 किससे संबंधित है?"},"a":{"en":"Clean Water and Sanitation.","hi":"स्वच्छ जल और स्वच्छता (स्वच्छ जल एवं स्वच्छता)।"},"o":[{"en":"Clean Water and Sanitation.","hi":"स्वच्छ जल और स्वच्छता (स्वच्छ जल एवं स्वच्छता)।"},{"en":"Affordable Energy.","hi":"सस्ती ऊर्जा।"},{"en":"Climate Action.","hi":"जलवायु कार्रवाई।"},{"en":"Life Below Water.","hi":"जल के नीचे जीवन।"}],"exp":{"en":"Clean Water and Sanitation. It covers availability and sustainable management of water and sanitation for all.","hi":"स्वच्छ जल और स्वच्छता (स्वच्छ जल एवं स्वच्छता)। यह सभी के लिए जल और स्वच्छता की उपलब्धता तथा सतत प्रबंधन पर केंद्रित है।"}},{"q":{"en":"SDG 7?","hi":"SDG 7 किससे संबंधित है?"},"a":{"en":"Affordable and Clean Energy.","hi":"सस्ती और स्वच्छ ऊर्जा (सस्ती एवं स्वच्छ ऊर्जा)।"},"o":[{"en":"Affordable and Clean Energy.","hi":"सस्ती और स्वच्छ ऊर्जा (सस्ती एवं स्वच्छ ऊर्जा)।"},{"en":"Decent Work.","hi":"सम्मानजनक कार्य।"},{"en":"Sustainable Cities.","hi":"सतत शहर।"},{"en":"Reduced Inequalities.","hi":"असमानताओं में कमी।"}],"exp":{"en":"Affordable and Clean Energy. It seeks access to affordable, reliable, sustainable and modern energy for all.","hi":"सस्ती और स्वच्छ ऊर्जा (सस्ती एवं स्वच्छ ऊर्जा)। यह सभी के लिए किफायती, विश्वसनी
