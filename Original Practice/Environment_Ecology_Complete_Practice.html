r reduced performance. WHO evidence links excessive environmental noise with sleep disturbance, hearing and cognitive impairment, annoyance, hypertension and other cardiovascular outcomes.","hi":"श्रवण क्षमता में कमी/कर्णक्ष्वेद, नींद में व्यवधान, झुंझलाहट/तनाव, उच्च रक्तचाप और अन्य हृदय-वाहिका संबंधी प्रभाव, तथा संज्ञानात्मक क्षमता में कमी या कम कार्य-क्षमता। WHO साक्ष्य अत्यधिक पर्यावरणीय ध्वनि को नींद में व्यवधान, श्रवण/संज्ञानात्मक क्षमता में कमी, झुंझलाहट, उच्च रक्तचाप और अन्य हृदय-वाहिका संबंधी परिणाम से जोड़ता है।"}},{"q":{"en":"Which measures help control Noise Pollution?","hi":"ध्वनि प्रदूषण को नियंत्रित करने में कौन-से उपाय सहायक हैं?"},"a":{"en":"Silencers, acoustic barriers, zoning, green buffers","hi":"साइलेंसर, ध्वनि अवरोधक, क्षेत्रीकरण, हरित पट्टियाँ"},"o":[{"en":"Silencers, acoustic barriers, zoning, green buffers","hi":"साइलेंसर, ध्वनि अवरोधक, क्षेत्रीकरण, हरित पट्टियाँ"},{"en":"Bioremediation and vermicomposting","hi":"जैव-उपचार और केंचुआ खाद"},{"en":"Chlorination of drinking water","hi":"पेयजल का क्लोरीनीकरण"},{"en":"Phasing out CFCs and halons","hi":"CFCs और हैलोन को चरणबद्ध हटाना"}],"exp":{"en":"Source control and quieter equipment, maintenance and silencers, traffic management, barriers and sound insulation, zoning/setback planning, green buffers, and enforcement of limits on horns/loudspeakers and other noise sources. Effective control combines action at the source, along the transmission path and at the receiver, supported by land-use planning and enforcement.","hi":"स्रोत नियंत्रण और कम शोर वाले उपकरण, रखरखाव/साइलेंसर, यातायात प्रबंधन, अवरोधक/ध्वनि-रोधन, क्षेत्रीकरण/पर्याप्त दूरी नियोजन, हरित सुरक्षात्मक पट्टियाँ और हॉर्न/लाउडस्पीकर तथा अन्य ध्वनि स्रोतों पर सीमाओं का प्रवर्तन। प्रभावी नियंत्रण स्रोत, संचरण मार्ग और ग्राही तीनों स्तर पर कार्रवाई संयोजित करता है, साथ में भूमि-उपयोग नियोजन और प्रवर्तन।"}},{"q":{"en":"What is the permissible noise level for an Industrial area (Day/Night)?","hi":"औद्योगिक क्षेत्र के लिए अनुमेय (अनुमेय) शोर स्तर (दिन/रात) क्या है?"},"a":{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"},"o":[{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"},{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"}],"exp":{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night). This is the statutory ambient noise standard for the Industrial category under India's Noise Pollution (Regulation and Control) Rules, 2000.","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)। यह भारत के ध्वनि प्रदूषण (विनियमन और नियंत्रण) नियम, 2000 के अंतर्गत औद्योगिक श्रेणी का वैधानिक परिवेशीय ध्वनि मानक है।"}},{"q":{"en":"What is the permissible noise level for a Commercial area (Day/Night)?","hi":"वाणिज्यिक क्षेत्र के लिए अनुमेय शोर स्तर (दिन/रात) क्या है?"},"a":{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},"o":[{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"},{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"}],"exp":{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night). This is the statutory ambient noise standard for the Commercial category under India's Noise Pollution (Regulation and Control) Rules, 2000.","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)। यह भारत के ध्वनि प्रदूषण (विनियमन और नियंत्रण) नियम, 2000 के अंतर्गत वाणिज्यिक श्रेणी का वैधानिक परिवेशीय ध्वनि मानक है।"}},{"q":{"en":"What is the permissible noise level for a Residential area (Day/Night)?","hi":"आवासीय (आवासीय) क्षेत्र के लिए अनुमेय शोर स्तर (दिन/रात) क्या है?"},"a":{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},"o":[{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"},{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"}],"exp":{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night). This is the statutory ambient noise standard for the Residential category under India's Noise Pollution (Regulation and Control) Rules, 2000.","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)। यह भारत के ध्वनि प्रदूषण (विनियमन और नियंत्रण) नियम, 2000 के अंतर्गत आवासीय श्रेणी का वैधानिक परिवेशीय ध्वनि मानक है।"}},{"q":{"en":"What is the permissible noise level for a Silence Zone (Day/Night)?","hi":"शांत क्षेत्र के लिए अनुमेय ध्वनि स्तर (दिन/रात) क्या है?"},"a":{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"},"o":[{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"},{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"}],"exp":{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night). This is the statutory ambient noise standard for the Silence category under India's Noise Pollution (Regulation and Control) Rules, 2000.","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)। यह भारत के ध्वनि प्रदूषण (विनियमन और नियंत्रण) नियम, 2000 के अंतर्गत शांत श्रेणी का वैधानिक परिवेशीय ध्वनि मानक है।"}}]},{"title":{"en":"7. Radioactive & Solid Waste Pollution","hi":"7। रेडियोधर्मी और ठोस अपशिष्ट प्रदूषण"},"questions":[{"q":{"en":"What is radioactive pollution?","hi":"रेडियोधर्मी प्रदूषण क्या है?"},"a":{"en":"Contamination by radionuclides above background levels","hi":"पृष्ठभूमि स्तर से ऊपर रेडियोन्यूक्लाइड संदूषण"},"o":[{"en":"Contamination by radionuclides above background levels","hi":"पृष्ठभूमि स्तर से ऊपर रेडियोन्यूक्लाइड संदूषण"},{"en":"Pollution from radio waves and mobile towers","hi":"रेडियो तरंगों और मोबाइल टावरों से प्रदूषण"},{"en":"Noise from loud radios and speakers","hi":"तेज रेडियो और स्पीकर से होने वाला शोर"},{"en":"Smoke from burning plastic waste","hi":"प्लास्टिक कचरा जलाने से निकलने वाला धुआँ"}],"exp":{"en":"Environmental contamination or harmful exposure caused by radionuclides or ionising radiation above normal/background or acceptable levels. Not every natural radiation exposure is 'pollution'; the term is most useful when radioactive material or ionising-radiation exposure contaminates the environment or exceeds normal/acceptable conditions.","hi":"रेडियोन्यूक्लाइड या आयनकारी विकिरण के कारण पर्यावरणीय संदूषण या हानिकारक संपर्क, जो सामान्य/पृष्ठभूमि या स्वीकार्य स्तरों से ऊपर हो। हर प्राकृतिक विकिरण संपर्क 'प्रदूषण' नहीं है; शब्द तब सर्वाधिक उपयोगी है जब रेडियोधर्मी पदार्थ/आयनकारी विकिरण पर्यावरण संदूषित करे या सामान्य/स्वीकार्य स्थितियों से अधिक करे।"}},{"q":{"en":"Which are major natural sources of ionising radiation exposure?","hi":"आयनकारी विकिरण संपर्क के प्रमुख प्राकृतिक स्रोत कौन-से हैं?"},"a":{"en":"Radon, terrestrial gamma, cosmic rays","hi":"रेडॉन, स्थलीय गामा, ब्रह्मांडीय किरणें"},"o":[{"en":"Radon, terrestrial gamma, cosmic rays","hi":"रेडॉन, स्थलीय गामा, ब्रह्मांडीय किरणें"},{"en":"Nuclear weapons tests, atmospheric fallout","hi":"परमाणु हथियार परीक्षण, वायुमंडलीय गिरावट"},{"en":"Nuclear power reactors, uranium mines","hi":"परमाणु ऊर्जा रिएक्टर, यूरेनियम खदानें"},{"en":"Medical X-rays, hospital CT scans","hi":"चिकित्सीय एक्स-रे, अस्पताल सीटी स्कैन"}],"exp":{"en":"Radon and other naturally occurring radionuclides in rocks/soil, terrestrial gamma radiation, cosmic radiation, and naturally occurring radionuclides in food and the body. Radon is often the largest natural contributor to population radiation dose; cosmic and terrestrial radiation are other major natural components.","hi":"शैल/मृदा में रेडॉन और अन्य प्राकृतिक रूप से पाए जाने वाले रेडियोन्यूक्लाइड, स्थलीय गामा विकिरण, ब्रह्मांडीय विकिरण और खाद्य/निकाय में प्राकृतिक रूप से पाए जाने वाले रेडियोन्यूक्लाइड। रेडॉन जनसंख्या विकिरण मात्रा का प्रायः सबसे बड़ा प्राकृतिक योगदानकर्ता है; ब्रह्मांडीय और स्थलीय विकिरण अन्य प्रमुख प्राकृतिक घटक हैं।"}},{"q":{"en":"Which are major human-made sources of ionising radiation?","hi":"आयनकारी विकिरण के प्रमुख मानव-निर्मित स्रोत कौन-से हैं?"},"a":{"en":"Medical imaging, reactors, weapons tests, accidents","hi":"चिकित्सीय इमेजिंग, रिएक्टर, हथियार परीक्षण, दुर्घटनाएँ"},"o":[{"en":"Medical imaging, reactors, weapons tests, accidents","hi":"चिकित्सीय इमेजिंग, रिएक्टर, हथियार परीक्षण, दुर्घटनाएँ"},{"en":"Cosmic rays, solar flares, space dust","hi":"ब्रह्मांडीय किरणें, सौर ज्वालाएँ, अंतरिक्ष धूल"},{"en":"Forest leaf-litter decay, humus, soil microbes","hi":"वन पत्तियों का अपघटन, ह्यूमस, मृदा सूक्ष्मजीव"},{"en":"Volcanic eruptions, hot springs, tectonic faults","hi":"ज्वालामुखीय विस्फोट, गर्म झरने, विवर्तनिक भ्रंश"}],"exp":{"en":"Medical imaging and nuclear medicine, nuclear reactors and fuel-cycle activities, industrial/research uses, nuclear weapons testing, and accidents or improper handling of radioactive materials. Medical uses are a major human-made exposure source, while environmental contamination can also follow weapons testing, accidents or releases from nuclear/fuel-cycle activities.","hi":"चिकित्सीय इमेजिंग/परमाणु चिकित्सा, परमाणु रिएक्टरों और ईंधन-चक्र गतिविधियाँ, औद्योगिक/अनुसंधान उपयोग, परमाणु हथियार परीक्षण और रेडियोधर्मी सामग्री की दुर्घटनाएँ या अनुचित प्रबंधन। चिकित्सीय उपयोग प्रमुख मानव-निर्मित संपर्क स्रोत हैं, जबकि पर्यावरणीय संदूषण हथियार परीक्षण, दुर्घटनाएँ या परमाणु/ईंधन-चक्र से हुए उत्सर्जन से भी हो सकती है।"}},{"q":{"en":"What are major long-term health effects of significant ionising radiation?","hi":"महत्वपूर्ण आयनकारी विकिरण के प्रमुख दीर्घकालिक स्वास्थ्य प्रभाव क्या हैं?"},"a":{"en":"DNA damage, cancer risk, hereditary/tissue damage","hi":"DNA क्षति, कैंसर जोखिम, आनुवंशिक/ऊतक क्षति"},"o":[{"en":"DNA damage, cancer risk, hereditary/tissue damage","hi":"DNA क्षति, कैंसर जोखिम, आनुवंशिक/ऊतक क्षति"},{"en":"Seasonal asthma, mild eye irritation, sneezing","hi":"मौसमी अस्थमा, आँखों में हल्की जलन, छींक"},{"en":"Acute cholera, amoebic dysentery, severe dehydration","hi":"तीव्र हैजा, अमीबी पेचिश, गंभीर निर्जलीकरण"},{"en":"Mild hypertension, temporary insomnia, muscle cramps","hi":"हल्का उच्च रक्तचाप, अस्थायी अनिद्रा, मांसपेशी ऐंठन"}],"exp":{"en":"DNA damage, increased cancer risk, possible hereditary effects and reproductive or tissue damage depending on dose, dose rate, radiation type and organ exposed. Ionising radiation can break or chemically alter DNA. Cancer risk generally rises with dose, while very high exposures can also produce deterministic tissue injury.","hi":"DNA क्षति, बढ़ा हुआ कैंसर जोखिम, संभावित आनुवंशिक प्रभाव और मात्रा, मात्रा दर, विकिरण प्रकार तथा उद्भासित अंग के अनुसार प्रजनन संबंधी/ऊतक क्षति। आयनकारी विकिरण DNA को टूटना या रासायनिक रूप से बदलती कर सकती है। कैंसर जोखिम सामान्यतः मात्रा के साथ बढ़ता है, जबकि अत्यधिक उच्च संपर्क निश्चित ऊतक क्षति भी उत्पन्न कर सकता है।"}},{"q":{"en":"Why is Strontium-90 a major internal-radiation hazard?","hi":"स्ट्रॉन्शियम-90 एक प्रमुख आंतरिक-विकिरण खतरा क्यों है?"},"a":{"en":"Mimics calcium; accumulates in bones and teeth","hi":"कैल्शियम की नकल कर अस्थियों/दाँतों में जमता है"},"o":[{"en":"Mimics calcium; accumulates in bones and teeth","hi":"कैल्शियम की नकल कर अस्थियों/दाँतों में जमता है"},{"en":"Targets the thyroid gland like iodine","hi":"आयोडीन की तरह थायरॉइड ग्रंथि को लक्ष्य करता है"},{"en":"It is a harmless non-radioactive gas","hi":"यह एक हानिरहित गैर-रेडियोधर्मी गैस है"},{"en":"Affects only outer skin; cannot enter body","hi":"केवल बाहरी त्वचा को प्रभावित करता है"}],"exp":{"en":"It behaves chemically like calcium, accumulates in bones and teeth, and can irradiate bone and bone marrow, increasing the risk of bone and marrow cancers. Because strontium mimics calcium, Sr-90 becomes incorporated into bone and can irradiate nearby bone marrow for long periods.","hi":"यह रासायनिक रूप से कैल्शियम की तरह व्यवहार करता है, अस्थियों/दाँतों में संचित होता है और अस्थि तथा अस्थि मज्जा को विकिरणित करके अस्थि/मज्जा कैंसर का जोखिम बढ़ा सकता है। स्ट्रॉन्शियम कैल्शियम को अनुकरण करता है, इसलिए Sr-90 अस्थि में समाहित होकर निकटवर्ती अस्थि मज्जा को लंबी अवधियों तक विकिरणित कर सकता है।"}},{"q":{"en":"Which organ is especially targeted by radioactive Iodine-131 after it enters the body?","hi":"निकाय में प्रवेश होने के बाद रेडियोधर्मी आयोडीन-131 विशेष रूप से किस अंग को लक्ष्य करता है?"},"a":{"en":"The thyroid gland.","hi":"थायरॉइड ग्रंथि।"},"o":[{"en":"The thyroid gland.","hi":"थायरॉइड ग्रंथि।"},{"en":"Red blood cells specifically.","hi":"विशेष रूप से लाल रक्त कोशिकाएँ।"},{"en":"Bones and teeth like strontium-90.","hi":"स्ट्रॉन्शियम-90 की तरह अस्थियों और दाँतों।"},{"en":"The lens of the eye only.","hi":"केवल आँख लेंस।"}],"exp":{"en":"The thyroid gland. The thyroid actively concentrates iodine for hormone synthesis, so radioactive iodine is preferentially taken up there; the old RBC-specific association is incorrect.","hi":"थायरॉइड ग्रंथि। थायरॉइड हार्मोन संश्लेषण के लिए आयोडीन सक्रिय रूप से संकेंद्रित करता है, इसलिए रेडियोधर्मी आयोडीन प्राथमिकता से वहीं ग्रहण किया होता है; पुराना RBC-विशिष्ट संबंध गलत है।"}},{"q":{"en":"What are the primary sources of municipal-type solid waste?","hi":"नगरपालिका-प्रकार के ठोस अपशिष्ट के प्राथमिक स्रोत क्या हैं?"},"a":{"en":"Households, commercial premises, institutions, markets","hi":"घर, वाणिज्यिक परिसर, संस्थान और बाज़ार"},"o":[{"en":"Households, commercial premises, institutions, markets","hi":"घर, वाणिज्यिक परिसर, संस्थान और बाज़ार"},{"en":"CFCs and halons from refrigerators","hi":"रेफ्रिजरेटर से निकलने वाले CFCs और हैलोन"},{"en":"Vehicular exhaust gases only","hi":"केवल वाहनों से निकलने वाली गैसें"},{"en":"Spent nuclear reactor fuel rods","hi":"परमाणु रिएक्टर की प्रयुक्त ईंधन छड़ें"}],"exp":{"en":"Households, commercial and institutional premises, and markets generate municipal-type solid waste. Hazardous/industrial, biomedical, e-waste, battery, and radioactive wastes are regulated separately.","hi":"घर, वाणिज्यिक व संस्थागत परिसर और बाज़ार नगरपालिका-प्रकार का ठोस अपशिष्ट उत्पन्न करते हैं। खतरनाक/औद्योगिक, जैव-चिकित्सीय, ई-अपशिष्ट, बैटरी व रेडियोधर्मी अपशिष्ट अलग से विनियमित हैं।"}},{"q":{"en":"When did India's Solid Waste Management Rules, 2026 come into force?","hi":"भारत के ठोस अपशिष्ट प्रबंधन नियम, 2026 कब से प्रभावी हुए?"},"a":{"en":"1 April 2026","hi":"1 अप्रैल 2026"},"o":[{"en":"1 April 2026","hi":"1 अप्रैल 2026"},{"en":"1 April 2023","hi":"1 अप्रैल 2023"},{"en":"5 June 2016","hi":"5 जून 2016"},{"en":"1 January 2020","hi":"1 जनवरी 2020"}],"exp":{"en":"India's Solid Waste Management Rules, 2026 came into force on 1 April 2026 and explicitly exclude industrial, hazardous, biomedical, e-waste, battery, and radioactive waste because those streams have separate rules.","hi":"भारत के ठोस अपशिष्ट प्रबंधन नियम, 2026 1 अप्रैल 2026 से प्रभावी हुए और औद्योगिक, खतरनाक, जैव-चिकित्सीय, ई-अपशिष्ट, बैटरी व रेडियोधर्मी अपशिष्ट को अलग रखते हैं।"}},{"q":{"en":"What are appropriate methods in an integrated solid-waste-management system?","hi":"एकीकृत ठोस-अपशिष्ट-प्रबंधन प्रणाली में उपयुक्त विधियाँ कौन-सी हैं?"},"a":{"en":"Segregation, recycling, composting, controlled WtE, landfill","hi":"पृथक्करण, पुनर्चक्रण, कम्पोस्टिंग, नियंत्रित ऊर्जा-प्राप्ति, लैंडफिल"},"o":[{"en":"Segregation, recycling, composting, controlled WtE, landfill","hi":"पृथक्करण, पुनर्चक्रण, कम्पोस्टिंग, नियंत्रित ऊर्जा-प्राप्ति, लैंडफिल"},{"en":"Open dumping into rivers and lakes","hi":"नदियों और झीलों में खुला फेंकना"},{"en":"Uncontrolled open burning of all waste","hi":"सभी कचरे को खुले में जलाना"},{"en":"Mixing hazardous and household waste","hi":"खतरनाक और घरेलू कचरे को मिलाना"}],"exp":{"en":"Source segregation, reuse/recycling and material recovery; composting or biomethanation for suitable biodegradable waste; controlled thermal treatment or waste-to-energy for suitable combustible fractions; and sanitary landfilling of residual/reject waste. The waste hierarchy gives priority to prevention, reuse, recycling and recovery; sanitary landfill is mainly for residual material that cannot be usefully processed.","hi":"स्रोत पृथक्करण, पुन: उपयोग/पुनर्चक्रण और पदार्थ पुनर्प्राप्ति; उपयुक्त जैव-अवक्रमणीय अपशिष्ट के लिए कम्पोस्टिंग/जैव-मीथेनीकरण; उपयुक्त दहनशील अंशों के लिए नियंत्रित तापीय उपचार/अपशिष्ट-को-ऊर्जा; और अवशिष्ट/अस्वीकृत अपशिष्ट का स्वच्छ भूमि-भराव। अपशिष्ट प्रबंधन पदानुक्रम निवारण, पुन: उपयोग, पुनर्चक्रण और पुनर्प्राप्ति को प्राथमिकता देती है; स्वच्छ भूमि-भराव मुख्यतः उस अवशिष्ट पदार्थ के लिए है जिसे उपयोगी रूप से प्रक्रिया नहीं किया जा सकता।"}},{"q":{"en":"What is e-waste?","hi":"ई-अपशिष्ट (E-waste) क्या है?"},"a":{"en":"Discarded electrical and electronic equipment","hi":"त्यागे गए विद्युत और इलेक्ट्रॉनिक उपकरण"},"o":[{"en":"Discarded electrical and electronic equipment","hi":"त्यागे गए विद्युत और इलेक्ट्रॉनिक उपकरण"},{"en":"Fallen tree leaves and garden waste","hi":"पेड़ों की गिरी हुई पत्तियाँ और बगीचे का कचरा"},{"en":"Infectious hospital biomedical waste","hi":"अस्पताल का संक्रामक जैव-चिकित्सीय कचरा"},{"en":"Mining overburden rocks and soil","hi":"खनन से निकली चट्टानें और मिट्टी"}],"exp":{"en":"Discarded electrical and electronic equipment and their components; it is governed by the E-Waste (Management) Rules, 2022, effective from 1 April 2023, as amended. India's E-Waste (Management) Rules, 2022 replaced the 2016 rules and introduced the current framework, including extended producer responsibility, from 1 April 2023.","hi":"त्यक्त विद्युत/इलेक्ट्रॉनिक उपकरण और उनके घटक; इसे ई-अपशिष्ट (प्रबंधन) नियम, 2022 विनियमित करते हैं, जो 1 अप्रैल 2023 से प्रभावी हैं, यथा संशोधित। भारत के ई-अपशिष्ट (प्रबंधन) नियम, 2022 ने 2016 नियम प्रतिस्थापित किए और 1 अप्रैल 2023 से विस्तारित उत्पादक उत्तरदायित्व सहित वर्तमान ढाँचा लागू किया।"}},{"q":{"en":"Which Indian rules currently govern e-waste management?","hi":"वर्तमान में भारत में ई-अपशिष्ट प्रबंधन किस नियम द्वारा विनियमित होता है?"},"a":{"en":"E-Waste (Management) Rules, 2022 (eff. Apr 2023)","hi":"ई-अपशिष्ट (प्रबंधन) नियम, 2022 (अप्रैल 2023 से प्रभावी)"},"o":[{"en":"E-Waste (Management) Rules, 2022 (eff. Apr 2023)","hi":"ई-अपशिष्ट (प्रबंधन) नियम, 2022 (अप्रैल 2023 से प्रभावी)"},{"en":"Solid Waste Management Rules, 2026","hi":"ठोस अपशिष्ट प्रबंधन नियम, 2026"},{"en":"Noise Pollution Rules, 2000","hi":"ध्वनि प्रदूषण नियम, 2000"},{"en":"Air (Prevention and Control) Act, 1981","hi":"वायु (प्रदूषण निवारण) अधिनियम, 1981"}],"exp":{"en":"India's E-Waste (Management) Rules, 2022 replaced the 2016 rules and came into effect on 1 April 2023, introducing a strengthened Extended Producer Responsibility (EPR) framework.","hi":"भारत के ई-अपशिष्ट (प्रबंधन) नियम, 2022 ने 2016 के नियमों का स्थान लिया और 1 अप्रैल 2023 से प्रभावी हुए, जिसमें विस्तारित उत्पादक उत्तरदायित्व (EPR) ढाँचा लागू किया गया।"}},{"q":{"en":"What is waste incineration?","hi":"अपशिष्ट भस्मीकरण (Incineration) क्या है?"},"a":{"en":"Controlled high-temperature combustion of waste","hi":"अपशिष्ट का नियंत्रित उच्च-तापमान दहन"},"o":[{"en":"Controlled high-temperature combustion of waste","hi":"अपशिष्ट का नियंत्रित उच्च-तापमान दहन"},{"en":"Freezing of nuclear waste in chambers","hi":"कक्षों में परमाणु कचरे को जमाना"},{"en":"Composting using earthworms","hi":"केंचुओं द्वारा खाद बनाना"},{"en":"Measuring ambient air particulates","hi":"परिवेशीय वायु कणों को मापना"}],"exp":{"en":"Controlled high-temperature combustion of suitable waste in an engineered facility, usually to reduce volume and sometimes recover energy; effective emission-control systems are essential. Incineration is not simple open burning: it is an engineered thermal process that needs combustion control, air-pollution-control equipment and safe management of ash/residues.","hi":"अभियांत्रिक सुविधा में उपयुक्त अपशिष्ट का नियंत्रित उच्च-तापमान दहन, सामान्यतः खंड कम करने और कभी-कभी ऊर्जा पुनर्प्राप्त करने के लिए; प्रभावी उत्सर्जन-नियंत्रण प्रणालियाँ आवश्यक हैं। भस्मीकरण सरल खुला दहन नहीं है; यह अभियांत्रिक तापीय प्रक्रिया है जिसमें दहन नियंत्रण, वायु-प्रदूषण-नियंत्रण उपकरण और राख/अवशेष का सुरक्षित प्रबंधन जरूरी है।"}}]},{"title":{"en":"8. Common Confusions & Reverse Questions","hi":"8। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"Are ground-level Ozone (O3) and Acid Rain primary pollutants?","hi":"क्या भूतलीय ओजोन (O3) और अम्ल वर्षा प्राथमिक प्रदूषक हैं?"},"a":{"en":"No; both are secondary pollutants","hi":"नहीं; दोनों द्वितीयक प्रदूषक हैं"},"o":[{"en":"No; both are secondary pollutants","hi":"नहीं; दोनों द्वितीयक प्रदूषक हैं"},{"en":"Yes; both are emitted directly by factories","hi":"हाँ; दोनों कारखानों से सीधे निकलते हैं"},{"en":"Ozone is Primary; Acid Rain is Secondary","hi":"ओजोन प्राथमिक है; अम्ल वर्षा द्वितीयक है"},{"en":"Acid Rain is Primary; Ozone is Secondary","hi":"अम्ल वर्षा प्राथमिक है; ओजोन द्वितीयक है"}],"exp":{"en":"No. Ground-level ozone and the sulfuric/nitric acids associated with acid rain are secondary pollutants formed in the atmosphere from precursor emissions. Ozone is produced photochemically from precursor gases, while sulfuric and nitric acids form from oxidation of sulfur and nitrogen oxides.","hi":"नहीं। भूतलीय ओजोन और अम्ल वर्षा से संबद्ध सल्फ्यूरिक/नाइट्रिक अम्ल द्वितीयक प्रदूषक हैं, जो वायुमंडल में पूर्वगामी उत्सर्जन से रूप होते हैं। ओजोन पूर्वगामी गैसें से प्रकाश-रासायनिक रूप से उत्पन्न होता है, जबकि सल्फ्यूरिक और नाइट्रिक अम्ल सल्फर/नाइट्रोजन ऑक्साइड के ऑक्सीकरण से रूप होते हैं।"}},{"q":{"en":"Is the Silence Zone noise limit higher than the Residential area limit?","hi":"क्या शांत क्षेत्र (Silence Zone) की ध्वनि सीमा आवासीय क्षेत्र से अधिक होती है?"},"a":{"en":"No; Silence Zone (50/40) is stricter than Residential (55/45)","hi":"नहीं; शांत क्षेत्र (50/40) आवासीय (55/45) से कम है"},"o":[{"en":"No; Silence Zone (50/40) is stricter than Residential (55/45)","hi":"नहीं; शांत क्षेत्र (50/40) आवासीय (55/45) से कम है"},{"en":"Yes; Silence Zones allow up to 65 dB","hi":"हाँ; शांत क्षेत्र में 65 dB की अनुमति है"},{"en":"Both have identical noise limits","hi":"दोनों की ध्वनि सीमाएँ बिल्कुल समान हैं"},{"en":"Silence Zones have a 0 dB limit","hi":"शांत क्षेत्र की सीमा 0 dB है"}],"exp":{"en":"No. Under India's Noise Rules, a Silence Zone is 50/40 dB(A) Leq by day/night, lower than the Residential limit of 55/45 dB(A) Leq. Silence-zone limits are the strictest of the four standard area categories under the Noise Rules.","hi":"नहीं। भारत के ध्वनि नियम में शांत क्षेत्र 50/40 dB(A) Leq (दिन/रात) है, जो आवासीय सीमा 55/45 dB(A) Leq से कम है। ध्वनि नियम के चार मानक क्षेत्रफल श्रेणियाँ में शांत-क्षेत्र सीमाएँ सबसे कड़ा हैं।"}},{"q":{"en":"Are Ganga Action Plan and Namami Gange the same scheme?","hi":"क्या गंगा एक्शन प्लान और नमामि गंगे एक ही योजना हैं?"},"a":{"en":"No; GAP began in 1985, Namami Gange in 2014","hi":"नहीं; GAP 1985 में और नमामि गंगे 2014 में शुरू हुई"},"o":[{"en":"No; GAP began in 1985, Namami Gange in 2014","hi":"नहीं; GAP 1985 में और नमामि गंगे 2014 में शुरू हुई"},{"en":"Yes; two names for the same 1985 scheme","hi":"हाँ; 1985 की एक ही योजना के दो नाम हैं"},{"en":"GAP is current; Namami Gange was in 1980s","hi":"GAP वर्तमान है; नमामि गंगे 1980 के दशक की थी"},{"en":"One cleans rivers; the other builds dams","hi":"एक नदी सफाई हेतु और दूसरा बाँध निर्माण हेतु है"}],"exp":{"en":"No. Ganga Action Plan began in 1985; Namami Gange began in 2014 as a broader programme under NMCG, and Ganga-rejuvenation activities continued under NMCG in 2026. Ganga Action Plan is historically important, but Namami Gange/NMCG represents the broader modern rejuvenation framework.","hi":"नहीं। गंगा कार्रवाई योजना 1985 में शुरू हुआ; नमामि गंगे 2014 में NMCG के अंतर्गत व्यापक कार्यक्रम के रूप में शुरू हुआ, और 2026 में NMCG के अंतर्गत गंगा-पुनर्जीवन गतिविधियाँ जारी रहीं। गंगा कार्रवाई योजना ऐतिहासिक रूप से महत्वपूर्ण है, लेकिन नमामि गंगे/NMCG व्यापक आधुनिक पुनर्जीवन ढाँचा प्रतिनिधित्व करता है।"}},{"q":{"en":"Which radionuclides target bone and the thyroid gland respectively?","hi":"कौन-से रेडियोन्यूक्लाइड क्रमशः अस्थि और थायरॉइड ग्रंथि को प्रभावित करते हैं?"},"a":{"en":"Strontium-90: bone; Iodine-131: thyroid","hi":"स्ट्रॉन्शियम-90: अस्थि; आयोडीन-131: थायरॉइड"},"o":[{"en":"Strontium-90: bone; Iodine-131: thyroid","hi":"स्ट्रॉन्शियम-90: अस्थि; आयोडीन-131: थायरॉइड"},{"en":"Iodine-131: bone; Strontium-90: thyroid","hi":"आयोडीन-131: अस्थि; स्ट्रॉन्शियम-90: थायरॉइड"},{"en":"Both target red blood cells only","hi":"दोनों केवल लाल रक्त कोशिकाओं को प्रभावित करते हैं"},{"en":"Neither radionuclide enters body tissues","hi":"कोई भी शरीर के ऊतकों में प्रवेश नहीं करता"}],"exp":{"en":"Strontium-90 accumulates in bone; Iodine-131 is taken up by the thyroid. Sr-90 and I-131 behave differently in the body because they mimic different stable elements: strontium follows calcium, iodine follows normal iodine metabolism.","hi":"स्ट्रॉन्शियम-90 अस्थि में संचित होता है; आयोडीन-131 थायरॉइड द्वारा ग्रहण किया होता है। Sr-90 और I-131 निकाय में अलग प्रकार से व्यवहार करते हैं क्योंकि वे अलग स्थिर तत्त्व अनुकरण करते हैं: स्ट्रॉन्शियम कैल्शियम को अनुसरण करता है, आयोडीन सामान्य आयोडीन उपापचय को।"}},{"q":{"en":"Which pollutants cause Minamata Disease and Itai-Itai Disease respectively?","hi":"मिनामाता रोग और इटाई-इटाई रोग क्रमशः किन प्रदूषकों से होते हैं?"},"a":{"en":"Minamata: methylmercury; Itai-Itai: cadmium","hi":"मिनामाता: मिथाइल मरकरी; इटाई-इटाई: कैडमियम"},"o":[{"en":"Minamata: methylmercury; Itai-Itai: cadmium","hi":"मिनामाता: मिथाइल मरकरी; इटाई-इटाई: कैडमियम"},{"en":"Minamata: cadmium; Itai-Itai: mercury","hi":"मिनामाता: कैडमियम; इटाई-इटाई: पारा"},{"en":"Minamata: arsenic; Itai-Itai: nitrates","hi":"मिनामाता: आर्सेनिक; इटाई-इटाई: नाइट्रेट"},{"en":"Minamata: nitrates; Itai-Itai: arsenic","hi":"मिनामाता: नाइट्रेट; इटाई-इटाई: आर्सेनिक"}],"exp":{"en":"Minamata disease is caused by methylmercury exposure; Itai-Itai disease by chronic cadmium exposure. Both are classic metal-poisoning episodes, but they involve different contaminants and organ-system effects.","hi":"मिनामाता रोग मिथाइल मरकरी संपर्क से और इटाई-इटाई रोग दीर्घकालिक कैडमियम संपर्क से होती है। दोनों प्रमुख धातु-विषाक्तता घटनाएँ हैं, लेकिन अलग संदूषक और अंग-प्रणाली प्रभाव शामिल करते हैं।"}}]}],"7. Sustainable Development / सतत विकास":[{"title":{"en":"1. Overview / Chapter Snapshot","hi":"1। अवलोकन / अध्याय स्नैपशॉट"},"questions":[{"q":{"en":"Which major topics are covered under Sustainable Development?","hi":"सतत विकास विषय के अंतर्गत किन प्रमुख विषयों का अध्ययन किया जाता है?"},"a":{"en":"Definition, 3 dimensions, and 17 SDGs (2030 Agenda)","hi":"परिभाषा, 3 आयाम और 17 SDGs (2030 एजेंडा)"},"o":[{"en":"Definition, 3 dimensions, and 17 SDGs (2030 Agenda)","hi":"परिभाषा, 3 आयाम और 17 SDGs (2030 एजेंडा)"},{"en":"Only Kyoto Protocol and Carbon Trading","hi":"केवल क्योटो प्रोटोकॉल और कार्बन ट्रेडिंग"},{"en":"History of India's wildlife protection laws","hi":"भारत के वन्यजीव संरक्षण कानूनों का इतिहास"},{"en":"Biological processes of ozone depletion","hi":"ओजोन रिक्तीकरण की जैविक प्रक्रियाएँ"}],"exp":{"en":"Sustainable development is broader than simply using fewer resources. It integrates present human needs, intergenerational equity and the economic, social and environmental dimensions of development.","hi":"सतत विकास केवल कम संसाधनों का उपयोग करने की अवधारणा नहीं है। यह वर्तमान मानवीय आवश्यकताएँ, अंतरपीढ़ीगत समानता और आर्थिक, सामाजिक तथा पर्यावरणीय आयामों को एकीकृत करता है।"}},{"q":{"en":"How many total Sustainable Development Goals (SDGs) are there?","hi":"कुल कितने सतत विकास लक्ष्य (SDGs) हैं?"},"a":{"en":"17 SDGs.","hi":"17 एसडीजी (SDGs)।"},"o":[{"en":"17 SDGs.","hi":"17 एसडीजी (SDGs)।"},{"en":"15 SDGs.","hi":"15 एसडीजी।"},{"en":"21 SDGs.","hi":"21 एसडीजी।"},{"en":"8 SDGs.","hi":"8 एसडीजी।"}],"exp":{"en":"The 2030 Agenda contains 17 Sustainable Development Goals and 169 associated targets. The Goals are universal and apply to all countries.","hi":"2030 एजेंडा में 17 सतत विकास लक्ष्य और 169 संबद्ध लक्ष्य हैं। ये लक्ष्य सार्वभौमिक हैं और सभी देशों पर लागू होते हैं।"}},{"q":{"en":"When were the 2030 Agenda and its 17 SDGs formally adopted by the UN General Assembly?","hi":"2030 एजेंडा और उसके 17 SDGs को संयुक्त राष्ट्र महासभा ने औपचारिक रूप से कब अपनाया?"},"a":{"en":"25 September 2015.","hi":"25 सितंबर 2015।"},"o":[{"en":"25 September 2015.","hi":"25 सितंबर 2015।"},{"en":"1 January 2016.","hi":"1 जनवरी 2016।"},{"en":"8 September 2000.","hi":"8 सितंबर 2000।"},{"en":"14 June 1992.","hi":"14 जून 1992।"}],"exp":{"en":"The 2030 Agenda, with the 17 SDGs at its core, was formally adopted by the UN General Assembly on 25 September 2015.","hi":"2030 एजेंडा, जिसके मूल में 17 SDGs हैं, संयुक्त राष्ट्र महासभा द्वारा 25 सितंबर 2015 को औपचारिक रूप से अपनाया गया।"}},{"q":{"en":"From when did the SDGs officially come into effect?","hi":"SDGs आधिकारिक रूप से कब से प्रभावी हुए?"},"a":{"en":"1 January 2016","hi":"1 जनवरी 2016"},"o":[{"en":"1 January 2016","hi":"1 जनवरी 2016"},{"en":"1 January 2015","hi":"1 जनवरी 2015"},{"en":"2 October 2015","hi":"2 अक्टूबर 2015"},{"en":"5 June 2016","hi":"5 जून 2016"}],"exp":{"en":"The Goals officially came into effect on 1 January 2016 and were designed to guide global action through 2030.","hi":"लक्ष्य आधिकारिक रूप से 1 जनवरी 2016 से प्रभावी हुए और 2030 तक वैश्विक कार्रवाई मार्गदर्शन के लिए बनाए गए हैं।"}},{"q":{"en":"What is the overall target horizon of the 2030 Agenda and the SDGs?","hi":"2030 एजेंडा और SDGs का समग्र लक्ष्य-अवधि क्या है?"},"a":{"en":"2030.","hi":"2030।"},"o":[{"en":"2030.","hi":"2030।"},{"en":"2050.","hi":"2050।"},{"en":"2025.","hi":"2025।"},{"en":"2100.","hi":"2100।"}],"exp":{"en":"2030 is the overall horizon of the Agenda. Some individual SDG targets have or had earlier milestone dates, so not every single target necessarily has the same deadline.","hi":"2030 एजेंडा का समग्र लक्ष्य-अवधि है। कुछ व्यक्तिगत SDG लक्ष्यों की मध्यवर्ती तिथियाँ पहले भी हैं/थीं, इसलिए हर लक्ष्य की समय-सीमा ठीक समान नहीं होती।"}},{"q":{"en":"What was the time gap between formal adoption of the 2030 Agenda and SDGs taking effect?","hi":"2030 एजेंडा के अंगीकरण और SDGs के प्रभावी होने के बीच कितना अंतराल था?"},"a":{"en":"98 days","hi":"98 दिन"},"o":[{"en":"98 days","hi":"98 दिन"},{"en":"365 days","hi":"365 दिन"},{"en":"180 days","hi":"180 दिन"},{"en":"0 days","hi":"0 दिन"}],"exp":{"en":"From 25 September 2015 to 1 January 2016 there are 98 days, so describing the adoption-to-effect gap as a full year is inaccurate.","hi":"25 सितंबर 2015 से 1 जनवरी 2016 तक 98 दिन होते हैं, इसलिए अंगीकरण से प्रभावी होने तक का अंतराल को पूरा एक वर्ष कहना असटीक है।"}}]},{"title":{"en":"2. Sustainable Development — Introduction","hi":"2। सतत विकास - परिचय"},"questions":[{"q":{"en":"What is the widely used Brundtland definition of sustainable development?","hi":"सतत विकास की व्यापक रूप से प्रयुक्त ब्रुंटलैंड परिभाषा क्या है?"},"a":{"en":"Meet present needs without harming future generations","hi":"भावी पीढ़ियों की क्षमता को प्रभावित किए बिना वर्तमान जरूरतें पूरी करना"},"o":[{"en":"Meet present needs without harming future generations","hi":"भावी पीढ़ियों की क्षमता को प्रभावित किए बिना वर्तमान जरूरतें पूरी करना"},{"en":"Minimal use of resources regardless of human needs","hi":"मानवीय जरूरतों की परवाह किए बिना न्यूनतम संसाधन उपयोग"},{"en":"Maximum resource extraction for rapid GDP growth","hi":"तीव्र GDP वृद्धि हेतु संसाधनों का अधिकतम दोहन"},{"en":"Stopping all industrial and technological growth","hi":"सभी औद्योगिक और प्रौद्योगिकीय विकास रोकना"}],"exp":{"en":"This formulation was popularised by the 1987 report Our Common Future of the World Commission on Environment and Development. It balances present needs with the capacity of future generations to meet theirs.","hi":"यह परिभाषा विश्व पर्यावरण एवं विकास आयोग की 1987 प्रतिवेदन हमारा साझा भविष्य से व्यापक रूप से लोकप्रिय हुई। इसमें वर्तमान आवश्यकताओं और भावी पीढ़ियों की आवश्यकताएँ पूरी करने की क्षमता के बीच संतुलन है।"}},{"q":{"en":"What are the three core dimensions of sustainable development?","hi":"सतत विकास के तीन मूल आयाम कौन-से हैं?"},"a":{"en":"Economic, social inclusion, and environmental protection","hi":"आर्थिक, सामाजिक समावेशन और पर्यावरण संरक्षण"},"o":[{"en":"Economic, social inclusion, and environmental protection","hi":"आर्थिक, सामाजिक समावेशन और पर्यावरण संरक्षण"},{"en":"Forest conservation, wildlife, and ocean protection","hi":"वन संरक्षण, वन्यजीव और महासागर संरक्षण"},{"en":"GDP growth, exports, and financial markets","hi":"GDP वृद्धि, निर्यात और वित्तीय बाज़ार"},{"en":"Poverty reduction, nutrition, and public health","hi":"गरीबी उन्मूलन, पोषण और जनस्वास्थ्य"}],"exp":{"en":"The three dimensions are interdependent. Development is not sustainable if economic gains come with deep social exclusion or severe environmental degradation.","hi":"तीन आयाम परस्पर निर्भर हैं। यदि आर्थिक लाभ के साथ गहरे सामाजिक बहिष्करण या गंभीर पर्यावरणीय क्षरण हो, तो विकास सतत नहीं माना जाता।"}},{"q":{"en":"Is Sustainable Development limited only to environmental protection?","hi":"क्या सतत विकास केवल पर्यावरण संरक्षण तक सीमित है?"},"a":{"en":"No; it integrates economic, social & environmental pillars","hi":"नहीं; यह आर्थिक, सामाजिक व पर्यावरणीय स्तंभों को जोड़ता है"},"o":[{"en":"No; it integrates economic, social & environmental pillars","hi":"नहीं; यह आर्थिक, सामाजिक व पर्यावरणीय स्तंभों को जोड़ता है"},{"en":"Yes; it is purely an environmental concept","hi":"हाँ; यह पूरी तरह से एक पर्यावरणीय अवधारणा है"},{"en":"Yes; its sole focus is planting more trees","hi":"हाँ; इसका एकमात्र फोकस अधिक पेड़ लगाना है"},{"en":"No; it is solely about GDP growth","hi":"नहीं; यह केवल आर्थिक GDP वृद्धि के बारे में है"}],"exp":{"en":"Environmental protection is one pillar, but sustainable development also requires economic opportunity, social inclusion and long-term resilience.","hi":"पर्यावरण संरक्षण एक स्तंभ है, लेकिन सतत विकास के लिए आर्थिक अवसर, सामाजिक समावेशन और दीर्घकालिक लचीलापन भी जरूरी हैं।"}}]},{"title":{"en":"4. SDG Q&A","hi":"4। SDG प्रश्नोत्तर"},"questions":[{"q":{"en":"What is SDG 1?","hi":"SDG 1 क्या है?"},"a":{"en":"No Poverty.","hi":"गरीबी समाप्त करना (गरीबी उन्मूलन)।"},"o":[{"en":"No Poverty.","hi":"गरीबी समाप्त करना (गरीबी उन्मूलन)।"},{"en":"Zero Hunger.","hi":"शून्य भुखमरी।"},{"en":"Quality Education.","hi":"गुणवत्तापूर्ण शिक्षा।"},{"en":"Climate Action.","hi":"जलवायु कार्रवाई।"}],"exp":{"en":"No Poverty. It aims to end poverty in all its forms everywhere.","hi":"गरीबी समाप्त करना (गरीबी उन्मूलन)। यह हर रूप की गरीबी को हर जगह समाप्त करने पर केंद्रित है।"}},{"q":{"en":"What is SDG 2?","hi":"SDG 2 क्या है?"},"a":{"en":"Zero Hunger.","hi":"भुखमरी समाप्त करना (भुखमरी उन्मूलन)।"},"o":[{"en":"Zero Hunger.","hi":"भुखमरी समाप्त करना (भुखमरी उन्मूलन)।"},{"en":"Good Health and Well-Being.","hi":"अच्छा स्वास्थ्य और कल्याण।"},{"en":"No Poverty.","hi":"शून्य गरीबी।"},{"en":"Life Below Water.","hi":"जल के नीचे जीवन।"}],"exp":{"en":"Zero Hunger. It covers ending hunger, food security, improved nutrition and sustainable agriculture.","hi":"भुखमरी समाप्त करना (भुखमरी उन्मूलन)। यह भुखमरी समाप्त करने, खाद्य सुरक्षा, बेहतर पोषण और सतत कृषि पर केंद्रित है।"}},{"q":{"en":"What is SDG 3?","hi":"SDG 3 क्या है?"},"a":{"en":"Good Health and Well-Being.","hi":"अच्छा स्वास्थ्य एवं कल्याण।"},"o":[{"en":"Good Health and Well-Being.","hi":"अच्छा स्वास्थ्य एवं कल्याण।"},{"en":"Gender Equality.","hi":"लैंगिक समानता।"},{"en":"Quality Education.","hi":"गुणवत्तापूर्ण शिक्षा।"},{"en":"Clean Water and Sanitation.","hi":"स्वच्छ जल एवं स्वच्छता।"}],"exp":{"en":"Good Health and Well-Being. It seeks healthy lives and well-being for people of all ages.","hi":"अच्छा स्वास्थ्य एवं कल्याण। यह सभी आयु-वर्गों के लोगों के स्वस्थ जीवन और कल्याण पर केंद्रित है।"}},{"q":{"en":"What is SDG 4?","hi":"SDG 4 क्या है?"},"a":{"en":"Quality Education.","hi":"गुणवत्तापूर्ण शिक्षा।"},"o":[{"en":"Quality Education.","hi":"गुणवत्तापूर्ण शिक्षा।"},{"en":"Decent Work and Economic Growth.","hi":"सम्मानजनक कार्य और आर्थिक वृद्धि।"},{"en":"Good Health and Well-Being.","hi":"अच्छा स्वास्थ्य और कल्याण।"},{"en":"Reduced Inequalities.","hi":"असमानताओं में कमी।"}],"exp":{"en":"Quality Education. It focuses on inclusive and equitable quality education and lifelong learning opportunities.","hi":"गुणवत्तापूर्ण शिक्षा। यह समावेशी/न्यायसंगत गुणवत्तापूर्ण शिक्षा और आजीवन सीखने के अवसर पर केंद्रित है।"}},{"q":{"en":"What is SDG 5?","hi":"SDG 5 क्या है?"},"a":{"en":"Gender Equality.","hi":"लैंगिक समानता।"},"o":[{"en":"Gender Equality.","hi":"लैंगिक समानता।"},{"en":"Reduced Inequalities.","hi":"असमानताओं में कमी।"},{"en":"Quality Education.","hi":"गुणवत्तापूर्ण शिक्षा।"},{"en":"Peace, Justice and Strong Institutions.","hi":"शांति, न्याय और मजबूत संस्थाएँ।"}],"exp":{"en":"Gender Equality. It aims at gender equality and the empowerment of all women and girls.","hi":"लैंगिक समानता। यह लैंगिक समानता और महिलाओं/बालिकाओं के सशक्तीकरण पर केंद्रित है।"}},{"q":{"en":"What is SDG 6?","hi":"SDG 6 क्या है?"},"a":{"en":"Clean Water and Sanitation.","hi":"स्वच्छ जल और स्वच्छता (स्वच्छ जल एवं स्वच्छता)।"},"o":[{"en":"Clean Water and Sanitation.","hi":"स्वच्छ जल और स्वच्छता (स्वच्छ जल एवं स्वच्छता)।"},{"en":"Life Below Water.","hi":"जल के नीचे जीवन।"},{"en":"Affordable and Clean Energy.","hi":"सस्ती और स्वच्छ ऊर्जा।"},{"en":"Climate Action.","hi":"जलवायु कार्रवाई।"}],"exp":{"en":"Clean Water and Sanitation. It covers availability and sustainable management of water and sanitation for all.","hi":"स्वच्छ जल और स्वच्छता (स्वच्छ जल एवं स्वच्छता)। यह सभी के लिए जल और स्वच्छता की उपलब्धता तथा सतत प्रबंधन पर केंद्रित है।"}},{"q":{"en":"What is SDG 7?","hi":"SDG 7 क्या है?"},"a":{"en":"Affordable and Clean Energy.","hi":"सस
