ial forest acts, revenue settlements, zamindari & land tax","hi":"औपनिवेशिक वन अधिनियम, राजस्व बंदोबस्त, जमींदारी व भू-कर"},{"en":"Mammal anatomy, skeletal structure, circulation, digestion & nerves","hi":"स्तनधारी शरीर रचना, कंकाल तंत्र, परिसंचरण, पाचन व तंत्रिका"}],"exp":{"en":"This chapter covers biodiversity at genetic, species and ecosystem levels, alpha/beta/gamma diversity, global hotspots, in-situ and ex-situ conservation, IUCN Red List categories, and Ramsar wetlands including India's 101 sites (as of August 2026).","hi":"इस अध्याय में आनुवंशिक, प्रजातीय व पारितंत्र स्तर पर जैव विविधता, अल्फा/बीटा/गामा विविधता, वैश्विक हॉटस्पॉट, स्व-स्थाने व बाह्य-स्थाने संरक्षण, IUCN लाल सूची श्रेणियाँ और भारत के 101 रामसर स्थल (अगस्त 2026 तक) शामिल हैं।"}},{"q":{"en":"What are the three commonly recognised levels of biodiversity?","hi":"जैव विविधता के तीन सामान्यतः मान्यता प्राप्त स्तर कौन-से हैं?"},"a":{"en":"Genetic diversity, species diversity and ecosystem diversity.","hi":"आनुवंशिक विविधता, प्रजातीय विविधता और पारितंत्र विविधता।"},"o":[{"en":"Genetic diversity, species diversity and ecosystem diversity.","hi":"आनुवंशिक विविधता, प्रजातीय विविधता और पारितंत्र विविधता।"},{"en":"Alpha diversity, beta diversity and gamma diversity.","hi":"अल्फा विविधता, बीटा विविधता और गामा विविधता।"},{"en":"Floral diversity, faunal diversity and microbial diversity.","hi":"पुष्पीय विविधता, जीव-जंतु संबंधी विविधता और सूक्ष्मजीवी विविधता।"},{"en":"Terrestrial diversity, freshwater diversity and marine diversity.","hi":"स्थलीय विविधता, मीठे जल की विविधता और समुद्री विविधता।"}],"exp":{"en":"Genetic diversity, species diversity and ecosystem diversity. Genetic diversity concerns variation within species, species diversity concerns the variety and abundance of species, and ecosystem diversity concerns the variety of habitats and ecological systems.","hi":"आनुवंशिक विविधता, प्रजातीय विविधता और पारितंत्र विविधता। आनुवंशिक विविधता प्रजाति के भीतर परिवर्तन, प्रजातीय विविधता प्रजाति की विविधता/प्रचुरता और पारितंत्र विविधता आवासों/पारिस्थितिक प्रणालियाँ की विविधता को वर्णन करती है।"}},{"q":{"en":"How many Biodiversity Hotspots does India have?","hi":"भारत में कितने जैव विविधता हॉटस्पॉट (जैव विविधता हॉटस्पॉट) हैं?"},"a":{"en":"4 hotspots.","hi":"4 हॉटस्पॉट।"},"o":[{"en":"4 hotspots.","hi":"4 हॉटस्पॉट।"},{"en":"2 hotspots.","hi":"2 हॉटस्पॉट।"},{"en":"6 hotspots.","hi":"6 हॉटस्पॉट।"},{"en":"8 hotspots.","hi":"8 हॉटस्पॉट।"}],"exp":{"en":"4 hotspots. India overlaps four globally recognised biodiversity hotspots: Himalaya, Indo-Burma, Western Ghats–Sri Lanka and Sundaland through the Nicobar Islands.","hi":"4 हॉटस्पॉट। भारत चार वैश्विक रूप से मान्यता प्राप्त जैव विविधता हॉटस्पॉट के अंतर्गत आता है: हिमालय, इंडो-बर्मा, पश्चिमी घाट-श्रीलंका और निकोबार द्वीप के माध्यम से सुंडालैंड।"}},{"q":{"en":"How many Ramsar Sites does India have as of August 2026?","hi":"अगस्त 2026 तक भारत में कितने रामसर स्थल हैं?"},"a":{"en":"101 Ramsar Sites","hi":"101 रामसर स्थल"},"o":[{"en":"101 Ramsar Sites","hi":"101 रामसर स्थल"},{"en":"91 Ramsar Sites","hi":"91 रामसर स्थल"},{"en":"100 Ramsar Sites","hi":"100 रामसर स्थल"},{"en":"99 Ramsar Sites","hi":"99 रामसर स्थल"}],"exp":{"en":"India has 101 Ramsar Sites as of August 2026. The count rose from 91 in June 2025 to 100 with Jai Prakash Narayan Bird Sanctuary (Surha Tal, UP) in June 2026, and to 101 when Glaw Lake (Arunachal Pradesh) was designated in August 2026.","hi":"अगस्त 2026 तक भारत में 101 रामसर स्थल हैं। जून 2025 में 91 से बढ़कर जून 2026 में जय प्रकाश नारायण पक्षी अभयारण्य (सुरहा ताल, यूपी) के साथ 100 और अगस्त 2026 में ग्लॉ झील (अरुणाचल प्रदेश) के साथ 101 हुए।"}},{"q":{"en":"When was IUCN established?","hi":"IUCN की स्थापना कब हुई?"},"a":{"en":"In 1948.","hi":"1948 में।"},"o":[{"en":"In 1948.","hi":"1948 में।"},{"en":"In 1971.","hi":"1971 में।"},{"en":"In 1988.","hi":"1988 में।"},{"en":"In 1950.","hi":"1950 में।"}],"exp":{"en":"In 1948. IUCN was formally established on 5 October 1948 at Fontainebleau, France, as an international union bringing governments and civil society together for nature conservation.","hi":"1948 में। IUCN 5 अक्टूबर 1948 को फॉन्टेनब्लो, फ्रांस में औपचारिक रूप से स्थापित हुआ, सरकारों और नागरिक समाज को प्रकृति संरक्षण के लिए साथ लाने वाली अंतरराष्ट्रीय संघ के रूप में।"}},{"q":{"en":"How does species richness generally change from the equator toward the poles?","hi":"भूमध्य रेखा से ध्रुवों की ओर जाने पर प्रजाति समृद्धि सामान्यतः कैसे बदलती है?"},"a":{"en":"Decreases from equator toward poles","hi":"भूमध्य रेखा से ध्रुवों की ओर घटती है"},"o":[{"en":"Decreases from equator toward poles","hi":"भूमध्य रेखा से ध्रुवों की ओर घटती है"},{"en":"Increases steadily toward the poles","hi":"ध्रुवों की ओर लगातार बढ़ती है"},{"en":"Remains uniform across all latitudes","hi":"सभी अक्षांशों पर एकसमान रहती है"},{"en":"Peaks only in temperate deserts","hi":"केवल समशीतोष्ण मरुस्थलों में सर्वाधिक होती है"}],"exp":{"en":"Species richness generally decreases from the equator toward the poles (the latitudinal diversity gradient). Tropical regions—especially tropical rainforests on land and coral reefs in the sea—are exceptionally species-rich.","hi":"प्रजाति समृद्धि सामान्यतः भूमध्य रेखा से ध्रुवों की ओर घटती है (अक्षांशीय विविधता प्रवणता)। उष्णकटिबंधीय क्षेत्र—विशेषकर वर्षावन और प्रवाल भित्तियाँ—अत्यधिक प्रजाति-समृद्ध होते हैं।"}}]},{"title":{"en":"2. Levels of Biodiversity","hi":"2। जैव विविधता के स्तर"},"questions":[{"q":{"en":"What is Genetic Diversity?","hi":"आनुवंशिक विविधता (Genetic Diversity) क्या है?"},"a":{"en":"Variation in genes within a species","hi":"एक प्रजाति के भीतर जीनों में विविधता"},"o":[{"en":"Variation in genes within a species","hi":"एक प्रजाति के भीतर जीनों में विविधता"},{"en":"Variety of different species in an area","hi":"किसी क्षेत्र में विभिन्न प्रजातियों की विविधता"},{"en":"Variety of ecosystems and habitats","hi":"पारितंत्रों और आवासों की विविधता"},{"en":"Species turnover between two communities","hi":"दो समुदायों के बीच प्रजाति परिवर्तन-दर"}],"exp":{"en":"Genetic diversity refers to variation in genes, alleles, and genetic traits within a single species and among its populations (e.g., different crop varieties or livestock breeds).","hi":"आनुवंशिक विविधता एक ही प्रजाति के भीतर और उसकी आबादी के बीच जीनों, युग्मविकल्पी (alleles) और आनुवंशिक गुणों में विविधता को दर्शाती है (जैसे फसलों की विभिन्न किस्में)।"}},{"q":{"en":"What is Species Diversity?","hi":"प्रजातीय विविधता (Species Diversity) क्या है?"},"a":{"en":"Variety and abundance of species in an area","hi":"किसी क्षेत्र में प्रजातियों की विविधता व प्रचुरता"},"o":[{"en":"Variety and abundance of species in an area","hi":"किसी क्षेत्र में प्रजातियों की विविधता व प्रचुरता"},{"en":"Genetic variation within a single species","hi":"एक ही प्रजाति के भीतर आनुवंशिक विविधता"},{"en":"Total number of habitat types on Earth","hi":"पृथ्वी पर आवास प्रकारों की कुल संख्या"},{"en":"Seasonal migration rate between regions","hi":"क्षेत्रों के बीच मौसमी प्रवासन दर"}],"exp":{"en":"Species diversity describes the variety of species in an area, measured through species richness (number of species) and species evenness (relative abundance).","hi":"प्रजातीय विविधता किसी क्षेत्र में प्रजातियों की विविधता को दर्शाती है, जिसे प्रजाति समृद्धि (प्रजातियों की संख्या) और सम-वितरण (सापेक्ष प्रचुरता) से मापा जाता है।"}},{"q":{"en":"What is Ecosystem Diversity?","hi":"पारितंत्र विविधता (Ecosystem Diversity) क्या है?"},"a":{"en":"Variety of habitats, communities & ecological processes","hi":"आवासों, समुदायों व पारिस्थितिक प्रक्रियाओं की विविधता"},"o":[{"en":"Variety of habitats, communities & ecological processes","hi":"आवासों, समुदायों व पारिस्थितिक प्रक्रियाओं की विविधता"},{"en":"Genetic variation within one population","hi":"एक आबादी के भीतर आनुवंशिक विविधता"},{"en":"Number of animal species in one forest","hi":"एक वन में जंतु प्रजातियों की संख्या"},{"en":"Local species count in one sample plot","hi":"एक नमूना क्षेत्र में स्थानीय प्रजाति संख्या"}],"exp":{"en":"Ecosystem diversity is the variety of ecosystems, habitats, biological communities, and ecological processes in a region. Unlike genetic/species/ecosystem levels, Whittaker's alpha, beta, and gamma diversity measure species diversity across spatial scales.","hi":"पारितंत्र विविधता किसी क्षेत्र में पारितंत्रों, आवासों, जैविक समुदायों और पारिस्थितिक प्रक्रियाओं की विविधता है। इसके विपरीत, व्हिटेकर की अल्फा, बीटा व गामा विविधता स्थानिक पैमानों पर प्रजाति विविधता मापती हैं।"}},{"q":{"en":"Where is the highest biodiversity found on Earth?","hi":"पृथ्वी पर सर्वाधिक जैव विविधता कहाँ पाई जाती है?"},"a":{"en":"Tropical rainforests and coral reefs","hi":"उष्णकटिबंधीय वर्षावन और प्रवाल भित्तियाँ"},"o":[{"en":"Tropical rainforests and coral reefs","hi":"उष्णकटिबंधीय वर्षावन और प्रवाल भित्तियाँ"},{"en":"Tundra, taiga, and polar ice caps","hi":"टुंड्रा, टैगा और ध्रुवीय हिम-टोपियाँ"},{"en":"Temperate grasslands and arid deserts","hi":"समशीतोष्ण घासभूमि और शुष्क मरुस्थल"},{"en":"Urban areas and monoculture farmlands","hi":"नगरीय क्षेत्र और एकल-फसल खेत"}],"exp":{"en":"Biodiversity is highest in the tropics: tropical rainforests are the richest terrestrial ecosystems, and coral reefs are the richest marine ecosystems ('rainforests of the sea').","hi":"जैव विविधता उष्णकटिबंधीय क्षेत्रों में सर्वाधिक होती है: भूमि पर उष्णकटिबंधीय वर्षावन और समुद्र में प्रवाल भित्तियाँ ('समुद्र के वर्षावन') सर्वाधिक प्रजाति-समृद्ध हैं।"}},{"q":{"en":"Which is the world's largest coral reef system?","hi":"विश्व की सबसे बड़ी प्रवाल भित्ति प्रणाली कौन-सी है?"},"a":{"en":"Great Barrier Reef, Australia","hi":"ग्रेट बैरियर रीफ, ऑस्ट्रेलिया"},"o":[{"en":"Great Barrier Reef, Australia","hi":"ग्रेट बैरियर रीफ, ऑस्ट्रेलिया"},{"en":"Belize Barrier Reef, Caribbean","hi":"बेलीज़ बैरियर रीफ, कैरेबियाई क्षेत्र"},{"en":"Florida Reef, North America","hi":"फ्लोरिडा रीफ, उत्तरी अमेरिका"},{"en":"Andaman Coral Reefs, India","hi":"अंडमान प्रवाल भित्तियाँ, भारत"}],"exp":{"en":"The Great Barrier Reef off northeastern Australia is the world's largest coral reef system. Coral reefs in general are called the 'rainforests of the sea' due to their exceptional biodiversity.","hi":"पूर्वोत्तर ऑस्ट्रेलिया के तट पर स्थित ग्रेट बैरियर रीफ विश्व की सबसे बड़ी प्रवाल भित्ति प्रणाली है। उच्च जैव विविधता के कारण प्रवाल भित्तियों को 'समुद्र के वर्षावन' कहा जाता है।"}}]},{"title":{"en":"3. Biodiversity Hotspots & Conservation Methods","hi":"3। जैव विविधता हॉटस्पॉट और संरक्षण के तरीके"},"questions":[{"q":{"en":"What are the two formal criteria for a global Biodiversity Hotspot?","hi":"वैश्विक जैव विविधता हॉटस्पॉट के दो औपचारिक मानदंड क्या हैं?"},"a":{"en":"≥1,500 endemic plants; ≤30% original habitat left","hi":"≥1,500 स्थानिक पादप; ≤30% मूल वनस्पति शेष"},"o":[{"en":"≥1,500 endemic plants; ≤30% original habitat left","hi":"≥1,500 स्थानिक पादप; ≤30% मूल वनस्पति शेष"},{"en":"≥500 endemic mammals; ≥90% forest intact","hi":"≥500 स्थानिक स्तनधारी; ≥90% वन सुरक्षित"},{"en":"High annual rainfall and zero human population","hi":"उच्च वार्षिक वर्षा और शून्य मानव आबादी"},{"en":"Any national park with ≥100 bird species","hi":"≥100 पक्षी प्रजातियों वाला कोई राष्ट्रीय उद्यान"}],"exp":{"en":"A region qualifies as a global Biodiversity Hotspot (36 worldwide) if it has at least 1,500 endemic vascular plant species and has lost at least 70% of its original natural vegetation (30% or less remaining).","hi":"वैश्विक जैव विविधता हॉटस्पॉट (विश्व में 36) के लिए कम-से-कम 1,500 स्थानिक संवहनी पादप प्रजातियाँ होना और मूल प्राकृतिक वनस्पति का 30% या उससे कम शेष रहना आवश्यक है।"}},{"q":{"en":"Who gave the concept of Biodiversity Hotspot?","hi":"जैव विविधता हॉटस्पॉट (जैव विविधता हॉटस्पॉट) की अवधारणा किसने दी?"},"a":{"en":"Norman Myers (1988 AD).","hi":"नॉर्मन मायर्स (1988 ई.)।"},"o":[{"en":"Norman Myers (1988 AD).","hi":"नॉर्मन मायर्स (1988 ई.)।"},{"en":"Charles Elton (1927 AD).","hi":"चार्ल्स एल्टन (1927 ई.)।"},{"en":"Ernst Haeckel (1869 AD).","hi":"अर्नस्ट हैकेल (1869 ई.)।"},{"en":"G.E. Hutchinson (1927 AD).","hi":"जी.ई। हचिन्सन (1927 ई.)।"}],"exp":{"en":"Norman Myers (1988 AD). Norman Myers introduced the hotspot concept in 1988 to identify highly endemic regions facing exceptional habitat loss and therefore needing urgent conservation priority.","hi":"नॉर्मन मायर्स (1988 ई.)। नॉर्मन मायर्स ने 1988 में हॉटस्पॉट अवधारणा प्रस्तुत किया ताकि अत्यधिक स्थानिक और असाधारण आवास हानि सामना करने वाले क्षेत्रों को तात्कालिक संरक्षण प्राथमिकता दी जा सके।"}},{"q":{"en":"Which four global biodiversity hotspots overlap with India?","hi":"भारत में कौन-से चार वैश्विक जैव विविधता हॉटस्पॉट स्थित हैं?"},"a":{"en":"Himalaya, Indo-Burma, Western Ghats–SL, Sundaland","hi":"हिमालय, इंडो-बर्मा, पश्चिमी घाट–श्रीलंका, सुंडालैंड"},"o":[{"en":"Himalaya, Indo-Burma, Western Ghats–SL, Sundaland","hi":"हिमालय, इंडो-बर्मा, पश्चिमी घाट–श्रीलंका, सुंडालैंड"},{"en":"Thar Desert, Gangetic Plain, Deccan, Lakshadweep","hi":"थार, गंगा मैदान, दक्कन, लक्षद्वीप"},{"en":"Eastern Ghats, Central India, Kutch, Andaman","hi":"पूर्वी घाट, मध्य भारत, कच्छ, अंडमान"},{"en":"Kashmir, Malwa, Coromandel, Chota Nagpur","hi":"कश्मीर, मालवा, कोरोमंडल, छोटा नागपुर"}],"exp":{"en":"Four global biodiversity hotspots extend into India: Himalaya, Indo-Burma, Western Ghats–Sri Lanka, and Sundaland (represented in India by the Nicobar Islands).","hi":"चार वैश्विक जैव विविधता हॉटस्पॉट भारत के भूभाग में आते हैं: हिमालय, इंडो-बर्मा, पश्चिमी घाट–श्रीलंका और सुंडालैंड (भारत में निकोबार द्वीप समूह द्वारा प्रतिनिधित्वित)।"}},{"q":{"en":"What is In-situ Conservation, and what are its examples?","hi":"स्व-स्थाने (In-situ) संरक्षण क्या है और इसके उदाहरण क्या हैं?"},"a":{"en":"In natural habitats (parks, sanctuaries, reserves)","hi":"प्राकृतिक आवास में (उद्यान, अभयारण्य, आरक्षित क्षेत्र)"},"o":[{"en":"In natural habitats (parks, sanctuaries, reserves)","hi":"प्राकृतिक आवास में (उद्यान, अभयारण्य, आरक्षित क्षेत्र)"},{"en":"Outside natural habitats (zoos, seed banks)","hi":"प्राकृतिक आवास के बाहर (चिड़ियाघर, बीज बैंक)"},{"en":"In research labs (tissue culture, cryopreservation)","hi":"शोध प्रयोगशालाओं में (ऊतक संवर्धन, हिमपरिरक्षण)"},{"en":"In urban areas (parks, rooftop gardens)","hi":"शहरी क्षेत्रों में (पार्क, छत के बगीचे)"}],"exp":{"en":"In-situ conservation protects species within their natural habitats—such as National Parks, Wildlife Sanctuaries, Biosphere Reserves, and Sacred Groves—preserving both species and their ecological interactions.","hi":"स्व-स्थाने (In-situ) संरक्षण प्रजातियों को उनके प्राकृतिक आवासों में संरक्षित करता है—जैसे राष्ट्रीय उद्यान, वन्यजीव अभयारण्य, जैवमंडल आरक्षित क्षेत्र और पवित्र उपवन।"}},{"q":{"en":"What is Ex-situ Conservation, and what are its examples?","hi":"बाह्य-स्थाने (Ex-situ) संरक्षण क्या है और इसके उदाहरण क्या हैं?"},"a":{"en":"Outside natural habitats (zoos, seed/gene banks)","hi":"प्राकृतिक आवास के बाहर (चिड़ियाघर, बीज/जीन बैंक)"},"o":[{"en":"Outside natural habitats (zoos, seed/gene banks)","hi":"प्राकृतिक आवास के बाहर (चिड़ियाघर, बीज/जीन बैंक)"},{"en":"Inside natural habitats (national parks, reserves)","hi":"प्राकृतिक आवास के भीतर (राष्ट्रीय उद्यान, अभयारण्य)"},{"en":"Traditional community protection of sacred groves","hi":"पवित्र उपवनों का पारंपरिक सामुदायिक संरक्षण"},{"en":"Strict legal bans without physical facilities","hi":"भौतिक सुविधाओं के बिना केवल कानूनी प्रतिबंध"}],"exp":{"en":"Ex-situ conservation protects species outside their natural habitats—such as zoos, botanical gardens, seed/gene banks, cryopreservation, and captive breeding—useful when wild populations are critically small.","hi":"बाह्य-स्थाने (Ex-situ) संरक्षण प्रजातियों को उनके प्राकृतिक आवास से बाहर संरक्षित करता है—जैसे चिड़ियाघर, वनस्पति उद्यान, बीज/जीन बैंक, अतिशीत संरक्षण (क्रायोप्रिजर्वेशन) और बंदी प्रजनन।"}}]},{"title":{"en":"4. IUCN & Red List","hi":"4। आईयूसीएन (IUCN) और लाल सूची (लाल सूची)"},"questions":[{"q":{"en":"What is the full form of IUCN?","hi":"आईयूसीएन (IUCN) का पूर्ण रूप क्या है?"},"a":{"en":"International Union for Conservation of Nature.","hi":"प्रकृति के संरक्षण के लिए अंतर्राष्ट्रीय संघ (अंतरराष्ट्रीय प्रकृति संरक्षण संघ)।"},"o":[{"en":"International Union for Conservation of Nature.","hi":"प्रकृति के संरक्षण के लिए अंतर्राष्ट्रीय संघ (अंतरराष्ट्रीय प्रकृति संरक्षण संघ)।"},{"en":"Indian Union for Conservation of Nature.","hi":"प्रकृति के संरक्षण के लिए भारतीय संघ।"},{"en":"International Unit for Climate and Nature.","hi":"जलवायु और प्रकृति के लिए अंतर्राष्ट्रीय इकाई।"},{"en":"Intergovernmental Union for Carbon Neutrality.","hi":"कार्बन तटस्थता (तटस्थता) के लिए अंतरसरकारी संघ।"}],"exp":{"en":"International Union for Conservation of Nature. The organisation's current short name is IUCN; historically its formal name has changed, but it is now the International Union for Conservation of Nature.","hi":"प्रकृति के संरक्षण के लिए अंतर्राष्ट्रीय संघ (अंतरराष्ट्रीय प्रकृति संरक्षण संघ)। संगठन का वर्तमान संक्षिप्त नाम IUCN है; ऐतिहासिक रूप से औपचारिक नाम परिवर्तन हुआ, लेकिन आज अंतरराष्ट्रीय प्रकृति संरक्षण संघ है।"}},{"q":{"en":"Where was IUCN founded in 1948, and where is its headquarters today?","hi":"1948 में IUCN की स्थापना कहाँ हुई थी और आज इसका मुख्यालय कहाँ है?"},"a":{"en":"Founded: Fontainebleau (France); HQ: Gland (Switzerland)","hi":"स्थापना: फॉन्टेनब्लो (फ्रांस); मुख्यालय: ग्लैंड (स्विट्ज़रलैंड)"},"o":[{"en":"Founded: Fontainebleau (France); HQ: Gland (Switzerland)","hi":"स्थापना: फॉन्टेनब्लो (फ्रांस); मुख्यालय: ग्लैंड (स्विट्ज़रलैंड)"},{"en":"Founded: Gland; HQ: Amsterdam (Netherlands)","hi":"स्थापना: ग्लैंड; मुख्यालय: एम्स्टर्डम (नीदरलैंड्स)"},{"en":"Founded: Geneva; HQ: Nairobi (Kenya)","hi":"स्थापना: जिनेवा; मुख्यालय: नैरोबी (केन्या)"},{"en":"Founded: Paris; HQ: Rome (Italy)","hi":"स्थापना: पेरिस; मुख्यालय: रोम (इटली)"}],"exp":{"en":"IUCN was established on 5 October 1948 at Fontainebleau, France, whereas its present headquarters is located in Gland, Switzerland.","hi":"IUCN की स्थापना 5 अक्टूबर 1948 को फॉन्टेनब्लो, फ्रांस में हुई थी, जबकि इसका वर्तमान मुख्यालय ग्लैंड, स्विट्ज़रलैंड में स्थित है।"}},{"q":{"en":"What is the primary objective of IUCN?","hi":"IUCN का मुख्य उद्देश्य क्या है?"},"a":{"en":"Conserve nature and promote sustainable resource use","hi":"प्रकृति संरक्षण और संसाधनों का सतत उपयोग"},"o":[{"en":"Conserve nature and promote sustainable resource use","hi":"प्रकृति संरक्षण और संसाधनों का सतत उपयोग"},{"en":"Accelerate industrial growth in developing nations","hi":"विकासशील देशों में औद्योगिक विकास तेज करना"},{"en":"Regulate global weather and cyclone forecasting","hi":"वैश्विक मौसम और चक्रवात पूर्वानुमान विनियमित करना"},{"en":"Fund urban transport infrastructure projects","hi":"शहरी परिवहन अवसंरचना परियोजनाओं का वित्तपोषण"}],"exp":{"en":"IUCN works to conserve nature and biodiversity and promote sustainable, equitable use of natural resources through science, extinction-risk assessment (Red List), and conservation policy.","hi":"IUCN विज्ञान, विलुप्ति-जोखिम आकलन (लाल सूची) और संरक्षण नीति के माध्यम से प्रकृति व जैव विविधता के संरक्षण तथा प्राकृतिक संसाधनों के सतत व न्यायसंगत उपयोग को बढ़ावा देता है।"}},{"q":{"en":"What is significant about the 1978 IUCN publication on plants?","hi":"पौधों पर 1978 के IUCN प्रकाशन का क्या महत्व है?"},"a":{"en":"IUCN Plant Red Data Book was published","hi":"IUCN पादप रेड डेटा बुक प्रकाशित हुई"},"o":[{"en":"IUCN Plant Red Data Book was published","hi":"IUCN पादप रेड डेटा बुक प्रकाशित हुई"},{"en":"Entire IUCN Red List system first began","hi":"संपूर्ण IUCN लाल सूची प्रणाली की शुरुआत हुई"},{"en":"IUCN organisation was formally founded","hi":"IUCN संगठन की औपचारिक स्थापना हुई"},{"en":"First Ramsar wetland list was released","hi":"पहली रामसर आर्द्रभूमि सूची जारी हुई"}],"exp":{"en":"The IUCN Plant Red Data Book was published in 1978 as a landmark plant-focused volume; the overall IUCN Red List system itself had already begun in 1964.","hi":"1978 में IUCN पादप रेड डेटा बुक प्रकाशित हुई थी। यह पौधों पर केंद्रित एक ऐतिहासिक प्रकाशन था, जबकि समग्र IUCN लाल सूची प्रणाली 1964 में ही शुरू हो चुकी थी।"}},{"q":{"en":"What is significant about the 1988 IUCN publication on animals?","hi":"जंतुओं पर 1988 के IUCN प्रकाशन का क्या महत्व है?"},"a":{"en":"IUCN Red List of Threatened Animals published","hi":"संकटग्रस्त जंतुओं की IUCN लाल सूची प्रकाशित"},"o":[{"en":"IUCN Red List of Threatened Animals published","hi":"संकटग्रस्त जंतुओं की IUCN लाल सूची प्रकाशित"},{"en":"IUCN Red List system first began","hi":"IUCN लाल सूची प्रणाली पहली बार शुरू हुई"},{"en":"IUCN was founded to classify wildlife","hi":"वन्यजीव वर्गीकरण के लिए IUCN की स्थापना हुई"},{"en":"Ramsar Convention first listed threatened fauna","hi":"रामसर अभिसमय ने पहली बार जंतुओं को सूचीबद्ध किया"}],"exp":{"en":"The 1988 IUCN Red List of Threatened Animals was a major historical animal-focused publication, not the start of the Red List system (which began in 1964).","hi":"1988 की 'IUCN रेड लिस्ट ऑफ थ्रेटेंड एनिमल्स' जंतुओं पर केंद्रित एक प्रमुख ऐतिहासिक प्रकाशन था; यह लाल सूची प्रणाली की शुरुआत नहीं थी (जो 1964 में शुरू हुई)।"}},{"q":{"en":"Which sequence orders IUCN categories from highest to lowest extinction risk?","hi":"कौन-सा क्रम IUCN श्रेणियों को सर्वाधिक से न्यूनतम विलुप्ति जोखिम के अनुसार दर्शाता है?"},"a":{"en":"EX → EW → CR → EN → VU → NT → LC","hi":"EX → EW → CR → EN → VU → NT → LC"},"o":[{"en":"EX → EW → CR → EN → VU → NT → LC","hi":"EX → EW → CR → EN → VU → NT → LC"},{"en":"CR → EN → VU → EX → EW → NT → LC","hi":"CR → EN → VU → EX → EW → NT → LC"},{"en":"LC → NT → VU → EN → CR → EW → EX","hi":"LC → NT → VU → EN → CR → EW → EX"},{"en":"EX → VU → NT → EN → CR → LC → EW","hi":"EX → VU → NT → EN → CR → LC → EW"}],"exp":{"en":"From highest risk downward: Extinct (EX) → Extinct in the Wild (EW) → Critically Endangered (CR) → Endangered (EN) → Vulnerable (VU) → Near Threatened (NT) → Least Concern (LC). Data Deficient (DD) and Not Evaluated (NE) are not ordered risk levels.","hi":"सर्वाधिक जोखिम से नीचे की ओर क्रम: विलुप्त (EX) → वन से विलुप्त (EW) → गंभीर रूप से संकटग्रस्त (CR) → संकटग्रस्त (EN) → सुभेद्य (VU) → संकट के निकट (NT) → न्यूनतम चिंता (LC)। DD और NE क्रमबद्ध जोखिम स्तर नहीं हैं।"}},{"q":{"en":"Which Indian fauna pair correctly illustrates different IUCN Red List categories?","hi":"कौन-सा भारतीय जीव युग्म IUCN लाल सूची की अलग-अलग श्रेणियों को सही दर्शाता है?"},"a":{"en":"Great Indian Bustard: CR; Nilgai: LC","hi":"गोडावण (सोनचिरैया): CR; नीलगाय: LC"},"o":[{"en":"Great Indian Bustard: CR; Nilgai: LC","hi":"गोडावण (सोनचिरैया): CR; नीलगाय: LC"},{"en":"Nilgai and House Crow: both Endangered","hi":"नीलगाय और घरेलू कौआ: दोनों संकटग्रस्त"},{"en":"All Indian vulture species: Least Concern","hi":"भारत की सभी गिद्ध प्रजातियाँ: न्यूनतम चिंता"},{"en":"IUCN categories apply only to plants","hi":"IUCN श्रेणियाँ केवल पौधों पर लागू होती हैं"}],"exp":{"en":"IUCN categories are species-specific: the Great Indian Bustard and White-rumped Vulture are Critically Endangered (CR), whereas Nilgai is Least Concern (LC).","hi":"IUCN श्रेणियाँ प्रजाति-विशिष्ट होती हैं: महान भारतीय सोनचिरैया (गोडावण) और सफेद पीठ वाला गिद्ध गंभीर रूप से संकटग्रस्त (CR) हैं, जबकि नीलगाय न्यूनतम चिंता (LC) श्रेणी में है।"}}]},{"title":{"en":"5. Ramsar Convention","hi":"5। रामसर कन्वेंशन"},"questions":[{"q":{"en":"What is the primary purpose of the Ramsar Convention?","hi":"रामसर अभिसमय (Ramsar Convention) का मुख्य उद्देश्य क्या है?"},"a":{"en":"Conservation and wise use of all wetlands","hi":"सभी आर्द्रभूमियों का संरक्षण और विवेकपूर्ण उपयोग"},"o":[{"en":"Conservation and wise use of all wetlands","hi":"सभी आर्द्रभूमियों का संरक्षण और विवेकपूर्ण उपयोग"},{"en":"Protection of inland freshwater marshes and lakes","hi":"अंतर्देशीय मीठे जल के दलदल और झीलों की सुरक्षा"},{"en":"Conservation of deep-sea coral reefs and atolls","hi":"गहरे समुद्री प्रवाल भित्तियों और प्रवाल द्वीपों का संरक्षण"},{"en":"Regulation of international river dams and canals","hi":"अंतरराष्ट्रीय नदी बाँधों और नहरों का विनियमन"}],"exp":{"en":"The Ramsar Convention promotes the conservation and 'wise use' of all wetlands (inland, coastal, and human-made) through local, national, and international cooperation.","hi":"रामसर अभिसमय स्थानीय, राष्ट्रीय और अंतरराष्ट्रीय सहयोग के माध्यम से सभी आर्द्रभूमियों (अंतर्देशीय, तटीय और मानव-निर्मित) के संरक्षण और 'विवेकपूर्ण उपयोग' को बढ़ावा देता है।"}},{"q":{"en":"When and where was the Ramsar Convention adopted?","hi":"रामसर अभिसमय कब और कहाँ अपनाया गया?"},"a":{"en":"2 February 1971, Ramsar, Iran.","hi":"2 फ़रवरी 1971, रामसर, ईरान।"},"o":[{"en":"2 February 1971, Ramsar, Iran.","hi":"2 फ़रवरी 1971, रामसर, ईरान।"},{"en":"1 February 1982, New Delhi, India.","hi":"1 फ़रवरी 1982, नया दिल्ली, भारत।"},{"en":"5 June 1992, Rio de Janeiro, Brazil.","hi":"5 जून 1992, रियो डी जेनेरो, ब्राज़ील।"},{"en":"5 October 1948, Fontainebleau, France.","hi":"5 अक्टूबर 1948, फॉन्टेनब्लो, फ्रांस।"}],"exp":{"en":"2 February 1971, Ramsar, Iran. The Convention was adopted on 2 February 1971 in the Iranian city of Ramsar, which is why 2 February is observed as World Wetlands Day.","hi":"2 फ़रवरी 1971, रामसर, ईरान। अभिसमय 2 फ़रवरी 1971 को ईरानी नगर रामसर में अपनाया गया; इसी कारण 2 फ़रवरी विश्व आर्द्रभूमि दिवस के रूप में मनाया जाता है।"}},{"q":{"en":"Which international observance is linked to the Ramsar Convention?","hi":"रामसर अभिसमय से कौन-सा अंतरराष्ट्रीय दिवस संबंधित है?"},"a":{"en":"World Wetlands Day — 2 February.","hi":"विश्व आर्द्रभूमियाँ दिन - 2 फ़रवरी।"},"o":[{"en":"World Wetlands Day — 2 February.","hi":"विश्व आर्द्रभूमियाँ दिन - 2 फ़रवरी।"},{"en":"World Environment Day (5th June).","hi":"विश्व पर्यावरण दिवस (5 जून)।"},{"en":"World Earth Day (22nd April).","hi":"विश्व पृथ्वी दिवस (22 अप्रैल)।"},{"en":"World Water Day (22nd March).","hi":"विश्व जल दिवस (22 मार्च)।"}],"exp":{"en":"World Wetlands Day — 2 February. The date marks the adoption of the Ramsar Convention and is used globally to highlight the ecological and societal importance of wetlands.","hi":"विश्व आर्द्रभूमियाँ दिन - 2 फ़रवरी। यह तिथि रामसर अभिसमय की अंगीकरण को चिह्नित करती है और वैश्विक रूप से आर्द्रभूमियों की पारिस्थितिक तथा सामाजिक महत्व रेखांकित करने के लिए उपयोग होती है।"}},{"q":{"en":"When did the Ramsar Convention enter into force for Indi l","hi":"अल्फा: स्थानीय; बीटा: परिवर्तन-दर; गामा: क्षेत्रीय"},"o":[{"en":"Alpha: local; Beta: turnover; Gamma: regional","hi":"अल्फा: स्थानीय; बीटा: परिवर्तन-दर; गामा: क्षेत्रीय"},{"en":"Alpha: genetic; Beta: species; Gamma: ecosystem","hi":"अल्फा: आनुवंशिक; बीटा: प्रजातीय; गामा: पारितंत्र"},{"en":"Alpha: ecosystem; Beta: genetic; Gamma: species","hi":"अल्फा: पारितंत्र; बीटा: आनुवंशिक; गामा: प्रजातीय"},{"en":"All three measure genetic diversity only","hi":"तीनों केवल आनुवंशिक विविधता मापती हैं"}],"exp":{"en":"Alpha = local/within-community species diversity; Beta = species turnover among communities; Gamma = total regional/landscape species diversity. They are spatial scales of species diversity, not synonyms for genetic/species/ecosystem levels.","hi":"अल्फा = स्थानीय/समुदाय के भीतर प्रजातीय विविधता; बीटा = समुदायों के बीच प्रजाति परिवर्तन-दर; गामा = कुल क्षेत्रीय/परिदृश्य प्रजातीय विविधता। ये प्रजातीय विविधता के स्थानिक पैमाने हैं।"}},{"q":{"en":"How do the 1978 and 1988 IUCN Red Data publications relate to the 1964 Red List start?","hi":"1978 और 1988 के IUCN प्रकाशन 1964 में शुरू हुई लाल सूची से कैसे संबंधित हैं?"},"a":{"en":"1978 Plant & 1988 Animal books; system began 1964","hi":"1978 पादप व 1988 जंतु पुस्तकें; प्रणाली 1964 में शुरू"},"o":[{"en":"1978 Plant & 1988 Animal books; system began 1964","hi":"1978 पादप व 1988 जंतु पुस्तकें; प्रणाली 1964 में शुरू"},{"en":"Red List began 1978 for plants, 1988 for animals","hi":"लाल सूची 1978 में पौधों और 1988 में जंतुओं के लिए शुरू"},{"en":"IUCN itself was founded in 1978","hi":"IUCN की स्थापना स्वयं 1978 में हुई"},{"en":"Both dates belong to Ramsar wetland lists","hi":"दोनों तिथियाँ रामसर आर्द्रभूमि सूचियों की हैं"}],"exp":{"en":"1978 refers to The IUCN Plant Red Data Book and 1988 to the IUCN Red List of Threatened Animals; the IUCN Red List system itself began earlier in 1964.","hi":"1978 'IUCN पादप रेड डेटा बुक' और 1988 'IUCN संकटग्रस्त जंतुओं की लाल सूची' के प्रकाशन वर्ष हैं, जबकि IUCN लाल सूची प्रणाली की शुरुआत 1964 में हुई थी।"}},{"q":{"en":"What is the correct Ramsar chronology for the Convention and India?","hi":"रामसर अभिसमय के अंगीकरण और भारत में प्रभावी होने का सही कालक्रम क्या है?"},"a":{"en":"Adopted: 2 Feb 1971; India: 1 Feb 1982","hi":"अंगीकरण: 2 फ़रवरी 1971; भारत: 1 फ़रवरी 1982"},"o":[{"en":"Adopted: 2 Feb 1971; India: 1 Feb 1982","hi":"अंगीकरण: 2 फ़रवरी 1971; भारत: 1 फ़रवरी 1982"},{"en":"Adopted: 1982; India joined: 1971","hi":"अंगीकरण: 1982; भारत शामिल: 1971"},{"en":"Both occurred on 2 February 1971","hi":"दोनों 2 फ़रवरी 1971 को हुए"},{"en":"Adopted: 1992; India joined: 2002","hi":"अंगीकरण: 1992; भारत शामिल: 2002"}],"exp":{"en":"The Ramsar Convention was adopted at Ramsar, Iran on 2 February 1971 and entered into force for India on 1 February 1982.","hi":"रामसर अभिसमय 2 फ़रवरी 1971 को रामसर, ईरान में अपनाया गया था और भारत के लिए 1 फ़रवरी 1982 को प्रभावी हुआ।"}},{"q":{"en":"How do In-situ and Ex-situ conservation fundamentally differ?","hi":"स्व-स्थाने (In-situ) और बाह्य-स्थाने (Ex-situ) संरक्षण में मूल अंतर क्या है?"},"a":{"en":"In-situ: in natural habitat; Ex-situ: outside habitat","hi":"स्व-स्थाने: प्राकृतिक आवास में; बाह्य-स्थाने: आवास से बाहर"},"o":[{"en":"In-situ: in natural habitat; Ex-situ: outside habitat","hi":"स्व-स्थाने: प्राकृतिक आवास में; बाह्य-स्थाने: आवास से बाहर"},{"en":"In-situ: outside habitat; Ex-situ: in natural habitat","hi":"स्व-स्थाने: आवास से बाहर; बाह्य-स्थाने: प्राकृतिक आवास में"},{"en":"In-situ: plants only; Ex-situ: animals only","hi":"स्व-स्थाने: केवल पौधे; बाह्य-स्थाने: केवल जंतु"},{"en":"Both refer to the same captive-breeding method","hi":"दोनों एक ही बंदी-प्रजनन विधि को दर्शाते हैं"}],"exp":{"en":"In-situ conserves species in their natural habitats (national parks, sanctuaries, biosphere reserves); ex-situ conserves them outside natural habitats (zoos, botanical gardens, seed/gene banks).","hi":"स्व-स्थाने प्रजातियों को उनके प्राकृतिक आवास में (राष्ट्रीय उद्यान, अभयारण्य) संरक्षित करता है; बाह्य-स्थाने उन्हें प्राकृतिक आवास के बाहर (चिड़ियाघर, वनस्पति उद्यान, बीज बैंक) संरक्षित करता है।"}},{"q":{"en":"How do the three biodiversity levels differ from alpha–beta–gamma diversity?","hi":"जैव विविधता के तीन स्तर और अल्फा–बीटा–गामा विविधता में क्या अंतर है?"},"a":{"en":"Levels: biological types; α-β-γ: spatial scales","hi":"तीन स्तर: जैविक प्रकार; α-β-γ: स्थानिक पैमाने"},"o":[{"en":"Levels: biological types; α-β-γ: spatial scales","hi":"तीन स्तर: जैविक प्रकार; α-β-γ: स्थानिक पैमाने"},{"en":"Both are identical categories with different names","hi":"दोनों अलग नामों वाली समान श्रेणियाँ हैं"},{"en":"Three levels are Ramsar; α-β-γ are IUCN","hi":"तीन स्तर रामसर के हैं; α-β-γ IUCN के हैं"},{"en":"α-β-γ are genetic levels within one cell","hi":"α-β-γ एक कोशिका के भीतर आनुवंशिक स्तर हैं"}],"exp":{"en":"The three biodiversity levels (genetic, species, ecosystem) classify what varies biologically, whereas alpha, beta, and gamma diversity measure species diversity across local, between-community, and regional spatial scales.","hi":"जैव विविधता के तीन स्तर (आनुवंशिक, प्रजातीय, पारितंत्र) जैविक विविधता के प्रकार बताते हैं, जबकि अल्फा, बीटा व गामा स्थानीय, अंतर-समुदाय और क्षेत्रीय पैमाने पर प्रजाति विविधता मापते हैं।"}}]},{"title":{"en":"8. Final Revision","hi":"8। अंतिम पुनरावृत्ति"},"questions":[{"q":{"en":"What is Alpha (α) diversity in Whittaker's spatial framework?","hi":"व्हिटेकर स्थानिक ढाँचा में अल्फा (α) विविधता क्या है?"},"a":{"en":"Local species diversity within a single community","hi":"एकल समुदाय के भीतर स्थानीय प्रजातीय विविधता"},"o":[{"en":"Local species diversity within a single community","hi":"एकल समुदाय के भीतर स्थानीय प्रजातीय विविधता"},{"en":"Genetic variation within a single biological species","hi":"एकल जैविक प्रजाति के भीतर आनुवंशिक विविधता"},{"en":"Species turnover across different local communities","hi":"विभिन्न स्थानीय समुदायों के बीच प्रजाति परिवर्तन-दर"},{"en":"Total species diversity across an entire region","hi":"संपूर्ण क्षेत्र में कुल प्रजातीय विविधता"}],"exp":{"en":"Local species diversity within a community or sampling unit. This keeps the biological levels of biodiversity separate from Whittaker's spatial partitioning of species diversity.","hi":"एक समुदाय या नमूनाकरण इकाई के भीतर स्थानीय प्रजातीय विविधता। यह जैव विविधता के जैविक स्तर को व्हिटेकर के स्थानिक प्रजाति-विविधता विभाजन से अलग रखता है।"}},{"q":{"en":"What is Beta (β) diversity in Whittaker's spatial framework?","hi":"व्हिटेकर स्थानिक ढाँचा में बीटा (β) विविधता क्या है?"},"a":{"en":"Species turnover or difference among local communities","hi":"स्थानीय समुदायों के बीच प्रजाति परिवर्तन-दर या अंतर"},"o":[{"en":"Species turnover or difference among local communities","hi":"स्थानीय समुदायों के बीच प्रजाति परिवर्तन-दर या अंतर"},{"en":"Local species diversity within one sampling unit","hi":"एक नमूनाकरण इकाई के भीतर स्थानीय विविधता"},{"en":"Total species diversity of an entire region","hi":"संपूर्ण क्षेत्र की कुल प्रजातीय विविधता"},{"en":"Genetic variation among individuals of one species","hi":"एक प्रजाति के व्यक्तियों में आनुवंशिक परिवर्तन"}],"exp":{"en":"Species turnover or difference in species composition among local communities. This keeps the biological levels of biodiversity separate from Whittaker's spatial partitioning of species diversity.","hi":"स्थानीय समुदाय के बीच प्रजाति परिवर्तन-दर या प्रजाति संरचना में अंतर। यह जैव विविधता के जैविक स्तर को व्हिटेकर के स्थानिक प्रजाति-विविधता विभाजन से अलग रखता है।"}},{"q":{"en":"What is Gamma (γ) diversity, and who introduced the α–β–γ framework?","hi":"गामा (γ) विविधता क्या है और α–β–γ ढाँचा किसने प्रस्तुत किया?"},"a":{"en":"Total regional species diversity; R.H. Whittaker","hi":"कुल क्षेत्रीय प्रजाति विविधता; आर.एच. व्हिटेकर"},"o":[{"en":"Total regional species diversity; R.H. Whittaker","hi":"कुल क्षेत्रीय प्रजाति विविधता; आर.एच. व्हिटेकर"},{"en":"Genetic diversity within one species; Norman Myers","hi":"एक प्रजाति में आनुवंशिक विविधता; नॉर्मन मायर्स"},{"en":"Ecosystem productivity; A.G. Tansley","hi":"पारितंत्र उत्पादकता; ए.जी. टैन्सले"},{"en":"Extinction risk score; IUCN","hi":"विलुप्ति जोखिम स्कोर; IUCN"}],"exp":{"en":"Gamma diversity is total regional or landscape species diversity. The alpha–beta–gamma spatial framework was introduced by R.H. Whittaker.","hi":"गामा विविधता किसी पूरे क्षेत्र या परिदृश्य की कुल प्रजातीय विविधता है। अल्फा–बीटा–गामा स्थानिक ढाँचा आर.एच. व्हिटेकर ने प्रस्तुत किया था।"}},{"q":{"en":"Which IUCN categories are collectively called 'threatened'?","hi":"IUCN की कौन-सी श्रेणियाँ सामूहिक रूप से 'संकटग्रस्त' कहलाती हैं?"},"a":{"en":"Critically Endangered (CR), Endangered (EN) and Vulnerable (VU)","hi":"गंभीर रूप से संकटग्रस्त (CR), संकटग्रस्त (EN) और सुभेद्य (VU)"},"o":[{"en":"Critically Endangered (CR), Endangered (EN) and Vulnerable (VU)","hi":"गंभीर रूप से संकटग्रस्त (CR), संकटग्रस्त (EN) और सुभेद्य (VU)"},{"en":"Extinct (EX), Data Deficient (DD) and Not Evaluated (NE)","hi":"विलुप्त (EX), आँकड़े अपूर्ण (DD) और अमूल्यांकित (NE)"},{"en":"Near Threatened (NT), Least Concern (LC) and Extinct (EX)","hi":"संकट के निकट (NT), न्यूनतम चिंता (LC) और विलुप्त (EX)"},{"en":"Extinct in Wild (EW), Near Threatened (NT) and LC","hi":"वन से विलुप्त (EW), संकट के निकट (NT) और LC"}],"exp":{"en":"Critically Endangered (CR), Endangered (EN) and Vulnerable (VU). 'Threatened' has a precise IUCN meaning: it collectively covers CR, EN and VU, not every species with any conservation concern.","hi":"गंभीर रूप से संकटग्रस्त (CR), संकटग्रस्त (EN) और सुभेद्य (VU)। 'संकटग्रस्त' का सटीक IUCN अर्थ है: यह सामूहिक रूप से CR, EN और VU को समाहित करता है, हर संरक्षण-चिंता प्रजाति को नहीं।"}}]}],"4. Wildlife Conservation / वन्यजीव संरक्षण":[{"title":{"en":"1. Overview / Chapter Snapshot","hi":"1। अवलोकन / अध्याय स्नैपशॉट"},"questions":[{"q":{"en":"Which major topics are covered under Wildlife Conservation?","hi":"वन्यजीव संरक्षण विषय के अंतर्गत किन प्रमुख विषयों का अध्ययन किया जाता है?"},"a":{"en":"MAB, 18 Biosphere Reserves, Tiger Census & 58 Reserves","hi":"MAB, 18 बायोस्फीयर रिजर्व, बाघ गणना व 58 टाइगर रिजर्व"},"o":[{"en":"MAB, 18 Biosphere Reserves, Tiger Census & 58 Reserves","hi":"MAB, 18 बायोस्फीयर रिजर्व, बाघ गणना व 58 टाइगर रिजर्व"},{"en":"Ocean trenches, currents, tides, salinity & deep-sea vents","hi":"महासागरीय गर्त, धाराएँ, ज्वार, लवणता व गहरे समुद्री छिद्र"},{"en":"European national parks, alpine glaciers, rivers & lakes","hi":"यूरोपीय राष्ट्रीय उद्यान, अल्पाइन हिमनद, नदियाँ व झीलें"},{"en":"Colonial forest revenue laws, timber auctions & land taxes","hi":"औपनिवेशिक वन राजस्व कानून, लकड़ी नीलामी व भू-कर"}],"exp":{"en":"This chapter covers UNESCO's MAB Programme, India's 18 Biosphere Reserves, key wildlife facts, the All India Tiger Estimation (2022), major conservation project timelines, and India's 58 Tiger Reserves.","hi":"इस अध्याय में UNESCO का MAB कार्यक्रम, भारत के 18 जैवमंडल आरक्षित क्षेत्र, प्रमुख वन्यजीव तथ्य, अखिल भारतीय बाघ आकलन (2022), प्रमुख संरक्षण परियोजनाओं की समयरेखा और 58 बाघ आरक्षित क्षेत्र शामिल हैं।"}},{"q":{"en":"How many Biosphere Reserves does India have, and how many are in UNESCO's World Network?","hi":"भारत में कुल कितने जैवमंडल आरक्षित क्षेत्र हैं और UNESCO विश्व नेटवर्क में कितने हैं?"},"a":{"en":"18 national; 13 in UNESCO World Network","hi":"18 राष्ट्रीय; 13 UNESCO विश्व नेटवर्क में"},"o":[{"en":"18 national; 13 in UNESCO World Network","hi":"18 राष्ट्रीय; 13 UNESCO विश्व नेटवर्क में"},{"en":"18 national; all 18 in UNESCO Network","hi":"18 राष्ट्रीय; सभी 18 UNESCO नेटवर्क में"},{"en":"13 national; 18 in UNESCO Network","hi":"13 राष्ट्रीय; 18 UNESCO नेटवर्क में"},{"en":"25 national; 13 in UNESCO Network","hi":"25 राष्ट्रीय; 13 UNESCO नेटवर्क में"}],"exp":{"en":"India has 18 nationally designated Biosphere Reserves, of which 13 are currently included in UNESCO's World Network of Biosphere Reserves (Cold Desert became the 13th in 2025).","hi":"भारत में 18 राष्ट्रीय रूप से नामित जैवमंडल आरक्षित क्षेत्र हैं, जिनमें से वर्तमान में 13 UNESCO के विश्व नेटवर्क में शामिल हैं (शीत मरुस्थल 2025 में 13वाँ बना)।"}}]},{"title":{"en":"2. Biosphere Reserve / Reserved Area","hi":"2। बायोस्फीयर रिजर्व / आरक्षित क्षेत्र"},"questions":[{"q":{"en":"Under which UNESCO programme was the Biosphere Reserve concept started?","hi":"बायोस्फीयर रिजर्व कार्यक्रम UNESCO के किस कार्यक्रम के अंतर्गत शुरू किया गया?"},"a":{"en":"Man and the Biosphere (MAB), 1971","hi":"मानव एवं जैवमंडल (MAB), 1971"},"o":[{"en":"Man and the Biosphere (MAB), 1971","hi":"मानव एवं जैवमंडल (MAB), 1971"},{"en":"Global Environment Facility (GEF), 1992","hi":"वैश्विक पर्यावरण सुविधा (GEF), 1992"},{"en":"IUCN Red Data Programme, 1948","hi":"IUCN रेड डेटा कार्यक्रम, 1948"},{"en":"WWF Nature Initiative, 1961","hi":"WWF प्रकृति पहल, 1961"}],"exp":{"en":"UNESCO launched the Man and the Biosphere (MAB) Programme in 1971, linking biodiversity conservation with sustainable development and scientific research.","hi":"UNESCO ने 1971 में मानव एवं जैवमंडल (MAB) कार्यक्रम शुरू किया, जो जैव विविधता संरक्षण को सतत विकास और वैज्ञानिक अनुसंधान से जोड़ता है।"}},{"q":{"en":"What are the three core functions of a Biosphere Reserve under UNESCO's MAB framework?","hi":"UNESCO के MAB ढाँचे के अंतर्गत जैवमंडल आरक्षित क्षेत्र के तीन मूल कार्य क्या हैं?"},"a":{"en":"Conservation, sustainable development, logistic support","hi":"संरक्षण, सतत विकास और व्यावहारिक सहायता"},"o":[{"en":"Conservation, sustainable development, logistic support","hi":"संरक्षण, सतत विकास और व्यावहारिक सहायता"},{"en":"Strict wildlife protection with zero human presence","hi":"शून्य मानव उपस्थिति के साथ कठोर संरक्षण"},{"en":"Timber extraction, mining, and urban expansion","hi":"काष्ठ दोहन, खनन और नगरीय विस्तार"},{"en":"Captive breeding outside natural habitats only","hi":"केवल प्राकृतिक आवास के बाहर बंदी प्रजनन"}],"exp":{"en":"UNESCO defines three interconnected functions: conservation, socio-culturally and ecologically sustainable development, and logistic support (research, monitoring, education), implemented via core, buffer, and transition zones.","hi":"UNESCO तीन परस्पर जुड़े कार्य निर्धारित करता है: संरक्षण, सतत विकास तथा अनुसंधान/निगरानी/शिक्षा के लिए व्यावहारिक सहायता—जिन्हें कोर, बफर और संक्रमण क्षेत्रों से लागू किया जाता है।"}},{"q":{"en":"Which is India's first Biosphere Reserve, and when was it designated?","hi":"भारत का पहला जैवमंडल आरक्षित क्षेत्र कौन-सा है और इसे कब नामित किया गया?"},"a":{"en":"Nilgiri Biosphere Reserve (1986)","hi":"नीलगिरि जैवमंडल आरक्षित क्षेत्र (1986)"},"o":[{"en":"Nilgiri Biosphere Reserve (1986)","hi":"नीलगिरि जैवमंडल आरक्षित क्षेत्र (1986)"},{"en":"Nanda Devi Biosphere Reserve (1988)","hi":"नंदा देवी जैवमंडल आरक्षित क्षेत्र (1988)"},{"en":"Sundarbans Biosphere Reserve (1989)","hi":"सुंदरबन जैवमंडल आरक्षित क्षेत्र (1989)"},{"en":"Gulf of Mannar Biosphere Reserve (1989)","hi":"मन्नार की खाड़ी जैवमंडल आरक्षित क्षेत्र (1989)"}],"exp":{"en":"Nilgiri Biosphere Reserve was designated in 1986 as India's first Biosphere Reserve; it spans parts of Tamil Nadu, Kerala, and Karnataka.","hi":"नीलगिरि जैवमंडल आरक्षित क्षेत्र 1986 में भारत का पहला बायोस्फीयर रिजर्व बना; यह तमिलनाडु, केरल और कर्नाटक के हिस्सों में फैला है।"}},{"q":{"en":"Which is India's largest nationally designated Biosphere Reserve by area?","hi":"क्षेत्रफल के अनुसार भारत का सबसे बड़ा राष्ट्रीय जैवमंडल आरक्षित क्षेत्र कौन-सा है?"},"a":{"en":"Kachchh (Great Rann of Kutch), Gujarat","hi":"कच्छ (कच्छ का महान रण), गुजरात"},"o":[{"en":"Kachchh (Great Rann of Kutch), Gujarat","hi":"कच्छ (कच्छ का महान रण), गुजरात"},{"en":"Nilgiri, Western Ghats","hi":"नीलगिरि, पश्चिमी घाट"},{"en":"Gulf of Mannar, Tamil Nadu","hi":"मन्नार की खाड़ी, तमिलनाडु"},{"en":"Sundarbans, West Bengal","hi":"सुंदरबन, पश्चिम बंगाल"}],"exp":{"en":"Kachchh (Great Rann of Kutch) Biosphere Reserve in Gujarat covers about 12,454 km², making it India's largest nationally designated Biosphere Reserve.","hi":"गुजरात में स्थित कच्छ (कच्छ का महान रण) जैवमंडल आरक्षित क्षेत्र लगभग 12,454 किमी² में फैला है, जो भारत का सबसे बड़ा राष्ट्रीय बायोस्फीयर रिजर्व है।"}},{"q":{"en":"Which is India's smallest nationally designated Biosphere Reserve by area?","hi":"क्षेत्रफल के अनुसार भारत का सबसे छोटा राष्ट्रीय जैवमंडल आरक्षित क्षेत्र कौन-सा है?"},"a":{"en":"Dibru-Saikhowa, Assam (~765 km²)","hi":"डिब्रू-सैखोवा, असम (~765 किमी²)"},"o":[{"en":"Dibru-Saikhowa, Assam (~765 km²)","hi":"डिब्रू-सैखोवा, असम (~765 किमी²)"},{"en":"Nokrek, Meghalaya","hi":"नोकरेक, मेघालय"},{"en":"Panna, Madhya Pradesh","hi":"पन्ना, मध्य प्रदेश"},{"en":"Pachmarhi, Madhya Pradesh","hi":"पचमढ़ी, मध्य प्रदेश"}],"exp":{"en":"Dibru-Saikhowa Biosphere Reserve in Assam has a notified area of about 765 km², making it the smallest among India's 18 national Biosphere Reserves.","hi":"असम में स्थित डिब्रू-सैखोवा जैवमंडल आरक्षित क्षेत्र का अधिसूचित क्षेत्रफल लगभग 765 किमी² है, जो भारत के 18 राष्ट्रीय बायोस्फीयर रिजर्व में सबसे छोटा है।"}},{"q":{"en":"Nagarhole National Park is a part of which Biosphere Reserve?","hi":"नागरहोल राष्ट्रीय उद्यान किस बायोस्फीयर रिजर्व का एक हिस्सा है?"},"a":{"en":"Nilgiri Biosphere Reserve.","hi":"नीलगिरि बायोस्फीयर रिजर्व।"},"o":[{"en":"Nilgiri Biosphere Reserve.","hi":"नीलगिरि बायोस्फीयर रिजर्व।"},{"en":"Agasthyamalai Biosphere Reserve.","hi":"अगस्त्यमलाई बायोस्फीयर रिजर्व।"},{"en":"Gulf of Mannar Biosphere Reserve.","hi":"मन्नार की खाड़ी बायोस्फीयर रिजर्व।"},{"en":"Seshachalam Hills Biosphere Reserve.","hi":"शेषाचलम हिल्स बायोस्फीयर रिजर्व।"}],"exp":{"en":"Nilgiri Biosphere Reserve. Nagarhole is one of the important protected areas embedded in the wider Nilgiri landscape, which spans the Western Ghats across three States.","hi":"नीलगिरि बायोस्फीयर रिजर्व। नागरहोल व्यापक नीलगिरि परिदृश्य का महत्वपूर्ण संरक्षित क्षेत्रफल है; नीलगिरि परिदृश्य पश्चिमी घाट में तीन राज्य तक फैला है।"}}]},{"title":{"en":"3. Important Facts","hi":"3। महत्वपूर्ण तथ्य"},"questions":[{"q":{"en":"Which high-altitude Indian World Heritage property is home to both the Asiatic black bear and snow leopard?","hi":"कौन-सा उच्च पर्वतीय भारतीय विश्व धरोहर क्षेत्र एशियाई काला भालू और हिम तेंदुआ दोनों का आवास है?"},"a":{"en":"Nanda Devi and Valley of Flowers National Parks, Uttarakhand","hi":"नंदा देवी और फूलों की घाटी राष्ट्रीय उद्यान, उत्तराखंड"},"o":[{"en":"Nanda Devi and Valley of Flowers National Parks, Uttarakhand","hi":"नंदा देवी और फूलों की घाटी राष्ट्रीय उद्यान, उत्तराखंड"},{"en":"Jim Corbett and Rajaji National Parks, Uttarakhand","hi":"जिम कॉर्बेट और राजाजी राष्ट्रीय उद्यान, उत्तराखंड"},{"en":"Kaziranga and Orang National Parks, Eastern Assam","hi":"काजीरंगा और ओरंग राष्ट्रीय उद्यान, पूर्वी असम"},{"en":"Sundarbans and Buxa National Parks, West Bengal","hi":"सुंदरबन और बक्सा राष्ट्रीय उद्यान, पश्चिम बंगाल"}],"exp":{"en":"Nanda Devi and Valley of Flowers National Parks, Uttarakhand. UNESCO records both species from this high-altitude Himalayan World Heritage property, which combines the rugged Nanda Devi landscape with the alpine Valley of Flowers.","hi":"नंदा देवी और फूलों की घाटी राष्ट्रीय उद्यान, उत्तराखंड। UNESCO इस उच्च पर्वतीय हिमालयी विश्व धरोहर क्षेत्र में दोनों प्रजाति दर्ज करता है; यह ऊबड़-खाबड़ नंदा देवी परिदृश्य और अल्पाइन फूलों की घाटी को संयोजित करता है।"}},{"q":{"en":"Which protected area in Odisha is especially known for India's largest natural population of estuarine (saltwater) crocodiles?","hi":"ओडिशा का कौन-सा संरक्षित क्षेत्रफल भारत की सबसे बड़ा प्राकृतिक ज्वारनदमुखीय/खारे पानी के मगरमच्छ की जनसंख्या के लिए विशेष रूप से ज्ञात है?"},"a":{"en":"Bhitarkanika Wildlife Sanctuary–National Park, Odisha","hi":"भितरकनिका वन्यजीव अभयारण्य-राष्ट्रीय उद्यान, ओडिशा"},"o":[{"en":"Bhitarkanika Wildlife Sanctuary–National Park, Odisha","hi":"भितरकनिका वन्यजीव अभयारण्य-राष्ट्रीय उद्यान, ओडिशा"},{"en":"Sundarbans National Park, West Bengal","hi":"सुंदरबन राष्ट्रीय उद्यान, पश्चिम बंगाल"},{"en":"Chilika Wildlife Sanctuary, Odisha","hi":"चिल्का वन्यजीव अभयारण्य, ओडिशा"},{"en":"Gulf of Mannar, Tamil Nadu","hi":"मन्नार की खाड़ी, तमिलनाडु"}],"exp":{"en":"Bhitarkanika Wildlife Sanctuary–National Park landscape. Bhitarkanika's mangrove-estuarine ecosystem supports India's largest natural population of saltwater crocodiles and has long been a major crocodile-conservation landscape.","hi":"भितरकनिका वन्यजीव अभयारण्य-राष्ट्रीय उद्यान परिदृश्य। भितरकनिका मैंग्रोव-ज्वारनदमुखीय पारितंत्र भारत की सबसे बड़ा प्राकृतिक खारे पानी के मगरमच्छ की जनसंख्या समर्थन करता है और लंबी-स्थिति मगरमच्छ-संरक्षण परिदृश्य है।"}},{"q":{"en":"What is the correct naming sequence of India's first National Park?","hi":"भारत के पहले राष्ट्रीय उद्यान के नामकरण का सही क्रम क्या है?"},"a":{"en":"Hailey (1936) → Ramganga → Corbett (1956)","hi":"हेली (1936) → रामगंगा → कॉर्बेट (1956)"},"o":[{"en":"Hailey (1936) → Ramganga → Corbett (1956)","hi":"हेली (1936) → रामगंगा → कॉर्बेट (1956)"},{"en":"Hailey (1936) → Corbett → Ramganga (2021)","hi":"हेली (1936) → कॉर्बेट → रामगंगा (2021)"},{"en":"Kanha (1936) → Corbett (1973)","hi":"कान्हा (1936) → कॉर्बेट (1973)"},{"en":"Corbett (1936) → Hailey (1956)","hi":"कॉर्बेट (1936) → हेली (1956)"}],"exp":{"en":"India's first National Park was established as Hailey National Park in 1936, briefly renamed Ramganga National Park in 1954–55, and named Corbett National Park in 1955–56 (which remains its official name today).","hi":"भारत का पहला राष्ट्रीय उद्यान 1936 में हेली राष्ट्रीय उद्यान के रूप में स्थापित हुआ, 1954–55 में संक्षिप्त रूप से रामगंगा राष्ट्रीय उद्यान कहलाया और 1955–56 में कॉर्बेट राष्ट्रीय उद्यान नाम दिया गया।"}}]},{"title":{"en":"4. Tiger Census","hi":"4। बाघ जनगणना (बाघ गणना)"},"questions":[{"q":{"en":"What is India's total tiger population in the All India Tiger Estimation 2022?","hi":"अखिल भारतीय बाघ आकलन 2022 में भारत की कुल बाघ आबादी कितनी है?"},"a":{"en":"3,682 average (range 3,167–3,925)","hi":"3,682 औसत (सीमा 3,167–3,925)"},"o":[{"en":"3,682 average (range 3,167–3,925)","hi":"3,682 औसत (सीमा 3,167–3,925)"},{"en":"2,967 average","hi":"2,967 औसत"},{"en":"3,167 fixed count with no range","hi":"3,167 निश्चित संख्या"},{"en":"4,200 average","hi":"4,200 औसत"}],"exp":{"en":"The All India Tiger Estimation 2022 estimated an average of 3,682 tigers in India (range 3,167–3,925, where 3,167 is the minimum camera-trap-based figure and 3,925 the upper estimate).","hi":"अखिल भारतीय बाघ आकलन 2022 में भारत में औसतन 3,682 बाघ अनुमानित किए गए (सीमा 3,167–3,925, जहाँ 3,167 न्यूनतम कैमरा-ट्रैप आधारित संख्या है)।"}},{"q":{"en":"How many Tiger Reserves are there in India as of 2026?","hi":"2026 तक भारत में कुल कितने बाघ आरक्षित क्षेत्र हैं?"},"a":{"en":"58.","hi":"58।"},"o":[{"en":"58.","hi":"58।"},{"en":"54.","hi":"54।"},{"en":"50.","hi":"50।"},{"en":"62.","hi":"62।"}],"exp":{"en":"58. The current NTCA network comprises 58 reserves in 18 tiger-range States, with Madhav as the latest addition from 2025.","hi":"58। वर्तमान NTCA नेटवर्क में 18 बाघ-बहुल राज्यों के 58 आरक्षित क्षेत्र हैं; नवीनतम वृद्धि 2025 का माधव है।"}},{"q":{"en":"According to the Government of India's July 2026 backgrounder, what approximate share of the world's wild tigers lives in India?","hi":"सरकार का भारत के जुलाई 2026 की पृष्ठभूमि-सूचना के अनुसार विश्व के वन्य बाघ का लगभग हिस्सा भारत में कितना है?"},"a":{"en":"Nearly 70%.","hi":"लगभग 70%।"},"o":[{"en":"Nearly 70%.","hi":"लगभग 70%।"},{"en":"60%.","hi":"60%।"},{"en":"85%.","hi":"85%।"},{"en":"50%.","hi":"50%।"}],"exp":{"en":"Nearly 70%. This is a rounded global-share statement from the 2026 Government backgrounder; earlier official summaries around the 2022 estimate also used 'almost 75%'.","hi":"लगभग 70%। यह 2026 सरकार पृष्ठभूमि-सूचना का पूर्णांकित वैश्विक-हिस्सा कथन है; 2022 अनुमान के आसपास पहले आधिकारिक सारांशों ने 'लगभग 75%' शब्दावली भी उपयोग की थी।"}},{"q":{"en":"What is the total notified area of India's 58 Tiger Reserves?","hi":"भारत के 58 बाघ आरक्षित क्षेत्रों का कुल अधिसूचित क्षेत्रफल कितना है?"},"a":{"en":"84,487.83 km²","hi":"84,487.83 किमी²"},"o":[{"en":"84,487.83 km²","hi":"84,487.83 किमी²"},{"en":"75,769.83 km²","hi":"75,769.83 किमी²"},{"en":"68,518.80 km²","hi":"68,518.80 किमी²"},{"en":"1,03,408.00 km²","hi":"1,03,408.00 किमी²"}],"exp":{"en":"According to the current NTCA reserve list, India's 58 Tiger Reserves cover a total notified area of 84,487.83 km² across 18 tiger-range States (the older 75,769.83 km² figure belonged to an earlier smaller network).","hi":"वर्तमान NTCA सूची के अनुसार 18 बाघ-बहुल राज्यों में स्थित भारत के 58 बाघ आरक्षित क्षेत्रों का कुल अधिसूचित क्षेत्रफल 84,487.83 किमी² है।"}},{"q":{"en":"Which States have the highest tiger populations (2022 Estimation) in order?","hi":"2022 आकलन के अनुसार सर्वाधिक बाघ आबादी वाले राज्यों का सही क्रम क्या है?"},"a":{"en":"Madhya Pradesh > Karnataka > Uttarakhand","hi":"मध्य प्रदेश > कर्नाटक > उत्तराखंड"},"o":[{"en":"Madhya Pradesh > Karnataka > Uttarakhand","hi":"मध्य प्रदेश > कर्नाटक > उत्तराखंड"},{"en":"Karnataka > Madhya Pradesh > Maharashtra","hi":"कर्नाटक > मध्य प्रदेश > महाराष्ट्र"},{"en":"Uttarakhand > Madhya Pradesh > Karnataka","hi":"उत्तराखंड > मध्य प्रदेश > कर्नाटक"},{"en":"Madhya Pradesh > Maharashtra > Karnataka","hi":"मध्य प्रदेश > महाराष्ट्र > कर्नाटक"}],"exp":{"en":"In the 2022 All India Tiger Estimation, Madhya Pradesh ranked first (785), followed by Karnataka (563) and Uttarakhand (560), with Maharashtra fourth.","hi":"2022 अखिल भारतीय बाघ आकलन में मध्य प्रदेश (785) पहले, कर्नाटक (563) दूसरे और उत्तराखंड (560) तीसरे स्थान पर रहा; इसके बाद महाराष्ट्र है।"}},{"q":{"en":"Which State had the highest tiger population in 2022 and is called the 'Tiger State'?","hi":"2022 में सर्वाधिक बाघ आबादी वाला कौन-सा राज्य 'बाघ राज्य' कहलाता है?"},"a":{"en":"Madhya Pradesh (785 tigers)","hi":"मध्य प्रदेश (785 बाघ)"},"o":[{"en":"Madhya Pradesh (785 tigers)","hi":"मध्य प्रदेश (785 बाघ)"},{"en":"Karnataka (563 tigers)","hi":"कर्नाटक (563 बाघ)"},{"en":"Uttarakhand (560 tigers)","hi":"उत्तराखंड (560 बाघ)"},{"en":"West Bengal (Sundarbans)","hi":"पश्चिम बंगाल (सुंदरबन)"}],"exp":{"en":"Madhya Pradesh recorded 785 tigers in the 2022 estimation—the highest among Indian States—and is popularly called the 'Tiger State'.","hi":"मध्य प्रदेश ने 2022 आकलन में 785 बाघों के साथ भारतीय राज्यों में सर्वाधिक संख्या दर्ज की और इसे लोकप्रिय रूप से 'बाघ राज्य' कहा जाता है।"}}]},{"title":{"en":"5. Wildlife Conservation Projects — Timeline","hi":"5। वन्यजीव संरक्षण परियोजनाएं - समयरेखा"},"questions":[{"q":{"en":"When was Project Hangul initiated?","hi":"प्रोजेक्ट हंगुल कब आरंभ किया गया था?"},"a":{"en":"1970","hi":"1970"},"o":[{"en":"1970","hi":"1970"},{"en":"1972","hi":"1972"},{"en":"1973","hi":"1973"},{"en":"1987","hi":"1987"}],"exp":{"en":"Project Hangul was initiated in 1970 as a conservation initiative for the Kashmir stag (Hangul) after its population fell sharply in the Kashmir Valley.","hi":"प्रोजेक्ट हंगुल की शुरुआत 1970 में कश्मीर बारहसिंगा (हंगुल) के संरक्षण के लिए की गई थी, जब कश्मीर घाटी में इसकी संख्या में भारी गिरावट आई थी।"}},{"q":{"en":"When was the modern Project Lion announced by the Government of India?","hi":"भारत सरकार द्वारा आधुनिक प्रोजेक्ट लायन की घोषणा कब की गई?"},"a":{"en":"2020","hi":"2020"},"o":[{"en":"2020","hi":"2020"},{"en":"1972","hi":"1972"},{"en":"1992","hi":"1992"},{"en":"2009","hi":"2009"}],"exp":{"en":"The modern central Project Lion was announced in 2020 to pursue landscape-level conservation of the Asiatic lion in Gujarat (building on earlier Gir conservation efforts).","hi":"आधुनिक केंद्रीय प्रोजेक्ट लायन की घोषणा 2020 में गुजरात में एशियाई सिंह के परिदृश्य-स्तरीय संरक्षण के लिए की गई थी।"}},{"q":{"en":"When and from where was Project Tiger launched?","hi":"प्रोजेक्ट टाइगर कब और कहाँ से शुरू किया गया था?"},"a":{"en":"1 April 1973, Corbett National Park","hi":"1 अप्रैल 1973, कॉर्बेट राष्ट्रीय उद्यान"},"o":[{"en":"1 April 1973, Corbett National Park","hi":"1 अप्रैल 1973, कॉर्बेट राष्ट्रीय उद्यान"},{"en":"1 April 1973, Ranthambore National Park","hi":"1 अप्रैल 1973, रणथंभौर राष्ट्रीय उद्यान"},{"en":"5 June 1972, Kanha National Park","hi":"5 जून 1972, कान्हा राष्ट्रीय उद्यान"},{"en":"1 April 1975, Sundarbans National Park","hi":"1 अप्रैल 1975, सुंदरबन राष्ट्रीय उद्यान"}],"exp":{"en":"Project Tiger was launched on 1 April 1973 at Jim Corbett National Park (Uttarakhand) as a Centrally Sponsored Scheme with nine initial tiger reserves.","hi":"प्रोजेक्ट टाइगर की शुरुआत 1 अप्रैल 1973 को जिम कॉर्बेट राष्ट्रीय उद्यान (उत्तराखंड) से नौ प्रारंभिक बाघ आरक्षित क्षेत्रों के साथ की गई थी।"}},{"q":{"en":"When was India's Crocodile Conservation Project launched?","hi":"भारत का मगरमच्छ संरक्षण परियोजना कब शुरुआत हुआ?"},"a":{"en":"In 1975.","hi":"1975 में।"},"o":[{"en":"In 1975.","hi":"1975 में।"},{"en":"In 1973.","hi":"1973 में।"},{"en":"In 1977.","hi":"1977 में।"},{"en":"In 1987.","hi":"1987 में।"}],"exp":{"en":"In 1975. The Crocodile Conservation Project began in the mid-1970s to recover gharial, mugger and saltwater crocodile populations through habitat protection, captive breeding and release.","hi":"1975 में। मगरमच्छ संरक्षण परियोजना 1970 के दशक के मध्य में घड़ियाल, मगरमच्छ और खारे पानी के मगरमच्छ की जनसंख्या पुनर्प्राप्त करने के लिए आवास संरक्षण, बंदी प्रजनन और पुनर्मुक्ति की पद्धतियों के साथ शुरू हुआ।"}},{"q":{"en":"Which 1977 milestone is central to Sangai (Manipur brow-antlered deer) conservation?","hi":"संगाई (मणिपुर हिरण) संरक्षण से जुड़ा 1977 का प्रमुख पड़ाव कौन-सा है?"},"a":{"en":"Keibul Lamjao National Park notified","hi":"केइबुल लामजाओ राष्ट्रीय उद्यान की अधिसूचना"},"o":[{"en":"Keibul Lamjao National Park notified","hi":"केइबुल लामजाओ राष्ट्रीय उद्यान की अधिसूचना"},{"en":"Project Tiger shifted to Manipur","hi":"प्रोजेक्ट टाइगर का मणिपुर स्थानांतरण"},{"en":"First discovery of Sangai species","hi":"संगाई प्रजाति की पहली खोज"},{"en":"Creation of Manipur Biosphere Reserve","hi":"मणिपुर बायोस्फीयर रिजर्व की स्थापना"}],"exp":{"en":"Keibul Lamjao National Park (on Loktak Lake) was notified in 1977 to protect the Sangai's unique floating 'phumdi' habitat after its very low 1975 census.","hi":"1975 की अत्यंत कम गणना के बाद संगाई के अद्वितीय तैरते 'फुमदी' आवास के संरक्षण के लिए 1977 में लोकटक झील पर केइबुल लामजाओ राष्ट्रीय उद्यान अधिसूचित किया गया।"}},{"q":{"en":"When was the greater one-horned rhinoceros first reintroduced to Dudhwa National Park?","hi":"भारतीय एक-सींग वाले गैंडे को दुधवा राष्ट्रीय उद्यान में पहली बार कब पुनः बसाया गया?"},"a":{"en":"1984 (second translocation in 1985)","hi":"1984 (दूसरा स्थानांतरण 1985 में)"},"o":[{"en":"1984 (second translocation in 1985)","hi":"1984 (दूसरा स्थानांतरण 1985 में)"},{"en":"1975 (under Crocodile Project)","hi":"1975 (मगरमच्छ परियोजना के तहत)"},{"en":"1992 (under Project Elephant)","hi":"1992 (प्रोजेक्ट एलिफेंट के तहत)"},{"en":"2009 (under Project Snow Leopard)","hi":"2009 (प्रोजेक्ट स्नो लेपर्ड के तहत)"}],"exp":{"en":"The first phase of rhino translocation to Dudhwa National Park took place in 1984, followed by a second translocation in 1985, establishing a population outside north-eastern India.","hi":"दुधवा राष्ट्रीय उद्यान में गैंडा पुनर्स्थापन का पहला चरण 1984 में और दूसरा स्थानांतरण 1985 में हुआ, जिससे पूर्वोत्तर भारत के बाहर इसकी आबादी स्थापित हुई।"}},{"q":{"en":"When was Project Elephant launched?","hi":"परियोजना हाथी कब शुरुआत हुआ?"},"a":{"en":"In 1992.","hi":"1992 में।"},"o":[{"en":"In 1992.","hi":"1992 में।"},{"en":"In 1987.","hi":"1987 में।"},{"en":"In 1994.","hi":"1994 में।"},{"en":"In 1999.","hi":"1999 में।"}],"exp":{"en":"In 1992. Project Elephant is a centrally sponsored conservation initiative focused on Asian elephants, their habitats and corridors, and human-elephant conflict management.","hi":"1992 में। परियोजना हाथी केंद्र प्रायोजित संरक्षण पहल है जो एशियाई हाथी, आवासों/गलियारे और मानवीय-हाथी संघर्ष प्रबंधन पर केंद्रित है।"}},{"q":{"en":"When did the Red Panda Conservation Breeding Project at Darjeeling Zoo begin?","hi":"दार्जिलिंग चिड़ियाघर में लाल पांडा संरक्षण प्रजनन परियोजना कब शुरू हुई?"},"a":{"en":"1990","hi":"1990"},"o":[{"en":"1990","hi":"1990"},{"en":"1994","hi":"1994"},{"en":"1987","hi":"1987"},{"en":"2009","hi":"2009"}],"exp":{"en":"The Red Panda Conservation Breeding Project at Padmaja Naidu Himalayan Zoological Park, Darjeeling began in 1990; its first planned successful captive breeding occurred in 1994.","hi":"दार्जिलिंग स्थित पद्मजा नायडू हिमालयन जूलॉजिकल पार्क में लाल पांडा संरक्षण प्रजनन परियोजना 1990 में शुरू हुई थी; इसका पहला नियोजित सफल प्रजनन 1994 में हुआ।"}},{"q":{"en":"In which year did Darjeeling Zoo achieve its first planned successful Red Panda breeding?","hi":"दार्जिलिंग चिड़ियाघर में लाल पांडा का पहला नियोजित सफल प्रजनन किस वर्ष हुआ?"},"a":{"en":"1994","hi":"1994"},"o":[{"en":"1994","hi":"1994"},{"en":"1990","hi":"1990"},{"en":"1999","hi":"1999"},{"en":"2009","hi":"2009"}],"exp":{"en":"While the breeding project began in 1990, the first planned successful breeding of the Red Panda at Darjeeling Zoo took place in 1994.","hi":"यद्यपि प्रजनन परियोजना 1990 में शुरू हुई थी, दार्जिलिंग चिड़ियाघर में लाल पांडा का पहला नियोजित सफल प्रजनन 1994 में हुआ था।"}},{"q":{"en":"When was the Government of India–UNDP Sea Turtle Conservation Project launched?","hi":"भारत सरकार-UNDP समुद्री कछुआ संरक्षण परियोजना कब शुरू हुई?"},"a":{"en":"In November 1999.","hi":"नवंबर 1999 में।"},"o":[{"en":"In November 1999.","hi":"नवंबर 1999 में।"},{"en":"In 1994.","hi":"1994 में।"},{"en":"In 2009.","hi":"2009 में।"},{"en":"In 2013.","hi":"2013 में।"}],"exp":{"en":"In November 1999. The national sea-turtle project was launched with UNDP collaboration and WII as the implementing agency, covering multiple coastal States with special focus on Odisha.","hi":"नवंबर 1999 में। राष्ट्रीय समुद्री-कछुआ परियोजना UNDP सहयोग और WII क्रियान्वयन संस्था के सहयोग से शुरू हुई, अनेक तटीय राज्यों में, जिसमें ओडिशा पर विशेष ध्यान था।"}},{"q":{"en":"When was Project Snow Leopard launched in India?","hi":"भारत में परियोजना हिम तेंदुआ कब शुरुआत हुआ?"},"a":{"en":"20 January 2009","hi":"20 जनवरी 2009"},"o":[{"en":"20 January 2009","hi":"20 जनवरी 2009"},{"en":"15 August 1999","hi":"15 अगस्त 1999"},{"en":"10 May 2013","hi":"10 मई 2013"},{"en":"12 April 1992","hi":"12 अप्रैल 1992"}],"exp":{"en":"20 January 2009. Project Snow Leopard adopted a landscape and community-participation approach for high-altitude Himalayan ecosystems rather than focusing on isolated protected areas alone.","hi":"20 जनवरी 2009। परियोजना हिम तेंदुआ ने उच्च पर्वतीय हिमालयी पारितंत्र के लिए परिदृश्य और समुदाय-भागीदारी दृष्टिकोण अपनाया की, केवल पृथक संरक्षित क्षेत्रों पर केंद्र नहीं किया।"}},{"q":{"en":"By which year had the Great Indian Bustard already been included in the central Species Recovery Programme and a conservation Task Force constituted?","hi":"किस वर्ष तक महान भारतीय सोनचिरैया को केंद्रीय प्रजाति पुनर्प्राप्ति कार्यक्रम में शामिल किया जा चुका था और संरक्षण कार्य प्रभाव गठित हो चुका था?"},"a":{"en":"By 2011.","hi":"2011 तक।"},"o":[{"en":"By 2011.","hi":"2011 तक।"},{"en":"Only after 2020.","hi":"केवल 2020 के बाद।"},{"en":"In 1973 under Project Tiger.","hi":"1973 में प्रोजेक्ट टाइगर के अंतर्गत।"},{"en":"In 1992 under Project Elephant.","hi":"1992 में परियोजना हाथी के अंतर्गत।"}],"exp":{"en":"By 2011. Great Indian Bustard conservation predates the recent captive-breeding project: by 2011 the species was already under the central Species Recovery Programme and a Task Force had been constituted.","hi":"2011 तक। महान भारतीय सोनचिरैया संरक्षण हालिया बंदी-प्रजनन परियोजना से पहले की है: 2011 तक प्रजाति केंद्रीय प्रजाति पुनर्प्राप्ति कार्यक्रम में थी और कार्य प्रभाव गठित हो चुका था।"}},{"q":{"en":"What is the gap between the start years of Project Hangul and Project Tiger?","hi":"प्रोजेक्ट हंगुल और प्रोजेक्ट टाइगर के आरंभ होने के वर्षों में कितना अंतर है?"},"a":{"en":"3 years (Hangul 1970, Tiger 1973)","hi":"3 वर्ष (हंगुल 1970, टाइगर 1973)"},"o":[{"en":"3 years (Hangul 1970, Tiger 1973)","hi":"3 वर्ष (हंगुल 1970, टाइगर 1973)"},{"en":"5 years (Tiger 1970, Hangul 1975)","hi":"5 वर्ष (टाइगर 1970, हंगुल 1975)"},{"en":"0 years (both began in 1973)","hi":"0 वर्ष (दोनों 1973 में शुरू)"},{"en":"10 years (Hangul 1963, Tiger 1973)","hi":"10 वर्ष (हंगुल 1963, टाइगर 1973)"}],"exp":{"en":"Project Hangul started in 1970, three years before Project Tiger was launched in 1973.","hi":"प्रोजेक्ट हंगुल 1970 में शुरू हुआ था, जो 1973 में शुरू हुए प्रोजेक्ट टाइगर से 3 वर्ष पहले था।"}}]},{"title":{"en":"7. Common Confusions & Reverse Questions","hi":"7। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"Which was India's first Biosphere Reserve, and which is the largest by area?","hi":"भारत का पहला जैवमंडल आरक्षित क्षेत्र कौन-सा था और क्षेत्रफल में सबसे बड़ा कौन-सा है?"},"a":{"en":"First: Nilgiri (1986); Largest: Kachchh","hi":"पहला: नीलगिरि (1986); सबसे बड़ा: कच्छ"},"o":[{"en":"First: Nilgiri (1986); Largest: Kachchh","hi":"पहला: नीलगिरि (1986); सबसे बड़ा: कच्छ"},{"en":"First: Kachchh; Largest: Nilgiri","hi":"पहला: कच्छ; सबसे बड़ा: नीलगिरि"},{"en":"First: Sundarbans; Largest: Nanda Devi","hi":"पहला: सुंदरबन; सबसे बड़ा: नंदा देवी"},{"en":"Nilgiri is both the first and largest","hi":"नीलगिरि पहला और सबसे बड़ा दोनों है"}],"exp":{"en":"Nilgiri (1986) was India's first nationally designated Biosphere Reserve, whereas Kachchh (Great Rann of Kutch, ~12,454 km²) is the largest by notified area.","hi":"नीलगिरि (1986) भारत का पहला राष्ट्रीय बायोस्फीयर रिजर्व था, जबकि कच्छ (कच्छ का महान रण, ~12,454 किमी²) क्षेत्रफल के आधार पर सबसे बड़ा है।"}},{"q":{"en":"Which conservation project started first: Project Hangul or Project Tiger?","hi":"प्रोजेक्ट हंगुल और प्रोजेक्ट टाइगर में से कौन पहले शुरू हुआ?"},"a":{"en":"Project Hangul (1970, 3 years earlier)","hi":"प्रोजेक्ट हंगुल (1970, 3 वर्ष पहले)"},"o":[{"en":"Project Hangul (1970, 3 years earlier)","hi":"प्रोजेक्ट हंगुल (1970, 3 वर्ष पहले)"},{"en":"Project Tiger (1973, 2 years earlier)","hi":"प्रोजेक्ट टाइगर (1973, 2 वर्ष पहले)"},{"en":"Both started together in 1973","hi":"दोनों एक साथ 1973 में शुरू हुए"},{"en":"Project Hangul (1965, 8 years earlier)","hi":"प्रोजेक्ट हंगुल (1965, 8 वर्ष पहले)"}],"exp":{"en":"Project Hangul began in 1970, preceding Project Tiger (1973) by 3 years.","hi":"प्रोजेक्ट हंगुल 1970 में शुरू हुआ था, जो प्रोजेक्ट टाइगर (1973) से 3 वर्ष पहले था।"}},{"q":{"en":"Which Tiger Reserves have the largest and smallest total notified areas in the NTCA table?","hi":"वर्तमान NTCA तालिका में सबसे बड़े और सबसे छोटे कुल अधिसूचित क्षेत्रफल वाले बाघ आरक्षित क्षेत्र कौन-से हैं?"},"a":{"en":"Largest: Nagarjunsagar-Srisailam; Smallest: Orang","hi":"सबसे बड़ा: नागार्जुनसागर-श्रीशैलम; सबसे छोटा: ओरांग"},"o":[{"en":"Largest: Nagarjunsagar-Srisailam; Smallest: Orang","hi":"सबसे बड़ा: नागार्जुनसागर-श्रीशैलम; सबसे छोटा: ओरांग"},{"en":"Largest: Amrabad; Smallest: Bor","hi":"सबसे बड़ा: अमराबाद; सबसे छोटा: बोर"},{"en":"Largest: Manas; Smallest: Ranipur","hi":"सबसे बड़ा: मानस; सबसे छोटा: रानीपुर"},{"en":"Largest: Corbett; Smallest: Buxa","hi":"सबसे बड़ा: कॉर्बेट; सबसे छोटा: बक्सा"}],"exp":{"en":"In the current NTCA table, Nagarjunsagar-Srisailam (Andhra Pradesh, 3,296.31 km²) has the largest total notified area, and Orang (Assam, 492.46 km²) has the smallest.","hi":"वर्तमान NTCA तालिका में नागार्जुनसागर-श्रीशैलम (आंध्र प्रदेश, 3,296.31 किमी²) का कुल क्षेत्रफल सबसे बड़ा और ओरांग (असम, 492.46 किमी²) का सबसे छोटा है।"}},{"q":{"en":"Which is the oldest Tiger Reserve in Maharashtra under Project Tiger?","hi":"प्रोजेक्ट टाइगर के अंतर्गत महाराष्ट्र का सबसे पुराना बाघ आरक्षित क्षेत्र कौन-सा है?"},"a":{"en":"Melghat Tiger Reserve (1973–74)","hi":"मेलघाट बाघ आरक्षित क्षेत्र (1973–74)"},"o":[{"en":"Melghat Tiger Reserve (1973–74)","hi":"मेलघाट बाघ आरक्षित क्षेत्र (1973–74)"},{"en":"Tadoba-Andhari Tiger Reserve","hi":"ताडोबा-अंधारी बाघ आरक्षित क्षेत्र"},{"en":"Bor Tiger Reserve (2014)","hi":"बोर बाघ आरक्षित क्षेत्र (2014)"},{"en":"Pench Tiger Reserve, Maharashtra","hi":"पेंच बाघ आरक्षित क्षेत्र, महाराष्ट्र"}],"exp":{"en":"Melghat Tiger Reserve was one of Project Tiger's original nine reserves included in 1973–74, making it Maharashtra's oldest Tiger Reserve.","hi":"मेलघाट बाघ आरक्षित क्षेत्र 1973–74 में प्रोजेक्ट टाइगर के मूल नौ आरक्षित क्षेत्रों में शामिल था, इसलिए यह महाराष्ट्र का सबसे पुराना बाघ आरक्षित क्षेत्र है।"}}]}],"5. Climate Change / जलवायु परिवर्तन":[{"title":{"en":"1. Overview / Chapter Snapshot","hi":"1। अवलोकन / अध्याय स्नैपशॉट"},"questions":[{"q":{"en":"Which major topics are covered under Climate Change?","hi":"जलवायु परिवर्तन विषय के अंतर्गत किन प्रमुख विषयों का अध्ययन किया जाता है?"},"a":{"en":"Causes, mitigation, greenhouse effect, ozone, NAPCC & COPs","hi":"कारण, शमन, ग्रीनहाउस प्रभाव, ओजोन, NAPCC व COPs"},"o":[{"en":"Causes, mitigation, greenhouse effect, ozone, NAPCC & COPs","hi":"कारण, शमन, ग्रीनहाउस प्रभाव, ओजोन, NAPCC व COPs"},{"en":"Stratospheric pressure, wind belts, jet streams & monsoons","hi":"समतापमंडलीय दाब, पवन पेटियाँ, जेट स्ट्रीम व मानसून"},{"en":"Indian agricultural laws, crop subsidies, irrigation & land reform","hi":"भारतीय कृषि कानून, फसल सब्सिडी, सिंचाई व भूमि सुधार"},{"en":"Endangered mammal anatomy, skeletal traits, genetics & reproduction","hi":"संकटग्रस्त स्तनधारी शरीर रचना, कंकाल गुण, आनुवंशिकी व प्रजनन"}],"exp":{"en":"This chapter covers climate change causes and mitigation, the greenhouse effect and global warming, ozone-layer depletion, India's NAPCC missions, and major international milestones through COP30 (Belém, 2025).","hi":"इस अध्याय में जलवायु परिवर्तन के कारण और शमन, ग्रीनहाउस प्रभाव व वैश्विक उष्मीकरण, ओजोन परत क्षय, भारत के NAPCC मिशन तथा COP30 (बेलेम, 2025) तक के प्रमुख अंतरराष्ट्रीय पड़ाव शामिल हैं।"}},{"q":{"en":"When was the Montreal Protocol signed?","hi":"मॉन्ट्रियल प्रोटोकॉल (मॉन्ट्रियल प्रोटोकॉल) पर हस्ताक्षर कब हुए थे?"},"a":{"en":"16 September 1987.","hi":"16 सितंबर 1987।"},"o":[{"en":"16 September 1987.","hi":"16 सितंबर 1987।"},{"en":"22 March 1985.","hi":"22 मार्च 1985।"},{"en":"5 June 1992.","hi":"5 जून 1992।"},{"en":"1 January 1989.","hi":"1 जनवरी 1989।"}],"exp":{"en":"The Montreal Protocol followed the 1985 Vienna Convention. It was adopted on 16 September 1987 and entered into force on 1 January 1989.","hi":"मॉन्ट्रियल प्रोटोकॉल, 1985 वियना अभिसमय के बाद आया। यह 16 सितंबर 1987 को अपनाया गया और 1 जनवरी 1989 को प्रभावी हुआ।"}},{"q":{"en":"When was the UNFCCC adopted and opened for signature at the Rio Earth Summit?","hi":"UNFCCC को कब अपनाया गया और रियो पृथ्वी शिखर सम्मेलन में हस्ताक्षर के लिए कब खोला गया?"},"a":{"en":"Adopted 9 May 1992; Rio June 1992","hi":"अंगीकरण 9 मई 1992; रियो जून 1992"},"o":[{"en":"Adopted 9 May 1992; Rio June 1992","hi":"अंगीकरण 9 मई 1992; रियो जून 1992"},{"en":"Adopted and enforced in June 1972","hi":"जून 1972 में अपनाया व लागू हुआ"},{"en":"Adopted at Kyoto in December 1997","hi":"दिसंबर 1997 में क्योटो में अपनाया गया"},{"en":"Adopted at Paris in December 2015","hi":"दिसंबर 2015 में पेरिस में अपनाया गया"}],"exp":{"en":"The UNFCCC was adopted in New York on 9 May 1992, opened for signature at the Rio Earth Summit in June 1992, and entered into force in 1994.","hi":"UNFCCC 9 मई 1992 को न्यूयॉर्क में अपनाया गया, जून 1992 के रियो पृथ्वी शिखर सम्मेलन में हस्ताक्षर के लिए खुला और 1994 में प्रभावी हुआ।"}},{"q":{"en":"How many National Missions are under India's NAPCC?","hi":"भारत के NAPCC के अंतर्गत कितने राष्ट्रीय मिशन हैं?"},"a":{"en":"8 original; 9 on current MoEFCC dashboard","hi":"8 मूल; वर्तमान MoEFCC डैशबोर्ड पर 9"},"o":[{"en":"8 original; 9 on current MoEFCC dashboard","hi":"8 मूल; वर्तमान MoEFCC डैशबोर्ड पर 9"},{"en":"7 original; 8 on current MoEFCC dashboard","hi":"7 मूल; वर्तमान MoEFCC डैशबोर्ड पर 8"},{"en":"5 original; 6 on current MoEFCC dashboard","hi":"5 मूल; वर्तमान MoEFCC डैशबोर्ड पर 6"},{"en":"10 original; 12 on current MoEFCC dashboard","hi":"10 मूल; वर्तमान MoEFCC डैशबोर्ड पर 12"}],"exp":{"en":"The original 2008 NAPCC had 8 core missions. The current MoEFCC dashboard shows 9 missions after adding the National Mission on Climate Change and Health.","hi":"मूल 2008 NAPCC में 8 प्रमुख मिशन थे। जलवायु परिवर्तन और स्वास्थ्य पर राष्ट्रीय मिशन जुड़ने के बाद वर्तमान MoEFCC डैशबोर्ड पर 9 मिशन दिखते हैं।"}},{"q":{"en":"Which is the latest CoP conference mentioned?","hi":"उल्लिखित नवीनतम COP सम्मेलन कौन सा है?"},"a":{"en":"COP30 — Belém, Brazil, 2025.","hi":"COP30 - Belém, ब्राज़ील, 2025।"},"o":[{"en":"COP30 — Belém, Brazil, 2025.","hi":"COP30 - Belém, ब्राज़ील, 2025।"},{"en":"COP29 — Baku, Azerbaijan, 2024.","hi":"COP29 - बाकू, अज़रबैजान, 2024।"},{"en":"COP28 — Dubai, UAE, 2023.","hi":"COP28 - दुबई, UAE, 2023।"},{"en":"COP31 — 2026, already completed.","hi":"COP31 - 2026, पहले से संपन्न।"}],"exp":{"en":"COP30 was held in Belém, Brazil, in November 2025. As of September 2026 it is the latest completed COP; COP31 is later in 2026 and therefore not yet a completed conference.","hi":"COP30 नवंबर 2025 में Belém, ब्राज़ील में आयोजित हुई। सितंबर 2026 तक यही नवीनतम संपन्न COP है; COP31 बाद में 2026 है, इसलिए अभी संपन्न सम्मेलन नहीं है।"}}]},{"title":{"en":"2. Climate Change — Causes & Mitigation","hi":"2। जलवायु परिवर्तन - कारण और शमन (शमन)"},"questions":[{"q":{"en":"Which of the following are natural causes of climate change?","hi":"निम्नलिखित में से जलवायु परिवर्तन के प्राकृतिक कारण कौन-से हैं?"},"a":{"en":"Solar output, volcanic eruptions, orbital variations","hi":"सौर विकिरण, ज्वालामुखी विस्फोट, कक्षीय परिवर्तन"},"o":[{"en":"Solar output, volcanic eruptions, orbital variations","hi":"सौर विकिरण, ज्वालामुखी विस्फोट, कक्षीय परिवर्तन"},{"en":"Fossil-fuel burning and deforestation","hi":"जीवाश्म ईंधन दहन और वनोन्मूलन"},{"en":"Industrial emissions and livestock farming","hi":"औद्योगिक उत्सर्जन और पशुपालन"},{"en":"Stratospheric ozone depletion by CFCs","hi":"CFC द्वारा समतापमंडलीय ओजोन क्षय"}],"exp":{"en":"Natural climate drivers include changes in solar output, major volcanic eruptions (causing short-term cooling via aerosols), long-term variations in Earth's orbit/tilt, and internal climate variability.","hi":"प्राकृतिक जलवायु कारकों में सौर विकिरण में परिवर्तन, बड़े ज्वालामुखी विस्फोट (एरोसोल से अल्पकालिक शीतलन), पृथ्वी की कक्षा/झुकाव में दीर्घकालिक बदलाव और आंतरिक जलवायु परिवर्तनशीलता शामिल हैं।"}},{"q":{"en":"Which of the following are major human-induced causes of climate change?","hi":"निम्नलिखित में से जलवायु परिवर्तन के प्रमुख मानव-निर्मित कारण कौन-से हैं?"},"a":{"en":"Fossil fuels, deforestation, industry, agriculture, waste","hi":"जीवाश्म ईंधन, वनोन्मूलन, उद्योग, कृषि, अपशिष्ट"},"o":[{"en":"Fossil fuels, deforestation, industry, agriculture, waste","hi":"जीवाश्म ईंधन, वनोन्मूलन, उद्योग, कृषि, अपशिष्ट"},{"en":"Changes in Earth's axial tilt and orbit","hi":"पृथ्वी के अक्षीय झुकाव और कक्षा में बदलाव"},{"en":"Major volcanic eruptions and solar cycles","hi":"बड़े ज्वालामुखी विस्फोट और सौर चक्र"},{"en":"Oceanic tectonic plate movements","hi":"महासागरीय विवर्तनिक प्लेट गतियाँ"}],"exp":{"en":"Modern warming is driven primarily by human activities that raise greenhouse-gas concentrations: fossil-fuel combustion (CO2), deforestation/land-use change, industrial processes, agriculture/livestock (CH4, N2O), and waste.","hi":"आधुनिक वैश्विक उष्मीकरण मुख्यतः मानव गतिविधियों से प्रेरित है: जीवाश्म ईंधन दहन (CO2), वनोन्मूलन/भूमि-उपयोग परिवर्तन, औद्योगिक प्रक्रियाएँ, कृषि/पशुधन (CH4, N2O) और अपशिष्ट।"}},{"q":{"en":"Which measures effectively mitigate climate change?","hi":"निम्नलिखित में से कौन-से उपाय जलवायु परिवर्तन को प्रभावी ढंग से कम (Mitigate) करते हैं?"},"a":{"en":"Clean energy, efficiency, electrification, forest protection","hi":"स्वच्छ ऊर्जा, दक्षता, विद्युतीकरण, वन संरक्षण"},"o":[{"en":"Clean energy, efficiency, electrification, forest protection","hi":"स्वच्छ ऊर्जा, दक्षता, विद्युतीकरण, वन संरक्षण"},{"en":"Switching off lights for one hour annually","hi":"वर्ष में केवल एक घंटा बत्तियाँ बंद करना"},{"en":"Increasing coal combustion to boost efficiency","hi":"दक्षता हेतु कोयला दहन बढ़ाना"},{"en":"Clearing forests for extra farmland","hi":"अतिरिक्त कृषि भूमि के लिए वन साफ करना"}],"exp":{"en":"Climate mitigation requires structural emission cuts—clean energy, energy efficiency, electrification, methane reduction, forest/ecosystem protection, carbon pricing, and carbon capture/removal where suitable.","hi":"जलवायु शमन के लिए संरचनात्मक उत्सर्जन कटौती आवश्यक है—स्वच्छ ऊर्जा, ऊर्जा दक्षता, विद्युतीकरण, मीथेन में कमी, वन व पारितंत्र संरक्षण, कार्बन मूल्य-निर्धारण और उपयुक्त क्षेत्रों में कार्बन अवशोषण।"}}]},{"title":{"en":"3. Greenhouse Effect & Global Warming","hi":"3। ग्रीनहाउस प्रभाव और ग्लोबल वार्मिंग"},"questions":[{"q":{"en":"What is the Greenhouse Effect?","hi":"ग्रीनहाउस प्रभाव (Greenhouse Effect) क्या है?"},"a":{"en":"GHGs trapping outgoing infrared radiation","hi":"ग्रीनहाउस गैसों द्वारा अवरक्त विकिरण रोकना"},"o":[{"en":"GHGs trapping outgoing infrared radiation","hi":"ग्रीनहाउस गैसों द्वारा अवरक्त विकिरण रोकना"},{"en":"Direct heating of Earth by ozone holes","hi":"ओजोन छिद्र द्वारा पृथ्वी का सीधा गर्म होना"},{"en":"An artificial process caused only by industry","hi":"केवल उद्योगों के कारण होने वाली कृत्रिम प्रक्रिया"},{"en":"Complete reflection of sunlight back to space","hi":"सूर्यप्रकाश का अंतरिक्ष में पूर्ण परावर्तन"}],"exp":{"en":"The greenhouse effect is a natural process in which greenhouse gases absorb and re-emit outgoing infrared radiation from Earth's surface, keeping the planet habitable.","hi":"ग्रीनहाउस प्रभाव एक प्राकृतिक प्रक्रिया है जिसमें ग्रीनहाउस गैसें पृथ्वी की सतह से बाहर जाने वाले अवरक्त विकिरण को अवशोषित व पुनः उत्सर्जित कर पृथ्वी को गर्म रखती हैं।"}},{"q":{"en":"Which is the most important long-lived anthropogenic greenhouse gas driving current global warming?","hi":"वर्तमान वैश्विक उष्मीकरण को प्रेरित करने वाला सबसे महत्वपूर्ण दीर्घजीवी मानवजनित ग्रीनहाउस गैस कौन-सा है?"},"a":{"en":"Carbon dioxide (CO2).","hi":"कार्बन डाइऑक्साइड (CO2)।"},"o":[{"en":"Carbon dioxide (CO2).","hi":"कार्बन डाइऑक्साइड (CO2)।"},{"en":"Sulfur dioxide (SO2).","hi":"सल्फर डाइऑक्साइड (SO2)।"},{"en":"Carbon monoxide (CO).","hi":"कार्बन मोनोऑक्साइड (CO)।"},{"en":"Molecular oxygen (O2).","hi":"आणविक ऑक्सीजन (O2)।"}],"exp":{"en":"Water vapour is the strongest contributor to the natural greenhouse effect, but it mainly acts as a feedback. CO2 is the most important long-lived greenhouse gas driving human-caused warming.","hi":"जलवाष्प प्राकृतिक ग्रीनहाउस प्रभाव का सबसे प्रबल योगदानकर्ता है, लेकिन मुख्यतः प्रतिपुष्टि की तरह अधिनियम करता है। CO2 मानवजनित उष्मीकरण को प्रेरित करने वाला सबसे महत्वपूर्ण दीर्घजीवी ग्रीनहाउस गैस है।"}},{"q":{"en":"What are major sources of Methane (CH4)?","hi":"मीथेन (CH4) के प्रमुख स्रोत क्या हैं?"},"a":{"en":"Wetlands, rice paddies, livestock, landfills, fossil fuels","hi":"आर्द्रभूमि, धान के खेत, पशुधन, लैंडफिल, जीवाश्म ईंधन"},"o":[{"en":"Wetlands, rice paddies, livestock, landfills, fossil fuels","hi":"आर्द्रभूमि, धान के खेत, पशुधन, लैंडफिल, जीवाश्म ईंधन"},{"en":"Dry deserts, sandstorms, granite rocks, dust clouds","hi":"शुष्क मरुस्थल, धूल भरी आँधियाँ, ग्रेनाइट चट्टानें, धूल बादल"},{"en":"Nuclear reactors, solar panels, wind turbines, hydro dams","hi":"परमाणु रिएक्टर, सौर पैनल, पवन टरबाइन, जलविद्युत बाँध"},{"en":"Ocean salt spray, sea ice, glacial melt, tides","hi":"समुद्री नमक छिड़काव, समुद्री बर्फ, हिमनद पिघलाव, ज्वार"}],"exp":{"en":"Methane is emitted from natural wetlands as well as human sources including rice cultivation, livestock, landfills, and fossil-fuel extraction and transport.","hi":"मीथेन प्राकृतिक आर्द्रभूमियों के साथ-साथ धान की खेती, पशुधन, लैंडफिल और जीवाश्म ईंधन के दोहन व परिवहन जैसे मानवीय स्रोतों से उत्सर्जित होती है।"}},{"q":{"en":"Which gases are major greenhouse gases?","hi":"निम्नलिखित में से प्रमुख ग्रीनहाउस गैसें कौन-सी हैं?"},"a":{"en":"Water vapour, CO2, CH4, N2O, O3, HFCs","hi":"जलवाष्प, CO2, CH4, N2O, O3, HFCs"},"o":[{"en":"Water vapour, CO2, CH4, N2O, O3, HFCs","hi":"जलवाष्प, CO2, CH4, N2O, O3, HFCs"},{"en":"CO2, CO, SO2, NO, H2S, NH3","hi":"CO2, CO, SO2, NO, H2S, NH3"},{"en":"Nitrogen, oxygen, argon, neon, helium, krypton","hi":"नाइट्रोजन, ऑक्सीजन, आर्गन, नियॉन, हीलियम, क्रिप्टन"},{"en":"Water vapour, hydrogen, nitrogen, oxygen, argon, neon","hi":"जलवाष्प, हाइड्रोजन, नाइट्रोजन, ऑक्सीजन, आर्गन, नियॉन"}],"exp":{"en":"Major atmospheric greenhouse gases include water vapour, CO2, CH4, N2O, and ozone (O3), plus fluorinated gases (HFCs, PFCs, SF6). CO and SO2 are not standard greenhouse gases.","hi":"प्रमुख वायुमंडलीय ग्रीनहाउस गैसों में जलवाष्प, CO2, CH4, N2O और ओजोन (O3) तथा फ्लोरीनयुक्त गैसें (HFCs, PFCs, SF6) शामिल हैं। CO और SO2 मानक ग्रीनहाउस गैसें नहीं हैं।"}},{"q":{"en":"What is Global Warming?","hi":"ग्लोबल वार्मिंग (वैश्विक उष्मीकरण) क्या है?"},"a":{"en":"Long-term rise in global average surface temperature","hi":"वैश्विक औसत सतह तापमान में दीर्घकालिक वृद्धि"},"o":[{"en":"Long-term rise in global average surface temperature","hi":"वैश्विक औसत सतह तापमान में दीर्घकालिक वृद्धि"},{"en":"Any single unusually hot summer day","hi":"गर्मियों का कोई एक असामान्य गर्म दिन"},{"en":"Depletion of stratospheric ozone only","hi":"केवल समतापमंडलीय ओजोन का क्षय"},{"en":"Short-term weather change lasting a few hours","hi":"कुछ घंटों का अल्पकालिक मौसमी बदलाव"}],"exp":{"en":"Global warming is the long-term rise in Earth's global average surface temperature, driven primarily in the modern era by human-caused greenhouse-gas increases.","hi":"वैश्विक उष्मीकरण पृथ्वी के वैश्विक औसत सतह तापमान में दीर्घकालिक वृद्धि है, जो आधुनिक युग में मुख्यतः मानवजनित ग्रीनहाउस गैसों की वृद्धि से प्रेरित है।"}},{"q":{"en":"Which of the following are major impacts of Global Warming?","hi":"निम्नलिखित में से ग्लोबल वार्मिंग के प्रमुख प्रभाव कौन-से हैं?"},"a":{"en":"Heat extremes, glacier melt, sea-level rise, acidification","hi":"लू, हिमनद पिघलना, समुद्र-स्तर वृद्धि, महासागर अम्लीकरण"},"o":[{"en":"Heat extremes, glacier melt, sea-level rise, acidification","hi":"लू, हिमनद पिघलना, समुद्र-स्तर वृद्धि, महासागर अम्लीकरण"},{"en":"Higher crop yields worldwide with no downsides","hi":"बिना किसी नुकसान के विश्वभर में अधिक फसल उपज"},{"en":"Rapid expansion of polar ice caps","hi":"ध्रुवीय बर्फ की टोपियों का तीव्र विस्तार"},{"en":"Fewer extreme weather events globally","hi":"वैश्विक स्तर पर चरम मौसमी घटनाओं में कमी"}],"exp":{"en":"Global warming drives heat extremes, glacier and ice loss, sea-level rise, altered rainfall, ocean warming and acidification, biodiversity loss, and greater risks from climate extremes.","hi":"ग्लोबल वार
