nd cyclone — together with India's disaster-management framework; cloudbursts, the Bhopal gas disaster and the Chernobyl nuclear accident are also covered.","hi":"प्रमुख प्राकृतिक और मानवजनित/प्रौद्योगिकीय आपदाएँ - भूकंप, सुनामी, भूस्खलन, बाढ़, सूखा और चक्रवात - के साथ भारत का आपदा-प्रबंधन ढाँचा; बादल फटना, भोपाल गैस त्रासदी और चेरनोबिल परमाणु दुर्घटना भी समाहित हैं।"},{"en":"Only the physical layers of the Earth's crust and mantle.","hi":"केवल पृथ्वी की पपड़ी और मेंटल की भौतिक परतें।"},{"en":"A detailed history of global political treaties on nuclear weapons.","hi":"परमाणु हथियारों पर वैश्विक राजनीतिक संधियों का विस्तृत इतिहास।"},{"en":"The chemical makeup of ocean water and tides.","hi":"समुद्र के पानी और ज्वार की रासायनिक संरचना।"}],"exp":{"en":"Major natural and human-induced/technological disasters — earthquake, tsunami, landslide, flood, drought and cyclone — together with India's disaster-management framework; cloudbursts, the Bhopal gas disaster and the Chernobyl nuclear accident are also covered. The chapter combines hazard science with risk reduction, preparedness, response and India's statutory disaster-management institutions.","hi":"प्रमुख प्राकृतिक और मानवजनित/प्रौद्योगिकीय आपदाएँ - भूकंप, सुनामी, भूस्खलन, बाढ़, सूखा और चक्रवात - के साथ भारत का आपदा-प्रबंधन ढाँचा; बादल फटना, भोपाल गैस त्रासदी और चेरनोबिल परमाणु दुर्घटना भी समाहित हैं। अध्याय आपदा-विज्ञान को जोखिम कमी, तैयारी, प्रतिक्रिया और भारत के वैधानिक आपदा-प्रबंधन संस्थाओं से जोड़ता है।"}},{"q":{"en":"How many Earthquake Zones are there in India?","hi":"भारत में कितने भूकंप क्षेत्र (भूकंप क्षेत्र) हैं?"},"a":{"en":"4 seismic zones — Zones II, III, IV and V.","hi":"4 भूकंपीय क्षेत्र - क्षेत्र II, III, IV और V।"},"o":[{"en":"4 seismic zones — Zones II, III, IV and V.","hi":"4 भूकंपीय क्षेत्र - क्षेत्र II, III, IV और V।"},{"en":"5 seismic zones — Zones I to V.","hi":"5 भूकंपीय क्षेत्र - क्षेत्र I से V।"},{"en":"3 seismic zones — Low, Medium and High only.","hi":"3 भूकंपीय क्षेत्र - केवल निम्न, मध्यम और उच्च।"},{"en":"6 seismic zones — Zones I to VI.","hi":"6 भूकंपीय क्षेत्र - क्षेत्र I से VI।"}],"exp":{"en":"4 seismic zones — Zones II, III, IV and V. India's seismic zoning uses Zones II to V; Zone I is not part of the current four-zone scheme. Zone V carries the highest zone factor.","hi":"4 भूकंपीय क्षेत्र - क्षेत्र II, III, IV और V। भारत की भूकंपीय क्षेत्रीकरण क्षेत्र II से V तक है; वर्तमान चार-क्षेत्र योजना में क्षेत्र I नहीं है। क्षेत्र V का क्षेत्र कारक सर्वाधिक है।"}},{"q":{"en":"When was the Disaster Management Act enacted in India?","hi":"भारत में आपदा प्रबंधन अधिनियम कब अधिनियमित हुआ?"},"a":{"en":"2005; the Act was later substantially amended by the Disaster Management (Amendment) Act, 2025.","hi":"2005; बाद में आपदा प्रबंधन (संशोधन) अधिनियम, 2025 द्वारा अधिनियम में व्यापक संशोधन किए गए।"},"o":[{"en":"2005; the Act was later substantially amended by the Disaster Management (Amendment) Act, 2025.","hi":"2005; बाद में आपदा प्रबंधन (संशोधन) अधिनियम, 2025 द्वारा अधिनियम में व्यापक संशोधन किए गए।"},{"en":"1999, with no later amendment.","hi":"1999, बिना किसी बाद में संशोधन के।"},{"en":"2010, after creation of the NGT.","hi":"2010, NGT स्थापना के बाद।"},{"en":"2001, immediately after the Gujarat earthquake.","hi":"2001, गुजरात भूकंप के तत्काल बाद।"}],"exp":{"en":"2005; the Act was later substantially amended by the Disaster Management (Amendment) Act, 2025. The principal central law remains the Disaster Management Act, 2005, but its institutional framework was significantly updated by the 2025 amendment.","hi":"2005; बाद में आपदा प्रबंधन (संशोधन) अधिनियम, 2025 द्वारा अधिनियम में व्यापक संशोधन किए गए। मुख्य केंद्रीय कानून आपदा प्रबंधन अधिनियम, 2005 है, लेकिन संस्थागत ढाँचे को 2025 संशोधन ने व्यापक रूप से अद्यतन किया।"}},{"q":{"en":"When was the Indian Tsunami Early Warning System established?","hi":"भारतीय सुनामी प्रारंभिक चेतावनी प्रणाली (भारतीय सुनामी पूर्व चेतावनी प्रणाली) की स्थापना कब की गई थी?"},"a":{"en":"2007 — the full-fledged Indian Tsunami Early Warning System at INCOIS became operational in October 2007.","hi":"2007 - INCOIS का पूर्ण विकसित भारतीय सुनामी पूर्व चेतावनी प्रणाली अक्टूबर 2007 में कार्यशील हुई।"},"o":[{"en":"2007 — the full-fledged Indian Tsunami Early Warning System at INCOIS became operational in October 2007.","hi":"2007 - INCOIS का पूर्ण विकसित भारतीय सुनामी पूर्व चेतावनी प्रणाली अक्टूबर 2007 में कार्यशील हुई।"},{"en":"In 2004.","hi":"2004 में।"},{"en":"In 2005.","hi":"2005 में।"},{"en":"In 2010.","hi":"2010 में।"}],"exp":{"en":"2007 — the full-fledged Indian Tsunami Early Warning System at INCOIS became operational in October 2007. India established the full-fledged 24×7 tsunami warning system at INCOIS after the 2004 Indian Ocean tsunami; it became operational in October 2007.","hi":"2007 - INCOIS का पूर्ण विकसित भारतीय सुनामी पूर्व चेतावनी प्रणाली अक्टूबर 2007 में कार्यशील हुई। 2004 हिंद महासागर सुनामी के बाद भारत ने INCOIS में पूर्ण विकसित 24×7 सुनामी चेतावनी प्रणाली स्थापित की, जो अक्टूबर 2007 में कार्यशील हुआ।"}},{"q":{"en":"When did the Bhopal Gas Tragedy happen?","hi":"भोपाल गैस त्रासदी कब हुई थी?"},"a":{"en":"Night of 2–3 December 1984 in Bhopal.","hi":"2-3 दिसंबर 1984 की रात, भोपाल में।"},"o":[{"en":"Night of 2–3 December 1984 in Bhopal.","hi":"2-3 दिसंबर 1984 की रात, भोपाल में।"},{"en":"In 1986.","hi":"1986 में।"},{"en":"In 1990.","hi":"1990 में।"},{"en":"In 1978.","hi":"1978 में।"}],"exp":{"en":"Night of 2–3 December 1984 in Bhopal. The toxic release occurred overnight at the Union Carbide plant and is therefore accurately dated to the night of 2–3 December 1984.","hi":"2-3 दिसंबर 1984 की रात, भोपाल में। विषाक्त गैस का रिसाव यूनियन कार्बाइड संयंत्र में रात के समय हुआ; इसलिए सटीक तिथि 2-3 दिसंबर 1984 की रात है।"}},{"q":{"en":"What core authority structure did the Disaster Management Act, 2005 establish?","hi":"आपदा प्रबंधन अधिनियम, 2005 ने कौन-सा मूल प्राधिकरण संरचना स्थापित किया?"},"a":{"en":"National Disaster Management Authority (NDMA), State Disaster Management Authorities (SDMAs) and District Disaster Management Authorities (DDMAs); the Act also provides for NIDM and NDRF, and the 2025 amendment added further institutions/provisions.","hi":"राष्ट्रीय आपदा प्रबंधन प्राधिकरण (NDMA), राज्य आपदा प्रबंधन प्राधिकरण (SDMAs) और जिला आपदा प्रबंधन प्राधिकरण (DDMAs); अधिनियम NIDM और NDRF का भी प्रावधान करता है, और 2025 संशोधन ने अतिरिक्त संस्थाएँ और प्रावधान जोड़े।"},"o":[{"en":"National Disaster Management Authority (NDMA), State Disaster Management Authorities (SDMAs) and District Disaster Management Authorities (DDMAs); the Act also provides for NIDM and NDRF, and the 2025 amendment added further institutions/provisions.","hi":"राष्ट्रीय आपदा प्रबंधन प्राधिकरण (NDMA), राज्य आपदा प्रबंधन प्राधिकरण (SDMAs) और जिला आपदा प्रबंधन प्राधिकरण (DDMAs); अधिनियम NIDM और NDRF का भी प्रावधान करता है, और 2025 संशोधन ने अतिरिक्त संस्थाएँ और प्रावधान जोड़े।"},{"en":"Only one central authority with no State or District bodies.","hi":"केवल एक केंद्रीय प्राधिकरण, राज्य या जिला निकाय के बिना।"},{"en":"Only State and District authorities, with no national authority.","hi":"केवल राज्य और जिला प्राधिकरण, राष्ट्रीय प्राधिकरण के बिना।"},{"en":"An independent non-governmental network outside government.","hi":"सरकार के बाहर स्वतंत्र गैर-सरकारी नेटवर्क।"}],"exp":{"en":"National Disaster Management Authority (NDMA), State Disaster Management Authorities (SDMAs) and District Disaster Management Authorities (DDMAs); the Act also provides for NIDM and NDRF, and the 2025 amendment added further institutions/provisions. NDMA operates at national level, SDMAs at State level and DDMAs at district level; the Act also contains institutional provisions for training and response forces.","hi":"राष्ट्रीय आपदा प्रबंधन प्राधिकरण (NDMA), राज्य आपदा प्रबंधन प्राधिकरण (SDMAs) और जिला आपदा प्रबंधन प्राधिकरण (DDMAs); अधिनियम NIDM और NDRF का भी प्रावधान करता है, और 2025 संशोधन ने अतिरिक्त संस्थाएँ और प्रावधान जोड़े। NDMA राष्ट्रीय स्तर, SDMAs राज्य स्तर और DDMAs जिला स्तर पर संचालित होते हैं; अधिनियम प्रशिक्षण और प्रतिक्रिया बल के संस्थागत प्रावधान भी रखता है।"}}]},{"title":{"en":"2. Earthquake","hi":"2। भूकंप (भूकंप)"},"questions":[{"q":{"en":"What is an earthquake?","hi":"भूकंप क्या है?"},"a":{"en":"Sudden shaking of the ground caused by the rapid release of stored elastic energy in the Earth, most commonly when rocks slip along a fault.","hi":"पृथ्वी में संचित प्रत्यास्थ ऊर्जा के तीव्र विमोचन से होने वाली अचानक भूमि-कंपन, सर्वाधिक सामान्यतः जब शैल भ्रंश के सहारे खिसकती हैं।"},"o":[{"en":"Sudden shaking of the ground caused by the rapid release of stored elastic energy in the Earth, most commonly when rocks slip along a fault.","hi":"पृथ्वी में संचित प्रत्यास्थ ऊर्जा के तीव्र विमोचन से होने वाली अचानक भूमि-कंपन, सर्वाधिक सामान्यतः जब शैल भ्रंश के सहारे खिसकती हैं।"},{"en":"A sudden explosion of gases in the upper atmosphere.","hi":"ऊपरी वायुमंडल में गैसें का अचानक विस्फोट।"},{"en":"The rapid melting of glaciers without ground movement.","hi":"भूमि आंदोलन के बिना हिमनद का तीव्र पिघलना।"},{"en":"A long-term change in ocean-current direction.","hi":"महासागर-वर्तमान दिशा में दीर्घकालिक परिवर्तन।"}],"exp":{"en":"Sudden shaking of the ground caused by the rapid release of stored elastic energy in the Earth, most commonly when rocks slip along a fault. The shaking is produced by seismic waves released when accumulated stress causes sudden movement, usually on a geological fault.","hi":"पृथ्वी में संचित प्रत्यास्थ ऊर्जा के तीव्र विमोचन से होने वाली अचानक भूमि-कंपन, सर्वाधिक सामान्यतः जब शैल भ्रंश के सहारे खिसकती हैं। कंपन भूकंपीय तरंगों से होता है, जब संचित तनाव अचानक गतिशीलता उत्पन्न होती है, सामान्यतः भूवैज्ञानिक भ्रंश पर।"}},{"q":{"en":"What are the main causes of earthquakes?","hi":"भूकंप के मुख्य कारण क्या हैं?"},"a":{"en":"Most result from sudden slip on tectonic faults; volcanic activity and some human-induced processes such as reservoir loading, mining or fluid injection can also trigger seismicity.","hi":"अधिकांश भूकंप विवर्तनिक भ्रंशों पर अचानक फिसलन से होते हैं; ज्वालामुखीय गतिविधि और कुछ मानवजनित प्रक्रियाएँ जैसे जलाशय भार, खनन या द्रव अंत:क्षेपण भी भूकंपीयता उत्पन्न कर सकते हैं।"},"o":[{"en":"Most result from sudden slip on tectonic faults; volcanic activity and some human-induced processes such as reservoir loading, mining or fluid injection can also trigger seismicity.","hi":"अधिकांश भूकंप विवर्तनिक भ्रंशों पर अचानक फिसलन से होते हैं; ज्वालामुखीय गतिविधि और कुछ मानवजनित प्रक्रियाएँ जैसे जलाशय भार, खनन या द्रव अंत:क्षेपण भी भूकंपीयता उत्पन्न कर सकते हैं।"},{"en":"Earth's daily rotation is a primary direct cause of most earthquakes.","hi":"पृथ्वी की दैनिक घूर्णन अधिकांश भूकंप की प्राथमिक प्रत्यक्ष कारण है।"},{"en":"Heavy rainfall alone is the universal cause of earthquakes.","hi":"भारी वर्षा अकेला भूकंप की सार्वभौमिक कारण है।"},{"en":"Only meteorite impacts produce earthquakes.","hi":"केवल उल्कापिंड प्रभाव भूकंप उत्पन्न करते हैं।"}],"exp":{"en":"Most result from sudden slip on tectonic faults; volcanic activity and some human-induced processes such as reservoir loading, mining or fluid injection can also trigger seismicity. Plate motion loads faults with stress; sudden fault rupture is the dominant natural mechanism. Volcanic and induced seismicity are real but much less common.","hi":"अधिकांश भूकंप विवर्तनिक भ्रंशों पर अचानक फिसलन से होते हैं; ज्वालामुखीय गतिविधि और कुछ मानवजनित प्रक्रियाएँ जैसे जलाशय भार, खनन या द्रव अंत:क्षेपण भी भूकंपीयता उत्पन्न कर सकते हैं। प्लेट गति भ्रंशों पर तनाव भार करती है; अचानक भ्रंश टूटना प्रमुख प्राकृतिक तंत्र है। ज्वालामुखीय और जनित भूकंपीयता वास्तविक हैं लेकिन अधिक कम सामान्य।"}}]},{"title":{"en":"3. Tsunami & Landslide","hi":"3। सुनामी (सुनामी) और भूस्खलन (भूस्खलन)"},"questions":[{"q":{"en":"Where does the word 'Tsunami' come from?","hi":"'सुनामी' शब्द कहाँ से आया है?"},"a":{"en":"It is a Japanese word.","hi":"यह एक जापानी शब्द है।"},"o":[{"en":"It is a Japanese word.","hi":"यह एक जापानी शब्द है।"},{"en":"It is an Indonesian word.","hi":"यह एक इंडोनेशियाई शब्द है।"},{"en":"It is a Hawaiian word.","hi":"यह एक हवाईयन शब्द है।"},{"en":"It is a Greek word.","hi":"यह एक ग्रीक शब्द है।"}],"exp":{"en":"It is a Japanese word. The Japanese term is commonly translated as 'harbour wave'; a tsunami is not a tide and should not be called a tidal wave.","hi":"यह एक जापानी शब्द है। जापानी शब्द सामान्यतः 'बंदरगाह तरंग' रूपांतरित होता है; सुनामी ज्वार नहीं है, इसलिए इसे ज्वारीय तरंग कहना तकनीकी रूप से सही नहीं।"}},{"q":{"en":"What are the causes of a Tsunami?","hi":"सुनामी के कारण क्या हैं?"},"a":{"en":"Most tsunamis are generated by sudden displacement of seawater during large undersea or near-coast earthquakes; volcanic activity and submarine/coastal landslides can also generate them.","hi":"अधिकांश सुनामी बड़ा समुद्रतलीय या के निकट-तट भूकंप से समुद्री जल के अचानक विस्थापन द्वारा उत्पन्न होते हैं; ज्वालामुखीय गतिविधि और समुद्रतलीय/तटीय भूस्खलन भी सुनामी उत्पन्न कर सकते हैं।"},"o":[{"en":"Most tsunamis are generated by sudden displacement of seawater during large undersea or near-coast earthquakes; volcanic activity and submarine/coastal landslides can also generate them.","hi":"अधिकांश सुनामी बड़ा समुद्रतलीय या के निकट-तट भूकंप से समुद्री जल के अचानक विस्थापन द्वारा उत्पन्न होते हैं; ज्वालामुखीय गतिविधि और समुद्रतलीय/तटीय भूस्खलन भी सुनामी उत्पन्न कर सकते हैं।"},{"en":"High winds and ordinary ocean tides are the main causes.","hi":"उच्च पवन और सामान्य महासागरीय ज्वार मुख्य कारण हैं।"},{"en":"Only the gravitational pull of the Moon produces tsunamis.","hi":"केवल चंद्रमा का गुरुत्वाकर्षण खिंचाव सुनामी उत्पन्न करता है।"},{"en":"Heavy rainfall over the ocean is the usual cause.","hi":"महासागर के ऊपर भारी वर्षा सामान्य कारण है।"}],"exp":{"en":"Most tsunamis are generated by sudden displacement of seawater during large undersea or near-coast earthquakes; volcanic activity and submarine/coastal landslides can also generate them. A tsunami requires rapid displacement of a large water mass. Large shallow undersea earthquakes are the most common source, while landslides and volcanic processes can also displace water suddenly.","hi":"अधिकांश सुनामी बड़ा समुद्रतलीय या के निकट-तट भूकंप से समुद्री जल के अचानक विस्थापन द्वारा उत्पन्न होते हैं; ज्वालामुखीय गतिविधि और समुद्रतलीय/तटीय भूस्खलन भी सुनामी उत्पन्न कर सकते हैं। सुनामी के लिए बड़ा जल द्रव्यमान का तीव्र विस्थापन चाहिए। बड़ा उथला समुद्रतलीय भूकंप अधिकांश सामान्य स्रोत हैं, जबकि भूस्खलन और ज्वालामुखीय प्रक्रियाएँ भी जल को अचानक विस्थापित कर सकते हैं।"}},{"q":{"en":"What are major impacts of a tsunami?","hi":"सुनामी के प्रमुख प्रभाव क्या हैं?"},"a":{"en":"Coastal inundation and strong currents can cause deaths, infrastructure destruction, erosion, salinisation and contamination of land and water, and severe damage to coastal ecosystems.","hi":"तटीय जलप्लावन और तीव्र धाराएँ एवं अवसंरचना-विनाश, अपरदन, भूमि/जल लवणीकरण-संदूषण और तटीय पारितंत्र को गंभीर क्षति पहुँचा सकती हैं।"},"o":[{"en":"Coastal inundation and strong currents can cause deaths, infrastructure destruction, erosion, salinisation and contamination of land and water, and severe damage to coastal ecosystems.","hi":"तटीय जलप्लावन और तीव्र धाराएँ एवं अवसंरचना-विनाश, अपरदन, भूमि/जल लवणीकरण-संदूषण और तटीय पारितंत्र को गंभीर क्षति पहुँचा सकती हैं।"},{"en":"It permanently cools ocean water worldwide.","hi":"यह विश्वभर में महासागर जल को स्थायी रूप से ठंडा करता है।"},{"en":"It creates new volcanic islands in every event.","hi":"हर घटना में नया ज्वालामुखीय द्वीप स्थापित करता है।"},{"en":"It causes continuous inland earthquakes for years.","hi":"यह वर्ष तक निरंतर अंतर्देशीय भूकंप उत्पन्न करता है।"}],"exp":{"en":"Coastal inundation and strong currents can cause deaths, infrastructure destruction, erosion, salinisation and contamination of land and water, and severe damage to coastal ecosystems. Damage is caused by inundation, high-velocity currents, debris impact and repeated waves; saltwater intrusion and contamination can persist after the water recedes.","hi":"तटीय जलप्लावन और तीव्र धाराएँ एवं अवसंरचना-विनाश, अपरदन, भूमि/जल लवणीकरण-संदूषण और तटीय पारितंत्र को गंभीर क्षति पहुँचा सकती हैं। क्षति जलप्लावन, उच्च-वेग धाराओं, मलबा प्रभाव और बार-बार आने वाली तरंगों से होती है; जल के पीछे हटने के बाद भी खारे जल का प्रवेश और संदूषण बने रह सकते हैं।"}},{"q":{"en":"Which measures are important for tsunami risk reduction in India?","hi":"भारत में सुनामी जोखिम कमी के लिए कौन-से उपाय महत्वपूर्ण हैं?"},"a":{"en":"24×7 early warning through ITEWS/INCOIS, rapid alert dissemination, evacuation routes and drills, coastal hazard mapping/land-use planning, resilient shelters, and natural or engineered coastal buffers where suitable.","hi":"ITEWS/INCOIS के माध्यम से 24×7 पूर्व चेतावनी, तीव्र चेतावनी प्रसार, निकासी मार्ग और अभ्यास, तटीय संकट मानचित्रण/भूमि-उपयोग नियोजन, लचीला आश्रय-स्थल तथा उपयुक्त स्थानों पर प्राकृतिक या अभियांत्रिक तटीय सुरक्षात्मक पट्टियाँ।"},"o":[{"en":"24×7 early warning through ITEWS/INCOIS, rapid alert dissemination, evacuation routes and drills, coastal hazard mapping/land-use planning, resilient shelters, and natural or engineered coastal buffers where suitable.","hi":"ITEWS/INCOIS के माध्यम से 24×7 पूर्व चेतावनी, तीव्र चेतावनी प्रसार, निकासी मार्ग और अभ्यास, तटीय संकट मानचित्रण/भूमि-उपयोग नियोजन, लचीला आश्रय-स्थल तथा उपयुक्त स्थानों पर प्राकृतिक या अभियांत्रिक तटीय सुरक्षात्मक पट्टियाँ।"},{"en":"Permanently evacuating all coastal settlements.","hi":"सभी तटीय बस्तियों को स्थायी रूप से खाली करना।"},{"en":"Stopping river flow by building inland dams.","hi":"अंतर्देशीय बाँध बनाकर नदी प्रवाह रोकना।"},{"en":"Trying to reverse ocean currents using turbines.","hi":"टरबाइन से महासागरीय धाराओं को उलटने की कोशिश करना।"}],"exp":{"en":"24×7 early warning through ITEWS/INCOIS, rapid alert dissemination, evacuation routes and drills, coastal hazard mapping/land-use planning, resilient shelters, and natural or engineered coastal buffers where suitable. Early warning has value only when alerts reach people quickly and communities know evacuation routes and safe locations; structural or ecological buffers are supplementary measures.","hi":"ITEWS/INCOIS के माध्यम से 24×7 पूर्व चेतावनी, तीव्र चेतावनी प्रसार, निकासी मार्ग और अभ्यास, तटीय संकट मानचित्रण/भूमि-उपयोग नियोजन, लचीला आश्रय-स्थल तथा उपयुक्त स्थानों पर प्राकृतिक या अभियांत्रिक तटीय सुरक्षात्मक पट्टियाँ। पूर्व चेतावनी तभी उपयोगी है जब चेतावनियाँ जल्दी लोगों तक पहुँचें और समुदाय निकासी मार्ग/सुरक्षित स्थानों जानती हों; संरचनात्मक या पारिस्थितिक सुरक्षात्मक पट्टियाँ पूरक उपाय हैं।"}},{"q":{"en":"What is a landslide?","hi":"भूस्खलन क्या है?"},"a":{"en":"Downslope movement of rock, soil or debris under the influence of gravity.","hi":"गुरुत्वाकर्षण के प्रभाव में शैल, मृदा या मलबा का ढाल की ओर नीचे खिसकना।"},"o":[{"en":"Downslope movement of rock, soil or debris under the influence of gravity.","hi":"गुरुत्वाकर्षण के प्रभाव में शैल, मृदा या मलबा का ढाल की ओर नीचे खिसकना।"},{"en":"Only the sudden sinking of flat ground into a sinkhole.","hi":"केवल समतल भूमि का धँसान-गर्त में अचानक धँसना।"},{"en":"Horizontal tectonic-plate motion without slope failure.","hi":"ढाल विफलता के बिना क्षैतिज विवर्तनिक प्लेट गति।"},{"en":"Magma rising vertically to the surface.","hi":"मैग्मा का ऊर्ध्वाधर रूप से सतह की ओर उठना।"}],"exp":{"en":"Downslope movement of rock, soil or debris under the influence of gravity. Landslides include rockfalls, slides and debris/earth movements; the common feature is gravity-driven downslope movement.","hi":"गुरुत्वाकर्षण के प्रभाव में शैल, मृदा या मलबा का ढाल की ओर नीचे खिसकना। भूस्खलन में शैल-पतन, भूस्खलन और मलबा/पृथ्वी आंदोलन शामिल हैं; सामान्य विशेषता गुरुत्वाकर्षण-संचालित ढाल की ओर नीचे खिसकना है।"}},{"q":{"en":"What are common triggers and contributing factors for landslides?","hi":"भूस्खलन के सामान्य कारण और योगदानकारी कारक क्या हैं?"},"a":{"en":"Intense/prolonged rainfall, earthquakes, snowmelt or freeze-thaw, weak geology and steep slopes; slope cutting, poor drainage, deforestation, mining and construction can increase susceptibility.","hi":"तीव्र/लंबे समय की वर्षा, भूकंप, हिम-पिघलाव या हिमन-गलन, कमजोर भूगर्भीय संरचना और तीव्र ढाल; ढाल कटान, खराब जल-निकासी, वनोन्मूलन, खनन और निर्माण संवेदनशीलता बढ़ा सकते हैं।"},"o":[{"en":"Intense/prolonged rainfall, earthquakes, snowmelt or freeze-thaw, weak geology and steep slopes; slope cutting, poor drainage, deforestation, mining and construction can increase susceptibility.","hi":"तीव्र/लंबे समय की वर्षा, भूकंप, हिम-पिघलाव या हिमन-गलन, कमजोर भूगर्भीय संरचना और तीव्र ढाल; ढाल कटान, खराब जल-निकासी, वनोन्मूलन, खनन और निर्माण संवेदनशीलता बढ़ा सकते हैं।"},{"en":"Only high winds and tornadoes.","hi":"केवल उच्च पवन और बवंडर।"},{"en":"Only solar radiation and heatwaves.","hi":"केवल सौर विकिरण और लू।"},{"en":"Only changes in ocean salinity.","hi":"केवल महासागर लवणता परिवर्तन।"}],"exp":{"en":"Intense/prolonged rainfall, earthquakes, snowmelt or freeze-thaw, weak geology and steep slopes; slope cutting, poor drainage, deforestation, mining and construction can increase susceptibility. Landslides usually reflect a combination of slope susceptibility and a trigger such as intense rain or earthquake; human slope modification can greatly increase risk.","hi":"तीव्र/लंबे समय की वर्षा, भूकंप, हिम-पिघलाव या हिमन-गलन, कमजोर भूगर्भीय संरचना और तीव्र ढाल; ढाल कटान, खराब जल-निकासी, वनोन्मूलन, खनन और निर्माण संवेदनशीलता बढ़ा सकते हैं। भूस्खलन सामान्यतः ढाल संवेदनशीलता और तीव्र वर्षा/भूकंप जैसे कारकों के संयोजन से होते हैं; मानवीय ढाल परिवर्तन जोखिम काफी बढ़ा सकता है।"}},{"q":{"en":"What are the effects of a Landslide?","hi":"भूस्खलन के प्रभाव क्या हैं?"},"a":{"en":"Loss of life and property, damage to roads/buildings and utilities, blockage of rivers that can create secondary flooding, and loss of soil/vegetation and access routes.","hi":"जीवन एवं संपत्ति की हानि, सड़कें/भवनों/जनोपयोगी सेवाओं क्षति, नदियों का अवरोध जिससे द्वितीयक जलभराव हो सकती है, तथा मृदा/वनस्पति और पहुँच मार्ग का हानि।"},"o":[{"en":"Loss of life and property, damage to roads/buildings and utilities, blockage of rivers that can create secondary flooding, and loss of soil/vegetation and access routes.","hi":"जीवन एवं संपत्ति की हानि, सड़कें/भवनों/जनोपयोगी सेवाओं क्षति, नदियों का अवरोध जिससे द्वितीयक जलभराव हो सकती है, तथा मृदा/वनस्पति और पहुँच मार्ग का हानि।"},{"en":"Increase in soil fertility and crop yields.","hi":"मिट्टी की उर्वरता और फसल की पैदावार में वृद्धि।"},{"en":"Creation of new ozone holes.","hi":"नए ओजोन छिद्रों का निर्माण।"},{"en":"Immediate lowering of global temperatures.","hi":"वैश्विक तापमान में तत्काल कमी।"}],"exp":{"en":"Loss of life and property, damage to roads/buildings and utilities, blockage of rivers that can create secondary flooding, and loss of soil/vegetation and access routes. River blockage by a landslide can create temporary lakes and later outburst flooding, so impacts may extend beyond the failed slope itself.","hi":"जीवन एवं संपत्ति की हानि, सड़कें/भवनों/जनोपयोगी सेवाओं क्षति, नदियों का अवरोध जिससे द्वितीयक जलभराव हो सकती है, तथा मृदा/वनस्पति और पहुँच मार्ग का हानि। भूस्खलन नदी अवरुद्ध करके अस्थायी झील स्थापित कर सकता है और बाद में विस्फोट जलभराव हो सकती है; प्रभाव विफल ढाल से परे भी जा सकते हैं।"}},{"q":{"en":"What measures reduce landslide risk?","hi":"भूस्खलन जोखिम को कौन-से उपाय कम करते हैं?"},"a":{"en":"Hazard zonation and land-use control, effective surface/subsurface drainage, slope stabilisation and retaining structures, vegetation where suitable, and regulation of unsafe slope cutting, quarrying and construction.","hi":"संकट क्षेत्रीकरण और भूमि-उपयोग नियंत्रण, प्रभावी सतही/भूमिगत जल-निकासी, ढाल स्थिरीकरण और अवरोधक संरचनाएँ, उपयुक्त वनस्पति तथा असुरक्षित ढाल कटान, उत्खनन और निर्माण का विनियमन।"},"o":[{"en":"Hazard zonation and land-use control, effective surface/subsurface drainage, slope stabilisation and retaining structures, vegetation where suitable, and regulation of unsafe slope cutting, quarrying and construction.","hi":"संकट क्षेत्रीकरण और भूमि-उपयोग नियंत्रण, प्रभावी सतही/भूमिगत जल-निकासी, ढाल स्थिरीकरण और अवरोधक संरचनाएँ, उपयुक्त वनस्पति तथा असुरक्षित ढाल कटान, उत्खनन और निर्माण का विनियमन।"},{"en":"Deforestation and more unplanned road cutting.","hi":"वनोन्मूलन और अधिक अनियोजित सड़क कटान।"},{"en":"Using explosives to remove unstable slopes indiscriminately.","hi":"अस्थिर ढालों को हटाने के लिए अंधाधुंध विस्फोटकों उपयोग करना।"},{"en":"Blocking all drainage channels on slopes.","hi":"ढालों पर सभी जल-निकासी मार्गों को अवरुद्ध करना।"}],"exp":{"en":"Hazard zonation and land-use control, effective surface/subsurface drainage, slope stabilisation and retaining structures, vegetation where suitable, and regulation of unsafe slope cutting, quarrying and construction. No single measure works everywhere; engineering stabilisation, drainage, vegetation and land-use controls must be selected according to geology and slope conditions.","hi":"संकट क्षेत्रीकरण और भूमि-उपयोग नियंत्रण, प्रभावी सतही/भूमिगत जल-निकासी, ढाल स्थिरीकरण और अवरोधक संरचनाएँ, उपयुक्त वनस्पति तथा असुरक्षित ढाल कटान, उत्खनन और निर्माण का विनियमन। सभी स्थानों के लिए एक समान माप नहीं होता; अभियांत्रिकी स्थिरीकरण, जल-निकासी, वनस्पति और भूमि-उपयोग नियंत्रण भूगर्भीय संरचना एवं ढाल की स्थितियों के अनुसार चुने जाते हैं।"}}]},{"title":{"en":"4. Flood & Drought","hi":"4। बाढ़ और सूखा"},"questions":[{"q":{"en":"What is a flood?","hi":"बाढ़ क्या है?"},"a":{"en":"Overflow or accumulation of water that inundates land which is normally dry, often when rivers, drainage systems or coasts cannot contain or discharge the water.","hi":"जल का अतिप्रवाह या संचय है, जिससे सामान्यतः सूखी भूमि जलमग्न हो जाए, प्रायः जब नदियाँ, जल-निकासी प्रणालियाँ या तटबंध जल को रोक/निकाल नहीं कर पाते।"},"o":[{"en":"Overflow or accumulation of water that inundates land which is normally dry, often when rivers, drainage systems or coasts cannot contain or discharge the water.","hi":"जल का अतिप्रवाह या संचय है, जिससे सामान्यतः सूखी भूमि जलमग्न हो जाए, प्रायः जब नदियाँ, जल-निकासी प्रणालियाँ या तटबंध जल को रोक/निकाल नहीं कर पाते।"},{"en":"Only the complete drying of a river.","hi":"केवल नदी का पूर्ण रूप से सूखना।"},{"en":"Water freezing in a lake.","hi":"झील में जल हिमांक।"},{"en":"The normal daily recession of ocean tides.","hi":"महासागरीय ज्वार का सामान्य दैनिक पीछे हटना।"}],"exp":{"en":"Overflow or accumulation of water that inundates land which is normally dry, often when rivers, drainage systems or coasts cannot contain or discharge the water. Flooding can arise from river overflow, intense local rainfall, poor drainage, coastal surge or failure/release of water-control structures.","hi":"जल का अतिप्रवाह या संचय है, जिससे सामान्यतः सूखी भूमि जलमग्न हो जाए, प्रायः जब नदियाँ, जल-निकासी प्रणालियाँ या तटबंध जल को रोक/निकाल नहीं कर पाते। जलभराव नदी अतिप्रवाह, तीव्र स्थानीय वर्षा, खराब जल-निकासी, तटीय उभार या जल-नियंत्रण संरचनाओं की विफलता या उनसे जल छोड़े जाने से हो सकती है।"}},{"q":{"en":"What are major causes or aggravating factors of floods?","hi":"बाढ़ के प्रमुख कारण या बढ़ाने वाला कारक क्या हैं?"},"a":{"en":"Intense or prolonged rainfall, inadequate river/drainage capacity, river-bank erosion and siltation, landslide or ice blockage, snowmelt/glacial outburst, storm surge/tidal effects, dam failure or sudden releases, and encroachment or poor drainage.","hi":"तीव्र/लंबे समय की वर्षा, अपर्याप्त नदी/जल-निकासी क्षमता, नदी-तट अपरदन और गाद जमना, भूस्खलन/हिम अवरोध, हिम-पिघलाव/हिमानी झील विस्फोट, तूफानी ज्वार/ज्वारीय प्रभाव, बाँध विफलता/अचानक मुक्त करता है तथा अतिक्रमण या खराब जल-निकासी।"},"o":[{"en":"Intense or prolonged rainfall, inadequate river/drainage capacity, river-bank erosion and siltation, landslide or ice blockage, snowmelt/glacial outburst, storm surge/tidal effects, dam failure or sudden releases, and encroachment or poor drainage.","hi":"तीव्र/लंबे समय की वर्षा, अपर्याप्त नदी/जल-निकासी क्षमता, नदी-तट अपरदन और गाद जमना, भूस्खलन/हिम अवरोध, हिम-पिघलाव/हिमानी झील विस्फोट, तूफानी ज्वार/ज्वारीय प्रभाव, बाँध विफलता/अचानक मुक्त करता है तथा अतिक्रमण या खराब जल-निकासी।"},{"en":"Only earthquakes and volcanic eruptions.","hi":"केवल भूकंप और ज्वालामुखीय विस्फोट।"},{"en":"Low rainfall and high evaporation.","hi":"निम्न वर्षा और उच्च वाष्पीकरण।"},{"en":"Excessive tree planting along all riverbanks.","hi":"सभी नदी-तटों पर अत्यधिक वृक्षारोपण।"}],"exp":{"en":"Intense or prolonged rainfall, inadequate river/drainage capacity, river-bank erosion and siltation, landslide or ice blockage, snowmelt/glacial outburst, storm surge/tidal effects, dam failure or sudden releases, and encroachment or poor drainage. Flood risk is shaped by both the water-producing event and the ability of channels, drainage systems and floodplains to carry or store that water.","hi":"तीव्र/लंबे समय की वर्षा, अपर्याप्त नदी/जल-निकासी क्षमता, नदी-तट अपरदन और गाद जमना, भूस्खलन/हिम अवरोध, हिम-पिघलाव/हिमानी झील विस्फोट, तूफानी ज्वार/ज्वारीय प्रभाव, बाँध विफलता/अचानक मुक्त करता है तथा अतिक्रमण या खराब जल-निकासी। बाढ़ जोखिम जल-उत्पन्न घटना के साथ मार्गों, जल-निकासी प्रणालियाँ और बाढ़-मैदानों की जल ले जाना/संग्रह क्षमता पर भी निर्भर करता है।"}},{"q":{"en":"What are the effects of a Flood?","hi":"बाढ़ के प्रभाव क्या हैं?"},"a":{"en":"Deaths and displacement, damage to homes, crops, livestock and infrastructure, erosion and sediment deposition, contamination of drinking-water sources, water-borne disease risk, and major economic/ecological losses.","hi":"मृत्यु/विस्थापन, घरों-फसलें-पशुधन-अवसंरचना क्षति, अपरदन और अवसाद निक्षेपण, पेय-जल संदूषण, जलजनित रोग जोखिम तथा प्रमुख आर्थिक/पारिस्थितिक हानियाँ।"},"o":[{"en":"Deaths and displacement, damage to homes, crops, livestock and infrastructure, erosion and sediment deposition, contamination of drinking-water sources, water-borne disease risk, and major economic/ecological losses.","hi":"मृत्यु/विस्थापन, घरों-फसलें-पशुधन-अवसंरचना क्षति, अपरदन और अवसाद निक्षेपण, पेय-जल संदूषण, जलजनित रोग जोखिम तथा प्रमुख आर्थिक/पारिस्थितिक हानियाँ।"},{"en":"Immediate improvement in crop yields everywhere.","hi":"हर जगह फसल की पैदावार में तत्काल सुधार।"},{"en":"Elimination of all insect pests.","hi":"सभी कीट-पतंगों का खात्मा।"},{"en":"Increase in groundwater purity.","hi":"भूजल की शुद्धता में वृद्धि।"}],"exp":{"en":"Deaths and displacement, damage to homes, crops, livestock and infrastructure, erosion and sediment deposition, contamination of drinking-water sources, water-borne disease risk, and major economic/ecological losses. Flood impacts are not uniformly harmful or beneficial; severe floods can destroy assets and contaminate water even though some floodplains may receive fresh sediment.","hi":"मृत्यु/विस्थापन, घरों-फसलें-पशुधन-अवसंरचना क्षति, अपरदन और अवसाद निक्षेपण, पेय-जल संदूषण, जलजनित रोग जोखिम तथा प्रमुख आर्थिक/पारिस्थितिक हानियाँ। बाढ़ प्रभाव समान रूप से हानिकारक या लाभकारी नहीं होते; गंभीर बाढ़ संपत्तियाँ नष्ट और जल संदूषित कर सकते हैं, यद्यपि कुछ बाढ़-मैदानों नया अवसाद प्राप्त कर सकते हैं।"}},{"q":{"en":"What measures are used for flood-risk management?","hi":"बाढ़-जोखिम प्रबंधन के लिए कौन-से उपाय उपयोग किए जाते हैं?"},"a":{"en":"Flood forecasting and early warning, floodplain zoning and land-use regulation, improved drainage and watershed management, resilient infrastructure and evacuation planning, plus embankments, reservoirs or diversion works where technically appropriate.","hi":"बाढ़ पूर्वानुमान और पूर्व चेतावनी, बाढ़-मैदान क्षेत्रीकरण/भूमि-उपयोग विनियमन, बेहतर जल-निकासी और जलग्रहण प्रबंधन, लचीला अवसंरचना तथा निकासी नियोजन के साथ तकनीकी रूप से उपयुक्त स्थानों पर तटबंध, जलाशय या मार्ग-परिवर्तन जैसे उपाय।"},"o":[{"en":"Flood forecasting and early warning, floodplain zoning and land-use regulation, improved drainage and watershed management, resilient infrastructure and evacuation planning, plus embankments, reservoirs or diversion works where technically appropriate.","hi":"बाढ़ पूर्वानुमान और पूर्व चेतावनी, बाढ़-मैदान क्षेत्रीकरण/भूमि-उपयोग विनियमन, बेहतर जल-निकासी और जलग्रहण प्रबंधन, लचीला अवसंरचना तथा निकासी नियोजन के साथ तकनीकी रूप से उपयुक्त स्थानों पर तटबंध, जलाशय या मार्ग-परिवर्तन जैसे उपाय।"},{"en":"Filling rivers with concrete.","hi":"नदियों को कंक्रीट से भरना।"},{"en":"Removing every dam and barrage regardless of context.","hi":"संदर्भ के बिना प्रत्येक बाँध/बैराज हटाना।"},{"en":"Encouraging settlement in active floodplains.","hi":"सक्रिय बाढ़-मैदानों में बस्तियों को प्रोत्साहित करना।"}],"exp":{"en":"Flood forecasting and early warning, floodplain zoning and land-use regulation, improved drainage and watershed management, resilient infrastructure and evacuation planning, plus embankments, reservoirs or diversion works where technically appropriate. Modern flood management combines structural works with non-structural measures such as forecasting, zoning, preparedness and resilient land-use planning.","hi":"बाढ़ पूर्वानुमान और पूर्व चेतावनी, बाढ़-मैदान क्षेत्रीकरण/भूमि-उपयोग विनियमन, बेहतर जल-निकासी और जलग्रहण प्रबंधन, लचीला अवसंरचना तथा निकासी नियोजन के साथ तकनीकी रूप से उपयुक्त स्थानों पर तटबंध, जलाशय या मार्ग-परिवर्तन जैसे उपाय। आधुनिक बाढ़ प्रबंधन संरचनात्मक उपायों को पूर्वानुमान, क्षेत्रीकरण, तैयारी और लचीला भूमि-उपयोग नियोजन जैसे गैर-संरचनात्मक उपाय के साथ संयोजित करता है।"}},{"q":{"en":"How is drought commonly classified in Indian disaster-management literature?","hi":"भारतीय आपदा-प्रबंधन साहित्य में सूखा को सामान्यतः कैसे वर्गीकृत किया जाता है?"},"a":{"en":"Meteorological, hydrological and agricultural drought are the main physical-impact categories; socio-economic drought is also commonly recognised.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी सूखा मुख्य भौतिक-प्रभाव श्रेणियाँ हैं; सामाजिक-आर्थिक सूखा भी सामान्यतः मान्यता प्राप्त है।"},"o":[{"en":"Meteorological, hydrological and agricultural drought are the main physical-impact categories; socio-economic drought is also commonly recognised.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी सूखा मुख्य भौतिक-प्रभाव श्रेणियाँ हैं; सामाजिक-आर्थिक सूखा भी सामान्यतः मान्यता प्राप्त है।"},{"en":"Drought is only an 'atmospheric disaster' and has no other categories.","hi":"सूखा केवल 'वायुमंडलीय आपदा' है और इसकी कोई अन्य श्रेणी नहीं।"},{"en":"Drought is always a geological disaster.","hi":"सूखा सदैव भूवैज्ञानिक आपदा है।"},{"en":"Drought is only a biological disaster.","hi":"सूखा केवल जैविक आपदा है।"}],"exp":{"en":"Meteorological, hydrological and agricultural drought are the main physical-impact categories; socio-economic drought is also commonly recognised. 'Drought' is a broad hazard, not a single atmospheric label. Meteorological deficiency can propagate into soil-moisture, surface-water and socio-economic impacts.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी सूखा मुख्य भौतिक-प्रभाव श्रेणियाँ हैं; सामाजिक-आर्थिक सूखा भी सामान्यतः मान्यता प्राप्त है। 'सूखा' व्यापक संकट है, एकमात्र वायुमंडलीय नाम नहीं। मौसम-विज्ञान संबंधी कमी मृदा-नमी, सतह-जल और सामाजिक-आर्थिक प्रभाव में प्रसारित कर सकती है।"}},{"q":{"en":"What conditions can cause or intensify drought?","hi":"कौन-सी स्थितियाँ सूखा कारण या तीव्र कर सकती हैं?"},"a":{"en":"Prolonged below-normal precipitation is the primary meteorological trigger; high evapotranspiration, depleted soil moisture, low reservoir/streamflow/groundwater levels and excessive water demand can intensify drought impacts.","hi":"लंबे समय की सामान्य से कम वर्षा प्राथमिक मौसम-विज्ञान संबंधी उत्पन्न है; उच्च वाष्पोत्सर्जन, कम मृदा नमी, निम्न जलाशय/नदी प्रवाह/भूजल स्तर और अत्यधिक जल माँग सूखा प्रभाव तीव्र कर सकते हैं।"},"o":[{"en":"Prolonged below-normal precipitation is the primary meteorological trigger; high evapotranspiration, depleted soil moisture, low reservoir/streamflow/groundwater levels and excessive water demand can intensify drought impacts.","hi":"लंबे समय की सामान्य से कम वर्षा प्राथमिक मौसम-विज्ञान संबंधी उत्पन्न है; उच्च वाष्पोत्सर्जन, कम मृदा नमी, निम्न जलाशय/नदी प्रवाह/भूजल स्तर और अत्यधिक जल माँग सूखा प्रभाव तीव्र कर सकते हैं।"},{"en":"Heavy, short-duration rainfall alone.","hi":"केवल कम अवधि की भारी वर्षा।"},{"en":"Only polar ice-cap melting.","hi":"केवल ध्रुवीय हिम-टोपी का पिघलना।"},{"en":"Only earthquakes fracturing aquifers.","hi":"केवल भूकंप जलभृतों में दरार पड़ना।"}],"exp":{"en":"Prolonged below-normal precipitation is the primary meteorological trigger; high evapotranspiration, depleted soil moisture, low reservoir/streamflow/groundwater levels and excessive water demand can intensify drought impacts. Meteorological drought often initiates the sequence, while hydrological and agricultural drought may appear later because reservoirs, groundwater and soils respond on different timescales.","hi":"लंबे समय की सामान्य से कम वर्षा प्राथमिक मौसम-विज्ञान संबंधी उत्पन्न है; उच्च वाष्पोत्सर्जन, कम मृदा नमी, निम्न जलाशय/नदी प्रवाह/भूजल स्तर और अत्यधिक जल माँग सूखा प्रभाव तीव्र कर सकते हैं। मौसम-विज्ञान संबंधी सूखा अक्सर क्रम आरंभ करता है, जबकि जलाशय, भूजल और मृदाएँ अलग समय-पैमाने पर प्रतिक्रिया करने से जलवैज्ञानिक/कृषि-संबंधी सूखा बाद में प्रकट हो सकते हैं।"}},{"q":{"en":"What are the effects of a Drought?","hi":"सूखे के प्रभाव क्या हैं?"},"a":{"en":"Reduced crop and livestock productivity, water scarcity, ecosystem stress and wildfire risk, livelihood and health impacts, food insecurity, migration and wider economic losses.","hi":"फसल/पशुधन उत्पादकता कमी, जल-संकट, पारितंत्र तनाव और वनाग्नि जोखिम, आजीविका/स्वास्थ्य प्रभाव, खाद्य असुरक्षा, प्रवासन और व्यापक आर्थिक हानियाँ।"},"o":[{"en":"Reduced crop and livestock productivity, water scarcity, ecosystem stress and wildfire risk, livelihood and health impacts, food insecurity, migration and wider economic losses.","hi":"फसल/पशुधन उत्पादकता कमी, जल-संकट, पारितंत्र तनाव और वनाग्नि जोखिम, आजीविका/स्वास्थ्य प्रभाव, खाद्य असुरक्षा, प्रवासन और व्यापक आर्थिक हानियाँ।"},{"en":"Destruction of coastal cities by waves.","hi":"लहरों से तटीय शहरों का विनाश।"},{"en":"Immediate collapse of tectonic plates.","hi":"विवर्तनिक प्लेटों का तत्काल पतन।"},{"en":"Spread of water-borne diseases like cholera.","hi":"हैजा जैसी जल-जनित बीमारियों का प्रसार।"}],"exp":{"en":"Reduced crop and livestock productivity, water scarcity, ecosystem stress and wildfire risk, livelihood and health impacts, food insecurity, migration and wider economic losses. Drought is a slow-onset or 'creeping' disaster, so impacts accumulate across agriculture, water supply, health, ecosystems and livelihoods over time.","hi":"फसल/पशुधन उत्पादकता कमी, जल-संकट, पारितंत्र तनाव और वनाग्नि जोखिम, आजीविका/स्वास्थ्य प्रभाव, खाद्य असुरक्षा, प्रवासन और व्यापक आर्थिक हानियाँ। सूखा धीमी गति से आरंभ होने वाली या 'धीमी गति वाला' आपदा है; इसलिए प्रभाव कृषि, जल आपूर्ति, स्वास्थ्य, पारितंत्र और आजीविकाएँ में समय के साथ संचित होते हैं।"}},{"q":{"en":"When was the Desert Development Programme (DDP) launched?","hi":"मरुस्थल विकास कार्यक्रम (DDP) कब शुरू हुआ?"},"a":{"en":"1977–78.","hi":"1977-78।"},"o":[{"en":"1977–78.","hi":"1977-78।"},{"en":"In 1990–91.","hi":"1990-91 में।"},{"en":"In 1985–86.","hi":"1985-86 में।"},{"en":"In 2005–06.","hi":"2005-06 में।"}],"exp":{"en":"1977–78. DDP is a historical centrally sponsored programme launched in 1977–78 to address hot and cold desert areas through resource conservation and development.","hi":"1977-78। DDP ऐतिहासिक केंद्र प्रायोजित कार्यक्रम है, 1977-78 में गर्म और शीत मरुस्थल क्षेत्रों में संसाधन संरक्षण/विकास के लिए शुरू हुआ।"}},{"q":{"en":"When was the National Watershed Development Project for Rainfed Areas (NWDPRA) launched?","hi":"वर्षा-आधारित क्षेत्रों के लिए राष्ट्रीय जलग्रहण विकास परियोजना (NWDPRA) कब शुरू हुआ?"},"a":{"en":"1990–91.","hi":"1990-91।"},"o":[{"en":"1990–91.","hi":"1990-91।"},{"en":"In 1977–78.","hi":"1977-78 में।"},{"en":"In 1982–83.","hi":"1982-83 में।"},{"en":"In 2000–01.","hi":"2000-01 में।"}],"exp":{"en":"1990–91. NWDPRA was launched in 1990–91 using integrated watershed management and sustainable farming concepts; it was later subsumed under Macro Management of Agriculture from 2000–01.","hi":"1990-91। NWDPRA 1990-91 में एकीकृत जलग्रहण प्रबंधन और सतत कृषि अवधारणाओं पर शुरू हुआ; 2000-01 से बाद में व्यापक प्रबंधन का कृषि में समाहित किया गया।"}}]},{"title":{"en":"5. Cyclone & Disaster Management","hi":"5। चक्रवात एवं आपदा प्रबंधन"},"questions":[{"q":{"en":"What is a cyclone?","hi":"चक्रवात क्या है?"},"a":{"en":"A large-scale low-pressure weather system with winds rotating around its centre; cyclones include tropical and extratropical systems. In the North Indian Ocean, IMD calls a tropical system a 'cyclonic storm' from 34-knot sustained winds.","hi":"एक बड़ा-पैमाना निम्न-दाब मौसम प्रणाली जिसमें पवन केंद्र के आसपास घूमती हैं; चक्रवात उष्णकटिबंधीय और बहिरुष्णकटिबंधीय दोनों हो सकते हैं। उत्तरी हिंद महासागर में IMD 34-नॉट निरंतर पवन से उष्णकटिबंधीय प्रणाली को 'चक्रवाती तूफान' वर्गीकृत करता है।"},"o":[{"en":"A large-scale low-pressure weather system with winds rotating around its centre; cyclones include tropical and extratropical systems. In the North Indian Ocean, IMD calls a tropical system a 'cyclonic storm' from 34-knot sustained winds.","hi":"एक बड़ा-पैमाना निम्न-दाब मौसम प्रणाली जिसमें पवन केंद्र के आसपास घूमती हैं; चक्रवात उष्णकटिबंधीय और बहिरुष्णकटिबंधीय दोनों हो सकते हैं। उत्तरी हिंद महासागर में IMD 34-नॉट निरंतर पवन से उष्णकटिबंधीय प्रणाली को 'चक्रवाती तूफान' वर्गीकृत करता है।"},{"en":"A high-pressure centre found only at the poles.","hi":"केवल ध्रुवों पर पाया जाने वाला उच्च-दाब केंद्र।"},{"en":"A tornado-shaped funnel that exists only over land.","hi":"केवल भूमि पर विद्यमान करने वाला बवंडराकार कीप।"},{"en":"A sudden temperature drop in deserts.","hi":"मरुस्थलों में अचानक तापमान गिरावट।"}],"exp":{"en":"A large-scale low-pressure weather system with winds rotating around its centre; cyclones include tropical and extratropical systems. In the North Indian Ocean, IMD calls a tropical system a 'cyclonic storm' from 34-knot sustained winds. A cyclone is defined by organised cyclonic circulation around low pressure. IMD intensity classes over the North Indian Ocean use maximum sustained wind speed.","hi":"एक बड़ा-पैमाना निम्न-दाब मौसम प्रणाली जिसमें पवन केंद्र के आसपास घूमती हैं; चक्रवात उष्णकटिबंधीय और बहिरुष्णकटिबंधीय दोनों हो सकते हैं। उत्तरी हिंद महासागर में IMD 34-नॉट निरंतर पवन से उष्णकटिबंधीय प्रणाली को 'चक्रवाती तूफान' वर्गीकृत करता है। चक्रवात व्यवस्थित चक्रवाती परिसंचरण के आसपास निम्न दाब से परिभाषित होता है। उत्तरी हिंद महासागर में IMD तीव्रता श्रेणियाँ अधिकतम निरंतर पवन वेग का उपयोग करती हैं।"}},{"q":{"en":"What are the major hazards produced by a tropical cyclone?","hi":"उष्णकटिबंधीय चक्रवात के प्रमुख खतरे क्या हैं?"},"a":{"en":"Destructive winds, very heavy rainfall and inland flooding, storm surge and coastal inundation, high waves, infrastructure damage and cascading power/communication failures.","hi":"विनाशकारी पवन, अत्यधिक भारी वर्षा और अंतर्देशीय जलभराव, तूफानी ज्वार और तटीय जलप्लावन, उच्च तरंगें, अवसंरचना क्षति तथा क्रमिक विद्युत/संचार विफलताएँ।"},"o":[{"en":"Destructive winds, very heavy rainfall and inland flooding, storm surge and coastal inundation, high waves, infrastructure damage and cascading power/communication failures.","hi":"विनाशकारी पवन, अत्यधिक भारी वर्षा और अंतर्देशीय जलभराव, तूफानी ज्वार और तटीय जलप्लावन, उच्च तरंगें, अवसंरचना क्षति तथा क्रमिक विद्युत/संचार विफलताएँ।"},{"en":"Only widespread drought.","hi":"केवल व्यापक सूखा।"},{"en":"Only earthquakes.","hi":"केवल भूकंप।"},{"en":"Only ozone-layer depletion.","hi":"केवल ओजोन-परत क्षय।"}],"exp":{"en":"Destructive winds, very heavy rainfall and inland flooding, storm surge and coastal inundation, high waves, infrastructure damage and cascading power/communication failures. Storm surge is often the most dangerous coastal component, while rainfall flooding and destructive winds can extend far inland.","hi":"विनाशकारी पवन, अत्यधिक भारी वर्षा और अंतर्देशीय जलभराव, तूफानी ज्वार और तटीय जलप्लावन, उच्च तरंगें, अवसंरचना क्षति तथा क्रमिक विद्युत/संचार विफलताएँ। तूफानी ज्वार अक्सर सबसे खतरनाक तटीय घटक होता है, जबकि वर्षा जलभराव और विनाशकारी पवन अंतर्देशीय क्षेत्रों तक प्रभाव डाल सकते हैं।"}},{"q":{"en":"Which measures reduce cyclone risk?","hi":"चक्रवात जोखिम को कौन-से उपाय कम करते हैं?"},"a":{"en":"Accurate forecasting and early warning, timely evacuation, cyclone shelters, cyclone-resistant construction and critical infrastructure, coastal-zone planning, and protection/restoration of natural buffers such as mangroves.","hi":"सटीक पूर्वानुमान और पूर्व चेतावनी, समय पर निकासी, चक्रवात आश्रय-स्थल, चक्रवात-रोधी निर्माण/महत्वपूर्ण अवसंरचना, तटीय-क्षेत्र नियोजन और मैंग्रोव जैसे प्राकृतिक सुरक्षात्मक पट्टियाँ का संरक्षण/पुनर्स्थापन।"},"o":[{"en":"Accurate forecasting and early warning, timely evacuation, cyclone shelters, cyclone-resistant construction and critical infrastructure, coastal-zone planning, and protection/restoration of natural buffers such as mangroves.","hi":"सटीक पूर्वानुमान और पूर्व चेतावनी, समय पर निकासी, चक्रवात आश्रय-स्थल, चक्रवात-रोधी निर्माण/महत्वपूर्ण अवसंरचना, तटीय-क्षेत्र नियोजन और मैंग्रोव जैसे प्राकृतिक सुरक्षात्मक पट्टियाँ का संरक्षण/पुनर्स्थापन।"},{"en":"Building a concrete wall across the entire ocean.","hi":"संपूर्ण महासागर भर में कंक्रीट की दीवार बनाना।"},{"en":"Pumping seawater out before a cyclone arrives.","hi":"चक्रवात आने से पहले समुद्री जल को बाहर पंप करना।"},{"en":"Covering the whole coastline with plastic sheets.","hi":"पूरी तटरेखा को प्लास्टिक की चादरों से ढकना।"}],"exp":{"en":"Accurate forecasting and early warning, timely evacuation, cyclone shelters, cyclone-resistant construction and critical infrastructure, coastal-zone planning, and protection/restoration of natural buffers such as mangroves. Mangroves can reduce wave and surge energy locally, but they are not a substitute for forecasting, evacuation, shelters and resilient construction.","hi":"सटीक पूर्वानुमान और पूर्व चेतावनी, समय पर निकासी, चक्रवात आश्रय-स्थल, चक्रवात-रोधी निर्माण/महत्वपूर्ण अवसंरचना, तटीय-क्षेत्र नियोजन और मैंग्रोव जैसे प्राकृतिक सुरक्षात्मक पट्टियाँ का संरक्षण/पुनर्स्थापन। मैंग्रोव स्थानीय रूप से तरंग/उभार ऊर्जा कम कर सकते हैं, लेकिन पूर्वानुमान, निकासी, आश्रय-स्थल और आपदा-रोधी निर्माण का विकल्प नहीं हैं।"}},{"q":{"en":"What is the current statutory disaster-management framework in India?","hi":"भारत में वर्तमान वैधानिक आपदा-प्रबंधन ढाँचा क्या है?"},"a":{"en":"The Disaster Management Act, 2005 created NDMA, SDMAs and DDMAs and provides for NIDM and NDRF; the Disaster Management (Amendment) Act, 2025 added or strengthened provisions including UDMAs, NCMC, HLC, State Disaster Response Forces and a National Disaster Database.","hi":"आपदा प्रबंधन अधिनियम, 2005 ने NDMA, SDMAs और DDMAs स्थापित किए तथा NIDM/NDRF का प्रावधान किया; आपदा प्रबंधन (संशोधन) अधिनियम, 2025 ने UDMAs, NCMC, HLC, राज्य आपदा प्रतिक्रिया बल और राष्ट्रीय आपदा डेटाबेस जैसे प्रावधान जोड़े या सुदृढ़ किए।"},"o":[{"en":"The Disaster Management Act, 2005 created NDMA, SDMAs and DDMAs and provides for NIDM and NDRF; the Disaster Management (Amendment) Act, 2025 added or strengthened provisions including UDMAs, NCMC, HLC, State Disaster Response Forces and a National Disaster Database.","hi":"आपदा प्रबंधन अधिनियम, 2005 ने NDMA, SDMAs और DDMAs स्थापित किए तथा NIDM/NDRF का प्रावधान किया; आपदा प्रबंधन (संशोधन) अधिनियम, 2025 ने UDMAs, NCMC, HLC, राज्य आपदा प्रतिक्रिया बल और राष्ट्रीय आपदा डेटाबेस जैसे प्रावधान जोड़े या सुदृढ़ किए।"},{"en":"Disaster management is handled only by the armed forces.","hi":"आपदा प्रबंधन केवल सशस्त्र बल इसका प्रबंधन करते हैं।"},{"en":"Only one NGO coordinates all disaster response.","hi":"केवल एक NGO सभी आपदा प्रतिक्रिया समन्वय करता है।"},{"en":"The Act created only village-level authorities and no national body.","hi":"अधिनियम ने केवल ग्राम-स्तरीय प्राधिकरण स्थापित किए, राष्ट्रीय निकाय नहीं।"}],"exp":{"en":"The Disaster Management Act, 2005 created NDMA, SDMAs and DDMAs and provides for NIDM and NDRF; the Disaster Management (Amendment) Act, 2025 added or strengthened provisions including UDMAs, NCMC, HLC, State Disaster Response Forces and a National Disaster Database. The 2025 amendment updated the 2005 framework for contemporary risks, including urban disaster governance, statutory national committees, State response forces and a National Disaster Database.","hi":"आपदा प्रबंधन अधिनियम, 2005 ने NDMA, SDMAs और DDMAs स्थापित किए तथा NIDM/NDRF का प्रावधान किया; आपदा प्रबंधन (संशोधन) अधिनियम, 2025 ने UDMAs, NCMC, HLC, राज्य आपदा प्रतिक्रिया बल और राष्ट्रीय आपदा डेटाबेस जैसे प्रावधान जोड़े या सुदृढ़ किए। 2025 संशोधन ने 2005 ढाँचे को वर्तमान जोखिम के लिए अद्यतन किया, जिसमें नगरीय आपदा शासन, वैधानिक राष्ट्रीय समितियाँ, राज्य प्रतिक्रिया बल और राष्ट्रीय आपदा डेटाबेस।"}}]},{"title":{"en":"6. Other Disasters","hi":"6। अन्य आपदाएँ"},"questions":[{"q":{"en":"What is a cloudburst?","hi":"बादल फटना क्या है?"},"a":{"en":"An extreme short-duration rainfall event over a small area, commonly defined by IMD research as rainfall of 100 mm or more in one hour; it can trigger flash floods and landslides, especially in hilly terrain.","hi":"छोटे क्षेत्र पर अत्यधिक अल्पावधि वर्षा घटना, जिसे IMD अनुसंधान में सामान्यतः 100 मिमी या अधिक वर्षा में एक घंटा के रूप में परिभाषित किया जाता है; यह विशेष रूप से पहाड़ी भूभाग में आकस्मिक बाढ़ और भूस्खलन उत्पन्न कर सकता है।"},"o":[{"en":"An extreme short-duration rainfall event over a small area, commonly defined by IMD research as rainfall of 100 mm or more in one hour; it can trigger flash floods and landslides, especially in hilly terrain.","hi":"छोटे क्षेत्र पर अत्यधिक अल्पावधि वर्षा घटना, जिसे IMD अनुसंधान में सामान्यतः 100 मिमी या अधिक वर्षा में एक घंटा के रूप में परिभाषित किया जाता है; यह विशेष रूप से पहाड़ी भूभाग में आकस्मिक बाढ़ और भूस्खलन उत्पन्न कर सकता है।"},{"en":"A cloud physically exploding in the sky.","hi":"आकाश में आकाश में बादल का भौतिक रूप से फटना।"},{"en":"A desert snowstorm.","hi":"मरुस्थल हिम-तूफान।"},{"en":"Any fog entering a valley.","hi":"घाटी में प्रवेश करने वाला कोई कोहरा।"}],"exp":{"en":"An extreme short-duration rainfall event over a small area, commonly defined by IMD research as rainfall of 100 mm or more in one hour; it can trigger flash floods and landslides, especially in hilly terrain. Cloudbursts are highly localised and short-lived; the danger comes from the rainfall intensity, which can overwhelm drainage and destabilise steep slopes.","hi":"छोटे क्षेत्र पर अत्यधिक अल्पावधि वर्षा घटना, जिसे IMD अनुसंधान में सामान्यतः 100 मिमी या अधिक वर्षा में एक घंटा के रूप में परिभाषित किया जाता है; यह विशेष रूप से पहाड़ी भूभाग में आकस्मिक बाढ़ और भूस्खलन उत्पन्न कर सकता है। बादल फटना अत्यधिक स्थानीयकृत और अल्पकालिक होते हैं; खतरा वर्षा तीव्रता से आता है, जो जल-निकासी अक्षम कर देना और तीव्र ढालों अस्थिर कर सकती है।"}},{"q":{"en":"When and where did the Bhopal gas disaster occur, and which chemical was central to the release?","hi":"भोपाल गैस त्रासदी कब और कहाँ हुई और रिसाव में कौन-सा रसायन मुख्य था?"},"a":{"en":"Bhopal, Madhya Pradesh, on the night of 2–3 December 1984; methyl isocyanate (MIC) was the principal toxic chemical released.","hi":"भोपाल, मध्य प्रदेश में 2-3 दिसंबर 1984 की रात; मिथाइल आइसोसाइनेट (MIC) मुख्य उत्सर्जित विषाक्त रसायन था।"},"o":[{"en":"Bhopal, Madhya Pradesh, on the night of 2–3 December 1984; methyl isocyanate (MIC) was the principal toxic chemical released.","hi":"भोपाल, मध्य प्रदेश में 2-3 दिसंबर 1984 की रात; मिथाइल आइसोसाइनेट (MIC) मुख्य उत्सर्जित विषाक्त रसायन था।"},{"en":"Delhi, 3 December 1986; carbon monoxide.","hi":"दिल्ली, 3 दिसंबर 1986; कार्बन मोनोऑक्साइड।"},{"en":"Mumbai, 26 April 1984; chlorine.","hi":"मुंबई, 26 अप्रैल 1984; क्लोरीन।"},{"en":"Chernobyl, 3 December 1984; radioactive iodine only.","hi":"चेरनोबिल, 3 दिसंबर 1984; केवल रेडियोधर्मी आयोडीन।"}],"exp":{"en":"Bhopal, Madhya Pradesh, on the night of 2–3 December 1984; methyl isocyanate (MIC) was the principal toxic chemical released. The leak occurred from a Union Carbide pesticide plant; MIC and its reaction products exposed a very large surrounding population.","hi":"भोपाल, मध्य प्रदेश में 2-3 दिसंबर 1984 की रात; मिथाइल आइसोसाइनेट (MIC) मुख्य उत्सर्जित विषाक्त रसायन था। रिसाव संघ कार्बाइड कीटनाशक पौधा से हुआ; MIC और उसके अभिक्रिया उत्पादों ने बड़ा आसपास जनसंख्या को उद्भासित किया।"}},{"q":{"en":"When and where did the Chernobyl nuclear accident occur?","hi":"चेरनोबिल परमाणु दुर्घटना कब और कहाँ हुआ?"},"a":{"en":"26 April 1986 at Reactor 4 of the Chernobyl Nuclear Power Plant in the Ukrainian SSR of the Soviet Union, in present-day Ukraine.","hi":"26 अप्रैल 1986 को चेरनोबिल परमाणु ऊर्जा संयंत्र के रिएक्टर 4 में, तब यूक्रेनी सोवियत समाजवादी गणराज्य का सोवियत संघ, वर्तमान यूक्रेन।"},"o":[{"en":"26 April 1986 at Reactor 4 of the Chernobyl Nuclear Power Plant in the Ukrainian SSR of the Soviet Union, in present-day Ukraine.","hi":"26 अप्रैल 1986 को चेरनोबिल परमाणु ऊर्जा संयंत्र के रिएक्टर 4 में, तब यूक्रेनी सोवियत समाजवादी गणराज्य का सोवियत संघ, वर्तमान यूक्रेन।"},{"en":"3 December 1984 in Russia, caused by a gas leak.","hi":"3 दिसंबर 1984 रूस में, गैस रिसाव से।"},{"en":"26 April 1986 in Japan, caused by an earthquake.","hi":"26 अप्रैल 1986 जापान में, भूकंप से।"},{"en":"2 February 1971 in Germany, caused by a toxic spill.","hi":"2 फ़रवरी 1971 जर्मनी में, विषाक्त रिसाव से।"}],"exp":{"en":"26 April 1986 at Reactor 4 of the Chernobyl Nuclear Power Plant in the Ukrainian SSR of the Soviet Union, in present-day Ukraine. Reactor 4 was destroyed during a safety test and released large amounts of radioactive material; at the time, the site was within the Soviet Union.","hi":"26 अप्रैल 1986 को चेरनोबिल परमाणु ऊर्जा संयंत्र के रिएक्टर 4 में, तब यूक्रेनी सोवियत समाजवादी गणराज्य का सोवियत संघ, वर्तमान यूक्रेन। सुरक्षा परीक्षण के दौरान रिएक्टर 4 नष्ट हुआ और बड़े पैमाने पर रेडियोधर्मी पदार्थों का उत्सर्जन हुआ; उस समय स्थल सोवियत संघ के भीतर था।"}},{"q":{"en":"What was the elapsed time between the Bhopal gas disaster (3 December 1984 reference date) and the Chernobyl accident (26 April 1986)?","hi":"भोपाल गैस त्रासदी (3 दिसंबर 1984 संदर्भ तिथि) और चेरनोबिल दुर्घटना (26 अप्रैल 1986) के बीच बीता समय कितना था?"},"a":{"en":"509 days — about 1 year, 4 months and 23 days; the calendar years differ by two.","hi":"509 दिन - लगभग 1 वर्ष, 4 महीने और 23 दिन; कैलेंडर वर्ष दो वर्ष अलग हैं।"},"o":[{"en":"509 days — about 1 year, 4 months and 23 days; the calendar years differ by two.","hi":"509 दिन - लगभग 1 वर्ष, 4 महीने और 23 दिन; कैलेंडर वर्ष दो वर्ष अलग हैं।"},{"en":"Exactly 2 full years.","hi":"ठीक 2 पूरा वर्ष।"},{"en":"Exactly 10 years.","hi":"ठीक 10 वर्ष।"},{"en":"They occurred on the same date.","hi":"दोनों समान तिथि पर हुए।"}],"exp":{"en":"509 days — about 1 year, 4 months and 23 days; the calendar years differ by two. Calling this an 'exact two-year gap' is inaccurate because the actual elapsed interval is 509 days; only the year labels differ by two.","hi":"509 दिन - लगभग 1 वर्ष, 4 महीने और 23 दिन; कैलेंडर वर्ष दो वर्ष अलग हैं। इसे 'सटीक दो-वर्ष अंतराल' कहना असटीक है क्योंकि वास्तविक बीता अंतराल 509 दिन है; केवल वर्ष श्रेणी-नाम दो वर्ष अलग हैं।"}}]},{"title":{"en":"7. Common Confusions & Reverse Questions","hi":"7। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"Which Earthquake Zone does Delhi fall into?","hi":"दिल्ली किस भूकंप जोन में आती है?"},"a":{"en":"Delhi is in Seismic Zone IV, the high-damage-risk zone.","hi":"दिल्ली भूकंपीय क्षेत्र IV में है, जो उच्च-क्षति-जोखिम क्षेत्र है।"},"o":[{"en":"Delhi is in Seismic Zone IV, the high-damage-risk zone.","hi":"दिल्ली भूकंपीय क्षेत्र IV में है, जो उच्च-क्षति-जोखिम क्षेत्र है।"},{"en":"Zone-2 (Minimum impact).","hi":"ज़ोन-2 (न्यूनतम प्रभाव)।"},{"en":"Zone-3 (Moderate impact).","hi":"ज़ोन-3 (मध्यम प्रभाव)।"},{"en":"Zone-5 (Very high impact).","hi":"ज़ोन-5 (अत्यधिक प्रभाव)।"}],"exp":{"en":"Delhi is in Seismic Zone IV, the high-damage-risk zone. Delhi's Zone IV classification is a useful reminder that seismic hazard does not follow simple plains-versus-mountains geography.","hi":"दिल्ली भूकंपीय क्षेत्र IV में है, जो उच्च-क्षति-जोखिम क्षेत्र है। दिल्ली का क्षेत्र IV वर्गीकरण बताता है कि भूकंपीय संकट सरल मैदानी बनाम पर्वतीय भौगोलिक स्थिति अनुसरण नहीं करता।"}},{"q":{"en":"Which came first: the Desert Development Programme or the National Watershed Development Project?","hi":"मरुस्थल विकास कार्यक्रम और राष्ट्रीय वाटरशेड विकास परियोजना में से कौन पहले शुरू हुआ?"},"a":{"en":"The Desert Development Programme (1977–78) started before the National Watershed Development Project for Rainfed Areas (1990–91).","hi":"मरुस्थल विकास कार्यक्रम (1977-78), वर्षा-आधारित क्षेत्रों के लिए राष्ट्रीय जलग्रहण विकास परियोजना (1990-91) से पहले शुरू हुआ।"},"o":[{"en":"The Desert Development Programme (1977–78) started before the National Watershed Development Project for Rainfed Areas (1990–91).","hi":"मरुस्थल विकास कार्यक्रम (1977-78), वर्षा-आधारित क्षेत्रों के लिए राष्ट्रीय जलग्रहण विकास परियोजना (1990-91) से पहले शुरू हुआ।"},{"en":"Desert Development Programme = 1990–91; National Watershed Development Project = 1977–78.","hi":"मरुस्थल विकास कार्यक्रम = 1990-91; राष्ट्रीय वाटरशेड विकास परियोजना = 1977-78।"},{"en":"Both started in 1977-78.","hi":"दोनों 1977-78 में शुरू हुए।"},{"en":"Both started in 1990-91.","hi":"दोनों 1990-91 में शुरू हुए।"}],"exp":{"en":"The Desert Development Programme (1977–78) started before the National Watershed Development Project for Rainfed Areas (1990–91). The two programme dates are historical; DDP predates NWDPRA by roughly thirteen years.","hi":"मरुस्थल विकास कार्यक्रम (1977-78), वर्षा-आधारित क्षेत्रों के लिए राष्ट्रीय जलग्रहण विकास परियोजना (1990-91) से पहले शुरू हुआ। दोनों कार्यक्रम तिथियाँ ऐतिहासिक हैं; DDP, NWDPRA से लगभग तेरह वर्ष पहले है।"}},{"q":{"en":"How far apart were the Bhopal gas disaster and the Chernobyl accident?","hi":"भोपाल गैस त्रासदी और चेरनोबिल दुर्घटना कितने समय अलग थे?"},"a":{"en":"Bhopal: night of 2–3 December 1984; Chernobyl: 26 April 1986 — 509 days apart (about 1 year, 4 months and 23 days).","hi":"भोपाल: 2-3 दिसंबर 1984 की रात; चेरनोबिल: 26 अप्रैल 1986 - 509 दिन अलग (लगभग 1 वर्ष, 4 महीने और 23 दिन)।"},"o":[{"en":"Bhopal: night of 2–3 December 1984; Chernobyl: 26 April 1986 — 509 days apart (about 1 year, 4 months and 23 days).","hi":"भोपाल: 2-3 दिसंबर 1984 की रात; चेरनोबिल: 26 अप्रैल 1986 - 509 दिन अलग (लगभग 1 वर्ष, 4 महीने और 23 दिन)।"},{"en":"Exactly 2 full years apart.","hi":"ठीक 2 पूरा वर्ष अलग।"},{"en":"Exactly 10 years apart.","hi":"ठीक 10 वर्ष अलग।"},{"en":"They occurred in the same month and year.","hi":"समान महीना और वर्ष में हुए।"}],"exp":{"en":"Bhopal: night of 2–3 December 1984; Chernobyl: 26 April 1986 — 509 days apart (about 1 year, 4 months and 23 days). Using exact dates avoids the misleading shortcut of subtracting only the calendar years 1984 and 1986.","hi":"भोपाल: 2-3 दिसंबर 1984 की रात; चेरनोबिल: 26 अप्रैल 1986 - 509 दिन अलग (लगभग 1 वर्ष, 4 महीने और 23 दिन)। सटीक तिथियाँ उपयोग करने से 1984 और 1986 के कैलेंडर वर्ष को केवल वर्ष घटाने वाली भ्रामक गणना से बचा जा सकता है।"}},{"q":{"en":"What are the main causes of a Tsunami?","hi":"सुनामी के मुख्य कारण क्या हैं?"},"a":{"en":"Large undersea/near-coast earthquakes are the most common cause; volcanic activity and submarine/coastal landslides can also generate tsunamis.","hi":"बड़ा समुद्रतलीय/के निकट-तट भूकंप अधिकांश सामान्य कारण हैं; ज्वालामुखीय गतिविधि और समुद्रतलीय/तटीय भूस्खलन भी सुनामी उत्पन्न कर सकते हैं।"},"o":[{"en":"Large undersea/near-coast earthquakes are the most common cause; volcanic activity and submarine/coastal landslides can also generate tsunamis.","hi":"बड़ा समुद्रतलीय/के निकट-तट भूकंप अधिकांश सामान्य कारण हैं; ज्वालामुखीय गतिविधि और समुद्रतलीय/तटीय भूस्खलन भी सुनामी उत्पन्न कर सकते हैं।"},{"en":"It is caused only by earthquakes.","hi":"यह केवल भूकंप के कारण होता है।"},{"en":"It is caused only by extreme tides from the moon.","hi":"यह केवल चंद्रमा से आने वाले चरम ज्वार के कारण होता है।"},{"en":"It is caused only by hurricanes.","hi":"यह केवल तूफ़ानों के कारण होता है।"}],"exp":{"en":"Large undersea/near-coast earthquakes are the most common cause; volcanic activity and submarine/coastal landslides can also generate tsunamis. Earthquakes dominate global tsunami generation, but any process that rapidly displaces a sufficiently large water mass can potentially generate a tsunami.","hi":"बड़ा समुद्रतलीय/के निकट-तट भूकंप अधिकांश सामान्य कारण हैं; ज्वालामुखीय गतिविधि और समुद्रतलीय/तटीय भूस्खलन भी सुनामी उत्पन्न कर सकते हैं। वैश्विक सुनामी उत्पत्ति में भूकंप प्रमुख करते हैं, लेकिन पर्याप्त रूप से बड़ा जल द्रव्यमान को तेज़ी से विस्थापित करने वाला प्रक्रिया सुनामी उत्पन्न कर सकता है।"}},{"q":{"en":"Which categories are commonly used to describe drought?","hi":"सूखा को सामान्यतः किन श्रेणियाँ में वर्णन किया जाता है?"},"a":{"en":"Meteorological, hydrological and agricultural drought are the principal categories; socio-economic drought is also widely recognised.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी सूखा मुख्य श्रेणियाँ हैं; सामाजिक-आर्थिक सूखा भी व्यापक रूप से मान्यता प्राप्त है।"},"o":[{"en":"Meteorological, hydrological and agricultural drought are the principal categories; socio-economic drought is also widely recognised.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी सूखा मुख्य श्रेणियाँ हैं; सामाजिक-आर्थिक सूखा भी व्यापक रूप से मान्यता प्राप्त है।"},{"en":"Drought is only an atmospheric disaster.","hi":"सूखा केवल वायुमंडलीय आपदा है।"},{"en":"Drought is only a geological disaster.","hi":"सूखा केवल भूवैज्ञानिक आपदा है।"},{"en":"Drought is always a biological disaster.","hi":"सूखा सदैव जैविक आपदा है।"}],"exp":{"en":"Meteorological, hydrological and agricultural drought are the principal categories; socio-economic drought is also widely recognised. Drought categories describe different manifestations of water shortage rather than mutually exclusive disasters; one event can evolve across several categories.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी सूखा मुख्य श्रेणियाँ हैं; सामाजिक-आर्थिक सूखा भी व्यापक रूप से मान्यता प्राप्त है। सूखा श्रेणियाँ जल कमी की अलग रूप वर्णन करती हैं; एक घटना कई श्रेणियाँ भर में विकसित कर सकता है।"}}]},{"title":{"en":"8. Final Revision","hi":"8। अंतिम पुनरावृत्ति"},"questions":[{"q":{"en":"Earthquake Zones in India?","hi":"भारत में भूकंप क्षेत्र?"},"a":{"en":"4 — Zones II, III, IV and V.","hi":"4 - क्षेत्र II, III, IV और V।"},"o":[{"en":"4 — Zones II, III, IV and V.","hi":"4 - क्षेत्र II, III, IV और V।"},{"en":"5 (Zone 1-5).","hi":"5 (जोन 1-5)।"},{"en":"3 (Zone 3-5).","hi":"3 (ज़ोन 3-5)।"},{"en":"6 (Zone 1-6).","hi":"6 (ज़ोन 1-6)।"}],"exp":{"en":"4 — Zones II, III, IV and V. India's current seismic-zone shorthand is II–V, with risk generally increasing toward Zone V.","hi":"4 - क्षेत्र II, III, IV और V। भारत का वर्तमान भूकंपीय क्षेत्रीकरण II-V है, जोखिम सामान्यतः क्षेत्र V की ओर बढ़ता है।"}},{"q":{"en":"Delhi's earthquake zone?","hi":"दिल्ली का भूकंप क्षेत्र?"},"a":{"en":"Zone IV — high damage risk.","hi":"क्षेत्र IV - उच्च क्षति जोखिम।"},"o":[{"en":"Zone IV — high damage risk.","hi":"क्षेत्र IV - उच्च क्षति जोखिम।"},{"en":"Zone-2.","hi":"ज़ोन-2।"},{"en":"Zone-3.","hi":"ज़ोन-3।"},{"en":"Zone-5.","hi":"ज़ोन-5।"}],"exp":{"en":"Zone IV — high damage risk. India's current seismic-zone shorthand is II–V, with risk generally increasing toward Zone V.","hi":"क्षेत्र IV - उच्च क्षति जोखिम। भारत का वर्तमान भूकंपीय क्षेत्रीकरण II-V है, जोखिम सामान्यतः क्षेत्र V की ओर बढ़ता है।"}},{"q":{"en":"Most severe earthquake zone?","hi":"सबसे गंभीर भूकंप क्षेत्र?"},"a":{"en":"Zone V — very high damage risk.","hi":"क्षेत्र V - अत्यधिक उच्च क्षति जोखिम।"},"o":[{"en":"Zone V — very high damage risk.","hi":"क्षेत्र V - अत्यधिक उच्च क्षति जोखिम।"},{"en":"Zone-4.","hi":"ज़ोन-4।"},{"en":"Zone-6.","hi":"ज़ोन-6।"},{"en":"Zone-1.","hi":"ज़ोन-1।"}],"exp":{"en":"Zone V — very high damage risk. India's current seismic-zone shorthand is II–V, with risk generally increasing toward Zone V.","hi":"क्षेत्र V - अत्यधिक उच्च क्षति जोखिम। भारत का वर्तमान भूकंपीय क्षेत्रीकरण II-V है, जोखिम सामान्यतः क्षेत्र V की ओर बढ़ता है।"}},{"q":{"en":"Tsunami word origin?","hi":"सुनामी शब्द की उत्पत्ति?"},"a":{"en":"Japanese.","hi":"जापानी।"},"o":[{"en":"Japanese.","hi":"जापानी।"},{"en":"Indonesian.","hi":"इंडोनेशियाई।"},{"en":"Hawaiian.","hi":"हवाईयन।"},{"en":"Greek.","hi":"यूनानी।"}],"exp":{"en":"Japanese. The Japanese origin is linguistic; tsunami generation is a geophysical ocean process, not a tidal process.","hi":"जापानी। जापानी उत्पत्ति भाषायी है; सुनामी उत्पत्ति भूभौतिकीय महासागर प्रक्रिया है, ज्वारीय प्रक्रिया नहीं।"}},{"q":{"en":"Indian Tsunami Early Warning System year?","hi":"भारतीय सुनामी प्रारंभिक चेतावनी प्रणाली वर्ष?"},"a":{"en":"2007; the full-fledged system became operational in October 2007.","hi":"2007; पूर्ण विकसित प्रणाली अक्टूबर 2007 में कार्यशील हुई।"},"o":[{"en":"2007; the full-fledged system became operational in October 2007.","hi":"2007; पूर्ण विकसित प्रणाली अक्टूबर 2007 में कार्यशील हुई।"},{"en":"2004.","hi":"2004।"},{"en":"2005.","hi":"2005।"},{"en":"2010.","hi":"2010।"}],"exp":{"en":"2007; the full-fledged system became operational in October 2007. INCOIS operates India's full-fledged 24×7 tsunami early-warning capability.","hi":"2007; पूर्ण विकसित प्रणाली अक्टूबर 2007 में कार्यशील हुई। INCOIS भारत की पूर्ण विकसित 24×7 सुनामी पूर्व चेतावनी क्षमता संचालित करता है।"}},{"q":{"en":"Major drought categories?","hi":"प्रमुख सूखा श्रेणियाँ?"},"a":{"en":"Meteorological, hydrological and agricultural; socio-economic is also commonly recognised.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी; सामाजिक-आर्थिक भी सामान्यतः मान्यता प्राप्त है।"},"o":[{"en":"Meteorological, hydrological and agricultural; socio-economic is also commonly recognised.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी; सामाजिक-आर्थिक भी सामान्यतः मान्यता प्राप्त है।"},{"en":"Only atmospheric drought.","hi":"केवल वायुमंडलीय सूखा।"},{"en":"Only geological drought.","hi":"केवल भूवैज्ञानिक सूखा।"},{"en":"Only biological drought.","hi":"केवल जैविक सूखा।"}],"exp":{"en":"Meteorological, hydrological and agricultural; socio-economic is also commonly recognised. These categories separate rainfall deficiency, water-resource shortage, crop/soil-moisture stress and socio-economic consequences.","hi":"मौसम-विज्ञान संबंधी, जलवैज्ञानिक और कृषि-संबंधी; सामाजिक-आर्थिक भी सामान्यतः मान्यता प्राप्त है। ये श्रेणियाँ वर्षा कमी, जल-संसाधन कमी, फसल/मृदा-नमी तनाव और सामाजिक-आर्थिक परिणाम अलग करती हैं।"}},{"q":{"en":"Desert Development Programme year?","hi":"मरु             ${subjects.map(s => `
                <div onclick="goToChapters('${s.replace(/'/g,"\\'")}')" class="card-hover cursor-pointer rounded-2xl overflow-hidden shadow-lg bg-white border border-gray-200">
                    <div class="bg-gradient-to-br ${SUBJECT_META[s].color} p-6 text-white">
                        <div class="text-4xl mb-2">${SUBJECT_META[s].icon}</div>
                        <div class="text-xl font-bold">${s}</div>
                    </div>
                    <div class="p-5">
                        <p class="text-sm text-gray-600 mb-3">${SUBJECT_META[s].desc}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-2xl font-bold" style="color:var(--gold)">${subjectQCount(s)}</span>
                            <span class="text-xs text-gray-500">questions</span>
                        </div>
                    </div>
                </div>
            `).join('')}
        </div>
        <div class="text-center mt-10 text-xs text-gray-400">examfusionprep.com &middot; works fully offline once loaded</div>
    </div>`;
}

function renderChapters() {
    const chapters = MASTER[state.subject];
    const names = Object.keys(chapters);
    return `
    <div class="max-w-4xl mx-auto px-4 pt-6 fade-in">
        <button onclick="goHome()" class="mb-4 text-sm px-3 py-1.5 rounded-lg bg-white border border-gray-300 hover:bg-gray-50" style="color:var(--deep)">&larr; All Subjects</button>
        <div class="mb-6">
            <h2 class="text-2xl font-bold" style="color:var(--ink)">${state.subject}</h2>
            <p class="text-xs text-gray-500">${SUBJECT_META[state.subject].desc}</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${names.map(name => `
                <div onclick="goToQuiz('${name.replace(/'/g,"\\'")}')" class="card-hover cursor-pointer bg-white rounded-xl border border-gray-200 shadow p-4 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-white flex-shrink-0" style="background:var(--gold)">${chapterNum(name)}</div>
                    <div class="min-w-0">
                        <div class="font-semibold text-sm" style="color:var(--ink)">${chapterDisplayName(name)}</div>
                        <div class="text-xs text-gray-500 mt-0.5">${chapterQCount(chapters[name])} questions &middot; ${chapters[name].length} sections</div>
                    </div>
                </div>
            `).join('')}
        </div>
    </div>`;
}

function renderQuiz() {
    const sections = state.quizData;
    const sec = sections[state.currentSection];
    return `
    <div class="max-w-3xl mx-auto px-3 pt-4 fade-in">
        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
            <button onclick="goToChapters('${state.subject.replace(/'/g,"\\'")}')" class="text-sm px-3 py-1.5 rounded-lg bg-white border border-gray-300 hover:bg-gray-50" style="color:var(--deep)">&larr; Chapters</button>
            <div class="flex gap-3 text-xs font-semibold">
                <span class="px-2 py-1 rounded bg-gray-100">Total: ${state.score.attempted}/${sections.reduce((s,x)=>s+x.questions.length,0)}</span>
                <span class="px-2 py-1 rounded bg-green-100 text-green-700">Correct: ${state.score.correct}</span>
                <span class="px-2 py-1 rounded bg-red-100 text-red-700">Wrong: ${state.score.wrong}</span>
            </div>
        </div>
        <div class="rounded-xl text-white p-4 mb-4" style="background:linear-gradient(135deg,var(--deep),var(--deep2))">
            <div class="text-xs opacity-75 mb-1">${chapterNum(state.chapterName)}. ${state.subject}</div>
            <h2 class="font-bold text-lg">${chapterDisplayName(state.chapterName)}</h2>
        </div>
        <div class="flex gap-2 mb-3 overflow-x-auto pb-2 px-1" style="scroll-snap-type:x proximity">
            ${sections.map((s,i) => `
                <button onclick="switchSection(${i})" title="${s.title.en}"
                    class="section-pill flex-shrink-0 w-9 h-9 rounded-full border-2 flex items-center justify-center text-xs font-bold cursor-pointer bg-white
                        ${i===state.currentSection ? 'active' : (i<state.currentSection ? 'done' : 'border-gray-300 text-gray-500')}"
                    style="scroll-snap-align:center">${i<state.currentSection ? '✓' : i+1}</button>
            `).join('')}
        </div>
        <div class="text-center text-sm mb-4 px-2">
            <span class="inline-block px-3 py-1 rounded-full bg-gray-100 text-xs font-semibold text-gray-500 mb-1">Section ${state.currentSection+1} of ${sections.length}</span>
            <div class="font-bold" style="color:var(--ink)">${sec.title.en}</div>
            <div class="text-xs text-gray-500">${sec.title.hi}</div>
        </div>
        <div id="questions-container" class="space-y-5">
            ${sec.questions.map((q, qi) => renderQuestion(q, qi)).join('')}
        </div>
        <div class="flex justify-between mt-6 mb-10">
            <button onclick="prevSection()" ${state.currentSection===0?'disabled':''} class="px-4 py-2 rounded-lg font-semibold text-sm ${state.currentSection===0?'bg-gray-200 text-gray-400 cursor-not-allowed':'bg-white border border-gray-300 hover:bg-gray-50'}" style="color:var(--deep)">&larr; Prev Section</button>
            <button onclick="nextSection()" class="px-4 py-2 rounded-lg font-semibold text-sm text-white" style="background:var(--gold)">${state.currentSection===sections.length-1?'Finish Chapter':'Next Section'} &rarr;</button>
        </div>
    </div>`;
}

function renderQuestion(q, qi) {
    const key = `${state.currentSection}-${qi}`;
    if (!state.shuffleMap[key]) {
        const order = q.o.map((_, i) => i);
        for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
        }
        state.shuffleMap[key] = order;
    }
    const order = state.shuffleMap[key];
    return `
    <div class="bg-white rounded-xl shadow border border-gray-200 p-4" id="q-${qi}">
        <p class="font-semibold text-sm mb-1" style="color:#2980b9">${qi+1}. ${q.q.en}</p>
        <p class="text-sm mb-3" style="color:#27ae60">${q.q.hi}</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2" id="opts-${qi}">
            ${order.map((origIdx, displayIdx) => `
                <button onclick="selectOption(${qi}, ${displayIdx})" data-qi="${qi}" data-oi="${displayIdx}" class="option-btn text-left px-3 py-2 rounded-lg border-2 border-gray-200 text-sm hover:border-gray-400">
                    <span class="block">${q.o[origIdx].en}</span>
                    <span class="block text-xs text-gray-500">${q.o[origIdx].hi}</span>
                </button>
            `).join('')}
        </div>
        <div id="exp-${qi}" class="hidden mt-3 p-3 rounded-lg text-sm" style="background:#e8f6f3;border-left:4px solid #2ecc71">
            <p style="color:#1a1f2e">${q.exp.en}</p>
            <p class="mt-1 text-xs" style="color:#27ae60">${q.exp.hi}</p>
        </div>
    </div>`;
}

function currentAnswerIndex(q) {
    return q.o.findIndex(o => o.en === q.a.en);
}

function selectOption(qi, displayIdx) {
    const sec = state.quizData[state.currentSection];
    const q = sec.questions[qi];
    const key = `${state.currentSection}-${qi}`;
    const order = state.shuffleMap[key];
    const btns = document.querySelectorAll(`#opts-${qi} .option-btn`);
    if (btns[0].classList.contains('answered')) return;
    const correctOrigIdx = currentAnswerIndex(q);
    const correctDisplayIdx = order.indexOf(correctOrigIdx);
    const clickedOrigIdx = order[displayIdx];
    btns.forEach(b => b.classList.add('answered'));
    btns[displayIdx].classList.add(clickedOrigIdx === correctOrigIdx ? 'correct' : 'incorrect');
    if (clickedOrigIdx !== correctOrigIdx) btns[correctDisplayIdx].classList.add('correct');
    btns.forEach(b => b.onclick = null);
    document.getElementById(`exp-${qi}`).classList.remove('hidden');
    state.score.attempted++;
    if (clickedOrigIdx === correctOrigIdx) state.score.correct++; else state.score.wrong++;
    updateScoreBar();
}

function updateScoreBar() {
    const el = document.querySelector('#app');
    // simplest: just re-render header score without full re-render to keep answered states
    const totalEl = document.querySelector('.px-2.py-1.rounded.bg-gray-100');
    if (totalEl) totalEl.textContent = `Total: ${state.score.attempted}/${state.quizData.reduce((s,x)=>s+x.questions.length,0)}`;
    const correctEl = document.querySelector('.px-2.py-1.rounded.bg-green-100');
    if (correctEl) correctEl.textContent = `Correct: ${state.score.correct}`;
    const wrongEl = document.querySelector('.px-2.py-1.rounded.bg-red-100');
    if (wrongEl) wrongEl.textContent = `Wrong: ${state.score.wrong}`;
}

function switchSection(i) {
    state.currentSection = i;
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
}
function prevSection() {
    if (state.currentSection > 0) { state.currentSection--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function nextSection() {
    if (state.currentSection < state.quizData.length - 1) { state.currentSection++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    else { alert(`Chapter complete!\\nScore: ${state.score.correct} correct / ${state.score.wrong} wrong out of ${state.score.attempted} attempted.`); }
}

function goHome() {
    state.screen = 'home'; state.subject = null; state.chapterName = null; state.quizData = null;
    render(); window.scrollTo({top:0});
}
function goToChapters(subject) {
    state.screen = 'chapters'; state.subject = subject; state.chapterName = null; state.quizData = null;
    render(); window.scrollTo({top:0});
}
function goToQuiz(chapterName) {
    state.screen = 'quiz';
    state.chapterName = chapterName;
    state.quizData = MASTER[state.subject][chapterName];
    state.currentSection = 0;
    state.score = { correct: 0, wrong: 0, attempted: 0 };
    state.shuffleMap = {};
    render(); window.scrollTo({top:0});
}

function render() {
    const app = document.getElementById('app');
    if (state.screen === 'home') app.innerHTML = renderHome();
    else if (state.screen === 'chapters') app.innerHTML = renderChapters();
    else if (state.screen === 'quiz') app.innerHTML = renderQuiz();
}

render();
</script>
</body>
</html>
