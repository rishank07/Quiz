्मिंग से अत्यधिक गर्मी, हिमनद पिघलना, समुद्र-स्तर में वृद्धि, वर्षा में बदलाव, महासागरों का गर्म होना व अम्लीकरण, जैव विविधता हानि और चरम मौसमी आपदाओं का जोखिम बढ़ता है।"}},{"q":{"en":"Does a global temperature increase always reduce the rate of photosynthesis?","hi":"क्या वैश्विक तापमान में वृद्धि से प्रकाश संश्लेषण की दर सदैव घटती है?"},"a":{"en":"No; it depends on species, CO2, water & stress","hi":"नहीं; यह प्रजाति, CO2, जल व तनाव पर निर्भर है"},"o":[{"en":"No; it depends on species, CO2, water & stress","hi":"नहीं; यह प्रजाति, CO2, जल व तनाव पर निर्भर है"},{"en":"Yes; any warming always reduces photosynthesis","hi":"हाँ; कोई भी तापमान वृद्धि इसे सदैव घटाती है"},{"en":"No; temperature has zero effect on photosynthesis","hi":"नहीं; तापमान का इस पर कोई प्रभाव नहीं पड़ता"},{"en":"Yes; higher CO2 can never affect plant growth","hi":"हाँ; उच्च CO2 पौधों की वृद्धि को प्रभावित नहीं करता"}],"exp":{"en":"Plant response is not one-directional: moderate warming or higher CO2 can boost photosynthesis in some plants, whereas excessive heat and drought stress reduce it.","hi":"पौधों की प्रतिक्रिया एकदिशीय नहीं होती: मध्यम उष्मीकरण या उच्च CO2 कुछ पौधों में प्रकाश संश्लेषण बढ़ा सकता है, जबकि अत्यधिक गर्मी और सूखे का तनाव इसे घटा देते हैं।"}},{"q":{"en":"How do the natural Greenhouse Effect and Global Warming differ?","hi":"प्राकृतिक ग्रीनहाउस प्रभाव और ग्लोबल वार्मिंग में क्या अंतर है?"},"a":{"en":"Natural warming vs human-enhanced excess warming","hi":"प्राकृतिक उष्मीकरण बनाम मानव-वर्धित अतिरिक्त उष्मीकरण"},"o":[{"en":"Natural warming vs human-enhanced excess warming","hi":"प्राकृतिक उष्मीकरण बनाम मानव-वर्धित अतिरिक्त उष्मीकरण"},{"en":"Identical terms describing the exact same phenomenon","hi":"बिल्कुल एक ही घटना के समानार्थी शब्द"},{"en":"Industrial heat emissions vs solar flare cycles","hi":"औद्योगिक ऊष्मा उत्सर्जन बनाम सौर ज्वाला चक्र"},{"en":"Tropospheric cooling vs stratospheric ozone hole expansion","hi":"क्षोभमंडलीय शीतलन बनाम समतापमंडलीय ओजोन छिद्र विस्तार"}],"exp":{"en":"The natural greenhouse effect keeps Earth warm enough for life, whereas human-added greenhouse gases enhance that effect and drive modern long-term global warming.","hi":"प्राकृतिक ग्रीनहाउस प्रभाव पृथ्वी को जीवन के लिए गर्म रखता है, जबकि मानवजनित ग्रीनहाउस गैसें इस प्रभाव को बढ़ाकर आधुनिक दीर्घकालिक ग्लोबल वार्मिंग का कारण बनती हैं।"}}]},{"title":{"en":"4. Ozone Layer","hi":"4। ओजोन परत (ओजोन परत)"},"questions":[{"q":{"en":"Where is the Ozone Layer located?","hi":"ओजोन परत (Ozone Layer) कहाँ स्थित है?"},"a":{"en":"Stratosphere (~15–35 km altitude)","hi":"समतापमंडल (लगभग 15–35 किमी ऊँचाई)"},"o":[{"en":"Stratosphere (~15–35 km altitude)","hi":"समतापमंडल (लगभग 15–35 किमी ऊँचाई)"},{"en":"Troposphere (below 5 km)","hi":"क्षोभमंडल (5 किमी से नीचे)"},{"en":"Mesosphere (above 70 km)","hi":"मध्यमंडल (70 किमी से ऊपर)"},{"en":"At Earth's surface only","hi":"केवल पृथ्वी की सतह पर"}],"exp":{"en":"About 90% of atmospheric ozone lies in the stratosphere, concentrated roughly 15–35 km above Earth's surface.","hi":"वायुमंडलीय ओजोन का लगभग 90% समतापमंडल में होता है, जो पृथ्वी की सतह से लगभग 15–35 किमी की ऊँचाई पर संकेंद्रित है।"}},{"q":{"en":"At what altitude range does stratospheric ozone concentration occur and peak?","hi":"समतापमंडलीय ओजोन परत और उसकी शिखर सांद्रता किस ऊँचाई क्षेत्र में पाई जाती है?"},"a":{"en":"15–35 km (peak varies by latitude & season)","hi":"15–35 किमी (शिखर अक्षांश व ऋतु के अनुसार)"},"o":[{"en":"15–35 km (peak varies by latitude & season)","hi":"15–35 किमी (शिखर अक्षांश व ऋतु के अनुसार)"},{"en":"Exactly 50 km everywhere","hi":"हर जगह ठीक 50 किमी"},{"en":"Below 2 km in the troposphere","hi":"क्षोभमंडल में 2 किमी से नीचे"},{"en":"Above 80 km in the thermosphere","hi":"थर्मोस्फीयर में 80 किमी से ऊपर"}],"exp":{"en":"The ozone layer spans roughly 15–35 km; peak ozone concentration varies with latitude and season, occurring mainly in the lower to middle stratosphere.","hi":"ओजोन परत लगभग 15–35 किमी तक विस्तृत है; इसकी शिखर सांद्रता अक्षांश व ऋतु के अनुसार बदलती है और मुख्यतः निम्न/मध्य समतापमंडल में होती है।"}},{"q":{"en":"What is the primary function of the stratospheric Ozone Layer?","hi":"समतापमंडलीय ओजोन परत का मुख्य कार्य क्या है?"},"a":{"en":"Absorbs harmful solar UV-B and UV-C radiation","hi":"हानिकारक सौर UV-B और UV-C विकिरण को सोखना"},"o":[{"en":"Absorbs harmful solar UV-B and UV-C radiation","hi":"हानिकारक सौर UV-B और UV-C विकिरण को सोखना"},{"en":"Blocks all visible sunlight from reaching Earth","hi":"सभी दृश्य सूर्यप्रकाश को पृथ्वी तक आने से रोकना"},{"en":"Produces all atmospheric oxygen","hi":"समस्त वायुमंडलीय ऑक्सीजन का निर्माण करना"},{"en":"Traps all outgoing infrared heat","hi":"बाहर जाने वाली सभी अवरक्त ऊष्मा को रोकना"}],"exp":{"en":"Stratospheric ozone absorbs most incoming solar UV-B and virtually all UV-C radiation, protecting living organisms. (Ground-level ozone, however, is a harmful air pollutant.)","hi":"समतापमंडलीय ओजोन अधिकांश UV-B और लगभग संपूर्ण UV-C सौर विकिरण को अवशोषित कर जीवों की रक्षा करती है (जबकि भूतलीय ओजोन एक वायु प्रदूषक है)।"}},{"q":{"en":"In which unit is Ozone measured?","hi":"ओजोन को किस इकाई में मापा जाता है?"},"a":{"en":"Dobson Unit (DU).","hi":"डॉब्सन इकाई (DU)।"},"o":[{"en":"Dobson Unit (DU).","hi":"डॉब्सन इकाई (DU)।"},{"en":"Celsius.","hi":"सेल्सियस।"},{"en":"Pascals.","hi":"पास्कल।"},{"en":"Millibars.","hi":"मिलीबार।"}],"exp":{"en":"One Dobson Unit corresponds to a 0.01 mm layer of pure ozone at standard temperature and pressure if the entire atmospheric ozone column were compressed to the surface.","hi":"एक डॉब्सन इकाई उस 0.01 मिमी शुद्ध ओजोन परत के समतुल्य है जो संपूर्ण वायुमंडलीय ओजोन स्तंभ को मानक तापमान/दाब पर सतह तक संपीडित करने पर बनती।"}},{"q":{"en":"What are the major impacts of Ozone Depletion?","hi":"ओजोन परत के क्षय (Ozone Depletion) के प्रमुख प्रभाव क्या हैं?"},"a":{"en":"Higher UV-B, skin cancer, cataracts, crop/plankton damage","hi":"अधिक UV-B, त्वचा कैंसर, मोतियाबिंद, फसल/प्लवक क्षति"},"o":[{"en":"Higher UV-B, skin cancer, cataracts, crop/plankton damage","hi":"अधिक UV-B, त्वचा कैंसर, मोतियाबिंद, फसल/प्लवक क्षति"},{"en":"Complete loss of visible daylight","hi":"दृश्य दिन के प्रकाश का पूर्ण नुकसान"},{"en":"Immediate global freezing","hi":"तत्काल वैश्विक हिमांक शीतलन"},{"en":"Elimination of all greenhouse gases","hi":"सभी ग्रीनहाउस गैसों का उन्मूलन"}],"exp":{"en":"Ozone depletion allows more UV-B to reach Earth's surface, raising risks of skin cancer and cataracts and harming crops, phytoplankton, and marine ecosystems.","hi":"ओजोन क्षय से सतह पर अधिक UV-B पहुँचती है, जिससे त्वचा कैंसर व मोतियाबिंद का जोखिम बढ़ता है तथा फसलों, पादप प्लवक व पारितंत्रों को क्षति होती है।"}},{"q":{"en":"Which substances are major causes of stratospheric Ozone Depletion?","hi":"समतापमंडलीय ओजोन क्षय के प्रमुख कारण कौन-से पदार्थ हैं?"},"a":{"en":"CFCs, halons, HCFCs, methyl bromide, CCl4","hi":"CFCs, हैलोन, HCFCs, मिथाइल ब्रोमाइड, CCl4"},"o":[{"en":"CFCs, halons, HCFCs, methyl bromide, CCl4","hi":"CFCs, हैलोन, HCFCs, मिथाइल ब्रोमाइड, CCl4"},{"en":"Carbon dioxide, water vapour, argon, neon","hi":"कार्बन डाइऑक्साइड, जलवाष्प, आर्गन, नियॉन"},{"en":"Nitrogen, oxygen, helium, krypton, xenon","hi":"नाइट्रोजन, ऑक्सीजन, हीलियम, क्रिप्टन, ज़ेनॉन"},{"en":"Sulfur dioxide, carbon monoxide, ammonia, methane","hi":"सल्फर डाइऑक्साइड, कार्बन मोनोऑक्साइड, अमोनिया, मीथेन"}],"exp":{"en":"Ozone-depleting substances (ODS) such as CFCs, halons, carbon tetrachloride, methyl chloroform, methyl bromide, and HCFCs release reactive chlorine or bromine atoms in the stratosphere.","hi":"CFCs, हैलोन, कार्बन टेट्राक्लोराइड, मिथाइल क्लोरोफॉर्म, मिथाइल ब्रोमाइड और HCFCs जैसे ओजोन-क्षयकारी पदार्थ समतापमंडल में अभिक्रियाशील क्लोरीन या ब्रोमीन मुक्त करते हैं।"}},{"q":{"en":"Where and when was the ozone hole discovered?","hi":"ओजोन छिद्र की खोज कब और कहाँ हुई?"},"a":{"en":"Over Antarctica, in 1985.","hi":"अंटार्कटिका के ऊपर, 1985 में।"},"o":[{"en":"Over Antarctica, in 1985.","hi":"अंटार्कटिका के ऊपर, 1985 में।"},{"en":"In the Arctic — in 1992.","hi":"आर्कटिक में - 1992 में।"},{"en":"Over Australia — in 1972.","hi":"ऑस्ट्रेलिया के ऊपर - 1972 में।"},{"en":"Over North America — in 1987.","hi":"उत्तरी अमेरिका के ऊपर - 1987 में।"}],"exp":{"en":"The 1985 British Antarctic Survey report documented dramatic springtime ozone losses over Antarctica, making the 'ozone hole' a major global environmental issue.","hi":"1985 ब्रिटिश अंटार्कटिक सर्वेक्षण प्रतिवेदन ने अंटार्कटिका के ऊपर नाटकीय वसंतकालीन ओजोन हानियाँ दस्तावेज़ किए, जिससे 'ओजोन छिद्र' प्रमुख वैश्विक पर्यावरणीय मुद्दा बना।"}},{"q":{"en":"Which international protocol was created to protect the Ozone Layer?","hi":"ओजोन परत के संरक्षण के लिए कौन-सा अंतरराष्ट्रीय प्रोटोकॉल बनाया गया?"},"a":{"en":"Montreal Protocol (1987)","hi":"मॉन्ट्रियल प्रोटोकॉल (1987)"},"o":[{"en":"Montreal Protocol (1987)","hi":"मॉन्ट्रियल प्रोटोकॉल (1987)"},{"en":"Kyoto Protocol (1997)","hi":"क्योटो प्रोटोकॉल (1997)"},{"en":"Paris Agreement (2015)","hi":"पेरिस समझौता (2015)"},{"en":"Basel Convention (1989)","hi":"बेसल अभिसमय (1989)"}],"exp":{"en":"The Montreal Protocol on Substances that Deplete the Ozone Layer (1987, following the 1985 Vienna Convention) phases out ODS and achieved universal ratification; its Kigali Amendment also phases down HFCs.","hi":"ओजोन परत को क्षीण करने वाले पदार्थों पर मॉन्ट्रियल प्रोटोकॉल (1987, 1985 के वियना अभिसमय के बाद) ने ODS को चरणबद्ध समाप्त किया; इसके किगाली संशोधन ने HFCs को भी कम किया।"}},{"q":{"en":"When is World Ozone Day celebrated, and what does it commemorate?","hi":"विश्व ओजोन दिवस कब मनाया जाता है और यह किस घटना की स्मृति में है?"},"a":{"en":"16 September (1987 Montreal Protocol)","hi":"16 सितंबर (1987 मॉन्ट्रियल प्रोटोकॉल)"},"o":[{"en":"16 September (1987 Montreal Protocol)","hi":"16 सितंबर (1987 मॉन्ट्रियल प्रोटोकॉल)"},{"en":"22 March (1985 Vienna Convention)","hi":"22 मार्च (1985 वियना अभिसमय)"},{"en":"5 June (1972 Stockholm Conference)","hi":"5 जून (1972 स्टॉकहोम सम्मेलन)"},{"en":"2 February (1971 Ramsar Convention)","hi":"2 फ़रवरी (1971 रामसर अभिसमय)"}],"exp":{"en":"16 September is observed as the International Day for the Preservation of the Ozone Layer (proclaimed by the UNGA in 1994) to commemorate the signing of the Montreal Protocol on 16 September 1987.","hi":"16 सितंबर को अंतरराष्ट्रीय ओजोन परत संरक्षण दिवस (1994 में UNGA द्वारा घोषित) मनाया जाता है, जो 16 सितंबर 1987 को मॉन्ट्रियल प्रोटोकॉल पर हस्ताक्षर की स्मृति में है।"}}]},{"title":{"en":"5. India — National Missions under the NAPCC","hi":"5। भारत - NAPCC के अंतर्गत राष्ट्रीय मिशन"},"questions":[{"q":{"en":"When was the National Mission on Enhanced Energy Efficiency launched?","hi":"संवर्धित ऊर्जा दक्षता पर राष्ट्रीय मिशन (राष्ट्रीय मिशन पर उन्नत ऊर्जा दक्षता) कब शुरू किया गया था?"},"a":{"en":"June 2010.","hi":"जून 2010।"},"o":[{"en":"June 2010.","hi":"जून 2010।"},{"en":"2008.","hi":"2008।"},{"en":"February 2014.","hi":"फ़रवरी 2014।"},{"en":"April 2011.","hi":"अप्रैल 2011।"}],"exp":{"en":"NMEEE is one of the eight original NAPCC missions, but its operational launch is June 2010 rather than 2008. It is implemented through instruments such as Perform-Achieve-Trade.","hi":"NMEEE आठ मूल NAPCC मिशन में से एक है, लेकिन कार्यशील शुरुआत जून 2010 है, 2008 नहीं। यह प्रदर्शन-प्राप्ति-व्यापार जैसे साधन के माध्यम से क्रियान्वित होता है।"}},{"q":{"en":"When was the National Solar Mission launched?","hi":"राष्ट्रीय सौर मिशन कब शुरू किया गया था?"},"a":{"en":"11 January 2010","hi":"11 जनवरी 2010"},"o":[{"en":"11 January 2010","hi":"11 जनवरी 2010"},{"en":"June 2011","hi":"जून 2011"},{"en":"February 2014","hi":"फ़रवरी 2014"},{"en":"November 2015","hi":"नवंबर 2015"}],"exp":{"en":"The Jawaharlal Nehru National Solar Mission was approved under the 2008 NAPCC and formally launched on 11 January 2010.","hi":"जवाहरलाल नेहरू राष्ट्रीय सौर मिशन 2008 के NAPCC के तहत स्वीकृत हुआ और 11 जनवरी 2010 को औपचारिक रूप से शुरू किया गया।"}},{"q":{"en":"When was the National Mission on Strategic Knowledge for Climate Change (NMSKCC) launched?","hi":"जलवायु परिवर्तन के लिए रणनीतिक ज्ञान पर राष्ट्रीय मिशन (NMSKCC) कब शुरू हुआ?"},"a":{"en":"2008 (revised 2015)","hi":"2008 (2015 में संशोधित)"},"o":[{"en":"2008 (revised 2015)","hi":"2008 (2015 में संशोधित)"},{"en":"2010 (revised 2016)","hi":"2010 (2016 में संशोधित)"},{"en":"2014 (revised 2019)","hi":"2014 (2019 में संशोधित)"},{"en":"2012 (revised 2018)","hi":"2012 (2018 में संशोधित)"}],"exp":{"en":"NMSKCC was launched as one of the original 2008 NAPCC missions and was later revised in 2015.","hi":"NMSKCC 2008 के मूल NAPCC मिशनों में शामिल था और बाद में 2015 में संशोधित किया गया।"}},{"q":{"en":"When was the National Mission for Sustainable Agriculture (NMSA) launched?","hi":"राष्ट्रीय सतत कृषि मिशन (NMSA) कब शुरू किया गया था?"},"a":{"en":"23 September 2010","hi":"23 सितंबर 2010"},"o":[{"en":"23 September 2010","hi":"23 सितंबर 2010"},{"en":"June 2008","hi":"जून 2008"},{"en":"February 2014","hi":"फ़रवरी 2014"},{"en":"April 2020","hi":"अप्रैल 2020"}],"exp":{"en":"NMSA was launched on 23 September 2010 and later constituted operationally through an Office Memorandum in 2014 to promote climate-resilient agriculture.","hi":"NMSA 23 सितंबर 2010 को शुरू हुआ और बाद में 2014 में परिचालन रूप से गठित किया गया; यह जलवायु-लचीली कृषि पर केंद्रित है।"}},{"q":{"en":"When was the National Mission on Sustainable Habitat launched?","hi":"सतत पर्यावास पर राष्ट्रीय मिशन (राष्ट्रीय मिशन पर सतत आवास) कब शुरू किया गया था?"},"a":{"en":"June 2010","hi":"जून 2010"},"o":[{"en":"June 2010","hi":"जून 2010"},{"en":"June 2008","hi":"जून 2008"},{"en":"August 2011","hi":"अगस्त 2011"},{"en":"March 2014","hi":"मार्च 2014"}],"exp":{"en":"NMSH addresses low-carbon and climate-resilient urban development through buildings, mobility, waste, water and urban planning.","hi":"NMSH भवन, गतिशीलता, अपशिष्ट, जल और नगरीय नियोजन के माध्यम से निम्न-कार्बन और जलवायु-लचीला नगरीय विकास से संबंधित है।"}},{"q":{"en":"When was the National Water Mission formally launched?","hi":"राष्ट्रीय जल मिशन औपचारिक रूप से कब शुरू किया गया था?"},"a":{"en":"6 April 2011","hi":"6 अप्रैल 2011"},"o":[{"en":"6 April 2011","hi":"6 अप्रैल 2011"},{"en":"June 2010","hi":"जून 2010"},{"en":"February 2014","hi":"फ़रवरी 2014"},{"en":"January 2015","hi":"जनवरी 2015"}],"exp":{"en":"Conceived in 2008 as part of NAPCC, the National Water Mission was formally established on 6 April 2011 to improve water-use efficiency and integrated water management.","hi":"2008 के NAPCC में परिकल्पित राष्ट्रीय जल मिशन की औपचारिक स्थापना 6 अप्रैल 2011 को जल-उपयोग दक्षता व एकीकृत जल प्रबंधन के लिए हुई।"}},{"q":{"en":"When was the National Green India Mission launched?","hi":"नेशनल ग्रीन इंडिया मिशन कब लॉन्च किया गया?"},"a":{"en":"February 2014","hi":"फ़रवरी 2014"},"o":[{"en":"February 2014","hi":"फ़रवरी 2014"},{"en":"June 2010","hi":"जून 2010"},{"en":"August 2011","hi":"अगस्त 2011"},{"en":"June 2008","hi":"जून 2008"}],"exp":{"en":"The Green India Mission uses a landscape approach to improve forest/tree cover, restore degraded ecosystems and enhance carbon sinks and forest-based livelihoods.","hi":"हरित भारत मिशन परिदृश्य आधारित दृष्टिकोण के माध्यम से वन एवं वृक्ष आवरण में सुधार, क्षरित पारितंत्रों को पुनर्स्थापित और कार्बन सिंक तथा वन-आधारित आजीविकाओं को बढ़ाता है।"}},{"q":{"en":"When was the National Mission for Sustaining the Himalayan Ecosystem (NMSHE) launched?","hi":"हिमालयी पारिस्थितिकी तंत्र को बनाए रखने के लिए राष्ट्रीय मिशन (NMSHE) कब शुरू हुआ?"},"a":{"en":"2008 (revised 2015)","hi":"2008 (2015 में संशोधित)"},"o":[{"en":"2008 (revised 2015)","hi":"2008 (2015 में संशोधित)"},{"en":"2014 (revised 2019)","hi":"2014 (2019 में संशोधित)"},{"en":"2010 (revised 2016)","hi":"2010 (2016 में संशोधित)"},{"en":"2012 (revised 2018)","hi":"2012 (2018 में संशोधित)"}],"exp":{"en":"NMSHE is an original 2008 NAPCC mission coordinated by the Department of Science and Technology and revised in 2015.","hi":"NMSHE विज्ञान एवं प्रौद्योगिकी विभाग द्वारा समन्वित 2008 का मूल NAPCC मिशन है, जिसे 2015 में संशोधित किया गया।"}},{"q":{"en":"Which four NAPCC missions were launched in 2010?","hi":"निम्नलिखित में से कौन-से चार NAPCC मिशन 2010 में शुरू किए गए थे?"},"a":{"en":"Solar, NMEEE, Sustainable Habitat, Sustainable Agriculture","hi":"सौर, NMEEE, सतत पर्यावास, सतत कृषि"},"o":[{"en":"Solar, NMEEE, Sustainable Habitat, Sustainable Agriculture","hi":"सौर, NMEEE, सतत पर्यावास, सतत कृषि"},{"en":"Solar, Strategic Knowledge, Himalayan, Green India","hi":"सौर, रणनीतिक ज्ञान, हिमालयी, हरित भारत"},{"en":"Water, Green India, Himalayan, Strategic Knowledge","hi":"जल, हरित भारत, हिमालयी, रणनीतिक ज्ञान"},{"en":"Only Solar Mission and Water Mission","hi":"केवल सौर मिशन और जल मिशन"}],"exp":{"en":"The four 2010 mission launches are National Solar Mission (Jan 2010), NMEEE (Jun 2010), National Mission on Sustainable Habitat (Jun 2010), and NMSA (Sep 2010).","hi":"2010 में शुरू चार मिशन हैं: राष्ट्रीय सौर मिशन (जनवरी 2010), NMEEE (जून 2010), सतत पर्यावास मिशन (जून 2010) और सतत कृषि मिशन (सितंबर 2010)।"}}]},{"title":{"en":"6. Major International Environment & Climate Milestones","hi":"6। प्रमुख अंतरराष्ट्रीय पर्यावरण एवं जलवायु पड़ाव"},"questions":[{"q":{"en":"What major UN institution emerged from the 1972 Stockholm Conference?","hi":"1972 के स्टॉकहोम सम्मेलन के परिणामस्वरूप किस प्रमुख संयुक्त राष्ट्र संस्था का गठन हुआ?"},"a":{"en":"United Nations Environment Programme (UNEP)","hi":"संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP)"},"o":[{"en":"United Nations Environment Programme (UNEP)","hi":"संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP)"},{"en":"United Nations Framework Convention (UNFCCC)","hi":"संयुक्त राष्ट्र जलवायु परिवर्तन फ्रेमवर्क (UNFCCC)"},{"en":"Intergovernmental Panel on Climate Change (IPCC)","hi":"जलवायु परिवर्तन पर अंतरसरकारी पैनल (IPCC)"},{"en":"Green Climate Fund (GCF)","hi":"हरित जलवायु कोष (GCF)"}],"exp":{"en":"The 1972 Stockholm Conference catalysed modern global environmental governance, leading the UN General Assembly to establish UNEP later in 1972.","hi":"1972 के स्टॉकहोम सम्मेलन ने आधुनिक वैश्विक पर्यावरण शासन को गति दी, जिसके परिणामस्वरूप 1972 में संयुक्त राष्ट्र महासभा ने UNEP की स्थापना की।"}},{"q":{"en":"What was the focus of the 1985 Vienna Conference?","hi":"1985 के वियना सम्मेलन का मुख्य केंद्र क्या था?"},"a":{"en":"Framework for ozone layer protection","hi":"ओजोन परत संरक्षण हेतु अंतरराष्ट्रीय ढाँचा"},"o":[{"en":"Framework for ozone layer protection","hi":"ओजोन परत संरक्षण हेतु अंतरराष्ट्रीय ढाँचा"},{"en":"Binding CO2 emission targets for all nations","hi":"सभी देशों के लिए बाध्यकारी CO2 लक्ष्य"},{"en":"Creation of the Green Climate Fund","hi":"हरित जलवायु कोष की स्थापना"},{"en":"Adoption of the Paris Agreement rulebook","hi":"पेरिस समझौते की नियमावली का अंगीकरण"}],"exp":{"en":"The 1985 Vienna Convention for the Protection of the Ozone Layer created a framework for international cooperation and research, paving the way for the 1987 Montreal Protocol.","hi":"1985 के वियना अभिसमय ने ओजोन परत संरक्षण के लिए अंतरराष्ट्रीय सहयोग व अनुसंधान का ढाँचा तैयार किया, जिसने 1987 के मॉन्ट्रियल प्रोटोकॉल का मार्ग प्रशस्त किया।"}},{"q":{"en":"What were the key outcomes of the 1992 Rio Earth Summit?","hi":"1992 के रियो पृथ्वी शिखर सम्मेलन के प्रमुख परिणाम क्या थे?"},"a":{"en":"Agenda 21, Rio Declaration, UNFCCC & CBD","hi":"एजेंडा-21, रियो घोषणा, UNFCCC व जैव विविधता संधि"},"o":[{"en":"Agenda 21, Rio Declaration, UNFCCC & CBD","hi":"एजेंडा-21, रियो घोषणा, UNFCCC व जैव विविधता संधि"},{"en":"Entry into force of Kyoto Protocol","hi":"क्योटो प्रोटोकॉल का प्रभावी होना"},{"en":"Creation of the Green Climate Fund","hi":"हरित जलवायु कोष की स्थापना"},{"en":"Adoption of the Montreal Protocol","hi":"मॉन्ट्रियल प्रोटोकॉल का अंगीकरण"}],"exp":{"en":"At the 1992 Rio Earth Summit (UNCED), Agenda 21 and the Rio Declaration were adopted, and the UNFCCC and Convention on Biological Diversity (CBD) were opened for signature.","hi":"1992 के रियो पृथ्वी शिखर सम्मेलन में एजेंडा-21 और रियो घोषणा अपनाए गए तथा UNFCCC और जैव विविधता अभिसमय (CBD) हस्ताक्षर के लिए खोले गए।"}},{"q":{"en":"What was the key target of the 1997 Kyoto Protocol?","hi":"1997 के क्योटो प्रोटोकॉल का मुख्य लक्ष्य क्या था?"},"a":{"en":"Binding GHG cuts (~5%) for Annex B nations","hi":"अनुबंध-B देशों हेतु बाध्यकारी GHG कटौती (~5%)"},"o":[{"en":"Binding GHG cuts (~5%) for Annex B nations","hi":"अनुबंध-B देशों हेतु बाध्यकारी GHG कटौती (~5%)"},{"en":"Universal 5% cut for every country in 1997","hi":"1997 में हर देश के लिए 5% कटौती"},{"en":"Global carbon tax on all fossil fuels","hi":"सभी जीवाश्म ईंधनों पर वैश्विक कार्बन कर"},{"en":"Limiting global warming to 1.5°C","hi":"वैश्विक उष्मीकरण को 1.5°C तक सीमित रखना"}],"exp":{"en":"The Kyoto Protocol (1997) set legally binding greenhouse-gas targets for industrialized/Annex B Parties, averaging at least 5% below 1990 levels over the first commitment period (2008–2012).","hi":"क्योटो प्रोटोकॉल (1997) ने औद्योगीकृत/अनुबंध-B पक्षकारों के लिए कानूनी रूप से बाध्यकारी GHG लक्ष्य तय किए, जो पहली अवधि (2008–2012) में 1990 के स्तर से औसतन कम-से-कम 5% नीचे थे।"}},{"q":{"en":"What were the principal outcomes of the 2002 Johannesburg Summit (Rio+10)?","hi":"2002 के जोहान्सबर्ग शिखर सम्मेलन (रियो+10) के मुख्य परिणाम क्या थे?"},"a":{"en":"Johannesburg Declaration & Plan of Implementation","hi":"जोहान्सबर्ग घोषणा और क्रियान्वयन योजना"},"o":[{"en":"Johannesburg Declaration & Plan of Implementation","hi":"जोहान्सबर्ग घोषणा और क्रियान्वयन योजना"},{"en":"Adoption of the Paris Agreement","hi":"पेरिस समझौते का अंगीकरण"},{"en":"Signing of the Vienna Convention","hi":"वियना अभिसमय पर हस्ताक्षर"},{"en":"First UNFCCC Conference of the Parties","hi":"पहला UNFCCC पक्षकार सम्मेलन (COP1)"}],"exp":{"en":"The 2002 World Summit on Sustainable Development in Johannesburg produced the Johannesburg Declaration and Plan of Implementation, renewing global commitment to Agenda 21.","hi":"2002 के जोहान्सबर्ग सतत विकास विश्व शिखर सम्मेलन में जोहान्सबर्ग घोषणा और क्रियान्वयन योजना अपनाई गई, जिससे एजेंडा-21 के प्रति प्रतिबद्धता नवीनीकृत हुई।"}},{"q":{"en":"What was the focus of the 2005 Montreal Climate Conference (COP11/CMP1)?","hi":"2005 के मॉन्ट्रियल जलवायु सम्मेलन (COP11/CMP1) का मुख्य केंद्र क्या था?"},"a":{"en":"Operationalizing Kyoto Protocol & post-2012 talks","hi":"क्योटो प्रोटोकॉल का क्रियान्वयन व 2012-बाद की वार्ता"},"o":[{"en":"Operationalizing Kyoto Protocol & post-2012 talks","hi":"क्योटो प्रोटोकॉल का क्रियान्वयन व 2012-बाद की वार्ता"},{"en":"Signing the 1987 ozone protection treaty","hi":"1987 की ओजोन संरक्षण संधि पर हस्ताक्षर"},{"en":"Adopting the Paris Agreement","hi":"पेरिस समझौते को अपनाना"},{"en":"Starting UNFCCC COP numbering","hi":"UNFCCC COP क्रमांकन की शुरुआत"}],"exp":{"en":"Montreal 2005 hosted COP11 and the first Meeting of the Parties to the Kyoto Protocol (CMP1), operationalizing Kyoto rules/mechanisms and opening post-2012 discussions.","hi":"2005 के मॉन्ट्रियल सम्मेलन में COP11 और क्योटो प्रोटोकॉल के पक्षकारों की पहली बैठक (CMP1) हुई, जिसमें क्योटो नियम लागू किए गए और 2012 के बाद की प्रतिबद्धताओं पर चर्चा शुरू हुई।"}},{"q":{"en":"What was the key outcome of COP13 at Bali in 2007?","hi":"2007 में बाली में आयोजित COP13 का प्रमुख परिणाम क्या था?"},"a":{"en":"Bali Road Map & Bali Action Plan","hi":"बाली रोड मैप और बाली कार्य योजना"},"o":[{"en":"Bali Road Map & Bali Action Plan","hi":"बाली रोड मैप और बाली कार्य योजना"},{"en":"Binding target to cut emissions by 2050","hi":"2050 तक उत्सर्जन कटौती का बाध्यकारी लक्ष्य"},{"en":"Establishment of UNEP","hi":"UNEP की स्थापना"},{"en":"First Global Stocktake","hi":"पहला वैश्विक स्थिति-आकलन (Global Stocktake)"}],"exp":{"en":"COP13 adopted the Bali Road Map (including the Bali Action Plan), launching a two-year negotiating track toward a broader post-2012 climate agreement.","hi":"COP13 ने बाली रोड मैप (बाली कार्य योजना सहित) अपनाया, जिसने व्यापक 2012-बाद जलवायु समझौते के लिए दो-वर्षीय वार्ता प्रक्रिया शुरू की।"}},{"q":{"en":"What was a central feature of the 2009 Copenhagen Accord (COP15)?","hi":"2009 के कोपेनहेगन समझौते (COP15) की प्रमुख विशेषता क्या थी?"},"a":{"en":"Below-2°C goal & climate finance pledges","hi":"2°C से नीचे लक्ष्य व जलवायु वित्त प्रतिबद्धताएँ"},"o":[{"en":"Below-2°C goal & climate finance pledges","hi":"2°C से नीचे लक्ष्य व जलवायु वित्त प्रतिबद्धताएँ"},{"en":"Legally binding low-carbon treaty for all","hi":"सभी के लिए कानूनी बाध्यकारी निम्न-कार्बन संधि"},{"en":"Adoption of the Kyoto Protocol","hi":"क्योटो प्रोटोकॉल का अंगीकरण"},{"en":"Creation of UNEP","hi":"UNEP की स्थापना"}],"exp":{"en":"The Copenhagen Accord recognized keeping warming below 2°C and included mitigation/finance pledges ($100B goal), though COP15 only 'took note' of it rather than formally adopting it.","hi":"कोपेनहेगन समझौते ने उष्मीकरण को 2°C से नीचे रखने और जलवायु वित्त प्रतिबद्धताओं को स्वीकार किया, यद्यपि COP15 ने इसे औपचारिक रूप से अपनाने के बजाय केवल 'संज्ञान' लिया।"}},{"q":{"en":"Which major climate fund was established at the 2010 Cancun Conference (COP16)?","hi":"2010 के कैनकन सम्मेलन (COP16) में किस प्रमुख जलवायु कोष की स्थापना हुई थी?"},"a":{"en":"Green Climate Fund (GCF)","hi":"हरित जलवायु कोष (GCF)"},"o":[{"en":"Green Climate Fund (GCF)","hi":"हरित जलवायु कोष (GCF)"},{"en":"United Nations Environment Programme (UNEP)","hi":"संयुक्त राष्ट्र पर्यावरण कार्यक्रम (UNEP)"},{"en":"Montreal Ozone Multilateral Fund","hi":"मॉन्ट्रियल ओजोन बहुपक्षीय कोष"},{"en":"Loss and Damage Fund","hi":"हानि एवं क्षति कोष"}],"exp":{"en":"The Cancun Agreements (2010) established the Green Climate Fund (GCF), alongside the Cancun Adaptation Framework and Technology Mechanism.","hi":"2010 के कैनकन समझौतों के तहत हरित जलवायु कोष (GCF), कैनकन अनुकूलन ढाँचा और प्रौद्योगिकी तंत्र स्थापित किए गए।"}},{"q":{"en":"What was the defining outcome of the 2011 Durban Conference (COP17)?","hi":"2011 के डरबन सम्मेलन (COP17) का निर्धारक परिणाम क्या था?"},"a":{"en":"Durban Platform for a universal post-2020 treaty","hi":"सार्वभौमिक 2020-बाद संधि हेतु डरबन मंच"},"o":[{"en":"Durban Platform for a universal post-2020 treaty","hi":"सार्वभौमिक 2020-बाद संधि हेतु डरबन मंच"},{"en":"First creation of the Green Climate Fund","hi":"हरित जलवायु कोष की पहली बार स्थापना"},{"en":"Adoption of the Montreal Protocol","hi":"मॉन्ट्रियल प्रोटोकॉल का अंगीकरण"},{"en":"Setting a 2070 global net-zero target","hi":"2070 का वैश्विक नेट-शून्य लक्ष्य तय करना"}],"exp":{"en":"COP17 launched the Durban Platform for Enhanced Action, initiating negotiations toward a new legal agreement applicable to all Parties—which became the 2015 Paris Agreement.","hi":"COP17 ने 'डरबन प्लेटफॉर्म फॉर एन्हांस्ड एक्शन' शुरू किया, जिससे सभी पक्षकारों पर लागू होने वाले नए समझौते (2015 का पेरिस समझौता) की वार्ता आरंभ हुई।"}},{"q":{"en":"What was the key Kyoto-related outcome of COP18 at Doha in 2012?","hi":"2012 में दोहा में आयोजित COP18 का क्योटो-संबंधी प्रमुख परिणाम क्या था?"},"a":{"en":"Doha Amendment (2nd Kyoto period 2013–2020)","hi":"दोहा संशोधन (दूसरी क्योटो अवधि 2013–2020)"},"o":[{"en":"Doha Amendment (2nd Kyoto period 2013–2020)","hi":"दोहा संशोधन (दूसरी क्योटो अवधि 2013–2020)"},{"en":"Creation of Clean Development Mechanism","hi":"स्वच्छ विकास तंत्र (CDM) की पहली स्थापना"},{"en":"Establishment of UNEP","hi":"UNEP की स्थापना"},{"en":"Adoption of the Paris Agreement","hi":"पेरिस समझौते का अंगीकरण"}],"exp":{"en":"The Doha Amendment established Kyoto's second commitment period (2013–2020), with participating Parties pledging at least 18% below 1990 levels in aggregate.","hi":"दोहा संशोधन ने क्योटो की दूसरी प्रतिबद्धता अवधि (2013–2020) स्थापित की, जिसमें भाग लेने वाले पक्षकारों ने समग्र रूप से 1990 स्तर से कम-से-कम 18% कटौती की प्रतिबद्धता ली।"}},{"q":{"en":"What major mechanism was established at the 2013 Warsaw Conference (COP19)?","hi":"2013 के वारसॉ सम्मेलन (COP19) में किस प्रमुख तंत्र की स्थापना हुई थी?"},"a":{"en":"Warsaw International Mechanism for Loss and Damage","hi":"हानि एवं क्षति के लिए वारसॉ अंतरराष्ट्रीय तंत्र"},"o":[{"en":"Warsaw International Mechanism for Loss and Damage","hi":"हानि एवं क्षति के लिए वारसॉ अंतरराष्ट्रीय तंत्र"},{"en":"Green Climate Fund under UNFCCC framework","hi":"UNFCCC ढाँचे के अंतर्गत हरित जलवायु कोष"},{"en":"Kyoto Protocol on greenhouse gas targets","hi":"ग्रीनहाउस गैस लक्ष्यों पर क्योटो प्रोटोकॉल"},{"en":"United Nations Environment Programme headquarters charter","hi":"संयुक्त राष्ट्र पर्यावरण कार्यक्रम मुख्यालय चार्टर"}],"exp":{"en":"COP19 established the Warsaw International Mechanism for Loss and Damage associated with climate-change impacts (GCF had already been created at Cancun in 2010).","hi":"COP19 ने जलवायु-परिवर्तन प्रभावों से जुड़ी हानि एवं क्षति के लिए वारसॉ अंतरराष्ट्रीय तंत्र की स्थापना की (GCF पहले ही 2010 में कैनकन में बन चुका था)।"}},{"q":{"en":"What was the key outcome of the 2014 Lima Conference (COP20)?","hi":"2014 के लीमा सम्मेलन (COP20) का प्रमुख परिणाम क्या था?"},"a":{"en":"Lima Call for Climate Action (INDCs)","hi":"लीमा कॉल फॉर क्लाइमेट एक्शन (INDCs)"},"o":[{"en":"Lima Call for Climate Action (INDCs)","hi":"लीमा कॉल फॉर क्लाइमेट एक्शन (INDCs)"},{"en":"2070 global emission-cut target","hi":"2070 वैश्विक उत्सर्जन-कटौती लक्ष्य"},{"en":"Montreal Protocol adoption","hi":"मॉन्ट्रियल प्रोटोकॉल का अंगीकरण"},{"en":"First Global Stocktake","hi":"पहला वैश्विक स्थिति-आकलन"}],"exp":{"en":"COP20 adopted the Lima Call for Climate Action, advancing draft elements for the 2015 Paris Agreement and guidance for countries' Intended Nationally Determined Contributions (INDCs).","hi":"COP20 ने 'लीमा कॉल फॉर क्लाइमेट एक्शन' अपनाया, जिससे 2015 के पेरिस समझौते के तत्त्व और देशों के INDCs हेतु मार्गदर्शन आगे बढ़ा।"}},{"q":{"en":"What temperature target was set in the 2015 Paris Agreement (COP21)?","hi":"2015 के पेरिस समझौते (COP21) में क्या तापमान लक्ष्य निर्धारित किया गया?"},"a":{"en":"Well below 2°C; pursue efforts for 1.5°C","hi":"2°C से काफी नीचे; 1.5°C के लिए प्रयास"},"o":[{"en":"Well below 2°C; pursue efforts for 1.5°C","hi":"2°C से काफी नीचे; 1.5°C के लिए प्रयास"},{"en":"Exactly 2°C with no 1.5°C objective","hi":"ठीक 2°C, बिना किसी 1.5°C लक्ष्य के"},{"en":"Limit warming to 3°C by 2050","hi":"2050 तक उष्मीकरण 3°C तक सीमित"},{"en":"Return global temperature to 1990 levels","hi":"वैश्विक तापमान को 1990 स्तर पर लौटाना"}],"exp":{"en":"The Paris Agreement (COP21, 2015) aims to hold global warming well below 2°C above pre-industrial levels and pursue efforts to limit the increase to 1.5°C.","hi":"पेरिस समझौता (COP21, 2015) वैश्विक उष्मीकरण को पूर्व-औद्योगिक स्तरों से 2°C से काफी नीचे रखने और इसे 1.5°C तक सीमित करने के प्रयास करने का लक्ष्य रखता है।"}},{"q":{"en":"What was the main focus of the 2016 Marrakesh Conference (COP22)?","hi":"2016 के माराकेश सम्मेलन (COP22) का मुख्य फोकस क्या था?"},"a":{"en":"Paris implementation & Marrakech Action Proclamation","hi":"पेरिस क्रियान्वयन व माराकेश कार्रवाई घोषणा"},"o":[{"en":"Paris implementation & Marrakech Action Proclamation","hi":"पेरिस क्रियान्वयन व माराकेश कार्रवाई घोषणा"},{"en":"Clean water management unrelated to Paris","hi":"पेरिस से असंबंधित स्वच्छ जल प्रबंधन"},{"en":"Adoption of the Kyoto Protocol","hi":"क्योटो प्रोटोकॉल का अंगीकरण"},{"en":"Establishment of UNEP","hi":"UNEP की स्थापना"}],"exp":{"en":"Held right after the Paris Agreement entered into force, COP22 focused on moving from adoption to implementation through the Marrakech Action Proclamation.","hi":"पेरिस समझौते के प्रभावी होने के तुरंत बाद आयोजित COP22 का मुख्य केंद्र माराकेश कार्रवाई घोषणा के माध्यम से क्रियान्वयन की ओर बढ़ना था।"}},{"q":{"en":"What key outcomes emerged from the 2017 Bonn Conference (COP23)?","hi":"2017 के बॉन सम्मेलन (COP23) के प्रमुख परिणाम क्या थे?"},"a":{"en":"Talanoa Dialogue, Gender Action Plan, Koronivia","hi":"तालानोआ संवाद, लैंगिक कार्रवाई योजना, कोरोनिविया"},"o":[{"en":"Talanoa Dialogue, Gender Action Plan, Koronivia","hi":"तालानोआ संवाद, लैंगिक कार्रवाई योजना, कोरोनिविया"},{"en":"Adoption of the Paris Agreement","hi":"पेरिस समझौते का अंगीकरण"},{"en":"Signing of the Montreal Protocol","hi":"मॉन्ट्रियल प्रोटोकॉल पर हस्ताक्षर"},{"en":"New 5% Kyoto target for 2008–2012","hi":"2008–2012 के लिए नया 5% क्योटो लक्ष्य"}],"exp":{"en":"COP23 in Bonn (presided by Fiji) launched the Talanoa Dialogue process and adopted the Gender Action Plan and the Koronivia Joint Work on Agriculture.","hi":"फिजी की अध्यक्षता में बॉन में हुए COP23 में तालानोआ संवाद प्रक्रिया शुरू हुई तथा लैंगिक कार्रवाई योजना व कृषि पर कोरोनिविया संयुक्त कार्य अपनाया गया।"}},{"q":{"en":"What was adopted at the 2018 Katowice Conference (COP24)?","hi":"2018 के काटोवित्से सम्मेलन (COP24) में क्या अपनाया गया था?"},"a":{"en":"Katowice Climate Package (Paris rulebook)","hi":"काटोवित्से जलवायु पैकेज (पेरिस नियमावली)"},"o":[{"en":"Katowice Climate Package (Paris rulebook)","hi":"काटोवित्से जलवायु पैकेज (पेरिस नियमावली)"},{"en":"Entry into force of Paris Agreement in 2020","hi":"2020 में पेरिस समझौते का प्रभावी होना"},{"en":"Establishment of UNEP","hi":"UNEP की स्थापना"},{"en":"Adoption of the Vienna Convention","hi":"वियना अभिसमय का अंगीकरण"}],"exp":{"en":"COP24 adopted the Katowice Climate Package—commonly called the Paris Agreement rulebook—setting detailed implementation guidelines for transparency, NDCs, and finance.","hi":"COP24 ने काटोवित्से जलवायु पैकेज (पेरिस समझौता नियमावली) अपनाया, जिसने पारदर्शिता, NDCs और वित्त के लिए विस्तृत क्रियान्वयन दिशानिर्देश तय किए।"}},{"q":{"en":"What was a major outcome—and unresolved issue—of COP25 in Madrid (2019)?","hi":"मैड्रिड में COP25 (2019) का प्रमुख परिणाम और अनसुलझा मुद्दा क्या था?"},"a":{"en":"Santiago Network created; Article 6 unresolved","hi":"सैंटियागो नेटवर्क बना; अनुच्छेद 6 अनसुलझा रहा"},"o":[{"en":"Santiago Network created; Article 6 unresolved","hi":"सैंटियागो नेटवर्क बना; अनुच्छेद 6 अनसुलझा रहा"},{"en":"Paris Agreement was formally adopted","hi":"पेरिस समझौता औपचारिक रूप से अपनाया गया"},{"en":"Kyoto Protocol was first signed","hi":"क्योटो प्रोटोकॉल पर पहली बार हस्ताक्षर"},{"en":"UNEP was established","hi":"UNEP की स्थापना हुई"}],"exp":{"en":"COP25 created the Santiago Network on loss and damage to catalyse technical assistance, while Parties failed to finalize Article 6 carbon-market rules.","hi":"COP25 ने हानि एवं क्षति पर तकनीकी सहायता हेतु सैंटियागो नेटवर्क की स्थापना की, लेकिन पक्षकार अनुच्छेद 6 (कार्बन बाजार नियमों) पर अंतिम समझौते पर नहीं पहुँच सके।"}},{"q":{"en":"What were the key decisions of the 2021 Glasgow Conference (COP26)?","hi":"2021 के ग्लासगो सम्मेलन (COP26) के प्रमुख निर्णय क्या थे?"},"a":{"en":"Glasgow Climate Pact: coal phase-down & Art. 6","hi":"ग्लासगो समझौता: कोयला चरणबद्ध घटाव व अनुच्छेद 6"},"o":[{"en":"Glasgow Climate Pact: coal phase-down & Art. 6","hi":"ग्लासगो समझौता: कोयला चरणबद्ध घटाव व अनुच्छेद 6"},{"en":"First-ever invention of the 1.5°C goal","hi":"1.5°C लक्ष्य का पहली बार निर्माण"},{"en":"Adoption of the Montreal Protocol","hi":"मॉन्ट्रियल प्रोटोकॉल का अंगीकरण"},{"en":"First creation of the Green Climate Fund","hi":"हरित जलवायु कोष की पहली स्थापना"}],"exp":{"en":"The Glasgow Climate Pact reaffirmed the Paris 1.5°C goal, called for phasing down unabated coal power and inefficient fossil-fuel subsidies, and completed Article 6 rules.","hi":"ग्लासगो जलवायु समझौते ने पेरिस के 1.5°C लक्ष्य की पुष्टि की, बिना कटौती वाले कोयला ऊर्जा व अक्षम जीवाश्म-ईंधन सब्सिडी को चरणबद्ध घटाने का आह्वान किया और अनुच्छेद 6 पूरा किया।"}},{"q":{"en":"What was the headline breakthrough of COP27 at Sharm El-Sheikh (2022)?","hi":"2022 में शर्म अल-शेख में आयोजित COP27 की प्रमुख उपलब्धि क्या थी?"},"a":{"en":"Agreement on Loss and Damage funding","hi":"हानि एवं क्षति वित्तपोषण पर सहमति"},"o":[{"en":"Agreement on Loss and Damage funding","hi":"हानि एवं क्षति वित्तपोषण पर सहमति"},{"en":"Establishment of UNEP","hi":"UNEP की स्थापना"},{"en":"Adoption of the Kyoto Protocol","hi":"क्योटो प्रोटोकॉल का अंगीकरण"},{"en":"First adoption of the 1.5°C Paris goal","hi":"1.5°C पेरिस लक्ष्य का पहला अंगीकरण"}],"exp":{"en":"COP27 agreed to establish new funding arrangements, including a dedicated Loss and Damage Fund, to assist vulnerable developing countries.","hi":"COP27 में विशेष रूप से सुभेद्य विकासशील देशों की सहायता के लिए एक समर्पित हानि एवं क्षति कोष सहित नई वित्तपोषण व्यवस्थाओं पर सहमति बनी।"}},{"q":{"en":"What did the first Global Stocktake at COP28 (Dubai, 2023) call for?","hi":"COP28 (दुबई, 2023) के पहले वैश्विक स्थिति-आकलन (Global Stocktake) में क्या आह्वान किया गया?"},"a":{"en":"Transition away from fossil fuels; 3x renewables","hi":"जीवाश्म ईंधन से दूर जाना; 3 गुना नवीकरणीय ऊर्जा"},"o":[{"en":"Transition away from fossil fuels; 3x renewables","hi":"जीवाश्म ईंधन से दूर जाना; 3 गुना नवीकरणीय ऊर्जा"},{"en":"Renewing the $100B annual climate finance pledge","hi":"वार्षिक $100 अरब जलवायु वित्त प्रतिज्ञा नवीनीकृत करना"},{"en":"Adopting the Kyoto Protocol emission reduction targets","hi":"क्योटो प्रोटोकॉल उत्सर्जन कटौती लक्ष्यों को अपनाना"},{"en":"Establishing UNEP as a UN specialized agency","hi":"UNEP को संयुक्त राष्ट्र विशेष एजेंसी बनाना"}],"exp":{"en":"COP28's first Global Stocktake called for transitioning away from fossil fuels in energy systems, tripling renewable capacity, and doubling energy-efficiency improvement by 2030 (and operationalized the Loss & Damage Fund).","hi":"COP28 के पहले वैश्विक स्थिति-आकलन ने ऊर्जा प्रणालियों में जीवाश्म ईंधन से दूर जाने, 2030 तक नवीकरणीय ऊर्जा क्षमता तीन गुना करने और ऊर्जा दक्षता दर दोगुना करने का आह्वान किया।"}},{"q":{"en":"What new climate-finance goal was agreed at COP29 in Baku (2024)?","hi":"2024 में बाकू में आयोजित COP29 में नया जलवायु-वित्त लक्ष्य क्या तय हुआ?"},"a":{"en":"At least $300B/year by 2035","hi":"2035 तक कम-से-कम $300 अरब/वर्ष"},"o":[{"en":"At least $300B/year by 2035","hi":"2035 तक कम-से-कम $300 अरब/वर्ष"},{"en":"Only $100B/year with no 2035 target","hi":"केवल $100 अरब/वर्ष, कोई 2035 लक्ष्य नहीं"},{"en":"Global ban on methane by 2025","hi":"2025 तक मीथेन पर वैश्विक प्रतिबंध"},{"en":"Adoption of the Kyoto Protocol","hi":"क्योटो प्रोटोकॉल का अंगीकरण"}],"exp":{"en":"COP29 (Baku, 2024) agreed on a New Collective Quantified Goal of at least USD 300 billion per year for developing countries by 2035 (scaling toward $1.3T) and finalized key Article 6 rules.","hi":"COP29 (बाकू, 2024) ने विकासशील देशों के लिए 2035 तक कम-से-कम USD 300 अरब प्रति वर्ष के नए जलवायु-वित्त लक्ष्य पर सहमति जताई और अनुच्छेद 6 के नियम अंतिम रूप दिए।"}},{"q":{"en":"Where and when was COP30 held, adopting the Belém political package?","hi":"COP30 कब और कहाँ आयोजित हुआ, जिसमें बेलेम राजनीतिक पैकेज अपनाया गया?"},"a":{"en":"Belém, Brazil (2025)","hi":"बेलेम, ब्राज़ील (2025)"},"o":[{"en":"Belém, Brazil (2025)","hi":"बेलेम, ब्राज़ील (2025)"},{"en":"Baku, Azerbaijan (2024)","hi":"बाकू, अज़रबैजान (2024)"},{"en":"Dubai, UAE (2023)","hi":"दुबई, UAE (2023)"},{"en":"Sharm El-Sheikh, Egypt (2022)","hi":"शर्म अल-शेख, मिस्र (2022)"}],"exp":{"en":"COP30 was held in Belém, Brazil, in November 2025, following COP29 (Baku, 2024) and adopting the Belém political package.","hi":"COP30 नवंबर 2025 में बेलेम, ब्राज़ील में आयोजित हुआ (COP29 बाकू, 2024 के बाद), जिसमें बेलेम राजनीतिक पैकेज अपनाया गया।"}}]},{"title":{"en":"7. Common Confusions & Reverse Questions","hi":"7। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"Which pair correctly distinguishes the Antarctic ozone-hole discovery and Montreal Protocol years?","hi":"अंटार्कटिक ओजोन-छिद्र की खोज और मॉन्ट्रियल प्रोटोकॉल के वर्षों का सही युग्म कौन-सा है?"},"a":{"en":"Ozone hole: 1985; Montreal Protocol: 1987","hi":"ओजोन छिद्र: 1985; मॉन्ट्रियल प्रोटोकॉल: 1987"},"o":[{"en":"Ozone hole: 1985; Montreal Protocol: 1987","hi":"ओजोन छिद्र: 1985; मॉन्ट्रियल प्रोटोकॉल: 1987"},{"en":"Both occurred in 1987","hi":"दोनों 1987 में हुए"},{"en":"Ozone hole: 1992; Montreal Protocol: 1985","hi":"ओजोन छिद्र: 1992; मॉन्ट्रियल प्रोटोकॉल: 1985"},{"en":"Ozone hole: 1972; Montreal Protocol: 1997","hi":"ओजोन छिद्र: 1972; मॉन्ट्रियल प्रोटोकॉल: 1997"}],"exp":{"en":"The Antarctic ozone hole was reported in 1985 (British Antarctic Survey), and the Montreal Protocol was adopted two years later on 16 September 1987.","hi":"अंटार्कटिक ओजोन छिद्र की रिपोर्ट 1985 में आई थी, और इसके दो वर्ष बाद 16 सितंबर 1987 को मॉन्ट्रियल प्रोटोकॉल अपनाया गया।"}},{"q":{"en":"How do the 1987 and 2005 Montreal milestones differ?","hi":"1987 और 2005 के दो मॉन्ट्रियल सम्मेलनों में क्या अंतर है?"},"a":{"en":"1987: Ozone Protocol; 2005: COP11/CMP1 climate meeting","hi":"1987: ओजोन प्रोटोकॉल; 2005: COP11/CMP1 जलवायु बैठक"},"o":[{"en":"1987: Ozone Protocol; 2005: COP11/CMP1 climate meeting","hi":"1987: ओजोन प्रोटोकॉल; 2005: COP11/CMP1 जलवायु बैठक"},{"en":"Both were identical UNFCCC COP meetings","hi":"दोनों एक समान UNFCCC COP बैठकें थीं"},{"en":"1987 was COP11; 2005 was Montreal Protocol signing","hi":"1987 COP11 था; 2005 मॉन्ट्रियल प्रोटोकॉल हस्ताक्षर"},{"en":"Both declared World Ozone Day","hi":"दोनों ने विश्व ओजोन दिवस घोषित किया"}],"exp":{"en":"Montreal 1987 produced the ozone-protecting Montreal Protocol, whereas Montreal 2005 was UNFCCC COP11 and the first Kyoto Protocol meeting of Parties (CMP1).","hi":"1987 का मॉन्ट्रियल सम्मेलन ओजोन संरक्षण प्रोटोकॉल से जुड़ा है, जबकि 2005 का मॉन्ट्रियल सम्मेलन UNFCCC COP11 और क्योटो प्रोटोकॉल की पहली बैठक (CMP1) था।"}},{"q":{"en":"When and where was the very first UNFCCC COP (COP1) held?","hi":"UNFCCC का पहला पक्षकार सम्मेलन (COP1) कब और कहाँ आयोजित हुआ था?"},"a":{"en":"Berlin, 1995","hi":"बर्लिन, 1995"},"o":[{"en":"Berlin, 1995","hi":"बर्लिन, 1995"},{"en":"Rio de Janeiro, 1992","hi":"रियो डी जेनेरो, 1992"},{"en":"Kyoto, 1997","hi":"क्योटो, 1997"},{"en":"Durban, 2011","hi":"डरबन, 2011"}],"exp":{"en":"After the UNFCCC entered into force in 1994, COP1 was held in Berlin in 1995. Kyoto was COP3 (1997), Bali COP13 (2007), Copenhagen COP15 (2009), and Durban COP17 (2011).","hi":"1994 में UNFCCC प्रभावी होने के बाद पहला COP (COP1) 1995 में बर्लिन में हुआ। क्योटो COP3, बाली COP13, कोपेनहेगन COP15 और डरबन COP17 थे।"}},{"q":{"en":"How do Greenhouse Effect, Global Warming, and Climate Change relate?","hi":"ग्रीनहाउस प्रभाव, ग्लोबल वार्मिंग और जलवायु परिवर्तन आपस में कैसे संबंधित हैं?"},"a":{"en":"Natural process → warming → broader climate shifts","hi":"प्राकृतिक प्रक्रिया → उष्मीकरण → व्यापक जलवायु बदलाव"},"o":[{"en":"Natural process → warming → broader climate shifts","hi":"प्राकृतिक प्रक्रिया → उष्मीकरण → व्यापक जलवायु बदलाव"},{"en":"Three interchangeable terms for the same phenomenon","hi":"एक ही घटना के तीन समानार्थी शब्द"},{"en":"Ozone hole → UV rays → sea-level rise","hi":"ओजोन छिद्र → पराबैंगनी किरणें → समुद्र-स्तर वृद्धि"},{"en":"Industrial soot → acid rain → ocean warming","hi":"औद्योगिक कालिख → अम्ल वर्षा → महासागर उष्मीकरण"}],"exp":{"en":"The natural greenhouse effect keeps Earth habitable; human-added GHGs enhance it to cause global warming; climate change is the broader set of long-term shifts in temperature, rainfall, extremes, and oceans.","hi":"प्राकृतिक ग्रीनहाउस प्रभाव पृथ्वी को रहने योग्य रखता है; मानवजनित गैसें इसे बढ़ाकर ग्लोबल वार्मिंग करती हैं; और जलवायु परिवर्तन तापमान, वर्षा, चरम घटनाओं व महासागरों में व्यापक दीर्घकालिक बदलाव है।"}},{"q":{"en":"How do the Paris Agreement (2015) and Glasgow Pact (2021) relate to the 1.5°C goal?","hi":"पेरिस समझौता (2015) और ग्लासगो समझौता (2021) 1.5°C लक्ष्य से कैसे संबंधित हैं?"},"a":{"en":"Paris set 1.5°C effort; Glasgow reaffirmed & strengthened","hi":"पेरिस ने 1.5°C प्रयास तय किया; ग्लासगो ने सुदृढ़ किया"},"o":[{"en":"Paris set 1.5°C effort; Glasgow reaffirmed & strengthened","hi":"पेरिस ने 1.5°C प्रयास तय किया; ग्लासगो ने सुदृढ़ किया"},{"en":"Paris lacked 1.5°C; Glasgow invented it","hi":"पेरिस में 1.5°C नहीं था; ग्लासगो ने इसे बनाया"},{"en":"Glasgow replaced Paris with a new treaty","hi":"ग्लासगो ने पेरिस को नई संधि से बदल दिया"},{"en":"Both set 2°C and rejected 1.5°C","hi":"दोनों ने 2°C तय किया और 1.5°C खारिज किया"}],"exp":{"en":"Paris (2015) already set the goal of well below 2°C while pursuing 1.5°C; Glasgow (2021) reaffirmed and strengthened action to keep 1.5°C within reach.","hi":"पेरिस (2015) ने पहले ही 2°C से काफी नीचे और 1.5°C के लिए प्रयास का लक्ष्य रखा था; ग्लासगो (2021) ने इसे प्राप्त करने की दिशा में कार्रवाई की पुनः पुष्टि व सुदृढ़ीकरण किया।"}}]}],"6. Environmental Pollution / पर्यावरण प्रदूषण":[{"title":{"en":"1. Overview / Chapter Snapshot","hi":"1। अवलोकन / अध्याय स्नैपशॉट"},"questions":[{"q":{"en":"Which six pollution categories are covered under Environmental Pollution?","hi":"पर्यावरण प्रदूषण अध्याय के अंतर्गत कौन-सी छह प्रदूषण श्रेणियाँ शामिल हैं?"},"a":{"en":"Air, water, soil, noise, radioactive & solid waste","hi":"वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस अपशिष्ट"},"o":[{"en":"Air, water, soil, noise, radioactive & solid waste","hi":"वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस अपशिष्ट"},{"en":"Troposphere, stratosphere, mesosphere, thermosphere, exosphere & weather","hi":"क्षोभमंडल, समतापमंडल, मध्यमंडल, तापमंडल, बाह्यमंडल व मौसम"},{"en":"Timber laws, deforestation treaties, logging quotas & tariffs","hi":"काष्ठ कानून, वनोन्मूलन संधियाँ, कटाई कोटा व शुल्क"},{"en":"Marine mammal anatomy, gill structure, fins & migration","hi":"समुद्री स्तनधारी शरीर रचना, गलफड़ संरचना, पंख व प्रवास"}],"exp":{"en":"This chapter covers six categories—air, water, soil, noise, radioactive, and solid-waste pollution—along with their causes, health/ecological effects, control measures, and pollutant–disease associations.","hi":"इस अध्याय में छह श्रेणियाँ—वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस-अपशिष्ट प्रदूषण—उनके कारण, स्वास्थ्य/पारिस्थितिक प्रभाव, नियंत्रण उपाय और प्रदूषक-रोग संबंध शामिल हैं।"}},{"q":{"en":"How many pollution categories are covered in this chapter?","hi":"इस अध्याय में कितने प्रकार के प्रदूषण शामिल किए गए हैं?"},"a":{"en":"6 categories","hi":"6 श्रेणियाँ"},"o":[{"en":"6 categories","hi":"6 श्रेणियाँ"},{"en":"4 categories","hi":"4 श्रेणियाँ"},{"en":"8 categories","hi":"8 श्रेणियाँ"},{"en":"3 categories","hi":"3 श्रेणियाँ"}],"exp":{"en":"Six chapter categories are covered: Air, Water, Soil, Noise, Radioactive, and Solid Waste.","hi":"अध्याय में छह श्रेणियाँ शामिल हैं: वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस अपशिष्ट।"}},{"q":{"en":"How many health-effect/disease–pollutant question groups are covered in the water-pollution section?","hi":"जल-प्रदूषण खंड में कितने स्वास्थ्य-प्रभाव/रोग-प्रदूषक प्रश्न-समूह समाहित किए गए हैं?"},"a":{"en":"6 question groups.","hi":"6 प्रश्न-समूह।"},"o":[{"en":"6 question groups.","hi":"6 प्रश्न-समूह।"},{"en":"3 question groups.","hi":"3 प्रश्न-समूह।"},{"en":"10 question groups.","hi":"10 प्रश्न-समूह।"},{"en":"4 question groups.","hi":"4 प्रश्न-समूह।"}],"exp":{"en":"6 question groups. These six groups mix infectious disease, toxic-metal poisoning and chemical health effects, so they should not all be called 'water-borne diseases' in the same sense.","hi":"6 प्रश्न-समूह। इन छह समूह में संक्रामक रोग, विषाक्त-धातु विषाक्तता और रासायनिक स्वास्थ्य प्रभाव मिश्रण हैं; इसलिए सभी को समान अर्थ में 'जल-जनित रोगों' नहीं कहना चाहिए।"}},{"q":{"en":"Is there a single universal 65 dB threshold for noise pollution under India's Noise Rules?","hi":"क्या भारत के ध्वनि नियमों के तहत ध्वनि प्रदूषण के लिए कोई एक सार्वभौमिक 65 dB सीमा है?"},"a":{"en":"No; limits vary by zone and day/night","hi":"नहीं; सीमाएँ क्षेत्र व दिन/रात के अनुसार बदलती हैं"},"o":[{"en":"No; limits vary by zone and day/night","hi":"नहीं; सीमाएँ क्षेत्र व दिन/रात के अनुसार बदलती हैं"},{"en":"Yes; 65 dB applies to all areas at all times","hi":"हाँ; 65 dB हर क्षेत्र और समय पर लागू है"},{"en":"Yes; 85 dB is the universal limit everywhere","hi":"हाँ; 85 dB हर जगह की सार्वभौमिक सीमा है"},{"en":"No ambient noise standards exist in India","hi":"भारत में कोई परिवेशीय ध्वनि मानक नहीं हैं"}],"exp":{"en":"India's Noise Pollution (Regulation and Control) Rules, 2000 set zone-specific day/night limits in dB(A) Leq: Industrial 75/70, Commercial 65/55, Residential 55/45, and Silence Zone 50/40. 65 dB is specifically the Commercial daytime limit.","hi":"भारत के ध्वनि प्रदूषण नियम, 2000 क्षेत्र-विशिष्ट दिन/रात सीमाएँ तय करते हैं: औद्योगिक 75/70, वाणिज्यिक 65/55, आवासीय 55/45 और शांत क्षेत्र 50/40 dB(A) Leq। 65 dB केवल वाणिज्यिक क्षेत्र की दिन की सीमा है।"}},{"q":{"en":"When was the Air (Prevention and Control of Pollution) Act enacted in India?","hi":"भारत में वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम कब अधिनियमित हुआ?"},"a":{"en":"1981","hi":"1981"},"o":[{"en":"1981","hi":"1981"},{"en":"1972","hi":"1972"},{"en":"1986","hi":"1986"},{"en":"1992","hi":"1992"}],"exp":{"en":"1981. The full statute is the Air (Prevention and Control of Pollution) Act, 1981, India's principal law specifically aimed at prevention, control and abatement of air pollution.","hi":"1981। पूरा कानून वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1981 है, जो वायु प्रदूषण की निवारण, नियंत्रण और उन्मूलन पर केंद्रित मुख्य भारतीय कानून है।"}},{"q":{"en":"Which pair correctly matches water-related diseases with their causative pollutants?","hi":"निम्नलिखित में से कौन-सा युग्म जल-संबंधी रोगों और उनके कारक प्रदूषकों का सही मिलान है?"},"a":{"en":"Minamata–Hg; Itai-Itai–Cd; Blackfoot–As; Blue-baby–Nitrate","hi":"मिनामाता–पारा; इटाई-इटाई–कैडमियम; ब्लैकफुट–आर्सेनिक; ब्लू-बेबी–नाइट्रेट"},"o":[{"en":"Minamata–Hg; Itai-Itai–Cd; Blackfoot–As; Blue-baby–Nitrate","hi":"मिनामाता–पारा; इटाई-इटाई–कैडमियम; ब्लैकफुट–आर्सेनिक; ब्लू-बेबी–नाइट्रेट"},{"en":"Minamata–Cd; Itai-Itai–Hg; Blackfoot–Nitrate; Blue-baby–As","hi":"मिनामाता–कैडमियम; इटाई-इटाई–पारा; ब्लैकफुट–नाइट्रेट; ब्लू-बेबी–आर्सेनिक"},{"en":"Jaundice–Hg; Cholera–As; Typhoid–Nitrate; Dysentery–Cd","hi":"पीलिया–पारा; हैजा–आर्सेनिक; टाइफाइड–नाइट्रेट; पेचिश–कैडमियम"},{"en":"Minamata–As; Itai-Itai–Nitrate; Blackfoot–Cd; Blue-baby–Hg","hi":"मिनामाता–आर्सेनिक; इटाई-इटाई–नाइट्रेट; ब्लैकफुट–कैडमियम; ब्लू-बेबी–पारा"}],"exp":{"en":"Classic pollutant–disease associations: Minamata disease → methylmercury; Itai-Itai disease → cadmium; Blackfoot disease → chronic arsenic exposure; Blue-baby syndrome → nitrate/nitrite-related methaemoglobinaemia.","hi":"प्रमुख प्रदूषक–रोग संबंध: मिनामाता रोग → मिथाइल मरकरी; इटाई-इटाई रोग → कैडमियम; ब्लैकफुट रोग → दीर्घकालिक आर्सेनिक संपर्क; ब्लू-बेबी सिंड्रोम → नाइट्रेट/नाइट्राइट-संबंधित मीथेमोग्लोबिनेमिया।"}}]},{"title":{"en":"2. Pollutants — Primary & Secondary","hi":"2। प्रदूषक - प्राथमिक और द्वितीयक"},"questions":[{"q":{"en":"Which of the following are standard examples of primary air pollutants?","hi":"निम्नलिखित में से प्राथमिक वायु प्रदूषकों के मानक उदाहरण कौन-से हैं?"},"a":{"en":"CO, SO2, NO/NOx, NH3, VOCs, primary PM","hi":"CO, SO2, NO/NOx, NH3, VOCs, प्राथमिक कण"},"o":[{"en":"CO, SO2, NO/NOx, NH3, VOCs, primary PM","hi":"CO, SO2, NO/NOx, NH3, VOCs, प्राथमिक कण"},{"en":"O3, PAN, HNO3, and H2SO4","hi":"O3, PAN, HNO3 और H2SO4"},{"en":"Acid rain and photochemical smog","hi":"अम्ल वर्षा और प्रकाश-रासायनिक धूम-कोहरा"},{"en":"Plastics and DDT in agricultural soil","hi":"कृषि मृदा में प्लास्टिक और DDT"}],"exp":{"en":"Primary air pollutants are emitted directly from sources into the atmosphere, such as CO, SO2, NO/NOx, NH3, VOCs, and primary particulate matter.","hi":"प्राथमिक वायु प्रदूषक स्रोतों से सीधे वायुमंडल में उत्सर्जित होते हैं, जैसे CO, SO2, NO/NOx, NH3, VOCs और प्राथमिक कणिकीय पदार्थ।"}},{"q":{"en":"Which of the following are standard examples of secondary air pollutants?","hi":"निम्नलिखित में से द्वितीयक वायु प्रदूषकों के मानक उदाहरण कौन-से हैं?"},"a":{"en":"O3, PAN, HNO3, H2SO4, secondary aerosols","hi":"O3, PAN, HNO3, H2SO4, द्वितीयक एरोसोल"},"o":[{"en":"O3, PAN, HNO3, H2SO4, secondary aerosols","hi":"O3, PAN, HNO3, H2SO4, द्वितीयक एरोसोल"},{"en":"CO, SO2, and NH3 emitted directly","hi":"सीधे उत्सर्जित CO, SO2 और NH3"},{"en":"Plastic litter and DDT residues","hi":"प्लास्टिक कचरा और DDT अवशेष"},{"en":"Coarse road dust kicked up by traffic","hi":"यातायात से उड़ने वाली मोटी सड़क धूल"}],"exp":{"en":"Secondary air pollutants form in the atmosphere through chemical reactions among primary pollutants and atmospheric constituents—e.g., ground-level ozone (O3), PAN, HNO3, H2SO4, and secondary sulfate/nitrate aerosols.","hi":"द्वितीयक वायु प्रदूषक वायुमंडल में रासायनिक अभिक्रियाओं से बनते हैं—जैसे भूतलीय ओजोन (O3), PAN, HNO3, H2SO4 और द्वितीयक सल्फेट/नाइट्रेट कण।"}},{"q":{"en":"What is the key difference between Primary and Secondary Pollutants?","hi":"प्राथमिक और द्वितीयक प्रदूषकों के बीच मुख्य अंतर क्या है?"},"a":{"en":"Direct emission vs atmospheric chemical formation","hi":"प्रत्यक्ष उत्सर्जन बनाम वायुमंडलीय रासायनिक निर्माण"},"o":[{"en":"Direct emission vs atmospheric chemical formation","hi":"प्रत्यक्ष उत्सर्जन बनाम वायुमंडलीय रासायनिक निर्माण"},{"en":"Natural origin vs human-made origin","hi":"प्राकृतिक उत्पत्ति बनाम मानव-निर्मित उत्पत्ति"},{"en":"High toxicity vs complete harmlessness","hi":"अत्यधिक विषाक्तता बनाम पूर्णतः हानिरहित होना"},{"en":"Waterborne location vs airborne location","hi":"जल में उपस्थिति बनाम वायु में उपस्थिति"}],"exp":{"en":"The distinction is based on formation pathway: primary pollutants are emitted directly from a source, whereas secondary pollutants form in the atmosphere via chemical reactions.","hi":"यह अंतर निर्माण मार्ग पर आधारित है: प्राथमिक प्रदूषक स्रोत से सीधे उत्सर्जित होते हैं, जबकि द्वितीयक प्रदूषक वायुमंडल में रासायनिक अभिक्रियाओं से बनते हैं।"}}]},{"title":{"en":"3. Air Pollution","hi":"3। वायु प्रदूषण"},"questions":[{"q":{"en":"Which of the following are major causes of Air Pollution?","hi":"निम्नलिखित में से वायु प्रदूषण के प्रमुख कारण कौन-से हैं?"},"a":{"en":"Fossil fuels, vehicles, industry, dust, biomass burning","hi":"जीवाश्म ईंधन, वाहन, उद्योग, धूल, जैवमास दहन"},"o":[{"en":"Fossil fuels, vehicles, industry, dust, biomass burning","hi":"जीवाश्म ईंधन, वाहन, उद्योग, धूल, जैवमास दहन"},{"en":"Planting trees and natural photosynthesis","hi":"वृक्षारोपण और प्राकृतिक प्रकाश संश्लेषण"},{"en":"Solar panels and wind turbines","hi":"सौर पैनल और पवन टरबाइन"},{"en":"Evaporation of clean river water","hi":"स्वच्छ नदी जल का वाष्पीकरण"}],"exp":{"en":"Major air-pollution sources include fossil-fuel combustion, vehicle exhaust, industrial emissions, power plants, construction/road dust, and waste/biomass burning.","hi":"वायु प्रदूषण के प्रमुख स्रोतों में जीवाश्म-ईंधन दहन, वाहन धुआँ, औद्योगिक उत्सर्जन, बिजली संयंत्र, निर्माण/सड़क धूल और कचरा/जैवमास दहन शामिल हैं।"}},{"q":{"en":"Which are common gaseous air pollutants?","hi":"निम्नलिखित में से सामान्य गैसीय वायु प्रदूषक कौन-से हैं?"},"a":{"en":"CO, SO2, NOx, ground-level O3, NH3, VOCs","hi":"CO, SO2, NOx, भूतलीय O3, NH3, VOCs"},"o":[{"en":"CO, SO2, NOx, ground-level O3, NH3, VOCs","hi":"CO, SO2, NOx, भूतलीय O3, NH3, VOCs"},{"en":"PM2.5, PM10, dust, and soot","hi":"PM2.5, PM10, धूल और कालिख"},{"en":"DDT and microplastic fibres","hi":"DDT और माइक्रोप्लास्टिक रेशे"},{"en":"Water vapour and molecular oxygen","hi":"जलवाष्प और आणविक ऑक्सीजन"}],"exp":{"en":"Common gaseous air pollutants include CO, SO2, NOx, ground-level O3, NH3, and VOCs. CO2 is treated primarily as a greenhouse gas rather than a conventional local criteria pollutant under India's NAAQS.","hi":"सामान्य गैसीय वायु प्रदूषकों में CO, SO2, NOx, भूतलीय O3, NH3 और VOCs शामिल हैं। CO2 को मुख्यतः ग्रीनहाउस गैस माना जाता है, न कि NAAQS के तहत स्थानीय मानदंड प्रदूषक।"}},{"q":{"en":"Which are common particulate air pollutants?","hi":"निम्नलिखित में से सामान्य कणिकीय वायु प्रदूषक कौन-से हैं?"},"a":{"en":"PM2.5, PM10, dust, smoke, soot, fly ash","hi":"PM2.5, PM10, धूल, धुआँ, कालिख, फ्लाई ऐश"},"o":[{"en":"PM2.5, PM10, dust, smoke, soot, fly ash","hi":"PM2.5, PM10, धूल, धुआँ, कालिख, फ्लाई ऐश"},{"en":"CO, SO2, NO, NO2, N2O, CH4","hi":"CO, SO2, NO, NO2, N2O, CH4"},{"en":"Ozone, nitric acid vapour, argon, neon, helium","hi":"ओजोन, नाइट्रिक अम्ल वाष्प, आर्गन, नियॉन, हीलियम"},{"en":"DDT, aldrin, plastic bags, glass, scrap metal","hi":"DDT, एल्ड्रिन, प्लास्टिक बैग, काँच, रद्दी धातु"}],"exp":{"en":"Particulate pollutants are suspended solid or liquid particles such as PM2.5, PM10, dust, smoke, soot, and fly ash.","hi":"कणिकीय प्रदूषक वायु में निलंबित ठोस या तरल कण हैं, जैसे PM2.5, PM10, धूल, धुआँ, कालिख और फ्लाई ऐश।"}},{"q":{"en":"What are the major health impacts of Air Pollution?","hi":"वायु प्रदूषण के प्रमुख स्वास्थ्य प्रभाव क्या हैं?"},"a":{"en":"Respiratory & cardiovascular disease, asthma, irritation","hi":"श्वसन व हृदय रोग, अस्थमा, आँख/गले में जलन"},"o":[{"en":"Respiratory & cardiovascular disease, asthma, irritation","hi":"श्वसन व हृदय रोग, अस्थमा, आँख/गले में जलन"},{"en":"Cholera, typhoid, and dysentery","hi":"हैजा, टाइफाइड और पेचिश"},{"en":"Minamata, Itai-Itai, and Blackfoot disease","hi":"मिनामाता, इटाई-इटाई और ब्लैकफुट रोग"},{"en":"Hearing loss and insomnia only","hi":"केवल श्रवण हानि और अनिद्रा"}],"exp":{"en":"Air pollution causes or worsens respiratory and cardiovascular diseases, asthma, eye/throat irritation, and reduced lung function; fine particles (PM2.5) can penetrate deep into lungs and the bloodstream.","hi":"वायु प्रदूषण श्वसन और हृदय-वाहिका रोग, अस्थमा, आँख/गले में जलन और फेफड़ों की कार्यक्षमता में कमी लाता है; सूक्ष्म कण (PM2.5) फेफड़ों में गहराई तक प्रवेश कर सकते हैं।"}},{"q":{"en":"Which major Indian measures address ambient air pollution?","hi":"भारत में परिवेशीय वायु प्रदूषण को नियंत्रित करने वाले प्रमुख उपाय कौन-से हैं?"},"a":{"en":"Air Act 1981, NAMP, NAAQS, NCAP (2019)","hi":"वायु अधिनियम 1981, NAMP, NAAQS, NCAP (2019)"},"o":[{"en":"Air Act 1981, NAMP, NAAQS, NCAP (2019)","hi":"वायु अधिनियम 1981, NAMP, NAAQS, NCAP (2019)"},{"en":"Namami Gange Programme, Jal Shakti Abhiyan (2019)","hi":"नमामि गंगे कार्यक्रम, जल शक्ति अभियान (2019)"},{"en":"Wildlife Protection Act 1972, Project Tiger (1973)","hi":"वन्यजीव संरक्षण अधिनियम 1972, प्रोजेक्ट टाइगर (1973)"},{"en":"Montreal Protocol 1987, Kigali Amendment (2016)","hi":"मॉन्ट्रियल प्रोटोकॉल 1987, किगाली संशोधन (2016)"}],"exp":{"en":"Key Indian air-quality measures include the Air (Prevention and Control of Pollution) Act, 1981, NAMP, NAAQS, and the National Clean Air Programme (NCAP, launched in 2019; by FY 2025–26, 108 of 130 cities reduced annual PM10 vs 2017–18).","hi":"भारत में प्रमुख वायु-गुणवत्ता उपायों में वायु अधिनियम 1981, NAMP, NAAQS और राष्ट्रीय स्वच्छ वायु कार्यक्रम (NCAP, 2019 में शुरू; FY 2025–26 तक 130 में से 108 शहरों ने वार्षिक PM10 घटाया) शामिल हैं।"}}]},{"title":{"en":"4. Water Pollution","hi":"4। जल प्रदूषण"},"questions":[{"q":{"en":"What is water pollution?","hi":"जल प्रदूषण क्या है?"},"a":{"en":"Undesirable contamination degrading water quality","hi":"अवांछित संदूषण जिससे जल गुणवत्ता खराब हो"},"o":[{"en":"Undesirable contamination degrading water quality","hi":"अवांछित संदूषण जिससे जल गुणवत्ता खराब हो"},{"en":"Natural evaporation of river water","hi":"नदी जल का प्राकृतिक वाष्पीकरण"},{"en":"Freezing of ocean surfaces in winter","hi":"सर्दियों में समुद्री सतह का जमना"},{"en":"Desalination of seawater","hi":"समुद्री जल से नमक हटाना"}],"exp":{"en":"Contamination or undesirable physical, chemical or biological change in water that degrades its quality and can make it harmful or unsuitable for organisms or intended uses. Water pollution may involve pathogens, nutrients, toxic chemicals, sediments, heat, oil, plastics or radioactive contaminants; it is broader than simply 'mixing gases, liquids and solids'.","hi":"जल में संदूषण या अवांछित भौतिक, रासायनिक या जैविक परिवर्तन जो उसकी गुणवत्ता खराब करे और जीवों या निर्धारित उपयोगों के लिए हानिकारक/अनुपयुक्त बना दे। जल प्रदूषण रोगजनक, पोषक तत्त्व, विषाक्त रसायन, अवसाद, ऊष्मा, तेल, प्लास्टिक या रेडियोधर्मी संदूषक शामिल कर सकता है; यह केवल 'गैसें, तरल और ठोस मिश्रण' से व्यापक अवधारणा है।"}},{"q":{"en":"What are major human-induced causes of Water Pollution?","hi":"जल प्रदूषण के प्रमुख मानव-जनित कारण क्या हैं?"},"a":{"en":"Sewage, industrial effluents, farm runoff, oil spills","hi":"मलजल, औद्योगिक बहिःस्राव, कृषि अपवाह, तेल रिसाव"},"o":[{"en":"Sewage, industrial effluents, farm runoff, oil spills","hi":"मलजल, औद्योगिक बहिःस्राव, कृषि अपवाह, तेल रिसाव"},{"en":"Volcanic ash and forest leaf litter","hi":"ज्वालामुखीय राख और वन पत्तियाँ"},{"en":"Earthquakes and tectonic plate shifts","hi":"भूकंप और विवर्तनिक प्लेट गतियाँ"},{"en":"Solar flares and cosmic radiation","hi":"सौर ज्वालाएँ और ब्रह्मांडीय विकिरण"}],"exp":{"en":"Untreated sewage and industrial effluents, agricultural runoff containing fertilisers/pesticides, oil spills, plastics, thermal discharges and accidental chemical or radioactive releases. Untreated sewage is a major microbial/organic load, while industry and agriculture can add toxic chemicals, nutrients and oxygen-demanding matter.","hi":"अनुपचारित मलजल और औद्योगिक बहिःस्राव, उर्वरक/कीटनाशक वाला कृषि अपवाह, तेल रिसाव, प्लास्टिक, तापीय बहिःस्राव और आकस्मिक रासायनिक या रेडियोधर्मी पदार्थों का रिसाव। अनुपचारित मलजल प्रमुख सूक्ष्मजीवी/कार्बनिक भार है, जबकि उद्योग और कृषि विषाक्त रसायन, पोषक तत्त्व और ऑक्सीजन-माँग वाला पदार्थ जोड़ सकते हैं।"}},{"q":{"en":"What are natural causes of Water Pollution?","hi":"जल प्रदूषण के प्राकृतिक कारण क्या हैं?"},"a":{"en":"Erosion, volcanic ash, decay, geogenic As/F","hi":"अपरदन, ज्वालामुखीय राख, क्षय, भूजनित As/F"},"o":[{"en":"Erosion, volcanic ash, decay, geogenic As/F","hi":"अपरदन, ज्वालामुखीय राख, क्षय, भूजनित As/F"},{"en":"Domestic sewage and oil spills","hi":"घरेलू मलजल और तेल रिसाव"},{"en":"Synthetic pesticides and fertilisers","hi":"कृत्रिम कीटनाशक और उर्वरक"},{"en":"Nuclear power plant effluents","hi":"परमाणु संयंत्र का अपशिष्ट"}],"exp":{"en":"Natural sources can include erosion and sediment, volcanic ash, decaying organic matter, saline intrusion and naturally occurring contaminants such as arsenic or fluoride in groundwater. Some contaminants are geogenic rather than human-made; arsenic and fluoride in groundwater are important examples of naturally occurring chemical contamination.","hi":"प्राकृतिक स्रोत में अपरदन/अवसाद, ज्वालामुखीय राख, क्षयमान कार्बनिक पदार्थ, लवणीय जल का प्रवेश और भूजल में प्राकृतिक रूप से पाए जाने वाले आर्सेनिक या फ्लोराइड जैसे संदूषक शामिल हो सकते हैं। कुछ संदूषक मानव-निर्मित नहीं बल्कि भूजनित होते हैं; भूजल में आर्सेनिक और फ्लोराइड प्राकृतिक रूप से पाए जाने वाले रासायनिक संदूषण के महत्वपूर्ण उदाहरण हैं।"}},{"q":{"en":"Which water-borne viral infections can produce jaundice as a symptom?","hi":"कौन-से जल-जनित विषाणु संक्रमण पीलिया को लक्षण के रूप में उत्पन्न कर सकते हैं?"},"a":{"en":"Hepatitis A and Hepatitis E","hi":"हेपेटाइटिस A और हेपेटाइटिस E"},"o":[{"en":"Hepatitis A and Hepatitis E","hi":"हेपेटाइटिस A और हेपेटाइटिस E"},{"en":"Mercury and lead heavy-metal poisoning","hi":"पारा और सीसा भारी-धातु विषाक्तता"},{"en":"Nitrate and fluoride chemical toxicity","hi":"नाइट्रेट और फ्लोराइड रासायनिक विषाक्तता"},{"en":"Typhoid and cholera bacterial infections","hi":"टाइफाइड और हैजा जीवाणु संक्रमण"}],"exp":{"en":"Hepatitis A and Hepatitis E; jaundice itself is a symptom, not a single disease caused only by one virus. Hepatitis A and E are commonly transmitted through faecally contaminated food or water and can cause jaundice; jaundice itself has many other infectious and non-infectious causes.","hi":"हेपेटाइटिस A और हेपेटाइटिस E; पीलिया स्वयं एक लक्षण है, ऐसा एकमात्र रोग नहीं है जो केवल एक विषाणु से होता हो। हेपेटाइटिस A और E मल द्वारा संदूषित खाद्य/जल से सामान्यतः संचारित होते हैं और पीलिया उत्पन्न कर सकते हैं; पीलिया के अनेक अन्य संक्रामक/गैर-संक्रामक कारण भी होते हैं।"}},{"q":{"en":"Minamata disease is classically caused by exposure to which pollutant?","hi":"मिनामाता रोग परंपरागत रूप से किस प्रदूषक संपर्क से होती है?"},"a":{"en":"Methylmercury.","hi":"मिथाइल मरकरी।"},"o":[{"en":"Methylmercury.","hi":"मिथाइल मरकरी।"},{"en":"Cadmium.","hi":"कैडमियम।"},{"en":"Arsenic.","hi":"आर्सेनिक।"},{"en":"Nitrates.","hi":"नाइट्रेट।"}],"exp":{"en":"Methylmercury. Minamata disease is severe neurological poisoning caused by methylmercury that bioaccumulated and biomagnified in aquatic food chains.","hi":"मिथाइल मरकरी। मिनामाता रोग गंभीर तंत्रिका संबंधी विषाक्तता है जो जलीय खाद्य शृंखला में जैव-संचित/जैव-आवर्धित हुए मिथाइल मरकरी के कारण होती है।"}},{"q":{"en":"Blue-baby syndrome from contaminated drinking water is linked mainly to what?","hi":"संदूषित पेयजल से होने वाला ब्लू-बेबी सिंड्रोम मुख्यतः किससे जुड़ा है?"},"a":{"en":"High nitrate/nitrite (methaemoglobinaemia)","hi":"उच्च नाइट्रेट/नाइट्राइट (मीथेमोग्लोबिनेमिया)"},"o":[{"en":"High nitrate/nitrite (methaemoglobinaemia)","hi":"उच्च नाइट्रेट/नाइट्राइट (मीथेमोग्लोबिनेमिया)"},{"en":"Methylmercury poisoning","hi":"मिथाइल मरकरी विषाक्तता"},{"en":"Chronic cadmium poisoning","hi":"दीर्घकालिक कैडमियम विषाक्तता"},{"en":"Chronic arsenic poisoning","hi":"दीर्घकालिक आर्सेनिक विषाक्तता"}],"exp":{"en":"High nitrate exposure, which can be converted to nitrite and cause methaemoglobinaemia in infants. Nitrate can be reduced to nitrite, which oxidises haemoglobin to methaemoglobin and reduces oxygen transport, making young infants especially vulnerable.","hi":"उच्च नाइट्रेट संपर्क, जो नाइट्राइट में बदलकर शिशुओं में मीथेमोग्लोबिनेमिया उत्पन्न कर सकता है। नाइट्रेट नाइट्राइट में कम हो सकता है, जो हीमोग्लोबिन को मीथेमोग्लोबिन में ऑक्सीकृत करके ऑक्सीजन परिवहन कम करता है; छोटे शिशु विशेष रूप से सुभेद्य होते हैं।"}},{"q":{"en":"Which statement correctly describes cholera, typhoid and dysentery?","hi":"हैजा, टाइफाइड और पेचिश के बारे में कौन-सा कथन सही है?"},"a":{"en":"Cholera & typhoid: bacterial; dysentery: bacterial/amoebic","hi":"हैजा व टाइफाइड: जीवाणु; पेचिश: जीवाणु/अमीबी"},"o":[{"en":"Cholera & typhoid: bacterial; dysentery: bacterial/amoebic","hi":"हैजा व टाइफाइड: जीवाणु; पेचिश: जीवाणु/अमीबी"},{"en":"All three are caused by the same bacterium","hi":"तीनों एक ही जीवाणु से होते हैं"},{"en":"All three are viral infections","hi":"तीनों विषाणुजनित संक्रमण हैं"},{"en":"All three are heavy-metal poisonings","hi":"तीनों भारी-धातु विषाक्तता हैं"}],"exp":{"en":"Cholera is caused by Vibrio cholerae and typhoid by Salmonella Typhi; dysentery may be bacterial (for example Shigella) or amoebic (Entamoeba histolytica). Cholera and typhoid are specific bacterial infections, whereas 'dysentery' is a clinical syndrome with more than one possible cause, including bacterial and amoebic infection.","hi":"हैजा विब्रियो कॉलेरी से और टाइफाइड साल्मोनेला टाइफी से होता है; पेचिश जीवाणुजनित (जैसे शिगेला) या अमीबी (एंटअमीबा हिस्टोलिटिका) हो सकती है। हैजा और टाइफाइड विशिष्ट जीवाणुजनित संक्रमण हैं, जबकि 'पेचिश' नैदानिक लक्षण-समूह है जिसके जीवाणुजनित और अमीबी सहित अनेक कारण हो सकते हैं।"}},{"q":{"en":"Itai-Itai disease is classically associated with chronic exposure to which metal?","hi":"इटाई-इटाई रोग परंपरागत रूप से किस धातु के दीर्घकालिक संपर्क से संबद्ध है?"},"a":{"en":"Cadmium.","hi":"कैडमियम।"},"o":[{"en":"Cadmium.","hi":"कैडमियम।"},{"en":"Mercury.","hi":"पारा।"},{"en":"Arsenic.","hi":"आर्सेनिक।"},{"en":"Nitrates.","hi":"नाइट्रेट्स।"}],"exp":{"en":"Cadmium. Chronic cadmium exposure can damage kidneys and bones; the historical Itai-Itai episode in Japan is the classic example.","hi":"कैडमियम। दीर्घकालिक कैडमियम संपर्क गुर्दों और अस्थियों को क्षति कर सकता है; जापान का ऐतिहासिक इटाई-इटाई घटना प्रमुख उदाहरण है।"}},{"q":{"en":"Blackfoot disease is classically associated with chronic exposure to which contaminant?","hi":"ब्लैकफुट रोग परंपरागत रूप से किस संदूषक के दीर्घकालिक संपर्क से संबद्ध है?"},"a":{"en":"Arsenic.","hi":"आर्सेनिक।"},"o":[{"en":"Arsenic.","hi":"आर्सेनिक।"},{"en":"Mercury.","hi":"पारा।"},{"en":"Cadmium.","hi":"कैडमियम।"},{"en":"Strontium-90.","hi":"स्ट्रोंटियम-90।"}],"exp":{"en":"Arsenic. Blackfoot disease is a severe peripheral vascular condition classically associated with long-term ingestion of arsenic-contaminated groundwater.","hi":"आर्सेनिक। ब्लैकफुट रोग गंभीर परिधीय संवहनी स्थिति है जो परंपरागत रूप से दीर्घकालिक आर्सेनिक-संदूषित भूजल अंतर्ग्रहण से संबद्ध है।"}},{"q":{"en":"What is BOD (Biochemical Oxygen Demand)?","hi":"BOD (जैव-रासायनिक ऑक्सीजन माँग) क्या है?"},"a":{"en":"Oxygen used by microbes to decompose organics","hi":"कार्बनिक अपघटन में सूक्ष्मजीवों द्वारा प्रयुक्त O2"},"o":[{"en":"Oxygen used by microbes to decompose organics","hi":"कार्बनिक अपघटन में सूक्ष्मजीवों द्वारा प्रयुक्त O2"},{"en":"Rate of stratospheric ozone depletion","hi":"समतापमंडलीय ओजोन क्षय की दर"},{"en":"Total oxygen dissolved in pure distilled water","hi":"शुद्ध आसुत जल में घुली कुल ऑक्सीजन"},{"en":"Bacterial disease caused by dirty water","hi":"गंदे पानी से होने वाला जीवाणु रोग"}],"exp":{"en":"Biochemical Oxygen Demand — the amount of dissolved oxygen consumed by microorganisms while decomposing biodegradable organic matter under specified test conditions; higher BOD generally indicates greater biodegradable organic pollution. BOD is usually measured under standardised time/temperature conditions, commonly BOD5 at 20°C. A high BOD means microorganisms are consuming more dissolved oxygen, which can stress aquatic life.","hi":"जैव-रासायनिक ऑक्सीजन माँग - निर्दिष्ट परीक्षण स्थितियों में जैव-अवक्रमणीय कार्बनिक पदार्थ अपघटित करते समय सूक्ष्मजीवों द्वारा उपभोग की गई घुलित ऑक्सीजन की मात्रा; उच्चतर BOD सामान्यतः अधिक जैव-अवक्रमणीय कार्बनिक प्रदूषण को इंगित करता है। BOD मानकीकृत समय/तापमान की निर्धारित स्थितियों में मापा जाता है, सामान्यतः BOD5 पर 20°C। उच्च BOD का मतलब सूक्ष्मजीव ज्यादा घुलित ऑक्सीजन उपभोग कर रहे हैं, जिससे जलीय जीवन तनावग्रस्त हो सकता है।"}},{"q":{"en":"How do Ganga Action Plan and Namami Gange differ?","hi":"गंगा एक्शन प्लान और नमामि गंगे में क्या अंतर है?"},"a":{"en":"GAP: 1985 abatement; Namami Gange: 2014 rejuvenation","hi":"GAP: 1985 उन्मूलन; नमामि गंगे: 2014 पुनर्जीवन"},"o":[{"en":"GAP: 1985 abatement; Namami Gange: 2014 rejuvenation","hi":"GAP: 1985 उन्मूलन; नमामि गंगे: 2014 पुनर्जीवन"},{"en":"Both are the same scheme from 1985","hi":"दोनों 1985 की एक ही योजना हैं"},{"en":"Namami Gange is older than GAP","hi":"नमामि गंगे, गंगा एक्शन प्लान से पुराना है"},{"en":"One is for Yamuna and one for Ganga","hi":"एक यमुना के लिए और दूसरा गंगा के लिए है"}],"exp":{"en":"Ganga Action Plan was an earlier river-pollution-abatement programme launched in 1985; Namami Gange was launched in 2014 as a broader Ganga rejuvenation programme under the National Mission for Clean Ganga, whose activities continued in 2026. The two programmes belong to different policy generations. Namami Gange uses a broader river-rejuvenation approach including sewage infrastructure, ecology, flow, public participation and basin management.","hi":"गंगा कार्रवाई योजना 1985 में शुरू किया गया पहले नदी-प्रदूषण-उन्मूलन कार्यक्रम था; नमामि गंगे 2014 में राष्ट्रीय मिशन के लिए स्वच्छ गंगा के अंतर्गत व्यापक गंगा पुनर्जीवन कार्यक्रम के रूप में शुरू हुआ, जिसकी गतिविधियाँ 2026 में भी जारी रहीं। दोनों कार्यक्रम अलग नीति पीढ़ियों के हैं। नमामि गंगे व्यापक नदी-पुनर्जीवन दृष्टिकोण उपयोग करता है जिसमें मलजल अवसंरचना, पारिस्थितिकी, प्रवाह, सार्वजनिक भागीदारी और बेसिन प्रबंधन शामिल हैं।"}}]},{"title":{"en":"5. Soil Pollution","hi":"5। मृदा प्रदूषण"},"questions":[{"q":{"en":"What is soil pollution?","hi":"मृदा प्रदूषण क्या है?"},"a":{"en":"Contamination of soil by harmful chemicals/wastes","hi":"हानिकारक रसायनों/अपशिष्ट से मृदा संदूषण"},"o":[{"en":"Contamination of soil by harmful chemicals/wastes","hi":"हानिकारक रसायनों/अपशिष्ट से मृदा संदूषण"},{"en":"Natural process of rock weathering into soil","hi":"चट्टानों के अपक्षय से मृदा निर्माण"},{"en":"Addition of organic humus to farmland","hi":"खेतों में जैविक ह्यूमस मिलाना"},{"en":"Seasonal freezing of topsoil in winter","hi":"सर्दियों में ऊपरी मिट्टी का जमना"}],"exp":{"en":"Contamination of soil by harmful chemicals, wastes or other pollutants that degrades soil quality and can harm organisms, crops, groundwater or human health. Pollution is specifically about harmful contamination; soil erosion or declining fertility can be soil degradation without necessarily being soil pollution.","hi":"हानिकारक रसायन, अपशिष्ट या अन्य प्रदूषक से मृदा संदूषण जो मृदा गुणवत्ता खराब करे और जीवों, फसलें, भूजल या मानव स्वास्थ्य को हानि कर सके। प्रदूषण विशेष रूप से हानिकारक संदूषण को संदर्भित करता है; मृदा अपरदन या घटती उर्वरता मृदा क्षरण हो सकते हैं लेकिन अनिवार्यतः मृदा प्रदूषण नहीं।"}},{"q":{"en":"What are major causes of soil pollution?","hi":"मृदा प्रदूषण के प्रमुख कारण क्या हैं?"},"a":{"en":"Excess agrochemicals, industrial/mining waste, spills","hi":"अत्यधिक कृषि-रसायन, औद्योगिक/खनन अपशिष्ट, रिसाव"},"o":[{"en":"Excess agrochemicals, industrial/mining waste, spills","hi":"अत्यधिक कृषि-रसायन, औद्योगिक/खनन अपशिष्ट, रिसाव"},{"en":"Crop rotation and organic mulching","hi":"फसल चक्र और जैविक पलवार बिछाना"},{"en":"Composting and vermiculture alone","hi":"केवल कम्पोस्टिंग और केंचुआ-पालन"},{"en":"Afforestation and shelter belts","hi":"वनीकरण और वायु-अवरोधक वृक्ष-पट्टियाँ"}],"exp":{"en":"Excessive or improper use of pesticides and fertilisers, industrial and municipal waste, hazardous chemical spills, mining residues, sewage/sludge contamination and improper waste disposal. Persistent pesticides, heavy metals and poorly managed hazardous wastes can remain in soil for long periods and move into crops, groundwater or food chains.","hi":"कीटनाशक/उर्वरक का अत्यधिक या अनुचित उपयोग, औद्योगिक/नगरपालिका अपशिष्ट, खतरनाक रासायनिक रिसाव, खनन अवशेष, मलजल/कीचड़ संदूषण और अनुचित अपशिष्ट निपटान। स्थायी कीटनाशक, भारी धातुओं और खराब तरीके से प्रबंधित खतरनाक अपशिष्ट मृदा में लंबी अवधियों तक रहकर फसलें, भूजल या खाद्य शृंखलाएँ में बढ़ना कर सकते हैं।"}},{"q":{"en":"What are effective measures to control soil pollution?","hi":"मृदा प्रदूषण नियंत्रण के प्रभावी उपाय क्या हैं?"},"a":{"en":"Rationalise agrochemicals, segregate waste, bioremediate","hi":"कृषि-रसायन कम करना, अपशिष्ट पृथक्करण, जैव-उपचार"},"o":[{"en":"Rationalise agrochemicals, segregate waste, bioremediate","hi":"कृषि-रसायन कम करना, अपशिष्ट पृथक्करण, जैव-उपचार"},{"en":"Increase persistent pesticide use like DDT","hi":"DDT जैसे स्थायी कीटनाशकों का उपयोग बढ़ाना"},{"en":"Dump untreated industrial sludge on land","hi":"अनुपचारित औद्योगिक कीचड़ भूमि पर डालना"},{"en":"Clear forests to expose contaminated soil","hi":"संदूषित भूमि साफ करने हेतु वनोन्मूलन"}],"exp":{"en":"Reduce and rationalise agrochemical use, segregate and safely treat/dispose wastes, prevent hazardous spills, recycle/recover materials and use remediation or bioremediation where contamination has occurred. Prevention is preferable to cleanup: source reduction, safe waste management and spill control come first; remediation is used after contamination has occurred.","hi":"कृषि-रसायन उपयोग को कम/युक्तिसंगत करना, अपशिष्ट को पृथक और सुरक्षित रूप से मानना/निपटान करना, खतरनाक रिसाव रोकना करना, सामग्री पुनर्चक्रित/पुनर्प्राप्त करना और संदूषण होने पर उपचार/जैव-उपचार उपयोग करना। सफाई से निवारण वरीय है: स्रोत पर कमी, सुरक्षित अपशिष्ट प्रबंधन और रिसाव नियंत्रण पहले आते हैं; संदूषण होने के बाद उपचार उपयोग की जाती है।"}},{"q":{"en":"What are major impacts of soil pollution?","hi":"मृदा प्रदूषण के प्रमुख प्रभाव क्या हैं?"},"a":{"en":"Lower fertility, crop/groundwater contamination, toxicity","hi":"उर्वरता में कमी, फसल/भूजल संदूषण, विषाक्तता"},"o":[{"en":"Lower fertility, crop/groundwater contamination, toxicity","hi":"उर्वरता में कमी, फसल/भूजल संदूषण, विषाक्तता"},{"en":"Higher crop yields in all conditions","hi":"सभी स्थितियों में अधिक फसल उपज"},{"en":"Complete prevention of soil erosion","hi":"मृदा अपरदन की पूर्ण रोकथाम"},{"en":"Automatic purification of groundwater","hi":"भूजल का स्वतः शुद्धिकरण"}],"exp":{"en":"Reduced soil fertility and productivity, toxicity to soil organisms and plants, contamination of crops and groundwater, ecosystem damage and human-health risks through exposure or the food chain. Soil pollutants can alter pH, microbial communities and nutrient cycling, reduce crop productivity and create exposure through food, dust or groundwater.","hi":"कम मृदा उर्वरता/उत्पादकता, मृदा जीवों और पौधे पर विषाक्तता, फसलें/भूजल संदूषण, पारितंत्र क्षति और संपर्क या खाद्य शृंखला के माध्यम से मानवीय-स्वास्थ्य जोखिम। मृदा प्रदूषक pH, सूक्ष्मजीवी समुदाय और पोषक तत्त्व चक्रण बदलती कर सकते हैं, फसल उत्पादकता कम कर सकते हैं और खाद्य, धूल या भूजल के माध्यम से संपर्क स्थापित कर सकते हैं।"}}]},{"title":{"en":"6. Noise Pollution","hi":"6। ध्वनि प्रदूषण"},"questions":[{"q":{"en":"How is noise pollution defined?","hi":"ध्वनि प्रदूषण को कैसे परिभाषित किया जाता है?"},"a":{"en":"Unwanted or excessive sound harming health/well-being","hi":"अवांछित या अत्यधिक ध्वनि जो स्वास्थ्य को नुकसान पहुँचाए"},"o":[{"en":"Unwanted or excessive sound harming health/well-being","hi":"अवांछित या अत्यधिक ध्वनि जो स्वास्थ्य को नुकसान पहुँचाए"},{"en":"Any audible sound exceeding 20 dB indoors","hi":"घर के भीतर 20 dB से अधिक कोई भी ध्वनि"},{"en":"Any industrial sound exceeding 100 dB outdoors","hi":"बाहर 100 dB से अधिक कोई भी औद्योगिक ध्वनि"},{"en":"Ultrasonic sound waves travelling through deep oceans","hi":"गहरे महासागरों में संचरित होने वाली पराश्रव्य तरंगें"}],"exp":{"en":"Noise pollution is unwanted or excessive sound that adversely affects health or well-being; India does not use one universal 65 dB limit—permissible ambient limits depend on area category and day/night period. India's legal standards use dB(A) Leq and vary by land-use zone. Day is 6 a.m.–10 p.m. and night is 10 p.m.–6 a.m. under the Noise Rules.","hi":"ध्वनि प्रदूषण अवांछित या अत्यधिक ध्वनि है जो स्वास्थ्य/कल्याण को प्रतिकूल रूप से प्रभावित करे; भारत में एकमात्र सार्वभौमिक 65 dB सीमा नहीं है-अनुमेय परिवेशीय सीमाएँ क्षेत्र श्रेणी और दिन/रात अवधि पर निर्भर करते हैं। भारत के कानूनी मानक dB(A) Leq उपयोग करते हैं और भूमि-उपयोग क्षेत्र के अनुसार बदलते हैं। ध्वनि नियम में दिन 6 a.m.-10 p.m। और रात 10 p.m.-6 a.m। है।"}},{"q":{"en":"Which are natural sources of environmental noise?","hi":"पर्यावरणीय ध्वनि के प्राकृतिक स्रोत कौन-से हैं?"},"a":{"en":"Thunder, earthquakes, volcanic eruptions, strong winds","hi":"मेघगर्जन, भूकंप, ज्वालामुखी विस्फोट, तेज पवन"},"o":[{"en":"Thunder, earthquakes, volcanic eruptions, strong winds","hi":"मेघगर्जन, भूकंप, ज्वालामुखी विस्फोट, तेज पवन"},{"en":"Loudspeakers and public-address systems","hi":"लाउडस्पीकर और ध्वनि विस्तारक यंत्र"},{"en":"Industrial machinery and generators","hi":"औद्योगिक मशीनरी और जनरेटर"},{"en":"Vehicle horns and aircraft traffic","hi":"वाहनों के हॉर्न और विमान यातायात"}],"exp":{"en":"Thunder, earthquakes, volcanic eruptions, strong winds and other natural acoustic events. Natural sound can be intense, but environmental-noise regulation mainly focuses on human-generated sources that can be controlled.","hi":"मेघगर्जन, भूकंप, ज्वालामुखीय विस्फोट, मजबूत पवन और अन्य प्राकृतिक ध्वनिक कार्यक्रम। प्राकृतिक ध्वनि तीव्र हो सकता है, लेकिन पर्यावरणीय-ध्वनि विनियमन मुख्यतः मानवीय-उत्पन्न नियंत्रण योग्य स्रोत पर केंद्रित है।"}},{"q":{"en":"Which are major human-induced causes of Noise Pollution?","hi":"ध्वनि प्रदूषण के प्रमुख मानव-जनित कारण कौन-से हैं?"},"a":{"en":"Traffic, industrial machinery, construction, loudspeakers","hi":"यातायात, औद्योगिक मशीनरी, निर्माण, लाउडस्पीकर"},"o":[{"en":"Traffic, industrial machinery, construction, loudspeakers","hi":"यातायात, औद्योगिक मशीनरी, निर्माण, लाउडस्पीकर"},{"en":"Thunderstorms and lightning strikes","hi":"मेघगर्जन और बिजली गिरना"},{"en":"Earthquakes and volcanic eruptions","hi":"भूकंप और ज्वालामुखी विस्फोट"},{"en":"Wind blowing through forest trees","hi":"जंगल के पेड़ों से गुजरती हवा"}],"exp":{"en":"Road, rail and air traffic, industrial/construction machinery, generators, loudspeakers, amplified music and other human activities. Transport, construction and industry are major chronic community-noise sources; amplified sound can create intense local and event-based exposure.","hi":"सड़क, रेल और वायु यातायात, औद्योगिक/निर्माण मशीनरी, जनरेटर, लाउडस्पीकर, तेज़ ध्वनि वाला संगीत और अन्य मानवीय गतिविधियाँ। परिवहन, निर्माण और उद्योग प्रमुख दीर्घकालिक समुदाय-ध्वनि स्रोत हैं; तीव्र ध्वनि तीव्र स्थानीय/घटना-आधारित संपर्क स्थापित कर सकता है।"}},{"q":{"en":"What are well-established health impacts of excessive environmental noise?","hi":"अत्यधिक पर्यावरणीय ध्वनि के सुप्रमाणित स्वास्थ्य प्रभाव क्या हैं?"},"a":{"en":"Hearing loss, sleep disturbance, stress, hypertension","hi":"श्रवण हानि, नींद में बाधा, तनाव, उच्च रक्तचाप"},"o":[{"en":"Hearing loss, sleep disturbance, stress, hypertension","hi":"श्रवण हानि, नींद में बाधा, तनाव, उच्च रक्तचाप"},{"en":"Cholera, typhoid, and dysentery","hi":"हैजा, टाइफाइड और पेचिश"},{"en":"Minamata and Itai-Itai diseases","hi":"मिनामाता और इटाई-इटाई रोग"},{"en":"Skin pigmentation changes only","hi":"केवल त्वचा के रंग में परिवर्तन"}],"exp":{"en":"Hearing impairment/tinnitus, sleep disturbance, annoyance and stress, hypertension and other cardiovascular effects, and cognitive impairment o
