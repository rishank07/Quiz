यम - यह वृत्ताकार प्रवाह है।"},{"en":"100% — Tansley's Law — it is a multi-directional flow.","hi":"100% - टैन्सले का नियम - यह बहु-दिशात्मक प्रवाह है।"}],"exp":{"en":"Key fact: Only 10% — Lindeman's Law — it is a unidirectional flow.","hi":"मुख्य तथ्य: केवल 10% - लिंडमैन का नियम (लिंडमैन का नियम) - यह एकदिशीय प्रवाह (एकदिशीय प्रवाह) है।"}},{"q":{"en":"What happens to the remaining 90% of the energy in a food chain?","hi":"खाद्य श्रृंखला में शेष 90% ऊर्जा का क्या होता है?"},"a":{"en":"It is lost as heat/respiration.","hi":"यह गर्मी/श्वसन (श्वसन) के रूप में नष्ट हो जाता है।"},"o":[{"en":"It is lost as heat/respiration.","hi":"यह गर्मी/श्वसन (श्वसन) के रूप में नष्ट हो जाता है।"},{"en":"It is permanently stored in the animal's bones.","hi":"यह जानवर की हड्डियों में स्थायी रूप से जमा हो जाता है।"},{"en":"It is recycled back to the sun.","hi":"इसे पुनर्चक्रित कर सूर्य तक वापस भेज दिया जाता है।"},{"en":"It is converted directly into water.","hi":"यह सीधे पानी में परिवर्तित हो जाता है।"}],"exp":{"en":"Key fact: It is lost as heat/respiration.","hi":"मुख्य तथ्य: यह गर्मी/श्वसन (श्वसन) के रूप में नष्ट हो जाता है।"}},{"q":{"en":"How do humans act in terms of consumers?","hi":"उपभोक्ताओं के संदर्भ में मनुष्य किस प्रकार कार्य करता है?"},"a":{"en":"Like both Primary and Secondary Consumers.","hi":"प्राथमिक और द्वितीयक उपभोक्ताओं दोनों की तरह।"},"o":[{"en":"Like both Primary and Secondary Consumers.","hi":"प्राथमिक और द्वितीयक उपभोक्ताओं दोनों की तरह।"},{"en":"Only as Producers.","hi":"केवल निर्माता के रूप में।"},{"en":"Only as Decomposers.","hi":"केवल डीकंपोजर के रूप में।"},{"en":"Only as Quaternary Consumers.","hi":"केवल चतुर्धातुक (चतुर्थक) उपभोक्ताओं के रूप में।"}],"exp":{"en":"Key fact: Like both Primary and Secondary Consumers.","hi":"मुख्य तथ्य: प्राथमिक और द्वितीयक उपभोक्ताओं दोनों की तरह।"}},{"q":{"en":"How many types of Food Chains are there and what are they?","hi":"खाद्य श्रृंखला कितने प्रकार की होती है और वे कौन-कौन सी हैं?"},"a":{"en":"2 types — Grazing Food Chain and Decomposer Food Chain.","hi":"2 प्रकार - चराई खाद्य श्रृंखला (चराई खाद्य शृंखला) और डीकंपोजर खाद्य श्रृंखला।"},"o":[{"en":"2 types — Grazing Food Chain and Decomposer Food Chain.","hi":"2 प्रकार - चराई खाद्य श्रृंखला (चराई खाद्य शृंखला) और डीकंपोजर खाद्य श्रृंखला।"},{"en":"3 types — Primary, Secondary, Tertiary.","hi":"3 प्रकार - प्राथमिक, द्वितीयक, तृतीयक।"},{"en":"2 types — Aquatic and Terrestrial.","hi":"2 प्रकार - जलीय और स्थलीय।"},{"en":"1 type — Linear Food Chain.","hi":"1 प्रकार - रैखिक खाद्य श्रृंखला।"}],"exp":{"en":"Key fact: 2 types — Grazing Food Chain and Decomposer Food Chain.","hi":"मुख्य तथ्य: 2 प्रकार - चराई खाद्य श्रृंखला (चराई खाद्य शृंखला) और डीकंपोजर खाद्य श्रृंखला।"}},{"q":{"en":"Who are the Producers in the trophic level pyramid?","hi":"पोषी स्तर पिरामिड में निर्माता (उत्पादक) कौन हैं?"},"a":{"en":"Green plants, algae, photosynthetic organisms, etc.","hi":"हरे पौधे, शैवाल, प्रकाश संश्लेषक जीव, आदि।"},"o":[{"en":"Green plants, algae, photosynthetic organisms, etc.","hi":"हरे पौधे, शैवाल, प्रकाश संश्लेषक जीव, आदि।"},{"en":"Herbivores like cows and goats.","hi":"गाय और बकरियों जैसे शाकाहारी जानवर।"},{"en":"Carnivores like lions and tigers.","hi":"शेर और बाघ जैसे मांसाहारी।"},{"en":"Bacteria and fungi.","hi":"बैक्टीरिया और कवक।"}],"exp":{"en":"Key fact: Green plants, algae, photosynthetic organisms, etc.","hi":"मुख्य तथ्य: हरे पौधे, शैवाल, प्रकाश संश्लेषक जीव, आदि।"}},{"q":{"en":"Who are Primary Consumers (Herbivores)?","hi":"प्राथमिक उपभोक्ता (शाकाहारी) कौन हैं?"},"a":{"en":"Herbivores — cow, goat, etc.","hi":"शाकाहारी - गाय, बकरी आदि।"},"o":[{"en":"Herbivores — cow, goat, etc.","hi":"शाकाहारी - गाय, बकरी आदि।"},{"en":"Green plants and algae.","hi":"हरे पौधे और शैवाल।"},{"en":"Small carnivores like snakes and cats.","hi":"छोटे मांसाहारी जानवर जैसे सांप और बिल्लियाँ।"},{"en":"Top carnivores like lions.","hi":"शेर जैसे शीर्ष मांसाहारी।"}],"exp":{"en":"Key fact: Herbivores — cow, goat, etc.","hi":"मुख्य तथ्य: शाकाहारी - गाय, बकरी आदि।"}},{"q":{"en":"Who are Secondary Consumers?","hi":"द्वितीयक उपभोक्ता कौन हैं?"},"a":{"en":"Small carnivores — snake, cat, etc.","hi":"छोटे मांसाहारी - साँप, बिल्ली आदि।"},"o":[{"en":"Small carnivores — snake, cat, etc.","hi":"छोटे मांसाहारी - साँप, बिल्ली आदि।"},{"en":"Herbivores — cow, goat, etc.","hi":"शाकाहारी - गाय, बकरी आदि।"},{"en":"Green plants and algae.","hi":"हरे पौधे और शैवाल।"},{"en":"Top carnivores — lion, tiger.","hi":"शीर्ष मांसाहारी - शेर, बाघ।"}],"exp":{"en":"Key fact: Small carnivores — snake, cat, etc.","hi":"मुख्य तथ्य: छोटे मांसाहारी - साँप, बिल्ली आदि।"}},{"q":{"en":"What do Tertiary Consumers do?","hi":"तृतीयक उपभोक्ता क्या करते हैं?"},"a":{"en":"They eat primary and secondary consumers.","hi":"वे प्राथमिक और द्वितीयक उपभोक्ताओं को खाते हैं।"},"o":[{"en":"They eat primary and secondary consumers.","hi":"वे प्राथमिक और द्वितीयक उपभोक्ताओं को खाते हैं।"},{"en":"They only eat plants.","hi":"वे केवल पौधे खाते हैं।"},{"en":"They decompose dead matter.","hi":"वे मृत पदार्थ को विघटित करते हैं।"},{"en":"They produce energy from sunlight.","hi":"वे सूर्य के प्रकाश से ऊर्जा उत्पन्न करते हैं।"}],"exp":{"en":"Key fact: They eat primary and secondary consumers.","hi":"मुख्य तथ्य: वे प्राथमिक और द्वितीयक उपभोक्ताओं को खाते हैं।"}},{"q":{"en":"Who are Quaternary Consumers?","hi":"चतुर्धातुक उपभोक्ता (चतुर्थक उपभोक्ता) कौन हैं?"},"a":{"en":"Top Carnivores — lion, tiger, vulture, etc.","hi":"शीर्ष मांसाहारी - शेर, बाघ, गिद्ध, आदि।"},"o":[{"en":"Top Carnivores — lion, tiger, vulture, etc.","hi":"शीर्ष मांसाहारी - शेर, बाघ, गिद्ध, आदि।"},{"en":"Small carnivores — snake, cat.","hi":"छोटे मांसाहारी - साँप, बिल्ली।"},{"en":"Herbivores — cow, goat.","hi":"शाकाहारी - गाय, बकरी।"},{"en":"Decomposers — bacteria, fungi.","hi":"डीकंपोजर - बैक्टीरिया, कवक।"}],"exp":{"en":"Key fact: Top Carnivores — lion, tiger, vulture, etc.","hi":"मुख्य तथ्य: शीर्ष मांसाहारी - शेर, बाघ, गिद्ध, आदि।"}},{"q":{"en":"What is a Food Web?","hi":"फ़ूड वेब (खाद्य जाल) क्या है?"},"a":{"en":"A network of interconnected food chains within an ecosystem — not a single linear chain.","hi":"एक पारिस्थितिकी तंत्र के भीतर परस्पर जुड़ी खाद्य श्रृंखलाओं का एक नेटवर्क - एक एकल रैखिक श्रृंखला नहीं।"},"o":[{"en":"A network of interconnected food chains within an ecosystem — not a single linear chain.","hi":"एक पारिस्थितिकी तंत्र के भीतर परस्पर जुड़ी खाद्य श्रृंखलाओं का एक नेटवर्क - एक एकल रैखिक श्रृंखला नहीं।"},{"en":"A straight line showing energy transfer from one plant to one animal.","hi":"एक सीधी रेखा जो एक पौधे से एक जानवर में ऊर्जा हस्तांतरण को दर्शाती है।"},{"en":"The physical web woven by spiders to catch prey.","hi":"शिकार को पकड़ने के लिए मकड़ियों द्वारा बुना गया भौतिक जाल।"},{"en":"A database of all animals in a forest.","hi":"जंगल के सभी जानवरों का डेटाबेस।"}],"exp":{"en":"Key fact: A network of interconnected food chains within an ecosystem — not a single linear chain.","hi":"मुख्य तथ्य: एक पारिस्थितिकी तंत्र के भीतर परस्पर जुड़ी खाद्य श्रृंखलाओं का एक नेटवर्क - एक एकल रैखिक श्रृंखला नहीं।"}},{"q":{"en":"What is Biomagnification?","hi":"बायोमैग्निफिकेशन (जैव आवर्धन) क्या है?"},"a":{"en":"The excessive concentration of toxic substances in the higher trophic levels of a food chain.","hi":"खाद्य श्रृंखला के उच्च पोषी स्तरों (पोषी स्तरों) में विषाक्त पदार्थों की अत्यधिक सांद्रता।"},"o":[{"en":"The excessive concentration of toxic substances in the higher trophic levels of a food chain.","hi":"खाद्य श्रृंखला के उच्च पोषी स्तरों (पोषी स्तरों) में विषाक्त पदार्थों की अत्यधिक सांद्रता।"},{"en":"The increase in physical size of animals at higher trophic levels.","hi":"उच्च पोषी स्तर पर जानवरों के भौतिक आकार में वृद्धि।"},{"en":"The rapid reproduction rate of bacteria.","hi":"जीवाणुओं की तीव्र प्रजनन दर।"},{"en":"The magnification of plant energy through photosynthesis.","hi":"प्रकाश संश्लेषण के माध्यम से पादप ऊर्जा का आवर्धन।"}],"exp":{"en":"Key fact: The excessive concentration of toxic substances in the higher trophic levels of a food chain.","hi":"मुख्य तथ्य: खाद्य श्रृंखला के उच्च पोषी स्तरों (पोषी स्तरों) में विषाक्त पदार्थों की अत्यधिक सांद्रता।"}},{"q":{"en":"What are examples of Biomagnification substances?","hi":"बायोमैग्निफिकेशन पदार्थों के उदाहरण क्या हैं?"},"a":{"en":"DDT, BHC, 2-4D, Mercury, etc.","hi":"डीडीटी (DDT), बीएचसी (BHC), 2-4D, पारा (पारा), आदि।"},"o":[{"en":"DDT, BHC, 2-4D, Mercury, etc.","hi":"डीडीटी (DDT), बीएचसी (BHC), 2-4D, पारा (पारा), आदि।"},{"en":"Water, Oxygen, Carbon Dioxide.","hi":"पानी, ऑक्सीजन, कार्बन डाइऑक्साइड।"},{"en":"Glucose, Fructose, Sucrose.","hi":"ग्लूकोज, फ्रुक्टोज, सुक्रोज।"},{"en":"Calcium, Potassium, Sodium.","hi":"कैल्शियम, पोटेशियम, सोडियम।"}],"exp":{"en":"Key fact: DDT, BHC, 2-4D, Mercury, etc.","hi":"मुख्य तथ्य: डीडीटी (DDT), बीएचसी (BHC), 2-4D, पारा (पारा), आदि।"}}]},{"title":{"en":"4. Ecological Pyramid","hi":"4। पारिस्थितिक पिरामिड"},"questions":[{"q":{"en":"Who gave the concept of the Ecological Pyramid?","hi":"पारिस्थितिक पिरामिड की अवधारणा किसने दी?"},"a":{"en":"Charles Elton (1927 AD).","hi":"चार्ल्स एल्टन (1927 ई.)।"},"o":[{"en":"Charles Elton (1927 AD).","hi":"चार्ल्स एल्टन (1927 ई.)।"},{"en":"Ernst Haeckel (1869 AD).","hi":"अर्नस्ट हैकेल (1869 ई.)।"},{"en":"A.G. Tansley (1935 AD).","hi":"ए.जी। टैन्सले (1935 ई.)।"},{"en":"G.E. Hutchinson (1927 AD).","hi":"जी.ई। हचिन्सन (1927 ई.)।"}],"exp":{"en":"Key fact: Charles Elton (1927 AD).","hi":"मुख्य तथ्य: चार्ल्स एल्टन (1927 ई.)।"}},{"q":{"en":"What does an Ecological Pyramid show?","hi":"पारिस्थितिक पिरामिड क्या दर्शाता है?"},"a":{"en":"The number, biomass, or accumulated energy of producers and consumers at each trophic level.","hi":"प्रत्येक पोषी स्तर पर उत्पादकों और उपभोक्ताओं की संख्या, बायोमास, या संचित ऊर्जा।"},"o":[{"en":"The number, biomass, or accumulated energy of producers and consumers at each trophic level.","hi":"प्रत्येक पोषी स्तर पर उत्पादकों और उपभोक्ताओं की संख्या, बायोमास, या संचित ऊर्जा।"},{"en":"Only the physical size of the animals.","hi":"केवल जानवरों का भौतिक आकार।"},{"en":"The lifespan of different tree species.","hi":"विभिन्न वृक्ष प्रजातियों का जीवनकाल।"},{"en":"The amount of rainfall in a biome.","hi":"बायोम में वर्षा की मात्रा।"}],"exp":{"en":"Key fact: The number, biomass, or accumulated energy of producers and consumers at each trophic level.","hi":"मुख्य तथ्य: प्रत्येक पोषी स्तर पर उत्पादकों और उपभोक्ताओं की संख्या, बायोमास, या संचित ऊर्जा।"}},{"q":{"en":"What does the Pyramid of Number show and what is its shape?","hi":"संख्या का पिरामिड (पिरामिड का संख्या) क्या दर्शाता है और इसका आकार कैसा है?"},"a":{"en":"Shows the number of organisms at each trophic level — Upright in Aquatic, Inverted in Terrestrial.","hi":"प्रत्येक पोषी स्तर पर जीवों की संख्या दर्शाता है - जलीय में सीधा (सीधा), स्थलीय (स्थलीय) में उल्टा।"},"o":[{"en":"Shows the number of organisms at each trophic level — Upright in Aquatic, Inverted in Terrestrial.","hi":"प्रत्येक पोषी स्तर पर जीवों की संख्या दर्शाता है - जलीय में सीधा (सीधा), स्थलीय (स्थलीय) में उल्टा।"},{"en":"Shows total biomass — Upright in Terrestrial, Inverted in Aquatic.","hi":"कुल बायोमास दिखाता है - स्थलीय में सीधा, जलीय में उल्टा।"},{"en":"Shows accumulated energy — Always Upright.","hi":"संचित ऊर्जा दर्शाता है - हमेशा सीधा।"},{"en":"Shows the number of organisms — Always Inverted.","hi":"जीवों की संख्या दर्शाता है - हमेशा उल्टा।"}],"exp":{"en":"Key fact: Shows the number of organisms at each trophic level — Upright in Aquatic, Inverted in Terrestrial.","hi":"मुख्य तथ्य: प्रत्येक पोषी स्तर पर जीवों की संख्या दर्शाता है - जलीय में सीधा (सीधा), स्थलीय (स्थलीय) में उल्टा।"}},{"q":{"en":"What does the Pyramid of Biomass show and what is its shape?","hi":"बायोमास का पिरामिड क्या दर्शाता है और इसका आकार क्या है?"},"a":{"en":"Shows total biomass at each trophic level — Upright in Terrestrial, Inverted in Aquatic.","hi":"प्रत्येक पोषी स्तर पर कुल बायोमास दिखाता है - स्थलीय में सीधा, जलीय में उल्टा।"},"o":[{"en":"Shows total biomass at each trophic level — Upright in Terrestrial, Inverted in Aquatic.","hi":"प्रत्येक पोषी स्तर पर कुल बायोमास दिखाता है - स्थलीय में सीधा, जलीय में उल्टा।"},{"en":"Shows the number of organisms — Upright in Aquatic, Inverted in Terrestrial.","hi":"जीवों की संख्या दर्शाता है - जलीय में सीधा, स्थलीय में उल्टा।"},{"en":"Shows accumulated energy — Always Upright.","hi":"संचित ऊर्जा दर्शाता है - हमेशा सीधा।"},{"en":"Shows total biomass — Always Upright.","hi":"कुल बायोमास दिखाता है - हमेशा सीधा।"}],"exp":{"en":"Key fact: Shows total biomass at each trophic level — Upright in Terrestrial, Inverted in Aquatic.","hi":"मुख्य तथ्य: प्रत्येक पोषी स्तर पर कुल बायोमास दिखाता है - स्थलीय में सीधा, जलीय में उल्टा।"}},{"q":{"en":"What is the shape of the Pyramid of Energy and why?","hi":"ऊर्जा के पिरामिड का आकार कैसा होता है और क्यों?"},"a":{"en":"Always Upright — no exception — because energy always decreases at higher trophic levels.","hi":"हमेशा सीधा - कोई अपवाद नहीं - क्योंकि उच्च पोषी स्तर पर ऊर्जा हमेशा कम हो जाती है।"},"o":[{"en":"Always Upright — no exception — because energy always decreases at higher trophic levels.","hi":"हमेशा सीधा - कोई अपवाद नहीं - क्योंकि उच्च पोषी स्तर पर ऊर्जा हमेशा कम हो जाती है।"},{"en":"Always Inverted — because top predators have the most energy.","hi":"हमेशा उल्टा - क्योंकि शीर्ष शिकारियों में सबसे अधिक ऊर्जा होती है।"},{"en":"Upright in Terrestrial, Inverted in Aquatic.","hi":"स्थलीय में सीधा, जलीय में उल्टा।"},{"en":"Upright in Aquatic, Inverted in Terrestrial.","hi":"जलीय में सीधा, स्थलीय में उल्टा।"}],"exp":{"en":"Key fact: Always Upright — no exception — because energy always decreases at higher trophic levels.","hi":"मुख्य तथ्य: हमेशा सीधा - कोई अपवाद नहीं - क्योंकि उच्च पोषी स्तर पर ऊर्जा हमेशा कम हो जाती है।"}}]},{"title":{"en":"5. Ecological Niche & Imbalance","hi":"5। पारिस्थितिक निकेश (निकेत) और असंतुलन"},"questions":[{"q":{"en":"Who gave the concept of Ecological Niche?","hi":"पारिस्थितिक निकेश (पारिस्थितिक निकेत) की अवधारणा किसने दी?"},"a":{"en":"Charles Elton (1927) and G.E. Hutchinson.","hi":"चार्ल्स एल्टन (1927) और जी.ई। हचिन्सन।"},"o":[{"en":"Charles Elton (1927) and G.E. Hutchinson.","hi":"चार्ल्स एल्टन (1927) और जी.ई। हचिन्सन।"},{"en":"Ernst Haeckel and A.G. Tansley.","hi":"अर्नस्ट हैकेल और ए.जी। टैन्सले।"},{"en":"Sunderlal Bahuguna and Medha Patkar.","hi":"सुंदरलाल बहुगुणा और मेधा पाटकर।"},{"en":"Only Charles Elton (1927).","hi":"केवल चार्ल्स एल्टन (1927)।"}],"exp":{"en":"Key fact: Charles Elton (1927) and G.E. Hutchinson.","hi":"मुख्य तथ्य: चार्ल्स एल्टन (1927) और जी.ई। हचिन्सन।"}},{"q":{"en":"What is an Ecological Niche?","hi":"पारिस्थितिक निकेत क्या है?"},"a":{"en":"The functional role and position of a species in an ecosystem, including how it uses resources and interacts with other organisms.","hi":"पारितंत्र में किसी प्रजाति की कार्यात्मक भूमिका एवं स्थिति, जिसमें संसाधनों का उपयोग और अन्य जीवों के साथ उसकी अंतःक्रियाएँ शामिल हैं।"},"o":[{"en":"The functional role and position of a species in an ecosystem, including how it uses resources and interacts with other organisms.","hi":"पारितंत्र में किसी प्रजाति की कार्यात्मक भूमिका एवं स्थिति, जिसमें संसाधनों का उपयोग और अन्य जीवों के साथ उसकी अंतःक्रियाएँ शामिल हैं।"},{"en":"A small hole in a tree where birds live.","hi":"पेड़ में एक छोटा सा छेद जहाँ पक्षी रहते हैं।"},{"en":"The total physical area an animal roams.","hi":"कुल भौतिक क्षेत्र जिसमें कोई जानवर घूमता है।"},{"en":"The amount of energy an organism consumes.","hi":"एक जीव कितनी ऊर्जा की खपत करता है।"}],"exp":{"en":"An ecological niche describes a species' functional role, resource use and interactions; it is broader than its physical habitat.","hi":"पारिस्थितिक निकेत किसी प्रजाति की कार्यात्मक भूमिका, संसाधन-उपयोग और अंतःक्रियाओं को बताता है; यह उसके भौतिक आवास से व्यापक अवधारणा है।"}},{"q":{"en":"What is Ecological Imbalance?","hi":"पारिस्थितिक असंतुलन (पारिस्थितिक असंतुलन) क्या है?"},"a":{"en":"An increase or decrease in the population of a particular species that weakens their adaptive capacity.","hi":"किसी विशेष प्रजाति की जनसंख्या में वृद्धि या कमी जो उनकी अनुकूलन क्षमता को कमजोर करती है।"},"o":[{"en":"An increase or decrease in the population of a particular species that weakens their adaptive capacity.","hi":"किसी विशेष प्रजाति की जनसंख्या में वृद्धि या कमी जो उनकी अनुकूलन क्षमता को कमजोर करती है।"},{"en":"A perfect equilibrium between all predator and prey species.","hi":"सभी शिकारियों और शिकार प्रजातियों के बीच एक पूर्ण संतुलन।"},{"en":"The natural shifting of tectonic plates.","hi":"विवर्तनिक प्लेटों का प्राकृतिक खिसकाव।"},{"en":"The daily cycle of sunlight and darkness.","hi":"धूप और अंधेरे का दैनिक चक्र।"}],"exp":{"en":"Key fact: An increase or decrease in the population of a particular species that weakens their adaptive capacity.","hi":"मुख्य तथ्य: किसी विशेष प्रजाति की जनसंख्या में वृद्धि या कमी जो उनकी अनुकूलन क्षमता को कमजोर करती है।"}},{"q":{"en":"What are examples of Ecological Imbalance?","hi":"पारिस्थितिक असंतुलन के उदाहरण क्या हैं?"},"a":{"en":"Deforestation, Cyclone, Drought.","hi":"वनों की कटाई, चक्रवात, सूखा।"},"o":[{"en":"Deforestation, Cyclone, Drought.","hi":"वनों की कटाई, चक्रवात, सूखा।"},{"en":"Photosynthesis, Respiration, Transpiration.","hi":"प्रकाश संश्लेषण, श्वसन, वाष्पोत्सर्जन।"},{"en":"Nitrogen Cycle, Carbon Cycle, Water Cycle.","hi":"नाइट्रोजन चक्र, कार्बन चक्र, जल चक्र।"},{"en":"Producers, Consumers, Decomposers.","hi":"निर्माता, उपभोक्ता, डीकंपोजर।"}],"exp":{"en":"Key fact: Deforestation, Cyclone, Drought.","hi":"मुख्य तथ्य: वनों की कटाई, चक्रवात, सूखा।"}},{"q":{"en":"Where is the highest Terrestrial productivity found?","hi":"सबसे अधिक स्थलीय उत्पादकता (स्थलीय उत्पादकता) कहाँ पाई जाती है?"},"a":{"en":"In the Tropical Rainforest.","hi":"उष्णकटिबंधीय वर्षावन में।"},"o":[{"en":"In the Tropical Rainforest.","hi":"उष्णकटिबंधीय वर्षावन में।"},{"en":"In the Desert.","hi":"रेगिस्तान में।"},{"en":"In the Tundra.","hi":"टुंड्रा में।"},{"en":"In Temperate Grasslands.","hi":"समशीतोष्ण घास के मैदानों में।"}],"exp":{"en":"Key fact: In the Tropical Rainforest.","hi":"मुख्य तथ्य: उष्णकटिबंधीय वर्षावन में।"}},{"q":{"e समशीतोष्ण घास के मैदान, समशीतोष्ण शंकुधारी वन, टुंड्रा, समुद्री पेलाजिक।"}}]},{"title":{"en":"7. Exam Trap Reverse-Questions","hi":"7। परीक्षा जाल - उल्टे प्रश्न"},"questions":[{"q":{"en":"Who coined the term 'Ecology' and who coined 'Ecosystem'?","hi":"'इकोलॉजी' शब्द किसने गढ़ा और 'इकोसिस्टम' किसने गढ़ा?"},"a":{"en":"Ernst Haeckel gave 'Ecology' (1869); A.G. Tansley gave 'Ecosystem' (1935) — different scientists and different decades.","hi":"अर्न्स्ट हेकेल ने 'पारिस्थितिकी' (1869) दिया; ए। जी। टैन्सले ने 'पारितंत्र' (1935) दिया - अलग वैज्ञानिक और अलग दशक।"},"o":[{"en":"Ernst Haeckel gave 'Ecology' (1869); A.G. Tansley gave 'Ecosystem' (1935) — different scientists and different decades.","hi":"अर्न्स्ट हेकेल ने 'पारिस्थितिकी' (1869) दिया; ए। जी। टैन्सले ने 'पारितंत्र' (1935) दिया - अलग वैज्ञानिक और अलग दशक।"},{"en":"A.G. Tansley gave 'Ecology' (1935); Ernst Haeckel gave 'Ecosystem' (1869).","hi":"ए.जी। टैन्सले ने 'इकोलॉजी' (1935) दिया; अर्नस्ट हेकेल ने 'इकोसिस्टम' (1869) दिया।"},{"en":"Charles Elton gave both in 1927.","hi":"चार्ल्स एल्टन ने दोनों 1927 में दिए।"},{"en":"They are the same thing given by the same person.","hi":"वे एक ही व्यक्ति द्वारा दी गई एक ही चीज़ हैं।"}],"exp":{"en":"Key fact: Ernst Haeckel gave 'Ecology' (1869); A.G. Tansley gave 'Ecosystem' (1935) — different scientists and different decades.","hi":"मुख्य तथ्य: अर्न्स्ट हेकेल ने 'पारिस्थितिकी' (1869) दिया; ए। जी। टैन्सले ने 'पारितंत्र' (1935) दिया - अलग वैज्ञानिक और अलग दशक।"}},{"q":{"en":"Does the shape of the Pyramid of Energy ever invert?","hi":"क्या ऊर्जा के पिरामिड का आकार कभी उल्टा होता है?"},"a":{"en":"No — the Pyramid of Energy is always upright, with no exception. Only the Pyramids of Number and Biomass can be inverted depending on ecosystem type.","hi":"नहीं - ऊर्जा का पिरामिड हमेशा सीधा होता है, कोई अपवाद नहीं। केवल संख्या और बायोमास के पिरामिड इकोसिस्टम के प्रकार के अनुसार उल्टे हो सकते हैं।"},"o":[{"en":"No — the Pyramid of Energy is always upright, with no exception. Only the Pyramids of Number and Biomass can be inverted depending on ecosystem type.","hi":"नहीं - ऊर्जा का पिरामिड हमेशा सीधा होता है, कोई अपवाद नहीं। केवल संख्या और बायोमास के पिरामिड इकोसिस्टम के प्रकार के अनुसार उल्टे हो सकते हैं।"},{"en":"Yes, in aquatic ecosystems.","hi":"हाँ, जलीय पारिस्थितिक तंत्र में।"},{"en":"Yes, in terrestrial ecosystems.","hi":"हाँ, स्थलीय पारिस्थितिक तंत्र में।"},{"en":"Yes, but only in deep-sea vents.","hi":"हाँ, लेकिन केवल गहरे समुद्र के वेंट में।"}],"exp":{"en":"Key fact: No — the Pyramid of Energy is always upright, with no exception. Only the Pyramids of Number and Biomass can be inverted depending on ecosystem type.","hi":"मुख्य तथ्य: नहीं - ऊर्जा का पिरामिड हमेशा सीधा होता है, कोई अपवाद नहीं। केवल संख्या और बायोमास के पिरामिड इकोसिस्टम के प्रकार के अनुसार उल्टे हो सकते हैं।"}},{"q":{"en":"In which category is the Water Cycle placed that might seem counter-intuitive?","hi":"जल चक्र को किस श्रेणी में रखा गया है जो उल्टा लग सकता है?"},"a":{"en":"The Water Cycle is classified here as a Gaseous Cycle along with Nitrogen, Carbon, and Oxygen; only Phosphorus and Sulphur are Sedimentary Cycles.","hi":"यहाँ जल चक्र को नाइट्रोजन, कार्बन और ऑक्सीजन के साथ गैसीय चक्र में रखा गया है; केवल फॉस्फोरस और सल्फर अवसादी चक्र हैं।"},"o":[{"en":"The Water Cycle is classified here as a Gaseous Cycle along with Nitrogen, Carbon, and Oxygen; only Phosphorus and Sulphur are Sedimentary Cycles.","hi":"यहाँ जल चक्र को नाइट्रोजन, कार्बन और ऑक्सीजन के साथ गैसीय चक्र में रखा गया है; केवल फॉस्फोरस और सल्फर अवसादी चक्र हैं।"},{"en":"Classified as a Sedimentary Cycle.","hi":"तलछटी चक्र के रूप में वर्गीकृत।"},{"en":"Classified as an Abiotic Cycle only.","hi":"केवल अजैविक चक्र के रूप में वर्गीकृत।"},{"en":"Classified as a Biotic Cycle only.","hi":"केवल जैविक चक्र के रूप में वर्गीकृत।"}],"exp":{"en":"Key fact: The Water Cycle is classified here as a Gaseous Cycle along with Nitrogen, Carbon, and Oxygen; only Phosphorus and Sulphur are Sedimentary Cycles.","hi":"मुख्य तथ्य: यहाँ जल चक्र को नाइट्रोजन, कार्बन और ऑक्सीजन के साथ गैसीय चक्र में रखा गया है; केवल फॉस्फोरस और सल्फर अवसादी चक्र हैं।"}},{"q":{"en":"Who gave the concept of Ecological Niche — a single or multiple scientists?","hi":"पारिस्थितिक निकेश (पारिस्थितिक निकेत) की अवधारणा किसने दी - एक या अनेक वैज्ञानिकों ने?"},"a":{"en":"Two scientists — Charles Elton (1927) and G.E. Hutchinson; in contrast, the Ecological Pyramid concept was given by Charles Elton alone (1927).","hi":"दो वैज्ञानिक - चार्ल्स एल्टन (1927) और जी। ई। हचिन्सन; इसके विपरीत पारिस्थितिक पिरामिड की अवधारणा केवल चार्ल्स एल्टन (1927) ने दी।"},"o":[{"en":"Two scientists — Charles Elton (1927) and G.E. Hutchinson; in contrast, the Ecological Pyramid concept was given by Charles Elton alone (1927).","hi":"दो वैज्ञानिक - चार्ल्स एल्टन (1927) और जी। ई। हचिन्सन; इसके विपरीत पारिस्थितिक पिरामिड की अवधारणा केवल चार्ल्स एल्टन (1927) ने दी।"},{"en":"Only by Charles Elton (1927).","hi":"केवल चार्ल्स एल्टन (1927) द्वारा।"},{"en":"Only by Ernst Haeckel (1869).","hi":"केवल अर्नस्ट हेकेल (1869) द्वारा।"},{"en":"Only by A.G. Tansley (1935).","hi":"केवल ए.जी। टैन्सले (1935) द्वारा।"}],"exp":{"en":"Key fact: Two scientists — Charles Elton (1927) and G.E. Hutchinson; in contrast, the Ecological Pyramid concept was given by Charles Elton alone (1927).","hi":"मुख्य तथ्य: दो वैज्ञानिक - चार्ल्स एल्टन (1927) और जी। ई। हचिन्सन; इसके विपरीत पारिस्थितिक पिरामिड की अवधारणा केवल चार्ल्स एल्टन (1927) ने दी।"}},{"q":{"en":"Do not reverse the shapes of Pyramid of Number and Pyramid of Biomass for Terrestrial vs Aquatic.","hi":"स्थलीय बनाम जलीय के लिए संख्या के पिरामिड और बायोमास के पिरामिड के आकार को उल्टा न करें।"},"a":{"en":"Pyramid of Number: Aquatic = Upright, Terrestrial = Inverted. Pyramid of Biomass: Terrestrial = Upright, Aquatic = Inverted — opposite patterns.","hi":"संख्या का पिरामिड: जलीय = सीधा, स्थलीय = उल्टा। बायोमास का पिरामिड: स्थलीय = सीधा, जलीय = उल्टा - दोनों के पैटर्न विपरीत हैं।"},"o":[{"en":"Pyramid of Number: Aquatic = Upright, Terrestrial = Inverted. Pyramid of Biomass: Terrestrial = Upright, Aquatic = Inverted — opposite patterns.","hi":"संख्या का पिरामिड: जलीय = सीधा, स्थलीय = उल्टा। बायोमास का पिरामिड: स्थलीय = सीधा, जलीय = उल्टा - दोनों के पैटर्न विपरीत हैं।"},{"en":"Number: Terrestrial=Upright, Aquatic=Inverted. Biomass: Aquatic=Upright, Terrestrial=Inverted.","hi":"संख्या: स्थलीय=सीधा, जलीय=उल्टा। बायोमास: जलीय=सीधा, स्थलीय=उल्टा।"},{"en":"Both are always Upright.","hi":"दोनों हमेशा सीधे (सीधा) रहते हैं।"},{"en":"Both are always Inverted.","hi":"दोनों हमेशा उल्टे रहते हैं।"}],"exp":{"en":"Key fact: Pyramid of Number: Aquatic = Upright, Terrestrial = Inverted. Pyramid of Biomass: Terrestrial = Upright, Aquatic = Inverted — opposite patterns.","hi":"मुख्य तथ्य: संख्या का पिरामिड: जलीय = सीधा, स्थलीय = उल्टा। बायोमास का पिरामिड: स्थलीय = सीधा, जलीय = उल्टा - दोनों के पैटर्न विपरीत हैं।"}}]},{"title":{"en":"8. Rapid-Fire Final Revision","hi":"8। रैपिड-फायर अंतिम संशोधन"},"questions":[{"q":{"en":"Who introduced the term 'Ecology', and when?","hi":"'इकोलॉजी' शब्द किसने और कब दिया?"},"a":{"en":"Ernst Haeckel, 1869 AD.","hi":"अर्न्स्ट हेकेल, 1869 ई.।"},"o":[{"en":"Ernst Haeckel, 1869 AD.","hi":"अर्न्स्ट हेकेल, 1869 ई.।"},{"en":"A.G. Tansley, 1935 AD.","hi":"ए.जी। टैन्सले, 1935 ई।"},{"en":"Charles Elton, 1927 AD.","hi":"चार्ल्स एल्टन, 1927 ई।"},{"en":"G.E. Hutchinson, 1927 AD.","hi":"जी.ई। हचिन्सन, 1927 ई।"}],"exp":{"en":"Key fact: Ernst Haeckel, 1869 AD.","hi":"मुख्य तथ्य: अर्न्स्ट हेकेल, 1869 ई।"}},{"q":{"en":"Who introduced the term 'Ecosystem', and when?","hi":"'इकोसिस्टम' शब्द किसने और कब दिया?"},"a":{"en":"A.G. Tansley, 1935 AD.","hi":"ए। जी। टैन्सले, 1935 ई.।"},"o":[{"en":"A.G. Tansley, 1935 AD.","hi":"ए। जी। टैन्सले, 1935 ई.।"},{"en":"Ernst Haeckel, 1869 AD.","hi":"अर्नस्ट हैकेल, 1869 ई।"},{"en":"Charles Elton, 1927 AD.","hi":"चार्ल्स एल्टन, 1927 ई।"},{"en":"Sunderlal Bahuguna, 1973 AD.","hi":"सुंदरलाल बहुगुणा, 1973 ई।"}],"exp":{"en":"Key fact: A.G. Tansley, 1935 AD.","hi":"मुख्य hain.","hi":"प्राथमिक एवं द्वितीयक खाद्य श्रृंखला।"},{"en":"Terrestrial & Aquatic Food Chain.","hi":"स्थलीय एवं जलीय खाद्य शृंखला।"},{"en":"Linear & Circular Food Chain.","hi":"रैखिक एवं वृत्ताकार खाद्य श्रृंखला।"}],"exp":{"en":"Key fact: Grazing and Decomposer Food Chain.","hi":"मुख्य तथ्य: चराई और अपघटक खाद्य शृंखला।"}},{"q":{"en":"What are examples of biomagnifying substances?","hi":"बायोमैग्निफिकेशन के उदाहरण?"},"a":{"en":"DDT, BHC, Mercury.","hi":"DDT, BHC, पारा।"},"o":[{"en":"DDT, BHC, Mercury.","hi":"DDT, BHC, पारा।"},{"en":"Oxygen, Nitrogen, Carbon.","hi":"ऑक्सीजन, नाइट्रोजन, कार्बन।"},{"en":"Glucose, Sucrose, Fructose.","hi":"ग्लूकोज, सुक्रोज, फ्रुक्टोज।"},{"en":"Calcium, Potassium, Sodium.","hi":"कैल्शियम, पोटेशियम, सोडियम।"}],"exp":{"en":"Key fact: DDT, BHC, Mercury.","hi":"मुख्य तथ्य: DDT, BHC, पारा।"}},{"q":{"en":"Who gave the concept of the Ecological Pyramid, and when?","hi":"पारिस्थितिक पिरामिड अवधारणा किसके द्वारा दी गई?"},"a":{"en":"Charles Elton, 1927 AD.","hi":"चार्ल्स एल्टन, 1927 ई.।"},"o":[{"en":"Charles Elton, 1927 AD.","hi":"चार्ल्स एल्टन, 1927 ई.।"},{"en":"G.E. Hutchinson, 1927 AD.","hi":"जी.ई। हचिन्सन, 1927 ई।"},{"en":"A.G. Tansley, 1935 AD.","hi":"ए.जी। टैन्सले, 1935 ई।"},{"en":"Ernst Haeckel, 1869 AD.","hi":"अर्नस्ट हैकेल, 1869 ई।"}],"exp":{"en":"Key fact: Charles Elton, 1927 AD.","hi":"मुख्य तथ्य: चार्ल्स एल्टन, 1927 ई।"}},{"q":{"en":"What is the shape of the Pyramid of Energy?","hi":"ऊर्जा पिरामिड का आकार?"},"a":{"en":"Always Upright.","hi":"हमेशा सीधा।"},"o":[{"en":"Always Upright.","hi":"हमेशा सीधा।"},{"en":"Always Inverted.","hi":"हमेशा उलटा।"},{"en":"Upright in Terrestrial only.","hi":"केवल स्थलीय में सीधा।"},{"en":"Inverted in Aquatic only.","hi":"केवल जलीय में उलटा।"}],"exp":{"en":"Key fact: Always Upright.","hi":"मुख्य तथ्य: हमेशा सीधा।"}},{"q":{"en":"What are the shapes of the Pyramid of Number in aquatic and terrestrial ecosystems?","hi":"संख्या का पिरामिड - जलीय / स्थलीय?"},"a":{"en":"Upright / Inverted.","hi":"सीधा / उल्टा।"} riation at genetic, species and ecosystem levels; the chapter also covers alpha/beta/gamma diversity, hotspots, conservation methods, IUCN Red List categories, and Ramsar wetlands including India's 101 sites as of August 2026. Biodiversity can be studied both by biological level—genes, species and ecosystems—and by spatial patterns such as alpha, beta and gamma species diversity.","hi":"जैव विविधता - आनुवंशिक, प्रजाति और पारितंत्र स्तर पर विविधता; अध्याय में अल्फा/बीटा/गामा विविधता, हॉटस्पॉट, संरक्षण विधियाँ, IUCN लाल सूची श्रेणियाँ और अगस्त 2026 तक भारत के 101 रामसर स्थल भी शामिल हैं। जैव विविधता को जैविक स्तर-जीन, प्रजाति और पारितंत्र-के साथ स्थानिक प्रतिरूप जैसे अल्फा, बीटा और गामा प्रजातीय विविधता से भी अध्ययन किया जाता है।"}},{"q":{"en":"What are the three commonly recognised levels of biodiversity?","hi":"जैव विविधता के तीन सामान्यतः मान्यता प्राप्त स्तर कौन-से हैं?"},"a":{"en":"Genetic diversity, species diversity and ecosystem diversity.","hi":"आनुवंशिक विविधता, प्रजातीय विविधता और पारितंत्र विविधता।"},"o":[{"en":"Genetic diversity, species diversity and ecosystem diversity.","hi":"आनुवंशिक विविधता, प्रजातीय विविधता और पारितंत्र विविधता।"},{"en":"Alpha diversity, beta diversity and gamma diversity.","hi":"अल्फा विविधता, बीटा विविधता और गामा विविधता।"},{"en":"Floral diversity, faunal diversity and microbial diversity.","hi":"पुष्पीय विविधता, जीव-जंतु संबंधी विविधता और सूक्ष्मजीवी विविधता।"},{"en":"Terrestrial diversity, freshwater diversity and marine diversity.","hi":"स्थलीय विविधता, मीठे जल की विविधता और समुद्री विविधता।"}],"exp":{"en":"Genetic diversity, species diversity and ecosystem diversity. Genetic diversity concerns variation within species, species diversity concerns the variety and abundance of species, and ecosystem diversity concerns the variety of habitats and ecological systems.","hi":"आनुवंशिक विविधता, प्रजातीय विविधता और पारितंत्र विविधता। आनुवंशिक विविधता प्रजाति के भीतर परिवर्तन, प्रजातीय विविधता प्रजाति की विविधता/प्रचुरता और पारितंत्र विविधता आवासों/पारिस्थितिक प्रणालियाँ की विविधता को वर्णन करती है।"}},{"q":{"en":"How many Biodiversity Hotspots does India have?","hi":"भारत में कितने जैव विविधता हॉटस्पॉट (जैव विविधता हॉटस्पॉट) हैं?"},"a":{"en":"4 hotspots.","hi":"4 हॉटस्पॉट।"},"o":[{"en":"4 hotspots.","hi":"4 हॉटस्पॉट।"},{"en":"2 hotspots.","hi":"2 हॉटस्पॉट।"},{"en":"6 hotspots.","hi":"6 हॉटस्पॉट।"},{"en":"8 hotspots.","hi":"8 हॉटस्पॉट।"}],"exp":{"en":"4 hotspots. India overlaps four globally recognised biodiversity hotspots: Himalaya, Indo-Burma, Western Ghats–Sri Lanka and Sundaland through the Nicobar Islands.","hi":"4 हॉटस्पॉट। भारत चार वैश्विक रूप से मान्यता प्राप्त जैव विविधता हॉटस्पॉट के अंतर्गत आता है: हिमालय, इंडो-बर्मा, पश्चिमी घाट-श्रीलंका और निकोबार द्वीप के माध्यम से सुंडालैंड।"}},{"q":{"en":"How many Ramsar Sites does India have as of August 2026?","hi":"अगस्त 2026 तक भारत में कितने रामसर स्थल हैं?"},"a":{"en":"101 Ramsar Sites.","hi":"101 रामसर स्थल।"},"o":[{"en":"101 Ramsar Sites.","hi":"101 रामसर स्थल।"},{"en":"91 Ramsar Sites.","hi":"91 रामसर स्थल।"},{"en":"100 Ramsar Sites.","hi":"100 रामसर स्थल।"},{"en":"99 Ramsar Sites.","hi":"99 रामसर स्थल।"}],"exp":{"en":"101 Ramsar Sites. The total rose from 91 in June 2025 to 100 with Jai Prakash Narayan Bird Sanctuary in June 2026 and to 101 when Glaw Lake became Arunachal Pradesh's first Ramsar Site in August 2026.","hi":"101 रामसर स्थल। कुल जून 2025 के 91 से बढ़कर जून 2026 में जय प्रकाश नारायण पक्षी अभयारण्य के साथ 100 और अगस्त 2026 में ग्लॉ झील के अरुणाचल प्रदेश का पहला रामसर स्थल बनने पर 101 हुआ।"}},{"q":{"en":"When was IUCN established?","hi":"IUCN की स्थापना कब हुई?"},"a":{"en":"In 1948.","hi":"1948 में।"},"o":[{"en":"In 1948.","hi":"1948 में।"},{"en":"In 1971.","hi":"1971 में।"},{"en":"In 1988.","hi":"1988 में।"},{"en":"In 1950.","hi":"1950 में।"}],"exp":{"en":"In 1948. IUCN was formally established on 5 October 1948 at Fontainebleau, France, as an international union bringing governments and civil society together for nature conservation.","hi":"1948 में। IUCN 5 अक्टूबर 1948 को फॉन्टेनब्लो, फ्रांस में औपचारिक रूप से स्थापित हुआ, सरकारों और नागरिक समाज को प्रकृति संरक्षण के लिए साथ लाने वाली अंतरराष्ट्रीय संघ के रूप में।"}},{"q":{"en":"How does biodiversity change from the equator towards the poles?","hi":"भूमध्य रेखा से ध्रुवों की ओर जैव विविधता कैसे बदलती है?"},"a":{"en":"Species richness generally decreases from the equator toward the poles; tropical regions, especially tropical rainforests on land and coral reefs in the sea, are exceptionally species-rich.","hi":"प्रजाति समृद्धि सामान्यतः भूमध्य रेखा से ध्रुवों की ओर घटती है; उष्णकटिबंधीय क्षेत्रों, विशेष रूप से भूमि पर उष्णकटिबंधीय वर्षावन और समुद्र में प्रवाल भित्तियाँ, असाधारण रूप से प्रजाति-समृद्ध होते हैं।"},"o":[{"en":"Species richness generally decreases from the equator toward the poles; tropical regions, especially tropical rainforests on land and coral reefs in the sea, are exceptionally species-rich.","hi":"प्रजाति समृद्धि सामान्यतः भूमध्य रेखा से ध्रुवों की ओर घटती है; उष्णकटिबंधीय क्षेत्रों, विशेष रूप से भूमि पर उष्णकटिबंधीय वर्षावन और समुद्र में प्रवाल भित्तियाँ, असाधारण रूप से प्रजाति-समृद्ध होते हैं।"},{"en":"It increases.","hi":"यह बढ़ती है।"},{"en":"It remains exactly the same.","hi":"यह बिल्कुल एक जैसी रहती है।"},{"en":"It fluctuates unpredictably.","hi":"इसमें अप्रत्याशित रूप से उतार-चढ़ाव होता है।"}],"exp":{"en":"Species richness generally decreases from the equator toward the poles; tropical regions, especially tropical rainforests on land and coral reefs in the sea, are exceptionally species-rich. This latitudinal diversity gradient is one of ecology's best-known broad patterns: species richness is generally greater in tropical regions and declines toward higher latitudes.","hi":"प्रजाति समृद्धि सामान्यतः भूमध्य रेखा से ध्रुवों की ओर घटती है; उष्णकटिबंधीय क्षेत्रों, विशेष रूप से भूमि पर उष्णकटिबंधीय वर्षावन और समुद्र में प्रवाल भित्तियाँ, असाधारण रूप से प्रजाति-समृद्ध होते हैं। यह अक्षांशीय विविधता प्रवणता पारिस्थितिकी का सुविदित व्यापक प्रतिरूप है: प्रजाति समृद्धि सामान्यतः उष्णकटिबंधीय क्षेत्रों में अधिक और उच्चतर अक्षांशों की ओर कम होती है।"}}]},{"title":{"en":"2. Levels of Biodiversity","hi":"2। जैव विविधता के स्तर"},"questions":[{"q":{"en":"What is Genetic Diversity?","hi":"आनुवंशिक विविधता क्या है?"},"a":{"en":"Variation in genes, alleles and other genetic characteristics within a species and among its populations.","hi":"एक प्रजाति के भीतर और उसकी जनसंख्या के बीच जीन, युग्मविकल्पी जीन तथा अन्य आनुवंशिक विशेषताएँ में परिवर्तन।"},"o":[{"en":"Variation in genes, alleles and other genetic characteristics within a species and among its populations.","hi":"एक प्रजाति के भीतर और उसकी जनसंख्या के बीच जीन, युग्मविकल्पी जीन तथा अन्य आनुवंशिक विशेषताएँ में परिवर्तन।"},{"en":"The number and relative abundance of different species in an area.","hi":"किसी क्षेत्रफल में अलग प्रजाति की संख्या और सापेक्ष प्रचुरता।"},{"en":"The variety of ecosystems, habitats and ecological processes in a region.","hi":"किसी क्षेत्र में पारितंत्र, आवासों और पारिस्थितिक प्रक्रियाओं की विविधता।"},{"en":"Species turnover between two local communities.","hi":"दो स्थानीय समुदाय के बीच प्रजाति परिवर्तन-दर।"}],"exp":{"en":"Variation in genes, alleles and other genetic characteristics within a species and among its populations. Examples include different crop varieties, breeds or genetically distinct populations of the same species. It is not the same concept as alpha diversity.","hi":"एक प्रजाति के भीतर और उसकी जनसंख्या के बीच जीन, युग्मविकल्पी जीन तथा अन्य आनुवंशिक विशेषताएँ में परिवर्तन। उदाहरण में अलग फसल किस्मों, नस्लों या समान प्रजाति की आनुवंशिक रूप से अलग जनसंख्या शामिल हैं। यह अल्फा विविधता के समान अवधारणा नहीं है।"}},{"q":{"en":"What is Species Diversity?","hi":"प्रजातीय विविधता क्या है?"},"a":{"en":"The variety of species in an area, commonly described using species richness together with their relative abundance or evenness.","hi":"किसी क्षेत्रफल में प्रजाति की विविधता, जिसे सामान्यतः प्रजाति समृद्धि और उनकी सापेक्ष प्रचुरता/सम-वितरण के साथ वर्णन किया जाता है।"},"o":[{"en":"The variety of species in an area, commonly described using species richness together with their relative abundance or evenness.","hi":"किसी क्षेत्रफल में प्रजाति की विविधता, जिसे सामान्यतः प्रजाति समृद्धि और उनकी सापेक्ष प्रचुरता/सम-वितरण के साथ वर्णन किया जाता है।"},{"en":"Variation in genes and alleles within one species only.","hi":"एक प्रजाति के भीतर जीन और युग्मविकल्पी जीन में परिवर्तन।"},{"en":"The total number of habitat types on Earth, regardless of species.","hi":"प्रजाति को अनदेखा करके पृथ्वी पर आवास प्रकारों की कुल संख्या।"},{"en":"The rate at which species migrate between two countries.","hi":"दो देश के बीच प्रजाति प्रवासन की दर।"}],"exp":{"en":"The variety of species in an area, commonly described using species richness together with their relative abundance or evenness. Species richness tells how many species occur, while evenness describes how evenly individuals are distributed among those species; both contribute to species diversity.","hi":"किसी क्षेत्रफल में प्रजाति की विविधता, जिसे सामान्यतः प्रजाति समृद्धि और उनकी सापेक्ष प्रचुरता/सम-वितरण के साथ वर्णन किया जाता है। प्रजाति समृद्धि बताती है कितनी प्रजाति हैं, जबकि सम-वितरण बताती है व्यक्तियों प्रजाति के बीच कितने समान रूप से वितरित हैं; दोनों प्रजातीय विविधता में योगदान करते हैं।"}},{"q":{"en":"What is Ecosystem Diversity, and how do alpha, beta and gamma diversity differ from the three biodiversity levels?","hi":"पारितंत्र विविधता क्या है, और अल्फा, बीटा तथा गामा विविधता जैव विविधता के तीन स्तर से कैसे अलग हैं?"},"a":{"en":"Ecosystem diversity is the variety of ecosystems, habitats, communities and ecological processes; alpha, beta and gamma are spatial scales/components of species diversity introduced in Whittaker's framework.","hi":"पारितंत्र विविधता पारितंत्र, आवासों, समुदाय और पारिस्थितिक प्रक्रियाओं की विविधता है; अल्फा, बीटा और गामा व्हिटेकर ढाँचा में प्रजातीय विविधता के स्थानिक पैमाने/घटक हैं।"},"o":[{"en":"Ecosystem diversity is the variety of ecosystems, habitats, communities and ecological processes; alpha, beta and gamma are spatial scales/components of species diversity introduced in Whittaker's framework.","hi":"पारितंत्र विविधता पारितंत्र, आवासों, समुदाय और पारिस्थितिक प्रक्रियाओं की विविधता है; अल्फा, बीटा और गामा व्हिटेकर ढाँचा में प्रजातीय विविधता के स्थानिक पैमाने/घटक हैं।"},{"en":"Ecosystem diversity is the same as alpha diversity, and both mean genetic variation.","hi":"पारितंत्र विविधता अल्फा विविधता के समान है और दोनों आनुवंशिक परिवर्तन औसत करते हैं।"},{"en":"Ecosystem diversity means only the number of animal species in a forest.","hi":"पारितंत्र विविधता केवल वन में पशु प्रजाति की संख्या है।"},{"en":"Alpha, beta and gamma are the three genetic levels of biodiversity.","hi":"अल्फा, बीटा और गामा जैव विविधता के तीन आनुवंशिक स्तर हैं।"}],"exp":{"en":"Ecosystem diversity is the variety of ecosystems, habitats, communities and ecological processes; alpha, beta and gamma are spatial scales/components of species diversity introduced in Whittaker's framework. Genetic, species and ecosystem diversity are biological levels. Whittaker's alpha, beta and gamma terms instead partition species diversity across local, between-community and regional scales.","hi":"पारितंत्र विविधता पारितंत्र, आवासों, समुदाय और पारिस्थितिक प्रक्रियाओं की विविधता है; अल्फा, बीटा और गामा व्हिटेकर ढाँचा में प्रजातीय विविधता के स्थानिक पैमाने/घटक हैं। आनुवंशिक, प्रजाति और पारितंत्र विविधता जैविक स्तर हैं। व्हिटेकर के अल्फा, बीटा और गामा शब्दों प्रजातीय विविधता को स्थानीय, के बीच-समुदाय और क्षेत्रीय पैमाने पर विभाजित करते हैं।"}},{"q":{"en":"Where is the highest biodiversity found?","hi":"सर्वाधिक जैव विविधता कहाँ पाई जाती है?"},"a":{"en":"Biodiversity is generally highest in the tropics; tropical rainforests are exceptionally diverse terrestrial ecosystems and coral reefs are exceptionally diverse marine ecosystems.","hi":"जैव विविधता सामान्यतः उष्णकटिबंधीय क्षेत्र में सर्वाधिक होती है; उष्णकटिबंधीय वर्षावन असाधारण रूप से विविध स्थलीय पारितंत्र और प्रवाल भित्तियाँ असाधारण रूप से विविध समुद्री पारितंत्र हैं।"},"o":[{"en":"Biodiversity is generally highest in the tropics; tropical rainforests are exceptionally diverse terrestrial ecosystems and coral reefs are exceptionally diverse marine ecosystems.","hi":"जैव विविधता सामान्यतः उष्णकटिबंधीय क्षेत्र में सर्वाधिक होती है; उष्णकटिबंधीय वर्षावन असाधारण रूप से विविध स्थलीय पारितंत्र और प्रवाल भित्तियाँ असाधारण रूप से विविध समुद्री पारितंत्र हैं।"},{"en":"In Tundra, Taiga, and Polar Ice Caps.","hi":"टुंड्रा, टैगा और ध्रुवीय बर्फ की टोपियों में।"},{"en":"In Temperate Grasslands and Deep Deserts.","hi":"समशीतोष्ण घास के मैदानों और गहरे रेगिस्तानों में।"},{"en":"In Urban Environments and Monoculture Farms.","hi":"शहरी वातावरण और मोनोकल्चर खेतों में।"}],"exp":{"en":"Biodiversity is generally highest in the tropics; tropical rainforests are exceptionally diverse terrestrial ecosystems and coral reefs are exceptionally diverse marine ecosystems. Warm, productive and relatively stable tropical environments support very high species richness; marine coral reefs similarly support dense and diverse biological communities.","hi":"जैव विविधता सामान्यतः उष्णकटिबंधीय क्षेत्र में सर्वाधिक होती है; उष्णकटिबंधीय वर्षावन असाधारण रूप से विविध स्थलीय पारितंत्र और प्रवाल भित्तियाँ असाधारण रूप से विविध समुद्री पारितंत्र हैं। गर्म, उत्पादक और तुलनात्मक रूप से स्थिर उष्णकटिबंधीय पर्यावरणों अत्यधिक उच्च प्रजाति समृद्धि समर्थन करते हैं; समुद्री प्रवाल भित्तियाँ भी घने और विविध जैविक समुदाय समर्थन करते हैं।"}},{"q":{"en":"Which is the world's largest coral reef system?","hi":"विश्व का सबसे बड़ा प्रवाल भित्ति प्रणाली कौन-सा है?"},"a":{"en":"The Great Barrier Reef, off northeastern Australia; coral reefs in general are often called the 'rainforests of the sea' because of their high biodiversity.","hi":"पूर्वोत्तर ऑस्ट्रेलिया के पास ग्रेट बैरियर रीफ; प्रवाल भित्तियों को सामान्यतः उच्च जैव विविधता के कारण 'समुद्र के वर्षावन' कहा जाता है।"},"o":[{"en":"The Great Barrier Reef, off northeastern Australia; coral reefs in general are often called the 'rainforests of the sea' because of their high biodiversity.","hi":"पूर्वोत्तर ऑस्ट्रेलिया के पास ग्रेट बैरियर रीफ; प्रवाल भित्तियों को सामान्यतः उच्च जैव विविधता के कारण 'समुद्र के वर्षावन' कहा जाता है।"},{"en":"Belize Barrier Reef, the world's largest reef system.","hi":"बेलीज बैरियर प्रवाल भित्ति, विश्व का सबसे बड़ा प्रवाल भित्ति प्रणाली।"},{"en":"Florida Reef, the world's largest reef system.","hi":"फ्लोरिडा प्रवाल भित्ति, विश्व का सबसे बड़ा प्रवाल भित्ति प्रणाली।"},{"en":"Andaman reefs, the world's largest reef system.","hi":"अंडमान प्रवाल भित्तियाँ, विश्व का सबसे बड़ा प्रवाल भित्ति प्रणाली।"}],"exp":{"en":"The Great Barrier Reef, off northeastern Australia; coral reefs in general are often called the 'rainforests of the sea' because of their high biodiversity. The Great Barrier Reef is a vast reef system rather than a single coral structure, and the phrase 'rainforests of the sea' applies broadly to coral reefs because of their exceptional biodiversity.","hi":"पूर्वोत्तर ऑस्ट्रेलिया के पास ग्रेट बैरियर रीफ; प्रवाल भित्तियों को सामान्यतः उच्च जैव विविधता के कारण 'समुद्र के वर्षावन' कहा जाता है। ग्रेट बैरियर रीफ एक विशाल प्रवाल भित्ति प्रणाली है, एकमात्र प्रवाल संरचना नहीं; 'समुद्र के वर्षावन' वाक्यांश व्यापक रूप से प्रवाल भित्तियों के लिए उपयोग होती है क्योंकि उनकी जैव विविधता असाधारण रूप से उच्च है।"}}]},{"title":{"en":"3. Biodiversity Hotspots & Conservation Methods","hi":"3। जैव विविधता हॉटस्पॉट और संरक्षण के तरीके"},"questions":[{"q":{"en":"What are the formal criteria for a global Biodiversity Hotspot?","hi":"वैश्विक जैव विविधता हॉटस्पॉट के औपचारिक मानदंड क्या हैं?"},"a":{"en":"At least 1,500 endemic vascular plant species and 30% or less of the original natural vegetation remaining.","hi":"कम-से-कम 1,500 स्थानिक संवहनी पादप प्रजातियाँ और मूल प्राकृतिक वनस्पति का 30% या उससे कम शेष।"},"o":[{"en":"At least 1,500 endemic vascular plant species and 30% or less of the original natural vegetation remaining.","hi":"कम-से-कम 1,500 स्थानिक संवहनी पादप प्रजातियाँ और मूल प्राकृतिक वनस्पति का 30% या उससे कम शेष।"},{"en":"At least 500 endemic mammals and more than 90% original vegetation remaining.","hi":"कम-से-कम 500 स्थानिक स्तनधारी और 90% से अधिक मूल वनस्पति शेष।"},{"en":"Any area with high rainfall and no human settlement.","hi":"कोई भी क्षेत्रफल जहाँ उच्च वर्षा और शून्य मानवीय बस्ती हो।"},{"en":"Any national park containing at least 100 bird species.","hi":"कोई भी राष्ट्रीय उद्यान जिसमें कम-से-कम 100 पक्षी प्रजाति हों।"}],"exp":{"en":"At least 1,500 endemic vascular plant species and 30% or less of the original natural vegetation remaining. The two criteria combine irreplaceability (high plant endemism) with severe habitat loss; globally, 36 regions meet the hotspot definition.","hi":"कम-से-कम 1,500 स्थानिक संवहनी पादप प्रजातियाँ और मूल प्राकृतिक वनस्पति का 30% या उससे कम शेष। दो मानदंड अपूरणीयता यानी उच्च पादप स्थानिकता और गंभीर आवास हानि को संयोजित करते हैं; वैश्विक रूप से 36 क्षेत्र हॉटस्पॉट परिभाषा पूरा करते हैं।"}},{"q":{"en":"Who gave the concept of Biodiversity Hotspot?","hi":"जैव विविधता हॉटस्पॉट (जैव विविधता हॉटस्पॉट) की अवधारणा किसने दी?"},"a":{"en":"Norman Myers (1988 AD).","hi":"नॉर्मन मायर्स (1988 ई.)।"},"o":[{"en":"Norman Myers (1988 AD).","hi":"नॉर्मन मायर्स (1988 ई.)।"},{"en":"Charles Elton (1927 AD).","hi":"चार्ल्स एल्टन (1927 ई.)।"},{"en":"Ernst Haeckel (1869 AD).","hi":"अर्नस्ट हैकेल (1869 ई.)।"},{"en":"G.E. Hutchinson (1927 AD).","hi":"जी.ई। हचिन्सन (1927 ई.)।"}],"exp":{"en":"Norman Myers (1988 AD). Norman Myers introduced the hotspot concept in 1988 to identify highly endemic regions facing exceptional habitat loss and therefore needing urgent conservation priority.","hi":"नॉर्मन मायर्स (1988 ई.)। नॉर्मन मायर्स ने 1988 में हॉटस्पॉट अवधारणा प्रस्तुत किया ताकि अत्यधिक स्थानिक और असाधारण आवास हानि सामना करने वाले क्षेत्रों को तात्कालिक संरक्षण प्राथमिकता दी जा सके।"}},{"q":{"en":"Which four global biodiversity hotspots are represented in India?","hi":"भारत में कौन-से चार वैश्विक जैव विविधता हॉटस्पॉट प्रतिनिधित्वित हैं?"},"a":{"en":"Himalaya, Indo-Burma, Western Ghats–Sri Lanka, and Sundaland (represented in India by the Nicobar Islands).","hi":"हिमालय, इंडो-बर्मा, पश्चिमी घाट-श्रीलंका और सुंडालैंड (भारत में निकोबार द्वीप द्वारा प्रतिनिधित्वित)।"},"o":[{"en":"Himalaya, Indo-Burma, Western Ghats–Sri Lanka, and Sundaland (represented in India by the Nicobar Islands).","hi":"हिमालय, इंडो-बर्मा, पश्चिमी घाट-श्रीलंका और सुंडालैंड (भारत में निकोबार द्वीप द्वारा प्रतिनिधित्वित)।"},{"en":"Thar Desert, Gangetic Plain, Deccan Plateau and Lakshadweep.","hi":"थार मरुस्थल, गंगा का मैदान, दक्कन का पठार और लक्षद्वीप।"},{"en":"Eastern Ghats, Central India, Rann of Kutch and Andaman Sea.","hi":"पूर्वी घाट, केंद्रीय भारत, कच्छ का रण और अंडमान समुद्र।"},{"en":"Kashmir Valley, Malwa Plateau, Coromandel Coast and Chota Nagpur Plateau.","hi":"कश्मीर घाटी, मालवा पठार, कोरोमंडल तट और छोटा नागपुर पठार।"}],"exp":{"en":"Himalaya, Indo-Burma, Western Ghats–Sri Lanka, and Sundaland (represented in India by the Nicobar Islands). These are global hotspot regions that partly overlap Indian territory; they are not four wholly India-exclusive hotspots.","hi":"हिमालय, इंडो-बर्मा, पश्चिमी घाट-श्रीलंका और सुंडालैंड (भारत में निकोबार द्वीप द्वारा प्रतिनिधित्वित)। ये वैश्विक हॉटस्पॉट क्षेत्र हैं जो आंशिक रूप से भारतीय भूभाग के अंतर्गत आते हैं; ये चार पूर्णतः भारत-विशिष्ट हॉटस्पॉट नहीं हैं।"}},{"q":{"en":"What is In-situ Conservation and what are its examples?","hi":"स्वस्थाने संरक्षण (स्व-स्थाने संरक्षण (स्व-स्थाने)) क्या है और इसके उदाहरण क्या हैं?"},"a":{"en":"Conservation of species in their natural habitats — for example national parks, wildlife sanctuaries, biosphere reserves and sacred groves.","hi":"प्रजाति का उनके प्राकृतिक आवासों में संरक्षण - जैसे राष्ट्रीय उद्यान, वन्यजीव अभयारण्य, जैवमंडल आरक्षित क्षेत्र और पवित्र उपवन।"},"o":[{"en":"Conservation of species in their natural habitats — for example national parks, wildlife sanctuaries, biosphere reserves and sacred groves.","hi":"प्रजाति का उनके प्राकृतिक आवासों में संरक्षण - जैसे राष्ट्रीय उद्यान, वन्यजीव अभयारण्य, जैवमंडल आरक्षित क्षेत्र और पवित्र उपवन।"},{"en":"Conservation 'outside the natural habitat' — Zoos, DNA Banks, Seed Banks.","hi":"'प्राकृतिक आवास के बाहर' संरक्षण - चिड़ियाघर, डीएनए बैंक, बीज बैंक।"},{"en":"Conservation only in laboratories — test tubes, incubators.","hi":"केवल प्रयोगशालाओं में संरक्षण - टेस्ट ट्यूब, इनक्यूबेटर।"},{"en":"Conservation strictly in urban environments — city parks, rooftop gardens.","hi":"शहरी वातावरण में सख्ती से संरक्षण - सिटी पार्क, छत के बगीचे।"}],"exp":{"en":"Conservation of species in their natural habitats — for example national parks, wildlife sanctuaries, biosphere reserves and sacred groves. In-situ conservation protects species together with their habitats, interactions and evolutionary processes, making protected natural landscapes especially important.","hi":"प्रजाति का उनके प्राकृतिक आवासों में संरक्षण - जैसे राष्ट्रीय उद्यान, वन्यजीव अभयारण्य, जैवमंडल आरक्षित क्षेत्र और पवित्र उपवन। स्व-स्थाने संरक्षण (स्व-स्थाने) प्रजाति को उनके आवासों, अंतःक्रियाएँ और विकासवादी प्रक्रियाएँ के साथ संरक्षित करता है; इसलिए संरक्षित प्राकृतिक परिदृश्यों विशेष रूप से महत्वपूर्ण हैं।"}},{"q":{"en":"What is Ex-situ Conservation and what are its examples?","hi":"बाह्य-स्थाने संरक्षण (बाह्य-स्थाने संरक्षण (बाह्य-स्थाने)) क्या है और इसके उदाहरण क्या हैं?"},"a":{"en":"Conservation outside the natural habitat — for example zoos, botanical gardens, seed/gene banks, cryopreservation and captive-breeding programmes.","hi":"प्राकृतिक आवास के बाहर संरक्षण - जैसे चिड़ियाघरों, वनस्पति उद्यानों, बीज/जीन बैंक, अतिशीत संरक्षण और बंदी-प्रजनन कार्यक्रम।"},"o":[{"en":"Conservation outside the natural habitat — for example zoos, botanical gardens, seed/gene banks, cryopreservation and captive-breeding programmes.","hi":"प्राकृतिक आवास के बाहर संरक्षण - जैसे चिड़ियाघरों, वनस्पति उद्यानों, बीज/जीन बैंक, अतिशीत संरक्षण और बंदी-प्रजनन कार्यक्रम।"},{"en":"Conservation 'inside the natural habitat' — National Parks, Wildlife Sanctuaries.","hi":"'प्राकृतिक आवास के अंदर' संरक्षण - राष्ट्रीय उद्यान, वन्यजीव अभयारण्य।"},{"en":"Conservation using only traditional, indigenous methods.","hi":"केवल पारंपरिक, स्वदेशी तरीकों का उपयोग कर संरक्षण।"},{"en":"Conservation solely through government legislation.","hi":"पूरी तरह से सरकारी कानून के माध्यम से संरक्षण।"}],"exp":{"en":"Conservation outside the natural habitat — for example zoos, botanical gardens, seed/gene banks, cryopreservation and captive-breeding programmes. Ex-situ methods are useful when wild populations are very small or habitats are unsafe, and they can support later reinforcement or reintroduction where appropriate.","hi":"प्राकृतिक आवास के बाहर संरक्षण - जैसे चिड़ियाघरों, वनस्पति उद्यानों, बीज/जीन बैंक, अतिशीत संरक्षण और बंदी-प्रजनन कार्यक्रम। बाह्य-स्थाने विधियाँ तब उपयोगी हैं जब वन्य जनसंख्या बहुत छोटा हों या आवासों असुरक्षित हों; उपयुक्त मामलों में ये बाद में संवर्धन या पुनर्स्थापन समर्थन कर सकते हैं।"}}]},{"title":{"en":"4. IUCN & Red List","hi":"4। आईयूसीएन (IUCN) और लाल सूची (लाल सूची)"},"questions":[{"q":{"en":"What is the full form of IUCN?","hi":"आईयूसीएन (IUCN) का पूर्ण रूप क्या है?"},"a":{"en":"International Union for Conservation of Nature.","hi":"प्रकृति के संरक्षण के लिए अंतर्राष्ट्रीय संघ (अंतरराष्ट्रीय प्रकृति संरक्षण संघ)।"},"o":[{"en":"International Union for Conservation of Nature.","hi":"प्रकृति के संरक्षण के लिए अंतर्राष्ट्रीय संघ (अंतरराष्ट्रीय प्रकृति संरक्षण संघ)।"},{"en":"Indian Union for Conservation of Nature.","hi":"प्रकृति के संरक्षण के लिए भारतीय संघ।"},{"en":"International Unit for Climate and Nature.","hi":"जलवायु और प्रकृति के लिए अंतर्राष्ट्रीय इकाई।"},{"en":"Intergovernmental Union for Carbon Neutrality.","hi":"कार्बन तटस्थता (तटस्थता) के लिए अंतरसरकारी संघ।"}],"exp":{"en":"International Union for Conservation of Nature. The organisation's current short name is IUCN; historically its formal name has changed, but it is now the International Union for Conservation of Nature.","hi":"प्रकृति के संरक्षण के लिए अंतर्राष्ट्रीय संघ (अंतरराष्ट्रीय प्रकृति संरक्षण संघ)। संगठन का वर्तमान संक्षिप्त नाम IUCN है; ऐतिहासिक रूप से औपचारिक नाम परिवर्तन हुआ, लेकिन आज अंतरराष्ट्रीय प्रकृति संरक्षण संघ है।"}},{"q":{"en":"When and where was IUCN established, and where is its headquarters today?","hi":"IUCN कब और कहाँ स्थापित हुआ, और आज इसका मुख्यालय कहाँ है?"},"a":{"en":"Established on 5 October 1948 at Fontainebleau, France; headquarters today is in Gland, Switzerland.","hi":"5 अक्टूबर 1948 को फॉन्टेनब्लो, फ्रांस में स्थापित; वर्तमान में मुख्यालय ग्लैंड, स्विट्जरलैंड में है।"},"o":[{"en":"Established on 5 October 1948 at Fontainebleau, France; headquarters today is in Gland, Switzerland.","hi":"5 अक्टूबर 1948 को फॉन्टेनब्लो, फ्रांस में स्थापित; वर्तमान में मुख्यालय ग्लैंड, स्विट्जरलैंड में है।"},{"en":"Established in 1971; HQ is in Amsterdam, Netherlands.","hi":"1971 में स्थापित; मुख्यालय एम्स्टर्डम, नीदरलैंड में है।"},{"en":"Established in 1950; HQ is in Geneva, Switzerland.","hi":"1950 में स्थापित; मुख्यालय जिनेवा, स्विट्जरलैंड में है।"},{"en":"Established in 1972; HQ is in Nairobi, Kenya.","hi":"1972 में स्थापित; मुख्यालय नैरोबी, केन्या में है।"}],"exp":{"en":"Established on 5 October 1948 at Fontainebleau, France; headquarters today is in Gland, Switzerland. The founding place and present headquarters are different: IUCN was created at Fontainebleau in France, while its headquarters is now in Gland, Switzerland.","hi":"5 अक्टूबर 1948 को फॉन्टेनब्लो, फ्रांस में स्थापित; वर्तमान में मुख्यालय ग्लैंड, स्विट्जरलैंड में है। स्थापना स्थान और वर्तमान मुख्यालय अलग हैं: IUCN फॉन्टेनब्लो, फ्रांस में स्थापित हुआ, जबकि मुख्यालय आज ग्लैंड, स्विट्जरलैंड में है।"}},{"q":{"en":"What is the objective of IUCN?","hi":"IUCN का उद्देश्य क्या है?"},"a":{"en":"To conserve nature and biodiversity and promote the sustainable and equitable use of natural resources through science, policy and conservation action.","hi":"प्रकृति और जैव विविधता संरक्षित करना तथा विज्ञान, नीति और संरक्षण कार्रवाई के माध्यम से प्राकृतिक संसाधनों के सतत और न्यायसंगत उपयोग को बढ़ावा करना।"},"o":[{"en":"To conserve nature and biodiversity and promote the sustainable and equitable use of natural resources through science, policy and conservation action.","hi":"प्रकृति और जैव विविधता संरक्षित करना तथा विज्ञान, नीति और संरक्षण कार्रवाई के माध्यम से प्राकृतिक संसाधनों के सतत और न्यायसंगत उपयोग को बढ़ावा करना।"},{"en":"Promoting industrial growth in developing nations.","hi":"विकासशील देशों में औद्योगिक विकास को बढ़ावा देना।"},{"en":"Regulating global weather and climate patterns.","hi":"वैश्विक मौसम और जलवायु पैटर्न को विनियमित करना।"},{"en":"Funding urban infrastructure projects.","hi":"शहरी बुनियादी ढांचा परियोजनाओं का वित्तपोषण।"}],"exp":{"en":"To conserve nature and biodiversity and promote the sustainable and equitable use of natural resources through science, policy and conservation action. IUCN works beyond rare-species protection; it develops science and standards, assesses extinction risk, supports conservation policy and promotes sustainable use of nature.","hi":"प्रकृति और जैव विविधता संरक्षित करना तथा विज्ञान, नीति और संरक्षण कार्रवाई के माध्यम से प्राकृतिक संसाधनों के सतत और न्यायसंगत उपयोग को बढ़ावा करना। IUCN दुर्लभ-प्रजाति संरक्षण से व्यापक कार्य करता है; विज्ञान/मानक विकसित करता है, विलुप्ति जोखिम आकलन करता है, संरक्षण नीति समर्थन करता है और प्रकृति के सतत उपयोग को बढ़ावा करता है।"}},{"q":{"en":"What is significant about the 1978 IUCN publication on plants?","hi":"पौधे पर 1978 IUCN प्रकाशन की क्या महत्व है?"},"a":{"en":"The IUCN Plant Red Data Book was published in 1978; this is a historical plant-focused publication, while the IUCN Red List system itself began in 1964.","hi":"IUCN पादप रेड डाटा बुक 1978 में प्रकाशित हुई; यह ऐतिहासिक पादप-केंद्रित प्रकाशन है, जबकि IUCN लाल सूची प्रणाली स्वयं 1964 में शुरू हुआ।"},"o":[{"en":"The IUCN Plant Red Data Book was published in 1978; this is a historical plant-focused publication, while the IUCN Red List system itself began in 1964.","hi":"IUCN पादप रेड डाटा बुक 1978 में प्रकाशित हुई; यह ऐतिहासिक पादप-केंद्रित प्रकाशन है, जबकि IUCN लाल सूची प्रणाली स्वयं 1964 में शुरू हुआ।"},{"en":"The entire IUCN Red List system first began in 1978.","hi":"संपूर्ण IUCN लाल सूची प्रणाली पहला 1978 में शुरू हुआ।"},{"en":"IUCN itself was founded in 1978.","hi":"IUCN स्वयं 1978 में स्थापित हुआ।"},{"en":"The first Ramsar list of plants was issued in 1978.","hi":"पहला रामसर सूची का पौधे 1978 में जारी हुई।"}],"exp":{"en":"The IUCN Plant Red Data Book was published in 1978; this is a historical plant-focused publication, while the IUCN Red List system itself began in 1964. The 1978 book should be remembered as a historical plant Red Data Book. The broader IUCN Red List of Threatened Species traces its origin to 1964.","hi":"IUCN पादप रेड डाटा बुक 1978 में प्रकाशित हुई; यह ऐतिहासिक पादप-केंद्रित प्रकाशन है, जबकि IUCN लाल सूची प्रणाली स्वयं 1964 में शुरू हुआ। 1978 पुस्तक को ऐतिहासिक पादप रेड डाटा बुक के रूप में याद करना चाहिए। व्यापक IUCN लाल सूची का संकटग्रस्त प्रजातियों की सूची का आरंभ 1964 से है।"}},{"q":{"en":"What is significant about the 1988 IUCN publication on animals?","hi":"पशु पर 1988 IUCN प्रकाशन की क्या महत्व है?"},"a":{"en":"The 1988 IUCN Red List of Threatened Animals was a major historical animal-focused publication; it was not the beginning of the Red List system.","hi":"1988 की IUCN संकटग्रस्त पशुओं की लाल सूची एक प्रमुख ऐतिहासिक पशु-केंद्रित प्रकाशन थी; यह लाल सूची प्रणाली की शुरुआत नहीं थी।"},"o":[{"en":"The 1988 IUCN Red List of Threatened Animals was a major historical animal-focused publication; it was not the beginning of the Red List system.","hi":"1988 की IUCN संकटग्रस्त पशुओं की लाल सूची एक प्रमुख ऐतिहासिक पशु-केंद्रित प्रकाशन थी; यह लाल सूची प्रणाली की शुरुआत नहीं थी।"},{"en":"The IUCN Red List system first began only in 1988.","hi":"IUCN लाल सूची प्रणाली केवल 1988 में पहला शुरू हुआ।"},{"en":"IUCN was established in 1988 to classify animals.","hi":"IUCN पशु वर्गीकृत करने के लिए 1988 में स्थापित हुआ।"},{"en":"The Ramsar Convention first classified threatened animals in 1988.","hi":"रामसर अभिसमय ने संकटग्रस्त पशु को पहला 1988 में वर्गीकृत किया।"}],"exp":{"en":"The 1988 IUCN Red List of Threatened Animals was a major historical animal-focused publication; it was not the beginning of the Red List system. The 1988 volume is a specific historical publication in a much older IUCN threat-assessment programme, not a separate 1988 launch of animal conservation.","hi":"1988 की IUCN संकटग्रस्त पशुओं की लाल सूची एक प्रमुख ऐतिहासिक पशु-केंद्रित प्रकाशन थी; यह लाल सूची प्रणाली की शुरुआत नहीं थी। 1988 का खंड IUCN के पुराने संकट-आकलन कार्यक्रम का विशिष्ट ऐतिहासिक प्रकाशन है, पशु संरक्षण की अलग 1988 शुरुआत नहीं।"}},{"q":{"en":"What is the IUCN Red List category sequence from highest extinction risk downward among evaluated categories?","hi":"मूल्यांकित श्रेणियाँ में सर्वाधिक विलुप्ति जोखिम से नीचे की ओर IUCN लाल सूची क्रम क्या है?"},"a":{"en":"Extinct (EX) → Extinct in the Wild (EW) → Critically Endangered (CR) → Endangered (EN) → Vulnerable (VU) → Near Threatened (NT) → Least Concern (LC); Data Deficient (DD) and Not Evaluated (NE) are not ordered risk levels.","hi":"विलुप्त (EX) → विलुप्त में वन्य (EW) → गंभीर रूप से संकटग्रस्त (CR) → संकटग्रस्त (EN) → सुभेद्य (VU) → के निकट संकटग्रस्त (NT) → न्यूनतम चिंता (LC); आँकड़े अपूर्ण (DD) और नहीं मूल्यांकित (NE) क्रमबद्ध जोखिम स्तर नहीं हैं।"},"o":[{"en":"Extinct (EX) → Extinct in the Wild (EW) → Critically Endangered (CR) → Endangered (EN) → Vulnerable (VU) → Near Threatened (NT) → Least Concern (LC); Data Deficient (DD) and Not Evaluated (NE) are not ordered risk levels.","hi":"विलुप्त (EX) → विलुप्त में वन्य (EW) → गंभीर रूप से संकटग्रस्त (CR) → संकटग्रस्त (EN) → सुभेद्य (VU) → के निकट संकटग्रस्त (NT) → न्यूनतम चिंता (LC); आँकड़े अपूर्ण (DD) और नहीं मूल्यांकित (NE) क्रमबद्ध जोखिम स्तर नहीं हैं।"},{"en":"Critically Endangered → Endangered → Vulnerable → Extinct → Least Concern.","hi":"गंभीर रूप से संकटग्रस्त → संकटग्रस्त → सुभेद्य → विलुप्त → न्यूनतम चिंता।"},{"en":"Near Threatened → Vulnerable → Endangered → Critically Endangered → Extinct.","hi":"के निकट संकटग्रस्त → सुभेद्य → संकटग्रस्त → गंभीर रूप से संकटग्रस्त → विलुप्त।"},{"en":"Extinct → Vulnerable → Near Threatened → Endangered → Critically Endangered.","hi":"विलुप्त → सुभेद्य → के निकट संकटग्रस्त → संकटग्रस्त → गंभीर रूप से संकटग्रस्त।"}],"exp":{"en":"Extinct (EX) → Extinct in the Wild (EW) → Critically Endangered (CR) → Endangered (EN) → Vulnerable (VU) → Near Threatened (NT) → Least Concern (LC); Data Deficient (DD) and Not Evaluated (NE) are not ordered risk levels. IUCN recognises nine category labels overall. Among adequately assessed extant taxa, extinction risk increases from LC through NT, VU, EN and CR; EW and EX represent loss from the wild and complete extinction.","hi":"विलुप्त (EX) → विलुप्त में वन्य (EW) → गंभीर रूप से संकटग्रस्त (CR) → संकटग्रस्त (EN) → सुभेद्य (VU) → के निकट संकटग्रस्त (NT) → न्यूनतम चिंता (LC); आँकड़े अपूर्ण (DD) और नहीं मूल्यांकित (NE) क्रमबद्ध जोखिम स्तर नहीं हैं। IUCN समग्र नौ श्रेणी श्रेणी-नाम के लिए सम्मानित करता है। पर्याप्त रूप से आकलित विद्यमान वर्गक में विलुप्ति जोखिम LC से NT, VU, EN और CR की ओर बढ़ता है; EW और EX वन्य हानि तथा पूर्ण विलुप्ति प्रतिनिधित्व करते हैं।"}},{"q":{"en":"Which statement correctly illustrates IUCN threat categories using Indian fauna?","hi":"भारतीय जीव-जंतु का उपयोग करके कौन-सा कथन IUCN संकट श्रेणियों को सही रूप से दर्शाता है?"},"a":{"en":"Great Indian Bustard and White-rumped Vulture are Critically Endangered, whereas Nilgai is Least Concern; therefore 'Endangered' should not be used as a generic label for all of them.","hi":"महान भारतीय सोनचिरैया और सफेद पीठ वाला गिद्ध गंभीर रूप से संकटग्रस्त हैं, जबकि नीलगाय न्यूनतम चिंता है; इसलिए 'संकटग्रस्त' को इन सबके लिए सामान्य नाम के रूप में उपयोग नहीं करना चाहिए।"},"o":[{"en":"Great Indian Bustard and White-rumped Vulture are Critically Endangered, whereas Nilgai is Least Concern; therefore 'Endangered' should not be used as a generic label for all of them.","hi":"महान भारतीय सोनचिरैया और सफेद पीठ वाला गिद्ध गंभीर रूप से संकटग्रस्त हैं, जबकि नीलगाय न्यूनतम चिंता है; इसलिए 'संकटग्रस्त' को इन सबके लिए सामान्य नाम के रूप में उपयोग नहीं करना चाहिए।"},{"en":"Nilgai, House Crow and Great Indian Bustard are all Endangered.","hi":"नीलगाय, घरेलू कौआ और महान भारतीय सोनचिरैया सभी संकटग्रस्त हैं।"},{"en":"Every vulture species and every antelope species in India has the same IUCN category.","hi":"भारत में हर गिद्ध प्रजाति और हर मृग प्रजाति की समान IUCN श्रेणी है।"},{"en":"IUCN categories apply only to plants, not animals.","hi":"IUCN श्रेणियाँ केवल पौधे पर लागू होती हैं, पशु पर नहीं।"}],"exp":{"en":"Great Indian Bustard and White-rumped Vulture are Critically Endangered, whereas Nilgai is Least Concern; therefore 'Endangered' should not be used as a generic label for all of them. IUCN categories are species-specific assessments, so one common name or taxonomic group cannot be assigned a single threat category without checking the individual species.","hi":"महान भारतीय सोनचिरैया और सफेद पीठ वाला गिद्ध गंभीर रूप से संकटग्रस्त हैं, जबकि नीलगाय न्यूनतम चिंता है; इसलिए 'संकटग्रस्त' को इन सबके लिए सामान्य नाम के रूप में उपयोग नहीं करना चाहिए। IUCN श्रेणियाँ प्रजाति-विशिष्ट आकलन हैं; इसलिए किसी सामान्य नाम या वर्गिकी समूह को व्यक्तिगत प्रजाति की जाँच किए बिना एकमात्र संकट श्रेणी नहीं दी जा सकती।"}}]},{"title":{"en":"5. Ramsar Convention","hi":"5। रामसर कन्वेंशन"},"questions":[{"q":{"en":"What is the purpose of the Ramsar Convention?","hi":"रामसर अभिसमय का उद्देश्य क्या है?"},"a":{"en":"Conservation and wise use of all wetlands and their resources through local and national action and international cooperation.","hi":"स्थानीय एवं राष्ट्रीय कार्रवाई और अंतरराष्ट्रीय सहयोग के माध्यम से सभी आर्द्रभूमियों और उनके संसाधनों का संरक्षण तथा विवेकपूर्ण उपयोग।"},"o":[{"en":"Conservation and wise use of all wetlands and their resources through local and national action and international cooperation.","hi":"स्थानीय एवं राष्ट्रीय कार्रवाई और अंतरराष्ट्रीय सहयोग के माध्यम से सभी आर्द्रभूमियों और उनके संसाधनों का संरक्षण तथा विवेकपूर्ण उपयोग।"},{"en":"Conservation only of marshes that permanently contain freshwater.","hi":"केवल स्थायी रूप से मीठे जल की वाली दलदली क्षेत्र का संरक्षण।"},{"en":"Protection only of deep-sea coral reefs.","hi":"केवल गहरा-समुद्र प्रवाल भित्तियों का संरक्षण।"},{"en":"Regulation of international nuclear energy.","hi":"अंतरराष्ट्रीय परमाणु ऊर्जा का विनियमन।"}],"exp":{"en":"Conservation and wise use of all wetlands and their resources through local and national action and international cooperation. The Convention uses a broad definition of wetlands and promotes both their conservation and 'wise use'; it is not limited to marshes alone.","hi":"स्थानीय एवं राष्ट्रीय कार्रवाई और अंतरराष्ट्रीय सहयोग के माध्यम से सभी आर्द्रभूमियों और उनके संसाधनों का संरक्षण तथा विवेकपूर्ण उपयोग। अभिसमय आर्द्रभूमियों की व्यापक परिभाषा उपयोग करता है और संरक्षण के साथ 'विवेकपूर्ण उपयोग' बढ़ावा करता है; यह केवल दलदली क्षेत्र तक सीमित नहीं है।"}},{"q":{"en":"When and where was the Ramsar Convention adopted?","hi":"रामसर अभिसमय कब और कहाँ अपनाया गया?"},"a":{"en":"2 February 1971, Ramsar, Iran.","hi":"2 फ़रवरी 1971, रामसर, ईरान।"},"o":[{"en":"2 February 1971, Ramsar, Iran.","hi":"2 फ़रवरी 1971, रामसर, ईरान।"},{"en":"1 February 1982, New Delhi, India.","hi":"1 फ़रवरी 1982, नया दिल्ली, भारत।"},{"en":"5 June 1992, Rio de Janeiro, Brazil.","hi":"5 जून 1992, रियो डी जेनेरो, ब्राज़ील।"},{"en":"5 October 1948, Fontainebleau, France.","hi":"5 अक्टूबर 1948, फॉन्टेनब्लो, फ्रांस।"}],"exp":{"en":"2 February 1971, Ramsar, Iran. The Convention was adopted on 2 February 1971 in the Iranian city of Ramsar, which is why 2 February is observed as World Wetlands Day.","hi":"2 फ़रवरी 1971, रामसर, ईरान। अभिसमय 2 फ़रवरी 1971 को ईरानी नगर रामसर में अपनाया गया; इसी कारण 2 फ़रवरी विश्व आर्द्रभूमि दिवस के रूप में मनाया जाता है।"}},{"q":{"en":"Which international observance is linked to the Ramsar Convention?","hi":"रामसर अभिसमय से कौन-सा अंतरराष्ट्रीय दिवस संबंधित है?"},"a":{"en":"World Wetlands Day — 2 February.","hi":"विश्व आर्द्रभूमियाँ दिन - 2 फ़रवरी।"},"o":[{"en":"World Wetlands Day — 2 February.","hi":"विश्व आर्द्रभूमियाँ दिन - 2 फ़रवरी।"},{"en":"World Environment Day (5th June).","hi":"विश्व पर्यावरण दिवस (5 जून)।"},{"en":"World Earth Day (22nd April).","hi":"विश्व पृथ्वी दिवस (22 अप्रैल)।"},{"en":"World Water Day (22nd March).","hi":"विश्व जल दिवस (22 मार्च)।"}],"exp":{"en":"World Wetlands Day — 2 February. The date marks the adoption of the Ramsar Convention and is used globally to highlight the ecological and societal importance of wetlands.","hi":"विश्व आर्द्रभूमियाँ दिन - 2 फ़रवरी। यह तिथि रामसर अभिसमय की अंगीकरण को चिह्नित करती है और वैश्विक रूप से आर्द्रभूमियों की पारिस्थितिक तथा सामाजिक महत्व रेखांकित करने के लिए उपयोग होती है।"}},{"q":{"en":"When did the Ramsar Convention enter into force for India?","hi":"भारत के लिए रामसर अभिसमय कब प्रभावी हुआ?"},"a":{"en":"1 February 1982.","hi":"1 फ़रवरी 1982।"},"o":[{"en":"1 February 1982.","hi":"1 फ़रवरी 1982।"},{"en":"2 February 1971.","hi":"2 फ़रवरी 1971।"},{"en":"5 June 1992.","hi":"5 जून 1992।"},{"en":"1 January 2000.","hi":"1 जनवरी 2000।"}],"exp":{"en":"1 February 1982. India's Ramsar membership is therefore dated precisely from 1 February 1982, rather than simply the calendar year 1982.","hi":"1 फ़रवरी 1982। इसलिए भारत के रामसर सदस्यता की प्रभावी तिथि ठीक 1 फ़रवरी 1982 माननी चाहिए, केवल कैलेंडर वर्ष 1982 से नहीं।"}},{"q":{"en":"How many Ramsar Sites does India have as of August 2026?","hi":"अगस्त 2026 तक भारत में कितने रामसर स्थल हैं?"},"a":{"en":"101 Ramsar Sites; Glaw Lake in Arunachal Pradesh became the 101st site in August 2026.","hi":"101 रामसर स्थल; अरुणाचल प्रदेश का ग्लॉ झील अगस्त 2026 में 101वाँ स्थल बना।"},"o":[{"en":"101 Ramsar Sites; Glaw Lake in Arunachal Pradesh became the 101st site in August 2026.","hi":"101 रामसर स्थल; अरुणाचल प्रदेश का ग्लॉ झील अगस्त 2026 में 101वाँ स्थल बना।"},{"en":"91 Ramsar Sites; no sites were added after June 2025.","hi":"91 रामसर स्थल; जून 2025 के बाद कोई स्थल कोई नया स्थल नहीं जुड़ा।"},{"en":"100 Ramsar Sites; Glaw Lake was the 100th site.","hi":"100 रामसर स्थल; ग्लॉ झील 100वाँ स्थल था।"},{"en":"99 Ramsar Sites; the count has not changed since April 2026.","hi":"99 रामसर स्थल; अप्रैल 2026 के बाद संख्या नहीं बदला।"}],"exp":{"en":"101 Ramsar Sites; Glaw Lake in Arunachal Pradesh became the 101st site in August 2026. Jai Prakash Narayan Bird Sanctuary (Surha Tal) became the 100th site in June 2026, and Glaw Lake became the 101st in August 2026.","hi":"101 रामसर स्थल; अरुणाचल प्रदेश का ग्लॉ झील अगस्त 2026 में 101वाँ स्थल बना। जय प्रकाश नारायण पक्षी अभयारण्य (सुरहा ताल) जून 2026 में 100वाँ स्थल और ग्लॉ झील अगस्त 2026 में 101वाँ स्थल बना।"}},{"q":{"en":"Which State has the highest number of Ramsar Sites as of August 2026?","hi":"अगस्त 2026 तक किस राज्य में सर्वाधिक संख्या का रामसर स्थल हैं?"},"a":{"en":"Tamil Nadu — 20 sites.","hi":"तमिलनाडु - 20 स्थल।"},"o":[{"en":"Tamil Nadu — 20 sites.","hi":"तमिलनाडु - 20 स्थल।"},{"en":"Uttar Pradesh — 10 sites.","hi":"उत्तर प्रदेश - 10 स्थल।"},{"en":"Gujarat — 15 sites.","hi":"गुजरात - 15 स्थल।"},{"en":"Kerala — 5 sites.","hi":"केरल - 5 स्थल।"}],"exp":{"en":"Tamil Nadu — 20 sites. Tamil Nadu's 20 designated sites keep it ahead of Uttar Pradesh, which has 13 after the June 2026 addition of Jai Prakash Narayan Bird Sanctuary.","hi":"तमिलनाडु - 20 स्थल। तमिलनाडु के 20 नामित स्थल इसे उत्तर प्रदेश से आगे रखते हैं; जून 2026 में जय प्रकाश नारायण पक्षी अभयारण्य जुड़ने के बाद UP के 13 स्थल हैं।"}},{"q":{"en":"Which is India's largest Ramsar Site by area?","hi":"क्षेत्रफल के अनुसार भारत का सबसे बड़ा रामसर स्थल कौन-सा है?"},"a":{"en":"Sundarban Wetland, West Bengal — 423,000 hectares.","hi":"सुंदरबन आर्द्रभूमि, पश्चिम बंगाल - 423,000 हेक्टेयर।"},"o":[{"en":"Sundarban We
