(O3)।"}],"exp":{"en":"CO2 is the dominant long-lived anthropogenic warming driver, although water vapour is crucial to the natural greenhouse effect.","hi":"CO2 प्रमुख दीर्घजीवी मानवजनित उष्मीकरण कारक है, यद्यपि जलवाष्प प्राकृतिक ग्रीनहाउस प्रभाव के लिए महत्वपूर्ण है।"}},{"q":{"en":"Methane source?","hi":"मीथेन का स्रोत?"},"a":{"en":"Wetlands, rice cultivation, livestock, landfills and fossil-fuel systems.","hi":"आर्द्रभूमियाँ, धान की खेती, पशुधन, भूमि-भराव स्थल और जीवाश्म-ईंधन प्रणालियाँ।"},"o":[{"en":"Wetlands, rice cultivation, livestock, landfills and fossil-fuel systems.","hi":"आर्द्रभूमियाँ, धान की खेती, पशुधन, भूमि-भराव स्थल और जीवाश्म-ईंधन प्रणालियाँ।"},{"en":"Volcanoes.","hi":"ज्वालामुखी।"},{"en":"Aerosol sprays.","hi":"एयरोसोल स्प्रे।"},{"en":"Ocean currents.","hi":"समुद्री धाराएँ।"}],"exp":{"en":"Methane sources span natural wetlands and human activities such as agriculture, fossil fuels and waste.","hi":"मीथेन स्रोत प्राकृतिक आर्द्रभूमियों से कृषि, जीवाश्म ईंधन और अपशिष्ट जैसी मानवीय गतिविधियों तक समाहित करते हैं।"}},{"q":{"en":"Ozone layer location?","hi":"ओजोन परत का स्थान?"},"a":{"en":"Stratosphere, mainly about 15–35 km above Earth's surface.","hi":"समतापमंडल, मुख्यतः लगभग 15-35 किमी से ऊपर पृथ्वी की सतह।"},"o":[{"en":"Stratosphere, mainly about 15–35 km above Earth's surface.","hi":"समतापमंडल, मुख्यतः लगभग 15-35 किमी से ऊपर पृथ्वी की सतह।"},{"en":"Troposphere, up to 10 km.","hi":"क्षोभमंडल, 10 किमी तक।"},{"en":"Thermosphere, above 100 km.","hi":"थर्मोस्फीयर, 100 किमी से ऊपर।"},{"en":"Mesosphere, 50-85 km.","hi":"मध्यमंडल, 50-85 किमी।"}],"exp":{"en":"The stratospheric ozone layer is a region of high ozone concentration, not the entire stratosphere.","hi":"समतापमंडलीय ओजोन परत ओजोन की उच्च सांद्रता वाला क्षेत्र है, संपूर्ण समतापमंडल नहीं।"}},{"q":{"en":"Ozone max concentration altitude?","hi":"ओजोन अधिकतम सांद्रता ऊंचाई?"},"a":{"en":"Within the ozone-layer region, roughly 15–35 km; exact peak altitude varies.","hi":"ओजोन-परत क्षेत्र लगभग 15-35 किमी में; सटीक शिखर ऊँचाई बदलता है।"},"o":[{"en":"Within the ozone-layer region, roughly 15–35 km; exact peak altitude varies.","hi":"ओजोन-परत क्षेत्र लगभग 15-35 किमी में; सटीक शिखर ऊँचाई बदलता है।"},{"en":"0–10 km.","hi":"0-10 कि.मी।"},{"en":"50–80 km.","hi":"50-80 कि.मी।"},{"en":"80–100 km.","hi":"80-100 कि.मी।"}],"exp":{"en":"Its exact vertical maximum varies, so the broad 15–35 km ozone-layer range is safer than a single fixed altitude.","hi":"सटीक ऊर्ध्वाधर अधिकतम बदलता है, इसलिए व्यापक 15-35 किमी ओजोन-परत सीमा एकमात्र निश्चित ऊँचाई से अधिक सुरक्षित है।"}},{"q":{"en":"Ozone measured in?","hi":"ओजोन किसमें मापा जाता है?"},"a":{"en":"Dobson Units (DU).","hi":"डॉब्सन इकाई (DU)।"},"o":[{"en":"Dobson Units (DU).","hi":"डॉब्सन इकाई (DU)।"},{"en":"Pascals.","hi":"पास्कल।"},{"en":"Celsius.","hi":"सेल्सियस।"},{"en":"Millibars.","hi":"मिलीबार।"}],"exp":{"en":"DU measures the total ozone column above a location.","hi":"DU किसी स्थान के ऊपर कुल ओजोन स्तंभ माप करता है।"}},{"q":{"en":"Ozone hole discovered?","hi":"ओजोन छिद्र की खोज?"},"a":{"en":"Antarctica, 1985.","hi":"अंटार्कटिका, 1985।"},"o":[{"en":"Antarctica, 1985.","hi":"अंटार्कटिका, 1985।"},{"en":"Arctic, 1992.","hi":"आर्कटिक, 1992।"},{"en":"Australia, 1972.","hi":"ऑस्ट्रेलिया, 1972।"},{"en":"North America, 1987.","hi":"उत्तरी अमेरिका, 1987।"}],"exp":{"en":"The 1985 Antarctic finding triggered intense global concern over ozone depletion.","hi":"1985 अंटार्कटिक खोज ने ओजोन क्षय पर तीव्र वैश्विक चिंता उत्पन्न किया।"}},{"q":{"en":"Montreal Protocol year?","hi":"मॉन्ट्रियल प्रोटोकॉल वर्ष?"},"a":{"en":"1987.","hi":"1987।"},"o":[{"en":"1987.","hi":"1987।"},{"en":"1972.","hi":"1972।"},{"en":"1992.","hi":"1992।"},{"en":"1997.","hi":"1997।"}],"exp":{"en":"The Montreal Protocol was adopted on 16 September 1987.","hi":"मॉन्ट्रियल प्रोटोकॉल 16 सितंबर 1987 को अपनाया गया।"}},{"q":{"en":"Ozone Protection Day?","hi":"ओजोन संरक्षण दिवस?"},"a":{"en":"16 September.","hi":"16 सितंबर।"},"o":[{"en":"16 September.","hi":"16 सितंबर।"},{"en":"5th Ju framework, not an exhaustive scientific taxonomy; pollution types can overlap and one source may affect several environmental media.","hi":"अध्याय में छह श्रेणियाँ समाहित की गई हैं: वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस-अपशिष्ट प्रदूषण; इनके प्रमुख कारण, स्वास्थ्य/पारिस्थितिक प्रभाव, नियंत्रण उपाय और प्रदूषक-रोग संबंध भी शामिल हैं। ये अध्याय की व्यवस्थापन श्रेणियाँ हैं, संपूर्ण वैज्ञानिक वर्गीकरण नहीं; प्रदूषण के प्रकार एक-दूसरे से अतिव्याप्त हो सकते हैं और एक स्रोत कई पर्यावरणीय माध्यमों को प्रभावित कर सकता है।"}},{"q":{"en":"How many types of pollution are covered in this chapter?","hi":"इस अध्याय में कितने प्रकार के प्रदूषण कवर किए गए हैं?"},"a":{"en":"6 chapter categories — Air, Water, Soil, Noise, Radioactive and Solid Waste.","hi":"6 अध्याय श्रेणियाँ - वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस अपशिष्ट।"},"o":[{"en":"6 chapter categories — Air, Water, Soil, Noise, Radioactive and Solid Waste.","hi":"6 अध्याय श्रेणियाँ - वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस अपशिष्ट।"},{"en":"4 types.","hi":"4 प्रकार।"},{"en":"8 types.","hi":"8 प्रकार।"},{"en":"3 types.","hi":"3 प्रकार।"}],"exp":{"en":"6 chapter categories — Air, Water, Soil, Noise, Radioactive and Solid Waste. The count refers only to the six categories used in this chapter.","hi":"6 अध्याय श्रेणियाँ - वायु, जल, मृदा, ध्वनि, रेडियोधर्मी और ठोस अपशिष्ट। संख्या केवल इस अध्याय में प्रयुक्त छह श्रेणियाँ को संदर्भित करता है।"}},{"q":{"en":"How many health-effect/disease–pollutant question groups are covered in the water-pollution section?","hi":"जल-प्रदूषण खंड में कितने स्वास्थ्य-प्रभाव/रोग-प्रदूषक प्रश्न-समूह समाहित किए गए हैं?"},"a":{"en":"6 question groups.","hi":"6 प्रश्न-समूह।"},"o":[{"en":"6 question groups.","hi":"6 प्रश्न-समूह।"},{"en":"3 question groups.","hi":"3 प्रश्न-समूह।"},{"en":"10 question groups.","hi":"10 प्रश्न-समूह।"},{"en":"4 question groups.","hi":"4 प्रश्न-समूह।"}],"exp":{"en":"6 question groups. These six groups mix infectious disease, toxic-metal poisoning and chemical health effects, so they should not all be called 'water-borne diseases' in the same sense.","hi":"6 प्रश्न-समूह। इन छह समूह में संक्रामक रोग, विषाक्त-धातु विषाक्तता और रासायनिक स्वास्थ्य प्रभाव मिश्रण हैं; इसलिए सभी को समान अर्थ में 'जल-जनित रोगों' नहीं कहना चाहिए।"}},{"q":{"en":"Is there a single universal 65 dB threshold for noise pollution under India's Noise Rules?","hi":"क्या भारत के ध्वनि नियम में ध्वनि प्रदूषण के लिए एकमात्र सार्वभौमिक 65 dB सीमा है?"},"a":{"en":"No. Permissible ambient limits vary by area and time: Industrial 75/70, Commercial 65/55, Residential 55/45 and Silence Zone 50/40 dB(A) Leq for day/night.","hi":"नहीं। अनुमेय परिवेशीय सीमाएँ क्षेत्र और समय के अनुसार बदलते हैं: औद्योगिक 75/70, वाणिज्यिक 65/55, आवासीय 55/45 और शांत क्षेत्र 50/40 dB(A) Leq (दिन/रात)।"},"o":[{"en":"No. Permissible ambient limits vary by area and time: Industrial 75/70, Commercial 65/55, Residential 55/45 and Silence Zone 50/40 dB(A) Leq for day/night.","hi":"नहीं। अनुमेय परिवेशीय सीमाएँ क्षेत्र और समय के अनुसार बदलते हैं: औद्योगिक 75/70, वाणिज्यिक 65/55, आवासीय 55/45 और शांत क्षेत्र 50/40 dB(A) Leq (दिन/रात)।"},{"en":"Yes. Every area has a fixed 65 dB limit at all times.","hi":"हाँ। प्रत्येक क्षेत्रफल में सभी गुना निश्चित 65 dB सीमा है।"},{"en":"Yes. Every area has a fixed 85 dB limit.","hi":"हाँ। प्रत्येक क्षेत्रफल में निश्चित 85 dB सीमा है।"},{"en":"No noise standards are prescribed in India.","hi":"भारत में कोई ध्वनि मानक निर्धारित नहीं हैं।"}],"exp":{"en":"No. Permissible ambient limits vary by area and time: Industrial 75/70, Commercial 65/55, Residential 55/45 and Silence Zone 50/40 dB(A) Leq for day/night. India's Noise Pollution Rules prescribe zone-specific day/night limits rather than one universal cut-off. The 65 dB figure is specifically the Commercial-area daytime limit.","hi":"नहीं। अनुमेय परिवेशीय सीमाएँ क्षेत्र और समय के अनुसार बदलते हैं: औद्योगिक 75/70, वाणिज्यिक 65/55, आवासीय 55/45 और शांत क्षेत्र 50/40 dB(A) Leq (दिन/रात)। भारत के ध्वनि प्रदूषण नियम एक सार्वभौमिक कटौती-बंद के बजाय क्षेत्र-विशिष्ट दिन/रात सीमाएँ निर्धारित करते हैं। 65 dB विशेष रूप से वाणिज्यिक क्षेत्र की दिन की सीमा है।"}},{"q":{"en":"When was the Air (Prevention and Control of Pollution) Act enacted in India?","hi":"भारत में वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम कब अधिनियमित हुआ?"},"a":{"en":"1981.","hi":"1981।"},"o":[{"en":"1981.","hi":"1981।"},{"en":"In 1972.","hi":"1972 में।"},{"en":"In 1986.","hi":"1986 में।"},{"en":"In 1992.","hi":"1992 में।"}],"exp":{"en":"1981. The full statute is the Air (Prevention and Control of Pollution) Act, 1981, India's principal law specifically aimed at prevention, control and abatement of air pollution.","hi":"1981। पूरा कानून वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1981 है, जो वायु प्रदूषण की निवारण, नियंत्रण और उन्मूलन पर केंद्रित मुख्य भारतीय कानून है।"}},{"q":{"en":"What are common examples of disease-cause matching?","hi":"रोग-कारण (रोग-कारण) मिलान के सामान्य उदाहरण क्या हैं?"},"a":{"en":"Minamata disease → methylmercury; Itai-Itai disease → cadmium; Blackfoot disease → chronic arsenic exposure; Blue-baby syndrome → nitrate/nitrite-related methaemoglobinaemia.","hi":"मिनामाता रोग → मिथाइल मरकरी; इटाई-इटाई रोग → कैडमियम; ब्लैकफुट रोग → दीर्घकालिक आर्सेनिक संपर्क; ब्लू-बेबी सिंड्रोम → नाइट्रेट/नाइट्राइट-संबंधित मीथेमोग्लोबिनेमिया।"},"o":[{"en":"Minamata disease → methylmercury; Itai-Itai disease → cadmium; Blackfoot disease → chronic arsenic exposure; Blue-baby syndrome → nitrate/nitrite-related methaemoglobinaemia.","hi":"मिनामाता रोग → मिथाइल मरकरी; इटाई-इटाई रोग → कैडमियम; ब्लैकफुट रोग → दीर्घकालिक आर्सेनिक संपर्क; ब्लू-बेबी सिंड्रोम → नाइट्रेट/नाइट्राइट-संबंधित मीथेमोग्लोबिनेमिया।"},{"en":"Minamata → Cadmium, Itai-Itai → Mercury, Black Foot → Nitrates, Blue-baby Syndrome → Arsenic.","hi":"मिनामाता → कैडमियम, इटाई-इटाई → पारा, ब्लैक फुट → नाइट्रेट्स, ब्लू-बेबी सिंड्रोम → आर्सेनिक।"},{"en":"Jaundice → Mercury, Cholera → Arsenic, Typhoid → Nitrates, Dysentery → Cadmium.","hi":"पीलिया → पारा, हैजा → आर्सेनिक, टाइफाइड → नाइट्रेट्स, पेचिश → कैडमियम।"},{"en":"Minamata → Arsenic, Itai-Itai → Nitrates, Black Foot → Cadmium, Blue-baby Syndrome → Mercury.","hi":"मिनामाता → आर्सेनिक, इटाई-इटाई → नाइट्रेट्स, ब्लैक फुट → कैडमियम, ब्लू-बेबी सिंड्रोम → पारा।"}],"exp":{"en":"Minamata disease → methylmercury; Itai-Itai disease → cadmium; Blackfoot disease → chronic arsenic exposure; Blue-baby syndrome → nitrate/nitrite-related methaemoglobinaemia. These associations are classic environmental-health examples, but the chemical form and exposure pathway matter—for Minamata disease, methylmercury is the key toxic form.","hi":"मिनामाता रोग → मिथाइल मरकरी; इटाई-इटाई रोग → कैडमियम; ब्लैकफुट रोग → दीर्घकालिक आर्सेनिक संपर्क; ब्लू-बेबी सिंड्रोम → नाइट्रेट/नाइट्राइट-संबंधित मीथेमोग्लोबिनेमिया। ये प्रमुख पर्यावरणीय-स्वास्थ्य संबंध हैं, लेकिन रासायनिक रूप और संपर्क मार्ग पदार्थ करते हैं-मिनामाता रोग में मिथाइल मरकरी प्रमुख विषाक्त रूप है।"}}]},{"title":{"en":"2. Pollutants — Primary & Secondary","hi":"2। प्रदूषक - प्राथमिक और द्वितीयक"},"questions":[{"q":{"en":"What are standard examples of primary air pollutants?","hi":"प्राथमिक वायु प्रदूषक के मानक उदाहरण क्या हैं?"},"a":{"en":"Pollutants emitted directly from sources, such as CO, SO2, NO/NOx, NH3, VOCs and primary particulate matter.","hi":"स्रोत से प्रत्यक्ष उत्सर्जित प्रदूषक, जैसे CO, SO2, NO/NOx, NH3, VOCs और प्राथमिक कणिकीय पदार्थ।"},"o":[{"en":"Pollutants emitted directly from sources, such as CO, SO2, NO/NOx, NH3, VOCs and primary particulate matter.","hi":"स्रोत से प्रत्यक्ष उत्सर्जित प्रदूषक, जैसे CO, SO2, NO/NOx, NH3, VOCs और प्राथमिक कणिकीय पदार्थ।"},{"en":"Ozone, PAN, nitric acid and sulfuric acid formed in the atmosphere.","hi":"वायुमंडल में गठित ओजोन, PAN, नाइट्रिक अम्ल और सल्फ्यूरिक अम्ल।"},{"en":"Only acid rain and photochemical smog.","hi":"केवल अम्ल वर्षा और प्रकाश-रासायनिक धूम-कोहरा।"},{"en":"Only plastics and DDT in soil.","hi":"केवल मृदा में प्लास्टिक और DDT।"}],"exp":{"en":"Pollutants emitted directly from sources, such as CO, SO2, NO/NOx, NH3, VOCs and primary particulate matter. 'Primary' describes how the pollutant enters the atmosphere: it is emitted directly. A pollutant may later react and generate secondary pollutants.","hi":"स्रोत से प्रत्यक्ष उत्सर्जित प्रदूषक, जैसे CO, SO2, NO/NOx, NH3, VOCs और प्राथमिक कणिकीय पदार्थ। 'प्राथमिक' बताता है प्रदूषक वायुमंडल में कैसे प्रवेश करता है: यह प्रत्यक्ष उत्सर्जित होता है। बाद में यही प्रदूषक अभिक्रिया करके द्वितीयक प्रदूषक बना सकते हैं।"}},{"q":{"en":"What are standard examples of secondary air pollutants?","hi":"द्वितीयक वायु प्रदूषक के मानक उदाहरण क्या हैं?"},"a":{"en":"Pollutants formed in the atmosphere by chemical reactions, such as O3, PAN, HNO3, H2SO4 and secondary sulfate/nitrate particles.","hi":"वायुमंडल में रासायनिक अभिक्रियाओं से गठित प्रदूषक, जैसे O3, PAN, HNO3, H2SO4 और द्वितीयक सल्फेट/नाइट्रेट कण।"},"o":[{"en":"Pollutants formed in the atmosphere by chemical reactions, such as O3, PAN, HNO3, H2SO4 and secondary sulfate/nitrate particles.","hi":"वायुमंडल में रासायनिक अभिक्रियाओं से गठित प्रदूषक, जैसे O3, PAN, HNO3, H2SO4 और द्वितीयक सल्फेट/नाइट्रेट कण।"},{"en":"CO, SO2 and NH3 emitted directly from sources.","hi":"स्रोत से प्रत्यक्ष उत्सर्जित CO, SO2 और NH3।"},{"en":"Only plastic litter and DDT residues.","hi":"केवल प्लास्टिक कचरा और DDT अवशेष।"},{"en":"Only coarse dust emitted from roads.","hi":"केवल सड़कें से प्रत्यक्ष उत्सर्जित मोटे धूल।"}],"exp":{"en":"Pollutants formed in the atmosphere by chemical reactions, such as O3, PAN, HNO3, H2SO4 and secondary sulfate/nitrate particles. Secondary pollutants are produced after atmospheric chemistry; ground-level ozone, photochemical oxidants and secondary acids/aerosols are standard examples.","hi":"वायुमंडल में रासायनिक अभिक्रियाओं से गठित प्रदूषक, जैसे O3, PAN, HNO3, H2SO4 और द्वितीयक सल्फेट/नाइट्रेट कण। द्वितीयक प्रदूषक वायुमंडलीय रसायन के बाद बनते हैं; भूतलीय ओजोन, प्रकाश-रासायनिक ऑक्सीकारक और द्वितीयक अम्ल/एरोसोल मानक उदाहरण हैं।"}},{"q":{"en":"What is the difference between Primary and Secondary Pollutants?","hi":"प्राथमिक और द्वितीयक प्रदूषकों के बीच क्या अंतर है?"},"a":{"en":"Primary pollutants are emitted directly from a source; secondary pollutants form in the atmosphere through chemical reactions involving primary pollutants and atmospheric constituents.","hi":"प्राथमिक प्रदूषक स्रोत से प्रत्यक्ष उत्सर्जित होते हैं; द्वितीयक प्रदूषक वायुमंडल में प्राथमिक प्रदूषक और वायुमंडलीय घटक की रासायनिक अभिक्रियाओं से बनते हैं।"},"o":[{"en":"Primary pollutants are emitted directly from a source; secondary pollutants form in the atmosphere through chemical reactions involving primary pollutants and atmospheric constituents.","hi":"प्राथमिक प्रदूषक स्रोत से प्रत्यक्ष उत्सर्जित होते हैं; द्वितीयक प्रदूषक वायुमंडल में प्राथमिक प्रदूषक और वायुमंडलीय घटक की रासायनिक अभिक्रियाओं से बनते हैं।"},{"en":"Primary pollutants are natural; Secondary pollutants are man-made.","hi":"प्राथमिक प्रदूषक प्राकृतिक होते हैं; द्वितीयक प्रदूषक मानव निर्मित होते हैं।"},{"en":"Primary pollutants are highly toxic; Secondary pollutants are completely harmless.","hi":"प्राथमिक प्रदूषक अत्यधिक विषैले होते हैं; द्वितीयक प्रदूषक पूरी तरह से हानिरहित होते हैं।"},{"en":"Primary pollutants are in the water; Secondary pollutants are in the air.","hi":"प्राथमिक प्रदूषक पानी में होते हैं; द्वितीयक प्रदूषक हवा में होते हैं।"}],"exp":{"en":"Primary pollutants are emitted directly from a source; secondary pollutants form in the atmosphere through chemical reactions involving primary pollutants and atmospheric constituents. The distinction is based on formation pathway, not on whether a pollutant is natural/man-made or more/less toxic.","hi":"प्राथमिक प्रदूषक स्रोत से प्रत्यक्ष उत्सर्जित होते हैं; द्वितीयक प्रदूषक वायुमंडल में प्राथमिक प्रदूषक और वायुमंडलीय घटक की रासायनिक अभिक्रियाओं से बनते हैं। अंतर गठन मार्ग पर आधारित है, यह नहीं कि प्रदूषक प्राकृतिक/मानव-निर्मित या अधिक/कम विषाक्त है।"}}]},{"title":{"en":"3. Air Pollution","hi":"3। वायु प्रदूषण"},"questions":[{"q":{"en":"What are the causes of Air Pollution?","hi":"वायु प्रदूषण के कारण क्या हैं?"},"a":{"en":"Major sources include fossil-fuel combustion, vehicle exhaust, industrial emissions, power generation, construction and road dust, waste/biomass burning and other combustion processes.","hi":"प्रमुख स्रोतों में जीवाश्म-ईंधन दहन, वाहन धुआँ, औद्योगिक उत्सर्जन, शक्ति उत्पत्ति, निर्माण/सड़क धूल, अपशिष्ट/जैवमास दहन और अन्य दहन प्रक्रियाएँ शामिल हैं।"},"o":[{"en":"Major sources include fossil-fuel combustion, vehicle exhaust, industrial emissions, power generation, construction and road dust, waste/biomass burning and other combustion processes.","hi":"प्रमुख स्रोतों में जीवाश्म-ईंधन दहन, वाहन धुआँ, औद्योगिक उत्सर्जन, शक्ति उत्पत्ति, निर्माण/सड़क धूल, अपशिष्ट/जैवमास दहन और अन्य दहन प्रक्रियाएँ शामिल हैं।"},{"en":"Planting too many trees and excessive photosynthesis.","hi":"बहुत अधिक पेड़ लगाना और अत्यधिक प्रकाश संश्लेषण।"},{"en":"Use of solar panels and wind turbines.","hi":"सौर पैनलों और पवन टर्बाइनों का उपयोग।"},{"en":"Evaporation of clean river water.","hi":"स्वच्छ नदी के पानी का वाष्पीकरण।"}],"exp":{"en":"Major sources include fossil-fuel combustion, vehicle exhaust, industrial emissions, power generation, construction and road dust, waste/biomass burning and other combustion processes. Combustion sources emit gases and primary particles, while construction and roads add dust; sunlight and atmospheric chemistry can then create secondary pollutants.","hi":"प्रमुख स्रोतों में जीवाश्म-ईंधन दहन, वाहन धुआँ, औद्योगिक उत्सर्जन, शक्ति उत्पत्ति, निर्माण/सड़क धूल, अपशिष्ट/जैवमास दहन और अन्य दहन प्रक्रियाएँ शामिल हैं। दहन स्रोत गैसें और प्राथमिक कण उत्सर्जित करते हैं, निर्माण कार्य एवं सड़कें धूल बढ़ाते हैं; सूर्यप्रकाश और वायुमंडलीय रसायन बाद में द्वितीयक प्रदूषक बना सकते हैं।"}},{"q":{"en":"Which are common gaseous air pollutants or harmful atmospheric gases?","hi":"सामान्य गैसीय वायु प्रदूषक या हानिकारक वायुमंडलीय गैसें कौन-से हैं?"},"a":{"en":"CO, SO2, NOx, ground-level O3, NH3 and VOCs are common examples; CO2 is chiefly treated as a greenhouse gas rather than a conventional local ambient-air pollutant.","hi":"CO, SO2, NOx, भूमि-स्तर O3, NH3 और VOCs सामान्य उदाहरण हैं; CO2 को पारंपरिक स्थानीय परिवेशीय-वायु प्रदूषक के बजाय मुख्यतः ग्रीनहाउस गैस के रूप में माना जाता है।"},"o":[{"en":"CO, SO2, NOx, ground-level O3, NH3 and VOCs are common examples; CO2 is chiefly treated as a greenhouse gas rather than a conventional local ambient-air pollutant.","hi":"CO, SO2, NOx, भूमि-स्तर O3, NH3 और VOCs सामान्य उदाहरण हैं; CO2 को पारंपरिक स्थानीय परिवेशीय-वायु प्रदूषक के बजाय मुख्यतः ग्रीनहाउस गैस के रूप में माना जाता है।"},{"en":"Only PM2.5, PM10, dust and soot.","hi":"केवल PM2.5, PM10, धूल और कालिख।"},{"en":"Only DDT and plastic litter.","hi":"केवल DDT और प्लास्टिक कचरा।"},{"en":"Only water vapour and oxygen.","hi":"केवल जलवाष्प और ऑक्सीजन।"}],"exp":{"en":"CO, SO2, NOx, ground-level O3, NH3 and VOCs are common examples; CO2 is chiefly treated as a greenhouse gas rather than a conventional local ambient-air pollutant. Ground-level ozone is harmful, whereas stratospheric ozone is protective. CO2 is environmentally important for climate change but is not treated like conventional local criteria pollutants in India's NAAQS framework.","hi":"CO, SO2, NOx, भूमि-स्तर O3, NH3 और VOCs सामान्य उदाहरण हैं; CO2 को पारंपरिक स्थानीय परिवेशीय-वायु प्रदूषक के बजाय मुख्यतः ग्रीनहाउस गैस के रूप में माना जाता है। भूतलीय ओजोन हानिकारक है, जबकि समतापमंडलीय ओजोन सुरक्षात्मक है। CO2 जलवायु परिवर्तन के लिए महत्वपूर्ण है लेकिन भारत के NAAQS ढाँचे में पारंपरिक स्थानीय मानदंड प्रदूषक की तरह नहीं माना जाता।"}},{"q":{"en":"Which are common particulate air pollutants?","hi":"सामान्य कणिकीय वायु प्रदूषक कौन-से हैं?"},"a":{"en":"PM2.5 and PM10, dust, smoke, soot, fly ash and other suspended particles.","hi":"PM2.5 और PM10, धूल, धुआँ, कालिख, फ्लाई ऐश और अन्य निलंबित कण।"},"o":[{"en":"PM2.5 and PM10, dust, smoke, soot, fly ash and other suspended particles.","hi":"PM2.5 और PM10, धूल, धुआँ, कालिख, फ्लाई ऐश और अन्य निलंबित कण।"},{"en":"CO, SO2 and NOx only.","hi":"केवल CO, SO2 और NOx।"},{"en":"Ozone and nitric acid only.","hi":"केवल ओजोन और नाइट्रिक अम्ल।"},{"en":"DDT and plastic waste only.","hi":"केवल DDT और प्लास्टिक अपशिष्ट।"}],"exp":{"en":"PM2.5 and PM10, dust, smoke, soot, fly ash and other suspended particles. Particulate matter refers to suspended solid or liquid particles. 'Smog' is a broader pollution mixture and should not itself be treated as a single particulate species.","hi":"PM2.5 और PM10, धूल, धुआँ, कालिख, फ्लाई ऐश और अन्य निलंबित कण। कणिकीय पदार्थ निलंबित ठोस या तरल कण को संदर्भित करता है। 'धूम-कोहरा' व्यापक प्रदूषण मिश्रण है, इसे एकमात्र कणिकीय प्रजाति नहीं मानना चाहिए।"}},{"q":{"en":"What are the impacts of Air Pollution?","hi":"वायु प्रदूषण के प्रभाव क्या हैं?"},"a":{"en":"Air pollution can cause or worsen respiratory and cardiovascular disease, asthma, eye/throat irritation and reduced lung function; some pollutants also increase cancer or neurological risks.","hi":"वायु प्रदूषण श्वसन संबंधी और हृदय-वाहिका संबंधी रोग, अस्थमा, आँख/गले में जलन और कम फेफड़ों की कार्यक्षमता उत्पन्न या गंभीर कर सकता है; कुछ प्रदूषक कैंसर या तंत्रिका संबंधी जोखिम भी बढ़ाते हैं।"},"o":[{"en":"Air pollution can cause or worsen respiratory and cardiovascular disease, asthma, eye/throat irritation and reduced lung function; some pollutants also increase cancer or neurological risks.","hi":"वायु प्रदूषण श्वसन संबंधी और हृदय-वाहिका संबंधी रोग, अस्थमा, आँख/गले में जलन और कम फेफड़ों की कार्यक्षमता उत्पन्न या गंभीर कर सकता है; कुछ प्रदूषक कैंसर या तंत्रिका संबंधी जोखिम भी बढ़ाते हैं।"},{"en":"Cholera, Typhoid, and Dysentery.","hi":"हैजा, टाइफाइड और पेचिश।"},{"en":"Minamata, Itai-Itai, and Black Foot disease.","hi":"मिनामाता, इटाई-इटाई और ब्लैक फुट रोग।"},{"en":"Hearing loss and insomnia only.","hi":"केवल सुनने की हानि और अनिद्रा।"}],"exp":{"en":"Air pollution can cause or worsen respiratory and cardiovascular disease, asthma, eye/throat irritation and reduced lung function; some pollutants also increase cancer or neurological risks. Health effects vary by pollutant, dose and duration. Fine particles are especially important because they can penetrate deep into the lungs and contribute to systemic cardiovascular effects.","hi":"वायु प्रदूषण श्वसन संबंधी और हृदय-वाहिका संबंधी रोग, अस्थमा, आँख/गले में जलन और कम फेफड़ों की कार्यक्षमता उत्पन्न या गंभीर कर सकता है; कुछ प्रदूषक कैंसर या तंत्रिका संबंधी जोखिम भी बढ़ाते हैं। स्वास्थ्य प्रभाव प्रदूषक, मात्रा और अवधि पर बदलते हैं। सूक्ष्म कण विशेष रूप से महत्वपूर्ण हैं क्योंकि वे फेफड़ों में गहरा प्रवेश करके पूरे शरीर पर हृदय-वाहिका संबंधी प्रभाव में योगदान कर सकते हैं।"}},{"q":{"en":"Which major Indian measures address ambient air pollution?","hi":"परिवेशीय वायु प्रदूषण को संबोधित करने वाले प्रमुख भारतीय उपाय कौन-से हैं?"},"a":{"en":"The Air (Prevention and Control of Pollution) Act, 1981; National Ambient Air Quality Monitoring Programme (NAMP); National Ambient Air Quality Standards (NAAQS); and the National Clean Air Programme (NCAP), launched in 2019.","hi":"वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1981; राष्ट्रीय परिवेशीय वायु गुणवत्ता निगरानी कार्यक्रम (NAMP); राष्ट्रीय परिवेशीय वायु गुणवत्ता मानक (NAAQS); और 2019 में शुरू किया गया राष्ट्रीय स्वच्छ वायु कार्यक्रम (NCAP)।"},"o":[{"en":"The Air (Prevention and Control of Pollution) Act, 1981; National Ambient Air Quality Monitoring Programme (NAMP); National Ambient Air Quality Standards (NAAQS); and the National Clean Air Programme (NCAP), launched in 2019.","hi":"वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1981; राष्ट्रीय परिवेशीय वायु गुणवत्ता निगरानी कार्यक्रम (NAMP); राष्ट्रीय परिवेशीय वायु गुणवत्ता मानक (NAAQS); और 2019 में शुरू किया गया राष्ट्रीय स्वच्छ वायु कार्यक्रम (NCAP)।"},{"en":"Only Namami Gange Programme.","hi":"केवल नमामि गंगे कार्यक्रम।"},{"en":"Only Wildlife (Protection) Act, 1972.","hi":"केवल वन्यजीव (संरक्षण) अधिनियम, 1972।"},{"en":"Only the Montreal Protocol.","hi":"केवल मॉन्ट्रियल प्रोटोकॉल।"}],"exp":{"en":"The Air (Prevention and Control of Pollution) Act, 1981; National Ambient Air Quality Monitoring Programme (NAMP); National Ambient Air Quality Standards (NAAQS); and the National Clean Air Programme (NCAP), launched in 2019. NCAP was launched in 2019 and remains a major clean-air programme; by FY 2025–26, 108 of its 130 cities had reduced annual PM10 compared with the 2017–18 baseline.","hi":"वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम, 1981; राष्ट्रीय परिवेशीय वायु गुणवत्ता निगरानी कार्यक्रम (NAMP); राष्ट्रीय परिवेशीय वायु गुणवत्ता मानक (NAAQS); और 2019 में शुरू किया गया राष्ट्रीय स्वच्छ वायु कार्यक्रम (NCAP)। NCAP 2019 में शुरू हुआ और प्रमुख स्वच्छ-वायु कार्यक्रम है; FY 2025-26 तक 130 शहर में से 108 ने 2017-18 आधार-रेखा की तुलना में वार्षिक PM10 कम किया।"}}]},{"title":{"en":"4. Water Pollution","hi":"4। जल प्रदूषण"},"questions":[{"q":{"en":"What is water pollution?","hi":"जल प्रदूषण क्या है?"},"a":{"en":"Contamination or undesirable physical, chemical or biological change in water that degrades its quality and can make it harmful or unsuitable for organisms or intended uses.","hi":"जल में संदूषण या अवांछित भौतिक, रासायनिक या जैविक परिवर्तन जो उसकी गुणवत्ता खराब करे और जीवों या निर्धारित उपयोगों के लिए हानिकारक/अनुपयुक्त बना दे।"},"o":[{"en":"Contamination or undesirable physical, chemical or biological change in water that degrades its quality and can make it harmful or unsuitable for organisms or intended uses.","hi":"जल में संदूषण या अवांछित भौतिक, रासायनिक या जैविक परिवर्तन जो उसकी गुणवत्ता खराब करे और जीवों या निर्धारित उपयोगों के लिए हानिकारक/अनुपयुक्त बना दे।"},{"en":"The natural evaporation of river water.","hi":"नदी जल का प्राकृतिक वाष्पीकरण।"},{"en":"The freezing of ocean surfaces in winter.","hi":"शीतकाल में महासागर सतह का हिमांक।"},{"en":"The removal of salt from seawater.","hi":"समुद्री जल से लवण हटाना।"}],"exp":{"en":"Contamination or undesirable physical, chemical or biological change in water that degrades its quality and can make it harmful or unsuitable for organisms or intended uses. Water pollution may involve pathogens, nutrients, toxic chemicals, sediments, heat, oil, plastics or radioactive contaminants; it is broader than simply 'mixing gases, liquids and solids'.","hi":"जल में संदूषण या अवांछित भौतिक, रासायनिक या जैविक परिवर्तन जो उसकी गुणवत्ता खराब करे और जीवों या निर्धारित उपयोगों के लिए हानिकारक/अनुपयुक्त बना दे। जल प्रदूषण रोगजनक, पोषक तत्त्व, विषाक्त रसायन, अवसाद, ऊष्मा, तेल, प्लास्टिक या रेडियोधर्मी संदूषक शामिल कर सकता है; यह केवल 'गैसें, तरल और ठोस मिश्रण' से व्यापक अवधारणा है।"}},{"q":{"en":"What are the Human Induced Causes of Water Pollution?","hi":"जल प्रदूषण के मानव जनित कारण क्या हैं?"},"a":{"en":"Untreated sewage and industrial effluents, agricultural runoff containing fertilisers/pesticides, oil spills, plastics, thermal discharges and accidental chemical or radioactive releases.","hi":"अनुपचारित मलजल और औद्योगिक बहिःस्राव, उर्वरक/कीटनाशक वाला कृषि अपवाह, तेल रिसाव, प्लास्टिक, तापीय बहिःस्राव और आकस्मिक रासायनिक या रेडियोधर्मी पदार्थों का रिसाव।"},"o":[{"en":"Untreated sewage and industrial effluents, agricultural runoff containing fertilisers/pesticides, oil spills, plastics, thermal discharges and accidental chemical or radioactive releases.","hi":"अनुपचारित मलजल और औद्योगिक बहिःस्राव, उर्वरक/कीटनाशक वाला कृषि अपवाह, तेल रिसाव, प्लास्टिक, तापीय बहिःस्राव और आकस्मिक रासायनिक या रेडियोधर्मी पदार्थों का रिसाव।"},{"en":"Volcanic ash, dust, and organic waste from forests.","hi":"ज्वालामुखी की राख, धूल और जंगलों से निकलने वाला जैविक कचरा।"},{"en":"Earthquakes and tectonic shifts.","hi":"भूकंप और विवर्तनिक बदलाव।"},{"en":"Solar flares and cosmic radiation.","hi":"सौर ज्वालाएँ और ब्रह्मांडीय विकिरण।"}],"exp":{"en":"Untreated sewage and industrial effluents, agricultural runoff containing fertilisers/pesticides, oil spills, plastics, thermal discharges and accidental chemical or radioactive releases. Untreated sewage is a major microbial/organic load, while industry and agriculture can add toxic chemicals, nutrients and oxygen-demanding matter.","hi":"अनुपचारित मलजल और औद्योगिक बहिःस्राव, उर्वरक/कीटनाशक वाला कृषि अपवाह, तेल रिसाव, प्लास्टिक, तापीय बहिःस्राव और आकस्मिक रासायनिक या रेडियोधर्मी पदार्थों का रिसाव। अनुपचारित मलजल प्रमुख सूक्ष्मजीवी/कार्बनिक भार है, जबकि उद्योग और कृषि विषाक्त रसायन, पोषक तत्त्व और ऑक्सीजन-माँग वाला पदार्थ जोड़ सकते हैं।"}},{"q":{"en":"What are the Natural Causes of Water Pollution?","hi":"जल प्रदूषण के प्राकृतिक कारण क्या हैं?"},"a":{"en":"Natural sources can include erosion and sediment, volcanic ash, decaying organic matter, saline intrusion and naturally occurring contaminants such as arsenic or fluoride in groundwater.","hi":"प्राकृतिक स्रोत में अपरदन/अवसाद, ज्वालामुखीय राख, क्षयमान कार्बनिक पदार्थ, लवणीय जल का प्रवेश और भूजल में प्राकृतिक रूप से पाए जाने वाले आर्सेनिक या फ्लोराइड जैसे संदूषक शामिल हो सकते हैं।"},"o":[{"en":"Natural sources can include erosion and sediment, volcanic ash, decaying organic matter, saline intrusion and naturally occurring contaminants such as arsenic or fluoride in groundwater.","hi":"प्राकृतिक स्रोत में अपरदन/अवसाद, ज्वालामुखीय राख, क्षयमान कार्बनिक पदार्थ, लवणीय जल का प्रवेश और भूजल में प्राकृतिक रूप से पाए जाने वाले आर्सेनिक या फ्लोराइड जैसे संदूषक शामिल हो सकते हैं।"},{"en":"Domestic/Industrial waste and oil spills.","hi":"घरेलू/औद्योगिक कचरा और तेल रिसाव।"},{"en":"Use of agricultural chemicals and pesticides.","hi":"कृषि रसायनों और कीटनाशकों का उपयोग।"},{"en":"Nuclear plant waste.","hi":"परमाणु संयंत्र का कचरा।"}],"exp":{"en":"Natural sources can include erosion and sediment, volcanic ash, decaying organic matter, saline intrusion and naturally occurring contaminants such as arsenic or fluoride in groundwater. Some contaminants are geogenic rather than human-made; arsenic and fluoride in groundwater are important examples of naturally occurring chemical contamination.","hi":"प्राकृतिक स्रोत में अपरदन/अवसाद, ज्वालामुखीय राख, क्षयमान कार्बनिक पदार्थ, लवणीय जल का प्रवेश और भूजल में प्राकृतिक रूप से पाए जाने वाले आर्सेनिक या फ्लोराइड जैसे संदूषक शामिल हो सकते हैं। कुछ संदूषक मानव-निर्मित नहीं बल्कि भूजनित होते हैं; भूजल में आर्सेनिक और फ्लोराइड प्राकृतिक रूप से पाए जाने वाले रासायनिक संदूषण के महत्वपूर्ण उदाहरण हैं।"}},{"q":{"en":"Which water-borne viral infections can produce jaundice as a symptom?","hi":"कौन-सी जल-जनित विषाणुजनित संक्रमण पीलिया को लक्षण के रूप में उत्पन्न कर सकती हैं?"},"a":{"en":"Hepatitis A and Hepatitis E; jaundice itself is a symptom, not a single disease caused only by one virus.","hi":"हेपेटाइटिस A और हेपेटाइटिस E; पीलिया स्वयं एक लक्षण है, ऐसा एकमात्र रोग नहीं है जो केवल एक विषाणु से होता हो।"},"o":[{"en":"Hepatitis A and Hepatitis E; jaundice itself is a symptom, not a single disease caused only by one virus.","hi":"हेपेटाइटिस A और हेपेटाइटिस E; पीलिया स्वयं एक लक्षण है, ऐसा एकमात्र रोग नहीं है जो केवल एक विषाणु से होता हो।"},{"en":"Mercury poisoning only.","hi":"केवल पारा विषाक्तता।"},{"en":"Nitrate poisoning only.","hi":"केवल नाइट्रेट विषाक्तता।"},{"en":"Typhoid bacteria only.","hi":"केवल टाइफाइड जीवाणु।"}],"exp":{"en":"Hepatitis A and Hepatitis E; jaundice itself is a symptom, not a single disease caused only by one virus. Hepatitis A and E are commonly transmitted through faecally contaminated food or water and can cause jaundice; jaundice itself has many other infectious and non-infectious causes.","hi":"हेपेटाइटिस A और हेपेटाइटिस E; पीलिया स्वयं एक लक्षण है, ऐसा एकमात्र रोग नहीं है जो केवल एक विषाणु से होता हो। हेपेटाइटिस A और E मल द्वारा संदूषित खाद्य/जल से सामान्यतः संचारित होते हैं और पीलिया उत्पन्न कर सकते हैं; पीलिया के अनेक अन्य संक्रामक/गैर-संक्रामक कारण भी होते हैं।"}},{"q":{"en":"Minamata disease is classically caused by exposure to which pollutant?","hi":"मिनामाता रोग परंपरागत रूप से किस प्रदूषक संपर्क से होती है?"},"a":{"en":"Methylmercury.","hi":"मिथाइल मरकरी।"},"o":[{"en":"Methylmercury.","hi":"मिथाइल मरकरी।"},{"en":"Cadmium.","hi":"कैडमियम।"},{"en":"Arsenic.","hi":"आर्सेनिक।"},{"en":"Nitrates.","hi":"नाइट्रेट।"}],"exp":{"en":"Methylmercury. Minamata disease is severe neurological poisoning caused by methylmercury that bioaccumulated and biomagnified in aquatic food chains.","hi":"मिथाइल मरकरी। मिनामाता रोग गंभीर तंत्रिका संबंधी विषाक्तता है जो जलीय खाद्य शृंखला में जैव-संचित/जैव-आवर्धित हुए मिथाइल मरकरी के कारण होती है।"}},{"q":{"en":"Blue-baby syndrome associated with contaminated drinking water is linked mainly to what?","hi":"संदूषित पेय जल से संबद्ध ब्लू-बेबी सिंड्रोम मुख्यतः किससे संबंधित है?"},"a":{"en":"High nitrate exposure, which can be converted to nitrite and cause methaemoglobinaemia in infants.","hi":"उच्च नाइट्रेट संपर्क, जो नाइट्राइट में बदलकर शिशुओं में मीथेमोग्लोबिनेमिया उत्पन्न कर सकता है।"},"o":[{"en":"High nitrate exposure, which can be converted to nitrite and cause methaemoglobinaemia in infants.","hi":"उच्च नाइट्रेट संपर्क, जो नाइट्राइट में बदलकर शिशुओं में मीथेमोग्लोबिनेमिया उत्पन्न कर सकता है।"},{"en":"Mercury poisoning.","hi":"पारा विषाक्तता।"},{"en":"Cadmium poisoning.","hi":"कैडमियम विषाक्तता।"},{"en":"Arsenic poisoning.","hi":"आर्सेनिक विषाक्तता।"}],"exp":{"en":"High nitrate exposure, which can be converted to nitrite and cause methaemoglobinaemia in infants. Nitrate can be reduced to nitrite, which oxidises haemoglobin to methaemoglobin and reduces oxygen transport, making young infants especially vulnerable.","hi":"उच्च नाइट्रेट संपर्क, जो नाइट्राइट में बदलकर शिशुओं में मीथेमोग्लोबिनेमिया उत्पन्न कर सकता है। नाइट्रेट नाइट्राइट में कम हो सकता है, जो हीमोग्लोबिन को मीथेमोग्लोबिन में ऑक्सीकृत करके ऑक्सीजन परिवहन कम करता है; छोटे शिशु विशेष रूप से सुभेद्य होते हैं।"}},{"q":{"en":"Which statement correctly describes cholera, typhoid and dysentery?","hi":"हैजा, टाइफाइड और पेचिश के बारे में कौन-सा कथन सही है?"},"a":{"en":"Cholera is caused by Vibrio cholerae and typhoid by Salmonella Typhi; dysentery may be bacterial (for example Shigella) or amoebic (Entamoeba histolytica).","hi":"हैजा विब्रियो कॉलेरी से और टाइफाइड साल्मोनेला टाइफी से होता है; पेचिश जीवाणुजनित (जैसे शिगेला) या अमीबी (एंटअमीबा हिस्टोलिटिका) हो सकती है।"},"o":[{"en":"Cholera is caused by Vibrio cholerae and typhoid by Salmonella Typhi; dysentery may be bacterial (for example Shigella) or amoebic (Entamoeba histolytica).","hi":"हैजा विब्रियो कॉलेरी से और टाइफाइड साल्मोनेला टाइफी से होता है; पेचिश जीवाणुजनित (जैसे शिगेला) या अमीबी (एंटअमीबा हिस्टोलिटिका) हो सकती है।"},{"en":"All three are always caused by the same bacterium.","hi":"तीनों हमेशा समान जीवाणु से होते हैं।"},{"en":"All three are viral diseases.","hi":"तीनों विषाणुजनित रोग हैं।"},{"en":"All three are heavy-metal poisoning diseases.","hi":"तीनों भारी-धातु विषाक्तता रोग हैं।"}],"exp":{"en":"Cholera is caused by Vibrio cholerae and typhoid by Salmonella Typhi; dysentery may be bacterial (for example Shigella) or amoebic (Entamoeba histolytica). Cholera and typhoid are specific bacterial infections, whereas 'dysentery' is a clinical syndrome with more than one possible cause, including bacterial and amoebic infection.","hi":"हैजा विब्रियो कॉलेरी से और टाइफाइड साल्मोनेला टाइफी से होता है; पेचिश जीवाणुजनित (जैसे शिगेला) या अमीबी (एंटअमीबा हिस्टोलिटिका) हो सकती है। हैजा और टाइफाइड विशिष्ट जीवाणुजनित संक्रमण हैं, जबकि 'पेचिश' नैदानिक लक्षण-समूह है जिसके जीवाणुजनित और अमीबी सहित अनेक कारण हो सकते हैं।"}},{"q":{"en":"Itai-Itai disease is classically associated with chronic exposure to which metal?","hi":"इटाई-इटाई रोग परंपरागत रूप से किस धातु के दीर्घकालिक संपर्क से संबद्ध है?"},"a":{"en":"Cadmium.","hi":"कैडमियम।"},"o":[{"en":"Cadmium.","hi":"कैडमियम।"},{"en":"Mercury.","hi":"पारा।"},{"en":"Arsenic.","hi":"आर्सेनिक।"},{"en":"Nitrates.","hi":"नाइट्रेट्स।"}],"exp":{"en":"Cadmium. Chronic cadmium exposure can damage kidneys and bones; the historical Itai-Itai episode in Japan is the classic example.","hi":"कैडमियम। दीर्घकालिक कैडमियम संपर्क गुर्दों और अस्थियों को क्षति कर सकता है; जापान का ऐतिहासिक इटाई-इटाई घटना प्रमुख उदाहरण है।"}},{"q":{"en":"Blackfoot disease is classically associated with chronic exposure to which contaminant?","hi":"ब्लैकफुट रोग परंपरागत रूप से किस संदूषक के दीर्घकालिक संपर्क से संबद्ध है?"},"a":{"en":"Arsenic.","hi":"आर्सेनिक।"},"o":[{"en":"Arsenic.","hi":"आर्सेनिक।"},{"en":"Mercury.","hi":"पारा।"},{"en":"Cadmium.","hi":"कैडमियम।"},{"en":"Strontium-90.","hi":"स्ट्रोंटियम-90।"}],"exp":{"en":"Arsenic. Blackfoot disease is a severe peripheral vascular condition classically associated with long-term ingestion of arsenic-contaminated groundwater.","hi":"आर्सेनिक। ब्लैकफुट रोग गंभीर परिधीय संवहनी स्थिति है जो परंपरागत रूप से दीर्घकालिक आर्सेनिक-संदूषित भूजल अंतर्ग्रहण से संबद्ध है।"}},{"q":{"en":"What is BOD?","hi":"BOD क्या है?"},"a":{"en":"Biochemical Oxygen Demand — the amount of dissolved oxygen consumed by microorganisms while decomposing biodegradable organic matter under specified test conditions; higher BOD generally indicates greater biodegradable organic pollution.","hi":"जैव-रासायनिक ऑक्सीजन माँग - निर्दिष्ट परीक्षण स्थितियों में जैव-अवक्रमणीय कार्बनिक पदार्थ अपघटित करते समय सूक्ष्मजीवों द्वारा उपभोग की गई घुलित ऑक्सीजन की मात्रा; उच्चतर BOD सामान्यतः अधिक जैव-अवक्रमणीय कार्बनिक प्रदूषण को इंगित करता है।"},"o":[{"en":"Biochemical Oxygen Demand — the amount of dissolved oxygen consumed by microorganisms while decomposing biodegradable organic matter under specified test conditions; higher BOD generally indicates greater biodegradable organic pollution.","hi":"जैव-रासायनिक ऑक्सीजन माँग - निर्दिष्ट परीक्षण स्थितियों में जैव-अवक्रमणीय कार्बनिक पदार्थ अपघटित करते समय सूक्ष्मजीवों द्वारा उपभोग की गई घुलित ऑक्सीजन की मात्रा; उच्चतर BOD सामान्यतः अधिक जैव-अवक्रमणीय कार्बनिक प्रदूषण को इंगित करता है।"},{"en":"Biological Ozone Depletion — the rate at which ozone is destroyed.","hi":"जैविक ओजोन रिक्तीकरण - वह दर जिस पर ओजोन नष्ट हो जाती है।"},{"en":"Basic Oxygen Density — the total oxygen dissolved in pure water.","hi":"बेसिक ऑक्सीजन घनत्व - शुद्ध पानी में घुली कुल ऑक्सीजन।"},{"en":"Bacterial Overload Disease — an illness caused by dirty water.","hi":"बैक्टीरियल ओवरलोड रोग - गंदे पानी के कारण होने वाली बीमारी।"}],"exp":{"en":"Biochemical Oxygen Demand — the amount of dissolved oxygen consumed by microorganisms while decomposing biodegradable organic matter under specified test conditions; higher BOD generally indicates greater biodegradable organic pollution. BOD is usually measured under standardised time/temperature conditions, commonly BOD5 at 20°C. A high BOD means microorganisms are consuming more dissolved oxygen, which can stress aquatic life.","hi":"जैव-रासायनिक ऑक्सीजन माँग - निर्दिष्ट परीक्षण स्थितियों में जैव-अवक्रमणीय कार्बनिक पदार्थ अपघटित करते समय सूक्ष्मजीवों द्वारा उपभोग की गई घुलित ऑक्सीजन की मात्रा; उच्चतर BOD सामान्यतः अधिक जैव-अवक्रमणीय कार्बनिक प्रदूषण को इंगित करता है। BOD मानकीकृत समय/तापमान की निर्धारित स्थितियों में मापा जाता है, सामान्यतः BOD5 पर 20°C। उच्च BOD का मतलब सूक्ष्मजीव ज्यादा घुलित ऑक्सीजन उपभोग कर रहे हैं, जिससे जलीय जीवन तनावग्रस्त हो सकता है।"}},{"q":{"en":"How do Ganga Action Plan and Namami Gange differ?","hi":"गंगा कार्रवाई योजना और नमामि गंगे में क्या अंतर है?"},"a":{"en":"Ganga Action Plan was an earlier river-pollution-abatement programme launched in 1985; Namami Gange was launched in 2014 as a broader Ganga rejuvenation programme under the National Mission for Clean Ganga, whose activities continued in 2026.","hi":"गंगा कार्रवाई योजना 1985 में शुरू किया गया पहले नदी-प्रदूषण-उन्मूलन कार्यक्रम था; नमामि गंगे 2014 में राष्ट्रीय मिशन के लिए स्वच्छ गंगा के अंतर्गत व्यापक गंगा पुनर्जीवन कार्यक्रम के रूप में शुरू हुआ, जिसकी गतिविधियाँ 2026 में भी जारी रहीं।"},"o":[{"en":"Ganga Action Plan was an earlier river-pollution-abatement programme launched in 1985; Namami Gange was launched in 2014 as a broader Ganga rejuvenation programme under the National Mission for Clean Ganga, whose activities continued in 2026.","hi":"गंगा कार्रवाई योजना 1985 में शुरू किया गया पहले नदी-प्रदूषण-उन्मूलन कार्यक्रम था; नमामि गंगे 2014 में राष्ट्रीय मिशन के लिए स्वच्छ गंगा के अंतर्गत व्यापक गंगा पुनर्जीवन कार्यक्रम के रूप में शुरू हुआ, जिसकी गतिविधियाँ 2026 में भी जारी रहीं।"},{"en":"They are exactly the same scheme with the same launch year.","hi":"दोनों ठीक समान योजना हैं और समान वर्ष शुरुआत हुए।"},{"en":"Namami Gange is older than Ganga Action Plan.","hi":"नमामि गंगे, गंगा कार्रवाई योजना से पुराना है।"},{"en":"One is for Yamuna and the other is for Ganga.","hi":"एक यमुना के लिए और दूसरा गंगा के लिए है।"}],"exp":{"en":"Ganga Action Plan was an earlier river-pollution-abatement programme launched in 1985; Namami Gange was launched in 2014 as a broader Ganga rejuvenation programme under the National Mission for Clean Ganga, whose activities continued in 2026. The two programmes belong to different policy generations. Namami Gange uses a broader river-rejuvenation approach including sewage infrastructure, ecology, flow, public participation and basin management.","hi":"गंगा कार्रवाई योजना 1985 में शुरू किया गया पहले नदी-प्रदूषण-उन्मूलन कार्यक्रम था; नमामि गंगे 2014 में राष्ट्रीय मिशन के लिए स्वच्छ गंगा के अंतर्गत व्यापक गंगा पुनर्जीवन कार्यक्रम के रूप में शुरू हुआ, जिसकी गतिविधियाँ 2026 में भी जारी रहीं। दोनों कार्यक्रम अलग नीति पीढ़ियों के हैं। नमामि गंगे व्यापक नदी-पुनर्जीवन दृष्टिकोण उपयोग करता है जिसमें मलजल अवसंरचना, पारिस्थितिकी, प्रवाह, सार्वजनिक भागीदारी और बेसिन प्रबंधन शामिल हैं।"}}]},{"title":{"en":"5. Soil Pollution","hi":"5। मृदा प्रदूषण"},"questions":[{"q":{"en":"What is soil pollution?","hi":"मृदा प्रदूषण क्या है?"},"a":{"en":"Contamination of soil by harmful chemicals, wastes or other pollutants that degrades soil quality and can harm organisms, crops, groundwater or human health.","hi":"हानिकारक रसायन, अपशिष्ट या अन्य प्रदूषक से मृदा संदूषण जो मृदा गुणवत्ता खराब करे और जीवों, फसलें, भूजल या मानव स्वास्थ्य को हानि कर सके।"},"o":[{"en":"Contamination of soil by harmful chemicals, wastes or other pollutants that degrades soil quality and can harm organisms, crops, groundwater or human health.","hi":"हानिकारक रसायन, अपशिष्ट या अन्य प्रदूषक से मृदा संदूषण जो मृदा गुणवत्ता खराब करे और जीवों, फसलें, भूजल या मानव स्वास्थ्य को हानि कर सके।"},{"en":"The natural process of soil formation.","hi":"मिट्टी निर्माण की प्राकृतिक प्रक्रिया।"},{"en":"The addition of pure organic humus to soil.","hi":"मिट्टी में शुद्ध कार्बनिक ह्यूमस मिलाना।"},{"en":"The freezing of soil in winter.","hi":"सर्दियों में मिट्टी का जमना।"}],"exp":{"en":"Contamination of soil by harmful chemicals, wastes or other pollutants that degrades soil quality and can harm organisms, crops, groundwater or human health. Pollution is specifically about harmful contamination; soil erosion or declining fertility can be soil degradation without necessarily being soil pollution.","hi":"हानिकारक रसायन, अपशिष्ट या अन्य प्रदूषक से मृदा संदूषण जो मृदा गुणवत्ता खराब करे और जीवों, फसलें, भूजल या मानव स्वास्थ्य को हानि कर सके। प्रदूषण विशेष रूप से हानिकारक संदूषण को संदर्भित करता है; मृदा अपरदन या घटती उर्वरता मृदा क्षरण हो सकते हैं लेकिन अनिवार्यतः मृदा प्रदूषण नहीं।"}},{"q":{"en":"What are major causes of soil pollution?","hi":"मृदा प्रदूषण के प्रमुख कारण क्या हैं?"},"a":{"en":"Excessive or improper use of pesticides and fertilisers, industrial and municipal waste, hazardous chemical spills, mining residues, sewage/sludge contamination and improper waste disposal.","hi":"कीटनाशक/उर्वरक का अत्यधिक या अनुचित उपयोग, औद्योगिक/नगरपालिका अपशिष्ट, खतरनाक रासायनिक रिसाव, खनन अवशेष, मलजल/कीचड़ संदूषण और अनुचित अपशिष्ट निपटान।"},"o":[{"en":"Excessive or improper use of pesticides and fertilisers, industrial and municipal waste, hazardous chemical spills, mining residues, sewage/sludge contamination and improper waste disposal.","hi":"कीटनाशक/उर्वरक का अत्यधिक या अनुचित उपयोग, औद्योगिक/नगरपालिका अपशिष्ट, खतरनाक रासायनिक रिसाव, खनन अवशेष, मलजल/कीचड़ संदूषण और अनुचित अपशिष्ट निपटान।"},{"en":"Crop rotation and mulching.","hi":"फसल चक्र और पलवार बिछाना।"},{"en":"Organic compost and vermiculture alone.","hi":"केवल कार्बनिक कम्पोस्ट और केंचुआ-पालन।"},{"en":"Afforestation and shelter belts.","hi":"वनीकरण और वायु-अवरोधक वृक्ष-पट्टी।"}],"exp":{"en":"Excessive or improper use of pesticides and fertilisers, industrial and municipal waste, hazardous chemical spills, mining residues, sewage/sludge contamination and improper waste disposal. Persistent pesticides, heavy metals and poorly managed hazardous wastes can remain in soil for long periods and move into crops, groundwater or food chains.","hi":"कीटनाशक/उर्वरक का अत्यधिक या अनुचित उपयोग, औद्योगिक/नगरपालिका अपशिष्ट, खतरनाक रासायनिक रिसाव, खनन अवशेष, मलजल/कीचड़ संदूषण और अनुचित अपशिष्ट निपटान। स्थायी कीटनाशक, भारी धातुओं और खराब तरीके से प्रबंधित खतरनाक अपशिष्ट मृदा में लंबी अवधियों तक रहकर फसलें, भूजल या खाद्य शृंखलाएँ में बढ़ना कर सकते हैं।"}},{"q":{"en":"What are effective measures to control soil pollution?","hi":"मृदा प्रदूषण नियंत्रण के प्रभावी उपाय क्या हैं?"},"a":{"en":"Reduce and rationalise agrochemical use, segregate and safely treat/dispose wastes, prevent hazardous spills, recycle/recover materials and use remediation or bioremediation where contamination has occurred.","hi":"कृषि-रसायन उपयोग को कम/युक्तिसंगत करना, अपशिष्ट को पृथक और सुरक्षित रूप से मानना/निपटान करना, खतरनाक रिसाव रोकना करना, सामग्री पुनर्चक्रित/पुनर्प्राप्त करना और संदूषण होने पर उपचार/जैव-उपचार उपयोग करना।"},"o":[{"en":"Reduce and rationalise agrochemical use, segregate and safely treat/dispose wastes, prevent hazardous spills, recycle/recover materials and use remediation or bioremediation where contamination has occurred.","hi":"कृषि-रसायन उपयोग को कम/युक्तिसंगत करना, अपशिष्ट को पृथक और सुरक्षित रूप से मानना/निपटान करना, खतरनाक रिसाव रोकना करना, सामग्री पुनर्चक्रित/पुनर्प्राप्त करना और संदूषण होने पर उपचार/जैव-उपचार उपयोग करना।"},{"en":"Increase DDT and other persistent pesticide use.","hi":"DDT और अन्य स्थायी कीटनाशक का उपयोग बढ़ाना।"},{"en":"Dump untreated industrial waste on land.","hi":"अनुपचारित औद्योगिक अपशिष्ट भूमि पर फेंकना करना।"},{"en":"Encourage deforestation to clear contaminated land.","hi":"संदूषित भूमि स्पष्ट करने के लिए वनोन्मूलन प्रोत्साहित करना।"}],"exp":{"en":"Reduce and rationalise agrochemical use, segregate and safely treat/dispose wastes, prevent hazardous spills, recycle/recover materials and use remediation or bioremediation where contamination has occurred. Prevention is preferable to cleanup: source reduction, safe waste management and spill control come first; remediation is used after contamination has occurred.","hi":"कृषि-रसायन उपयोग को कम/युक्तिसंगत करना, अपशिष्ट को पृथक और सुरक्षित रूप से मानना/निपटान करना, खतरनाक रिसाव रोकना करना, सामग्री पुनर्चक्रित/पुनर्प्राप्त करना और संदूषण होने पर उपचार/जैव-उपचार उपयोग करना। सफाई से निवारण वरीय है: स्रोत पर कमी, सुरक्षित अपशिष्ट प्रबंधन और रिसाव नियंत्रण पहले आते हैं; संदूषण होने के बाद उपचार उपयोग की जाती है।"}},{"q":{"en":"What are major impacts of soil pollution?","hi":"मृदा प्रदूषण के प्रमुख प्रभाव क्या हैं?"},"a":{"en":"Reduced soil fertility and productivity, toxicity to soil organisms and plants, contamination of crops and groundwater, ecosystem damage and human-health risks through exposure or the food chain.","hi":"कम मृदा उर्वरता/उत्पादकता, मृदा जीवों और पौधे पर विषाक्तता, फसलें/भूजल संदूषण, पारितंत्र क्षति और संपर्क या खाद्य शृंखला के माध्यम से मानवीय-स्वास्थ्य जोखिम।"},"o":[{"en":"Reduced soil fertility and productivity, toxicity to soil organisms and plants, contamination of crops and groundwater, ecosystem damage and human-health risks through exposure or the food chain.","hi":"कम मृदा उर्वरता/उत्पादकता, मृदा जीवों और पौधे पर विषाक्तता, फसलें/भूजल संदूषण, पारितंत्र क्षति और संपर्क या खाद्य शृंखला के माध्यम से मानवीय-स्वास्थ्य जोखिम।"},{"en":"Higher crop yield and healthier plants in all cases.","hi":"हर स्थिति में उच्चतर फसल उपज और अधिक स्वस्थ पौधे।"},{"en":"Complete prevention of soil erosion.","hi":"मृदा अपरदन का पूर्ण निवारण।"},{"en":"Automatic purification of groundwater.","hi":"भूजल का स्वतः शुद्धीकरण।"}],"exp":{"en":"Reduced soil fertility and productivity, toxicity to soil organisms and plants, contamination of crops and groundwater, ecosystem damage and human-health risks through exposure or the food chain. Soil pollutants can alter pH, microbial communities and nutrient cycling, reduce crop productivity and create exposure through food, dust or groundwater.","hi":"कम मृदा उर्वरता/उत्पादकता, मृदा जीवों और पौधे पर विषाक्तता, फसलें/भूजल संदूषण, पारितंत्र क्षति और संपर्क या खाद्य शृंखला के माध्यम से मानवीय-स्वास्थ्य जोखिम। मृदा प्रदूषक pH, सूक्ष्मजीवी समुदाय और पोषक तत्त्व चक्रण बदलती कर सकते हैं, फसल उत्पादकता कम कर सकते हैं और खाद्य, धूल या भूजल के माध्यम से संपर्क स्थापित कर सकते हैं।"}}]},{"title":{"en":"6. Noise Pollution","hi":"6। ध्वनि प्रदूषण"},"questions":[{"q":{"en":"How is noise pollution defined, and is 65 dB a universal legal threshold in India?","hi":"ध्वनि प्रदूषण को कैसे परिभाषित किया जाता है, और क्या भारत में 65 dB सार्वभौमिक कानूनी सीमा है?"},"a":{"en":"Noise pollution is unwanted or excessive sound that adversely affects health or well-being; India does not use one universal 65 dB limit—permissible ambient limits depend on area category and day/night period.","hi":"ध्वनि प्रदूषण अवांछित या अत्यधिक ध्वनि है जो स्वास्थ्य/कल्याण को प्रतिकूल रूप से प्रभावित करे; भारत में एकमात्र सार्वभौमिक 65 dB सीमा नहीं है-अनुमेय परिवेशीय सीमाएँ क्षेत्र श्रेणी और दिन/रात अवधि पर निर्भर करते हैं।"},"o":[{"en":"Noise pollution is unwanted or excessive sound that adversely affects health or well-being; India does not use one universal 65 dB limit—permissible ambient limits depend on area category and day/night period.","hi":"ध्वनि प्रदूषण अवांछित या अत्यधिक ध्वनि है जो स्वास्थ्य/कल्याण को प्रतिकूल रूप से प्रभावित करे; भारत में एकमात्र सार्वभौमिक 65 dB सीमा नहीं है-अनुमेय परिवेशीय सीमाएँ क्षेत्र श्रेणी और दिन/रात अवधि पर निर्भर करते हैं।"},{"en":"Any audible sound above 20 dB is legally noise pollution everywhere.","hi":"20 dB से ऊपर कोई श्रव्य ध्वनि हर जगह कानूनी रूप से ध्वनि प्रदूषण है।"},{"en":"Only sound above 100 dB counts as noise pollution.","hi":"केवल 100 dB से ऊपर ध्वनि प्रदूषण है।"},{"en":"India has no ambient noise standards.","hi":"भारत में परिवेशीय ध्वनि मानक नहीं हैं।"}],"exp":{"en":"Noise pollution is unwanted or excessive sound that adversely affects health or well-being; India does not use one universal 65 dB limit—permissible ambient limits depend on area category and day/night period. India's legal standards use dB(A) Leq and vary by land-use zone. Day is 6 a.m.–10 p.m. and night is 10 p.m.–6 a.m. under the Noise Rules.","hi":"ध्वनि प्रदूषण अवांछित या अत्यधिक ध्वनि है जो स्वास्थ्य/कल्याण को प्रतिकूल रूप से प्रभावित करे; भारत में एकमात्र सार्वभौमिक 65 dB सीमा नहीं है-अनुमेय परिवेशीय सीमाएँ क्षेत्र श्रेणी और दिन/रात अवधि पर निर्भर करते हैं। भारत के कानूनी मानक dB(A) Leq उपयोग करते हैं और भूमि-उपयोग क्षेत्र के अनुसार बदलते हैं। ध्वनि नियम में दिन 6 a.m.-10 p.m। और रात 10 p.m.-6 a.m। है।"}},{"q":{"en":"What are natural sources of environmental noise?","hi":"पर्यावरणीय ध्वनि के प्राकृतिक स्रोत क्या हैं?"},"a":{"en":"Thunder, earthquakes, volcanic eruptions, strong winds and other natural acoustic events.","hi":"मेघगर्जन, भूकंप, ज्वालामुखीय विस्फोट, मजबूत पवन और अन्य प्राकृतिक ध्वनिक कार्यक्रम।"},"o":[{"en":"Thunder, earthquakes, volcanic eruptions, strong winds and other natural acoustic events.","hi":"मेघगर्जन, भूकंप, ज्वालामुखीय विस्फोट, मजबूत पवन और अन्य प्राकृतिक ध्वनिक कार्यक्रम।"},{"en":"Loudspeakers and radios.","hi":"लाउडस्पीकर और रेडियो।"},{"en":"Industrial machinery.","hi":"औद्योगिक मशीनरी।"},{"en":"Vehicle horns and aircraft.","hi":"वाहनों के हॉर्न और विमान।"}],"exp":{"en":"Thunder, earthquakes, volcanic eruptions, strong winds and other natural acoustic events. Natural sound can be intense, but environmental-noise regulation mainly focuses on human-generated sources that can be controlled.","hi":"मेघगर्जन, भूकंप, ज्वालामुखीय विस्फोट, मजबूत पवन और अन्य प्राकृतिक ध्वनिक कार्यक्रम। प्राकृतिक ध्वनि तीव्र हो सकता है, लेकिन पर्यावरणीय-ध्वनि विनियमन मुख्यतः मानवीय-उत्पन्न नियंत्रण योग्य स्रोत पर केंद्रित है।"}},{"q":{"en":"What are the Human-Induced Causes of Noise Pollution?","hi":"ध्वनि प्रदूषण के मानव-प्रेरित (मानवजनित) कारण क्या हैं?"},"a":{"en":"Road, rail and air traffic, industrial/construction machinery, generators, loudspeakers, amplified music and other human activities.","hi":"सड़क, रेल और वायु यातायात, औद्योगिक/निर्माण मशीनरी, जनरेटर, लाउडस्पीकर, तेज़ ध्वनि वाला संगीत और अन्य मानवीय गतिविधियाँ।"},"o":[{"en":"Road, rail and air traffic, industrial/construction machinery, generators, loudspeakers, amplified music and other human activities.","hi":"सड़क, रेल और वायु यातायात, औद्योगिक/निर्माण मशीनरी, जनरेटर, लाउडस्पीकर, तेज़ ध्वनि वाला संगीत और अन्य मानवीय गतिविधियाँ।"},{"en":"Thunder and lightning.","hi":"गड़गड़ाहट और बिजली।"},{"en":"Earthquakes and volcanic eruptions.","hi":"भूकंप और ज्वालामुखी विस्फोट।"},{"en":"Wind howling through trees.","hi":"पेड़ों के बीच हवा का शोर।"}],"exp":{"en":"Road, rail and air traffic, industrial/construction machinery, generators, loudspeakers, amplified music and other human activities. Transport, construction and industry are major chronic community-noise sources; amplified sound can create intense local and event-based exposure.","hi":"सड़क, रेल और वायु यातायात, औद्योगिक/निर्माण मशीनरी, जनरेटर, लाउडस्पीकर, तेज़ ध्वनि वाला संगीत और अन्य मानवीय गतिविधियाँ। परिवहन, निर्माण और उद्योग प्रमुख दीर्घकालिक समुदाय-ध्वनि स्रोत हैं; तीव्र ध्वनि तीव्र स्थानीय/घटना-आधारित संपर्क स्थापित कर सकता है।"}},{"q":{"en":"What are well-established health impacts of excessive environmental noise?","hi":"अत्यधिक पर्यावरणीय ध्वनि के सुप्रमाणित स्वास्थ्य प्रभाव क्या हैं?"},"a":{"en":"Hearing impairment/tinnitus, sleep disturbance, annoyance and stress, hypertension and other cardiovascular effects, and cognitive impairment or reduced performance.","hi":"श्रवण क्षमता में कमी/कर्णक्ष्वेद, नींद में व्यवधान, झुंझलाहट/तनाव, उच्च रक्तचाप और अन्य हृदय-वाहिका संबंधी प्रभाव, तथा संज्ञानात्मक क्षमता में कमी या कम कार्य-क्षमता।"},"o":[{"en":"Hearing impairment/tinnitus, sleep disturbance, annoyance and stress, hypertension and other cardiovascular effects, and cognitive impairment or reduced performance.","hi":"श्रवण क्षमता में कमी/कर्णक्ष्वेद, नींद में व्यवधान, झुंझलाहट/तनाव, उच्च रक्तचाप और अन्य हृदय-वाहिका संबंधी प्रभाव, तथा संज्ञानात्मक क्षमता में कमी या कम कार्य-क्षमता।"},{"en":"Cholera, typhoid and dysentery.","hi":"हैजा, टाइफाइड और पेचिश।"},{"en":"Minamata and Itai-Itai diseases.","hi":"मिनामाता और इटाई-इटाई रोग।"},{"en":"Only skin pigmentation changes.","hi":"केवल त्वचा के रंजकता परिवर्तन।"}],"exp":{"en":"Hearing impairment/tinnitus, sleep disturbance, annoyance and stress, hypertension and other cardiovascular effects, and cognitive impairment or reduced performance. WHO evidence links excessive environmental noise with sleep disturbance, hearing and cognitive impairment, annoyance, hypertension and other cardiovascular outcomes.","hi":"श्रवण क्षमता में कमी/कर्णक्ष्वेद, नींद में व्यवधान, झुंझलाहट/तनाव, उच्च रक्तचाप और अन्य हृदय-वाहिका संबंधी प्रभाव, तथा संज्ञानात्मक क्षमता में कमी या कम कार्य-क्षमता। WHO साक्ष्य अत्यधिक पर्यावरणीय ध्वनि को नींद में व्यवधान, श्रवण/संज्ञानात्मक क्षमता में कमी, झुंझलाहट, उच्च रक्तचाप और अन्य हृदय-वाहिका संबंधी परिणाम से जोड़ता है।"}},{"q":{"en":"What are the measures to control Noise Pollution?","hi":"ध्वनि प्रदूषण को नियंत्रित करने के उपाय क्या हैं?"},"a":{"en":"Source control and quieter equipment, maintenance and silencers, traffic management, barriers and sound insulation, zoning/setback planning, green buffers, and enforcement of limits on horns/loudspeakers and other noise sources.","hi":"स्रोत नियंत्रण और कम शोर वाले उपकरण, रखरखाव/साइलेंसर, यातायात प्रबंधन, अवरोधक/ध्वनि-रोधन, क्षेत्रीकरण/पर्याप्त दूरी नियोजन, हरित सुरक्षात्मक पट्टियाँ और हॉर्न/लाउडस्पीकर तथा अन्य ध्वनि स्रोतों पर सीमाओं का प्रवर्तन।"},"o":[{"en":"Source control and quieter equipment, maintenance and silencers, traffic management, barriers and sound insulation, zoning/setback planning, green buffers, and enforcement of limits on horns/loudspeakers and other noise sources.","hi":"स्रोत नियंत्रण और कम शोर वाले उपकरण, रखरखाव/साइलेंसर, यातायात प्रबंधन, अवरोधक/ध्वनि-रोधन, क्षेत्रीकरण/पर्याप्त दूरी नियोजन, हरित सुरक्षात्मक पट्टियाँ और हॉर्न/लाउडस्पीकर तथा अन्य ध्वनि स्रोतों पर सीमाओं का प्रवर्तन।"},{"en":"Using bioremediation and composting.","hi":"बायोरेमेडिएशन और खाद का उपयोग करना।"},{"en":"Adding chlorine to water.","hi":"पानी में क्लोरीन मिलाना।"},{"en":"Banning CFCs and halons.","hi":"सीएफसी और हैलोन पर प्रतिबंध।"}],"exp":{"en":"Source control and quieter equipment, maintenance and silencers, traffic management, barriers and sound insulation, zoning/setback planning, green buffers, and enforcement of limits on horns/loudspeakers and other noise sources. Effective control combines action at the source, along the transmission path and at the receiver, supported by land-use planning and enforcement.","hi":"स्रोत नियंत्रण और कम शोर वाले उपकरण, रखरखाव/साइलेंसर, यातायात प्रबंधन, अवरोधक/ध्वनि-रोधन, क्षेत्रीकरण/पर्याप्त दूरी नियोजन, हरित सुरक्षात्मक पट्टियाँ और हॉर्न/लाउडस्पीकर तथा अन्य ध्वनि स्रोतों पर सीमाओं का प्रवर्तन। प्रभावी नियंत्रण स्रोत, संचरण मार्ग और ग्राही तीनों स्तर पर कार्रवाई संयोजित करता है, साथ में भूमि-उपयोग नियोजन और प्रवर्तन।"}},{"q":{"en":"What is the permissible noise level for an Industrial area (Day/Night)?","hi":"औद्योगिक क्षेत्र के लिए अनुमेय (अनुमेय) शोर स्तर (दिन/रात) क्या है?"},"a":{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"},"o":[{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"},{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"}],"exp":{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night). This is the statutory ambient noise standard for the Industrial category under India's Noise Pollution (Regulation and Control) Rules, 2000.","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)। यह भारत के ध्वनि प्रदूषण (विनियमन और नियंत्रण) नियम, 2000 के अंतर्गत औद्योगिक श्रेणी का वैधानिक परिवेशीय ध्वनि मानक है।"}},{"q":{"en":"What is the permissible noise level for a Commercial area (Day/Night)?","hi":"वाणिज्यिक क्षेत्र के लिए अनुमेय शोर स्तर (दिन/रात) क्या है?"},"a":{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},"o":[{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"},{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"}],"exp":{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night). This is the statutory ambient noise standard for the Commercial category under India's Noise Pollution (Regulation and Control) Rules, 2000.","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)। यह भारत के ध्वनि प्रदूषण (विनियमन और नियंत्रण) नियम, 2000 के अंतर्गत वाणिज्यिक श्रेणी का वैधानिक परिवेशीय ध्वनि मानक है।"}},{"q":{"en":"What is the permissible noise level for a Residential area (Day/Night)?","hi":"आवासीय (आवासीय) क्षेत्र के लिए अनुमेय शोर स्तर (दिन/रात) क्या है?"},"a":{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},"o":[{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"},{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"}],"exp":{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night). This is the statutory ambient noise standard for the Residential category under India's Noise Pollution (Regulation and Control) Rules, 2000.","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)। यह भारत के ध्वनि प्रदूषण (विनियमन और नियंत्रण) नियम, 2000 के अंतर्गत आवासीय श्रेणी का वैधानिक परिवेशीय ध्वनि मानक है।"}},{"q":{"en":"What is the permissible noise level for a Silence Zone (Day/Night)?","hi":"शांत क्षेत्र के लिए अनुमेय ध्वनि स्तर (दिन/रात) क्या है?"},"a":{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"},"o":[{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night).","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)।"},{"en":"55 dB(A) Leq (Day) / 45 dB(A) Leq (Night).","hi":"55 dB(A) Leq (दिन) / 45 dB(A) Leq (रात)।"},{"en":"65 dB(A) Leq (Day) / 55 dB(A) Leq (Night).","hi":"65 dB(A) Leq (दिन) / 55 dB(A) Leq (रात)।"},{"en":"75 dB(A) Leq (Day) / 70 dB(A) Leq (Night).","hi":"75 dB(A) Leq (दिन) / 70 dB(A) Leq (रात)।"}],"exp":{"en":"50 dB(A) Leq (Day) / 40 dB(A) Leq (Night). This is the statutory ambient noise standard for the Silence category under India's Noise Pollution (Regulation and Control) Rules, 2000.","hi":"50 dB(A) Leq (दिन) / 40 dB(A) Leq (रात)। यह भारत के ध्वनि प्रदूषण (विनियमन और नियंत्रण) नियम, 2000 के अंतर्गत शांत श्रेणी का वैधानिक परिवेशीय ध्वनि मानक है।"}}]},{"title":{"en":"7. Radioactive & Solid Waste Pollution","hi":"7। रेडियोधर्मी और ठोस अपशिष्ट प्रदूषण"},"questions":[{"q":{"en":"What is radioactive pollution?","hi":"रेडियोधर्मी प्रदूषण क्या है?"},"a":{"en":"Environmental contamination or harmful exposure caused by radionuclides or ionising radiation above normal/background or acceptable levels.","hi":"रेडियोन्यूक्लाइड या आयनकारी विकिरण के कारण पर्यावरणीय संदूषण या हानिकारक संपर्क, जो सामान्य/पृष्ठभूमि या स्वीकार्य स्तरों से ऊपर हो।"},"o":[{"en":"Environmental contamination or harmful exposure caused by radionuclides or ionising radiation above normal/background or acceptable levels.","hi":"रेडियोन्यूक्लाइड या आयनकारी विकिरण के कारण पर्यावरणीय संदूषण या हानिकारक संपर्क, जो सामान्य/पृष्ठभूमि या स्वीकार्य स्तरों से ऊपर हो।"},{"en":"Pollution from radio waves and cell phone towers.","hi":"रेडियो तरंगों और सेल फोन टावरों से प्रदूषण।"},{"en":"Pollution caused by loud radios and speakers.","hi":"तेज़ रेडियो और स्पीकर के कारण होने वाला प्रदूषण।"},{"en":"Pollution caused by the burning of plastics.","hi":"प्लास्टिक जलाने से होने वाला प्रदूषण।"}],"exp":{"en":"Environmental contamination or harmful exposure caused by radionuclides or ionising radiation above normal/background or acceptable levels. Not every natural radiation exposure is 'pollution'; the term is most useful when radioactive material or ionising-radiation exposure contaminates the environment or exceeds normal/acceptable conditions.","hi":"रेडियोन्यूक्लाइड या आयनकारी विकिरण के कारण पर्यावरणीय संदूषण या हानिकारक संपर्क, जो सामान्य/पृष्ठभूमि या स्वीकार्य स्तरों से ऊपर हो। हर प्राकृतिक विकिरण संपर्क 'प्रदूषण' नहीं है; शब्द तब सर्वाधिक उपयोगी है जब रेडियोधर्मी पदार्थ/आयनकारी विकिरण पर्यावरण संदूषित करे या सामान्य/स्वीकार्य स्थितियों से अधिक करे।"}},{"q":{"en":"What are major natural sources of ionising radiation exposure?","hi":"आयनकारी विकिरण संपर्क के प्रमुख प्राकृतिक स्रोत क्या हैं?"},"a":{"en":"Radon and other naturally occurring radionuclides in rocks/soil, terrestrial gamma radiation, cosmic radiation, and naturally occurring radionuclides in food and the body.","hi":"शैल/मृदा में रेडॉन और अन्य प्राकृतिक रूप से पाए जाने वाले रेडियोन्यूक्लाइड, स्थलीय गामा विकिरण, ब्रह्मांडीय विकिरण और खाद्य/निकाय में प्राकृतिक रूप से पाए जाने वाले रेडियोन्यूक्लाइड।"},"o":[{"en":"Radon and other naturally occurring radionuclides in rocks/soil, terrestrial gamma radiation, cosmic radiation, and naturally occurring radionuclides in food and the body.","hi":"शैल/मृदा में रेडॉन और अन्य प्राकृतिक रूप से पाए जाने वाले रेडियोन्यूक्लाइड, स्थलीय गामा विकिरण, ब्रह्मांडीय विकिरण और खाद्य/निकाय में प्राकृतिक रूप से पाए जाने वाले रेडियोन्यूक्लाइड।"},{"en":"Only nuclear weapons testing.","hi":"केवल परमाणु हथियार परीक्षण।"},{"en":"Only nuclear reactors and uranium mines.","hi":"केवल परमाणु रिएक्टरों और यूरेनियम खदानें।"},{"en":"Only medical X-rays.","hi":"केवल चिकित्सीय एक्स-किरणें।"}],"exp":{"en":"Radon and other naturally occurring radionuclides in rocks/soil, terrestrial gamma radiation, cosmic radiation, and naturally occurring radionuclides in food and the body. Radon is often the largest natural contributor to population radiation dose; cosmic and terrestrial radiation are other major natural components.","hi":"शैल/मृदा में रेडॉन और अन्य प्राकृतिक रूप से पाए जाने वाले रेडियोन्यूक्लाइड, स्थलीय गामा विकिरण, ब्रह्मांडीय विकिरण और खाद्य/निकाय में प्राकृतिक रूप से पाए जाने वाले रेडियोन्यूक्लाइड। रेडॉन जनसंख्या विकिरण मात्रा का प्रायः सबसे बड़ा प्राकृतिक योगदानकर्ता है; ब्रह्मांडीय और स्थलीय विकिरण अन्य प्रमुख प्राकृतिक घटक हैं।"}},{"q":{"en":"What are major human-made sources of ionising radiation exposure or radioactive contamination?","hi":"आयनकारी विकिरण संपर्क या रेडियोधर्मी संदूषण के प्रमुख मानव-निर्मित स्रोत क्या हैं?"},"a":{"en":"Medical imaging and nuclear medicine, nuclear reactors and fuel-cycle activities, industrial/research uses, nuclear weapons testing, and accidents or improper handling of radioactive materials.","hi":"चिकित्सीय इमेजिंग/परमाणु चिकित्सा, परमाणु रिएक्टरों और ईंधन-चक्र गतिविधियाँ, औद्योगिक/अनुसंधान उपयोग, परमाणु हथियार परीक्षण और रेडियोधर्मी सामग्री की दुर्घटनाएँ या अनुचित प्रबंधन।"},"o":[{"en":"Medical imaging and nuclear medicine, nuclear reactors and fuel-cycle activities, industrial/research uses, nuclear weapons testing, and accidents or improper handling of radioactive materials.","hi":"चिकित्सीय इमेजिंग/परमाणु चिकित्सा, परमाणु रिएक्टरों और ईंधन-चक्र गतिविधियाँ, औद्योगिक/अनुसंधान उपयोग, परमाणु हथियार परीक्षण और रेडियोधर्मी सामग्री की दुर्घटनाएँ या अनुचित प्रबंधन।"},{"en":"Only cosmic rays from space.","hi":"केवल अंतरिक्ष से ब्रह्मांडीय किरणें।"},{"en":"Only decay of natural organic matter.","hi":"केवल प्राकृतिक कार्बनिक पदार्थ का क्षय।"},{"en":"Only volcanic eruptions.","hi":"केवल ज्वालामुखीय विस्फोट।"}],"exp":{"en":"Medical imaging and nuclear medicine, nuclear reactors and fuel-cycle activities, industrial/research uses, nuclear weapons testing, and accidents or improper handling of radioactive materials. Medical uses are a major human-made exposure source, while environmental contamination can also follow weapons testing, accidents or releases from nuclear/fuel-cycle activities.","hi":"चिकित्सीय इमेजिंग/परमाणु चिकित्सा, परमाणु रिएक्टरों और ईंधन-चक्र गतिविधियाँ, औद्योगिक/अनुसंधान उपयोग, परमाणु हथियार परीक्षण और रेडियोधर्मी सामग्री की दुर्घटनाएँ या अनुचित प्रबंधन। चिकित्सीय उपयोग प्रमुख मानव-निर्मित संपर्क स्रोत हैं, जबकि पर्यावरणीय संदूषण हथियार परीक्षण, दुर्घटनाएँ या परमाणु/ईंधन-चक्र से हुए उत्सर्जन से भी हो सकती है।"}},{"q":{"en":"What are major long-term health effects of significant ionising-radiation exposure?","hi":"महत्वपूर्ण आयनकारी-विकिरण संपर्क के प्रमुख दीर्घकालिक स्वास्थ्य प्रभाव क्या हैं?"},"a":{"en":"DNA damage, increased cancer risk, possible hereditary effects and reproductive or tissue damage depending on dose, dose rate, radiation type and organ exposed.","hi":"DNA क्षति, बढ़ा हुआ कैंसर जोखिम, संभावित आनुवंशिक प्रभाव और मात्रा, मात्रा दर, विकिरण प्रकार तथा उद्भासित अंग के अनुसार प्रजनन संबंधी/ऊतक क्षति।"},"o":[{"en":"DNA damage, increased cancer risk, possible hereditary effects and reproductive or tissue damage depending on dose, dose rate, radiation type and organ exposed.","hi":"DNA क्षति, बढ़ा हुआ कैंसर जोखिम, संभावित आनुवंशिक प्रभाव और मात्रा, मात्रा दर, विकिरण प्रकार तथा उद्भासित अंग के अनुसार प्रजनन संबंधी/ऊतक क्षति।"},{"en":"Asthma and eye irritation only.","hi":"केवल अस्थमा और आंखों में जलन।"},{"en":"Cholera and Dysentery.","hi":"हैजा और पेचिश।"},{"en":"High blood pressure and insomnia only.","hi":"केवल उच्च रक्तचाप और अनिद्रा।"}],"exp":{"en":"DNA damage, increased cancer risk, possible hereditary effects and reproductive or tissue damage depending on dose, dose rate, radiation type and organ exposed. Ionising radiation can break or chemically alter DNA. Cancer risk generally rises with dose, while very high exposures can also produce deterministic tissue injury.","hi":"DNA क्षति, बढ़ा हुआ कैंसर जोखिम, संभावित आनुवंशिक प्रभाव और मात्रा, मात्रा दर, विकिरण प्रकार तथा उद्भासित अंग के अनुसार प्रजनन संबंधी/ऊतक क्षति। आयनकारी विकिरण DNA को टूटना या रासायनिक रूप से बदलती कर सकती है। कैंसर जोखिम सामान्यतः मात्रा के साथ बढ़ता है, जबकि अत्यधिक उच्च संपर्क निश्चित ऊतक क्षति भी उत्पन्न कर सकता है।"}},{"q":{"en":"Why is Strontium-90 a major internal-radiation concern?","hi":"स्ट्रॉन्शियम-90 प्रमुख आंतरिक-विकिरण चिंता क्यों है?"},"a":{"en":"It behaves chemically like calcium, accumulates in bones and teeth, and can irradiate bone and bone marrow, increasing the risk of bone and marrow cancers.","hi":"यह रासायनिक रूप से कैल्शियम की तरह व्यवहार करता है, अस्थियों/दाँतों में संचित होता है और अस्थि तथा अस्थि मज्जा को विकिरणित करके अस्थि/मज्जा कैंसर का जोखिम बढ़ा सकता है।"},"o":[{"en":"It behaves chemically like calcium, accumulates in bones and teeth, and can irradiate bone and bone marrow, increasing the risk of bone and marrow cancers.","hi":"यह रासायनिक रूप से कैल्शियम की तरह व्यवहार करता है, अस्थियों/दाँतों में संचित होता है और अस्थि तथा अस्थि मज्जा को विकिरणित करके अस्थि/मज्जा कैंसर का जोखिम बढ़ा सकता है।"},{"en":"It concentrates mainly in the thyroid like iodine.","hi":"यह आयोडीन की तरह मुख्यतः थायरॉइड में संकेंद्रित होता है।"},{"en":"It is a non-radioactive gas.","hi":"यह गैर-रेडियोधर्मी गैस है।"},{"en":"It affects only the outer skin and cannot enter the body.","hi":"यह केवल बाहरी त्वचा प्रभावित करता है और निकाय में प्रवेश नहीं कर सकता।"}],"exp":{"en":"It behaves chemically like calcium, accumulates in bones and teeth, and can irradiate bone and bone marrow, increasing the risk of bone and marrow cancers. Because strontium mimics calcium, Sr-90 becomes incorporated into bone and can irradiate nearby bone marrow for long periods.","hi":"यह रासायनिक रूप से कैल्शियम की तरह व्यवहार करता है, अस्थियों/दाँतों में संचित होता है और अस्थि तथा अस्थि मज्जा को विकिरणित करके अस्थि/मज्जा कैंसर का जोखिम बढ़ा सकता है। स्ट्रॉन्शियम कैल्शियम को अनुकरण करता है, इसलिए Sr-90 अस्थि में समाहित होकर निकटवर्ती अस्थि मज्जा को लंबी अवधियों तक विकिरणित कर सकता है।"}},{"q":{"en":"Which organ is especially targeted by radioactive Iodine-131 after it enters the body?","hi":"निकाय में प्रवेश होने के बाद रेडियोधर्मी आयोडीन-131 विशेष रूप से किस अंग को लक्ष्य करता है?"},"a":{"en":"The thyroid gland.","hi":"थायरॉइड ग्रंथि।"},"o":[{"en":"The thyroid gland.","hi":"थायरॉइड ग्रंथि।"},{"en":"Red blood cells specifically.","hi":"विशेष रूप से लाल रक्त कोशिकाएँ।"},{"en":"Bones and teeth like strontium-90.","hi":"स्ट्रॉन्शियम-90 की तरह अस्थियों और दाँतों।"},{"en":"The lens of the eye only.","hi":"केवल आँख लेंस।"}],"exp":{"en":"The thyroid gland. The thyroid actively concentrates iodine for hormone synthesis, so radioactive iodine is preferentially taken up there; the old RBC-specific association is incorrect.","hi":"थायरॉइड ग्रंथि। थायरॉइड हार्मोन संश्लेषण के लिए आयोडीन सक्रिय रूप से संकेंद्रित करता है, इसलिए रेडियोधर्मी आयोडीन प्राथमिकता से वहीं ग्रहण किया होता है; पुराना RBC-विशिष्ट संबंध गलत है।"}},{"q":{"en":"What are common sources of municipal-type solid waste, and which wastes are regulated separately under India's current rules?","hi":"नगरपालिका-प्रकार ठोस अपशिष्ट के सामान्य स्रोत क्या हैं, और भारत के वर्तमान नियम में कौन-से अपशिष्ट अलग से विनियमित हैं?"},"a":{"en":"Households, commercial and institutional premises, markets and similar generators produce municipal-type solid waste; hazardous/industrial, biomedical, e-waste, battery and radioactive wastes are covered under separate regulatory regimes.","hi":"परिवारों, वाणिज्यिक/संस्थागत परिसरों, बाज़ार और समान जनरेटर नगरपालिका-प्रकार ठोस अपशिष्ट उत्पन्न करते हैं; खतरनाक/औद्योगिक, जैव-चिकित्सीय, ई-अपशिष्ट, बैटरी और रेडियोधर्मी अपशिष्ट अलग नियामक व्यवस्थाओं के अंतर्गत समाहित हैं।"},"o":[{"en":"Households, commercial and institutional premises, markets and similar generators produce municipal-type solid waste; hazardous/industrial, biomedical, e-waste, battery and radioactive wastes are covered under separate regulatory regimes.","hi":"परिवारों, वाणिज्यिक/संस्थागत परिसरों, बाज़ार और समान जनरेटर नगरपालिका-प्रकार ठोस अपशिष्ट उत्पन्न करते हैं; खतरनाक/औद्योगिक, जैव-चिकित्सीय, ई-अपशिष्ट, बैटरी और रेडियोधर्मी अपशिष्ट अलग नियामक व्यवस्थाओं के अंतर्गत समाहित हैं।"},{"en":"Only CFCs and halons are solid waste.","hi":"केवल CFCs और हैलोन ठोस अपशिष्ट हैं।"},{"en":"Only vehicle exhaust is solid waste.","hi":"केवल वाहन धुआँ ठोस अपशिष्ट है।"},{"en":"All radioactive reactor waste is ordinary municipal solid waste.","hi":"सभी रेडियोधर्मी रिएक्टर अपशिष्ट सामान्य नगरपालिका ठोस अपशिष्ट है।"}],"exp":{"en":"Households, commercial and institutional premises, markets and similar generators produce municipal-type solid waste; hazardous/industrial, biomedical, e-waste, battery and radioactive wastes are covered under separate regulatory regimes. India's Solid Waste Management Rules, 2026 came into force on 1 April 2026 and explicitly exclude industrial, hazardous, biomedical, e-waste, battery and radioactive waste because those streams are regulated separately.","hi":"परिवारों, वाणिज्यिक/संस्थागत परिसरों, बाज़ार और समान जनरेटर नगरपालिका-प्रकार ठोस अपशिष्ट उत्पन्न करते हैं; खतरनाक/औद्योगिक, जैव-चिकित्सीय, ई-अपशिष्ट, बैटरी और रेडियोधर्मी अपशिष्ट अलग नियामक व्यवस्थाओं के अंतर्गत समाहित हैं। भारत के ठोस अपशिष्ट प्रबंधन नियम, 2026 1 अप्रैल 2026 से प्रभावी हुए और औद्योगिक, खतरनाक, जैव-चिकित्सीय, ई-अपशिष्ट, बैटरी तथा रेडियोधर्मी अपशिष्ट को स्पष्ट रूप से बाहर करते हैं क्योंकि ये धाराएँ अलग से विनियमित हैं।"}},{"q":{"en":"What are appropriate methods in an integrated solid-waste-management system?","hi":"एकीकृत ठोस-अपशिष्ट-प्रबंधन प्रणाली में उपयुक्त विधियाँ कौन-से हैं?"},"a":{"en":"Source segregation, reuse/recycling and material recovery; composting or biomethanation for suitable biodegradable waste; controlled thermal treatment or waste-to-energy for suitable combustible fractions; and sanitary landfilling of residual/reject waste.","hi":"स्रोत पृथक्करण, पुन: उपयोग/पुनर्चक्रण और पदार्थ पुनर्प्राप्ति; उपयुक्त जैव-अवक्रमणीय अपशिष्ट के लिए कम्पोस्टिंग/जैव-मीथेनीकरण; उपयुक्त दहनशील अंशों के लिए नियंत्रित तापीय उपचार/अपशिष्ट-को-ऊर्जा; और अवशिष्ट/अस्वीकृत अपशिष्ट का स्वच्छ भूमि-भराव।"},"o":[{"en":"Source segregation, reuse/recycling and material recovery; composting or biomethanation for suitable biodegradable waste; controlled thermal treatment or waste-to-energy for suitable combustible fractions; and sanitary landfilling of residual/reject waste.","hi":"स्रोत पृथक्करण, पुन: उपयोग/पुनर्चक्रण और पदार्थ पुनर्प्राप्ति; उपयुक्त जैव-अवक्रमणीय अपशिष्ट के लिए कम्पोस्टिंग/जैव-मीथेनीकरण; उपयुक्त दहनशील अंशों के लिए नियंत्रित तापीय उपचार/अपशिष्ट-को-ऊर्जा; और अवशिष्ट/अस्वीकृत अपशिष्ट का स्वच्छ भूमि-भराव।"},{"en":"Open dumping into rivers and lakes.","hi":"नदियों/झीलें में खुला फेंकना।"},{"en":"Uncontrolled open burning of all waste.","hi":"सभी अपशिष्ट का अनियंत्रित खुला दहन।"},{"en":"Mixing hazardous and household wastes before disposal.","hi":"निपटान से पहले खतरनाक और घरेलू अपशिष्ट मिश्रण करना।"}],"exp":{"en":"Source segregation, reuse/recycling and material recovery; composting or biomethanation for suitable biodegradable waste; controlled thermal treatment or waste-to-energy for suitable combustible fractions; and sanitary landfilling of residual/reject waste. The waste hierarchy gives priority to prevention, reuse, recycling and recovery; sanitary landfill is mainly for residual material that cannot be usefully processed.","hi":"स्रोत पृथक्करण, पुन: उपयोग/पुनर्चक्रण और पदार्थ पुनर्प्राप्ति; उपयुक्त जैव-अवक्रमणीय अपशिष्ट के लिए कम्पोस्टिंग/जैव-मीथेनीकरण; उपयुक्त दहनशील अंशों के लिए नियंत्रित तापीय उपचार/अपशिष्ट-को-ऊर्जा; और अवशिष्ट/अस्वीकृत अपशिष्ट का स्वच्छ भूमि-भराव। अपशिष्ट प्रबंधन पदानुक्रम निवारण, पुन: उपयोग, पुनर्चक्रण और पुनर्प्राप्ति को प्राथमिकता देती है; स्वच्छ भूमि-भराव मुख्यतः उस अवशिष्ट पदार्थ के लिए है जिसे उपयोगी रूप से प्रक्रिया नहीं किया जा सकता।"}},{"q":{"en":"What is e-waste, and which Indian rules currently govern it?","hi":"ई-अपशिष्ट क्या है, और वर्तमान में कौन-से भारतीय नियम इसे विनियमित करते हैं?"},"a":{"en":"Discarded electrical and electronic equipment and their components; it is governed by the E-Waste (Management) Rules, 2022, effective from 1 April 2023, as amended.","hi":"त्यक्त विद्युत/इलेक्ट्रॉनिक उपकरण और उनके घटक; इसे ई-अपशिष्ट (प्रबंधन) नियम, 2022 विनियमित करते हैं, जो 1 अप्रैल 2023 से प्रभावी हैं, यथा संशोधित।"},"o":[{"en":"Discarded electrical and electronic equipment and their components; it is governed by the E-Waste (Management) Rules, 2022, effective from 1 April 2023, as amended.","hi":"त्यक्त विद्युत/इलेक्ट्रॉनिक उपकरण और उनके घटक; इसे ई-अपशिष्ट (प्रबंधन) नियम, 2022 विनियमित करते हैं, जो 1 अप्रैल 2023 से प्रभावी हैं, यथा संशोधित।"},{"en":"Only fallen leaves and dead trees.","hi":"केवल गिरी हुई पत्तियाँ और मृत वृक्ष।"},{"en":"Only hospital infectious waste.","hi":"केवल अस्पताल संक्रामक अपशिष्ट।"},{"en":"Only rocks and soil from mining.","hi":"केवल खनन के शैल और मृदा।"}],"exp":{"en":"Discarded electrical and electronic equipment and their components; it is governed by the E-Waste (Management) Rules, 2022, effective from 1 April 2023, as amended. India's E-Waste (Management) Rules, 2022 replaced the 2016 rules and introduced the current framework, including extended producer responsibility, from 1 April 2023.","hi":"त्यक्त विद्युत/इलेक्ट्रॉनिक उपकरण और उनके घटक; इसे ई-अपशिष्ट (प्रबंधन) नियम, 2022 विनियमित करते हैं, जो 1 अप्रैल 2023 से प्रभावी हैं, यथा संशोधित। भारत के ई-अपशिष्ट (प्रबंधन) नियम, 2022 ने 2016 नियम प्रतिस्थापित किए और 1 अप्रैल 2023 से विस्तारित उत्पादक उत्तरदायित्व सहित वर्तमान ढाँचा लागू किया।"}},{"q":{"en":"What is waste incineration?","hi":"अपशिष्ट भस्मीकरण क्या है?"},"a":{"en":"Controlled high-temperature combustion of suitable waste in an engineered facility, usually to reduce volume and sometimes recover energy; effective emission-control systems are essential.","hi":"अभियांत्रिक सुविधा में उपयुक्त अपशिष्ट का नियंत्रित उच्च-तापमान दहन, सामान्यतः खंड कम करने और कभी-कभी ऊर्जा पुनर्प्राप्त करने के लिए; प्रभावी उत्सर्जन-नियंत्रण प्रणालियाँ आवश्यक हैं।"},"o":[{"en":"Controlled high-temperature combustion of suitable waste in an engineered facility, usually to reduce volume and sometimes recover energy; effective emission-control systems are essential.","hi":"अभियांत्रिक सुविधा में उपयुक्त अपशिष्ट का नियंत्रित उच्च-तापमान दहन, सामान्यतः खंड कम करने और कभी-कभी ऊर्जा पुनर्प्राप्त करने के लिए; प्रभावी उत्सर्जन-नियंत्रण प्रणालियाँ आवश्यक हैं।"},{"en":"A machine that freezes nuclear waste.","hi":"परमाणु अपशिष्ट स्थिर करने वाली मशीन।"},{"en":"A worm used in vermicomposting.","hi":"वर्मी-कम्पोस्टिंग में प्रयुक्त केंचुआ।"},{"en":"An instrument for measuring air quality.","hi":"वायु गुणवत्ता माप करने का साधन।"}],"exp":{"en":"Controlled high-temperature combustion of suitable waste in an engineered facility, usually to reduce volume and sometimes recover energy; effective emission-control systems are essential. Incineration is not simple open burning: it is an engineered thermal process that needs combustion control, air-pollution-control equipment and safe management of ash/residues.","hi":"अभियांत्रिक सुविधा में उपयुक्त अपशिष्ट का नियंत्रित उच्च-तापमान दहन, सामान्यतः खंड कम करने और कभी-कभी ऊर्जा पुनर्प्राप्त करने के लिए; प्रभावी उत्सर्जन-नियंत्रण प्रणालियाँ आवश्यक हैं। भस्मीकरण सरल खुला दहन नहीं है; यह अभियांत्रिक तापीय प्रक्रिया है जिसमें दहन नियंत्रण, वायु-प्रदूषण-नियंत्रण उपकरण और राख/अवशेष का सुरक्षित प्रबंधन जरूरी है।"}}]},{"title":{"en":"8. Common Confusions & Reverse Questions","hi":"8। सामान्य भ्रम एवं उल्टे प्रश्न"},"questions":[{"q":{"en":"Are Ozone (O3) and Acid Rain primary pollutants?
