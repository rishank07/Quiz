function pathFromUrl(url){
 var s=String(url||"").split("#")[0].split("?")[0];
 s=dec(s).replace(/^https?:\/\/[^/]+/i,"").replace(/^\.?\//,"/");
 s=dec(cleanPath(s)).replace(/^\/\.\//,"/");
 return s
}
function rootForPath(path){
 var p=pathFromUrl(path);
 if(p.indexOf("/Original Practice/")===0)return"Original Practice";
 if(p.indexOf("/Current Affairs/")===0)return"Current Affairs";
 if(p.indexOf("/Crux-Tricks/")===0)return"Crux & Tricks";
 if(p.indexOf("/Books/Ghatnachakra Purvalokan/")===0)return"GhatnaChakra Purvalokan";
 if(p.indexOf("/Books/Lucent's Objective/")===0||p.indexOf("/Books/Lucent/")===0)return"Lucent's Objective";
 if(p.indexOf("/Books/Pinnacle GS/")===0)return"Pinnacle SSC/Railway GS";
 if(p.indexOf("/Books/BlackBook/")===0)return"Blackbook";
 if(p.indexOf("/Bihar Special/")===0)return"Bihar Special";
 return""
}
function navLabel(path){
 path=pathFromUrl(path);
 if(ROOT_PATHS[path])return ROOT_PATHS[path];
 var bits=path.split("/").filter(Boolean),file=bits.pop()||"",base=pretty(file);
 if(/^(?:index|SubjectName|ChapterName)$/i.test(base))base=pretty(bits.pop()||base);
 if(/Parts$/i.test(base)&&bits.length)base=pretty(bits[bits.length-1]);
 if(/^Mixed Practice$/i.test(base))return"Random Mixed Practice";
 return base||"Saved"
}
function compactTrail(parts){
 var out=[];
 (parts||[]).forEach(function(v){v=String(v||"").trim();if(!v)return;if(!out.length||out[out.length-1]!==v)out.push(v)});
 return out
}
function trailFromPath(path){
 var map=window.EFP_BACK_PARENT_MAP||{},cur=pathFromUrl(path),chain=[],seen={},guard=0;
 while(cur&&cur!=="/index.html"&&!seen[cur]&&guard++<24){
  seen[cur]=1;
  var label=navLabel(cur);if(label)chain.unshift(label);
  var parent=map[cur];if(!parent)break;cur=pathFromUrl(parent)
 }
 chain=compactTrail(chain);
 var root=rootForPath(path),idx=root?chain.indexOf(root):-1;
 if(root&&idx>0)chain=chain.slice(idx);
 else if(root&&idx<0)chain.unshift(root);
 return compactTrail(chain)
}
function currentAffairsLeaf(file,fallback){
 var raw=dec(String(file||"")).replace(/\.html?$/i,"").replace(/_Current_Affairs_Rapid_Practice$/i,"").replace(/_Rapid_Practice$/i,""),key=raw.toUpperCase().replace(/[^A-Z0-9]/g,""),m;
 m=/^(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER)(20\d{2})$/.exec(key);
 if(m)return m[1].charAt(0)+m[1].slice(1).toLowerCase()+" "+m[2];
 var labels={
  "SUMMITS2026":"Summits","APPOINTMENT2026":"Appointment","BILLSANDACT2026":"Bills & Act","SPORTS2026":"Sports",
  "ENVIRONMENT2026":"Environment","DRDOANDDEFENCE2026":"DRDO & Defence","INDEX2026PROPERBILINGUAL":"Index",
  "AWARDS2026PROPERBILINGUAL":"Awards","FIRSTININDIA2026PROPERBILINGUAL":"First In India","EXERCISES2026PROPERBILINGUAL":"Exercises",
  "BUDGET202627":"Budget","ECONOMICSURVEY2026":"Economic Survey","FILMSAWARDS2026":"Film Awards","CENTRALSCHEMES2026":"Central Scheme",
  "DAYSANDTHEME2026":"Days & Theme","COMMONWEALTHGAMES2026":"Commonwealth Games","BOOKS2026PROPERBILINGUAL":"Books & Authors",
  "SCIENCETECH2026":"Sci And Tech","MOU2026":"MoU","STATESCHEME2026":"State Scheme","GITAG2026PROPERBILINGUAL":"GI Tag",
  "INDEPENDENCEDAY2026":"Independence Day","CENSUS2027":"Census","BRICS2026":"BRICS"
 };
 return labels[key]||fallback||pretty(raw)
}
function currentAffairsTrail(path,title){
 var p=pathFromUrl(path),trail=["Current Affairs"],m;
 m=/^\/Current Affairs\/Topic Names\/Rapid Practice\/(20\d{2})\/(Month Wise|Topic Wise)\/([^/]+)$/i.exec(p);
 if(m)return compactTrail(trail.concat(["Rapid Practice",m[1],pretty(m[2]),currentAffairsLeaf(m[3],title)]));
 m=/^\/Current Affairs\/Topic Names\/(20\d{2})\/(Month Wise|Topic Wise)\/([^/]+)$/i.exec(p);
 if(m)return compactTrail(trail.concat([m[1],pretty(m[2]),currentAffairsLeaf(m[3],title)]));
 m=/^\/Current Affairs\/Topic Names\/([^/]+)$/i.exec(p);
 if(m&& !/^Rapid Practice\.html$/i.test(m[1]))return compactTrail(trail.concat([currentAffairsLeaf(m[1],title)]));
 return trail
}
function blackbookTrail(path,title){
 var p=pathFromUrl(path),file=dec(p.split("/").pop()||"");
 var map={
  "All one Word.html":["Part A: One Word Substitutions","A1. All One Word Substitutions"],
  "Idioms and Phrases.html":["Part B: Idioms / Phrases","B1. All Idioms / Phrases"],
  "Syno & Anto.html":["Part C: Synonyms / Antonyms","C1. Synonyms + Antonyms"],
  "All Spelling.html":["Part E: Spelling","E1. All Spelling Questions"],
  "Spelling Correction Quiz.html":["Part F: Practice MCQ Quizzes","F1. Spelling Correction Practice Quiz"],
  "Synonyms and Antonyms Quiz.html":["Part F: Practice MCQ Quizzes","F2. Synonyms & Antonyms Practice Quiz"],
  "Idioms and Phrases Quiz.html":["Part F: Practice MCQ Quizzes","F3. Idioms & Phrases Practice Quiz"],
  "One Word Substitutions Quiz.html":["Part F: Practice MCQ Quizzes","F4. One Word Substitutions Practice Quiz"]
 };
 return compactTrail(["Blackbook"].concat(map[file]||[title||pretty(file)]))
}
function hierarchyForItem(x){
 var trail=[],p=pathFromUrl(x.url);
 if(x.store==="mixed")trail=["Original Practice","Random Mixed Practice",x.poolLabel||"",x.source&&x.source!==x.poolLabel?x.source:"",x.chapter||"",x.sectionName||""];
 else if(x.group==="Original Practice")trail=["Original Practice",x.subject||"",x.chapter||x.title||"",x.section?"Section "+x.section:""];
 else if(x.group==="Crux & Tricks")trail=x.breadcrumb?x.breadcrumb.split(" / ").concat([x.title||""]):["Crux & Tricks",x.source||"",x.subject||"",x.branch||"",x.title||""];
 else if(x.store==="rapid"||x.group==="Current Affairs · Rapid Practice"){trail=currentAffairsTrail(x.url,x.title);if(x.section)trail.push("Section "+x.section)}
 else if(p.indexOf("/Current Affairs/")===0)trail=currentAffairsTrail(x.url,x.title);
 else if(p.indexOf("/Books/BlackBook/Files/")===0)trail=blackbookTrail(x.url,x.title);
 else trail=trailFromPath(x.url);
 if(!trail.length){
  var root=rootForPath(x.url);
  if(!root){
   if(/^Blackbook/.test(x.group))root="Blackbook";
   else if(x.group==="Bihar Special")root="Bihar Special";
   else if(x.group==="Current Affairs")root="Current Affairs";
   else root=x.group||"Other Bookmarks"
  }
  trail=[root,x.title||""]
 }
 return compactTrail(trail)
}
function prepare(items){items.forEach(function(x){x.hierarchy=hierarchyForItem(x)});return items}
function startsWithTrail(x,trail){if(!x.hierarchy||x.hierarchy.length<trail.length)return false;for(var i=0;i<trail.length;i++)if(x.hierarchy[i]!==trail[i])return false;return true}
function natural(a,b){try{return a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"})}catch(e){return a.localeCompare(b)}}
function stats(items){var p=0,c=0;items.forEach(function(x){if(x.page)p++;else if(x.kind==="Favourite Chapter")c++});document.getElementById("total").textContent=items.length;document.getElementById("questions").textContent=Math.max(0,items.length-p-c);document.getElementById("pages").textContent=p;document.getElementById("chapters").textContent=c;document.getElementById("topCount").textContent=items.length}
function folderCard(name,count,rootMode){
 var b=document.createElement("button");b.type="button";b.className="folder-card"+(count?"":" zero");b.disabled=!count;
 b.innerHTML="<span class=\"folder-icon\">📁</span><span class=\"folder-copy\"><span class=\"folder-name\">"+esc(name)+"</span><span class=\"folder-note\">"+(count?esc(count+" saved bookmark"+(count===1?"":"s")):"No bookmarks saved")+"</span></span><span class=\"folder-count\">"+count+"</span><span class=\"folder-arrow\">›</span>";
 if(count)b.addEventListener("click",function(){openBookmarkTrail(rootMode?[name]:currentTrail.concat([name]))});
 return b
}
function renderBreadcrumb(searching){
 breadcrumb.innerHTML="";
 function add(label,depth,last){
  if(breadcrumb.childNodes.length){var sep=document.createElement("span");sep.className="crumb-sep";sep.textContent="›";breadcrumb.appendChild(sep)}
  var c=document.createElement("button");c.type="button";c.className="crumb"+(last?" current":"");c.textContent=label;if(last)c.disabled=true;else c.addEventListener("click",function(){
   var delta=currentTrail.length-depth;
   search.value="";
   if(delta>0&&isBookmarkState(history.state)){try{history.go(-delta);return}catch(e){}}
   currentTrail=currentTrail.slice(0,depth);syncBookmarkHistory("push");render()
  });breadcrumb.appendChild(c)
 }
 add("All Bookmarks",0,!currentTrail.length&&!searching);
 currentTrail.forEach(function(name,i){add(name,i+1,!searching&&i===currentTrail.length-1)});
 if(searching)add("Search Results",currentTrail.length,true)
}
function itemCard(x,showTrail){
 var c=document.createElement("article");c.className="card";
 var trail=showTrail&&x.hierarchy&&x.hierarchy.length?"<div class=\"trail\">"+esc(x.hierarchy.join(" › "))+"</div>":"";
 var url=x.group==="Crux & Tricks"?x.url+"&bookmarkTrail="+encodeURIComponent(JSON.stringify(currentTrail)):x.url;
 c.innerHTML="<span class=\"kind\">"+esc(x.kind)+"</span>"+trail+"<div class=\"title\">"+esc(x.title)+"</div><div class=\"meta\">"+esc(x.meta)+"</div><div class=\"actions\"><a class=\"open\" href=\""+esc(url)+"\">Open →</a><button class=\"remove\" type=\"button\">Remove</button></div>";
 c.querySelector(".remove").addEventListener("click",function(){removeItem(x)});
 return c
}
function renderSearch(items,q){
 renderBreadcrumb(true);
 var shown=items.filter(function(x){return [x.kind,x.title,x.meta].concat(x.hierarchy||[]).join(" ").toLowerCase().indexOf(q)>=0});
 if(!shown.length){var e=document.createElement("div");e.className="empty";e.innerHTML="<b>No matching bookmark.</b><span>Try another search.</span>";content.appendChild(e);return}
 var s=document.createElement("section");s.className="leaf-section";var h=document.createElement("div");h.className="leaf-head";h.innerHTML="<h2>Search Results</h2><span class=\"pill\">"+shown.length+" found</span>";s.appendChild(h);
 var l=document.createElement("div");l.className="list";shown.sort(function(a,b){return natural((a.hierarchy||[]).join("/")+"/"+a.title,(b.hierarchy||[]).join("/")+"/"+b.title)}).forEach(function(x){l.appendChild(itemCard(x,true))});s.appendChild(l);content.appendChild(s)
}
function renderFolders(items){
 renderBreadcrumb(false);
 var scoped=items.filter(function(x){return startsWithTrail(x,currentTrail)}),folders={},leaf=[];
 scoped.forEach(function(x){if(x.hierarchy.length>currentTrail.length){var next=x.hierarchy[currentTrail.length];folders[next]=(folders[next]||0)+1}else leaf.push(x)});
 var names;
 if(!currentTrail.length){
  names=HOME_ROOTS.slice();
  Object.keys(folders).sort(natural).forEach(function(n){if(names.indexOf(n)<0)names.push(n)})
 }else names=Object.keys(folders).sort(natural);
 if(names.length){
  var sec=document.createElement("section");sec.className="folder-section";var head=document.createElement("div");head.className="folder-head";head.innerHTML="<h2>"+(currentTrail.length?"Folders":"Homepage Sections")+"</h2><small>Count includes everything inside</small>";sec.appendChild(head);
  var grid=document.createElement("div");grid.className="folder-grid";names.forEach(function(name){grid.appendChild(folderCard(name,folders[name]||0,!currentTrail.length))});sec.appendChild(grid);content.appendChild(sec)
 }
 if(leaf.length){
  var ls=document.createElement("section");ls.className="leaf-section";var lh=document.createElement("div");lh.className="leaf-head";lh.innerHTML="<h2>Saved Items</h2><span class=\"pill\">"+leaf.length+" saved</span>";ls.appendChild(lh);
  var list=document.createElement("div");list.className="list";leaf.sort(function(a,b){return natural(a.title+" "+a.meta,b.title+" "+b.meta)}).forEach(function(x){list.appendChild(itemCard(x,false))});ls.appendChild(list);content.appendChild(ls)
 }
 if(!scoped.length&&currentTrail.length){var e=document.createElement("div");e.className="empty";e.innerHTML="<b>No bookmarks in this folder.</b><span>Save something from this section and it will appear here.</span>";content.appendChild(e)}
 if(!items.length&&!currentTrail.length){var note=document.createElement("div");note.className="empty";note.innerHTML="<b>No bookmarks yet.</b><span>The folders above mirror bookmark-capable homepage sections. Save anything while studying and its count will update here.</span>";content.appendChild(note)}
}
function render(){
 var items=prepare(allItems()),q=search.value.trim().toLowerCase();stats(items);content.innerHTML="";
 if(!q){
  var depth=currentTrail.length;
  while(currentTrail.length&&!items.some(function(x){return startsWithTrail(x,currentTrail)}))currentTrail.pop();
  if(depth!==currentTrail.length)syncBookmarkHistory("replace")
 }
 hierNav.classList.toggle("show",currentTrail.length>0);
 hierDepth.textContent=currentTrail.length?("Level "+currentTrail.length+" · "+currentTrail[currentTrail.length-1]):"";
 if(q)renderSearch(items,q);else renderFolders(items)
}
bookmarkBack.addEventListener("click",function(){goBackInsideBookmarks()});
window.addEventListener("popstate",function(event){
 if(!isBookmarkState(event.state))return;
 currentTrail=event.state.efpAllBookmarksTrail.slice();search.value="";render();window.scrollTo({top:0,behavior:"auto"})
});
search.addEventListener("input",render);
window.addEventListener("pageshow",function(event){
 if(event.persisted&&isBookmarkState(history.state)){currentTrail=history.state.efpAllBookmarksTrail.slice()}
 render()
});
window.addEventListener("storage",render);
if(isBookmarkState(history.state))currentTrail=history.state.efpAllBookmarksTrail.slice();else{
 var folder=safe(new URLSearchParams(location.search).get("folder"),[]);
 if(!Array.isArray(folder)||folder.length>12||folder.some(function(v){return typeof v!=="string"||v.length>160}))folder=[];
 syncBookmarkHistory("replace");
 var savedItems=prepare(allItems());
 folder.forEach(function(name){var next=currentTrail.concat([name]);if(savedItems.some(function(x){return startsWithTrail(x,next)})){currentTrail=next;syncBookmarkHistory("push")}})
}
render()
})();
</script>
